name: Deploy to GitHub Pages

# 推送到 main 時，自動在雲端產生資料並發佈「web/」資料夾（不含任何照片）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: pip install pyyaml
      - name: 產生複習資料（web/data.js、exports）
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - name: 上傳網站（只含 web/）
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
