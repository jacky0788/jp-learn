title: わたしの町（我的城鎮・比較）
level: N4
order: 40
intro: |
  用比較句型「より／のほうが／一番／ほど〜ない」描述自己住的地方。
body:
  - {jp: "わたしは、小さい町に住んでいます。", kana: "わたしは、ちいさい まちに すんで います。", zh: "我住在一個小鎮。"}
  - {jp: "この町は、東京ほど大きくありません。", kana: "この まちは、とうきょうほど おおきく ありません。", zh: "這個鎮沒有東京那麼大。"}
  - {jp: "でも、東京より静かで、空気がきれいです。", kana: "でも、とうきょうより しずかで、くうきが きれいです。", zh: "但是比東京安靜，空氣也乾淨。"}
  - {jp: "町には、大きい公園があります。", kana: "まちには、おおきい こうえんが あります。", zh: "鎮上有個大公園。"}
  - {jp: "公園は、駅から歩いて十分ぐらいです。", kana: "こうえんは、えきから あるいて じゅっぷんぐらいです。", zh: "公園離車站走路大約十分鐘。"}
  - {jp: "朝、その公園で運動する人が多いです。", kana: "あさ、その こうえんで うんどうする ひとが おおいです。", zh: "早上在那個公園運動的人很多。"}
  - {jp: "町でいちばん高い建物は、駅前のホテルです。", kana: "まちで いちばん たかい たてものは、えきまえの ほてるです。", zh: "鎮上最高的建築是車站前的飯店。"}
  - {jp: "買い物には、駅の近くのスーパーが便利です。", kana: "かいものには、えきの ちかくの すーぱーが べんりです。", zh: "買東西的話，車站附近的超市很方便。"}
  - {jp: "都会のほうが店は多いですが、この町のほうが住みやすいです。", kana: "とかいのほうが みせは おおいですが、この まちのほうが すみやすいです。", zh: "都市的店比較多，但這個鎮比較好住。"}
  - {jp: "人も親切で、毎日の生活が楽しいです。", kana: "ひとも しんせつで、まいにちの せいかつが たのしいです。", zh: "人也很親切，每天的生活很愉快。"}
  - {jp: "春になると、公園の桜がとてもきれいです。", kana: "はるに なると、こうえんの さくらが とても きれいです。", zh: "一到春天，公園的櫻花非常漂亮。"}
  - {jp: "桜を見に、ほかの町からも人が来ます。", kana: "さくらを みに、ほかの まちからも ひとが きます。", zh: "為了賞櫻，連其他城鎮的人也會來。"}
  - {jp: "わたしは、この町が大好きです。", kana: "わたしは、この まちが だいすきです。", zh: "我非常喜歡這個小鎮。"}
  - {jp: "ずっとここに住みたいと思っています。", kana: "ずっと ここに すみたいと おもって います。", zh: "我想一直住在這裡。"}
