title: "国際スポーツ大会の感動（國際運動賽事的感動・新聞長文）"
level: "N4（長文）"
order: 330
intro: |
  這是一篇關於「國際運動賽事」的長篇朗讀文章。
  主題是奧運或世界盃這類國際大會，世界各地的選手齊聚一堂，加油的樂趣、選手的努力與淚水，以及運動帶給人們的勇氣。
  以 N4 為主的語彙和です・ます體，練習「～と思います」「～てくれる」「～ようになる」「～かもしれません」等文法。
body:
  - {jp: "みなさんは、国際スポーツ大会が好きですか。", kana: "みなさんは、こくさい スポーツ たいかいが すきですか。", zh: "大家喜歡國際運動賽事嗎。"}
  - {jp: "数年に一度、世界中の選手が集まる大きな大会があります。", kana: "すうねんに いちど、せかいじゅうの せんしゅが あつまる おおきな たいかいが あります。", zh: "每隔幾年，會有一場世界各地選手齊聚的大型賽事。"}
  - {jp: "オリンピックや、サッカーのワールドカップが有名です。", kana: "オリンピックや、サッカーの ワールドカップが ゆうめいです。", zh: "奧運和足球世界盃都很有名。"}
  - {jp: "近年、こういう大会はますます大きくなっています。", kana: "きんねん、こういう たいかいは ますます おおきく なっています。", zh: "近年來，這類賽事變得越來越盛大。"}
  - {jp: "テレビやインターネットで、世界中の人が見ます。", kana: "テレビや インターネットで、せかいじゅうの ひとが みます。", zh: "全世界的人都會透過電視或網路觀看。"}
  - {jp: "今日は、この国際スポーツ大会について話したいと思います。", kana: "きょうは、この こくさい スポーツ たいかいに ついて はなしたいと おもいます。", zh: "今天，我想來聊聊這個國際運動賽事。"}
  - {jp: "まず、大会の楽しさについて考えてみましょう。", kana: "まず、たいかいの たのしさに ついて かんがえて みましょう。", zh: "首先，讓我們想想賽事的樂趣。"}
  - {jp: "大会が始まると、町の雰囲気が変わります。", kana: "たいかいが はじまると、まちの ふんいきが かわります。", zh: "賽事一開始，城鎮的氣氛就會改變。"}
  - {jp: "多くの人が、テレビの前に集まります。", kana: "おおくの ひとが、テレビの まえに あつまります。", zh: "許多人會聚集在電視機前。"}
  - {jp: "家族で見る人もいます。", kana: "かぞくで みる ひとも います。", zh: "也有人會和家人一起看。"}
  - {jp: "友だちと、店に集まって見る人もいます。", kana: "ともだちと、みせに あつまって みる ひとも います。", zh: "也有人會和朋友聚在店裡看。"}
  - {jp: "自分の国の選手が出ると、自然に応援したくなります。", kana: "じぶんの くにの せんしゅが でると、しぜんに おうえん したく なります。", zh: "自己國家的選手出場時，自然就會想為他加油。"}
  - {jp: "「がんばれ」と、大きな声で言います。", kana: "「がんばれ」と、おおきな こえで いいます。", zh: "會大聲喊「加油」。"}
  - {jp: "選手が点を取ると、みんなで喜びます。", kana: "せんしゅが てんを とると、みんなで よろこびます。", zh: "選手得分時，大家會一起歡呼。"}
  - {jp: "知らない人とも、ハイタッチをすることがあります。", kana: "しらない ひととも、ハイタッチを する ことが あります。", zh: "有時甚至會和不認識的人擊掌。"}
  - {jp: "この一体感が、とても楽しいです。", kana: "この いったいかんが、とても たのしいです。", zh: "這種一體感非常令人愉快。"}
  - {jp: "ふだんスポーツを見ない人も、この時だけは見ます。", kana: "ふだん スポーツを みない ひとも、この ときだけは みます。", zh: "平常不看運動的人，也只有這個時候會看。"}
  - {jp: "それくらい、大会には大きな力があります。", kana: "それくらい、たいかいには おおきな ちからが あります。", zh: "可見賽事就是有這麼大的力量。"}
  - {jp: "次に、選手の努力について話します。", kana: "つぎに、せんしゅの どりょくに ついて はなします。", zh: "接下來，我想談談選手的努力。"}
  - {jp: "私たちは、選手の活躍だけを見ます。", kana: "わたしたちは、せんしゅの かつやくだけを みます。", zh: "我們只看到選手活躍的樣子。"}
  - {jp: "でも、その後ろには長い練習があります。", kana: "でも、その うしろには ながい れんしゅうが あります。", zh: "但是，那背後有著漫長的練習。"}
  - {jp: "選手は、毎日たくさん練習します。", kana: "せんしゅは、まいにち たくさん れんしゅう します。", zh: "選手每天都會大量練習。"}
  - {jp: "朝早く起きて、体を動かします。", kana: "あさ はやく おきて、からだを うごかします。", zh: "一大早起床，活動身體。"}
  - {jp: "暑い日も、寒い日も、休みません。", kana: "あつい ひも、さむい ひも、やすみません。", zh: "不管是炎熱的日子還是寒冷的日子，都不休息。"}
  - {jp: "けがをすることも、あるかもしれません。", kana: "けがを する ことも、あるかも しれません。", zh: "也許還會受傷。"}
  - {jp: "それでも、選手はあきらめません。", kana: "それでも、せんしゅは あきらめません。", zh: "即使如此，選手也不放棄。"}
  - {jp: "この日のために、何年も準備してきました。", kana: "この ひの ために、なんねんも じゅんび して きました。", zh: "為了這一天，他們準備了好多年。"}
  - {jp: "家族や友だちと過ごす時間も、減ったでしょう。", kana: "かぞくや ともだちと すごす じかんも、へったでしょう。", zh: "和家人朋友相處的時間，應該也減少了吧。"}
  - {jp: "好きな食べ物も、がまんしたかもしれません。", kana: "すきな たべものも、がまん したかも しれません。", zh: "或許連喜歡的食物也忍著不吃。"}
  - {jp: "そういう努力があって、今の選手がいます。", kana: "そういう どりょくが あって、いまの せんしゅが います。", zh: "正因為有那些努力，才有現在的選手。"}
  - {jp: "それを知ると、もっと応援したくなります。", kana: "それを しると、もっと おうえん したく なります。", zh: "知道這些以後，就更想為他們加油了。"}
  - {jp: "勝った選手は、本当にうれしそうです。", kana: "かった せんしゅは、ほんとうに うれしそうです。", zh: "獲勝的選手看起來真的很開心。"}
  - {jp: "うれしくて、涙を流す選手もいます。", kana: "うれしくて、なみだを ながす せんしゅも います。", zh: "也有選手因為太高興而流淚。"}
  - {jp: "その涙を見ると、私たちも胸が熱くなります。", kana: "その なみだを みると、わたしたちも むねが あつく なります。", zh: "看到那滴淚，我們的心也熱了起來。"}
  - {jp: "でも、勝つ人がいれば、負ける人もいます。", kana: "でも、かつ ひとが いれば、まける ひとも います。", zh: "但是，有人贏，就有人輸。"}
  - {jp: "負けた選手も、涙を流します。", kana: "まけた せんしゅも、なみだを ながします。", zh: "輸了的選手也會流淚。"}
  - {jp: "その涙には、くやしい気持ちがあります。", kana: "その なみだには、くやしい きもちが あります。", zh: "那滴淚裡，有著不甘心的心情。"}
  - {jp: "一生けんめいがんばったから、くやしいのです。", kana: "いっしょうけんめい がんばったから、くやしいのです。", zh: "正因為拚命努力過，所以才不甘心。"}
  - {jp: "私は、負けた選手も立派だと思います。", kana: "わたしは、まけた せんしゅも りっぱだと おもいます。", zh: "我覺得輸了的選手也很了不起。"}
  - {jp: "負けても、最後までがんばる姿は美しいです。", kana: "まけても、さいごまで がんばる すがたは うつくしいです。", zh: "即使輸了，努力到最後的身影也很美。"}
  - {jp: "勝ち負けだけが、大切ではありません。", kana: "かちまけだけが、たいせつでは ありません。", zh: "並不是只有勝負才重要。"}
  - {jp: "次に、国を越えたつながりについて話します。", kana: "つぎに、くにを こえた つながりに ついて はなします。", zh: "接下來，我想談談跨越國界的連結。"}
  - {jp: "この大会には、世界中から選手が集まります。", kana: "この たいかいには、せかいじゅうから せんしゅが あつまります。", zh: "這個賽事，集合了來自世界各地的選手。"}
  - {jp: "言葉も、文化も、みんなちがいます。", kana: "ことばも、ぶんかも、みんな ちがいます。", zh: "語言、文化，每個人都不一樣。"}
  - {jp: "肌の色も、宗教もちがいます。", kana: "はだの いろも、しゅうきょうも ちがいます。", zh: "膚色、宗教也不同。"}
  - {jp: "でも、同じルールで戦います。", kana: "でも、おなじ ルールで たたかいます。", zh: "但是，他們依照同樣的規則競賽。"}
  - {jp: "試合が終わると、選手は手をつなぎます。", kana: "しあいが おわると、せんしゅは てを つなぎます。", zh: "比賽結束後，選手會牽起手。"}
  - {jp: "勝った人も、負けた人も、おたがいをたたえます。", kana: "かった ひとも、まけた ひとも、おたがいを たたえます。", zh: "贏的人和輸的人，都互相讚揚對方。"}
  - {jp: "「いい試合でしたね」と、笑って話します。", kana: "「いい しあいでしたね」と、わらって はなします。", zh: "笑著說「真是場好比賽呢」。"}
  - {jp: "ちがう国の選手が、友だちになることもあります。", kana: "ちがう くにの せんしゅが、ともだちに なる ことも あります。", zh: "不同國家的選手，也會成為朋友。"}
  - {jp: "ユニフォームを、交換することもあります。", kana: "ユニフォームを、こうかん する ことも あります。", zh: "有時還會交換球衣。"}
  - {jp: "見ている私たちも、ほかの国を好きになります。", kana: "みている わたしたちも、ほかの くにを すきに なります。", zh: "正在觀看的我們，也會喜歡上其他國家。"}
  - {jp: "その国の文化を、知りたくなります。", kana: "その くにの ぶんかを、しりたく なります。", zh: "會想了解那個國家的文化。"}
  - {jp: "「あの国に行ってみたい」と思う人もいます。", kana: "「あの くにに いって みたい」と おもう ひとも います。", zh: "也有人會想「真想去那個國家看看」。"}
  - {jp: "スポーツには、人と人をつなぐ力があります。", kana: "スポーツには、ひとと ひとを つなぐ ちからが あります。", zh: "運動有著連結人與人的力量。"}
  - {jp: "ふだん仲が悪い国でも、この時は一緒に楽しみます。", kana: "ふだん なかが わるい くにでも、この ときは いっしょに たのしみます。", zh: "就算平常關係不好的國家，這時也會一起享受其中。"}
  - {jp: "これは、本当にすばらしいことだと思います。", kana: "これは、ほんとうに すばらしい ことだと おもいます。", zh: "我覺得這真的是很美好的事。"}
  - {jp: "世界が一つになったような気持ちになります。", kana: "せかいが ひとつに なったような きもちに なります。", zh: "會有一種世界合而為一的感覺。"}
  - {jp: "次に、勇気をもらう話をします。", kana: "つぎに、ゆうきを もらう はなしを します。", zh: "接下來，我要談談獲得勇氣這件事。"}
  - {jp: "選手の姿は、私たちに勇気をくれます。", kana: "せんしゅの すがたは、わたしたちに ゆうきを くれます。", zh: "選手的身影，會帶給我們勇氣。"}
  - {jp: "最後まであきらめない姿を見ると、元気が出ます。", kana: "さいごまで あきらめない すがたを みると、げんきが でます。", zh: "看到不放棄到最後的身影，就會湧出活力。"}
  - {jp: "「自分もがんばろう」と思います。", kana: "「じぶんも がんばろう」と おもいます。", zh: "會想「我也要加油」。"}
  - {jp: "体の小さい選手が、大きな選手に勝つこともあります。", kana: "からだの ちいさい せんしゅが、おおきな せんしゅに かつ ことも あります。", zh: "身材矮小的選手，有時也能戰勝高大的選手。"}
  - {jp: "それを見ると、希望がわいてきます。", kana: "それを みると、きぼうが わいて きます。", zh: "看到這個，就會湧出希望。"}
  - {jp: "「むずかしくても、できるかもしれない」と思います。", kana: "「むずかしくても、できるかも しれない」と おもいます。", zh: "會想「就算很難，或許也能做到」。"}
  - {jp: "病気やけがから戻ってきた選手もいます。", kana: "びょうきや けがから もどって きた せんしゅも います。", zh: "也有從疾病或受傷中重新站起來的選手。"}
  - {jp: "つらい時を乗り越えて、また戦います。", kana: "つらい ときを のりこえて、また たたかいます。", zh: "克服了痛苦的時期，再次上場競賽。"}
  - {jp: "その物語は、多くの人の心を動かします。", kana: "その ものがたりは、おおくの ひとの こころを うごかします。", zh: "那樣的故事，打動了許多人的心。"}
  - {jp: "「自分も、もう一度がんばってみよう」と思う人もいます。", kana: "「じぶんも、もう いちど がんばって みよう」と おもう ひとも います。", zh: "也有人會想「我也要再努力一次看看」。"}
  - {jp: "若い人だけでなく、お年寄りも勇気をもらいます。", kana: "わかい ひとだけでなく、おとしよりも ゆうきを もらいます。", zh: "不只是年輕人，連長者也會獲得勇氣。"}
  - {jp: "子どもは、選手を見てあこがれます。", kana: "こどもは、せんしゅを みて あこがれます。", zh: "孩子們看了選手，會心生嚮往。"}
  - {jp: "「あの選手のようになりたい」と思います。", kana: "「あの せんしゅの ように なりたい」と おもいます。", zh: "會想「我想變得像那位選手一樣」。"}
  - {jp: "そして、スポーツを始める子どもが増えます。", kana: "そして、スポーツを はじめる こどもが ふえます。", zh: "於是，開始運動的孩子變多了。"}
  - {jp: "夢を持つことは、とても大切です。", kana: "ゆめを もつ ことは、とても たいせつです。", zh: "懷抱夢想是非常重要的。"}
  - {jp: "大会は、子どもたちに夢を見せてくれます。", kana: "たいかいは、こどもたちに ゆめを みせて くれます。", zh: "賽事讓孩子們看見夢想。"}
  - {jp: "次に、私自身の気持ちについて話します。", kana: "つぎに、わたし じしんの きもちに ついて はなします。", zh: "接下來，我想談談自己的心情。"}
  - {jp: "大会を見ていると、私も体を動かしたくなります。", kana: "たいかいを みていると、わたしも からだを うごかしたく なります。", zh: "看著賽事，我也會想動動身體。"}
  - {jp: "選手のように、走ってみたくなります。", kana: "せんしゅの ように、はしって みたく なります。", zh: "會想像選手一樣跑跑看。"}
  - {jp: "私はスポーツが上手ではありません。", kana: "わたしは スポーツが じょうずでは ありません。", zh: "我運動並不擅長。"}
  - {jp: "でも、見ているうちに気持ちが変わります。", kana: "でも、みている うちに きもちが かわります。", zh: "但是，看著看著，心情就變了。"}
  - {jp: "「私も少し運動しよう」と思います。", kana: "「わたしも すこし うんどう しよう」と おもいます。", zh: "會想「我也來稍微運動一下吧」。"}
  - {jp: "次の日、近くの公園を散歩しました。", kana: "つぎの ひ、ちかくの こうえんを さんぽ しました。", zh: "隔天，我去附近的公園散步了。"}
  - {jp: "少し走ってみると、気持ちがよかったです。", kana: "すこし はしって みると、きもちが よかったです。", zh: "稍微跑了一下，感覺很舒服。"}
  - {jp: "体を動かすと、心も元気になります。", kana: "からだを うごかすと、こころも げんきに なります。", zh: "活動身體，心情也會變得有精神。"}
  - {jp: "汗をかくと、気分がすっきりします。", kana: "あせを かくと、きぶんが すっきり します。", zh: "流了汗，心情就會變得清爽。"}
  - {jp: "それから、私は時々運動するようになりました。", kana: "それから、わたしは ときどき うんどう する ように なりました。", zh: "從那之後，我變得會偶爾運動了。"}
  - {jp: "毎日少しずつ歩くようにしています。", kana: "まいにち すこしずつ あるく ように しています。", zh: "我盡量每天稍微走一走。"}
  - {jp: "前より、体が軽くなった気がします。", kana: "まえより、からだが かるく なった きが します。", zh: "感覺身體比以前輕盈了。"}
  - {jp: "よく眠れるようにもなりました。", kana: "よく ねむれる ように も なりました。", zh: "也變得睡得比較好了。"}
  - {jp: "これも、大会を見たおかげかもしれません。", kana: "これも、たいかいを みた おかげかも しれません。", zh: "這或許也是多虧了看了賽事。"}
  - {jp: "選手は、私に運動の楽しさを教えてくれました。", kana: "せんしゅは、わたしに うんどうの たのしさを おしえて くれました。", zh: "選手教會了我運動的樂趣。"}
  - {jp: "もちろん、大会には問題もあります。", kana: "もちろん、たいかいには もんだいも あります。", zh: "當然，賽事也有一些問題。"}
  - {jp: "大きな大会を開くには、たくさんのお金がかかります。", kana: "おおきな たいかいを ひらくには、たくさんの おかねが かかります。", zh: "舉辦大型賽事，需要花費很多錢。"}
  - {jp: "新しい建物を作る必要があります。", kana: "あたらしい たてものを つくる ひつようが あります。", zh: "需要建造新的建築物。"}
  - {jp: "そのお金は、国や町が出します。", kana: "その おかねは、くにや まちが だします。", zh: "那些錢，是由國家或城鎮出的。"}
  - {jp: "大会が終わると、その建物を使わなくなることもあります。", kana: "たいかいが おわると、その たてものを つかわなく なる ことも あります。", zh: "賽事結束後，那些建築物有時就不再使用了。"}
  - {jp: "それは、もったいないと思います。", kana: "それは、もったいないと おもいます。", zh: "我覺得那很浪費。"}
  - {jp: "また、たくさんの人が集まると、ごみも増えます。", kana: "また、たくさんの ひとが あつまると、ごみも ふえます。", zh: "另外，很多人聚集，垃圾也會增加。"}
  - {jp: "町が汚れてしまうこともあります。", kana: "まちが よごれて しまう ことも あります。", zh: "城鎮有時也會變髒。"}
  - {jp: "ですから、環境のことも考えなければなりません。", kana: "ですから、かんきょうの ことも かんがえなければ なりません。", zh: "所以，也必須考慮環境的問題。"}
  - {jp: "選手が、無理をしすぎることも心配です。", kana: "せんしゅが、むりを しすぎる ことも しんぱいです。", zh: "選手太過勉強自己，也令人擔心。"}
  - {jp: "勝つために、体をこわす選手もいるからです。", kana: "かつ ために、からだを こわす せんしゅも いるからです。", zh: "因為也有為了贏而把身體搞壞的選手。"}
  - {jp: "健康が、一番大切だと思います。", kana: "けんこうが、いちばん たいせつだと おもいます。", zh: "我認為健康才是最重要的。"}
  - {jp: "それでも、私は大会には良い点が多いと思います。", kana: "それでも、わたしは たいかいには よい てんが おおいと おもいます。", zh: "即使如此，我仍認為賽事的優點比較多。"}
  - {jp: "問題を一つずつ直していけば、もっと良くなります。", kana: "もんだいを ひとつずつ なおして いけば、もっと よく なります。", zh: "只要一個一個改善問題，就會變得更好。"}
  - {jp: "次に、大会を見る時の楽しみ方を話します。", kana: "つぎに、たいかいを みる ときの たのしみかたを はなします。", zh: "接下來，我想談談觀看賽事的方法。"}
  - {jp: "ルールを少し知ると、もっとおもしろくなります。", kana: "ルールを すこし しると、もっと おもしろく なります。", zh: "稍微了解規則，就會變得更有趣。"}
  - {jp: "知らないスポーツでも、見ているうちにわかってきます。", kana: "しらない スポーツでも、みている うちに わかって きます。", zh: "就算是不熟悉的運動，看著看著也會漸漸懂。"}
  - {jp: "好きな選手を一人見つけると、応援が楽しくなります。", kana: "すきな せんしゅを ひとり みつけると、おうえんが たのしく なります。", zh: "找到一位喜歡的選手，加油就會變得有趣。"}
  - {jp: "その選手の試合を、毎回見たくなります。", kana: "その せんしゅの しあいを、まいかい みたく なります。", zh: "會每次都想看那位選手的比賽。"}
  - {jp: "家族や友だちと一緒に見ると、もっと楽しいです。", kana: "かぞくや ともだちと いっしょに みると、もっと たのしいです。", zh: "和家人朋友一起看，會更開心。"}
  - {jp: "みんなで応援すると、声も大きくなります。", kana: "みんなで おうえん すると、こえも おおきく なります。", zh: "大家一起加油，聲音也會變大。"}
  - {jp: "試合の後で、感想を話し合うのも楽しいです。", kana: "しあいの あとで、かんそうを はなしあうのも たのしいです。", zh: "比賽後互相分享感想，也很愉快。"}
  - {jp: "「あの場面はすごかったね」と話します。", kana: "「あの ばめんは すごかったね」と はなします。", zh: "會聊「那個畫面好厲害呢」。"}
  - {jp: "そうやって、思い出が増えていきます。", kana: "そうやって、おもいでが ふえて いきます。", zh: "就這樣，回憶漸漸增加。"}
  - {jp: "大会は、人と人の話のきっかけにもなります。", kana: "たいかいは、ひとと ひとの はなしの きっかけにも なります。", zh: "賽事也成了人與人交談的契機。"}
  - {jp: "知らない人とも、スポーツの話ならできます。", kana: "しらない ひととも、スポーツの はなしなら できます。", zh: "就算是不認識的人，運動的話題也能聊。"}
  - {jp: "次に、若い選手について話します。", kana: "つぎに、わかい せんしゅに ついて はなします。", zh: "接下來，我想談談年輕選手。"}
  - {jp: "毎回、新しい若い選手が出てきます。", kana: "まいかい、あたらしい わかい せんしゅが でて きます。", zh: "每一屆，都會有新的年輕選手出現。"}
  - {jp: "とても若いのに、立派に戦います。", kana: "とても わかいのに、りっぱに たたかいます。", zh: "明明很年輕，卻表現得很出色。"}
  - {jp: "その姿を見ると、私はおどろきます。", kana: "その すがたを みると、わたしは おどろきます。", zh: "看到那身影，我感到很驚訝。"}
  - {jp: "若い選手は、未来の希望です。", kana: "わかい せんしゅは、みらいの きぼうです。", zh: "年輕選手是未來的希望。"}
  - {jp: "そして、年上の選手が、若い選手を助けます。", kana: "そして、としうえの せんしゅが、わかい せんしゅを たすけます。", zh: "而且，資深選手會幫助年輕選手。"}
  - {jp: "経験のある選手が、いろいろ教えてくれます。", kana: "けいけんの ある せんしゅが、いろいろ おしえて くれます。", zh: "有經驗的選手會教導他們許多事。"}
  - {jp: "こうして、技術が次の世代に伝わります。", kana: "こうして、ぎじゅつが つぎの せだいに つたわります。", zh: "就這樣，技術傳承給下一個世代。"}
  - {jp: "これも、大会の良いところです。", kana: "これも、たいかいの よい ところです。", zh: "這也是賽事的好處之一。"}
  - {jp: "次に、応援する人たちの話をします。", kana: "つぎに、おうえん する ひとたちの はなしを します。", zh: "接下來，我要談談加油的人們。"}
  - {jp: "会場には、たくさんの人が集まります。", kana: "かいじょうには、たくさんの ひとが あつまります。", zh: "會場聚集了很多人。"}
  - {jp: "みんな、自分の国の旗を持っています。", kana: "みんな、じぶんの くにの はたを もっています。", zh: "大家都拿著自己國家的旗子。"}
  - {jp: "歌を歌ったり、楽器を鳴らしたりします。", kana: "うたを うたったり、がっきを ならしたり します。", zh: "有人唱歌，有人演奏樂器。"}
  - {jp: "顔に、国の色をぬる人もいます。", kana: "かおに、くにの いろを ぬる ひとも います。", zh: "也有人在臉上塗上國家的顏色。"}
  - {jp: "ちがう国の応援団も、おたがいにあいさつします。", kana: "ちがう くにの おうえんだんも、おたがいに あいさつ します。", zh: "不同國家的加油團，也會互相打招呼。"}
  - {jp: "けんかをするのではなく、一緒に楽しみます。", kana: "けんかを するのでは なく、いっしょに たのしみます。", zh: "不是吵架，而是一起享受。"}
  - {jp: "応援するためだけに、遠い国から来る人もいます。", kana: "おうえん する ためだけに、とおい くにから くる ひとも います。", zh: "也有人只為了加油，從遙遠的國家前來。"}
  - {jp: "その気持ちは、本当にすごいと思います。", kana: "その きもちは、ほんとうに すごいと おもいます。", zh: "那份心意，我覺得真的很了不起。"}
  - {jp: "応援する人も、大会の大切な一部です。", kana: "おうえん する ひとも、たいかいの たいせつな いちぶです。", zh: "加油的人，也是賽事重要的一部分。"}
  - {jp: "選手は、その応援から力をもらいます。", kana: "せんしゅは、その おうえんから ちからを もらいます。", zh: "選手會從那份加油中獲得力量。"}
  - {jp: "「みんなが見てくれている」と思うと、がんばれます。", kana: "「みんなが みて くれている」と おもうと、がんばれます。", zh: "想到「大家都在看著我」，就能更努力。"}
  - {jp: "だから、応援はとても大きな力です。", kana: "だから、おうえんは とても おおきな ちからです。", zh: "所以，加油是非常大的力量。"}
  - {jp: "さて、そろそろまとめに入りましょう。", kana: "さて、そろそろ まとめに はいりましょう。", zh: "那麼，差不多該進入總結了。"}
  - {jp: "国際スポーツ大会には、たくさんの感動があります。", kana: "こくさい スポーツ たいかいには、たくさんの かんどうが あります。", zh: "國際運動賽事中，有許多感動。"}
  - {jp: "応援する楽しさがあります。", kana: "おうえん する たのしさが あります。", zh: "有加油的樂趣。"}
  - {jp: "選手の努力や涙があります。", kana: "せんしゅの どりょくや なみだが あります。", zh: "有選手的努力與淚水。"}
  - {jp: "国を越えた、人と人のつながりがあります。", kana: "くにを こえた、ひとと ひとの つながりが あります。", zh: "有跨越國界、人與人之間的連結。"}
  - {jp: "そして、私たちに勇気をくれます。", kana: "そして、わたしたちに ゆうきを くれます。", zh: "而且，它帶給我們勇氣。"}
  - {jp: "問題もありますが、良い点はもっと多いです。", kana: "もんだいも ありますが、よい てんは もっと おおいです。", zh: "雖然有問題，但好處更多。"}
  - {jp: "スポーツは、世界の言葉だと思います。", kana: "スポーツは、せかいの ことばだと おもいます。", zh: "我認為運動是世界的語言。"}
  - {jp: "言葉が通じなくても、心は通じます。", kana: "ことばが つうじなくても、こころは つうじます。", zh: "就算語言不通，心也能相通。"}
  - {jp: "次の大会が、今からとても楽しみです。", kana: "つぎの たいかいが、いまから とても たのしみです。", zh: "我現在就已經很期待下一屆賽事了。"}
  - {jp: "みなさんも、ぜひ見てみてください。", kana: "みなさんも、ぜひ みて みて ください。", zh: "也請大家一定要看看。"}
  - {jp: "そして、自分でも少し体を動かしてみましょう。", kana: "そして、じぶんでも すこし からだを うごかして みましょう。", zh: "然後，也讓我們自己稍微活動一下身體吧。"}
  - {jp: "走っても、歩いてもいいです。", kana: "はしっても、あるいても いいです。", zh: "跑步也好，走路也好。"}
  - {jp: "大切なのは、楽しむことです。", kana: "たいせつなのは、たのしむ ことです。", zh: "重要的是，享受其中。"}
  - {jp: "スポーツは、私たちの毎日を明るくしてくれます。", kana: "スポーツは、わたしたちの まいにちを あかるく して くれます。", zh: "運動讓我們的每一天變得明亮。"}
  - {jp: "これで、私の話を終わります。", kana: "これで、わたしの はなしを おわります。", zh: "我的話就到這裡結束。"}
  - {jp: "今日も、読んでくれてありがとうございました。", kana: "きょうも、よんで くれて ありがとう ございました。", zh: "謝謝今天也讀到這裡的你。"}
