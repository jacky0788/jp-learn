title: "AIと私たちの生活（AI與我們的生活・新聞長文）"
level: "N4（長文）"
order: 300
intro: |
  關於人工智慧（AI）如何改變我們的學習、工作與日常生活的長篇文章（約15分鐘）。
  介紹AI的方便之處，也談到工作、資訊真假、思考能力等擔憂，最後想想該怎麼跟AI好好相處。
  使用 です・ます體，含 たり、ようになる、かもしれません、たほうがいい、なければなりません 等N4文法。
body:
  - {jp: "今日は、AIと私たちの生活について話したいと思います。", kana: "きょうは、エーアイと わたしたちの せいかつに ついて はなしたいと おもいます。", zh: "今天我想談談AI與我們的生活。"}
  - {jp: "AIは、人工知能のことです。", kana: "エーアイは、じんこうちのうの ことです。", zh: "AI就是人工智慧。"}
  - {jp: "近年、AIという言葉をよく聞くようになりました。", kana: "きんねん、エーアイと いう ことばを よく きく ように なりました。", zh: "近年來，我們越來越常聽到AI這個詞。"}
  - {jp: "テレビでも、新聞でも、AIの話があります。", kana: "テレビでも、しんぶんでも、エーアイの はなしが あります。", zh: "電視上、報紙上都有AI的話題。"}
  - {jp: "AIは、コンピューターの新しい技術です。", kana: "エーアイは、コンピューターの あたらしい ぎじゅつです。", zh: "AI是電腦的新技術。"}
  - {jp: "人間のように、考えたり、答えたりすることができます。", kana: "にんげんの ように、かんがえたり、こたえたり する ことが できます。", zh: "它能像人類一樣思考、回答。"}
  - {jp: "特に、生成AIというものが有名になりました。", kana: "とくに、せいせいエーアイと いう ものが ゆうめいに なりました。", zh: "尤其是叫做生成式AI的東西變得很有名。"}
  - {jp: "生成AIは、文章や絵を作ることができます。", kana: "せいせいエーアイは、ぶんしょうや えを つくる ことが できます。", zh: "生成式AI能製作文章和圖畫。"}
  - {jp: "質問をすると、すぐに答えてくれます。", kana: "しつもんを すると、すぐに こたえて くれます。", zh: "你提問，它馬上就回答你。"}
  - {jp: "多くの人が、毎日のように使っています。", kana: "おおくの ひとが、まいにちの ように つかって います。", zh: "很多人幾乎每天都在使用。"}
  - {jp: "私も、ときどき使ってみました。", kana: "わたしも、ときどき つかって みました。", zh: "我也偶爾試著用過。"}
  - {jp: "とても便利で、びっくりしました。", kana: "とても べんりで、びっくりしました。", zh: "非常方便，讓我很驚訝。"}
  - {jp: "今日は、そのいい点と、心配な点を話します。", kana: "きょうは、その いいてんと、しんぱいな てんを はなします。", zh: "今天我要談談它好的地方和令人擔心的地方。"}
  - {jp: "まず、勉強の話です。", kana: "まず、べんきょうの はなしです。", zh: "首先是學習的話題。"}
  - {jp: "私は、日本語を勉強しています。", kana: "わたしは、にほんごを べんきょうして います。", zh: "我正在學日文。"}
  - {jp: "分からない言葉があると、よくAIに聞きます。", kana: "わからない ことばが あると、よく エーアイに ききます。", zh: "遇到不懂的詞，我常常問AI。"}
  - {jp: "AIは、その言葉の意味を教えてくれます。", kana: "エーアイは、その ことばの いみを おしえて くれます。", zh: "AI會告訴我那個詞的意思。"}
  - {jp: "例文も作ってくれます。", kana: "れいぶんも つくって くれます。", zh: "它也會幫我造例句。"}
  - {jp: "前は、辞書を引いていました。", kana: "まえは、じしょを ひいて いました。", zh: "以前我都查字典。"}
  - {jp: "辞書も大切ですが、時間がかかりました。", kana: "じしょも たいせつですが、じかんが かかりました。", zh: "字典也很重要，但很花時間。"}
  - {jp: "今は、すぐに答えが分かります。", kana: "いまは、すぐに こたえが わかります。", zh: "現在馬上就能知道答案。"}
  - {jp: "それに、間違えたところも直してくれます。", kana: "それに、まちがえた ところも なおして くれます。", zh: "而且還會幫我訂正錯的地方。"}
  - {jp: "私が書いた作文を、AIに見せます。", kana: "わたしが かいた さくぶんを、エーアイに みせます。", zh: "我把寫的作文給AI看。"}
  - {jp: "すると、もっと自然な言い方を教えてくれます。", kana: "すると、もっと しぜんな いいかたを おしえて くれます。", zh: "於是它會教我更自然的說法。"}
  - {jp: "まるで、いつもそばにいる先生のようです。", kana: "まるで、いつも そばに いる せんせいの ようです。", zh: "簡直就像一直在身邊的老師。"}
  - {jp: "勉強が、前より楽しくなりました。", kana: "べんきょうが、まえより たのしく なりました。", zh: "學習比以前變得更有趣了。"}
  - {jp: "次に、仕事の話です。", kana: "つぎに、しごとの はなしです。", zh: "接下來是工作的話題。"}
  - {jp: "多くの会社が、AIを使い始めました。", kana: "おおくの かいしゃが、エーアイを つかいはじめました。", zh: "很多公司開始使用AI。"}
  - {jp: "AIは、メールの文章を作ることができます。", kana: "エーアイは、メールの ぶんしょうを つくる ことが できます。", zh: "AI能寫電子郵件的文章。"}
  - {jp: "長い文章を、短くまとめることもできます。", kana: "ながい ぶんしょうを、みじかく まとめる ことも できます。", zh: "也能把長文章整理得很短。"}
  - {jp: "数字を計算したり、表を作ったりします。", kana: "すうじを けいさんしたり、ひょうを つくったり します。", zh: "它會計算數字，做表格。"}
  - {jp: "だから、仕事が速くなりました。", kana: "だから、しごとが はやく なりました。", zh: "所以工作變快了。"}
  - {jp: "ある会社では、AIがお客さんの質問に答えています。", kana: "ある かいしゃでは、エーアイが おきゃくさんの しつもんに こたえて います。", zh: "在某些公司，AI在回答客人的問題。"}
  - {jp: "昼でも夜でも、答えることができます。", kana: "ひるでも よるでも、こたえる ことが できます。", zh: "不管白天或晚上都能回答。"}
  - {jp: "人間は、休まなければなりません。", kana: "にんげんは、やすまなければ なりません。", zh: "人類必須休息。"}
  - {jp: "でも、AIは休みません。", kana: "でも、エーアイは やすみません。", zh: "但AI不休息。"}
  - {jp: "これは、とても便利なことです。", kana: "これは、とても べんりな ことです。", zh: "這是非常方便的事。"}
  - {jp: "そして、翻訳の話です。", kana: "そして、ほんやくの はなしです。", zh: "再來是翻譯的話題。"}
  - {jp: "AIは、いろいろな国の言葉を翻訳できます。", kana: "エーアイは、いろいろな くにの ことばを ほんやく できます。", zh: "AI能翻譯各國的語言。"}
  - {jp: "日本語を、中国語にすることができます。", kana: "にほんごを、ちゅうごくごに する ことが できます。", zh: "能把日文變成中文。"}
  - {jp: "英語の文章も、すぐに読めるようになります。", kana: "えいごの ぶんしょうも、すぐに よめる ように なります。", zh: "英文文章也馬上能讀懂。"}
  - {jp: "外国を旅行するとき、とても役に立ちます。", kana: "がいこくを りょこうする とき、とても やくに たちます。", zh: "出國旅行時非常有幫助。"}
  - {jp: "前は、言葉が分からなくて困りました。", kana: "まえは、ことばが わからなくて こまりました。", zh: "以前語言不通很困擾。"}
  - {jp: "今は、スマホのAIに話すだけです。", kana: "いまは、スマホの エーアイに はなす だけです。", zh: "現在只要對手機的AI說話就好。"}
  - {jp: "すぐに、相手の言葉に変えてくれます。", kana: "すぐに、あいての ことばに かえて くれます。", zh: "它馬上幫你變成對方的語言。"}
  - {jp: "世界が、近くなったような気がします。", kana: "せかいが、ちかく なったような きが します。", zh: "感覺世界變近了。"}
  - {jp: "絵の話もしましょう。", kana: "えの はなしも しましょう。", zh: "也來談談圖畫吧。"}
  - {jp: "AIは、絵をかくこともできます。", kana: "エーアイは、えを かく ことも できます。", zh: "AI也能畫圖。"}
  - {jp: "「青い空と海の絵」と言います。", kana: "「あおい そらと うみの え」と いいます。", zh: "你說「藍天和海的圖」。"}
  - {jp: "すると、その絵をすぐに作ってくれます。", kana: "すると、その えを すぐに つくって くれます。", zh: "於是它馬上幫你做出那張圖。"}
  - {jp: "絵が下手な人でも、きれいな絵ができます。", kana: "えが へたな ひとでも、きれいな えが できます。", zh: "就算不會畫圖的人，也能做出漂亮的圖。"}
  - {jp: "音楽を作るAIもあります。", kana: "おんがくを つくる エーアイも あります。", zh: "也有能做音樂的AI。"}
  - {jp: "本当に、いろいろなことができます。", kana: "ほんとうに、いろいろな ことが できます。", zh: "真的能做各式各樣的事。"}
  - {jp: "このように、AIは生活を便利にしました。", kana: "このように、エーアイは せいかつを べんりに しました。", zh: "像這樣，AI讓生活變方便了。"}
  - {jp: "しかし、いい点だけではありません。", kana: "しかし、いいてん だけでは ありません。", zh: "不過，並不是只有好的地方。"}
  - {jp: "心配なことも、いくつかあります。", kana: "しんぱいな ことも、いくつか あります。", zh: "也有幾件令人擔心的事。"}
  - {jp: "まず、仕事の心配です。", kana: "まず、しごとの しんぱいです。", zh: "首先是工作的擔憂。"}
  - {jp: "AIは、人間の仕事をすることができます。", kana: "エーアイは、にんげんの しごとを する ことが できます。", zh: "AI能做人類的工作。"}
  - {jp: "だから、仕事がなくなるかもしれません。", kana: "だから、しごとが なくなる かもしれません。", zh: "所以工作可能會消失。"}
  - {jp: "ある仕事は、もうAIがしています。", kana: "ある しごとは、もう エーアイが して います。", zh: "有些工作已經由AI在做了。"}
  - {jp: "それを心配している人が、たくさんいます。", kana: "それを しんぱいして いる ひとが、たくさん います。", zh: "有很多人在擔心這件事。"}
  - {jp: "自分の仕事も、なくなるのではないかと考えます。", kana: "じぶんの しごとも、なくなるのでは ないかと かんがえます。", zh: "他們會想，自己的工作會不會也消失。"}
  - {jp: "これは、大きな問題です。", kana: "これは、おおきな もんだいです。", zh: "這是個大問題。"}
  - {jp: "でも、新しい仕事も生まれると言う人もいます。", kana: "でも、あたらしい しごとも うまれると いう ひとも います。", zh: "但也有人說會誕生新的工作。"}
  - {jp: "AIを使う仕事が、これから増えるそうです。", kana: "エーアイを つかう しごとが、これから ふえるそうです。", zh: "據說使用AI的工作今後會增加。"}
  - {jp: "だから、新しいことを勉強したほうがいいです。", kana: "だから、あたらしい ことを べんきょうした ほうが いいです。", zh: "所以最好學習新的事物。"}
  - {jp: "次に、情報の問題です。", kana: "つぎに、じょうほうの もんだいです。", zh: "接下來是資訊的問題。"}
  - {jp: "AIは、いつも正しい答えを言うとは限りません。", kana: "エーアイは、いつも ただしい こたえを いうとは かぎりません。", zh: "AI不一定總是說正確的答案。"}
  - {jp: "ときどき、間違ったことを言います。", kana: "ときどき、まちがった ことを いいます。", zh: "有時會說錯誤的事。"}
  - {jp: "でも、その言い方は、とても自然です。", kana: "でも、その いいかたは、とても しぜんです。", zh: "但它的說法非常自然。"}
  - {jp: "だから、間違いに気がつきにくいです。", kana: "だから、まちがいに きが つきにくいです。", zh: "所以很難察覺到錯誤。"}
  - {jp: "本当のことか、うそか、分かりません。", kana: "ほんとうの ことか、うそか、わかりません。", zh: "不知道是真的還是假的。"}
  - {jp: "AIが作った絵や文章も、たくさんあります。", kana: "エーアイが つくった えや ぶんしょうも、たくさん あります。", zh: "AI製作的圖和文章也有很多。"}
  - {jp: "それが本物か、にせ物か、見分けるのは難しいです。", kana: "それが ほんものか、にせものか、みわけるのは むずかしいです。", zh: "要分辨那是真的還是假的很困難。"}
  - {jp: "うその情報が、インターネットに広がります。", kana: "うその じょうほうが、インターネットに ひろがります。", zh: "假的資訊在網路上擴散。"}
  - {jp: "それを信じてしまう人もいます。", kana: "それを しんじて しまう ひとも います。", zh: "也有人會相信那些。"}
  - {jp: "だから、私たちは気をつけなければなりません。", kana: "だから、わたしたちは きを つけなければ なりません。", zh: "所以我們必須小心。"}
  - {jp: "AIの答えを、すぐに信じてはいけません。", kana: "エーアイの こたえを、すぐに しんじては いけません。", zh: "不可以馬上相信AI的答案。"}
  - {jp: "本当かどうか、自分で調べたほうがいいです。", kana: "ほんとうか どうか、じぶんで しらべた ほうが いいです。", zh: "最好自己查查看是不是真的。"}
  - {jp: "ほかの本やサイトも、見るといいです。", kana: "ほかの ほんや サイトも、みると いいです。", zh: "看看其他書或網站也很好。"}
  - {jp: "そして、もう一つ心配なことがあります。", kana: "そして、もう ひとつ しんぱいな ことが あります。", zh: "還有一件令人擔心的事。"}
  - {jp: "それは、考える力のことです。", kana: "それは、かんがえる ちからの ことです。", zh: "那就是思考能力的問題。"}
  - {jp: "AIは、なんでもすぐに答えてくれます。", kana: "エーアイは、なんでも すぐに こたえて くれます。", zh: "AI什麼都馬上回答你。"}
  - {jp: "それは、便利なことです。", kana: "それは、べんりな ことです。", zh: "那是方便的事。"}
  - {jp: "でも、私たちは自分で考えなくなるかもしれません。", kana: "でも、わたしたちは じぶんで かんがえなく なる かもしれません。", zh: "但我們可能會變得不自己思考。"}
  - {jp: "むかしは、分からないとき、よく考えました。", kana: "むかしは、わからない とき、よく かんがえました。", zh: "以前不懂的時候會好好思考。"}
  - {jp: "自分で調べて、自分で答えを見つけました。", kana: "じぶんで しらべて、じぶんで こたえを みつけました。", zh: "自己查、自己找答案。"}
  - {jp: "その時間に、人は成長します。", kana: "その じかんに、ひとは せいちょうします。", zh: "在那段時間裡，人會成長。"}
  - {jp: "でも、いつもAIに聞いていると、どうでしょうか。", kana: "でも、いつも エーアイに きいて いると、どうでしょうか。", zh: "但如果總是問AI，會怎麼樣呢。"}
  - {jp: "考える力が、だんだん弱くなるかもしれません。", kana: "かんがえる ちからが、だんだん よわく なる かもしれません。", zh: "思考能力可能會漸漸變弱。"}
  - {jp: "特に、子どもには注意が必要です。", kana: "とくに、こどもには ちゅういが ひつようです。", zh: "尤其對孩子需要注意。"}
  - {jp: "子どものときは、自分で考える練習が大切です。", kana: "こどもの ときは、じぶんで かんがえる れんしゅうが たいせつです。", zh: "小時候，自己思考的練習很重要。"}
  - {jp: "答えをすぐにもらうと、その練習ができません。", kana: "こたえを すぐに もらうと、その れんしゅうが できません。", zh: "馬上得到答案，就無法練習了。"}
  - {jp: "だから、使い方を考えなければなりません。", kana: "だから、つかいかたを かんがえなければ なりません。", zh: "所以必須思考使用的方法。"}
  - {jp: "では、これから、どうすればいいでしょうか。", kana: "では、これから、どう すれば いいでしょうか。", zh: "那麼，今後該怎麼做才好呢。"}
  - {jp: "私は、こう思います。", kana: "わたしは、こう おもいます。", zh: "我是這麼想的。"}
  - {jp: "AIは、便利な道具です。", kana: "エーアイは、べんりな どうぐです。", zh: "AI是方便的工具。"}
  - {jp: "道具は、使い方が大切です。", kana: "どうぐは、つかいかたが たいせつです。", zh: "工具的使用方法很重要。"}
  - {jp: "包丁は、料理に使うと便利です。", kana: "ほうちょうは、りょうりに つかうと べんりです。", zh: "菜刀用在做菜上很方便。"}
  - {jp: "でも、使い方を間違えると、あぶないです。", kana: "でも、つかいかたを まちがえると、あぶないです。", zh: "但用錯方法就很危險。"}
  - {jp: "AIも、同じだと思います。", kana: "エーアイも、おなじだと おもいます。", zh: "我覺得AI也是一樣的。"}
  - {jp: "上手に使えば、生活がよくなります。", kana: "じょうずに つかえば、せいかつが よく なります。", zh: "好好使用的話，生活會變好。"}
  - {jp: "でも、使い方を間違えると、問題が起きます。", kana: "でも、つかいかたを まちがえると、もんだいが おきます。", zh: "但用錯方法就會發生問題。"}
  - {jp: "だから、私たちが上手に付き合うことが大切です。", kana: "だから、わたしたちが じょうずに つきあう ことが たいせつです。", zh: "所以我們好好地與它相處很重要。"}
  - {jp: "まず、全部をAIに任せないことです。", kana: "まず、ぜんぶを エーアイに まかせない ことです。", zh: "首先，不要把全部都交給AI。"}
  - {jp: "大事なことは、自分で決めたほうがいいです。", kana: "だいじな ことは、じぶんで きめた ほうが いいです。", zh: "重要的事最好自己決定。"}
  - {jp: "AIは、手伝ってくれるだけです。", kana: "エーアイは、てつだって くれる だけです。", zh: "AI只是幫忙而已。"}
  - {jp: "最後に決めるのは、人間です。", kana: "さいごに きめるのは、にんげんです。", zh: "最後做決定的是人類。"}
  - {jp: "次に、自分でも考えることです。", kana: "つぎに、じぶんでも かんがえる ことです。", zh: "其次，自己也要思考。"}
  - {jp: "AIの答えを聞いても、もう一度考えます。", kana: "エーアイの こたえを きいても、もう いちど かんがえます。", zh: "就算聽了AI的答案，也再想一次。"}
  - {jp: "これは正しいかと、自分に聞きます。", kana: "これは ただしいかと、じぶんに ききます。", zh: "問問自己這是不是正確的。"}
  - {jp: "そうすれば、考える力は弱くなりません。", kana: "そう すれば、かんがえる ちからは よわく なりません。", zh: "這樣的話，思考能力就不會變弱。"}
  - {jp: "それから、情報をよく確かめることです。", kana: "それから、じょうほうを よく たしかめる ことです。", zh: "還有，要好好確認資訊。"}
  - {jp: "AIが言ったことを、すぐに人に話してはいけません。", kana: "エーアイが いった ことを、すぐに ひとに はなしては いけません。", zh: "AI說的話不可以馬上跟別人說。"}
  - {jp: "本当かどうか、確かめてから話します。", kana: "ほんとうか どうか、たしかめてから はなします。", zh: "確認是不是真的之後再說。"}
  - {jp: "うその情報を広げないように、気をつけます。", kana: "うその じょうほうを ひろげない ように、きを つけます。", zh: "小心不要散播假資訊。"}
  - {jp: "学校でも、AIの使い方を教えるといいです。", kana: "がっこうでも、エーアイの つかいかたを おしえると いいです。", zh: "在學校教AI的使用方法也很好。"}
  - {jp: "子どもたちは、これからAIと生きていきます。", kana: "こどもたちは、これから エーアイと いきて いきます。", zh: "孩子們今後將與AI一起生活。"}
  - {jp: "だから、正しい使い方を知る必要があります。", kana: "だから、ただしい つかいかたを しる ひつようが あります。", zh: "所以有必要知道正確的使用方法。"}
  - {jp: "便利さと、あぶなさ、両方を知ることが大切です。", kana: "べんりさと、あぶなさ、りょうほうを しる ことが たいせつです。", zh: "了解方便和危險兩方面很重要。"}
  - {jp: "私は、AIは止められないと思います。", kana: "わたしは、エーアイは とめられないと おもいます。", zh: "我覺得AI是停不下來的。"}
  - {jp: "これからも、もっと進んでいくでしょう。", kana: "これからも、もっと すすんで いくでしょう。", zh: "今後也會更加進步吧。"}
  - {jp: "もっといろいろなことが、できるようになります。", kana: "もっと いろいろな ことが、できる ように なります。", zh: "會變得能做更多各式各樣的事。"}
  - {jp: "だから、こわがるだけでは、いけません。", kana: "だから、こわがる だけでは、いけません。", zh: "所以光是害怕是不行的。"}
  - {jp: "AIのことを、よく知ることが大切です。", kana: "エーアイの ことを、よく しる ことが たいせつです。", zh: "好好了解AI很重要。"}
  - {jp: "知れば、こわくなくなります。", kana: "しれば、こわく なくなります。", zh: "了解了就不會害怕。"}
  - {jp: "そして、上手に使えるようになります。", kana: "そして、じょうずに つかえる ように なります。", zh: "然後就能好好使用。"}
  - {jp: "私は、AIといっしょに勉強を続けたいです。", kana: "わたしは、エーアイと いっしょに べんきょうを つづけたいです。", zh: "我想和AI一起繼續學習。"}
  - {jp: "でも、自分の頭で考えることも、やめません。", kana: "でも、じぶんの あたまで かんがえる ことも、やめません。", zh: "但我也不會停止用自己的腦袋思考。"}
  - {jp: "この二つを、両方とも大事にします。", kana: "この ふたつを、りょうほうとも だいじに します。", zh: "這兩件事我都會重視。"}
  - {jp: "AIは、私たちの友だちのようなものです。", kana: "エーアイは、わたしたちの ともだちの ような ものです。", zh: "AI就像我們的朋友一樣。"}
  - {jp: "でも、なんでも友だちに任せてはいけません。", kana: "でも、なんでも ともだちに まかせては いけません。", zh: "但不可以什麼都交給朋友。"}
  - {jp: "自分のことは、自分でする。", kana: "じぶんの ことは、じぶんで する。", zh: "自己的事自己做。"}
  - {jp: "これが、いちばん大切だと思います。", kana: "これが、いちばん たいせつだと おもいます。", zh: "我覺得這是最重要的。"}
  - {jp: "みなさんは、AIを使っていますか。", kana: "みなさんは、エーアイを つかって いますか。", zh: "各位有在使用AI嗎。"}
  - {jp: "どんなときに、使いますか。", kana: "どんな ときに、つかいますか。", zh: "在什麼時候使用呢。"}
  - {jp: "便利だと感じることは、何ですか。", kana: "べんりだと かんじる ことは、なんですか。", zh: "覺得方便的是什麼呢。"}
  - {jp: "心配だと感じることは、ありますか。", kana: "しんぱいだと かんじる ことは、ありますか。", zh: "有覺得擔心的事嗎。"}
  - {jp: "ぜひ、一度考えてみてください。", kana: "ぜひ、いちど かんがえて みて ください。", zh: "請務必想一次看看。"}
  - {jp: "AIは、これからの世界を大きく変えるでしょう。", kana: "エーアイは、これからの せかいを おおきく かえるでしょう。", zh: "AI將會大大改變今後的世界吧。"}
  - {jp: "いい方向に変わるか、悪い方向に変わるか。", kana: "いい ほうこうに かわるか、わるい ほうこうに かわるか。", zh: "是往好的方向變，還是往壞的方向變。"}
  - {jp: "それは、私たちの使い方によると思います。", kana: "それは、わたしたちの つかいかたに よると おもいます。", zh: "我覺得這取決於我們的使用方法。"}
  - {jp: "道具を作るのも、人間です。", kana: "どうぐを つくるのも、にんげんです。", zh: "做工具的也是人類。"}
  - {jp: "道具を使うのも、人間です。", kana: "どうぐを つかうのも、にんげんです。", zh: "使用工具的也是人類。"}
  - {jp: "だから、いちばん大事なのは、人間の心です。", kana: "だから、いちばん だいじなのは、にんげんの こころです。", zh: "所以最重要的是人類的心。"}
  - {jp: "やさしい心で、AIを使いたいです。", kana: "やさしい こころで、エーアイを つかいたいです。", zh: "我想用善良的心使用AI。"}
  - {jp: "人を助けるために、使いたいです。", kana: "ひとを たすける ために、つかいたいです。", zh: "想用來幫助別人。"}
  - {jp: "人を悲しませるために、使ってはいけません。", kana: "ひとを かなしませる ために、つかっては いけません。", zh: "不可以用來讓人悲傷。"}
  - {jp: "これは、私たち一人一人の問題です。", kana: "これは、わたしたち ひとり ひとりの もんだいです。", zh: "這是我們每一個人的問題。"}
  - {jp: "私は、未来が楽しみです。", kana: "わたしは、みらいが たのしみです。", zh: "我很期待未來。"}
  - {jp: "少し心配もありますが、楽しみのほうが大きいです。", kana: "すこし しんぱいも ありますが、たのしみの ほうが おおきいです。", zh: "雖然也有點擔心，但期待比較大。"}
  - {jp: "AIといっしょに、もっといい生活を作りたいです。", kana: "エーアイと いっしょに、もっと いい せいかつを つくりたいです。", zh: "想和AI一起創造更好的生活。"}
  - {jp: "そのために、私はこれからも勉強を続けます。", kana: "その ために、わたしは これからも べんきょうを つづけます。", zh: "為此，我今後也會繼續學習。"}
  - {jp: "新しい技術を、こわがらないで学びます。", kana: "あたらしい ぎじゅつを、こわがらないで まなびます。", zh: "不害怕地學習新技術。"}
  - {jp: "でも、人間の大切なことも、忘れません。", kana: "でも、にんげんの たいせつな ことも、わすれません。", zh: "但也不會忘記人類重要的事。"}
  - {jp: "考える力、やさしい心、人とのつながり。", kana: "かんがえる ちから、やさしい こころ、ひととの つながり。", zh: "思考能力、善良的心、與人的連結。"}
  - {jp: "これらは、AIにはできないことです。", kana: "これらは、エーアイには できない ことです。", zh: "這些是AI做不到的事。"}
  - {jp: "だから、私たち人間は、まだまだ大丈夫です。", kana: "だから、わたしたち にんげんは、まだまだ だいじょうぶです。", zh: "所以我們人類還很沒問題。"}
  - {jp: "AIと人間が、いっしょに進む時代です。", kana: "エーアイと にんげんが、いっしょに すすむ じだいです。", zh: "這是AI和人類一起前進的時代。"}
  - {jp: "その時代を、みなさんと作っていきたいです。", kana: "その じだいを、みなさんと つくって いきたいです。", zh: "我想和各位一起創造那個時代。"}
  - {jp: "今日は、AIと私たちの生活について話しました。", kana: "きょうは、エーアイと わたしたちの せいかつに ついて はなしました。", zh: "今天我談了AI與我們的生活。"}
  - {jp: "長い話を、最後まで聞いてくれて、ありがとうございました。", kana: "ながい はなしを、さいごまで きいて くれて、ありがとう ございました。", zh: "謝謝你把這麼長的話聽到最後。"}
