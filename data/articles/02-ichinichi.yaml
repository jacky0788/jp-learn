title: わたしの一日（我的一天）
level: N5
order: 20
intro: |
  用て形連接動作、時間表現與「ます」描述每天的作息。
body:
  - {jp: "わたしは毎朝六時に起きます。", kana: "わたしは まいあさ ろくじに おきます。", zh: "我每天早上六點起床。"}
  - {jp: "起きてから、顔を洗って、歯を磨きます。", kana: "おきてから、かおを あらって、はを みがきます。", zh: "起床後洗臉、刷牙。"}
  - {jp: "それから、朝ごはんを食べます。", kana: "それから、あさごはんを たべます。", zh: "然後吃早餐。"}
  - {jp: "朝は、いつもパンと牛乳です。", kana: "あさは、いつも ぱんと ぎゅうにゅうです。", zh: "早上總是麵包和牛奶。"}
  - {jp: "七時半に家を出ます。", kana: "しちじはんに いえを でます。", zh: "七點半出門。"}
  - {jp: "学校まで、バスで三十分ぐらいかかります。", kana: "がっこうまで、ばすで さんじゅっぷんぐらい かかります。", zh: "到學校搭公車大約要三十分鐘。"}
  - {jp: "午前中は、日本語の授業があります。", kana: "ごぜんちゅうは、にほんごの じゅぎょうが あります。", zh: "上午有日語課。"}
  - {jp: "昼ごはんは、学校の食堂で食べます。", kana: "ひるごはんは、がっこうの しょくどうで たべます。", zh: "午餐在學校食堂吃。"}
  - {jp: "食堂の料理は、安くておいしいです。", kana: "しょくどうの りょうりは、やすくて おいしいです。", zh: "食堂的料理又便宜又好吃。"}
  - {jp: "午後は、図書館で宿題をします。", kana: "ごごは、としょかんで しゅくだいを します。", zh: "下午在圖書館寫作業。"}
  - {jp: "分からないことがあったら、先生に聞きます。", kana: "わからない ことが あったら、せんせいに ききます。", zh: "有不懂的地方就問老師。"}
  - {jp: "夕方、うちへ帰ります。", kana: "ゆうがた、うちへ かえります。", zh: "傍晚回家。"}
  - {jp: "帰る前に、スーパーで買い物をします。", kana: "かえる まえに、すーぱーで かいものを します。", zh: "回家前在超市買東西。"}
  - {jp: "夜は、家族と一緒に晩ごはんを食べます。", kana: "よるは、かぞくと いっしょに ばんごはんを たべます。", zh: "晚上和家人一起吃晚餐。"}
  - {jp: "ごはんの後で、少しテレビを見ます。", kana: "ごはんの あとで、すこし てれびを みます。", zh: "吃完飯後看一下電視。"}
  - {jp: "寝る前に、日本語の単語を覚えます。", kana: "ねる まえに、にほんごの たんごを おぼえます。", zh: "睡前背日語單字。"}
  - {jp: "毎日忙しいですが、とても楽しいです。", kana: "まいにち いそがしいですが、とても たのしいです。", zh: "雖然每天都很忙，但很開心。"}
