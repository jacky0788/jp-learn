title: 週末の予定（週末的計劃）
level: N4
order: 30
intro: |
  用意向形「〜ようと思う」、つもり、予定、そうです（傳聞）來講週末的打算。
body:
  - {jp: "今度の週末は、友達と旅行に行こうと思っています。", kana: "こんどの しゅうまつは、ともだちと りょこうに いこうと おもって います。", zh: "這個週末我打算和朋友去旅行。"}
  - {jp: "土曜日の朝、駅で友達に会うつもりです。", kana: "どようびの あさ、えきで ともだちに あう つもりです。", zh: "星期六早上打算在車站和朋友碰面。"}
  - {jp: "電車で、海の近くの町へ行きます。", kana: "でんしゃで、うみの ちかくの まちへ いきます。", zh: "搭電車去海邊附近的小鎮。"}
  - {jp: "その町では、おいしい魚が食べられるそうです。", kana: "その まちでは、おいしい さかなが たべられる そうです。", zh: "聽說那個小鎮吃得到好吃的魚。"}
  - {jp: "午後は、海を見ながら、ゆっくり散歩しましょう。", kana: "ごごは、うみを みながら、ゆっくり さんぽしましょう。", zh: "下午一邊看海，一邊慢慢散步吧。"}
  - {jp: "天気がよかったら、写真をたくさん撮りたいです。", kana: "てんきが よかったら、しゃしんを たくさん とりたいです。", zh: "天氣好的話，想拍很多照片。"}
  - {jp: "夜は、温泉に入る予定です。", kana: "よるは、おんせんに はいる よていです。", zh: "晚上預計去泡溫泉。"}
  - {jp: "温泉に入ったら、きっと疲れが取れます。", kana: "おんせんに はいったら、きっと つかれが とれます。", zh: "泡了溫泉，疲勞一定會消除。"}
  - {jp: "日曜日は、お土産を買おうと思います。", kana: "にちようびは、おみやげを かおうと おもいます。", zh: "星期日打算買伴手禮。"}
  - {jp: "家族に、お菓子を買って帰るつもりです。", kana: "かぞくに、おかしを かって かえる つもりです。", zh: "打算買點心回去給家人。"}
  - {jp: "月曜日は学校があるので、日曜日の夜には帰ります。", kana: "げつようびは がっこうが あるので、にちようびの よるには かえります。", zh: "因為星期一有課，星期日晚上就會回來。"}
  - {jp: "無理をしないで、ゆっくり楽しみたいです。", kana: "むりを しないで、ゆっくり たのしみたいです。", zh: "不勉強自己，想好好享受。"}
  - {jp: "楽しい週末になりそうです。", kana: "たのしい しゅうまつに なりそうです。", zh: "感覺會是個愉快的週末。"}
  - {jp: "早く週末になってほしいです。", kana: "はやく しゅうまつに なって ほしいです。", zh: "真希望週末快點到。"}
