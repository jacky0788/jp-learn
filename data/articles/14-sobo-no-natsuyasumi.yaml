title: 祖母の家での夏休み（長文・在祖母家的暑假）
level: N4（長文）
order: 210
intro: |
  回憶在鄉下祖母家度過的暑假。較長的文章（約5分鐘），用過去式、てくれる、ようとする、〜なる。
body:
  - {jp: "子供のころ、わたしは毎年夏休みに、祖母の家へ行きました。", kana: "こどもの ころ、わたしは まいとし なつやすみに、そぼの いえへ いきました。", zh: "小時候，我每年暑假都去祖母家。"}
  - {jp: "祖母の家は、町から遠い、小さい村にあります。", kana: "そぼの いえは、まちから とおい、ちいさい むらに あります。", zh: "祖母家在離鎮上很遠的小村莊。"}
  - {jp: "電車とバスを乗り継いで、半日もかかりました。", kana: "でんしゃと ばすを のりついで、はんにちも かかりました。", zh: "轉乘電車和公車，要花上半天。"}
  - {jp: "遠かったですが、わたしはその旅が大好きでした。", kana: "とおかったですが、わたしは その たびが だいすきでした。", zh: "雖然很遠，但我很喜歡那段旅程。"}
  - {jp: "祖母の家の周りには、緑の田んぼが広がっていました。", kana: "そぼの いえの まわりには、みどりの たんぼが ひろがって いました。", zh: "祖母家周圍是一片綠色的稻田。"}
  - {jp: "空が広くて、夜には星がたくさん見えました。", kana: "そらが ひろくて、よるには ほしが たくさん みえました。", zh: "天空很寬廣，晚上看得到很多星星。"}
  - {jp: "都会では、こんなにきれいな星は見られません。", kana: "とかいでは、こんなに きれいな ほしは みられません。", zh: "在都市看不到這麼漂亮的星星。"}
  - {jp: "祖母は、いつも笑顔でわたしを迎えてくれました。", kana: "そぼは、いつも えがおで わたしを むかえて くれました。", zh: "祖母總是笑著迎接我。"}
  - {jp: "「よく来たね」と言って、頭をなでてくれました。", kana: "よく きたねと いって、あたまを なでて くれました。", zh: "她說「你來啦」，摸摸我的頭。"}
  - {jp: "祖母の作る料理は、何でもおいしかったです。", kana: "そぼの つくる りょうりは、なんでも おいしかったです。", zh: "祖母做的料理什麼都好吃。"}
  - {jp: "特に、夏の野菜を使った料理が好きでした。", kana: "とくに、なつの やさいを つかった りょうりが すきでした。", zh: "特別喜歡用夏天蔬菜做的料理。"}
  - {jp: "朝は、にわとりの声で目が覚めました。", kana: "あさは、にわとりの こえで めが さめました。", zh: "早上被雞叫聲叫醒。"}
  - {jp: "顔を洗ってから、祖父と一緒に畑へ行きました。", kana: "かおを あらってから、そふと いっしょに はたけへ いきました。", zh: "洗完臉後，和祖父一起去田裡。"}
  - {jp: "祖父は、トマトやきゅうりを育てていました。", kana: "そふは、とまとや きゅうりを そだてて いました。", zh: "祖父種了番茄和小黃瓜。"}
  - {jp: "もぎたての野菜は、とても甘くて新鮮でした。", kana: "もぎたての やさいは、とても あまくて しんせんでした。", zh: "現摘的蔬菜又甜又新鮮。"}
  - {jp: "昼間は、近くの川で泳ぎました。", kana: "ひるまは、ちかくの かわで およぎました。", zh: "白天在附近的河裡游泳。"}
  - {jp: "川の水は冷たくて、気持ちがよかったです。", kana: "かわの みずは つめたくて、きもちが よかったです。", zh: "河水冰涼，很舒服。"}
  - {jp: "魚を捕まえようとしましたが、なかなか捕まえられませんでした。", kana: "さかなを つかまえようと しましたが、なかなか つかまえられませんでした。", zh: "想抓魚，但怎麼也抓不到。"}
  - {jp: "夕方になると、みんなで花火をしました。", kana: "ゆうがたに なると、みんなで はなびを しました。", zh: "一到傍晚，大家一起放煙火。"}
  - {jp: "小さい花火でしたが、とても楽しかったです。", kana: "ちいさい はなびでしたが、とても たのしかったです。", zh: "雖然是小煙火，但很開心。"}
  - {jp: "夜は、縁側に座って、すいかを食べました。", kana: "よるは、えんがわに すわって、すいかを たべました。", zh: "晚上坐在簷廊吃西瓜。"}
  - {jp: "祖母が、昔の話をたくさんしてくれました。", kana: "そぼが、むかしの はなしを たくさん して くれました。", zh: "祖母講了很多以前的故事。"}
  - {jp: "祖母が若いころの村の話は、とても面白かったです。", kana: "そぼが わかい ころの むらの はなしは、とても おもしろかったです。", zh: "祖母年輕時的村莊故事很有趣。"}
  - {jp: "お盆には、家族や親戚が集まりました。", kana: "おぼんには、かぞくや しんせきが あつまりました。", zh: "盂蘭盆節時，家人和親戚都聚在一起。"}
  - {jp: "みんなで、お墓参りに行きました。", kana: "みんなで、おはかまいりに いきました。", zh: "大家一起去掃墓。"}
  - {jp: "夜には、村のお祭りがありました。", kana: "よるには、むらの おまつりが ありました。", zh: "晚上有村裡的祭典。"}
  - {jp: "わたしは浴衣を着て、祖母とお祭りへ行きました。", kana: "わたしは ゆかたを きて、そぼと おまつりへ いきました。", zh: "我穿著浴衣，和祖母去祭典。"}
  - {jp: "屋台で、たこ焼きやかき氷を買いました。", kana: "やたいで、たこやきや かきごおりを かいました。", zh: "在攤販買了章魚燒和剉冰。"}
  - {jp: "太鼓の音に合わせて、みんなで踊りました。", kana: "たいこの おとに あわせて、みんなで おどりました。", zh: "配合太鼓的聲音，大家一起跳舞。"}
  - {jp: "提灯の明かりが、とてもきれいでした。", kana: "ちょうちんの あかりが、とても きれいでした。", zh: "燈籠的光非常漂亮。"}
  - {jp: "夏休みが終わるのが、いつも寂しかったです。", kana: "なつやすみが おわるのが、いつも さびしかったです。", zh: "暑假結束時總是很捨不得。"}
  - {jp: "帰る日、祖母はたくさんの野菜を持たせてくれました。", kana: "かえる ひ、そぼは たくさんの やさいを もたせて くれました。", zh: "回去那天，祖母讓我帶了好多蔬菜。"}
  - {jp: "「また来年も来てね」と、手を振ってくれました。", kana: "また らいねんも きてねと、てを ふって くれました。", zh: "她揮著手說「明年也要再來喔」。"}
  - {jp: "バスが見えなくなるまで、祖母は立っていました。", kana: "ばすが みえなく なるまで、そぼは たって いました。", zh: "祖母一直站到看不見公車為止。"}
  - {jp: "その姿を、今でもはっきり覚えています。", kana: "その すがたを、いまでも はっきり おぼえて います。", zh: "那身影我現在還記得很清楚。"}
  - {jp: "わたしが大きくなってから、村も少し変わりました。", kana: "わたしが おおきく なってから、むらも すこし かわりました。", zh: "我長大後，村子也變了一些。"}
  - {jp: "若い人が減って、空き家が増えたそうです。", kana: "わかい ひとが へって、あきやが ふえたそうです。", zh: "聽說年輕人變少，空屋變多了。"}
  - {jp: "祖父は、数年前に亡くなりました。", kana: "そふは、すうねんまえに なくなりました。", zh: "祖父在幾年前過世了。"}
  - {jp: "今は、祖母が一人で暮らしています。", kana: "いまは、そぼが ひとりで くらして います。", zh: "現在祖母一個人生活。"}
  - {jp: "忙しくて、なかなか会いに行けません。", kana: "いそがしくて、なかなか あいに いけません。", zh: "因為忙，很難得去見她。"}
  - {jp: "でも、電話では、よく話しています。", kana: "でも、でんわでは、よく はなして います。", zh: "不過常常用電話聊天。"}
  - {jp: "祖母は、いつも「無理をしないでね」と言います。", kana: "そぼは、いつも むりを しないでねと いいます。", zh: "祖母總是說「別太勉強自己喔」。"}
  - {jp: "その優しい声を聞くと、子供のころを思い出します。", kana: "その やさしい こえを きくと、こどもの ころを おもいだします。", zh: "聽到那溫柔的聲音，就想起小時候。"}
  - {jp: "大人になって、分かったことがあります。", kana: "おとなに なって、わかった ことが あります。", zh: "長大後，我明白了一件事。"}
  - {jp: "あの田舎の生活は、本当に豊かだったということです。", kana: "あの いなかの せいかつは、ほんとうに ゆたかだったと いう ことです。", zh: "那就是鄉下的生活其實非常富足。"}
  - {jp: "物は多くなくても、心は満たされていました。", kana: "ものは おおく なくても、こころは みたされて いました。", zh: "東西雖然不多，但心靈很充實。"}
  - {jp: "自然の中で過ごした時間は、お金では買えません。", kana: "しぜんの なかで すごした じかんは、おかねでは かえません。", zh: "在大自然中度過的時光，是金錢買不到的。"}
  - {jp: "今度の休みには、ぜひ祖母の家へ行きたいです。", kana: "こんどの やすみには、ぜひ そぼの いえへ いきたいです。", zh: "下次放假，一定要去祖母家。"}
  - {jp: "そして、また一緒に、星を見たいです。", kana: "そして、また いっしょに、ほしを みたいです。", zh: "然後，想再和她一起看星星。"}
  - {jp: "祖母との思い出は、わたしの宝物です。", kana: "そぼとの おもいでは、わたしの たからものです。", zh: "和祖母的回憶，是我的寶物。"}
