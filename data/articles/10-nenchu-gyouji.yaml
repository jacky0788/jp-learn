title: 日本の年中行事（日本的節慶活動）
level: N4
order: 100
intro: |
  介紹日本一年的主要節慶，複習日期、もらえる、ながら、〜てみたい。
body:
  - {jp: "日本には、一年を通して、いろいろな行事があります。", kana: "にほんには、いちねんを とおして、いろいろな ぎょうじが あります。", zh: "日本一整年有各式各樣的節慶活動。"}
  - {jp: "一月一日は、お正月です。", kana: "いちがつ ついたちは、おしょうがつです。", zh: "一月一日是新年。"}
  - {jp: "お正月には、家族が集まって、おせち料理を食べます。", kana: "おしょうがつには、かぞくが あつまって、おせちりょうりを たべます。", zh: "過年時家人團聚，吃年節料理。"}
  - {jp: "子供は、大人からお年玉をもらえるので、うれしそうです。", kana: "こどもは、おとなから おとしだまを もらえるので、うれしそうです。", zh: "小孩能拿到大人給的紅包，看起來很開心。"}
  - {jp: "二月には、節分という行事があります。", kana: "にがつには、せつぶんと いう ぎょうじが あります。", zh: "二月有個叫「節分」的活動。"}
  - {jp: "「鬼は外、福は内」と言いながら、豆をまきます。", kana: "おには そと、ふくは うちと いいながら、まめを まきます。", zh: "邊喊「鬼出去、福進來」邊撒豆子。"}
  - {jp: "三月三日は、女の子のお祭り、ひな祭りです。", kana: "さんがつ みっかは、おんなのこの おまつり、ひなまつりです。", zh: "三月三日是女孩的節日「女兒節」。"}
  - {jp: "四月になると、新しい学校や会社が始まります。", kana: "しがつに なると、あたらしい がっこうや かいしゃが はじまります。", zh: "一到四月，新的學校和公司就開始了。"}
  - {jp: "桜の下で、お花見をする人も多いです。", kana: "さくらの したで、おはなみを する ひとも おおいです。", zh: "也很多人在櫻花下賞花。"}
  - {jp: "夏には、各地で夏祭りが行われます。", kana: "なつには、かくちで なつまつりが おこなわれます。", zh: "夏天各地會舉辦夏日祭典。"}
  - {jp: "浴衣を着て、花火を見るのは、夏の楽しみです。", kana: "ゆかたを きて、はなびを みるのは、なつの たのしみです。", zh: "穿浴衣看煙火是夏天的樂趣。"}
  - {jp: "秋には、お月見をして、月を眺めます。", kana: "あきには、おつきみを して、つきを ながめます。", zh: "秋天會賞月、眺望月亮。"}
  - {jp: "十二月二十五日は、クリスマスです。", kana: "じゅうにがつ にじゅうごにちは、くりすますです。", zh: "十二月二十五日是聖誕節。"}
  - {jp: "日本では、家族や恋人と楽しく過ごします。", kana: "にほんでは、かぞくや こいびとと たのしく すごします。", zh: "在日本會和家人或情人愉快地度過。"}
  - {jp: "そして、十二月三十一日の夜は、大晦日です。", kana: "そして、じゅうにがつ さんじゅういちにちの よるは、おおみそかです。", zh: "然後十二月三十一日晚上是除夕。"}
  - {jp: "多くの人が、年越しそばを食べます。", kana: "おおくの ひとが、としこしそばを たべます。", zh: "很多人會吃跨年蕎麥麵。"}
  - {jp: "行事を知ると、その国の文化がよく分かります。", kana: "ぎょうじを しると、その くにの ぶんかが よく わかります。", zh: "了解節慶，就能更明白那個國家的文化。"}
  - {jp: "いつか、日本でこれらの行事に参加してみたいです。", kana: "いつか、にほんで これらの ぎょうじに さんかして みたいです。", zh: "希望有一天能在日本參加這些活動。"}
