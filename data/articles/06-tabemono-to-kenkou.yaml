title: 好きな食べ物と健康（喜歡的食物與健康）
level: N4
order: 60
intro: |
  用「やすい／にくい」「すぎる」「〜ないと」「ようにする」談飲食與健康。
body:
  - {jp: "わたしは、食べることが大好きです。", kana: "わたしは、たべることが だいすきです。", zh: "我非常喜歡吃東西。"}
  - {jp: "特に、麺類が好きです。", kana: "とくに、めんるいが すきです。", zh: "特別喜歡麵類。"}
  - {jp: "ラーメンは、おいしくて、食べやすいです。", kana: "らーめんは、おいしくて、たべやすいです。", zh: "拉麵又好吃又好入口。"}
  - {jp: "でも、カニは食べにくいので、あまり注文しません。", kana: "でも、かには たべにくいので、あまり ちゅうもんしません。", zh: "但螃蟹不好吃（不好剝），所以不太點。"}
  - {jp: "甘いものも好きですが、食べすぎると、体によくありません。", kana: "あまい ものも すきですが、たべすぎると、からだに よく ありません。", zh: "雖然也喜歡甜食，但吃太多對身體不好。"}
  - {jp: "先週、ケーキを食べすぎて、お腹が痛くなりました。", kana: "せんしゅう、けーきを たべすぎて、おなかが いたく なりました。", zh: "上週蛋糕吃太多，肚子痛了。"}
  - {jp: "それから、野菜もたくさん食べるようにしています。", kana: "それから、やさいも たくさん たべる ように して います。", zh: "之後我就盡量多吃蔬菜。"}
  - {jp: "朝ごはんを食べないと、元気が出ません。", kana: "あさごはんを たべないと、げんきが でません。", zh: "不吃早餐就沒精神。"}
  - {jp: "だから、忙しくても、朝は必ず何か食べます。", kana: "だから、いそがしくても、あさは かならず なにか たべます。", zh: "所以再忙，早上也一定吃點東西。"}
  - {jp: "健康のために、水もよく飲みます。", kana: "けんこうの ために、みずも よく のみます。", zh: "為了健康，我也常喝水。"}
  - {jp: "運動した後の食事は、本当においしいです。", kana: "うんどうした あとの しょくじは、ほんとうに おいしいです。", zh: "運動後吃的飯真的很好吃。"}
  - {jp: "おいしいものを食べて、元気に過ごしたいです。", kana: "おいしい ものを たべて、げんきに すごしたいです。", zh: "想吃好吃的東西，健康有活力地生活。"}
