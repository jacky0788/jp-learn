title: 初めてのアルバイト（長文・第一次打工）
level: N4（長文）
order: 220
intro: |
  在便利商店第一次打工的故事與成長。較長的文章（約5分鐘），用てもらう、てくれる、ようになる、ことにする。
body:
  - {jp: "去年、わたしは初めてアルバイトを始めました。", kana: "きょねん、わたしは はじめて あるばいとを はじめました。", zh: "去年，我第一次開始打工。"}
  - {jp: "家の近くのコンビニで働くことにしました。", kana: "いえの ちかくの こんびにで はたらく ことに しました。", zh: "我決定在家附近的便利商店工作。"}
  - {jp: "日本語の練習にもなると思ったからです。", kana: "にほんごの れんしゅうにも なると おもったからです。", zh: "因為我覺得也能練習日語。"}
  - {jp: "面接の日、わたしはとても緊張しました。", kana: "めんせつの ひ、わたしは とても きんちょうしました。", zh: "面試那天，我非常緊張。"}
  - {jp: "店長は、優しそうな人でした。", kana: "てんちょうは、やさしそうな ひとでした。", zh: "店長看起來是個和善的人。"}
  - {jp: "「いつから働けますか」と聞かれました。", kana: "いつから はたらけますかと きかれました。", zh: "他問我「什麼時候可以開始上班」。"}
  - {jp: "わたしは「来週から働けます」と答えました。", kana: "わたしは らいしゅうから はたらけますと こたえました。", zh: "我回答「下週可以開始」。"}
  - {jp: "こうして、わたしのアルバイトが始まりました。", kana: "こうして、わたしの あるばいとが はじまりました。", zh: "就這樣，我的打工開始了。"}
  - {jp: "最初の日は、覚えることがたくさんありました。", kana: "さいしょの ひは、おぼえる ことが たくさん ありました。", zh: "第一天有很多要記的東西。"}
  - {jp: "レジの使い方を、先輩に教えてもらいました。", kana: "れじの つかいかたを、せんぱいに おしえて もらいました。", zh: "收銀機的用法是前輩教我的。"}
  - {jp: "商品の場所も、少しずつ覚えました。", kana: "しょうひんの ばしょも、すこしずつ おぼえました。", zh: "商品的位置也一點一點記起來。"}
  - {jp: "「いらっしゃいませ」と言うのは、簡単そうで難しかったです。", kana: "いらっしゃいませと いうのは、かんたんそうで むずかしかったです。", zh: "說「歡迎光臨」看似簡單卻很難。"}
  - {jp: "最初は声が小さくて、よく注意されました。", kana: "さいしょは こえが ちいさくて、よく ちゅういされました。", zh: "一開始聲音太小，常被提醒。"}
  - {jp: "お金の計算を間違えたことも、何度かあります。", kana: "おかねの けいさんを まちがえた ことも、なんども あります。", zh: "算錢也算錯過好幾次。"}
  - {jp: "その時は、本当に恥ずかしかったです。", kana: "その ときは、ほんとうに はずかしかったです。", zh: "那時候真的很丟臉。"}
  - {jp: "でも、店長は「だれでも最初は失敗するよ」と言ってくれました。", kana: "でも、てんちょうは だれでも さいしょは しっぱいするよと いって くれました。", zh: "但店長對我說「誰一開始都會失敗的」。"}
  - {jp: "その言葉に、とても助けられました。", kana: "その ことばに、とても たすけられました。", zh: "那句話幫了我很大的忙。"}
  - {jp: "だんだん、仕事に慣れてきました。", kana: "だんだん、しごとに なれて きました。", zh: "漸漸地，我習慣了工作。"}
  - {jp: "お客さんと、少し話せるようにもなりました。", kana: "おきゃくさんと、すこし はなせる ようにも なりました。", zh: "也變得能和客人稍微聊幾句。"}
  - {jp: "「ありがとう」と言われると、うれしくなります。", kana: "ありがとうと いわれると、うれしく なります。", zh: "被說「謝謝」就會很開心。"}
  - {jp: "特に、お年寄りのお客さんは、いつも優しいです。", kana: "とくに、おとしよりの おきゃくさんは、いつも やさしいです。", zh: "尤其年長的客人總是很親切。"}
  - {jp: "ある日、外国人のお客さんが来ました。", kana: "ある ひ、がいこくじんの おきゃくさんが きました。", zh: "有一天，來了一位外國客人。"}
  - {jp: "その人は、道が分からなくて、困っていました。", kana: "その ひとは、みちが わからなくて、こまって いました。", zh: "那個人不知道路，很困擾。"}
  - {jp: "わたしは、日本語と英語で説明してあげました。", kana: "わたしは、にほんごと えいごで せつめいして あげました。", zh: "我用日語和英語幫他說明。"}
  - {jp: "その人は、「助かりました」と言って、笑顔で帰りました。", kana: "その ひとは、たすかりましたと いって、えがおで かえりました。", zh: "那個人說「幫了大忙」，笑著離開了。"}
  - {jp: "その日は、一日中いい気分でした。", kana: "その ひは、いちにちじゅう いい きぶんでした。", zh: "那天一整天心情都很好。"}
  - {jp: "アルバイトをして、いろいろなことを学びました。", kana: "あるばいとを して、いろいろな ことを まなびました。", zh: "透過打工，我學到很多事。"}
  - {jp: "お金を稼ぐのは、簡単ではありません。", kana: "おかねを かせぐのは、かんたんでは ありません。", zh: "賺錢並不簡單。"}
  - {jp: "親が毎日働いてくれることに、感謝するようになりました。", kana: "おやが まいにち はたらいて くれる ことに、かんしゃする ように なりました。", zh: "我變得感謝父母每天為我工作。"}
  - {jp: "それに、敬語の使い方も上手になりました。", kana: "それに、けいごの つかいかたも じょうずに なりました。", zh: "而且，敬語的用法也變熟練了。"}
  - {jp: "教科書では学べないことを、たくさん経験しました。", kana: "きょうかしょでは まなべない ことを、たくさん けいけんしました。", zh: "我體驗了很多課本上學不到的事。"}
  - {jp: "もちろん、大変なこともあります。", kana: "もちろん、たいへんな ことも あります。", zh: "當然，也有辛苦的時候。"}
  - {jp: "忙しい時間は、立ちっぱなしで、足が疲れます。", kana: "いそがしい じかんは、たちっぱなしで、あしが つかれます。", zh: "忙的時候一直站著，腳很累。"}
  - {jp: "試験の前は、勉強との両立が難しいです。", kana: "しけんの まえは、べんきょうとの りょうりつが むずかしいです。", zh: "考試前，和讀書兩邊兼顧很難。"}
  - {jp: "でも、自分で稼いだお金は、特別です。", kana: "でも、じぶんで かせいだ おかねは、とくべつです。", zh: "但自己賺的錢很特別。"}
  - {jp: "最初の給料で、両親にプレゼントを買いました。", kana: "さいしょの きゅうりょうで、りょうしんに ぷれぜんとを かいました。", zh: "用第一份薪水幫父母買了禮物。"}
  - {jp: "両親は、とても喜んでくれました。", kana: "りょうしんは、とても よろこんで くれました。", zh: "父母非常高興。"}
  - {jp: "「立派になったね」と言われて、うれしかったです。", kana: "りっぱに なったねと いわれて、うれしかったです。", zh: "被說「你長大了呢」，我很開心。"}
  - {jp: "今では、アルバイトは、わたしの生活の一部です。", kana: "いまでは、あるばいとは、わたしの せいかつの いちぶです。", zh: "現在打工已是我生活的一部分。"}
  - {jp: "いい先輩や仲間にも、出会えました。", kana: "いい せんぱいや なかまにも、であえました。", zh: "也遇到了好前輩和好夥伴。"}
  - {jp: "仕事の後で、みんなでごはんを食べることもあります。", kana: "しごとの あとで、みんなで ごはんを たべる ことも あります。", zh: "下班後，有時大家會一起吃飯。"}
  - {jp: "アルバイトを始めて、本当によかったと思います。", kana: "あるばいとを はじめて、ほんとうに よかったと おもいます。", zh: "我覺得開始打工真是太好了。"}
  - {jp: "働くことの大変さと、楽しさが分かりました。", kana: "はたらく ことの たいへんさと、たのしさが わかりました。", zh: "我明白了工作的辛苦和樂趣。"}
  - {jp: "これからも、勉強とアルバイトを、両方がんばりたいです。", kana: "これからも、べんきょうと あるばいとを、りょうほう がんばりたいです。", zh: "今後也想在讀書和打工兩方面都努力。"}
  - {jp: "そして、もっといろいろな人と、話せるようになりたいです。", kana: "そして、もっと いろいろな ひとと、はなせる ように なりたいです。", zh: "並且，希望能和更多不同的人交談。"}
