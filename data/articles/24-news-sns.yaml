title: "スマホとSNSの社会（智慧手機與社群社會・新聞長文）"
level: "N4（長文）"
order: 380
intro: |
  這是一篇關於智慧手機與社群網站（SNS）的長篇朗讀文章。談便利之處、令人擔心的地方，以及如何聰明使用。
  文法以 N4 為主：です・ます體、〜やすい／〜にくい、〜すぎる、〜たほうがいい、〜なければなりません、〜ことができる、〜と思います。
body:
  - {jp: "最近、スマホはわたしたちの生活になくてはならないものになりました。", kana: "さいきん、スマホは わたしたちの せいかつに なくては ならない ものに なりました。", zh: "最近，智慧手機已成為我們生活中不可或缺的東西。"}
  - {jp: "朝起きて、まずスマホを見る人が多いです。", kana: "あさ おきて、まず スマホを みる ひとが おおいです。", zh: "很多人早上起床後，第一件事就是看手機。"}
  - {jp: "{{夜|よる}}{{寝|ね}}る{{前|まえ}}にも、スマホをさわります。", kana: "よる ねる まえにも、スマホを さわります。", zh: "晚上睡覺前也會滑手機。"}
  - {jp: "電車の中を見ると、ほとんどの人がスマホを見ています。", kana: "でんしゃの なかを みると、ほとんどの ひとが スマホを みて います。", zh: "看看電車裡，幾乎所有人都在看手機。"}
  - {jp: "歩きながらスマホを使う人もいます。", kana: "あるきながら スマホを つかう ひとも います。", zh: "也有人邊走路邊用手機。"}
  - {jp: "今では、スマホがない生活は考えにくいです。", kana: "いまでは、スマホが ない せいかつは かんがえにくいです。", zh: "如今很難想像沒有手機的生活。"}
  - {jp: "わたしも、毎日スマホを使っています。", kana: "わたしも、まいにち スマホを つかって います。", zh: "我也是每天都在用手機。"}
  - {jp: "そして、SNSもよく使います。", kana: "そして、えすえぬえすも よく つかいます。", zh: "而且也常用社群網站。"}
  - {jp: "SNSとは、インターネットの上で人とつながるサービスです。", kana: "えすえぬえすとは、インターネットの うえで ひとと つながる サービスです。", zh: "所謂 SNS，是在網路上與人連結的服務。"}
  - {jp: "写真や短い文をのせて、みんなと話すことができます。", kana: "しゃしんや みじかい ぶんを のせて、みんなと はなす ことが できます。", zh: "可以發照片或短文，和大家交流。"}
  - {jp: "今日は、スマホとSNSについて考えてみたいです。", kana: "きょうは、スマホと えすえぬえすに ついて かんがえて みたいです。", zh: "今天想來思考一下手機和 SNS。"}
  - {jp: "まず、便利な点から話します。", kana: "まず、べんりな てんから はなします。", zh: "首先，從方便的地方說起。"}
  - {jp: "スマホのいちばん便利な点は、連絡がかんたんなことです。", kana: "スマホの いちばん べんりな てんは、れんらくが かんたんな ことです。", zh: "手機最方便的一點，就是聯絡很簡單。"}
  - {jp: "遠くにいる友達とも、すぐに話せます。", kana: "とおくに いる ともだちとも、すぐに はなせます。", zh: "和遠方的朋友也能馬上交談。"}
  - {jp: "メッセージを送れば、すぐに返事がきます。", kana: "メッセージを おくれば、すぐに へんじが きます。", zh: "傳訊息的話，馬上就有回覆。"}
  - {jp: "電話もできるし、ビデオ通話もできます。", kana: "でんわも できるし、ビデオつうわも できます。", zh: "可以打電話，也可以視訊通話。"}
  - {jp: "外国にいる家族の顔を見ながら話せます。", kana: "がいこくに いる かぞくの かおを みながら はなせます。", zh: "可以一邊看著在國外家人的臉一邊聊天。"}
  - {jp: "昔は、手紙を書いて送っていました。", kana: "むかしは、てがみを かいて おくって いました。", zh: "以前是寫信寄出去的。"}
  - {jp: "返事がくるまで、何日もかかりました。", kana: "へんじが くるまで、なんにちも かかりました。", zh: "等回信要花好幾天。"}
  - {jp: "今は、その時間がとても短くなりました。", kana: "いまは、その じかんが とても みじかく なりました。", zh: "現在那段時間變得非常短。"}
  - {jp: "これは、本当にすごいことだと思います。", kana: "これは、ほんとうに すごい ことだと おもいます。", zh: "我覺得這真的很厲害。"}
  - {jp: "次に、情報を集めるのも便利です。", kana: "つぎに、じょうほうを あつめるのも べんりです。", zh: "其次，收集資訊也很方便。"}
  - {jp: "知りたいことがあれば、すぐに調べられます。", kana: "しりたい ことが あれば、すぐに しらべられます。", zh: "有想知道的事，馬上就能查。"}
  - {jp: "天気やニュースも、その場で分かります。", kana: "てんきや ニュースも、そのばで わかります。", zh: "天氣和新聞，當場就能知道。"}
  - {jp: "電車の時間も、地図も、スマホで見られます。", kana: "でんしゃの じかんも、ちずも、スマホで みられます。", zh: "電車時刻和地圖，都能用手機看。"}
  - {jp: "知らない町でも、道にまよいにくいです。", kana: "しらない まちでも、みちに まよいにくいです。", zh: "就算在陌生的城市，也不容易迷路。"}
  - {jp: "料理の作り方も、動画で見ることができます。", kana: "りょうりの つくりかたも、どうがで みる ことが できます。", zh: "做菜的方法，也能看影片學。"}
  - {jp: "外国語の勉強にも、スマホは役に立ちます。", kana: "がいこくごの べんきょうにも、スマホは やくに たちます。", zh: "對學外語來說，手機也很有幫助。"}
  - {jp: "わたしも、アプリで日本語を勉強しています。", kana: "わたしも、アプリで にほんごを べんきょうして います。", zh: "我也用 APP 在學日語。"}
  - {jp: "分からない言葉は、すぐに調べます。", kana: "わからない ことばは、すぐに しらべます。", zh: "不懂的詞，馬上就查。"}
  - {jp: "本を持って歩かなくても、たくさん読めます。", kana: "ほんを もって あるかなくても、たくさん よめます。", zh: "不用帶著書走，也能讀很多東西。"}
  - {jp: "買い物も、スマホでかんたんにできます。", kana: "かいものも、スマホで かんたんに できます。", zh: "購物也能用手機輕鬆完成。"}
  - {jp: "店に行かなくても、家で注文できます。", kana: "みせに いかなくても、いえで ちゅうもんできます。", zh: "不用去店裡，在家就能下單。"}
  - {jp: "お金の支払いも、スマホでできるようになりました。", kana: "おかねの しはらいも、スマホで できる ように なりました。", zh: "付錢也變得可以用手機支付了。"}
  - {jp: "さいふを持たない人も、増えています。", kana: "さいふを もたない ひとも、ふえて います。", zh: "不帶錢包的人也在增加。"}
  - {jp: "そして、SNSの便利な点も多いです。", kana: "そして、えすえぬえすの べんりな てんも おおいです。", zh: "而且，SNS 方便的地方也很多。"}
  - {jp: "SNSを使えば、友達とかんたんにつながれます。", kana: "えすえぬえすを つかえば、ともだちと かんたんに つながれます。", zh: "用 SNS 的話，能輕鬆和朋友連結。"}
  - {jp: "遠くに引っこした友達とも、また話せます。", kana: "とおくに ひっこした ともだちとも、また はなせます。", zh: "和搬到遠方的朋友，也能再聯絡。"}
  - {jp: "昔のクラスメートを見つけることもあります。", kana: "むかしの クラスメートを みつける ことも あります。", zh: "有時還能找到以前的同學。"}
  - {jp: "自分の写真をのせて、みんなに見せられます。", kana: "じぶんの しゃしんを のせて、みんなに みせられます。", zh: "可以發自己的照片，給大家看。"}
  - {jp: "旅行の写真をのせると、友達からコメントがもらえます。", kana: "りょこうの しゃしんを のせると、ともだちから コメントが もらえます。", zh: "上傳旅行的照片，就能收到朋友的留言。"}
  - {jp: "「いいね」をもらうと、うれしくなります。", kana: "いいねを もらうと、うれしく なります。", zh: "收到「讚」會覺得開心。"}
  - {jp: "同じしゅみの人と、知り合うこともできます。", kana: "おなじ しゅみの ひとと、しりあう ことも できます。", zh: "也能認識有相同興趣的人。"}
  - {jp: "音楽が好きな人、料理が好きな人が集まります。", kana: "おんがくが すきな ひと、りょうりが すきな ひとが あつまります。", zh: "喜歡音樂、喜歡料理的人會聚在一起。"}
  - {jp: "国がちがっても、友達になれます。", kana: "くにが ちがっても、ともだちに なれます。", zh: "就算國家不同，也能成為朋友。"}
  - {jp: "世界が近くなったように感じます。", kana: "せかいが ちかく なった ように かんじます。", zh: "感覺世界變近了。"}
  - {jp: "困っている人を、みんなで助けることもあります。", kana: "こまって いる ひとを、みんなで たすける ことも あります。", zh: "有時大家還會一起幫助有困難的人。"}
  - {jp: "大きな地震のとき、SNSで家族に「だいじょうぶ」と知らせた人もいます。", kana: "おおきな じしんの とき、えすえぬえすで かぞくに だいじょうぶと しらせた ひとも います。", zh: "大地震時，也有人用 SNS 向家人報平安。"}
  - {jp: "このように、スマホとSNSには、いい点がたくさんあります。", kana: "このように、スマホと えすえぬえすには、いい てんが たくさん あります。", zh: "像這樣，手機和 SNS 有很多好處。"}
  - {jp: "でも、心配な点もあります。", kana: "でも、しんぱいな てんも あります。", zh: "但是，也有令人擔心的地方。"}
  - {jp: "ここからは、そのことについて話します。", kana: "ここからは、その ことに ついて はなします。", zh: "接下來要談這件事。"}
  - {jp: "いちばんの問題は、使いすぎることです。", kana: "いちばんの もんだいは、つかいすぎる ことです。", zh: "最大的問題是用得太多。"}
  - {jp: "スマホは、おもしろいので、つい長く見てしまいます。", kana: "スマホは、おもしろいので、つい ながく みて しまいます。", zh: "手機很有趣，所以不知不覺就看很久。"}
  - {jp: "少しだけ見るつもりが、何時間もたっていることがあります。", kana: "すこしだけ みる つもりが、なんじかんも たって いる ことが あります。", zh: "本來只想看一下，結果常常過了好幾個小時。"}
  - {jp: "新しい動画や写真が、次から次へと出てきます。", kana: "あたらしい どうがや しゃしんが、つぎから つぎへと でて きます。", zh: "新的影片和照片，一個接一個地出現。"}
  - {jp: "だから、なかなかやめられません。", kana: "だから、なかなか やめられません。", zh: "所以很難停下來。"}
  - {jp: "気がつくと、時間がなくなっています。", kana: "きが つくと、じかんが なくなって います。", zh: "回過神來，時間已經沒了。"}
  - {jp: "勉強や仕事の時間が減ってしまいます。", kana: "べんきょうや しごとの じかんが へって しまいます。", zh: "讀書或工作的時間就減少了。"}
  - {jp: "やらなければならないことが、できなくなります。", kana: "やらなければ ならない ことが、できなく なります。", zh: "該做的事就做不完了。"}
  - {jp: "とくに心配なのは、寝る時間が減ることです。", kana: "とくに しんぱいなのは、ねる じかんが へる ことです。", zh: "特別令人擔心的是睡眠時間減少。"}
  - {jp: "夜おそくまでスマホを見てしまう人が多いです。", kana: "よる おそくまで スマホを みて しまう ひとが おおいです。", zh: "很多人會看手機看到很晚。"}
  - {jp: "ベッドの中でも、なかなかやめられません。", kana: "ベッドの なかでも、なかなか やめられません。", zh: "就算躺在床上，也很難停下來。"}
  - {jp: "スマホの明るい光は、目によくないそうです。", kana: "スマホの あかるい ひかりは、めに よくないそうです。", zh: "據說手機明亮的光線對眼睛不好。"}
  - {jp: "その光を見ると、ねむくなりにくいと言われています。", kana: "その ひかりを みると、ねむく なりにくいと いわれて います。", zh: "據說看了那種光，會比較不容易想睡。"}
  - {jp: "だから、寝る時間がおそくなります。", kana: "だから、ねる じかんが おそく なります。", zh: "所以睡覺時間就變晚了。"}
  - {jp: "次の日、朝起きるのがつらくなります。", kana: "つぎの ひ、あさ おきるのが つらく なります。", zh: "隔天早上起床就變得很痛苦。"}
  - {jp: "あたまも、すっきりしません。", kana: "あたまも、すっきりしません。", zh: "頭腦也不清醒。"}
  - {jp: "じゅうぶん寝ないと、体によくありません。", kana: "じゅうぶん ねないと、からだに よくありません。", zh: "睡眠不足對身體不好。"}
  - {jp: "健康のためにも、夜はスマホをおいたほうがいいです。", kana: "けんこうの ためにも、よるは スマホを おいた ほうが いいです。", zh: "為了健康，晚上最好把手機放下。"}
  - {jp: "もう一つの心配は、うその情報です。", kana: "もう ひとつの しんぱいは、うその じょうほうです。", zh: "另一個擔心是假的資訊。"}
  - {jp: "インターネットには、本当の話も、うその話もあります。", kana: "インターネットには、ほんとうの はなしも、うその はなしも あります。", zh: "網路上有真的訊息，也有假的訊息。"}
  - {jp: "どちらが正しいか、すぐには分かりません。", kana: "どちらが ただしいか、すぐには わかりません。", zh: "哪個是對的，無法馬上知道。"}
  - {jp: "うその情報でも、すぐに広がってしまいます。", kana: "うその じょうほうでも、すぐに ひろがって しまいます。", zh: "就算是假資訊，也會馬上散播出去。"}
  - {jp: "たくさんの人が、それを信じてしまうことがあります。", kana: "たくさんの ひとが、それを しんじて しまう ことが あります。", zh: "有時很多人會相信那些假資訊。"}
  - {jp: "そして、まちがった情報を、またほかの人に伝えます。", kana: "そして、まちがった じょうほうを、また ほかの ひとに つたえます。", zh: "然後又把錯誤的資訊傳給別人。"}
  - {jp: "そうすると、うそはどんどん大きくなります。", kana: "そうすると、うそは どんどん おおきく なります。", zh: "這樣一來，謊言就越來越大。"}
  - {jp: "だから、見たことをすぐに信じないほうがいいです。", kana: "だから、みた ことを すぐに しんじない ほうが いいです。", zh: "所以，看到的事最好別馬上相信。"}
  - {jp: "本当に正しいか、よく考えることが大切です。", kana: "ほんとうに ただしいか、よく かんがえる ことが たいせつです。", zh: "好好思考是否真的正確很重要。"}
  - {jp: "一つのところだけでなく、ほかでも調べたほうがいいです。", kana: "ひとつの ところだけでなく、ほかでも しらべた ほうが いいです。", zh: "不要只看一個地方，最好也查查別處。"}
  - {jp: "うその情報を、自分から広げないことも大切です。", kana: "うその じょうほうを、じぶんから ひろげない ことも たいせつです。", zh: "不主動散播假資訊也很重要。"}
  - {jp: "もう一つの心配な点を話します。", kana: "もう ひとつの しんぱいな てんを はなします。", zh: "再來談另一個令人擔心的地方。"}
  - {jp: "それは、人と自分を比べてしまうことです。", kana: "それは、ひとと じぶんを くらべて しまう ことです。", zh: "那就是會拿別人和自己比較。"}
  - {jp: "SNSには、楽しそうな写真がたくさんあります。", kana: "えすえぬえすには、たのしそうな しゃしんが たくさん あります。", zh: "SNS 上有很多看起來很開心的照片。"}
  - {jp: "おいしい料理、きれいな場所、楽しい旅行。", kana: "おいしい りょうり、きれいな ばしょ、たのしい りょこう。", zh: "美味的料理、漂亮的地方、愉快的旅行。"}
  - {jp: "みんな、しあわせそうに見えます。", kana: "みんな、しあわせそうに みえます。", zh: "大家看起來都很幸福。"}
  - {jp: "それを見て、自分はどうだろうと思ってしまいます。", kana: "それを みて、じぶんは どうだろうと おもって しまいます。", zh: "看了之後，會忍不住想自己又如何呢。"}
  - {jp: "ほかの人は、楽しそうなのに、と感じます。", kana: "ほかの ひとは、たのしそうなのに、と かんじます。", zh: "會覺得別人明明那麼開心。"}
  - {jp: "自分だけ、つまらない生活だと思ってしまいます。", kana: "じぶんだけ、つまらない せいかつだと おもって しまいます。", zh: "覺得只有自己過著無聊的生活。"}
  - {jp: "でも、それは正しくありません。", kana: "でも、それは ただしくありません。", zh: "但是，那是不正確的。"}
  - {jp: "SNSにのせる写真は、いいところだけです。", kana: "えすえぬえすに のせる しゃしんは、いい ところだけです。", zh: "SNS 上的照片只有好的部分。"}
  - {jp: "みんな、いちばんいいしゅんかんをえらんでのせています。", kana: "みんな、いちばん いい しゅんかんを えらんで のせて います。", zh: "大家都選最好的瞬間發出來。"}
  - {jp: "つらいことや、こまったことは、あまりのせません。", kana: "つらい ことや、こまった ことは、あまり のせません。", zh: "難過的事、困擾的事，不太會發出來。"}
  - {jp: "だから、写真の中の生活が、ぜんぶ本当ではありません。", kana: "だから、しゃしんの なかの せいかつが、ぜんぶ ほんとうではありません。", zh: "所以照片裡的生活，並非全是真的。"}
  - {jp: "ほかの人にも、見えない苦労があります。", kana: "ほかの ひとにも、みえない くろうが あります。", zh: "別人也有看不見的辛苦。"}
  - {jp: "人と比べても、いいことはありません。", kana: "ひとと くらべても、いい ことは ありません。", zh: "和別人比較，也沒有好處。"}
  - {jp: "気持ちがくらくなってしまうだけです。", kana: "きもちが くらく なって しまう だけです。", zh: "只會讓心情變得灰暗而已。"}
  - {jp: "大切なのは、自分の生活を見ることです。", kana: "たいせつなのは、じぶんの せいかつを みる ことです。", zh: "重要的是看自己的生活。"}
