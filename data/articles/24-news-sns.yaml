title: "スマホとSNSの社会（智慧手機與社群社會・新聞長文）"
level: "N4（長文）"
order: 380
intro: |
  這是一篇關於智慧手機與社群網站（SNS）的長篇朗讀文章。談便利之處、令人擔心的地方，以及如何聰明使用。
  文法以 N4 為主：です・ます體、〜やすい／〜にくい、〜すぎる、〜たほうがいい、〜なければなりません、〜ことができる、〜と思います。
body:
  - {jp: "近年、スマホは わたしたちの 生活に 欠かせない ものに なりました。", kana: "きんねん、すまほは わたしたちの せいかつに かかせない ものに なりました。", zh: "近年來，智慧手機已成為我們生活中不可或缺的東西。"}
  - {jp: "朝 起きて、まず スマホを 見る 人が 多いです。", kana: "あさ おきて、まず すまほを みる ひとが おおいです。", zh: "很多人早上起床後，第一件事就是看手機。"}
  - {jp: "夜 寝る 前にも、スマホを さわります。", kana: "よる ねる まえにも、すまほを さわります。", zh: "晚上睡覺前也會滑手機。"}
  - {jp: "電車の 中を 見ると、ほとんどの 人が スマホを 見て います。", kana: "でんしゃの なかを みると、ほとんどの ひとが すまほを みて います。", zh: "看看電車裡，幾乎所有人都在看手機。"}
  - {jp: "歩きながら スマホを 使う 人も います。", kana: "あるきながら すまほを つかう ひとも います。", zh: "也有人邊走路邊用手機。"}
  - {jp: "今では、スマホが ない 生活は 考えにくいです。", kana: "いまでは、すまほが ない せいかつは かんがえにくいです。", zh: "如今很難想像沒有手機的生活。"}
  - {jp: "わたしも、毎日 スマホを 使って います。", kana: "わたしも、まいにち すまほを つかって います。", zh: "我也是每天都在用手機。"}
  - {jp: "そして、SNSも よく 使います。", kana: "そして、えすえぬえすも よく つかいます。", zh: "而且也常用社群網站。"}
  - {jp: "SNSとは、インターネットの 上で 人と つながる サービスです。", kana: "えすえぬえすとは、いんたーねっとの うえで ひとと つながる さーびすです。", zh: "所謂 SNS，是在網路上與人連結的服務。"}
  - {jp: "写真や 短い 文を 出して、みんなと 話す ことが できます。", kana: "しゃしんや みじかい ぶんを だして、みんなと はなす ことが できます。", zh: "可以發照片或短文，和大家交流。"}
  - {jp: "今日は、スマホと SNSに ついて 考えて みたいです。", kana: "きょうは、すまほと えすえぬえすに ついて かんがえて みたいです。", zh: "今天想來思考一下手機和 SNS。"}
  - {jp: "まず、便利な 点から 話します。", kana: "まず、べんりな てんから はなします。", zh: "首先，從方便的地方說起。"}
  - {jp: "スマホの いちばん 便利な 点は、連絡が かんたんな ことです。", kana: "すまほの いちばん べんりな てんは、れんらくが かんたんな ことです。", zh: "手機最方便的一點，就是聯絡很簡單。"}
  - {jp: "遠くに いる 友達とも、すぐに 話せます。", kana: "とおくに いる ともだちとも、すぐに はなせます。", zh: "和遠方的朋友也能馬上交談。"}
  - {jp: "メッセージを 送れば、すぐに 返事が きます。", kana: "めっせーじを おくれば、すぐに へんじが きます。", zh: "傳訊息的話，馬上就有回覆。"}
  - {jp: "電話も できるし、ビデオ通話も できます。", kana: "でんわも できるし、びでおつうわも できます。", zh: "可以打電話，也可以視訊通話。"}
  - {jp: "外国に いる 家族の 顔を 見ながら 話せます。", kana: "がいこくに いる かぞくの かおを みながら はなせます。", zh: "可以一邊看著在國外家人的臉一邊聊天。"}
  - {jp: "昔は、手紙を 書いて 送って いました。", kana: "むかしは、てがみを かいて おくって いました。", zh: "以前是寫信寄出去的。"}
  - {jp: "返事が くるまで、何日も かかりました。", kana: "へんじが くるまで、なんにちも かかりました。", zh: "等回信要花好幾天。"}
  - {jp: "今は、その 時間が とても 短く なりました。", kana: "いまは、その じかんが とても みじかく なりました。", zh: "現在那段時間變得非常短。"}
  - {jp: "これは、本当に すごい ことだと 思います。", kana: "これは、ほんとうに すごい ことだと おもいます。", zh: "我覺得這真的很厲害。"}
  - {jp: "次に、情報を 集めるのも 便利です。", kana: "つぎに、じょうほうを あつめるのも べんりです。", zh: "其次，收集資訊也很方便。"}
  - {jp: "知りたい ことが あれば、すぐに 調べられます。", kana: "しりたい ことが あれば、すぐに しらべられます。", zh: "有想知道的事，馬上就能查。"}
  - {jp: "天気や ニュースも、その場で 分かります。", kana: "てんきや にゅーすも、そのばで わかります。", zh: "天氣和新聞，當場就能知道。"}
  - {jp: "電車の 時間も、地図も、スマホで 見られます。", kana: "でんしゃの じかんも、ちずも、すまほで みられます。", zh: "電車時刻和地圖，都能用手機看。"}
  - {jp: "知らない 町でも、道に まよいにくいです。", kana: "しらない まちでも、みちに まよいにくいです。", zh: "就算在陌生的城市，也不容易迷路。"}
  - {jp: "料理の 作り方も、動画で 見る ことが できます。", kana: "りょうりの つくりかたも、どうがで みる ことが できます。", zh: "做菜的方法，也能看影片學。"}
  - {jp: "外国語の 勉強にも、スマホは 役に 立ちます。", kana: "がいこくごの べんきょうにも、すまほは やくに たちます。", zh: "對學外語來說，手機也很有幫助。"}
  - {jp: "わたしも、アプリで 日本語を 勉強して います。", kana: "わたしも、あぷりで にほんごを べんきょうして います。", zh: "我也用 APP 在學日語。"}
  - {jp: "分からない 言葉は、すぐに 調べます。", kana: "わからない ことばは、すぐに しらべます。", zh: "不懂的詞，馬上就查。"}
  - {jp: "本を 持って 歩かなくても、たくさん 読めます。", kana: "ほんを もって あるかなくても、たくさん よめます。", zh: "不用帶著書走，也能讀很多東西。"}
  - {jp: "買い物も、スマホで かんたんに できます。", kana: "かいものも、すまほで かんたんに できます。", zh: "購物也能用手機輕鬆完成。"}
  - {jp: "店に 行かなくても、家で 注文できます。", kana: "みせに いかなくても、いえで ちゅうもんできます。", zh: "不用去店裡，在家就能下單。"}
  - {jp: "お金の 支払いも、スマホで できる ように なりました。", kana: "おかねの しはらいも、すまほで できる ように なりました。", zh: "付錢也變得可以用手機支付了。"}
  - {jp: "さいふを 持たない 人も、増えて います。", kana: "さいふを もたない ひとも、ふえて います。", zh: "不帶錢包的人也在增加。"}
  - {jp: "そして、SNSの 便利な 点も 多いです。", kana: "そして、えすえぬえすの べんりな てんも おおいです。", zh: "而且，SNS 方便的地方也很多。"}
  - {jp: "SNSを 使えば、友達と かんたんに つながれます。", kana: "えすえぬえすを つかえば、ともだちと かんたんに つながれます。", zh: "用 SNS 的話，能輕鬆和朋友連結。"}
  - {jp: "遠くに 引っこした 友達とも、また 話せます。", kana: "とおくに ひっこした ともだちとも、また はなせます。", zh: "和搬到遠方的朋友，也能再聯絡。"}
  - {jp: "昔の クラスメートを 見つける ことも あります。", kana: "むかしの くらすめーとを みつける ことも あります。", zh: "有時還能找到以前的同學。"}
  - {jp: "自分の 写真を 出して、みんなに 見せられます。", kana: "じぶんの しゃしんを だして、みんなに みせられます。", zh: "可以發自己的照片，給大家看。"}
  - {jp: "旅行の 写真を 見て、コメントを もらえます。", kana: "りょこうの しゃしんを みて、こめんとを もらえます。", zh: "看了旅行的照片，能收到留言。"}
  - {jp: "「いいね」を もらうと、うれしく なります。", kana: "いいねを もらうと、うれしく なります。", zh: "收到「讚」會覺得開心。"}
  - {jp: "同じ しゅみの 人と、知り合う ことも できます。", kana: "おなじ しゅみの ひとと、しりあう ことも できます。", zh: "也能認識有相同興趣的人。"}
  - {jp: "音楽が 好きな 人、料理が 好きな 人が 集まります。", kana: "おんがくが すきな ひと、りょうりが すきな ひとが あつまります。", zh: "喜歡音樂、喜歡料理的人會聚在一起。"}
  - {jp: "国が ちがっても、友達に なれます。", kana: "くにが ちがっても、ともだちに なれます。", zh: "就算國家不同，也能成為朋友。"}
  - {jp: "世界が 近く なった ように 感じます。", kana: "せかいが ちかく なった ように かんじます。", zh: "感覺世界變近了。"}
  - {jp: "困って いる 人を、みんなで 助ける ことも あります。", kana: "こまって いる ひとを、みんなで たすける ことも あります。", zh: "有時大家還會一起幫助有困難的人。"}
  - {jp: "大きな 地震の とき、SNSで 安全を 知らせた 人も います。", kana: "おおきな じしんの とき、えすえぬえすで あんぜんを しらせた ひとも います。", zh: "大地震時，也有人用 SNS 報平安。"}
  - {jp: "このように、スマホと SNSには、いい 点が たくさん あります。", kana: "このように、すまほと えすえぬえすには、いい てんが たくさん あります。", zh: "像這樣，手機和 SNS 有很多好處。"}
  - {jp: "でも、心配な 点も あります。", kana: "でも、しんぱいな てんも あります。", zh: "但是，也有令人擔心的地方。"}
  - {jp: "ここからは、その ことに ついて 話します。", kana: "ここからは、その ことに ついて はなします。", zh: "接下來要談這件事。"}
  - {jp: "いちばんの 問題は、使いすぎる ことです。", kana: "いちばんの もんだいは、つかいすぎる ことです。", zh: "最大的問題是用得太多。"}
  - {jp: "スマホは、おもしろいので、つい 長く 見て しまいます。", kana: "すまほは、おもしろいので、つい ながく みて しまいます。", zh: "手機很有趣，所以不知不覺就看很久。"}
  - {jp: "少しだけ 見る つもりが、何時間も たって いる ことが あります。", kana: "すこしだけ みる つもりが、なんじかんも たって いる ことが あります。", zh: "本來只想看一下，結果常常過了好幾個小時。"}
  - {jp: "新しい 動画や 写真が、次から 次へと 出て きます。", kana: "あたらしい どうがや しゃしんが、つぎから つぎへと でて きます。", zh: "新的影片和照片，一個接一個地出現。"}
  - {jp: "だから、なかなか やめられません。", kana: "だから、なかなか やめられません。", zh: "所以很難停下來。"}
  - {jp: "気が つくと、時間が なくなって います。", kana: "きが つくと、じかんが なくなって います。", zh: "回過神來，時間已經沒了。"}
  - {jp: "勉強や 仕事の 時間が 減って しまいます。", kana: "べんきょうや しごとの じかんが へって しまいます。", zh: "讀書或工作的時間就減少了。"}
  - {jp: "やらなければ ならない ことが、できなく なります。", kana: "やらなければ ならない ことが、できなく なります。", zh: "該做的事就做不完了。"}
  - {jp: "とくに 心配なのは、寝る 時間が 減る ことです。", kana: "とくに しんぱいなのは、ねる じかんが へる ことです。", zh: "特別令人擔心的是睡眠時間減少。"}
  - {jp: "夜 おそくまで スマホを 見て しまう 人が 多いです。", kana: "よる おそくまで すまほを みて しまう ひとが おおいです。", zh: "很多人會看手機看到很晚。"}
  - {jp: "ベッドの 中でも、なかなか やめられません。", kana: "べっどの なかでも、なかなか やめられません。", zh: "就算躺在床上，也很難停下來。"}
  - {jp: "スマホの 明るい 光は、目に よくないそうです。", kana: "すまほの あかるい ひかりは、めに よくないそうです。", zh: "據說手機明亮的光線對眼睛不好。"}
  - {jp: "その 光を 見ると、ねむく なりにくいと 言われて います。", kana: "その ひかりを みると、ねむく なりにくいと いわれて います。", zh: "據說看了那種光，會比較不容易想睡。"}
  - {jp: "だから、寝る 時間が おそく なります。", kana: "だから、ねる じかんが おそく なります。", zh: "所以睡覺時間就變晚了。"}
  - {jp: "次の 日、朝 起きるのが つらく なります。", kana: "つぎの ひ、あさ おきるのが つらく なります。", zh: "隔天早上起床就變得很痛苦。"}
  - {jp: "あたまも、すっきりしません。", kana: "あたまも、すっきりしません。", zh: "頭腦也不清醒。"}
  - {jp: "じゅうぶん 寝ないと、体に よくありません。", kana: "じゅうぶん ねないと、からだに よくありません。", zh: "睡眠不足對身體不好。"}
  - {jp: "健康の ためにも、夜は スマホを おいた ほうが いいです。", kana: "けんこうの ためにも、よるは すまほを おいた ほうが いいです。", zh: "為了健康，晚上最好把手機放下。"}
  - {jp: "もう 一つの 心配は、うその 情報です。", kana: "もう ひとつの しんぱいは、うその じょうほうです。", zh: "另一個擔心是假的資訊。"}
  - {jp: "インターネットには、本当の 話も、うその 話も あります。", kana: "いんたーねっとには、ほんとうの はなしも、うその はなしも あります。", zh: "網路上有真的訊息，也有假的訊息。"}
  - {jp: "どちらが 正しいか、すぐには 分かりません。", kana: "どちらが ただしいか、すぐには わかりません。", zh: "哪個是對的，無法馬上知道。"}
  - {jp: "うその 情報でも、すぐに 広がって しまいます。", kana: "うその じょうほうでも、すぐに ひろがって しまいます。", zh: "就算是假資訊，也會馬上散播出去。"}
  - {jp: "たくさんの 人が、それを 信じて しまう ことが あります。", kana: "たくさんの ひとが、それを しんじて しまう ことが あります。", zh: "有時很多人會相信那些假資訊。"}
  - {jp: "そして、まちがった 情報を、また ほかの 人に 伝えます。", kana: "そして、まちがった じょうほうを、また ほかの ひとに つたえます。", zh: "然後又把錯誤的資訊傳給別人。"}
  - {jp: "そうすると、うそは どんどん 大きく なります。", kana: "そうすると、うそは どんどん おおきく なります。", zh: "這樣一來，謊言就越來越大。"}
  - {jp: "だから、見た ことを すぐに 信じない ほうが いいです。", kana: "だから、みた ことを すぐに しんじない ほうが いいです。", zh: "所以，看到的事最好別馬上相信。"}
  - {jp: "本当に 正しいか、よく 考える ことが 大切です。", kana: "ほんとうに ただしいか、よく かんがえる ことが たいせつです。", zh: "好好思考是否真的正確很重要。"}
  - {jp: "一つの ところだけでなく、ほかでも 調べた ほうが いいです。", kana: "ひとつの ところだけでなく、ほかでも しらべた ほうが いいです。", zh: "不要只看一個地方，最好也查查別處。"}
  - {jp: "うその 情報を、自分から 広げない ことも 大切です。", kana: "うその じょうほうを、じぶんから ひろげない ことも たいせつです。", zh: "不主動散播假資訊也很重要。"}
  - {jp: "もう 一つの 心配な 点を 話します。", kana: "もう ひとつの しんぱいな てんを はなします。", zh: "再來談另一個令人擔心的地方。"}
  - {jp: "それは、人と 自分を 比べて しまう ことです。", kana: "それは、ひとと じぶんを くらべて しまう ことです。", zh: "那就是會拿別人和自己比較。"}
  - {jp: "SNSには、楽しそうな 写真が たくさん あります。", kana: "えすえぬえすには、たのしそうな しゃしんが たくさん あります。", zh: "SNS 上有很多看起來很開心的照片。"}
  - {jp: "おいしい 料理、きれいな 場所、楽しい 旅行。", kana: "おいしい りょうり、きれいな ばしょ、たのしい りょこう。", zh: "美味的料理、漂亮的地方、愉快的旅行。"}
  - {jp: "みんな、しあわせそうに 見えます。", kana: "みんな、しあわせそうに みえます。", zh: "大家看起來都很幸福。"}
  - {jp: "それを 見て、自分は どうだろうと 思って しまいます。", kana: "それを みて、じぶんは どうだろうと おもって しまいます。", zh: "看了之後，會忍不住想自己又如何呢。"}
  - {jp: "ほかの 人は、楽しそうなのに、と 感じます。", kana: "ほかの ひとは、たのしそうなのに、と かんじます。", zh: "會覺得別人明明那麼開心。"}
  - {jp: "自分だけ、つまらない 生活だと 思って しまいます。", kana: "じぶんだけ、つまらない せいかつだと おもって しまいます。", zh: "覺得只有自己過著無聊的生活。"}
  - {jp: "でも、それは 正しくありません。", kana: "でも、それは ただしくありません。", zh: "但是，那是不正確的。"}
  - {jp: "SNSに 出る 写真は、いい ところだけです。", kana: "えすえぬえすに でる しゃしんは、いい ところだけです。", zh: "SNS 上的照片只有好的部分。"}
  - {jp: "みんな、いちばん いい しゅんかんを えらんで 出して います。", kana: "みんな、いちばん いい しゅんかんを えらんで だして います。", zh: "大家都選最好的瞬間發出來。"}
  - {jp: "つらい ことや、こまった ことは、あまり 出しません。", kana: "つらい ことや、こまった ことは、あまり だしません。", zh: "難過的事、困擾的事，不太會發出來。"}
  - {jp: "だから、写真の 中の 生活が、ぜんぶ 本当ではありません。", kana: "だから、しゃしんの なかの せいかつが、ぜんぶ ほんとうではありません。", zh: "所以照片裡的生活，並非全是真的。"}
