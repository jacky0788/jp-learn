title: 四季と天気（四季與天氣）
level: N4
order: 90
intro: |
  介紹日本的春夏秋冬，複習形容詞、できる、なる、〜やすい。
body:
  - {jp: "日本には、春、夏、秋、冬の四つの季節があります。", kana: "にほんには、はる、なつ、あき、ふゆの よっつの きせつが あります。", zh: "日本有春、夏、秋、冬四個季節。"}
  - {jp: "それぞれの季節に、いいところがあります。", kana: "それぞれの きせつに、いい ところが あります。", zh: "每個季節都有它的好處。"}
  - {jp: "春は、暖かくて、花がたくさん咲きます。", kana: "はるは、あたたかくて、はなが たくさん さきます。", zh: "春天很暖和，開很多花。"}
  - {jp: "いちばん有名なのは、桜です。", kana: "いちばん ゆうめいなのは、さくらです。", zh: "最有名的是櫻花。"}
  - {jp: "公園で、お弁当を食べながら、花を見る人が多いです。", kana: "こうえんで、おべんとうを たべながら、はなを みる ひとが おおいです。", zh: "很多人在公園邊吃便當邊賞花。"}
  - {jp: "夏は、とても暑くて、湿気が高いです。", kana: "なつは、とても あつくて、しっけが たかいです。", zh: "夏天很熱，濕度也高。"}
  - {jp: "でも、夏祭りや花火大会があって、楽しいです。", kana: "でも、なつまつりや はなびたいかいが あって、たのしいです。", zh: "但有夏日祭典和煙火大會，很開心。"}
  - {jp: "海やプールで泳ぐこともできます。", kana: "うみや ぷーるで およぐ ことも できます。", zh: "也可以在海邊或泳池游泳。"}
  - {jp: "秋は、涼しくて、過ごしやすい季節です。", kana: "あきは、すずしくて、すごしやすい きせつです。", zh: "秋天涼爽，是好過的季節。"}
  - {jp: "山の木が、赤や黄色になって、とてもきれいです。", kana: "やまの きが、あかや きいろに なって、とても きれいです。", zh: "山上的樹變紅變黃，非常漂亮。"}
  - {jp: "食べ物もおいしくて、「食欲の秋」と言います。", kana: "たべものも おいしくて、しょくよくの あきと いいます。", zh: "食物也好吃，稱作「食慾之秋」。"}
  - {jp: "冬は、寒くて、北のほうでは雪が降ります。", kana: "ふゆは、さむくて、きたのほうでは ゆきが ふります。", zh: "冬天很冷，北部會下雪。"}
  - {jp: "雪が積もると、町が白くなって、きれいです。", kana: "ゆきが つもると、まちが しろく なって、きれいです。", zh: "積雪時，城鎮變得雪白很漂亮。"}
  - {jp: "冬は、温かい鍋料理がおいしいです。", kana: "ふゆは、あたたかい なべりょうりが おいしいです。", zh: "冬天熱呼呼的火鍋很好吃。"}
  - {jp: "わたしがいちばん好きな季節は、秋です。", kana: "わたしが いちばん すきな きせつは、あきです。", zh: "我最喜歡的季節是秋天。"}
  - {jp: "暑くも寒くもなくて、いちばん過ごしやすいからです。", kana: "あつくも さむくも なくて、いちばん すごしやすいからです。", zh: "因為不熱也不冷，最舒服好過。"}
  - {jp: "みなさんは、どの季節がいちばん好きですか。", kana: "みなさんは、どの きせつが いちばん すきですか。", zh: "大家最喜歡哪個季節呢？"}
