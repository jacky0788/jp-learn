title: 日本語の勉強（學日語）
level: N4
order: 50
intro: |
  用可能形、たことがある（經驗）、から・ので、てもいい、ようにする 等講學習經驗。
body:
  - {jp: "日本語の勉強は、楽しいですが、簡単ではありません。", kana: "にほんごの べんきょうは、たのしいですが、かんたんでは ありません。", zh: "學日語很開心，但不簡單。"}
  - {jp: "漢字が多くて、覚えるのが大変です。", kana: "かんじが おおくて、おぼえるのが たいへんです。", zh: "漢字很多，背起來很辛苦。"}
  - {jp: "でも、毎日少しずつ練習しています。", kana: "でも、まいにち すこしずつ れんしゅうして います。", zh: "但我每天一點一點地練習。"}
  - {jp: "一年前は、ひらがなしか読めませんでした。", kana: "いちねんまえは、ひらがなしか よめませんでした。", zh: "一年前我只看得懂平假名。"}
  - {jp: "今は、簡単な文章なら読むことができます。", kana: "いまは、かんたんな ぶんしょうなら よむことが できます。", zh: "現在簡單的文章我已經能讀了。"}
  - {jp: "日本のアニメを、字幕なしで見たことがあります。", kana: "にほんの あにめを、じまくなしで みた ことが あります。", zh: "我曾經沒看字幕就看日本動畫。"}
  - {jp: "全部は分かりませんでしたが、少し聞き取れて、うれしかったです。", kana: "ぜんぶは わかりませんでしたが、すこし ききとれて、うれしかったです。", zh: "雖然沒全聽懂，但聽懂了一點，很開心。"}
  - {jp: "先生はいつも、「間違えてもいいですよ」と言います。", kana: "せんせいは いつも、「まちがえても いいですよ」と いいます。", zh: "老師總是說：「說錯也沒關係喔。」"}
  - {jp: "間違えるのは、恥ずかしいことではありません。", kana: "まちがえるのは、はずかしい ことでは ありません。", zh: "說錯並不是丟臉的事。"}
  - {jp: "分からないときは、すぐに質問するようにしています。", kana: "わからない ときは、すぐに しつもんする ように して います。", zh: "不懂的時候，我都盡量馬上發問。"}
  - {jp: "日本人の友達と話すのは、とてもいい練習になります。", kana: "にほんじんの ともだちと はなすのは、とても いい れんしゅうに なります。", zh: "和日本朋友聊天是很好的練習。"}
  - {jp: "これからも、あきらめないで続けようと思います。", kana: "これからも、あきらめないで つづけようと おもいます。", zh: "今後我也打算不放棄、繼續下去。"}
  - {jp: "いつか、日本語で自由に話せるようになりたいです。", kana: "いつか、にほんごで じゆうに はなせる ように なりたいです。", zh: "希望有一天能用日語自由地交談。"}
