title: "旅行が戻ってきた（旅行回來了・新聞長文）"
level: "N4（長文）"
order: 370
intro: |
  關於旅行的長篇朗讀文章（約15分鐘）。曾經有一段時間大家不能自由旅行，現在世界各地又能旅行了，很多外國人來到日本（インバウンド）。文章談觀光的喜悅、人太多的問題（オーバーツーリズム）與禮儀。使用です・ます體、て形、ようになる、なければなりません、たほうがいい 等 N4 文法。
body:
  - {jp: "今日は、旅行の話をしたいと思います。", kana: "きょうは、りょこうの はなしを したいと おもいます。", zh: "今天我想聊聊旅行的話題。"}
  - {jp: "旅行は、多くの人が好きなものです。", kana: "りょこうは、おおくの ひとが すきな ものです。", zh: "旅行是很多人喜歡的事。"}
  - {jp: "わたしも、旅行が大好きです。", kana: "わたしも、りょこうが だいすきです。", zh: "我也非常喜歡旅行。"}
  - {jp: "新しい町を歩くのは、とても楽しいです。", kana: "あたらしい まちを あるくのは、とても たのしいです。", zh: "走在陌生的城市裡非常開心。"}
  - {jp: "おいしい物を食べるのも、旅行の楽しみです。", kana: "おいしい ものを たべるのも、りょこうの たのしみです。", zh: "吃好吃的東西也是旅行的樂趣。"}
  - {jp: "でも、少し前に、大変な時期がありました。", kana: "でも、すこし まえに、たいへんな じきが ありました。", zh: "但是不久前，曾有一段很辛苦的時期。"}
  - {jp: "その時、人々は自由に旅行ができませんでした。", kana: "その とき、ひとびとは じゆうに りょこうが できませんでした。", zh: "那時候人們無法自由地旅行。"}
  - {jp: "病気が広がっていたからです。", kana: "びょうきが ひろがって いたからです。", zh: "因為當時疾病正在擴散。"}
  - {jp: "多くの国が、ドアを閉めました。", kana: "おおくの くにが、どあを しめました。", zh: "許多國家都關上了大門。"}
  - {jp: "外国へ行くことが、難しくなりました。", kana: "がいこくへ いくことが、むずかしく なりました。", zh: "出國變得很困難。"}
  - {jp: "飛行機も、あまり飛びませんでした。", kana: "ひこうきも、あまり とびませんでした。", zh: "飛機也很少飛了。"}
  - {jp: "空港は、とても静かになりました。", kana: "くうこうは、とても しずかに なりました。", zh: "機場變得非常安靜。"}
  - {jp: "ホテルも、お客さんが少なくなりました。", kana: "ほてるも、おきゃくさんが すくなく なりました。", zh: "飯店的客人也變少了。"}
  - {jp: "観光地から、人がいなくなりました。", kana: "かんこうちから、ひとが いなく なりました。", zh: "觀光地都沒有人了。"}
  - {jp: "有名なお寺も、人が少なかったです。", kana: "ゆうめいな おてらも、ひとが すくなかったです。", zh: "有名的寺廟也人很少。"}
  - {jp: "町のお店も、元気がありませんでした。", kana: "まちの おみせも、げんきが ありませんでした。", zh: "城裡的店家也都沒了生氣。"}
  - {jp: "多くの人が、家にいる時間が長くなりました。", kana: "おおくの ひとが、いえに いる じかんが ながく なりました。", zh: "很多人待在家裡的時間變長了。"}
  - {jp: "わたしも、その間は旅行ができませんでした。", kana: "わたしも、その あいだは りょこうが できませんでした。", zh: "我那段時間也無法旅行。"}
  - {jp: "とても残念でした。", kana: "とても ざんねんでした。", zh: "覺得很可惜。"}
  - {jp: "「また旅行がしたいなあ。」と、いつも思っていました。", kana: "「また りょこうが したいなあ。」と、いつも おもって いました。", zh: "我總是想著「真想再去旅行啊」。"}
  - {jp: "わたしだけではありません。", kana: "わたしだけでは ありません。", zh: "不只是我而已。"}
  - {jp: "世界中の人が、同じ気持ちでした。", kana: "せかいじゅうの ひとが、おなじ きもちでした。", zh: "全世界的人都是同樣的心情。"}
  - {jp: "「早く自由に旅行ができるようになってほしい。」", kana: "「はやく じゆうに りょこうが できるように なって ほしい。」", zh: "「希望能早點自由地旅行。」"}
  - {jp: "みんなが、そう願っていました。", kana: "みんなが、そう ねがって いました。", zh: "大家都這樣盼望著。"}
  - {jp: "そして、時間がたちました。", kana: "そして、じかんが たちました。", zh: "然後，時間過去了。"}
  - {jp: "少しずつ、世界が変わってきました。", kana: "すこしずつ、せかいが かわって きました。", zh: "世界一點一點地改變了。"}
  - {jp: "病気が、だんだん落ち着いてきました。", kana: "びょうきが、だんだん おちついて きました。", zh: "疫病漸漸平息了下來。"}
  - {jp: "国のドアが、また開きました。", kana: "くにの どあが、また ひらきました。", zh: "國家的大門又打開了。"}
  - {jp: "外国へ行けるようになりました。", kana: "がいこくへ いけるように なりました。", zh: "變得可以出國了。"}
  - {jp: "飛行機も、また飛ぶようになりました。", kana: "ひこうきも、また とぶように なりました。", zh: "飛機也再度飛起來了。"}
  - {jp: "空港に、人が戻ってきました。", kana: "くうこうに、ひとが もどって きました。", zh: "人們回到了機場。"}
  - {jp: "そうです。旅行が戻ってきたのです。", kana: "そうです。りょこうが もどって きたのです。", zh: "沒錯，旅行回來了。"}
  - {jp: "今、世界中で、また旅行が楽しめるようになりました。", kana: "いま、せかいじゅうで、また りょこうが たのしめるように なりました。", zh: "現在全世界又能享受旅行了。"}
  - {jp: "これは、本当にうれしいことです。", kana: "これは、ほんとうに うれしい ことです。", zh: "這真的是件很開心的事。"}
  - {jp: "多くの人が、また旅に出ています。", kana: "おおくの ひとが、また たびに でて います。", zh: "很多人又踏上了旅程。"}
  - {jp: "近年、日本にも変化が起きています。", kana: "きんねん、にほんにも へんかが おきて います。", zh: "近年來，日本也發生了變化。"}
  - {jp: "外国から、たくさんの人が日本に来ています。", kana: "がいこくから、たくさんの ひとが にほんに きて います。", zh: "從國外來了很多人到日本。"}
  - {jp: "これを、「インバウンド」と言います。", kana: "これを、「インバウンド」と いいます。", zh: "這個現象稱為「inbound（入境觀光）」。"}
  - {jp: "外国から来る、旅行のお客さんのことです。", kana: "がいこくから くる、りょこうの おきゃくさんの ことです。", zh: "指的是從國外來的旅遊客人。"}
  - {jp: "今、その数がとても多くなっています。", kana: "いま、その かずが とても おおく なって います。", zh: "現在這個人數變得非常多。"}
  - {jp: "町を歩くと、いろいろな国の言葉が聞こえます。", kana: "まちを あるくと、いろいろな くにの ことばが きこえます。", zh: "走在街上，能聽見各國的語言。"}
  - {jp: "電車の中でも、外国の人をよく見ます。", kana: "でんしゃの なかでも、がいこくの ひとを よく みます。", zh: "在電車裡也常看到外國人。"}
  - {jp: "観光地は、いつも人でいっぱいです。", kana: "かんこうちは、いつも ひとで いっぱいです。", zh: "觀光地總是擠滿了人。"}
  - {jp: "外国の人は、日本のいろいろな物が好きです。", kana: "がいこくの ひとは、にほんの いろいろな ものが すきです。", zh: "外國人喜歡日本各式各樣的東西。"}
  - {jp: "古いお寺や、神社が好きな人もいます。", kana: "ふるい おてらや、じんじゃが すきな ひとも います。", zh: "有人喜歡古老的寺廟和神社。"}
  - {jp: "桜や、紅葉を見に来る人もいます。", kana: "さくらや、こうようを みに くる ひとも います。", zh: "也有人是來看櫻花和紅葉的。"}
  - {jp: "おいしい日本の料理が好きな人も多いです。", kana: "おいしい にほんの りょうりが すきな ひとも おおいです。", zh: "喜歡日本美食的人也很多。"}
  - {jp: "ラーメンやお寿司は、特に人気があります。", kana: "らーめんや おすしは、とくに にんきが あります。", zh: "拉麵和壽司特別受歡迎。"}
  - {jp: "温泉に入りたい人も、たくさんいます。", kana: "おんせんに はいりたい ひとも、たくさん います。", zh: "想泡溫泉的人也很多。"}
  - {jp: "アニメや漫画が好きで、来る人もいます。", kana: "あにめや まんがが すきで、くる ひとも います。", zh: "也有因為喜歡動畫和漫畫而來的人。"}
  - {jp: "雪を見るのが初めての人もいます。", kana: "ゆきを みるのが はじめての ひとも います。", zh: "也有第一次看到雪的人。"}
  - {jp: "みんな、日本での旅行をとても楽しんでいます。", kana: "みんな、にほんでの りょこうを とても たのしんで います。", zh: "大家都非常享受在日本的旅行。"}
  - {jp: "外国の人が日本を好きになってくれると、わたしもうれしいです。", kana: "がいこくの ひとが にほんを すきに なって くれると、わたしも うれしいです。", zh: "外國人喜歡上日本，我也很開心。"}
  - {jp: "多くの人が来ると、いいこともたくさんあります。", kana: "おおくの ひとが くると、いいことも たくさん あります。", zh: "很多人來，也帶來許多好處。"}
  - {jp: "まず、お店にお金が入ります。", kana: "まず、おみせに おかねが はいります。", zh: "首先，店家有了收入。"}
  - {jp: "ホテルや旅館も、お客さんが増えます。", kana: "ほてるや りょかんも、おきゃくさんが ふえます。", zh: "飯店和旅館的客人也增加了。"}
  - {jp: "お土産を売るお店も、元気になります。", kana: "おみやげを うる おみせも、げんきに なります。", zh: "賣伴手禮的店也熱鬧起來。"}
  - {jp: "レストランも、にぎやかになります。", kana: "れすとらんも、にぎやかに なります。", zh: "餐廳也變得很熱鬧。"}
  - {jp: "町に、お金が回るようになります。", kana: "まちに、おかねが まわるように なります。", zh: "城裡的金錢開始流動起來。"}
  - {jp: "新しい仕事も、生まれます。", kana: "あたらしい しごとも、うまれます。", zh: "也產生了新的工作。"}
  - {jp: "小さな町も、また元気になります。", kana: "ちいさな まちも、また げんきに なります。", zh: "小城鎮也再度有了活力。"}
  - {jp: "これは、地元の人にとって、いいことです。", kana: "これは、じもとの ひとに とって、いいことです。", zh: "這對當地人來說是好事。"}
  - {jp: "それに、文化を伝えることもできます。", kana: "それに、ぶんかを つたえる ことも できます。", zh: "而且還能傳遞文化。"}
  - {jp: "外国の人が、日本の文化を知ります。", kana: "がいこくの ひとが、にほんの ぶんかを しります。", zh: "外國人認識日本的文化。"}
  - {jp: "日本人も、外国の文化を知ることができます。", kana: "にほんじんも、がいこくの ぶんかを しる ことが できます。", zh: "日本人也能認識外國的文化。"}
  - {jp: "お互いの国のことが、よく分かるようになります。", kana: "おたがいの くにの ことが、よく わかるように なります。", zh: "彼此的國家變得更了解了。"}
  - {jp: "旅行は、人と人をつなぐものです。", kana: "りょこうは、ひとと ひとを つなぐ ものです。", zh: "旅行是連結人與人的事物。"}
  - {jp: "言葉が違っても、笑顔は同じです。", kana: "ことばが ちがっても、えがおは おなじです。", zh: "就算語言不同，笑容是一樣的。"}
  - {jp: "道で困っている外国の人に、道を教えることもあります。", kana: "みちで こまって いる がいこくの ひとに、みちを おしえる ことも あります。", zh: "有時也會幫在路上困惑的外國人指路。"}
  - {jp: "「ありがとう。」と言われると、とてもうれしいです。", kana: "「ありがとう。」と いわれると、とても うれしいです。", zh: "被說「謝謝」時，覺得非常開心。"}
  - {jp: "このように、旅行にはいいことがたくさんあります。", kana: "このように、りょこうには いいことが たくさん あります。", zh: "像這樣，旅行有許多好處。"}
  - {jp: "でも、いいことばかりではありません。", kana: "でも、いいことばかりでは ありません。", zh: "但是，並不全都是好事。"}
  - {jp: "新しい問題も、出てきました。", kana: "あたらしい もんだいも、でて きました。", zh: "也出現了新的問題。"}
  - {jp: "それは、人が多すぎるという問題です。", kana: "それは、ひとが おおすぎると いう もんだいです。", zh: "那就是人太多的問題。"}
  - {jp: "これを、「オーバーツーリズム」と言います。", kana: "これを、「オーバーツーリズム」と いいます。", zh: "這個現象稱為「over tourism（過度觀光）」。"}
  - {jp: "観光客が多すぎて、町が困ることです。", kana: "かんこうきゃくが おおすぎて、まちが こまる ことです。", zh: "指的是觀光客太多，造成城鎮困擾。"}
  - {jp: "有名な観光地には、毎日たくさんの人が来ます。", kana: "ゆうめいな かんこうちには、まいにち たくさんの ひとが きます。", zh: "有名的觀光地每天都有很多人來。"}
  - {jp: "人が多すぎて、ゆっくり見ることができません。", kana: "ひとが おおすぎて、ゆっくり みる ことが できません。", zh: "人太多，沒辦法慢慢欣賞。"}
  - {jp: "写真を撮るのも、大変です。", kana: "しゃしんを とるのも、たいへんです。", zh: "連拍照都很辛苦。"}
  - {jp: "道が、人でいっぱいになります。", kana: "みちが、ひとで いっぱいに なります。", zh: "道路被人擠得滿滿的。"}
  - {jp: "電車やバスも、とても込みます。", kana: "でんしゃや ばすも、とても こみます。", zh: "電車和公車也非常擁擠。"}
  - {jp: "地元の人が、電車に乗れないこともあります。", kana: "じもとの ひとが、でんしゃに のれない ことも あります。", zh: "有時當地人甚至搭不上電車。"}
  - {jp: "毎日その町に住んでいる人は、困ります。", kana: "まいにち その まちに すんで いる ひとは、こまります。", zh: "每天住在那城鎮的人很困擾。"}
  - {jp: "買い物に行くのも、大変になります。", kana: "かいものに いくのも、たいへんに なります。", zh: "連去買東西都變得辛苦。"}
  - {jp: "静かに暮らしたい人も、います。", kana: "しずかに くらしたい ひとも、います。", zh: "也有想安靜生活的人。"}
  - {jp: "でも、いつも人が多くて、うるさいです。", kana: "でも、いつも ひとが おおくて、うるさいです。", zh: "但是總是人很多、很吵。"}
  - {jp: "ごみの問題も、あります。", kana: "ごみの もんだいも、あります。", zh: "也有垃圾的問題。"}
  - {jp: "人が多いと、ごみも多くなります。", kana: "ひとが おおいと、ごみも おおく なります。", zh: "人多，垃圾也變多。"}
  - {jp: "道にごみを捨てる人も、います。", kana: "みちに ごみを すてる ひとも、います。", zh: "也有人在路上亂丟垃圾。"}
  - {jp: "町が、きたなくなってしまいます。", kana: "まちが、きたなく なって しまいます。", zh: "城鎮就變髒了。"}
  - {jp: "それは、とても残念なことです。", kana: "それは、とても ざんねんな ことです。", zh: "這是很可惜的事。"}
  - {jp: "マナーの問題も、あります。", kana: "まなーの もんだいも、あります。", zh: "也有禮儀的問題。"}
  - {jp: "国が違うと、マナーも少し違います。", kana: "くにが ちがうと、まなーも すこし ちがいます。", zh: "國家不同，禮儀也有點不同。"}
  - {jp: "ある国ではいいことが、日本ではよくないこともあります。", kana: "ある くにでは いいことが、にほんでは よくない ことも あります。", zh: "在某些國家可以的事，在日本卻不行。"}
  - {jp: "例えば、日本の電車の中では、大きな声で話しません。", kana: "たとえば、にほんの でんしゃの なかでは、おおきな こえで はなしません。", zh: "例如，在日本的電車裡不會大聲說話。"}
  - {jp: "でも、知らない人は、大きな声で話してしまいます。", kana: "でも、しらない ひとは、おおきな こえで はなして しまいます。", zh: "但不知道的人就會大聲說話。"}
  - {jp: "それで、まわりの人が困ります。", kana: "それで、まわりの ひとが こまります。", zh: "於是周圍的人就困擾了。"}
  - {jp: "写真を撮ってはいけない所で、写真を撮る人もいます。", kana: "しゃしんを とっては いけない ところで、しゃしんを とる ひとも います。", zh: "也有人在不能拍照的地方拍照。"}
  - {jp: "入ってはいけない所に、入る人もいます。", kana: "はいっては いけない ところに、はいる ひとも います。", zh: "也有人進入不能進入的地方。"}
  - {jp: "でも、それは悪い人だからではありません。", kana: "でも、それは わるい ひとだからでは ありません。", zh: "但那並不是因為他們是壞人。"}
  - {jp: "ただ、日本のルールを知らないだけです。", kana: "ただ、にほんの るーるを しらないだけです。", zh: "只是不知道日本的規則而已。"}
  - {jp: "だから、ルールを分かりやすく伝えることが大切です。", kana: "だから、るーるを わかりやすく つたえる ことが たいせつです。", zh: "所以，把規則簡單明瞭地傳達很重要。"}
  - {jp: "いろいろな言葉で、案内を書くといいです。", kana: "いろいろな ことばで、あんないを かくと いいです。", zh: "用各種語言寫上說明會很好。"}
  - {jp: "絵を使うと、もっと分かりやすくなります。", kana: "えを つかうと、もっと わかりやすく なります。", zh: "用圖畫的話，會更容易懂。"}
  - {jp: "では、どうすればいいのでしょうか。", kana: "では、どう すれば いいのでしょうか。", zh: "那麼，該怎麼做才好呢？"}
  - {jp: "わたしは、少し考えてみました。", kana: "わたしは、すこし かんがえて みました。", zh: "我稍微想了一下。"}
  - {jp: "まず、旅行する人が、その国のことを少し勉強するといいです。", kana: "まず、りょこうする ひとが、その くにの ことを すこし べんきょうすると いいです。", zh: "首先，旅行的人最好稍微學一下那個國家的事。"}
  - {jp: "行く前に、マナーを調べたほうがいいです。", kana: "いく まえに、まなーを しらべたほうが いいです。", zh: "去之前最好查一下禮儀。"}
  - {jp: "難しいことは、いりません。", kana: "むずかしい ことは、いりません。", zh: "不需要困難的東西。"}
  - {jp: "簡単な「ありがとう」や「すみません」を覚えるだけでも、いいです。", kana: "かんたんな「ありがとう」や「すみません」を おぼえるだけでも、いいです。", zh: "光是記住簡單的「謝謝」和「對不起」也很好。"}
  - {jp: "その言葉を言うと、相手も笑顔になります。", kana: "その ことばを いうと、あいても えがおに なります。", zh: "說了那些話，對方也會露出笑容。"}
  - {jp: "次に、ごみは決まった所に捨てましょう。", kana: "つぎに、ごみは きまった ところに すてましょう。", zh: "其次，垃圾要丟在指定的地方。"}
  - {jp: "ごみ箱がない時は、家やホテルまで持って帰りましょう。", kana: "ごみばこが ない ときは、いえや ほてるまで もって かえりましょう。", zh: "沒有垃圾桶時，就帶回家或飯店吧。"}
  - {jp: "そうすれば、町はきれいなままです。", kana: "そうすれば、まちは きれいな ままです。", zh: "這樣的話，城鎮就能保持乾淨。"}
  - {jp: "静かにする所では、静かにしましょう。", kana: "しずかに する ところでは、しずかに しましょう。", zh: "該安靜的地方就安靜下來吧。"}
  - {jp: "ほかの人のことも、考えましょう。", kana: "ほかの ひとの ことも、かんがえましょう。", zh: "也要為其他人著想。"}
  - {jp: "写真を撮る時は、ルールを守りましょう。", kana: "しゃしんを とる ときは、るーるを まもりましょう。", zh: "拍照時要遵守規則。"}
  - {jp: "人の家の前で、大きな声を出さないようにしましょう。", kana: "ひとの いえの まえで、おおきな こえを ださないように しましょう。", zh: "在別人家門前盡量不要大聲喧嘩。"}
  - {jp: "そこに住んでいる人がいることを、忘れないでください。", kana: "そこに すんで いる ひとが いることを、わすれないで ください。", zh: "別忘了那裡有住著的居民。"}
  - {jp: "町を受け入れる側も、工夫が必要です。", kana: "まちを うけいれる がわも、くふうが ひつようです。", zh: "接待客人的城鎮一方也需要下工夫。"}
  - {jp: "人が多すぎる所は、人の数を少し決めるといいかもしれません。", kana: "ひとが おおすぎる ところは、ひとの かずを すこし きめると いいかも しれません。", zh: "人太多的地方，或許限制一下人數會比較好。"}
  - {jp: "朝早い時間や、夜に来てもらうのもいい方法です。", kana: "あさ はやい じかんや、よるに きて もらうのも いい ほうほうです。", zh: "請大家在清早或晚上來也是好方法。"}
  - {jp: "そうすれば、昼の混雑が少なくなります。", kana: "そうすれば、ひるの こんざつが すくなく なります。", zh: "這樣的話，白天的擁擠就會減少。"}
  - {jp: "有名な所だけでなく、ほかの町を案内するのもいいです。", kana: "ゆうめいな ところだけでなく、ほかの まちを あんないするのも いいです。", zh: "不只介紹有名的地方，也介紹其他城鎮會很好。"}
  - {jp: "日本には、まだ知られていないいい所がたくさんあります。", kana: "にほんには、まだ しられて いない いい ところが たくさん あります。", zh: "日本還有很多不為人知的好地方。"}
  - {jp: "そういう所に行けば、人も少なくて、ゆっくりできます。", kana: "そういう ところに いけば、ひとも すくなくて、ゆっくり できます。", zh: "去那種地方的話，人少又能悠閒放鬆。"}
  - {jp: "地元の人とも、ゆっくり話せます。", kana: "じもとの ひととも、ゆっくり はなせます。", zh: "也能和當地人慢慢聊天。"}
  - {jp: "それも、すてきな旅行です。", kana: "それも、すてきな りょこうです。", zh: "那也是很棒的旅行。"}
  - {jp: "わたしは、そう思います。", kana: "わたしは、そう おもいます。", zh: "我是這麼想的。"}
  - {jp: "旅行で一番大切なことは、何でしょうか。", kana: "りょこうで いちばん たいせつな ことは、なんでしょうか。", zh: "旅行最重要的事是什麼呢？"}
  - {jp: "わたしは、お互いを大切にする気持ちだと思います。", kana: "わたしは、おたがいを たいせつに する きもちだと おもいます。", zh: "我認為是彼此珍惜的心。"}
  - {jp: "旅行する人は、行く町を大切にします。", kana: "りょこうする ひとは、いく まちを たいせつに します。", zh: "旅行的人要珍惜所到的城鎮。"}
  - {jp: "そこに住む人は、来る人に親切にします。", kana: "そこに すむ ひとは、くる ひとに しんせつに します。", zh: "住在那裡的人要親切地對待來客。"}
  - {jp: "両方が、相手のことを考えます。", kana: "りょうほうが、あいての ことを かんがえます。", zh: "雙方都為對方著想。"}
  - {jp: "そうすれば、みんなが気持ちよく旅行できます。", kana: "そうすれば、みんなが きもちよく りょこう できます。", zh: "這樣的話，大家都能愉快地旅行。"}
  - {jp: "旅行は、こわいものではありません。", kana: "りょこうは、こわい ものでは ありません。", zh: "旅行不是可怕的東西。"}
  - {jp: "正しく楽しめば、みんなが幸せになれます。", kana: "ただしく たのしめば、みんなが しあわせに なれます。", zh: "只要正確地享受，大家都能變得幸福。"}
  - {jp: "問題があるからといって、旅行をやめる必要はありません。", kana: "もんだいが あるからと いって、りょこうを やめる ひつようは ありません。", zh: "並不是因為有問題就需要停止旅行。"}
  - {jp: "みんなで、少しずつ工夫すればいいのです。", kana: "みんなで、すこしずつ くふうすれば いいのです。", zh: "大家一起一點一點地想辦法就好了。"}
  - {jp: "小さなマナーが、大きな力になります。", kana: "ちいさな まなーが、おおきな ちからに なります。", zh: "小小的禮儀會成為很大的力量。"}
  - {jp: "一人一人の気持ちが、大切です。", kana: "ひとり ひとりの きもちが、たいせつです。", zh: "每一個人的心意都很重要。"}
  - {jp: "わたしも、これから旅行をするつもりです。", kana: "わたしも、これから りょこうを する つもりです。", zh: "我以後也打算去旅行。"}
  - {jp: "いろいろな国に、行ってみたいです。", kana: "いろいろな くにに、いって みたいです。", zh: "我想去各種國家看看。"}
  - {jp: "新しい景色を、見たいです。", kana: "あたらしい けしきを、みたいです。", zh: "我想看新的景色。"}
  - {jp: "おいしい物を、食べたいです。", kana: "おいしい ものを、たべたいです。", zh: "我想吃好吃的東西。"}
  - {jp: "知らない人と、話してみたいです。", kana: "しらない ひとと、はなして みたいです。", zh: "我想試著和不認識的人聊天。"}
  - {jp: "でも、その時は、必ずマナーを守ります。", kana: "でも、その ときは、かならず まなーを まもります。", zh: "但那時候我一定會遵守禮儀。"}
  - {jp: "行く町の人に、迷惑をかけないようにします。", kana: "いく まちの ひとに、めいわくを かけないように します。", zh: "我會盡量不給所到城鎮的人添麻煩。"}
  - {jp: "笑顔で、「ありがとう」と言います。", kana: "えがおで、「ありがとう」と いいます。", zh: "我會帶著笑容說「謝謝」。"}
  - {jp: "そして、その町を好きになって帰ります。", kana: "そして、その まちを すきに なって かえります。", zh: "然後喜歡上那座城鎮再回家。"}
  - {jp: "そういう旅行が、いい旅行だと思います。", kana: "そういう りょこうが、いい りょこうだと おもいます。", zh: "我認為那樣的旅行才是好的旅行。"}
  - {jp: "旅行が戻ってきて、本当によかったです。", kana: "りょこうが もどって きて、ほんとうに よかったです。", zh: "旅行回來了，真是太好了。"}
  - {jp: "自由に旅行ができることは、当たり前ではありません。", kana: "じゆうに りょこうが できることは、あたりまえでは ありません。", zh: "能自由旅行並不是理所當然的事。"}
  - {jp: "できなかった時のことを、思い出してください。", kana: "できなかった ときの ことを、おもいだして ください。", zh: "請回想一下不能旅行的時候。"}
  - {jp: "今、旅行ができることに、感謝したいです。", kana: "いま、りょこうが できることに、かんしゃ したいです。", zh: "我想對現在能旅行這件事心懷感謝。"}
  - {jp: "これからも、世界中の人が旅行を楽しめますように。", kana: "これからも、せかいじゅうの ひとが りょこうを たのしめますように。", zh: "希望今後全世界的人都能享受旅行。"}
  - {jp: "そして、行く人も、迎える人も、みんなが笑顔でいられますように。", kana: "そして、いく ひとも、むかえる ひとも、みんなが えがおで いられますように。", zh: "也希望去的人和迎接的人，大家都能保持笑容。"}
  - {jp: "それが、わたしの願いです。", kana: "それが、わたしの ねがいです。", zh: "那就是我的心願。"}
  - {jp: "今日は、旅行の話を聞いてくれて、ありがとうございました。", kana: "きょうは、りょこうの はなしを きいて くれて、ありがとう ございました。", zh: "今天謝謝大家聽我聊旅行的話題。"}
  - {jp: "あなたも、すてきな旅行ができますように。", kana: "あなたも、すてきな りょこうが できますように。", zh: "也祝你能有一趟美好的旅行。"}
