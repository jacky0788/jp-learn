title: 私の夢（我的夢想）
level: N4
order: 110
intro: |
  用なりたい・つもり・たら・なければ・と信じる 等談將來的夢想。
body:
  - {jp: "子供のとき、わたしの夢は、先生になることでした。", kana: "こどもの とき、わたしの ゆめは、せんせいに なる ことでした。", zh: "小時候，我的夢想是當老師。"}
  - {jp: "今のわたしの夢は、日本で働くことです。", kana: "いまの わたしの ゆめは、にほんで はたらく ことです。", zh: "現在我的夢想是在日本工作。"}
  - {jp: "そのために、毎日日本語を勉強しています。", kana: "そのために、まいにち にほんごを べんきょうして います。", zh: "為此，我每天學日語。"}
  - {jp: "大学を卒業したら、日本の会社に入りたいです。", kana: "だいがくを そつぎょうしたら、にほんの かいしゃに はいりたいです。", zh: "大學畢業後，想進日本的公司。"}
  - {jp: "できれば、貿易の仕事をしたいと思っています。", kana: "できれば、ぼうえきの しごとを したいと おもって います。", zh: "可以的話，想做貿易的工作。"}
  - {jp: "日本と台湾をつなぐ仕事ができたら、うれしいです。", kana: "にほんと たいわんを つなぐ しごとが できたら、うれしいです。", zh: "如果能做連結日本與台灣的工作，會很開心。"}
  - {jp: "仕事に慣れたら、日本のいろいろな町を旅行するつもりです。", kana: "しごとに なれたら、にほんの いろいろな まちを りょこうする つもりです。", zh: "工作熟悉後，打算去日本各地旅行。"}
  - {jp: "お金をためて、両親を日本へ招待したいです。", kana: "おかねを ためて、りょうしんを にほんへ しょうたいしたいです。", zh: "想存錢邀請父母來日本。"}
  - {jp: "両親は、まだ日本へ行ったことがありません。", kana: "りょうしんは、まだ にほんへ いった ことが ありません。", zh: "父母還沒去過日本。"}
  - {jp: "だから、わたしが案内してあげたいです。", kana: "だから、わたしが あんないして あげたいです。", zh: "所以我想當他們的嚮導。"}
  - {jp: "将来は、日本語だけでなく、英語も話せるようになりたいです。", kana: "しょうらいは、にほんごだけでなく、えいごも はなせる ように なりたいです。", zh: "將來不只日語，也想學會說英語。"}
  - {jp: "言葉ができると、世界が広がります。", kana: "ことばが できると、せかいが ひろがります。", zh: "會語言，世界就會變寬廣。"}
  - {jp: "夢を実現するのは、簡単ではありません。", kana: "ゆめを じつげんするのは、かんたんでは ありません。", zh: "實現夢想並不簡單。"}
  - {jp: "でも、あきらめなければ、きっとできると信じています。", kana: "でも、あきらめなければ、きっと できると しんじて います。", zh: "但只要不放棄，我相信一定做得到。"}
  - {jp: "一日一日を大切にして、努力を続けます。", kana: "いちにち いちにちを たいせつに して、どりょくを つづけます。", zh: "珍惜每一天，持續努力。"}
