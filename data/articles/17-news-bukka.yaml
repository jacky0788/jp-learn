title: "物価が上がる時代の暮らし（物價上漲時代的生活・新聞長文）"
level: "N4（長文）"
order: 310
intro: |
  這是一篇關於「物價上漲時代生活」的長篇朗讀文章。
  內容談到近年食物、電費、房租變貴，薪水卻很難增加，大家如何努力省錢與聰明用錢。
  文法以 N4 為主（です・ます體、〜ようになる、〜たほうがいい、〜なければなりません等），句子簡短，適合慢慢朗讀練習。
body:
  - {jp: "みなさん、こんにちは。", kana: "みなさん、こんにちは。", zh: "大家好。"}
  - {jp: "今日は、お金と暮らしの話をします。", kana: "きょうは、おかねと くらしの はなしを します。", zh: "今天要聊聊金錢與生活的話題。"}
  - {jp: "近年、世界中で物の値段が上がっています。", kana: "きんねん、せかいじゅうで ものの ねだんが あがって います。", zh: "近年來，全世界東西的價格都在上漲。"}
  - {jp: "これを「物価が上がる」と言います。", kana: "これを「ぶっかが あがる」と いいます。", zh: "這叫做「物價上漲」。"}
  - {jp: "毎日の生活に、大きなえいきょうがあります。", kana: "まいにちの せいかつに、おおきな えいきょうが あります。", zh: "這對每天的生活有很大的影響。"}
  - {jp: "まず、食べ物の値段です。", kana: "まず、たべものの ねだんです。", zh: "首先是食物的價格。"}
  - {jp: "パンや牛乳が、少しずつ高くなりました。", kana: "ぱんや ぎゅうにゅうが、すこしずつ たかく なりました。", zh: "麵包和牛奶一點一點變貴了。"}
  - {jp: "野菜や果物も、前より高いです。", kana: "やさいや くだものも、まえより たかいです。", zh: "蔬菜和水果也比以前貴。"}
  - {jp: "卵やお肉の値段も、上がりました。", kana: "たまごや おにくの ねだんも、あがりました。", zh: "雞蛋和肉的價格也漲了。"}
  - {jp: "スーパーに行くと、すぐに分かります。", kana: "すーぱーに いくと、すぐに わかります。", zh: "一去超市馬上就能感覺到。"}
  - {jp: "同じお金で、買える物が少なくなりました。", kana: "おなじ おかねで、かえる ものが すくなく なりました。", zh: "同樣的錢，能買到的東西變少了。"}
  - {jp: "電気代も、高くなっています。", kana: "でんきだいも、たかく なって います。", zh: "電費也變貴了。"}
  - {jp: "ガス代や水道代も、上がりました。", kana: "がすだいや すいどうだいも、あがりました。", zh: "瓦斯費和水費也漲了。"}
  - {jp: "冬は、だんぼうを使うので、お金がかかります。", kana: "ふゆは、だんぼうを つかうので、おかねが かかります。", zh: "冬天要用暖氣，所以很花錢。"}
  - {jp: "夏は、エアコンを使います。", kana: "なつは、えあこんを つかいます。", zh: "夏天要用冷氣。"}
  - {jp: "電気を使うたびに、料金が心配になります。", kana: "でんきを つかうたびに、りょうきんが しんぱいに なります。", zh: "每次用電都會擔心費用。"}
  - {jp: "家賃も、上がっている所が多いです。", kana: "やちんも、あがって いる ところが おおいです。", zh: "房租上漲的地方也很多。"}
  - {jp: "町に住むのは、お金がかかります。", kana: "まちに すむのは、おかねが かかります。", zh: "住在市區很花錢。"}
  - {jp: "へやをかりるのも、簡単ではありません。", kana: "へやを かりるのも、かんたんでは ありません。", zh: "租房子也不容易。"}
  - {jp: "ガソリンの値段も、上がりました。", kana: "がそりんの ねだんも、あがりました。", zh: "汽油的價格也漲了。"}
  - {jp: "車に乗る人は、こまっています。", kana: "くるまに のる ひとは、こまって います。", zh: "開車的人很困擾。"}
  - {jp: "電車やバスの料金も、上がることがあります。", kana: "でんしゃや ばすの りょうきんも、あがる ことが あります。", zh: "電車和公車的費用有時也會漲。"}
  - {jp: "このように、いろいろな物が高くなりました。", kana: "このように、いろいろな ものが たかく なりました。", zh: "像這樣，各種東西都變貴了。"}
  - {jp: "では、給料はどうでしょうか。", kana: "では、きゅうりょうは どうでしょうか。", zh: "那麼，薪水又如何呢？"}
  - {jp: "ざんねんですが、給料はあまり増えません。", kana: "ざんねんですが、きゅうりょうは あまり ふえません。", zh: "很遺憾，薪水沒怎麼增加。"}
  - {jp: "物の値段は上がるのに、お金は増えません。", kana: "ものの ねだんは あがるのに、おかねは ふえません。", zh: "東西的價格上漲，錢卻沒有增加。"}
  - {jp: "だから、生活が大変になります。", kana: "だから、せいかつが たいへんに なります。", zh: "所以生活就變得辛苦。"}
  - {jp: "多くの人が、お金の心配をしています。", kana: "おおくの ひとが、おかねの しんぱいを して います。", zh: "很多人都在擔心錢的問題。"}
  - {jp: "特に、若い人や年を取った人は大変です。", kana: "とくに、わかい ひとや としを とった ひとは たいへんです。", zh: "尤其是年輕人和年長者很辛苦。"}
  - {jp: "家族が多い家も、大変だと思います。", kana: "かぞくが おおい いえも、たいへんだと おもいます。", zh: "家庭人口多的家也很辛苦。"}
  - {jp: "子どもがいる家は、お金がたくさんいります。", kana: "こどもが いる いえは、おかねが たくさん いります。", zh: "有小孩的家庭需要很多錢。"}
  - {jp: "学校の費用も、安くありません。", kana: "がっこうの ひようも、やすく ありません。", zh: "學校的費用也不便宜。"}
  - {jp: "でも、暗い話ばかりではありません。", kana: "でも、くらい はなしばかりでは ありません。", zh: "不過，並不全是黑暗的話題。"}
  - {jp: "みんな、いろいろなくふうをしています。", kana: "みんな、いろいろな くふうを して います。", zh: "大家都在做各種努力與巧思。"}
  - {jp: "ここからは、節約のくふうを話します。", kana: "ここからは、せつやくの くふうを はなします。", zh: "接下來談談省錢的巧思。"}
  - {jp: "まず、セールを上手に使う人が増えました。", kana: "まず、せーるを じょうずに つかう ひとが ふえました。", zh: "首先，善用特賣的人變多了。"}
  - {jp: "スーパーは、夕方になると安くなります。", kana: "すーぱーは、ゆうがたに なると やすく なります。", zh: "超市到了傍晚就會變便宜。"}
  - {jp: "その時間に、買い物に行く人がいます。", kana: "その じかんに、かいものに いく ひとが います。", zh: "有人會在那個時間去買東西。"}
  - {jp: "安い日をおぼえて、その日に買います。", kana: "やすい ひを おぼえて、その ひに かいます。", zh: "記住便宜的日子，在那天買。"}
  - {jp: "ちらしを見て、安い店をさがします。", kana: "ちらしを みて、やすい みせを さがします。", zh: "看廣告單，找便宜的店。"}
  - {jp: "今は、スマホで安い店を調べられます。", kana: "いまは、すまほで やすい みせを しらべられます。", zh: "現在可以用手機查便宜的店。"}
  - {jp: "次に、自分で料理を作る人が増えました。", kana: "つぎに、じぶんで りょうりを つくる ひとが ふえました。", zh: "其次，自己做菜的人變多了。"}
  - {jp: "これを「自炊」と言います。", kana: "これを「じすい」と いいます。", zh: "這叫做「自炊（自己煮）」。"}
  - {jp: "外で食べると、お金がかかります。", kana: "そとで たべると、おかねが かかります。", zh: "在外面吃很花錢。"}
  - {jp: "家で作れば、ずっと安くなります。", kana: "いえで つくれば、ずっと やすく なります。", zh: "在家做的話會便宜很多。"}
  - {jp: "それに、体にもいいです。", kana: "それに、からだにも いいです。", zh: "而且對身體也好。"}
  - {jp: "野菜をたくさん食べることができます。", kana: "やさいを たくさん たべる ことが できます。", zh: "可以吃很多蔬菜。"}
  - {jp: "お弁当を作って、会社に持って行く人もいます。", kana: "おべんとうを つくって、かいしゃに もって いく ひとも います。", zh: "也有人做便當帶去公司。"}
  - {jp: "毎日外で買うより、安くなります。", kana: "まいにち そとで かうより、やすく なります。", zh: "比起每天在外面買，會便宜。"}
  - {jp: "多めに作って、れいぞうこに入れます。", kana: "おおめに つくって、れいぞうこに いれます。", zh: "多做一些放進冰箱。"}
  - {jp: "次の日に、また食べることができます。", kana: "つぎの ひに、また たべる ことが できます。", zh: "隔天可以再吃。"}
  - {jp: "食べ物をすてないことも、大切です。", kana: "たべものを すてない ことも、たいせつです。", zh: "不浪費食物也很重要。"}
  - {jp: "残った料理は、すてないで食べましょう。", kana: "のこった りょうりは、すてないで たべましょう。", zh: "剩下的料理不要丟掉，吃完吧。"}
  - {jp: "食べ物を大切にすると、お金もたまります。", kana: "たべものを たいせつに すると、おかねも たまります。", zh: "珍惜食物，也能存到錢。"}
  - {jp: "また、中古品を使う人も増えました。", kana: "また、ちゅうこひんを つかう ひとも ふえました。", zh: "另外，使用二手物品的人也變多了。"}
  - {jp: "中古品とは、だれかが前に使った物です。", kana: "ちゅうこひんとは、だれかが まえに つかった ものです。", zh: "二手物品是指別人之前用過的東西。"}
  - {jp: "新しい物は、高いです。", kana: "あたらしい ものは、たかいです。", zh: "新的東西很貴。"}
  - {jp: "でも、中古品はずっと安いです。", kana: "でも、ちゅうこひんは ずっと やすいです。", zh: "但是二手物品便宜很多。"}
  - {jp: "服や本や家具を、中古で買う人がいます。", kana: "ふくや ほんや かぐを、ちゅうこで かう ひとが います。", zh: "有人買二手的衣服、書和家具。"}
  - {jp: "まだ使える物が、安く買えます。", kana: "まだ つかえる ものが、やすく かえます。", zh: "還能用的東西可以便宜買到。"}
  - {jp: "いらない物は、人に売ることもできます。", kana: "いらない ものは、ひとに うる ことも できます。", zh: "不要的東西也可以賣給別人。"}
  - {jp: "今は、スマホで簡単に売り買いができます。", kana: "いまは、すまほで かんたんに うりかいが できます。", zh: "現在用手機就能輕鬆買賣。"}
  - {jp: "物を大切に使うと、ごみも少なくなります。", kana: "ものを たいせつに つかうと、ごみも すくなく なります。", zh: "珍惜地使用物品，垃圾也會變少。"}
  - {jp: "これは、地球にもいいことです。", kana: "これは、ちきゅうにも いい ことです。", zh: "這對地球也是好事。"}
  - {jp: "それから、ポイントを集める人も多いです。", kana: "それから、ぽいんとを あつめる ひとも おおいです。", zh: "還有，收集點數的人也很多。"}
  - {jp: "買い物をすると、ポイントがもらえます。", kana: "かいものを すると、ぽいんとが もらえます。", zh: "買東西就能拿到點數。"}
  - {jp: "ポイントを集めて、後で使うことができます。", kana: "ぽいんとを あつめて、あとで つかう ことが できます。", zh: "收集點數，之後可以使用。"}
  - {jp: "ポイントは、お金と同じように使えます。", kana: "ぽいんとは、おかねと おなじように つかえます。", zh: "點數可以像錢一樣使用。"}
  - {jp: "だから、少しずつお金がたまります。", kana: "だから、すこしずつ おかねが たまります。", zh: "所以能一點一點省下錢。"}
  - {jp: "でも、ポイントのために、たくさん買うのはよくありません。", kana: "でも、ぽいんとの ために、たくさん かうのは よく ありません。", zh: "不過，為了點數買很多東西就不好了。"}
  - {jp: "いる物だけ買うことが、大切です。", kana: "いる ものだけ かう ことが、たいせつです。", zh: "只買需要的東西很重要。"}
  - {jp: "電気を大切に使うことも、節約になります。", kana: "でんきを たいせつに つかう ことも、せつやくに なります。", zh: "節約用電也是省錢。"}
  - {jp: "使わない電気は、こまめに消しましょう。", kana: "つかわない でんきは、こまめに けしましょう。", zh: "不用的電燈要勤快地關掉。"}
  - {jp: "へやを出る時は、電気を消します。", kana: "へやを でる ときは、でんきを けします。", zh: "離開房間時要關燈。"}
  - {jp: "エアコンの温度にも、気をつけます。", kana: "えあこんの おんどにも、きを つけます。", zh: "也要注意冷氣的溫度。"}
  - {jp: "夏は、少し高めに設定します。", kana: "なつは、すこし たかめに せっていします。", zh: "夏天設定得稍微高一點。"}
  - {jp: "冬は、あたたかい服を着ます。", kana: "ふゆは、あたたかい ふくを きます。", zh: "冬天穿暖和的衣服。"}
  - {jp: "そうすれば、だんぼうを使いすぎません。", kana: "そうすれば、だんぼうを つかいすぎません。", zh: "這樣就不會過度使用暖氣。"}
  - {jp: "水も、大切に使いましょう。", kana: "みずも、たいせつに つかいましょう。", zh: "水也要珍惜地使用。"}
  - {jp: "歯をみがく時は、水を止めます。", kana: "はを みがく ときは、みずを とめます。", zh: "刷牙的時候把水關掉。"}
  - {jp: "小さなことですが、つもると大きいです。", kana: "ちいさな ことですが、つもると おおきいです。", zh: "雖然是小事，但累積起來很可觀。"}
  - {jp: "次に、お金との上手な付き合い方を話します。", kana: "つぎに、おかねとの じょうずな つきあいかたを はなします。", zh: "接下來談談如何聰明地與金錢相處。"}
  - {jp: "まず、自分が使うお金を知ることが大切です。", kana: "まず、じぶんが つかう おかねを しる ことが たいせつです。", zh: "首先，了解自己花的錢很重要。"}
  - {jp: "何にお金を使ったか、書いてみましょう。", kana: "なにに おかねを つかったか、かいてみましょう。", zh: "把錢花在什麼地方寫下來看看。"}
  - {jp: "これを「家計簿」と言います。", kana: "これを「かけいぼ」と いいます。", zh: "這叫做「家計簿（記帳）」。"}
  - {jp: "ノートに書いてもいいです。", kana: "のーとに かいても いいです。", zh: "寫在筆記本上也可以。"}
  - {jp: "スマホのアプリを使ってもいいです。", kana: "すまほの あぷりを つかっても いいです。", zh: "用手機的應用程式也可以。"}
  - {jp: "書いてみると、むだが分かります。", kana: "かいてみると、むだが わかります。", zh: "寫下來就能看出浪費。"}
  - {jp: "「あ、これはいらなかった」と気づきます。", kana: "「あ、これは いらなかった」と きづきます。", zh: "會發現「啊，這個其實不需要」。"}
  - {jp: "むだをなくすことが、節約の第一歩です。", kana: "むだを なくす ことが、せつやくの だいいっぽです。", zh: "減少浪費是省錢的第一步。"}
  - {jp: "買い物の前に、本当にいるか考えます。", kana: "かいものの まえに、ほんとうに いるか かんがえます。", zh: "買東西前先想想是不是真的需要。"}
  - {jp: "「ほしい物」と「いる物」は、ちがいます。", kana: "「ほしい もの」と「いる もの」は、ちがいます。", zh: "「想要的東西」和「需要的東西」是不同的。"}
  - {jp: "ほしい物が、全部いる物ではありません。", kana: "ほしい ものが、ぜんぶ いる ものでは ありません。", zh: "想要的東西不全是需要的東西。"}
  - {jp: "少し待ってから、買うのもいい方法です。", kana: "すこし まってから、かうのも いい ほうほうです。", zh: "等一下再買也是好方法。"}
  - {jp: "一日待つと、気持ちが変わることがあります。", kana: "いちにち まつと、きもちが かわる ことが あります。", zh: "等一天，心情可能就會改變。"}
  - {jp: "「やっぱりいらない」と思うこともあります。", kana: "「やっぱり いらない」と おもう ことも あります。", zh: "也可能會覺得「果然不需要」。"}
  - {jp: "それで、お金をむだにしないですみます。", kana: "それで、おかねを むだに しないで すみます。", zh: "這樣就能不浪費錢。"}
  - {jp: "安い物が、いつもいいとはかぎりません。", kana: "やすい ものが、いつも いいとは かぎりません。", zh: "便宜的東西不一定總是好的。"}
  - {jp: "すぐにこわれたら、また買わなければなりません。", kana: "すぐに こわれたら、また かわなければ なりません。", zh: "如果馬上壞掉，就得再買一次。"}
  - {jp: "長く使える物のほうが、いいこともあります。", kana: "ながく つかえる もののほうが、いい ことも あります。", zh: "能用很久的東西，有時反而比較好。"}
  - {jp: "だから、安さだけで決めないほうがいいです。", kana: "だから、やすさだけで きめないほうが いいです。", zh: "所以最好不要只看便宜就決定。"}
  - {jp: "少しずつ、お金をためることも大切です。", kana: "すこしずつ、おかねを ためる ことも たいせつです。", zh: "一點一點存錢也很重要。"}
  - {jp: "毎月、少しでもちょきんしましょう。", kana: "まいつき、すこしでも ちょきんしましょう。", zh: "每個月即使一點點也存起來吧。"}
  - {jp: "急にお金がいる時に、安心です。", kana: "きゅうに おかねが いる ときに、あんしんです。", zh: "突然需要錢時就能安心。"}
  - {jp: "病気になったり、機械がこわれたりします。", kana: "びょうきに なったり、きかいが こわれたり します。", zh: "可能會生病，或機器壞掉。"}
  - {jp: "そんな時に、ためたお金が役に立ちます。", kana: "そんな ときに、ためた おかねが やくに たちます。", zh: "那種時候，存的錢就派上用場。"}
  - {jp: "でも、節約ばかりでは、つかれてしまいます。", kana: "でも、せつやくばかりでは、つかれて しまいます。", zh: "不過，一直省錢也會累。"}
  - {jp: "がまんしすぎるのは、よくありません。", kana: "がまんしすぎるのは、よく ありません。", zh: "太過忍耐並不好。"}
  - {jp: "ときどきは、自分にごほうびをあげましょう。", kana: "ときどきは、じぶんに ごほうびを あげましょう。", zh: "偶爾也給自己一點獎勵吧。"}
  - {jp: "好きな物を、少し買うのもいいです。", kana: "すきな ものを、すこし かうのも いいです。", zh: "買一點喜歡的東西也很好。"}
  - {jp: "おいしい物を食べると、元気になります。", kana: "おいしい ものを たべると、げんきに なります。", zh: "吃到好吃的東西就會有精神。"}
  - {jp: "大切なのは、バランスです。", kana: "たいせつなのは、ばらんすです。", zh: "重要的是平衡。"}
  - {jp: "使う時は使って、ためる時はためます。", kana: "つかう ときは つかって、ためる ときは ためます。", zh: "該花的時候花，該存的時候存。"}
  - {jp: "お金は、生活の道具です。", kana: "おかねは、せいかつの どうぐです。", zh: "錢是生活的工具。"}
  - {jp: "お金は、しあわせになるためにあります。", kana: "おかねは、しあわせに なる ために あります。", zh: "錢是為了讓人幸福而存在的。"}
  - {jp: "お金のために、苦しくなってはいけません。", kana: "おかねの ために、くるしく なっては いけません。", zh: "不該為了錢而讓自己痛苦。"}
  - {jp: "それから、お金のかからない楽しみもあります。", kana: "それから、おかねの かからない たのしみも あります。", zh: "另外，也有不花錢的樂趣。"}
  - {jp: "公園を散歩するのは、ただです。", kana: "こうえんを さんぽするのは、ただです。", zh: "在公園散步是免費的。"}
  - {jp: "図書館で本を借りるのも、お金がいりません。", kana: "としょかんで ほんを かりるのも、おかねが いりません。", zh: "在圖書館借書也不用花錢。"}
  - {jp: "友達と話すのも、楽しい時間です。", kana: "ともだちと はなすのも、たのしい じかんです。", zh: "和朋友聊天也是快樂的時光。"}
  - {jp: "お金がなくても、楽しいことはたくさんあります。", kana: "おかねが なくても、たのしい ことは たくさん あります。", zh: "即使沒有錢，快樂的事也有很多。"}
  - {jp: "家族といっしょにいる時間も、大切です。", kana: "かぞくと いっしょに いる じかんも、たいせつです。", zh: "和家人在一起的時間也很重要。"}
  - {jp: "高い物を買わなくても、しあわせになれます。", kana: "たかい ものを かわなくても、しあわせに なれます。", zh: "不買貴的東西，也能變幸福。"}
  - {jp: "また、家族や友達と助け合うことも大切です。", kana: "また、かぞくや ともだちと たすけあう ことも たいせつです。", zh: "另外，和家人朋友互相幫助也很重要。"}
  - {jp: "いらない物を、あげたりもらったりします。", kana: "いらない ものを、あげたり もらったり します。", zh: "把不要的東西送人或接收。"}
  - {jp: "いっしょに買うと、安くなることもあります。", kana: "いっしょに かうと、やすく なる ことも あります。", zh: "一起買有時也會比較便宜。"}
  - {jp: "知っていることを、教え合います。", kana: "しって いる ことを、おしえあいます。", zh: "把知道的事互相分享。"}
  - {jp: "「あの店が安いよ」と教えてくれます。", kana: "「あの みせが やすいよ」と おしえて くれます。", zh: "會告訴你「那家店很便宜喔」。"}
  - {jp: "みんなで力を合わせると、楽になります。", kana: "みんなで ちからを あわせると、らくに なります。", zh: "大家齊心協力，就會輕鬆許多。"}
  - {jp: "むずかしい時こそ、助け合いが大切です。", kana: "むずかしい ときこそ、たすけあいが たいせつです。", zh: "正是在困難的時候，互助才重要。"}
  - {jp: "物価が上がるのは、すぐには止まりません。", kana: "ぶっかが あがるのは、すぐには とまりません。", zh: "物價上漲不會馬上停止。"}
  - {jp: "これから先のことは、だれにも分かりません。", kana: "これから さきの ことは、だれにも わかりません。", zh: "今後的事誰也不知道。"}
  - {jp: "でも、心配ばかりしても、しかたがありません。", kana: "でも、しんぱいばかり しても、しかたが ありません。", zh: "但是一直擔心也沒辦法。"}
  - {jp: "今、自分にできることをすればいいです。", kana: "いま、じぶんに できる ことを すれば いいです。", zh: "做現在自己能做的事就好。"}
  - {jp: "小さなくふうを、毎日続けましょう。", kana: "ちいさな くふうを、まいにち つづけましょう。", zh: "把小巧思每天持續下去吧。"}
  - {jp: "少しの節約でも、つもれば大きくなります。", kana: "すこしの せつやくでも、つもれば おおきく なります。", zh: "即使是一點點節約，累積起來也會變大。"}
  - {jp: "ちりも積もれば山となる、と言います。", kana: "ちりも つもれば やまと なる、と いいます。", zh: "俗話說「積沙成塔」。"}
  - {jp: "これは、小さな物もたくさん集まると大きくなる、という意味です。", kana: "これは、ちいさな ものも たくさん あつまると おおきく なる、と いう いみです。", zh: "意思是小東西聚集多了也會變大。"}
  - {jp: "節約も、同じです。", kana: "せつやくも、おなじです。", zh: "節約也是一樣。"}
  - {jp: "毎日少しずつ、続けることが大切です。", kana: "まいにち すこしずつ、つづける ことが たいせつです。", zh: "每天一點一點持續下去很重要。"}
  - {jp: "そして、節約を楽しむことも大切です。", kana: "そして、せつやくを たのしむ ことも たいせつです。", zh: "而且，享受節約也很重要。"}
  - {jp: "「今月はいくらためられたかな」と考えます。", kana: "「こんげつは いくら ためられたかな」と かんがえます。", zh: "想想「這個月存了多少呢」。"}
  - {jp: "ゲームのように楽しむと、続けられます。", kana: "げーむのように たのしむと、つづけられます。", zh: "像玩遊戲一樣享受，就能持續下去。"}
  - {jp: "新しい料理を作るのも、楽しいです。", kana: "あたらしい りょうりを つくるのも、たのしいです。", zh: "做新料理也很有趣。"}
  - {jp: "安い材料で、おいしい物を作ります。", kana: "やすい ざいりょうで、おいしい ものを つくります。", zh: "用便宜的材料做出好吃的東西。"}
  - {jp: "できた時は、うれしい気持ちになります。", kana: "できた ときは、うれしい きもちに なります。", zh: "做成功時會感到很開心。"}
  - {jp: "むだをなくす考え方は、一生役に立ちます。", kana: "むだを なくす かんがえかたは、いっしょう やくに たちます。", zh: "減少浪費的想法，一輩子都有用。"}
  - {jp: "若いうちに、おぼえておくといいです。", kana: "わかい うちに、おぼえて おくと いいです。", zh: "趁年輕學會比較好。"}
  - {jp: "お金を大切にする人は、物も大切にします。", kana: "おかねを たいせつに する ひとは、ものも たいせつに します。", zh: "珍惜金錢的人，也會珍惜物品。"}
  - {jp: "物を大切にする人は、人にもやさしいです。", kana: "ものを たいせつに する ひとは、ひとにも やさしいです。", zh: "珍惜物品的人，對人也溫柔。"}
  - {jp: "節約は、ただのがまんではありません。", kana: "せつやくは、ただの がまんでは ありません。", zh: "節約並不只是忍耐。"}
  - {jp: "大切な物を選ぶ、ということです。", kana: "たいせつな ものを えらぶ、と いう ことです。", zh: "而是選擇重要的東西。"}
  - {jp: "自分にとって、何が大切か考えます。", kana: "じぶんにとって、なにが たいせつか かんがえます。", zh: "想想對自己來說什麼是重要的。"}
  - {jp: "本当に好きな物には、お金を使います。", kana: "ほんとうに すきな ものには、おかねを つかいます。", zh: "對真正喜歡的東西就花錢。"}
  - {jp: "そうでない物は、買わないようにします。", kana: "そうでない ものは、かわないように します。", zh: "對非如此的東西就盡量不買。"}
  - {jp: "これが、上手なお金の使い方です。", kana: "これが、じょうずな おかねの つかいかたです。", zh: "這就是聰明的用錢方式。"}
  - {jp: "物価が上がる時代でも、くふうしだいです。", kana: "ぶっかが あがる じだいでも、くふうしだいです。", zh: "即使在物價上漲的時代，也取決於巧思。"}
  - {jp: "考え方を変えれば、生活は楽になります。", kana: "かんがえかたを かえれば、せいかつは らくに なります。", zh: "改變想法，生活就會輕鬆。"}
  - {jp: "むずかしい時代ですが、明るく生きましょう。", kana: "むずかしい じだいですが、あかるく いきましょう。", zh: "雖然是艱難的時代，但讓我們開朗地生活吧。"}
  - {jp: "みなさんも、自分に合ったくふうを見つけてください。", kana: "みなさんも、じぶんに あった くふうを みつけて ください。", zh: "請大家也找到適合自己的方法。"}
  - {jp: "毎日の小さな努力が、未来を作ります。", kana: "まいにちの ちいさな どりょくが、みらいを つくります。", zh: "每天小小的努力，造就未來。"}
  - {jp: "お金と上手に付き合って、しあわせに暮らしましょう。", kana: "おかねと じょうずに つきあって、しあわせに くらしましょう。", zh: "和金錢好好相處，幸福地生活吧。"}
  - {jp: "今日の話は、ここまでです。", kana: "きょうの はなしは、ここまでです。", zh: "今天的話題就到這裡。"}
  - {jp: "最後まで聞いてくれて、ありがとうございました。", kana: "さいごまで きいて くれて、ありがとうございました。", zh: "謝謝你聽到最後。"}
