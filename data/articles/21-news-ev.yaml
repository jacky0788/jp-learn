title: "電気自動車とエネルギーの未来（電動車與能源的未來・新聞長文）"
level: "N4（長文）"
order: 350
intro: |
  這篇文章談的是汽油車轉向電動車、太陽能與風力等再生能源，以及對環境友善的生活方式。
  也會講到方便的地方與課題（充電、價格），還有未來城市與交通工具的想像。
  使用 N4 為主的語彙與文法（です・ます體、〜ようになる、〜なければなりません、〜と思います等）。
body:
  - {jp: "近年、自動車の世界が大きく変わってきています。", kana: "きんねん、じどうしゃの せかいが おおきく かわって きて います。", zh: "近年來，汽車的世界正在大幅改變。"}
  - {jp: "今まで、多くの車はガソリンで走っていました。", kana: "いままで、おおくの くるまは がそりんで はしって いました。", zh: "至今為止，許多車都是用汽油行駛的。"}
  - {jp: "ガソリンは、地面の下から取る油から作ります。", kana: "がそりんは、じめんの したから とる あぶらから つくります。", zh: "汽油是用從地下取出的石油製成的。"}
  - {jp: "この油には、限りがあると言われています。", kana: "この あぶらには、かぎりが あると いわれて います。", zh: "據說這種石油是有限的。"}
  - {jp: "そして、ガソリンを燃やすと、空気が汚れます。", kana: "そして、がそりんを もやすと、くうきが よごれます。", zh: "而且，燃燒汽油會弄髒空氣。"}
  - {jp: "車から出るガスは、地球を暖めると言われています。", kana: "くるまから でる がすは、ちきゅうを あたためると いわれて います。", zh: "據說從車子排出的氣體會使地球變暖。"}
  - {jp: "だから、新しい車が必要になってきました。", kana: "だから、あたらしい くるまが ひつように なって きました。", zh: "因此，開始需要新的車子了。"}
  - {jp: "それが、電気で走る車です。", kana: "それが、でんきで はしる くるまです。", zh: "那就是用電行駛的車。"}
  - {jp: "電気で走る車を、電気自動車と言います。", kana: "でんきで はしる くるまを、でんきじどうしゃと いいます。", zh: "用電行駛的車稱為電動車。"}
  - {jp: "短く「EV」と呼ぶこともあります。", kana: "みじかく EVと よぶことも あります。", zh: "有時也簡稱為「EV」。"}
  - {jp: "EVは、ガソリンを使いません。", kana: "EVは、がそりんを つかいません。", zh: "EV不使用汽油。"}
  - {jp: "そのかわりに、大きな電池を使います。", kana: "そのかわりに、おおきな でんちを つかいます。", zh: "取而代之的是使用大型電池。"}
  - {jp: "電池に電気をためて、その電気で走ります。", kana: "でんちに でんきを ためて、その でんきで はしります。", zh: "把電儲存在電池裡，用那些電行駛。"}
  - {jp: "近ごろ、町でもEVをよく見るようになりました。", kana: "ちかごろ、まちでも EVを よく みるように なりました。", zh: "最近，在街上也常常看得到EV了。"}
  - {jp: "数年前は、まだ少なかったです。", kana: "すうねんまえは、まだ すくなかったです。", zh: "幾年前還很少。"}
  - {jp: "今は、多くの人がEVに興味を持っています。", kana: "いまは、おおくの ひとが EVに きょうみを もって います。", zh: "現在，很多人對EV感興趣。"}
  - {jp: "では、EVのいい点を考えてみましょう。", kana: "では、EVの いいてんを かんがえて みましょう。", zh: "那麼，來想想EV的優點吧。"}
  - {jp: "まず、走るときに、汚いガスを出しません。", kana: "まず、はしるときに、きたない がすを だしません。", zh: "首先，行駛時不會排出髒的氣體。"}
  - {jp: "だから、町の空気がきれいになります。", kana: "だから、まちの くうきが きれいに なります。", zh: "因此，城市的空氣會變乾淨。"}
  - {jp: "次に、EVは音が静かです。", kana: "つぎに、EVは おとが しずかです。", zh: "其次，EV的聲音很安靜。"}
  - {jp: "ガソリンの車のような大きな音がしません。", kana: "がそりんの くるまの ような おおきな おとが しません。", zh: "不會有像汽油車那樣的大聲音。"}
  - {jp: "だから、夜でもうるさくありません。", kana: "だから、よるでも うるさく ありません。", zh: "所以即使在晚上也不吵。"}
  - {jp: "そして、走るのにかかるお金も安いです。", kana: "そして、はしるのに かかる おかねも やすいです。", zh: "而且，行駛所花的錢也便宜。"}
  - {jp: "ガソリンより、電気のほうが安いことが多いです。", kana: "がそりんより、でんきの ほうが やすいことが おおいです。", zh: "比起汽油，電費通常更便宜。"}
  - {jp: "家で、夜のうちに電気をためることもできます。", kana: "いえで、よるの うちに でんきを ためることも できます。", zh: "也可以在家裡趁夜間儲存電力。"}
  - {jp: "朝になると、車はもう走れる用意ができています。", kana: "あさに なると、くるまは もう はしれる よういが できて います。", zh: "到了早上，車子已經準備好可以行駛了。"}
  - {jp: "これは、とても便利だと思います。", kana: "これは、とても べんりだと おもいます。", zh: "我覺得這非常方便。"}
  - {jp: "しかし、EVには、まだ問題もあります。", kana: "しかし、EVには、まだ もんだいも あります。", zh: "不過，EV還是有一些問題。"}
  - {jp: "一つ目は、値段です。", kana: "ひとつめは、ねだんです。", zh: "第一個是價格。"}
  - {jp: "EVは、ガソリンの車より高いことが多いです。", kana: "EVは、がそりんの くるまより たかいことが おおいです。", zh: "EV通常比汽油車貴。"}
  - {jp: "大きな電池が、高いからです。", kana: "おおきな でんちが、たかいからです。", zh: "因為大型電池很貴。"}
  - {jp: "だから、買いたくても買えない人もいます。", kana: "だから、かいたくても かえない ひとも います。", zh: "所以也有人想買卻買不起。"}
  - {jp: "二つ目は、充電の問題です。", kana: "ふたつめは、じゅうでんの もんだいです。", zh: "第二個是充電的問題。"}
  - {jp: "EVは、電気がなくなると走れません。", kana: "EVは、でんきが なくなると はしれません。", zh: "EV沒電就無法行駛。"}
  - {jp: "ですから、ときどき電気を入れなければなりません。", kana: "ですから、ときどき でんきを いれなければ なりません。", zh: "因此，必須偶爾充電。"}
  - {jp: "電気を入れることを、充電と言います。", kana: "でんきを いれることを、じゅうでんと いいます。", zh: "把電充入稱為充電。"}
  - {jp: "充電には、少し時間がかかります。", kana: "じゅうでんには、すこし じかんが かかります。", zh: "充電要花一點時間。"}
  - {jp: "ガソリンを入れるより、長くかかることもあります。", kana: "がそりんを いれるより、ながく かかることも あります。", zh: "有時比加汽油還要花更久時間。"}
  - {jp: "急いでいるときは、これは少し不便です。", kana: "いそいで いるときは、これは すこし ふべんです。", zh: "趕時間的時候，這有點不方便。"}
  - {jp: "それから、充電する場所も大切です。", kana: "それから、じゅうでんする ばしょも たいせつです。", zh: "還有，充電的地點也很重要。"}
  - {jp: "町には、まだ充電する場所が少ない所もあります。", kana: "まちには、まだ じゅうでんする ばしょが すくない ところも あります。", zh: "城市裡也有充電地點還很少的地方。"}
  - {jp: "遠くへ行くとき、心配になる人もいます。", kana: "とおくへ いくとき、しんぱいに なる ひとも います。", zh: "去遠方時，也有人會擔心。"}
  - {jp: "「途中で電気がなくなったら、どうしよう」と思うのです。", kana: "とちゅうで でんきが なくなったら、どうしようと おもうのです。", zh: "他們會想「半路上沒電的話該怎麼辦」。"}
  - {jp: "でも、これらの問題は、少しずつ良くなっています。", kana: "でも、これらの もんだいは、すこしずつ よく なって います。", zh: "但是，這些問題正一點一點地改善。"}
  - {jp: "近年、充電する場所が増えてきました。", kana: "きんねん、じゅうでんする ばしょが ふえて きました。", zh: "近年來，充電的地點增加了。"}
  - {jp: "店の駐車場にも、充電する所ができました。", kana: "みせの ちゅうしゃじょうにも、じゅうでんする ところが できました。", zh: "在商店的停車場也設置了充電的地方。"}
  - {jp: "買い物をしている間に、充電できます。", kana: "かいものを して いる あいだに、じゅうでん できます。", zh: "在購物的時候就可以充電。"}
  - {jp: "これは、とても便利になりました。", kana: "これは、とても べんりに なりました。", zh: "這變得非常方便。"}
  - {jp: "また、電池の技術も進んでいます。", kana: "また、でんちの ぎじゅつも すすんで います。", zh: "另外，電池的技術也在進步。"}
  - {jp: "前より、早く充電できるようになりました。", kana: "まえより、はやく じゅうでん できるように なりました。", zh: "變得比以前能更快充電了。"}
  - {jp: "一回の充電で、長く走れる車も出てきました。", kana: "いっかいの じゅうでんで、ながく はしれる くるまも でて きました。", zh: "也出現了充一次電能行駛很久的車。"}
  - {jp: "技術は、毎年どんどん進んでいます。", kana: "ぎじゅつは、まいとし どんどん すすんで います。", zh: "技術每年都在不斷進步。"}
  - {jp: "値段も、前より少しずつ下がってきました。", kana: "ねだんも、まえより すこしずつ さがって きました。", zh: "價格也比以前一點一點地下降了。"}
  - {jp: "これから、もっと安くなると言われています。", kana: "これから、もっと やすく なると いわれて います。", zh: "據說今後會變得更便宜。"}
  - {jp: "ところで、EVは電気で走ります。", kana: "ところで、EVは でんきで はしります。", zh: "話說回來，EV是用電行駛的。"}
  - {jp: "では、その電気は、どこから来るのでしょうか。", kana: "では、その でんきは、どこから くるのでしょうか。", zh: "那麼，那些電是從哪裡來的呢？"}
  - {jp: "これは、とても大切な質問です。", kana: "これは、とても たいせつな しつもんです。", zh: "這是個非常重要的問題。"}
  - {jp: "もし、その電気を汚い方法で作ったら、どうでしょう。", kana: "もし、その でんきを きたない ほうほうで つくったら、どうでしょう。", zh: "如果那些電是用骯髒的方法製造的，會怎麼樣呢？"}
  - {jp: "それでは、空気がきれいになりません。", kana: "それでは、くうきが きれいに なりません。", zh: "那樣的話，空氣就不會變乾淨。"}
  - {jp: "ですから、電気の作り方も大切なのです。", kana: "ですから、でんきの つくりかたも たいせつなのです。", zh: "因此，電的製造方式也很重要。"}
  - {jp: "ここで、新しいエネルギーが出てきます。", kana: "ここで、あたらしい えねるぎーが でて きます。", zh: "這時候，新的能源就登場了。"}
  - {jp: "それは、太陽や風から作る電気です。", kana: "それは、たいようや かぜから つくる でんきです。", zh: "那就是用太陽和風製造的電。"}
  - {jp: "太陽の光から、電気を作ることができます。", kana: "たいようの ひかりから、でんきを つくることが できます。", zh: "可以用太陽的光製造電。"}
  - {jp: "これを、太陽光発電と言います。", kana: "これを、たいようこう はつでんと いいます。", zh: "這稱為太陽能發電。"}
  - {jp: "{{屋根|やね}}の{{上|うえ}}に、{{黒|くろ}}い{{板|いた}}をのせている{{家|いえ}}を{{見|み}}たことがありますか。", kana: "やねの うえに、くろい いたを のせて いる いえを みたことが ありますか。", zh: "你看過屋頂上放著黑色板子的房子嗎？"}
  - {jp: "あの板で、太陽の光を電気に変えています。", kana: "あの いたで、たいようの ひかりを でんきに かえて います。", zh: "那種板子把太陽的光轉變成電。"}
  - {jp: "昼間、太陽が出ている間、電気ができます。", kana: "ひるま、たいようが でて いる あいだ、でんきが できます。", zh: "白天太陽出來的時候會產生電。"}
  - {jp: "風からも、電気を作ることができます。", kana: "かぜからも、でんきを つくることが できます。", zh: "也可以用風製造電。"}
  - {jp: "大きな風車が、風で回ります。", kana: "おおきな ふうしゃが、かぜで まわります。", zh: "大型風車會被風吹動旋轉。"}
  - {jp: "その回る力で、電気を作るのです。", kana: "その まわる ちからで、でんきを つくるのです。", zh: "用那旋轉的力量製造電。"}
  - {jp: "これを、風力発電と言います。", kana: "これを、ふうりょく はつでんと いいます。", zh: "這稱為風力發電。"}
  - {jp: "海の近くや、山の上に、風車がよくあります。", kana: "うみの ちかくや、やまの うえに、ふうしゃが よく あります。", zh: "在海邊或山上常常有風車。"}
  - {jp: "太陽の光も、風も、なくなりません。", kana: "たいようの ひかりも、かぜも、なくなりません。", zh: "太陽的光和風都不會用完。"}
  - {jp: "毎日、何度でも使うことができます。", kana: "まいにち、なんどでも つかうことが できます。", zh: "每天都可以一再使用。"}
  - {jp: "このようなエネルギーを、再生可能エネルギーと言います。", kana: "このような えねるぎーを、さいせいかのう えねるぎーと いいます。", zh: "這樣的能源稱為再生能源。"}
  - {jp: "名前は少し長くて、難しいですね。", kana: "なまえは すこし ながくて、むずかしいですね。", zh: "這個名字有點長又難呢。"}
  - {jp: "でも、意味は簡単です。", kana: "でも、いみは かんたんです。", zh: "但是意思很簡單。"}
  - {jp: "「何度も使える、きれいなエネルギー」という意味です。", kana: "なんども つかえる、きれいな えねるぎーと いう いみです。", zh: "意思是「可以重複使用的乾淨能源」。"}
  - {jp: "この電気で、EVを充電したら、どうでしょう。", kana: "この でんきで、EVを じゅうでん したら、どうでしょう。", zh: "如果用這種電來為EV充電，會怎麼樣呢？"}
  - {jp: "それなら、空気はもっときれいになります。", kana: "それなら、くうきは もっと きれいに なります。", zh: "那樣的話，空氣會變得更乾淨。"}
  - {jp: "車も電気も、両方きれいになるのです。", kana: "くるまも でんきも、りょうほう きれいに なるのです。", zh: "車子和電兩者都會變乾淨。"}
  - {jp: "これが、多くの人が考えている未来です。", kana: "これが、おおくの ひとが かんがえて いる みらいです。", zh: "這就是許多人所構想的未來。"}
  - {jp: "でも、再生可能エネルギーにも、課題があります。", kana: "でも、さいせいかのう えねるぎーにも、かだいが あります。", zh: "但是，再生能源也有課題。"}
  - {jp: "太陽は、夜には出ていません。", kana: "たいようは、よるには でて いません。", zh: "太陽在晚上不會出來。"}
  - {jp: "曇りの日や、雨の日も、光が弱いです。", kana: "くもりの ひや、あめの ひも、ひかりが よわいです。", zh: "陰天和雨天的光也很弱。"}
  - {jp: "風も、いつも同じように吹くわけではありません。", kana: "かぜも、いつも おなじように ふくわけでは ありません。", zh: "風也不是總是同樣地吹。"}
  - {jp: "風が強い日もあれば、弱い日もあります。", kana: "かぜが つよい ひも あれば、よわい ひも あります。", zh: "有風強的日子，也有風弱的日子。"}
  - {jp: "だから、作る電気の量が、いつも変わります。", kana: "だから、つくる でんきの りょうが、いつも かわります。", zh: "所以，製造的電量總是在變化。"}
  - {jp: "電気が多い日もあれば、少ない日もあります。", kana: "でんきが おおい ひも あれば、すくない ひも あります。", zh: "有電多的日子，也有電少的日子。"}
  - {jp: "これは、少し困ったことです。", kana: "これは、すこし こまった ことです。", zh: "這是個有點傷腦筋的事。"}
  - {jp: "そこで、電気をためる技術が大切になります。", kana: "そこで、でんきを ためる ぎじゅつが たいせつに なります。", zh: "於是，儲存電力的技術變得重要。"}
  - {jp: "電気が多いとき、大きな電池にためておきます。", kana: "でんきが おおいとき、おおきな でんちに ためて おきます。", zh: "電多的時候，先把電儲存在大型電池裡。"}
  - {jp: "そして、足りないときに、その電気を使います。", kana: "そして、たりないときに、その でんきを つかいます。", zh: "然後在不足的時候，使用那些電。"}
  - {jp: "このような大きな電池の研究も、進んでいます。", kana: "このような おおきな でんちの けんきゅうも、すすんで います。", zh: "這種大型電池的研究也在進步。"}
  - {jp: "おもしろいことに、EVの電池も役に立ちます。", kana: "おもしろいことに、EVの でんちも やくに たちます。", zh: "有趣的是，EV的電池也能派上用場。"}
  - {jp: "車を使っていないとき、車は止まっています。", kana: "くるまを つかって いないとき、くるまは とまって います。", zh: "不使用車的時候，車是停著的。"}
  - {jp: "その間、車の電池に電気をためておけます。", kana: "その あいだ、くるまの でんちに でんきを ためて おけます。", zh: "在那期間，可以把電儲存在車的電池裡。"}
  - {jp: "そして、家で電気が足りないとき、車から電気を使えます。", kana: "そして、いえで でんきが たりないとき、くるまから でんきを つかえます。", zh: "然後家裡電不夠的時候，可以從車子取用電。"}
  - {jp: "車が、動く電池のようになるのです。", kana: "くるまが、うごく でんちの ように なるのです。", zh: "車子變得就像會移動的電池一樣。"}
  - {jp: "これは、新しくておもしろい考え方です。", kana: "これは、あたらしくて おもしろい かんがえかたです。", zh: "這是個新穎又有趣的想法。"}
  - {jp: "さて、ここで少し、暮らしのことを考えてみましょう。", kana: "さて、ここで すこし、くらしの ことを かんがえて みましょう。", zh: "那麼，這裡來想想生活的事吧。"}
  - {jp: "環境にやさしい暮らしは、車だけの話ではありません。", kana: "かんきょうに やさしい くらしは、くるまだけの はなしでは ありません。", zh: "對環境友善的生活，不只是車子的事。"}
  - {jp: "毎日の小さなことも、大切です。", kana: "まいにちの ちいさな ことも、たいせつです。", zh: "每天的小事也很重要。"}
  - {jp: "たとえば、近い所へは、歩いて行きます。", kana: "たとえば、ちかい ところへは、あるいて いきます。", zh: "比如說，近的地方就走路去。"}
  - {jp: "または、自転車を使うのもいいです。", kana: "または、じてんしゃを つかうのも いいです。", zh: "或者，使用腳踏車也很好。"}
  - {jp: "自転車は、電気もガソリンも使いません。", kana: "じてんしゃは、でんきも がそりんも つかいません。", zh: "腳踏車不使用電也不使用汽油。"}
  - {jp: "体にもいいし、環境にもいいです。", kana: "からだにも いいし、かんきょうにも いいです。", zh: "對身體好，對環境也好。"}
  - {jp: "電車やバスを使うのも、いい方法です。", kana: "でんしゃや ばすを つかうのも、いい ほうほうです。", zh: "搭電車或公車也是好方法。"}
  - {jp: "多くの人が一緒に乗れば、エネルギーが少なくてすみます。", kana: "おおくの ひとが いっしょに のれば、えねるぎーが すくなくて すみます。", zh: "很多人一起搭乘，就能少用能源。"}
  - {jp: "近年、電気で走るバスも増えてきました。", kana: "きんねん、でんきで はしる ばすも ふえて きました。", zh: "近年來，用電行駛的公車也增加了。"}
  - {jp: "静かで、空気を汚さないバスです。", kana: "しずかで、くうきを よごさない ばすです。", zh: "是安靜又不污染空氣的公車。"}
  - {jp: "電気で走る電車は、前からたくさんあります。", kana: "でんきで はしる でんしゃは、まえから たくさん あります。", zh: "用電行駛的電車從以前就有很多。"}
  - {jp: "電車は、とても多くの人を運べます。", kana: "でんしゃは、とても おおくの ひとを はこべます。", zh: "電車能載運非常多的人。"}
  - {jp: "だから、電車はとても便利な乗り物です。", kana: "だから、でんしゃは とても べんりな のりものです。", zh: "因此，電車是非常方便的交通工具。"}
  - {jp: "家での暮らし方も、変えることができます。", kana: "いえでの くらしかたも、かえることが できます。", zh: "在家的生活方式也可以改變。"}
  - {jp: "使わない部屋の電気は、消します。", kana: "つかわない へやの でんきは、けします。", zh: "不使用的房間的電燈就關掉。"}
  - {jp: "電気をむだに使わないことが、大切です。", kana: "でんきを むだに つかわないことが、たいせつです。", zh: "不浪費電是很重要的。"}
  - {jp: "電気を少なく使う、新しい電気製品も増えました。", kana: "でんきを すくなく つかう、あたらしい でんきせいひんも ふえました。", zh: "用電少的新型電器也增加了。"}
  - {jp: "前のものより、ずっと電気を使わなくなりました。", kana: "まえの ものより、ずっと でんきを つかわなく なりました。", zh: "比起以前的東西，用電變少很多了。"}
  - {jp: "こうして、一人ひとりが少しずつ気をつけます。", kana: "こうして、ひとりひとりが すこしずつ きを つけます。", zh: "就這樣，每個人一點一點地注意。"}
  - {jp: "すると、町全体で大きな力になります。", kana: "すると、まちぜんたいで おおきな ちからに なります。", zh: "如此一來，整個城市就會成為很大的力量。"}
  - {jp: "では、これからの町は、どうなるでしょうか。", kana: "では、これからの まちは、どう なるでしょうか。", zh: "那麼，今後的城市會變成怎樣呢？"}
  - {jp: "少し、未来の町を想像してみましょう。", kana: "すこし、みらいの まちを そうぞう して みましょう。", zh: "稍微想像一下未來的城市吧。"}
  - {jp: "未来の町では、ほとんどの車が電気で走ります。", kana: "みらいの まちでは、ほとんどの くるまが でんきで はしります。", zh: "在未來的城市，幾乎所有的車都用電行駛。"}
  - {jp: "だから、町の空気は、とてもきれいです。", kana: "だから、まちの くうきは、とても きれいです。", zh: "因此，城市的空氣非常乾淨。"}
  - {jp: "車の音も静かなので、町は静かです。", kana: "くるまの おとも しずかなので、まちは しずかです。", zh: "車子的聲音也很安靜，所以城市很安靜。"}
  - {jp: "鳥の声が、よく聞こえるかもしれません。", kana: "とりの こえが、よく きこえるかも しれません。", zh: "或許能清楚地聽到鳥叫聲。"}
  - {jp: "家の屋根には、太陽の板がのっています。", kana: "いえの やねには、たいようの いたが のって います。", zh: "房子的屋頂上放著太陽能板。"}
  - {jp: "家で作った電気で、車を充電します。", kana: "いえで つくった でんきで、くるまを じゅうでん します。", zh: "用家裡製造的電為車子充電。"}
  - {jp: "町の外には、たくさんの風車が回っています。", kana: "まちの そとには、たくさんの ふうしゃが まわって います。", zh: "城市外面有許多風車在旋轉。"}
  - {jp: "道を走る車は、自分で運転するかもしれません。", kana: "みちを はしる くるまは、じぶんで うんてんするかも しれません。", zh: "在路上行駛的車或許會自己駕駛。"}
  - {jp: "人は、座っているだけでいいのです。", kana: "ひとは、すわって いるだけで いいのです。", zh: "人只要坐著就好了。"}
  - {jp: "そんな車も、研究されています。", kana: "そんな くるまも、けんきゅう されて います。", zh: "這樣的車也正在研究中。"}
  - {jp: "空を飛ぶ乗り物を考えている人もいます。", kana: "そらを とぶ のりものを かんがえて いる ひとも います。", zh: "也有人在構想會飛上天的交通工具。"}
  - {jp: "それは、まだ夢のような話です。", kana: "それは、まだ ゆめの ような はなしです。", zh: "那還是像夢一樣的事。"}
  - {jp: "でも、昔は、電気で走る車も夢でした。", kana: "でも、むかしは、でんきで はしる くるまも ゆめでした。", zh: "但是以前，用電行駛的車也是夢想。"}
  - {jp: "その夢が、今、本物になってきています。", kana: "その ゆめが、いま、ほんものに なって きて います。", zh: "那個夢想，現在正逐漸成真。"}
  - {jp: "だから、空を飛ぶ乗り物も、いつかできるかもしれません。", kana: "だから、そらを とぶ のりものも、いつか できるかも しれません。", zh: "所以會飛上天的交通工具，總有一天或許也能實現。"}
  - {jp: "技術は、わたしたちが思うより、ずっと速く進みます。", kana: "ぎじゅつは、わたしたちが おもうより、ずっと はやく すすみます。", zh: "技術進步得比我們想的還要快得多。"}
  - {jp: "ここで、わたしの考えを少し書きます。", kana: "ここで、わたしの かんがえを すこし かきます。", zh: "在這裡，我寫一點我的想法。"}
  - {jp: "新しい技術は、とてもすばらしいと思います。", kana: "あたらしい ぎじゅつは、とても すばらしいと おもいます。", zh: "我覺得新技術非常了不起。"}
  - {jp: "でも、技術だけでは、十分ではありません。", kana: "でも、ぎじゅつだけでは、じゅうぶんでは ありません。", zh: "但是，光有技術是不夠的。"}
  - {jp: "わたしたちの考え方も、大切だと思います。", kana: "わたしたちの かんがえかたも、たいせつだと おもいます。", zh: "我認為我們的想法也很重要。"}
  - {jp: "ものを大切に使う気持ちが、必要です。", kana: "ものを たいせつに つかう きもちが、ひつようです。", zh: "需要珍惜使用物品的心情。"}
  - {jp: "そして、未来のことを考える気持ちも、必要です。", kana: "そして、みらいの ことを かんがえる きもちも、ひつようです。", zh: "而且，為未來著想的心情也是需要的。"}
  - {jp: "今の便利さだけを考えてはいけません。", kana: "いまの べんりさだけを かんがえては いけません。", zh: "不可以只考慮現在的方便。"}
  - {jp: "次の世代のことも、考えなければなりません。", kana: "つぎの せだいの ことも、かんがえなければ なりません。", zh: "也必須為下一代著想。"}
  - {jp: "子供たちが、きれいな空気の中で暮らせるように、です。", kana: "こどもたちが、きれいな くうきの なかで くらせるように、です。", zh: "為了讓孩子們能在乾淨的空氣中生活。"}
  - {jp: "電気自動車は、その大きな一歩だと思います。", kana: "でんきじどうしゃは、その おおきな いっぽだと おもいます。", zh: "我認為電動車是那重要的一步。"}
  - {jp: "もちろん、まだ問題は残っています。", kana: "もちろん、まだ もんだいは のこって います。", zh: "當然，問題還是存在。"}
  - {jp: "値段や充電の課題は、すぐには消えません。", kana: "ねだんや じゅうでんの かだいは、すぐには きえません。", zh: "價格和充電的課題不會馬上消失。"}
  - {jp: "でも、多くの人が、その課題を解決しようとしています。", kana: "でも、おおくの ひとが、その かだいを かいけつ しようと して います。", zh: "但是，很多人正試圖解決那些課題。"}
  - {jp: "研究をする人、車を作る人、電気を作る人がいます。", kana: "けんきゅうを する ひと、くるまを つくる ひと、でんきを つくる ひとが います。", zh: "有做研究的人、造車的人、發電的人。"}
  - {jp: "そして、それを買って使う、わたしたちもいます。", kana: "そして、それを かって つかう、わたしたちも います。", zh: "還有買來使用的我們。"}
  - {jp: "みんなが少しずつ力を合わせています。", kana: "みんなが すこしずつ ちからを あわせて います。", zh: "大家正一點一點地齊心協力。"}
  - {jp: "だから、未来はきっと明るいと思います。", kana: "だから、みらいは きっと あかるいと おもいます。", zh: "所以，我認為未來一定是光明的。"}
  - {jp: "電気自動車と、きれいなエネルギー。", kana: "でんきじどうしゃと、きれいな えねるぎー。", zh: "電動車與乾淨的能源。"}
  - {jp: "この二つは、これからの暮らしを大きく変えるでしょう。", kana: "この ふたつは、これからの くらしを おおきく かえるでしょう。", zh: "這兩者將會大大改變今後的生活吧。"}
  - {jp: "わたしたちの町も、空気も、もっと良くなります。", kana: "わたしたちの まちも、くうきも、もっと よく なります。", zh: "我們的城市和空氣都會變得更好。"}
  - {jp: "そんな未来を、わたしは楽しみにしています。", kana: "そんな みらいを、わたしは たのしみに して います。", zh: "我很期待那樣的未來。"}
  - {jp: "みなさんも、ぜひ一緒に考えてみてください。", kana: "みなさんも、ぜひ いっしょに かんがえて みてください。", zh: "也請大家務必一起想想看。"}
  - {jp: "小さなことから、始められます。", kana: "ちいさな ことから、はじめられます。", zh: "可以從小事開始。"}
  - {jp: "それが、きれいな未来への第一歩です。", kana: "それが、きれいな みらいへの だいいっぽです。", zh: "那就是邁向乾淨未來的第一步。"}
