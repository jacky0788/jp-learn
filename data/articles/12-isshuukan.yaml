title: わたしの一週間（我的一週）
level: N4
order: 120
intro: |
  用星期、たり〜たり、ので、〜やすい 等講一週的生活。
body:
  - {jp: "わたしの一週間は、とても規則正しいです。", kana: "わたしの いっしゅうかんは、とても きそくただしいです。", zh: "我的一週很規律。"}
  - {jp: "月曜日から金曜日まで、学校へ行きます。", kana: "げつようびから きんようびまで、がっこうへ いきます。", zh: "週一到週五去學校。"}
  - {jp: "月曜日は、朝早く起きるのが、少しつらいです。", kana: "げつようびは、あさ はやく おきるのが、すこし つらいです。", zh: "星期一早起有點痛苦。"}
  - {jp: "火曜日と木曜日は、日本語の会話の授業があります。", kana: "かようびと もくようびは、にほんごの かいわの じゅぎょうが あります。", zh: "週二和週四有日語會話課。"}
  - {jp: "会話の授業では、たくさん話せるので、楽しいです。", kana: "かいわの じゅぎょうでは、たくさん はなせるので、たのしいです。", zh: "會話課能說很多話，所以很開心。"}
  - {jp: "水曜日の午後は、アルバイトをしています。", kana: "すいようびの ごごは、あるばいとを して います。", zh: "週三下午在打工。"}
  - {jp: "コンビニで働いていて、いい練習になります。", kana: "こんびにで はたらいて いて、いい れんしゅうに なります。", zh: "在便利商店工作，是很好的練習。"}
  - {jp: "金曜日の夜は、友達とごはんを食べに行きます。", kana: "きんようびの よるは、ともだちと ごはんを たべに いきます。", zh: "週五晚上和朋友去吃飯。"}
  - {jp: "一週間がんばった後のごはんは、おいしいです。", kana: "いっしゅうかん がんばった あとの ごはんは、おいしいです。", zh: "努力一週後吃的飯特別好吃。"}
  - {jp: "土曜日は、家でゆっくり休みます。", kana: "どようびは、いえで ゆっくり やすみます。", zh: "星期六在家好好休息。"}
  - {jp: "部屋を掃除したり、洗濯をしたりします。", kana: "へやを そうじしたり、せんたくを したり します。", zh: "打掃房間、洗衣服之類的。"}
  - {jp: "午後は、好きな映画を見ることが多いです。", kana: "ごごは、すきな えいがを みる ことが おおいです。", zh: "下午常看喜歡的電影。"}
  - {jp: "日曜日は、次の週の準備をします。", kana: "にちようびは、つぎの しゅうの じゅんびを します。", zh: "星期日做下週的準備。"}
  - {jp: "宿題をしたり、単語を覚えたりします。", kana: "しゅくだいを したり、たんごを おぼえたり します。", zh: "寫作業、背單字之類的。"}
  - {jp: "時々、公園を散歩して、気分転換をします。", kana: "ときどき、こうえんを さんぽして、きぶんてんかんを します。", zh: "偶爾去公園散步，轉換心情。"}
  - {jp: "忙しい毎日ですが、充実しています。", kana: "いそがしい まいにちですが、じゅうじつして います。", zh: "雖然每天忙碌，但很充實。"}
  - {jp: "規則正しい生活は、健康にもいいと思います。", kana: "きそくただしい せいかつは、けんこうにも いいと おもいます。", zh: "規律的生活我覺得對健康也好。"}
