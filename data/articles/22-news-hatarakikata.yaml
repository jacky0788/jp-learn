title: "変わる働き方（改變中的工作方式・新聞長文）"
level: "N4（長文）"
order: 360
intro: |
  近年、人々の工作方式正在改變。本文介紹在家工作的好處與難處、工作與生活的平衡，以及選擇適合自己的工作方式。使用です・ます体與〜たり〜たり、〜ようになる、〜なければなりません等N4文法。
body:
  - {jp: "近年、人々の働き方が大きく変わりました。", kana: "きんねん、ひとびとの はたらきかたが おおきく かわりました。", zh: "近年來，人們的工作方式有了很大的改變。"}
  - {jp: "昔は、ほとんどの人が会社へ行って働きました。", kana: "むかしは、ほとんどの ひとが かいしゃへ いって はたらきました。", zh: "以前，大部分的人都是去公司工作。"}
  - {jp: "朝、家を出て、電車やバスに乗りました。", kana: "あさ、いえを でて、でんしゃや ばすに のりました。", zh: "早上出門，搭電車或公車。"}
  - {jp: "そして、会社の机の前で、一日中仕事をしました。", kana: "そして、かいしゃの つくえの まえで、いちにちじゅう しごとを しました。", zh: "然後在公司的桌子前工作一整天。"}
  - {jp: "夕方になると、また電車に乗って家に帰りました。", kana: "ゆうがたに なると、また でんしゃに のって いえに かえりました。", zh: "到了傍晚，再搭電車回家。"}
  - {jp: "これが、多くの人の毎日でした。", kana: "これが、おおくの ひとの まいにちでした。", zh: "這就是許多人的每一天。"}
  - {jp: "しかし、最近はその形が変わってきました。", kana: "しかし、さいきんは その かたちが かわって きました。", zh: "但是，最近這個形式漸漸改變了。"}
  - {jp: "家で働く人が、だんだん増えてきたのです。", kana: "いえで はたらく ひとが、だんだん ふえて きたのです。", zh: "在家工作的人，漸漸增加了。"}
  - {jp: "このような働き方を、リモートワークと言います。", kana: "このような はたらきかたを、リモートワークと いいます。", zh: "這樣的工作方式叫做遠距工作。"}
  - {jp: "家で働くことを、在宅勤務とも言います。", kana: "いえで はたらく ことを、ざいたくきんむとも いいます。", zh: "在家工作也叫做在宅辦公。"}
  - {jp: "パソコンとインターネットがあれば、家で仕事ができます。", kana: "パソコンと インターネットが あれば、いえで しごとが できます。", zh: "只要有電腦和網路，就能在家工作。"}
  - {jp: "会社へ行かなくても、仕事を進められるようになりました。", kana: "かいしゃへ いかなくても、しごとを すすめられる ように なりました。", zh: "變得不用去公司也能推進工作了。"}
  - {jp: "ある国では、家で働く人がとても多くなりました。", kana: "ある くにでは、いえで はたらく ひとが とても おおく なりました。", zh: "在某些國家，在家工作的人變得非常多。"}
  - {jp: "若い人だけでなく、年上の人も家で働いています。", kana: "わかい ひとだけでなく、としうえの ひとも いえで はたらいて います。", zh: "不只是年輕人，年長的人也在家工作。"}
  - {jp: "では、家で働くことには、どんな良い点があるのでしょうか。", kana: "では、いえで はたらく ことには、どんな よい てんが あるのでしょうか。", zh: "那麼，在家工作有哪些好處呢？"}
  - {jp: "まず、通勤がないことです。", kana: "まず、つうきんが ない ことです。", zh: "首先，是不用通勤。"}
  - {jp: "会社まで行く時間が、いらなくなりました。", kana: "かいしゃまで いく じかんが、いらなく なりました。", zh: "去公司的時間變得不需要了。"}
  - {jp: "毎朝、満員電車に乗らなくてもいいのです。", kana: "まいあさ、まんいんでんしゃに のらなくても いいのです。", zh: "每天早上不用搭擁擠的電車也可以。"}
  - {jp: "満員電車は、本当に疲れます。", kana: "まんいんでんしゃは、ほんとうに つかれます。", zh: "擁擠的電車真的很累人。"}
  - {jp: "通勤に、一時間も二時間もかかる人もいます。", kana: "つうきんに、いちじかんも にじかんも かかる ひとも います。", zh: "也有人通勤要花一兩個小時。"}
  - {jp: "その時間を、ほかのことに使えます。", kana: "その じかんを、ほかの ことに つかえます。", zh: "那些時間可以用在別的事情上。"}
  - {jp: "朝、ゆっくり寝ることもできます。", kana: "あさ、ゆっくり ねる ことも できます。", zh: "早上也可以好好睡。"}
  - {jp: "朝ごはんを、ゆっくり食べられます。", kana: "あさごはんを、ゆっくり たべられます。", zh: "可以悠閒地吃早餐。"}
  - {jp: "家族と話す時間も、増えました。", kana: "かぞくと はなす じかんも、ふえました。", zh: "和家人說話的時間也增加了。"}
  - {jp: "次に、時間が自由になることです。", kana: "つぎに、じかんが じゆうに なる ことです。", zh: "其次，是時間變得自由。"}
  - {jp: "自分の好きな時間に、仕事を始められます。", kana: "じぶんの すきな じかんに、しごとを はじめられます。", zh: "可以在自己喜歡的時間開始工作。"}
  - {jp: "少し休んでから、また仕事をすることもできます。", kana: "すこし やすんでから、また しごとを する ことも できます。", zh: "也可以稍微休息後再工作。"}
  - {jp: "昼間に、家のことをすることもできます。", kana: "ひるまに、いえの ことを する ことも できます。", zh: "白天也可以做家裡的事。"}
  - {jp: "洗濯をしたり、料理を作ったりできます。", kana: "せんたくを したり、りょうりを つくったり できます。", zh: "可以洗衣服、做菜。"}
  - {jp: "小さい子供がいる人には、これはとても助かります。", kana: "ちいさい こどもが いる ひとには、これは とても たすかります。", zh: "對有小孩的人來說，這非常有幫助。"}
  - {jp: "子供のそばで、働くことができるからです。", kana: "こどもの そばで、はたらく ことが できるからです。", zh: "因為可以在小孩身邊工作。"}
  - {jp: "それから、好きな場所で働けることもあります。", kana: "それから、すきな ばしょで はたらける ことも あります。", zh: "再來，有時也能在喜歡的地方工作。"}
  - {jp: "家の中の、いちばん静かな部屋を選べます。", kana: "いえの なかの、いちばん しずかな へやを えらべます。", zh: "可以選家裡最安靜的房間。"}
  - {jp: "自分の好きな音楽を聞きながら、働く人もいます。", kana: "じぶんの すきな おんがくを ききながら、はたらく ひとも います。", zh: "也有人一邊聽喜歡的音樂一邊工作。"}
  - {jp: "町から遠い、田舎に住むこともできます。", kana: "まちから とおい、いなかに すむ ことも できます。", zh: "也可以住在離鎮上很遠的鄉下。"}
  - {jp: "自然の多い場所で、働きたい人もいます。", kana: "しぜんの おおい ばしょで、はたらきたい ひとも います。", zh: "也有人想在自然多的地方工作。"}
  - {jp: "海の近くや、山の近くで働く人もいます。", kana: "うみの ちかくや、やまの ちかくで はたらく ひとも います。", zh: "也有人在海邊或山邊工作。"}
  - {jp: "このように、家で働くことには良い点がたくさんあります。", kana: "このように、いえで はたらく ことには よい てんが たくさん あります。", zh: "像這樣，在家工作有很多好處。"}
  - {jp: "しかし、難しい点もあります。", kana: "しかし、むずかしい てんも あります。", zh: "但是，也有困難的地方。"}
  - {jp: "良いことばかりではありません。", kana: "よい ことばかりでは ありません。", zh: "並不全都是好事。"}
  - {jp: "まず、さびしいと感じる人がいます。", kana: "まず、さびしいと かんじる ひとが います。", zh: "首先，有人會感到寂寞。"}
  - {jp: "一日中、家に一人でいるからです。", kana: "いちにちじゅう、いえに ひとりで いるからです。", zh: "因為一整天都一個人在家。"}
  - {jp: "会社では、いろいろな人と話せます。", kana: "かいしゃでは、いろいろな ひとと はなせます。", zh: "在公司可以和各種人說話。"}
  - {jp: "同僚と、お昼ご飯を一緒に食べられます。", kana: "どうりょうと、おひるごはんを いっしょに たべられます。", zh: "可以和同事一起吃午餐。"}
  - {jp: "仕事のあとで、お茶を飲みに行くこともあります。", kana: "しごとの あとで、おちゃを のみに いく ことも あります。", zh: "工作後有時也會去喝杯茶。"}
  - {jp: "でも、家ではそういうことができません。", kana: "でも、いえでは そういう ことが できません。", zh: "但是在家就無法做這些事。"}
  - {jp: "一日中、だれとも話さない日もあります。", kana: "いちにちじゅう、だれとも はなさない ひも あります。", zh: "也有一整天都不和任何人說話的日子。"}
  - {jp: "声を出さないと、気持ちが暗くなることもあります。", kana: "こえを ださないと、きもちが くらく なる ことも あります。", zh: "不出聲的話，心情有時也會變得低落。"}
  - {jp: "人と会わないと、さびしくなる人は多いです。", kana: "ひとと あわないと、さびしく なる ひとは おおいです。", zh: "不和人見面就會感到寂寞的人很多。"}
  - {jp: "次に、運動不足になりやすいことです。", kana: "つぎに、うんどうぶそくに なりやすい ことです。", zh: "其次，是容易運動不足。"}
  - {jp: "家にいると、あまり歩きません。", kana: "いえに いると、あまり あるきません。", zh: "在家的話，不太走路。"}
  - {jp: "会社へ行くときは、駅まで歩きます。", kana: "かいしゃへ いく ときは、えきまで あるきます。", zh: "去公司時，會走到車站。"}
  - {jp: "駅の階段を、上ったり下りたりします。", kana: "えきの かいだんを、のぼったり おりたり します。", zh: "會上下車站的樓梯。"}
  - {jp: "でも、家ではほとんど動きません。", kana: "でも、いえでは ほとんど うごきません。", zh: "但是在家幾乎不動。"}
  - {jp: "朝起きてから、ずっと座っている人もいます。", kana: "あさ おきてから、ずっと すわって いる ひとも います。", zh: "也有人從早上起床後就一直坐著。"}
  - {jp: "体を動かさないと、健康に良くありません。", kana: "からだを うごかさないと、けんこうに よく ありません。", zh: "不動身體對健康不好。"}
  - {jp: "肩や腰が痛くなる人もいます。", kana: "かたや こしが いたく なる ひとも います。", zh: "也有人肩膀或腰會痛。"}
  - {jp: "目が疲れる人も多いです。", kana: "めが つかれる ひとも おおいです。", zh: "眼睛疲勞的人也很多。"}
  - {jp: "一日中、パソコンの画面を見ているからです。", kana: "いちにちじゅう、パソコンの がめんを みて いるからです。", zh: "因為一整天都看著電腦的螢幕。"}
  - {jp: "それから、もう一つ難しい点があります。", kana: "それから、もう ひとつ むずかしい てんが あります。", zh: "再來，還有一個困難的地方。"}
  - {jp: "それは、{{仕事|しごと}}と{{休|やす}}みの{{区別|くべつ}}です。", kana: "それは、しごとと やすみの くべつです。", zh: "那就是工作和休息的區別。"}
  - {jp: "家で働くと、仕事と生活の場所が同じになります。", kana: "いえで はたらくと、しごとと せいかつの ばしょが おなじに なります。", zh: "在家工作的話，工作和生活的地方變得一樣。"}
  - {jp: "だから、いつ仕事を終わればいいか、わからなくなります。", kana: "だから、いつ しごとを おわれば いいか、わからなく なります。", zh: "所以變得不知道什麼時候該結束工作。"}
  - {jp: "夜になっても、仕事を続けてしまう人がいます。", kana: "よるに なっても、しごとを つづけて しまう ひとが います。", zh: "也有人到了晚上還繼續工作。"}
  - {jp: "休みの日にも、つい仕事のことを考えます。", kana: "やすみの ひにも、つい しごとの ことを かんがえます。", zh: "連休假日也不自覺地想著工作的事。"}
  - {jp: "パソコンがすぐそばにあるからです。", kana: "パソコンが すぐ そばに あるからです。", zh: "因為電腦就在身邊。"}
  - {jp: "メールが来ると、すぐに返事をしてしまいます。", kana: "メールが くると、すぐに へんじを して しまいます。", zh: "信件來了，就會馬上回覆。"}
  - {jp: "こうして、休む時間がだんだん少なくなります。", kana: "こうして、やすむ じかんが だんだん すくなく なります。", zh: "就這樣，休息的時間漸漸變少。"}
  - {jp: "ゆっくり休めないと、人は疲れてしまいます。", kana: "ゆっくり やすめないと、ひとは つかれて しまいます。", zh: "不能好好休息的話，人就會累垮。"}
  - {jp: "ですから、仕事と生活のバランスがとても大切です。", kana: "ですから、しごとと せいかつの バランスが とても たいせつです。", zh: "所以，工作和生活的平衡非常重要。"}
  - {jp: "働く時間と、休む時間を分けなければなりません。", kana: "はたらく じかんと、やすむ じかんを わけなければ なりません。", zh: "必須把工作的時間和休息的時間分開。"}
  - {jp: "では、どうすれば良いのでしょうか。", kana: "では、どう すれば よいのでしょうか。", zh: "那麼，該怎麼做才好呢？"}
  - {jp: "いくつか、良い方法があります。", kana: "いくつか、よい ほうほうが あります。", zh: "有幾個好方法。"}
  - {jp: "まず、仕事を始める時間を決めることです。", kana: "まず、しごとを はじめる じかんを きめる ことです。", zh: "首先，決定開始工作的時間。"}
  - {jp: "そして、仕事を終わる時間も決めます。", kana: "そして、しごとを おわる じかんも きめます。", zh: "然後，也決定結束工作的時間。"}
  - {jp: "その時間になったら、パソコンを閉じます。", kana: "その じかんに なったら、パソコンを とじます。", zh: "到了那個時間，就關上電腦。"}
  - {jp: "仕事のことは、もう考えないようにします。", kana: "しごとの ことは、もう かんがえない ように します。", zh: "盡量不再想工作的事。"}
  - {jp: "次に、仕事をする場所を決めることです。", kana: "つぎに、しごとを する ばしょを きめる ことです。", zh: "其次，決定工作的地方。"}
  - {jp: "ベッドの上で、仕事をしないほうがいいです。", kana: "ベッドの うえで、しごとを しないほうが いいです。", zh: "最好不要在床上工作。"}
  - {jp: "仕事をする部屋と、休む部屋を分けます。", kana: "しごとを する へやと、やすむ へやを わけます。", zh: "把工作的房間和休息的房間分開。"}
  - {jp: "そうすると、気持ちも切り替えやすくなります。", kana: "そう すると、きもちも きりかえやすく なります。", zh: "這樣的話，心情也比較容易轉換。"}
  - {jp: "それから、毎日少し運動をすることです。", kana: "それから、まいにち すこし うんどうを する ことです。", zh: "再來，每天做一點運動。"}
  - {jp: "朝、外を散歩する人もいます。", kana: "あさ、そとを さんぽする ひとも います。", zh: "也有人早上在外面散步。"}
  - {jp: "仕事の前に、軽く体を動かします。", kana: "しごとの まえに、かるく からだを うごかします。", zh: "工作前，輕輕活動一下身體。"}
  - {jp: "仕事の途中で、立って休むこともいいです。", kana: "しごとの とちゅうで、たって やすむ ことも いいです。", zh: "工作中站起來休息一下也不錯。"}
  - {jp: "一時間に一度、少し歩くといいです。", kana: "いちじかんに いちど、すこし あるくと いいです。", zh: "每一個小時，稍微走一走比較好。"}
  - {jp: "水を飲みに、台所へ行くだけでもいいのです。", kana: "みずを のみに、だいどころへ いく だけでも いいのです。", zh: "就算只是去廚房喝水也可以。"}
  - {jp: "音楽を聞きながら、体を動かす人もいます。", kana: "おんがくを ききながら、からだを うごかす ひとも います。", zh: "也有人一邊聽音樂一邊運動。"}
  - {jp: "運動をすると、気持ちも明るくなります。", kana: "うんどうを すると、きもちも あかるく なります。", zh: "運動的話，心情也會變得開朗。"}
  - {jp: "そして、ときどき人と会うことも大切です。", kana: "そして、ときどき ひとと あう ことも たいせつです。", zh: "還有，偶爾和人見面也很重要。"}
  - {jp: "友達と、お昼ご飯を食べに行きます。", kana: "ともだちと、おひるごはんを たべに いきます。", zh: "和朋友去吃午餐。"}
  - {jp: "同僚と、ときどき電話で話します。", kana: "どうりょうと、ときどき でんわで はなします。", zh: "偶爾和同事用電話聊聊。"}
  - {jp: "週に一度、会社へ行く人もいます。", kana: "しゅうに いちど、かいしゃへ いく ひとも います。", zh: "也有人一週去一次公司。"}
  - {jp: "人と話すと、さびしい気持ちが消えます。", kana: "ひとと はなすと、さびしい きもちが きえます。", zh: "和人說話的話，寂寞的心情就會消失。"}
  - {jp: "近くのカフェで、働く人もいます。", kana: "ちかくの カフェで、はたらく ひとも います。", zh: "也有人在附近的咖啡店工作。"}
  - {jp: "ほかの人がいる場所のほうが、集中できる人もいます。", kana: "ほかの ひとが いる ばしょの ほうが、しゅうちゅうできる ひとも います。", zh: "也有人在有別人的地方比較能集中。"}
  - {jp: "このように、工夫をすれば、家でも気持ちよく働けます。", kana: "このように、くふうを すれば、いえでも きもちよく はたらけます。", zh: "像這樣下點工夫的話，在家也能愉快地工作。"}
  - {jp: "ところで、すべての仕事が家でできるわけではありません。", kana: "ところで、すべての しごとが いえで できる わけでは ありません。", zh: "話說回來，並不是所有工作都能在家做。"}
  - {jp: "店で働く人は、店へ行かなければなりません。", kana: "みせで はたらく ひとは、みせへ いかなければ なりません。", zh: "在店裡工作的人，必須去店裡。"}
  - {jp: "病院で働く人も、家ではできません。", kana: "びょういんで はたらく ひとも、いえでは できません。", zh: "在醫院工作的人，也無法在家做。"}
  - {jp: "工場で働く人も、同じです。", kana: "こうじょうで はたらく ひとも、おなじです。", zh: "在工廠工作的人，也是一樣。"}
  - {jp: "物を運ぶ仕事や、料理を作る仕事もそうです。", kana: "ものを はこぶ しごとや、りょうりを つくる しごとも そうです。", zh: "搬東西的工作、做菜的工作也是如此。"}
  - {jp: "外で働く人のおかげで、わたしたちの生活があります。", kana: "そとで はたらく ひとの おかげで、わたしたちの せいかつが あります。", zh: "多虧了在外面工作的人，我們才有生活。"}
  - {jp: "ですから、家で働ける人ばかりではないのです。", kana: "ですから、いえで はたらける ひとばかりでは ないのです。", zh: "所以，並不是每個人都能在家工作。"}
  - {jp: "それでも、働き方の種類が増えたことは、良いことです。", kana: "それでも、はたらきかたの しゅるいが ふえた ことは、よい ことです。", zh: "即使如此，工作方式的種類增加了，是件好事。"}
  - {jp: "昔は、働き方を選べませんでした。", kana: "むかしは、はたらきかたを えらべませんでした。", zh: "以前無法選擇工作方式。"}
  - {jp: "みんなが、同じように会社へ行きました。", kana: "みんなが、おなじように かいしゃへ いきました。", zh: "大家都一樣去公司。"}
  - {jp: "でも、今は違います。", kana: "でも、いまは ちがいます。", zh: "但是，現在不一樣了。"}
  - {jp: "家で働きたい人は、家で働けます。", kana: "いえで はたらきたい ひとは、いえで はたらけます。", zh: "想在家工作的人，可以在家工作。"}
  - {jp: "会社で働きたい人は、会社で働けます。", kana: "かいしゃで はたらきたい ひとは、かいしゃで はたらけます。", zh: "想在公司工作的人，可以在公司工作。"}
  - {jp: "両方を組み合わせる人もいます。", kana: "りょうほうを くみあわせる ひとも います。", zh: "也有人把兩者組合起來。"}
  - {jp: "週に何日かは家で、ほかの日は会社で働きます。", kana: "しゅうに なんにちかは いえで、ほかの ひは かいしゃで はたらきます。", zh: "一週有幾天在家，其他天在公司工作。"}
  - {jp: "自分に合った働き方を、選べる時代になりました。", kana: "じぶんに あった はたらきかたを、えらべる じだいに なりました。", zh: "變成了能選擇適合自己工作方式的時代。"}
  - {jp: "これは、とても大きな変化です。", kana: "これは、とても おおきな へんかです。", zh: "這是非常大的變化。"}
  - {jp: "人によって、合う働き方は違います。", kana: "ひとに よって、あう はたらきかたは ちがいます。", zh: "因人而異，適合的工作方式不同。"}
  - {jp: "一人が好きな人は、家で働くと集中できます。", kana: "ひとりが すきな ひとは、いえで はたらくと しゅうちゅうできます。", zh: "喜歡獨處的人，在家工作能集中。"}
  - {jp: "人と話すのが好きな人は、会社のほうが楽しいです。", kana: "ひとと はなすのが すきな ひとは、かいしゃの ほうが たのしいです。", zh: "喜歡和人說話的人，在公司比較開心。"}
  - {jp: "小さい子供がいる人は、家で働くと助かります。", kana: "ちいさい こどもが いる ひとは、いえで はたらくと たすかります。", zh: "有小孩的人，在家工作很有幫助。"}
  - {jp: "体が弱い人にも、家で働くことは良いです。", kana: "からだが よわい ひとにも、いえで はたらく ことは よいです。", zh: "對身體虛弱的人來說，在家工作也很好。"}
  - {jp: "遠くに住んでいる人も、会社で働けるようになりました。", kana: "とおくに すんで いる ひとも、かいしゃで はたらける ように なりました。", zh: "住在遠方的人，也能為公司工作了。"}
  - {jp: "体の不自由な人も、働きやすくなりました。", kana: "からだの ふじゆうな ひとも、はたらきやすく なりました。", zh: "身體不便的人，也變得容易工作了。"}
  - {jp: "つまり、より多くの人が働けるようになったのです。", kana: "つまり、より おおくの ひとが はたらける ように なったのです。", zh: "也就是說，變得有更多人能工作了。"}
  - {jp: "これは、社会にとって良いことだと思います。", kana: "これは、しゃかいに とって よい ことだと おもいます。", zh: "我覺得這對社會來說是好事。"}
  - {jp: "会社にとっても、良い点があります。", kana: "かいしゃに とっても、よい てんが あります。", zh: "對公司來說，也有好處。"}
  - {jp: "大きな事務所が、いらなくなることもあります。", kana: "おおきな じむしょが、いらなく なる ことも あります。", zh: "有時也變得不需要大辦公室。"}
  - {jp: "遠くに住む人も、社員として働けます。", kana: "とおくに すむ ひとも、しゃいんとして はたらけます。", zh: "住在遠方的人，也能當員工工作。"}
  - {jp: "いろいろな場所の人が、一緒に仕事をできます。", kana: "いろいろな ばしょの ひとが、いっしょに しごとを できます。", zh: "各地的人，可以一起工作。"}
  - {jp: "でも、会社にも難しい点はあります。", kana: "でも、かいしゃにも むずかしい てんは あります。", zh: "但是，公司也有困難的地方。"}
  - {jp: "社員が、家で何をしているか見えません。", kana: "しゃいんが、いえで なにを して いるか みえません。", zh: "看不到員工在家做什麼。"}
  - {jp: "だから、社員を信じることが大切になります。", kana: "だから、しゃいんを しんじる ことが たいせつに なります。", zh: "所以，相信員工變得很重要。"}
  - {jp: "新しい人に、仕事を教えるのも難しいです。", kana: "あたらしい ひとに、しごとを おしえるのも むずかしいです。", zh: "教新人工作也很困難。"}
  - {jp: "そばにいないと、教えにくいからです。", kana: "そばに いないと、おしえにくいからです。", zh: "因為不在身邊就難以教導。"}
  - {jp: "ですから、会社もいろいろな工夫をしています。", kana: "ですから、かいしゃも いろいろな くふうを して います。", zh: "所以，公司也在下各種工夫。"}
  - {jp: "ときどき、みんなで集まる日を作ります。", kana: "ときどき、みんなで あつまる ひを つくります。", zh: "偶爾安排大家聚在一起的日子。"}
  - {jp: "画面を見ながら、会議をすることもあります。", kana: "がめんを みながら、かいぎを する ことも あります。", zh: "也會看著螢幕開會。"}
  - {jp: "新しい道具も、たくさん生まれました。", kana: "あたらしい どうぐも、たくさん うまれました。", zh: "也誕生了很多新工具。"}
  - {jp: "遠くにいても、すぐに話せる道具があります。", kana: "とおくに いても、すぐに はなせる どうぐが あります。", zh: "有即使在遠方也能馬上對話的工具。"}
  - {jp: "顔を見ながら、話すこともできます。", kana: "かおを みながら、はなす ことも できます。", zh: "也能看著臉說話。"}
  - {jp: "こういう道具のおかげで、リモートワークが広がりました。", kana: "こういう どうぐの おかげで、リモートワークが ひろがりました。", zh: "多虧這些工具，遠距工作普及了。"}
  - {jp: "さて、わたしはこの変化を、良いことだと思います。", kana: "さて、わたしは この へんかを、よい ことだと おもいます。", zh: "那麼，我認為這個變化是好事。"}
  - {jp: "働き方を選べることは、とても幸せなことです。", kana: "はたらきかたを えらべる ことは、とても しあわせな ことです。", zh: "能選擇工作方式，是非常幸福的事。"}
  - {jp: "人は、みんな同じではありません。", kana: "ひとは、みんな おなじでは ありません。", zh: "人並不是大家都一樣。"}
  - {jp: "だから、働き方も一つでなくていいのです。", kana: "だから、はたらきかたも ひとつでなくて いいのです。", zh: "所以工作方式也不必只有一種。"}
  - {jp: "大切なのは、自分に合った方法を見つけることです。", kana: "たいせつなのは、じぶんに あった ほうほうを みつける ことです。", zh: "重要的是，找到適合自己的方法。"}
  - {jp: "そして、仕事と生活のバランスをとることです。", kana: "そして、しごとと せいかつの バランスを とる ことです。", zh: "還有，取得工作和生活的平衡。"}
  - {jp: "仕事も大切ですが、休むことも大切です。", kana: "しごとも たいせつですが、やすむ ことも たいせつです。", zh: "工作很重要，但休息也很重要。"}
  - {jp: "家族と過ごす時間も、大切にしたいです。", kana: "かぞくと すごす じかんも、たいせつに したいです。", zh: "也想珍惜和家人共度的時間。"}
  - {jp: "自分の好きなことをする時間も、必要です。", kana: "じぶんの すきな ことを する じかんも、ひつようです。", zh: "做自己喜歡的事的時間，也是必要的。"}
  - {jp: "体の健康も、心の健康も、両方大事です。", kana: "からだの けんこうも、こころの けんこうも、りょうほう だいじです。", zh: "身體的健康和心理的健康，兩者都重要。"}
  - {jp: "働きすぎて、体をこわしてはいけません。", kana: "はたらきすぎて、からだを こわしては いけません。", zh: "不可以工作過度而搞壞身體。"}
  - {jp: "良い仕事をするためにも、よく休むことが必要です。", kana: "よい しごとを する ためにも、よく やすむ ことが ひつようです。", zh: "為了做好工作，好好休息也是必要的。"}
  - {jp: "これからも、働き方はもっと変わっていくでしょう。", kana: "これからも、はたらきかたは もっと かわって いくでしょう。", zh: "今後，工作方式還會繼續改變吧。"}
  - {jp: "新しい道具が、また生まれるかもしれません。", kana: "あたらしい どうぐが、また うまれるかもしれません。", zh: "也許又會誕生新的工具。"}
  - {jp: "新しい働き方も、出てくるかもしれません。", kana: "あたらしい はたらきかたも、でてくるかもしれません。", zh: "也許還會出現新的工作方式。"}
  - {jp: "どんな時代になっても、大切なことは同じです。", kana: "どんな じだいに なっても、たいせつな ことは おなじです。", zh: "不論變成什麼時代，重要的事都一樣。"}
  - {jp: "それは、元気に、楽しく働くことです。", kana: "それは、げんきに、たのしく はたらく ことです。", zh: "那就是健康地、快樂地工作。"}
  - {jp: "そして、自分の生活も大切にすることです。", kana: "そして、じぶんの せいかつも たいせつに する ことです。", zh: "還有，也珍惜自己的生活。"}
  - {jp: "みなさんは、どんな働き方が好きですか。", kana: "みなさんは、どんな はたらきかたが すきですか。", zh: "各位喜歡什麼樣的工作方式呢？"}
  - {jp: "家で働きたいですか、会社で働きたいですか。", kana: "いえで はたらきたいですか、かいしゃで はたらきたいですか。", zh: "想在家工作，還是想在公司工作呢？"}
  - {jp: "ぜひ、自分に合った働き方を考えてみてください。", kana: "ぜひ、じぶんに あった はたらきかたを かんがえて みてください。", zh: "請務必想想看適合自己的工作方式。"}
  - {jp: "そして、毎日を元気に過ごしてください。", kana: "そして、まいにちを げんきに すごしてください。", zh: "然後，請每天精神飽滿地度過。"}
  - {jp: "これで、変わる働き方についてのお話を終わります。", kana: "これで、かわる はたらきかたに ついての おはなしを おわります。", zh: "關於改變中的工作方式的話題，到這裡結束。"}
  - {jp: "最後まで聞いてくれて、ありがとうございました。", kana: "さいごまで きいて くれて、ありがとうございました。", zh: "謝謝你聽到最後。"}
