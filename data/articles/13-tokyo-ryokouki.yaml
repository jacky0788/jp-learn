title: 東京旅行記（長文・東京旅行日記）
level: N4（長文）
order: 200
intro: |
  三泊四日的東京旅行日記。較長的文章（約5分鐘），用過去式、て形、たり、ようになりたい 等。
body:
  - {jp: "先月、わたしは初めて東京へ旅行に行きました。", kana: "せんげつ、わたしは はじめて とうきょうへ りょこうに いきました。", zh: "上個月，我第一次去東京旅行。"}
  - {jp: "三泊四日の、短い旅行でした。", kana: "さんぱく よっかの、みじかい りょこうでした。", zh: "是三天四夜的短旅行。"}
  - {jp: "でも、毎日がとても楽しくて、今でもよく覚えています。", kana: "でも、まいにちが とても たのしくて、いまでも よく おぼえて います。", zh: "但每天都很開心，現在還記得很清楚。"}
  - {jp: "今日は、その旅行の思い出を話したいと思います。", kana: "きょうは、その りょこうの おもいでを はなしたいと おもいます。", zh: "今天想聊聊那趟旅行的回憶。"}
  - {jp: "一日目の朝、わたしは飛行機で台湾を出発しました。", kana: "いちにちめの あさ、わたしは ひこうきで たいわんを しゅっぱつしました。", zh: "第一天早上，我搭飛機從台灣出發。"}
  - {jp: "三時間ぐらいで、東京の空港に着きました。", kana: "さんじかんぐらいで、とうきょうの くうこうに つきました。", zh: "大約三小時就到了東京的機場。"}
  - {jp: "空港から、電車でホテルまで行きました。", kana: "くうこうから、でんしゃで ほてるまで いきました。", zh: "從機場搭電車到飯店。"}
  - {jp: "東京の電車は複雑で、少し迷いました。", kana: "とうきょうの でんしゃは ふくざつで、すこし まよいました。", zh: "東京的電車很複雜，我有點迷路。"}
  - {jp: "でも、駅の人が親切に教えてくれました。", kana: "でも、えきの ひとが しんせつに おしえて くれました。", zh: "但車站的人很親切地告訴我。"}
  - {jp: "ホテルに荷物を置いてから、すぐに町へ出かけました。", kana: "ほてるに にもつを おいてから、すぐに まちへ でかけました。", zh: "把行李放飯店後，馬上出門逛街。"}
  - {jp: "最初に行ったのは、浅草というところです。", kana: "さいしょに いったのは、あさくさと いう ところです。", zh: "最先去的是一個叫淺草的地方。"}
  - {jp: "浅草には古いお寺があって、観光客がたくさんいました。", kana: "あさくさには ふるい おてらが あって、かんこうきゃくが たくさん いました。", zh: "淺草有古老的寺廟，有很多觀光客。"}
  - {jp: "お寺の前の通りで、お土産を見ました。", kana: "おてらの まえの とおりで、おみやげを みました。", zh: "在寺廟前的街上看了伴手禮。"}
  - {jp: "わたしは、きれいな扇子を買いました。", kana: "わたしは、きれいな せんすを かいました。", zh: "我買了一把漂亮的扇子。"}
  - {jp: "お昼に、近くの店で天ぷらを食べました。", kana: "おひるに、ちかくの みせで てんぷらを たべました。", zh: "中午在附近的店吃了天婦羅。"}
  - {jp: "揚げたての天ぷらは、本当においしかったです。", kana: "あげたての てんぷらは、ほんとうに おいしかったです。", zh: "剛炸好的天婦羅真的很好吃。"}
  - {jp: "夜は、ホテルの近くのラーメン屋へ行きました。", kana: "よるは、ほてるの ちかくの らーめんやへ いきました。", zh: "晚上去了飯店附近的拉麵店。"}
  - {jp: "疲れていたので、その日は早く寝ました。", kana: "つかれて いたので、その ひは はやく ねました。", zh: "因為累了，那天很早就睡了。"}
  - {jp: "二日目は、朝早く起きました。", kana: "ふつかめは、あさ はやく おきました。", zh: "第二天很早起床。"}
  - {jp: "その日は、ディズニーランドへ行く予定でした。", kana: "その ひは、でぃずにーらんどへ いく よていでした。", zh: "那天預計去迪士尼樂園。"}
  - {jp: "朝ごはんを食べて、すぐに電車に乗りました。", kana: "あさごはんを たべて、すぐに でんしゃに のりました。", zh: "吃完早餐，馬上搭上電車。"}
  - {jp: "ディズニーランドは、人がとても多かったです。", kana: "でぃずにーらんどは、ひとが とても おおかったです。", zh: "迪士尼樂園人非常多。"}
  - {jp: "人気の乗り物は、二時間も待ちました。", kana: "にんきの のりものは、にじかんも まちました。", zh: "受歡迎的遊樂設施等了兩個小時。"}
  - {jp: "待つのは大変でしたが、とても楽しかったです。", kana: "まつのは たいへんでしたが、とても たのしかったです。", zh: "等待雖然辛苦，但非常好玩。"}
  - {jp: "午後は、パレードを見ました。", kana: "ごごは、ぱれーどを みました。", zh: "下午看了遊行。"}
  - {jp: "キャラクターたちが、とてもかわいかったです。", kana: "きゃらくたーたちが、とても かわいかったです。", zh: "卡通人物們非常可愛。"}
  - {jp: "夜には、きれいな花火が上がりました。", kana: "よるには、きれいな はなびが あがりました。", zh: "晚上施放了漂亮的煙火。"}
  - {jp: "空いっぱいの花火を見て、感動しました。", kana: "そら いっぱいの はなびを みて、かんどうしました。", zh: "看著滿天的煙火，很感動。"}
  - {jp: "三日目は、買い物をすることにしました。", kana: "みっかめは、かいものを する ことに しました。", zh: "第三天決定去購物。"}
  - {jp: "午前中、新宿という町へ行きました。", kana: "ごぜんちゅう、しんじゅくと いう まちへ いきました。", zh: "上午去了一個叫新宿的地方。"}
  - {jp: "新宿には、大きいデパートがたくさんあります。", kana: "しんじゅくには、おおきい でぱーとが たくさん あります。", zh: "新宿有很多大百貨公司。"}
  - {jp: "わたしは、家族へのお土産を探しました。", kana: "わたしは、かぞくへの おみやげを さがしました。", zh: "我找了要送家人的伴手禮。"}
  - {jp: "母には、日本のお茶を買いました。", kana: "ははには、にほんの おちゃを かいました。", zh: "幫媽媽買了日本的茶。"}
  - {jp: "父には、ネクタイを買いました。", kana: "ちちには、ねくたいを かいました。", zh: "幫爸爸買了領帶。"}
  - {jp: "妹には、かわいいぬいぐるみを買いました。", kana: "いもうとには、かわいい ぬいぐるみを かいました。", zh: "幫妹妹買了可愛的玩偶。"}
  - {jp: "昼ごはんは、デパートの上の階で食べました。", kana: "ひるごはんは、でぱーとの うえの かいで たべました。", zh: "午餐在百貨公司的高樓層吃。"}
  - {jp: "そこから、東京の町がよく見えました。", kana: "そこから、とうきょうの まちが よく みえました。", zh: "從那裡可以清楚看見東京的市街。"}
  - {jp: "午後は、有名な公園を散歩しました。", kana: "ごごは、ゆうめいな こうえんを さんぽしました。", zh: "下午在有名的公園散步。"}
  - {jp: "公園は静かで、とても気持ちがよかったです。", kana: "こうえんは しずかで、とても きもちが よかったです。", zh: "公園很安靜，非常舒服。"}
  - {jp: "池には、大きい鯉が泳いでいました。", kana: "いけには、おおきい こいが およいで いました。", zh: "池子裡有大鯉魚在游。"}
  - {jp: "夕方、カフェで抹茶のケーキを食べました。", kana: "ゆうがた、かふぇで まっちゃの けーきを たべました。", zh: "傍晚在咖啡廳吃了抹茶蛋糕。"}
  - {jp: "甘すぎなくて、ちょうどよかったです。", kana: "あますぎなくて、ちょうど よかったです。", zh: "不會太甜，剛剛好。"}
  - {jp: "夜は、友達がおすすめのお寿司屋へ行きました。", kana: "よるは、ともだちが おすすめの おすしやへ いきました。", zh: "晚上去了朋友推薦的壽司店。"}
  - {jp: "少し高かったですが、とても新鮮でおいしかったです。", kana: "すこし たかかったですが、とても しんせんで おいしかったです。", zh: "雖然有點貴，但非常新鮮好吃。"}
  - {jp: "四日目は、旅行の最後の日でした。", kana: "よっかめは、りょこうの さいごの ひでした。", zh: "第四天是旅行的最後一天。"}
  - {jp: "午前中に、ホテルをチェックアウトしました。", kana: "ごぜんちゅうに、ほてるを ちぇっくあうとしました。", zh: "上午辦理了退房。"}
  - {jp: "帰る前に、もう一度浅草へ行きました。", kana: "かえる まえに、もう いちど あさくさへ いきました。", zh: "回去前又去了一次淺草。"}
  - {jp: "最後に、おいしいおだんごを食べたかったからです。", kana: "さいごに、おいしい おだんごを たべたかったからです。", zh: "因為最後想吃好吃的糰子。"}
  - {jp: "それから、空港へ向かいました。", kana: "それから、くうこうへ むかいました。", zh: "然後前往機場。"}
  - {jp: "空港で、自分のためにお菓子をたくさん買いました。", kana: "くうこうで、じぶんの ために おかしを たくさん かいました。", zh: "在機場為自己買了很多零食。"}
  - {jp: "飛行機の中で、旅行のことを思い出しました。", kana: "ひこうきの なかで、りょこうの ことを おもいだしました。", zh: "在飛機上回想起這趟旅行。"}
  - {jp: "四日間は、あっという間でした。", kana: "よっかかんは、あっと いう までした。", zh: "四天一轉眼就過去了。"}
  - {jp: "今回の旅行で、日本語を使う機会がたくさんありました。", kana: "こんかいの りょこうで、にほんごを つかう きかいが たくさん ありました。", zh: "這次旅行有很多用日語的機會。"}
  - {jp: "店で注文したり、道を聞いたりしました。", kana: "みせで ちゅうもんしたり、みちを きいたり しました。", zh: "在店裡點餐、問路之類的。"}
  - {jp: "全部うまく話せたわけではありません。", kana: "ぜんぶ うまく はなせた わけでは ありません。", zh: "並不是全部都說得很順。"}
  - {jp: "でも、自分の日本語が通じて、とてもうれしかったです。", kana: "でも、じぶんの にほんごが つうじて、とても うれしかったです。", zh: "但我的日語能溝通，非常開心。"}
  - {jp: "「もっと勉強したい」と、強く思いました。", kana: "もっと べんきょうしたいと、つよく おもいました。", zh: "我強烈地想「要更努力學習」。"}
  - {jp: "次は、京都や大阪にも行ってみたいです。", kana: "つぎは、きょうとや おおさかにも いって みたいです。", zh: "下次也想去京都和大阪。"}
  - {jp: "そのときまでに、もっと上手に話せるようになりたいです。", kana: "その ときまでに、もっと じょうずに はなせる ように なりたいです。", zh: "希望到那時候能說得更好。"}
  - {jp: "東京旅行は、忘れられない思い出になりました。", kana: "とうきょう りょこうは、わすれられない おもいでに なりました。", zh: "東京旅行成了我難忘的回憶。"}
