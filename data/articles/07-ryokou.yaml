title: 京都への旅行（去京都旅行）
level: N4
order: 70
intro: |
  用たことがない・つもり・たい・と聞いた 等講旅行計劃與期待。
body:
  - {jp: "来年の春、京都へ旅行に行きたいです。", kana: "らいねんの はる、きょうとへ りょこうに いきたいです。", zh: "明年春天我想去京都旅行。"}
  - {jp: "京都は、日本でいちばん有名な観光地の一つです。", kana: "きょうとは、にほんで いちばん ゆうめいな かんこうちの ひとつです。", zh: "京都是日本最有名的觀光地之一。"}
  - {jp: "古いお寺や神社が、たくさんあります。", kana: "ふるい おてらや じんじゃが、たくさん あります。", zh: "有很多古老的寺廟和神社。"}
  - {jp: "わたしは、まだ京都へ行ったことがありません。", kana: "わたしは、まだ きょうとへ いった ことが ありません。", zh: "我還沒去過京都。"}
  - {jp: "だから、今からとても楽しみにしています。", kana: "だから、いまから とても たのしみに して います。", zh: "所以現在就很期待。"}
  - {jp: "京都までは、東京から新幹線で行くつもりです。", kana: "きょうとまでは、とうきょうから しんかんせんで いく つもりです。", zh: "我打算從東京搭新幹線去京都。"}
  - {jp: "新幹線は速くて、二時間半ぐらいで着きます。", kana: "しんかんせんは はやくて、にじかんはんぐらいで つきます。", zh: "新幹線很快，大約兩個半小時就到。"}
  - {jp: "春は、桜がとてもきれいだと聞きました。", kana: "はるは、さくらが とても きれいだと ききました。", zh: "聽說春天的櫻花非常漂亮。"}
  - {jp: "お寺の庭で、ゆっくり桜を見たいです。", kana: "おてらの にわで、ゆっくり さくらを みたいです。", zh: "我想在寺廟的庭園裡慢慢賞櫻。"}
  - {jp: "着物を着て、写真を撮るのもいいですね。", kana: "きものを きて、しゃしんを とるのも いいですね。", zh: "穿和服拍照也不錯呢。"}
  - {jp: "昼は、京都の有名な料理を食べてみたいです。", kana: "ひるは、きょうとの ゆうめいな りょうりを たべて みたいです。", zh: "中午想嘗嘗京都有名的料理。"}
  - {jp: "抹茶のスイーツも、ぜったいに食べるつもりです。", kana: "まっちゃの すいーつも、ぜったいに たべる つもりです。", zh: "抹茶甜點也一定要吃。"}
  - {jp: "夜は、静かな旅館に泊まりたいです。", kana: "よるは、しずかな りょかんに とまりたいです。", zh: "晚上想住安靜的旅館。"}
  - {jp: "旅館では、温泉に入って、ゆっくり休みます。", kana: "りょかんでは、おんせんに はいって、ゆっくり やすみます。", zh: "在旅館泡溫泉，好好休息。"}
  - {jp: "一人で行くか、友達と行くか、まだ決めていません。", kana: "ひとりで いくか、ともだちと いくか、まだ きめて いません。", zh: "要一個人去還是和朋友去，還沒決定。"}
  - {jp: "でも、日本語が話せるので、一人でも大丈夫だと思います。", kana: "でも、にほんごが はなせるので、ひとりでも だいじょうぶだと おもいます。", zh: "不過因為會說日語，我想一個人也沒問題。"}
  - {jp: "道が分からないときは、駅の人に聞きます。", kana: "みちが わからない ときは、えきの ひとに ききます。", zh: "不知道路的時候，就問車站的人。"}
  - {jp: "旅行の前に、行きたい場所を調べておきます。", kana: "りょこうの まえに、いきたい ばしょを しらべて おきます。", zh: "旅行前先查好想去的地方。"}
  - {jp: "計画を立てるのも、旅行の楽しみの一つです。", kana: "けいかくを たてるのも、りょこうの たのしみの ひとつです。", zh: "規劃行程也是旅行樂趣之一。"}
  - {jp: "早く春になってほしいです。", kana: "はやく はるに なって ほしいです。", zh: "真希望春天快點到。"}
