title: わたしの自己紹介（自我介紹）
level: N5
order: 10
intro: |
  用「は／です／の」與家人、興趣、未來的願望，做一段完整的自我介紹。
body:
  - {jp: "みなさん、こんにちは。", kana: "みなさん、こんにちは。", zh: "大家好。"}
  - {jp: "わたしの名前はリンです。", kana: "わたしの なまえは りんです。", zh: "我的名字是林。"}
  - {jp: "台湾から来ました。", kana: "たいわんから きました。", zh: "我來自台灣。"}
  - {jp: "今、日本語を勉強しています。", kana: "いま、にほんごを べんきょうして います。", zh: "我現在正在學日語。"}
  - {jp: "日本語の勉強を始めて、二年になりました。", kana: "にほんごの べんきょうを はじめて、にねんに なりました。", zh: "開始學日語已經兩年了。"}
  - {jp: "わたしの家族は四人です。", kana: "わたしの かぞくは よにんです。", zh: "我家有四個人。"}
  - {jp: "父と母と、姉とわたしです。", kana: "ちちと ははと、あねと わたしです。", zh: "爸爸、媽媽、姊姊和我。"}
  - {jp: "父は会社員で、母は学校の先生です。", kana: "ちちは かいしゃいんで、ははは がっこうの せんせいです。", zh: "爸爸是公司職員，媽媽是學校老師。"}
  - {jp: "姉は東京で働いています。", kana: "あねは とうきょうで はたらいて います。", zh: "姊姊在東京工作。"}
  - {jp: "わたしの趣味は、音楽を聞くことと、本を読むことです。", kana: "わたしの しゅみは、おんがくを きくことと、ほんを よむことです。", zh: "我的興趣是聽音樂和看書。"}
  - {jp: "週末は、よく友達と映画を見に行きます。", kana: "しゅうまつは、よく ともだちと えいがを みに いきます。", zh: "週末常和朋友去看電影。"}
  - {jp: "好きな食べ物は、ラーメンとお寿司です。", kana: "すきな たべものは、らーめんと おすしです。", zh: "喜歡的食物是拉麵和壽司。"}
  - {jp: "でも、辛い料理はあまり食べられません。", kana: "でも、からい りょうりは あまり たべられません。", zh: "不過，太辣的料理我不太能吃。"}
  - {jp: "将来は、日本の会社で働きたいです。", kana: "しょうらいは、にほんの かいしゃで はたらきたいです。", zh: "將來我想在日本的公司工作。"}
  - {jp: "そのために、毎日日本語を練習しています。", kana: "そのために、まいにち にほんごを れんしゅうして います。", zh: "為此，我每天都在練習日語。"}
  - {jp: "これからも、がんばって勉強しようと思います。", kana: "これからも、がんばって べんきょうしようと おもいます。", zh: "今後我也打算努力學習。"}
  - {jp: "どうぞ、よろしくお願いします。", kana: "どうぞ、よろしく おねがいします。", zh: "請多多指教。"}
