title: "宇宙への挑戦（挑戰宇宙・新聞長文）"
level: "N4（長文）"
order: 340
intro: |
  近年很受矚目的宇宙開發。火箭、人工衛星、月球與火星計畫，還有逐漸成真的太空旅行。
  本文用です・ます體與N4文法（〜ようになる、〜ことができる、〜たいと思う、〜かもしれない、〜なければなりません等），
  以一篇連貫的散文，談科技、夢想與從太空看地球的感動。約15分鐘的朗讀長文。
body:
  - {jp: "近年、宇宙の話をよく聞くようになりました。", kana: "きんねん、うちゅうの はなしを よく きく ように なりました。", zh: "近年來，我們越來越常聽到關於宇宙的話題。"}
  - {jp: "新聞でも、テレビでも、宇宙のニュースがふえています。", kana: "しんぶんでも、てれびでも、うちゅうの にゅーすが ふえています。", zh: "不論是報紙還是電視，宇宙的新聞都增加了。"}
  - {jp: "宇宙は、わたしたちの頭の上に広がっています。", kana: "うちゅうは、わたしたちの あたまの うえに ひろがって います。", zh: "宇宙就在我們的頭頂上方延展開來。"}
  - {jp: "夜になると、空にたくさんの星が見えます。", kana: "よるに なると、そらに たくさんの ほしが みえます。", zh: "一到夜晚，天空中可以看到許多星星。"}
  - {jp: "昔の人も、その星をながめていました。", kana: "むかしの ひとも、その ほしを ながめて いました。", zh: "古時候的人也曾凝望著那些星星。"}
  - {jp: "「あの星には、何があるのだろう」と考えました。", kana: "あの ほしには、なにが あるのだろうと かんがえました。", zh: "他們會想：「那顆星上有什麼呢？」"}
  - {jp: "そして、いつか行ってみたいと思いました。", kana: "そして、いつか いって みたいと おもいました。", zh: "於是，他們想著總有一天要去看看。"}
  - {jp: "その夢は、長い間、夢のままでした。", kana: "その ゆめは、ながい あいだ、ゆめの ままでした。", zh: "那個夢想，在很長一段時間裡都只是夢想。"}
  - {jp: "でも、人間は少しずつ、その夢に近づいてきました。", kana: "でも、にんげんは すこしずつ、その ゆめに ちかづいて きました。", zh: "但是，人類一點一點地，逐漸靠近了那個夢想。"}
  - {jp: "まず、人々はロケットを作りました。", kana: "まず、ひとびとは ろけっとを つくりました。", zh: "首先，人們造出了火箭。"}
  - {jp: "ロケットは、空のずっと上まで飛ぶことができます。", kana: "ろけっとは、そらの ずっと うえまで とぶ ことが できます。", zh: "火箭可以飛到天空非常高的地方。"}
  - {jp: "とても強い力で、上へ上へとのぼっていきます。", kana: "とても つよい ちからで、うえへ うえへと のぼって いきます。", zh: "它以非常強大的力量，不斷向上攀升。"}
  - {jp: "ロケットの中には、いろいろな機械が入っています。", kana: "ろけっとの なかには、いろいろな きかいが はいって います。", zh: "火箭裡裝著各式各樣的機器。"}
  - {jp: "そして、人や荷物を宇宙へ運びます。", kana: "そして、ひとや にもつを うちゅうへ はこびます。", zh: "然後，它把人或貨物運送到宇宙。"}
  - {jp: "ロケットを飛ばすのは、簡単なことではありません。", kana: "ろけっとを とばすのは、かんたんな ことでは ありません。", zh: "讓火箭飛起來並不是一件容易的事。"}
  - {jp: "たくさんの人が、長い時間をかけて準備します。", kana: "たくさんの ひとが、ながい じかんを かけて じゅんびします。", zh: "許多人花費很長的時間來準備。"}
  - {jp: "少しのミスでも、大きな問題になります。", kana: "すこしの みすでも、おおきな もんだいに なります。", zh: "即使是一點點失誤，也會變成大問題。"}
  - {jp: "だから、みんなで何度も確認します。", kana: "だから、みんなで なんども かくにんします。", zh: "所以，大家會一再地確認。"}
  - {jp: "ロケットが飛ぶ日は、多くの人が見守ります。", kana: "ろけっとが とぶ ひは、おおくの ひとが みまもります。", zh: "火箭起飛的那天，許多人都會守候觀看。"}
  - {jp: "うまく飛ぶと、みんな大きな声で喜びます。", kana: "うまく とぶと、みんな おおきな こえで よろこびます。", zh: "順利飛起時，大家都會大聲歡呼。"}
  - {jp: "ロケットのほかに、人工衛星もあります。", kana: "ろけっとの ほかに、じんこうえいせいも あります。", zh: "除了火箭之外，還有人工衛星。"}
  - {jp: "人工衛星は、地球のまわりを回っています。", kana: "じんこうえいせいは、ちきゅうの まわりを まわって います。", zh: "人工衛星繞著地球轉。"}
  - {jp: "とても高い所を、ぐるぐると回り続けます。", kana: "とても たかい ところを、ぐるぐると まわり つづけます。", zh: "它在非常高的地方，不停地一圈圈繞行。"}
  - {jp: "この人工衛星は、わたしたちの生活に役立っています。", kana: "この じんこうえいせいは、わたしたちの せいかつに やくだって います。", zh: "這些人工衛星對我們的生活很有幫助。"}
  - {jp: "たとえば、天気を調べることができます。", kana: "たとえば、てんきを しらべる ことが できます。", zh: "例如，可以用來查看天氣。"}
  - {jp: "あしたは雨か、晴れか、教えてくれます。", kana: "あしたは あめか、はれか、おしえて くれます。", zh: "它會告訴我們明天是下雨還是晴天。"}
  - {jp: "大きな台風が来るときも、すぐにわかります。", kana: "おおきな たいふうが くる ときも、すぐに わかります。", zh: "有大颱風要來時，也能立刻知道。"}
  - {jp: "そのおかげで、わたしたちは早く準備できます。", kana: "その おかげで、わたしたちは はやく じゅんびできます。", zh: "多虧如此，我們可以及早做準備。"}
  - {jp: "また、人工衛星は道を案内してくれます。", kana: "また、じんこうえいせいは みちを あんないして くれます。", zh: "此外，人工衛星還會替我們指引道路。"}
  - {jp: "知らない町でも、地図を見れば道がわかります。", kana: "しらない まちでも、ちずを みれば みちが わかります。", zh: "即使在陌生的城鎮，只要看地圖就知道路。"}
  - {jp: "その地図も、宇宙からの力で動いています。", kana: "その ちずも、うちゅうからの ちからで うごいて います。", zh: "那個地圖也是靠來自宇宙的力量在運作。"}
  - {jp: "遠くの人と話せるのも、人工衛星のおかげです。", kana: "とおくの ひとと はなせるのも、じんこうえいせいの おかげです。", zh: "能和遠方的人通話，也是多虧了人工衛星。"}
  - {jp: "このように、宇宙はもう遠い世界ではありません。", kana: "この ように、うちゅうは もう とおい せかいでは ありません。", zh: "就像這樣，宇宙已經不再是遙遠的世界了。"}
  - {jp: "わたしたちの毎日と、深くつながっています。", kana: "わたしたちの まいにちと、ふかく つながって います。", zh: "它和我們的每一天有著深刻的連結。"}
  - {jp: "さて、宇宙にはたくさんの星があります。", kana: "さて、うちゅうには たくさんの ほしが あります。", zh: "那麼，宇宙裡有許多星球。"}
  - {jp: "その中で、月はいちばん近い星です。", kana: "その なかで、つきは いちばん ちかい ほしです。", zh: "其中，月球是最近的星球。"}
  - {jp: "月は、夜の空で明るく光っています。", kana: "つきは、よるの そらで あかるく ひかって います。", zh: "月亮在夜空中明亮地發光。"}
  - {jp: "昔から、人は月に行きたいと思っていました。", kana: "むかしから、ひとは つきに いきたいと おもって いました。", zh: "從很久以前，人類就想去月球。"}
  - {jp: "そして、ずっと前に、人は月に立つことができました。", kana: "そして、ずっと まえに、ひとは つきに たつ ことが できました。", zh: "而且，在很久以前，人類就成功站上了月球。"}
  - {jp: "それは、人間にとって大きな一歩でした。", kana: "それは、にんげんに とって おおきな いっぽでした。", zh: "那對人類來說是巨大的一步。"}
  - {jp: "月の上には、空気がありません。", kana: "つきの うえには、くうきが ありません。", zh: "月球上沒有空氣。"}
  - {jp: "だから、特別な服を着なければなりません。", kana: "だから、とくべつな ふくを きなければ なりません。", zh: "所以，必須穿上特殊的衣服。"}
  - {jp: "月の上は、昼はとても暑く、夜はとても寒いです。", kana: "つきの うえは、ひるは とても あつく、よるは とても さむいです。", zh: "月球上白天非常熱，夜晚非常冷。"}
  - {jp: "人が住むのは、まだ難しいです。", kana: "ひとが すむのは、まだ むずかしいです。", zh: "人類要居住還很困難。"}
  - {jp: "でも、近年、また月をめざす計画があります。", kana: "でも、きんねん、また つきを めざす けいかくが あります。", zh: "但是近年來，又有以月球為目標的計畫。"}
  - {jp: "今度は、月に長く住む方法を考えています。", kana: "こんどは、つきに ながく すむ ほうほうを かんがえて います。", zh: "這一次，人們在思考如何長期住在月球上。"}
  - {jp: "月に小さな町を作りたいと考える人もいます。", kana: "つきに ちいさな まちを つくりたいと かんがえる ひとも います。", zh: "也有人想在月球上建造一座小城鎮。"}
  - {jp: "それができれば、すばらしいことです。", kana: "それが できれば、すばらしい ことです。", zh: "如果做得到，那會是很了不起的事。"}
  - {jp: "月だけではありません。", kana: "つきだけでは ありません。", zh: "不只是月球而已。"}
  - {jp: "近年、火星をめざす計画も話題になっています。", kana: "きんねん、かせいを めざす けいかくも わだいに なって います。", zh: "近年來，以火星為目標的計畫也成了話題。"}
  - {jp: "火星は、月よりもずっと遠い星です。", kana: "かせいは、つきよりも ずっと とおい ほしです。", zh: "火星是比月球遙遠得多的星球。"}
  - {jp: "赤い色をしているので、「赤い星」とも呼ばれます。", kana: "あかい いろを して いるので、あかい ほしとも よばれます。", zh: "因為它呈現紅色，也被稱為「紅色的星球」。"}
  - {jp: "火星まで行くには、長い時間がかかります。", kana: "かせいまで いくには、ながい じかんが かかります。", zh: "要前往火星，需要很長的時間。"}
  - {jp: "何か月もかかると言われています。", kana: "なんかげつも かかると いわれて います。", zh: "據說要花上好幾個月。"}
  - {jp: "その間、せまい船の中で生活しなければなりません。", kana: "その あいだ、せまい ふねの なかで せいかつしなければ なりません。", zh: "在那段期間，必須在狹窄的船內生活。"}
  - {jp: "食べ物も、水も、大切に使います。", kana: "たべものも、みずも、たいせつに つかいます。", zh: "食物和水都要珍惜地使用。"}
  - {jp: "とても大変な旅になるでしょう。", kana: "とても たいへんな たびに なるでしょう。", zh: "那會是一趟非常辛苦的旅程吧。"}
  - {jp: "それでも、火星に行きたいと思う人がいます。", kana: "それでも、かせいに いきたいと おもう ひとが います。", zh: "即便如此，還是有人想去火星。"}
  - {jp: "新しい世界を見たいという気持ちは強いのです。", kana: "あたらしい せかいを みたいという きもちは つよいのです。", zh: "想看看新世界的心情非常強烈。"}
  - {jp: "いつか、人が火星に立つ日が来るかもしれません。", kana: "いつか、ひとが かせいに たつ ひが くるかも しれません。", zh: "也許有一天，人類踏上火星的日子會到來。"}
  - {jp: "それを想像すると、わくわくします。", kana: "それを そうぞうすると、わくわくします。", zh: "一想到這個，就讓人興奮不已。"}
  - {jp: "ところで、宇宙へ行くのは、特別な人だけではなくなってきました。", kana: "ところで、うちゅうへ いくのは、とくべつな ひとだけでは なくなって きました。", zh: "話說回來，去宇宙已經不再只是特別的人才能做的事了。"}
  - {jp: "近年、宇宙旅行という言葉をよく聞きます。", kana: "きんねん、うちゅうりょこうという ことばを よく ききます。", zh: "近年來，常聽到「太空旅行」這個詞。"}
  - {jp: "ふつうの人も、宇宙へ行けるようになってきました。", kana: "ふつうの ひとも、うちゅうへ いける ように なって きました。", zh: "一般人也漸漸可以去宇宙了。"}
  - {jp: "まだ、お金はとても高いです。", kana: "まだ、おかねは とても たかいです。", zh: "目前費用還非常昂貴。"}
  - {jp: "だれでも行けるわけではありません。", kana: "だれでも いける わけでは ありません。", zh: "並不是任何人都能去。"}
  - {jp: "でも、少しずつ現実になってきました。", kana: "でも、すこしずつ げんじつに なって きました。", zh: "但它正一點一點地變成現實。"}
  - {jp: "短い時間、宇宙を旅する人も出てきました。", kana: "みじかい じかん、うちゅうを たびする ひとも でて きました。", zh: "也出現了短暫地在宇宙旅行的人。"}
  - {jp: "高い所まで上がって、地球をながめて帰ってきます。", kana: "たかい ところまで あがって、ちきゅうを ながめて かえって きます。", zh: "升到很高的地方，眺望地球後再返回。"}
  - {jp: "宇宙から地球を見ると、どう感じるのでしょうか。", kana: "うちゅうから ちきゅうを みると、どう かんじるのでしょうか。", zh: "從宇宙看地球，會有什麼樣的感受呢？"}
  - {jp: "宇宙に行った人たちは、よく同じことを言います。", kana: "うちゅうに いった ひとたちは、よく おなじ ことを いいます。", zh: "去過宇宙的人們，常常說同樣的話。"}
  - {jp: "地球は、とても美しいそうです。", kana: "ちきゅうは、とても うつくしいそうです。", zh: "據說地球非常美麗。"}
  - {jp: "青い海と、白い雲が見えるそうです。", kana: "あおい うみと、しろい くもが みえるそうです。", zh: "據說可以看到藍色的海和白色的雲。"}
  - {jp: "緑の大地も、はっきりと見えます。", kana: "みどりの だいちも、はっきりと みえます。", zh: "綠色的大地也清楚可見。"}
  - {jp: "宇宙の暗い中で、地球だけが明るく光っています。", kana: "うちゅうの くらい なかで、ちきゅうだけが あかるく ひかって います。", zh: "在黑暗的宇宙中，只有地球明亮地發著光。"}
  - {jp: "その景色を見て、涙を流す人もいるそうです。", kana: "その けしきを みて、なみだを ながす ひとも いるそうです。", zh: "據說也有人看到那景色而流下眼淚。"}
  - {jp: "宇宙から見ると、国の線は見えません。", kana: "うちゅうから みると、くにの せんは みえません。", zh: "從宇宙看，看不到國家的界線。"}
  - {jp: "地図にある線は、本当はそこにないのです。", kana: "ちずに ある せんは、ほんとうは そこに ないのです。", zh: "地圖上的線，其實並不存在於那裡。"}
  - {jp: "見えるのは、一つの丸い地球だけです。", kana: "みえるのは、ひとつの まるい ちきゅうだけです。", zh: "看得到的，只有一個圓圓的地球。"}
  - {jp: "わたしたちは、みんな同じ地球に住んでいます。", kana: "わたしたちは、みんな おなじ ちきゅうに すんで います。", zh: "我們大家都住在同一個地球上。"}
  - {jp: "そのことに、あらためて気づくそうです。", kana: "そのことに、あらためて きづくそうです。", zh: "據說人們會重新意識到這件事。"}
  - {jp: "そして、地球を大切にしたいと思うようになります。", kana: "そして、ちきゅうを たいせつに したいと おもう ように なります。", zh: "然後，會開始想要珍惜地球。"}
  - {jp: "宇宙から見た地球は、思ったより小さいそうです。", kana: "うちゅうから みた ちきゅうは、おもったより ちいさいそうです。", zh: "據說從宇宙看到的地球，比想像中還要小。"}
  - {jp: "その小さな星の上に、たくさんの命があります。", kana: "その ちいさな ほしの うえに、たくさんの いのちが あります。", zh: "在那顆小小的星球上，有著許許多多的生命。"}
  - {jp: "人も、動物も、植物も、みんなそこにいます。", kana: "ひとも、どうぶつも、しょくぶつも、みんな そこに います。", zh: "人、動物、植物，全都在那裡。"}
  - {jp: "だから、地球を守ることはとても大切です。", kana: "だから、ちきゅうを まもる ことは とても たいせつです。", zh: "所以，守護地球是非常重要的。"}
  - {jp: "宇宙のことを知ると、地球のことも考えるようになります。", kana: "うちゅうの ことを しると、ちきゅうの ことも かんがえる ように なります。", zh: "了解宇宙之後，也會開始思考地球的事。"}
  - {jp: "これは、おもしろいことだと思います。", kana: "これは、おもしろい ことだと おもいます。", zh: "我覺得這是很有意思的事。"}
  - {jp: "ところで、宇宙の研究には、よい点がたくさんあります。", kana: "ところで、うちゅうの けんきゅうには、よい てんが たくさん あります。", zh: "話說回來，宇宙研究有許多好處。"}
  - {jp: "宇宙のために作った技術は、生活にも使えます。", kana: "うちゅうの ために つくった ぎじゅつは、せいかつにも つかえます。", zh: "為了宇宙而開發的技術，也能用在生活上。"}
  - {jp: "たとえば、便利な道具がたくさん生まれました。", kana: "たとえば、べんりな どうぐが たくさん うまれました。", zh: "例如，誕生了許多方便的工具。"}
  - {jp: "わたしたちが{{毎日|まいにち}}{{使|つか}}う{{物|もの}}の{{中|なか}}にも、それがあります。", kana: "わたしたちが まいにち つかう ものの なかにも、それが あります。", zh: "在我們每天使用的東西當中，也有這樣的東西。"}
  - {jp: "宇宙の研究は、医学にも役立っています。", kana: "うちゅうの けんきゅうは、いがくにも やくだって います。", zh: "宇宙研究對醫學也有幫助。"}
  - {jp: "また、宇宙を調べると、新しいことがわかります。", kana: "また、うちゅうを しらべると、あたらしい ことが わかります。", zh: "此外，研究宇宙能讓我們明白新的事物。"}
  - {jp: "世界はどうやってできたのか、考えることができます。", kana: "せかいは どうやって できたのか、かんがえる ことが できます。", zh: "我們可以思考這個世界是如何形成的。"}
  - {jp: "ほかの星に、生き物がいるかもしれません。", kana: "ほかの ほしに、いきものが いるかも しれません。", zh: "其他星球上，也許有生物。"}
  - {jp: "それを知りたいと思う人は、世界中にいます。", kana: "それを しりたいと おもう ひとは、せかいじゅうに います。", zh: "想知道這件事的人，遍布全世界。"}
  - {jp: "わからないことを調べるのは、楽しいことです。", kana: "わからない ことを しらべるのは、たのしい ことです。", zh: "去探究不明白的事，是件快樂的事。"}
  - {jp: "でも、宇宙の開発には、問題もあります。", kana: "でも、うちゅうの かいはつには、もんだいも あります。", zh: "但是，宇宙開發也有問題。"}
  - {jp: "まず、たくさんのお金がかかります。", kana: "まず、たくさんの おかねが かかります。", zh: "首先，會花費很多錢。"}
  - {jp: "ロケットを一つ飛ばすのも、安くはありません。", kana: "ろけっとを ひとつ とばすのも、やすくは ありません。", zh: "光是讓一枚火箭飛起來，也不便宜。"}
  - {jp: "そのお金を、ほかのことに使うべきだと言う人もいます。", kana: "その おかねを、ほかの ことに つかうべきだと いう ひとも います。", zh: "也有人說，那筆錢應該用在別的事情上。"}
  - {jp: "地球には、まだ困っている人がたくさんいます。", kana: "ちきゅうには、まだ こまって いる ひとが たくさん います。", zh: "在地球上，還有許多陷入困境的人。"}
  - {jp: "その人たちを助けることも、大切です。", kana: "その ひとたちを たすける ことも、たいせつです。", zh: "幫助那些人也很重要。"}
  - {jp: "また、宇宙にごみがふえているという問題もあります。", kana: "また、うちゅうに ごみが ふえて いるという もんだいも あります。", zh: "此外，還有宇宙垃圾增加的問題。"}
  - {jp: "古くなった機械が、宇宙に残っています。", kana: "ふるく なった きかいが、うちゅうに のこって います。", zh: "變舊的機器，留在了宇宙中。"}
  - {jp: "それが、新しいロケットにぶつかると危ないです。", kana: "それが、あたらしい ろけっとに ぶつかると あぶないです。", zh: "那些東西如果撞到新的火箭就很危險。"}
  - {jp: "宇宙もきれいにしなければなりません。", kana: "うちゅうも きれいに しなければ なりません。", zh: "宇宙也必須保持乾淨。"}
  - {jp: "このように、よい{{点|てん}}も{{問題点|もんだいてん}}もあります。", kana: "この ように、よい てんも もんだいてんも あります。", zh: "就像這樣，既有好處也有問題。"}
  - {jp: "だから、みんなでよく考えることが必要です。", kana: "だから、みんなで よく かんがえる ことが ひつようです。", zh: "所以，大家必須好好地一起思考。"}
  - {jp: "急がずに、ゆっくり進めることも大切でしょう。", kana: "いそがずに、ゆっくり すすめる ことも たいせつでしょう。", zh: "不要操之過急，慢慢推進也很重要吧。"}
  - {jp: "ここで、わたし自身のことを少し話します。", kana: "ここで、わたし じしんの ことを すこし はなします。", zh: "在這裡，我來談一點我自己的事。"}
  - {jp: "わたしは、子供のころ、星が大好きでした。", kana: "わたしは、こどもの ころ、ほしが だいすきでした。", zh: "我小時候非常喜歡星星。"}
  - {jp: "夜、よく空を見上げていました。", kana: "よる、よく そらを みあげて いました。", zh: "夜晚，我常常仰望天空。"}
  - {jp: "「あの星まで行ってみたい」と思っていました。", kana: "あの ほしまで いって みたいと おもって いました。", zh: "我曾想著：「真想去那顆星星看看。」"}
  - {jp: "絵本で宇宙の話を読むのも好きでした。", kana: "えほんで うちゅうの はなしを よむのも すきでした。", zh: "我也喜歡讀繪本裡的宇宙故事。"}
  - {jp: "宇宙の写真を見ると、胸がどきどきしました。", kana: "うちゅうの しゃしんを みると、むねが どきどきしました。", zh: "看到宇宙的照片時，我的心會怦怦地跳。"}
  - {jp: "大きくなったら、宇宙に行きたいと思っていました。", kana: "おおきく なったら、うちゅうに いきたいと おもって いました。", zh: "我曾想著長大後要去宇宙。"}
  - {jp: "今は、宇宙に行くのは難しいかもしれません。", kana: "いまは、うちゅうに いくのは むずかしいかも しれません。", zh: "現在，要去宇宙也許很困難。"}
  - {jp: "でも、その夢を忘れたくありません。", kana: "でも、その ゆめを わすれたく ありません。", zh: "但是，我不想忘記那個夢想。"}
  - {jp: "夢を持つことは、とても大切だと思います。", kana: "ゆめを もつ ことは、とても たいせつだと おもいます。", zh: "我認為擁有夢想是非常重要的。"}
  - {jp: "夢があると、毎日が楽しくなります。", kana: "ゆめが あると、まいにちが たのしく なります。", zh: "有了夢想，每天都會變得快樂。"}
  - {jp: "夢があると、がんばる力が出てきます。", kana: "ゆめが あると、がんばる ちからが でて きます。", zh: "有了夢想，就會湧出努力的力量。"}
  - {jp: "むかし、月へ行くことも夢でした。", kana: "むかし、つきへ いく ことも ゆめでした。", zh: "從前，去月球也曾是個夢想。"}
  - {jp: "でも、その夢は本当になりました。", kana: "でも、その ゆめは ほんとうに なりました。", zh: "但是，那個夢想成真了。"}
  - {jp: "だから、火星へ行く夢も、いつかかなうかもしれません。", kana: "だから、かせいへ いく ゆめも、いつか かなうかも しれません。", zh: "所以，去火星的夢想，也許有一天也會實現。"}
  - {jp: "今は無理だと思うことも、未来にはできるかもしれません。", kana: "いまは むりだと おもう ことも、みらいには できるかも しれません。", zh: "現在覺得辦不到的事，在未來也許就能做到。"}
  - {jp: "新しい技術が、それを助けてくれるでしょう。", kana: "あたらしい ぎじゅつが、それを たすけて くれるでしょう。", zh: "新的技術會幫助實現它吧。"}
  - {jp: "そして、若い人たちが、その夢を続けていきます。", kana: "そして、わかい ひとたちが、その ゆめを つづけて いきます。", zh: "然後，年輕人會接續著那個夢想。"}
  - {jp: "子供たちの中に、未来の宇宙飛行士がいるかもしれません。", kana: "こどもたちの なかに、みらいの うちゅう ひこうしが いるかも しれません。", zh: "孩子們之中，也許就有未來的太空人。"}
  - {jp: "今、星を見ている子供が、いつか宇宙へ行くのです。", kana: "いま、ほしを みて いる こどもが、いつか うちゅうへ いくのです。", zh: "現在正望著星星的孩子，總有一天會去宇宙。"}
  - {jp: "そう考えると、わくわくしますね。", kana: "そう かんがえると、わくわくしますね。", zh: "這樣一想，就讓人興奮呢。"}
  - {jp: "宇宙への挑戦は、これからも続きます。", kana: "うちゅうへの ちょうせんは、これからも つづきます。", zh: "對宇宙的挑戰，今後也會持續下去。"}
  - {jp: "一歩ずつ、ゆっくりと進んでいくでしょう。", kana: "いっぽずつ、ゆっくりと すすんで いくでしょう。", zh: "會一步一步地，慢慢前進吧。"}
  - {jp: "ときには、うまくいかないこともあります。", kana: "ときには、うまく いかない ことも あります。", zh: "有時候，也會有不順利的時候。"}
  - {jp: "失敗しても、また挑戦すればいいのです。", kana: "しっぱいしても、また ちょうせんすれば いいのです。", zh: "即使失敗，再挑戰一次就好了。"}
  - {jp: "失敗から学ぶことは、たくさんあります。", kana: "しっぱいから まなぶ ことは、たくさん あります。", zh: "從失敗中能學到的東西很多。"}
  - {jp: "あきらめない心が、いちばん大切です。", kana: "あきらめない こころが、いちばん たいせつです。", zh: "不放棄的心，是最重要的。"}
  - {jp: "これは、宇宙の話だけではありません。", kana: "これは、うちゅうの はなしだけでは ありません。", zh: "這不只是宇宙的事而已。"}
  - {jp: "わたしたちの毎日の生活でも、同じです。", kana: "わたしたちの まいにちの せいかつでも、おなじです。", zh: "在我們日常的生活中，也是一樣的。"}
  - {jp: "勉強でも、仕事でも、夢を持つことは大切です。", kana: "べんきょうでも、しごとでも、ゆめを もつ ことは たいせつです。", zh: "不論是讀書還是工作，擁有夢想都很重要。"}
  - {jp: "小さな夢でも、いいのです。", kana: "ちいさな ゆめでも、いいのです。", zh: "就算是小小的夢想，也沒關係。"}
  - {jp: "その夢に向かって、少しずつ進めばいいのです。", kana: "その ゆめに むかって、すこしずつ すすめば いいのです。", zh: "朝著那個夢想，一點一點前進就好。"}
  - {jp: "わたしも、自分の夢を大切にしたいです。", kana: "わたしも、じぶんの ゆめを たいせつに したいです。", zh: "我也想珍惜自己的夢想。"}
  - {jp: "日本語の勉強も、わたしの夢の一つです。", kana: "にほんごの べんきょうも、わたしの ゆめの ひとつです。", zh: "學日語也是我的夢想之一。"}
  - {jp: "毎日少しずつ、続けていきたいと思います。", kana: "まいにち すこしずつ、つづけて いきたいと おもいます。", zh: "我想每天一點一點地持續下去。"}
  - {jp: "夜、空を見上げてみてください。", kana: "よる、そらを みあげて みて ください。", zh: "夜晚，請試著仰望天空。"}
  - {jp: "そこには、たくさんの星が光っています。", kana: "そこには、たくさんの ほしが ひかって います。", zh: "那裡，有許多星星閃耀著。"}
  - {jp: "その星の一つ一つが、わたしたちに夢を見せてくれます。", kana: "その ほしの ひとつ ひとつが、わたしたちに ゆめを みせて くれます。", zh: "那些星星的每一顆，都讓我們看見夢想。"}
  - {jp: "昔の人も、今のわたしたちも、同じ星を見ています。", kana: "むかしの ひとも、いまの わたしたちも、おなじ ほしを みて います。", zh: "古時候的人，和現在的我們，都看著同樣的星星。"}
  - {jp: "そして、未来の人も、その星を見るでしょう。", kana: "そして、みらいの ひとも、その ほしを みるでしょう。", zh: "而且，未來的人也會看著那些星星吧。"}
  - {jp: "宇宙は、わたしたちにいつも夢を与えてくれます。", kana: "うちゅうは、わたしたちに いつも ゆめを あたえて くれます。", zh: "宇宙總是賦予我們夢想。"}
  - {jp: "その夢を大切に、これからも生きていきたいです。", kana: "その ゆめを たいせつに、これからも いきて いきたいです。", zh: "我想珍惜那份夢想，今後也繼續活下去。"}
  - {jp: "いつか、人がもっと遠くの星まで行ける日が来るでしょう。", kana: "いつか、ひとが もっと とおくの ほしまで いける ひが くるでしょう。", zh: "總有一天，人類能前往更遙遠星球的日子會到來吧。"}
  - {jp: "その日を、わたしは楽しみに待っています。", kana: "その ひを、わたしは たのしみに まって います。", zh: "那一天，我滿心期待地等待著。"}
  - {jp: "みなさんも、自分の夢を、どうか大切にしてください。", kana: "みなさんも、じぶんの ゆめを、どうか たいせつに して ください。", zh: "也請各位，務必珍惜自己的夢想。"}
  - {jp: "夢を持つ人の前には、いつも新しい道が開けます。", kana: "ゆめを もつ ひとの まえには、いつも あたらしい みちが ひらけます。", zh: "在擁有夢想的人面前，總會展開新的道路。"}
