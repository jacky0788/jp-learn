title: 買い物（購物）
level: N4
order: 80
intro: |
  用比較、割引、すぎる、ほうがいい、〜ように 等講購物習慣。
body:
  - {jp: "わたしは、買い物が好きです。", kana: "わたしは、かいものが すきです。", zh: "我喜歡購物。"}
  - {jp: "特に、週末にスーパーへ行くのが好きです。", kana: "とくに、しゅうまつに すーぱーへ いくのが すきです。", zh: "尤其喜歡週末去超市。"}
  - {jp: "スーパーでは、野菜や肉や魚を買います。", kana: "すーぱーでは、やさいや にくや さかなを かいます。", zh: "在超市買蔬菜、肉和魚。"}
  - {jp: "夕方になると、安くなる商品が多いです。", kana: "ゆうがたに なると、やすく なる しょうひんが おおいです。", zh: "一到傍晚，變便宜的商品就很多。"}
  - {jp: "今日は、お肉が二割引でした。", kana: "きょうは、おにくが にわりびきでした。", zh: "今天肉打了八折（便宜兩成）。"}
  - {jp: "二割引は、台湾の「八割引き」と同じです。", kana: "にわりびきは、たいわんの はちわりびきと おなじです。", zh: "（日語）兩成折扣＝台灣說的「打8折」。"}
  - {jp: "安いときに買うと、お金が節約できます。", kana: "やすい ときに かうと、おかねが せつやく できます。", zh: "便宜的時候買，可以省錢。"}
  - {jp: "服を買うときは、デパートへ行きます。", kana: "ふくを かう ときは、でぱーとへ いきます。", zh: "買衣服的時候會去百貨公司。"}
  - {jp: "デパートのほうが、種類が多いです。", kana: "でぱーとのほうが、しゅるいが おおいです。", zh: "百貨公司的種類比較多。"}
  - {jp: "でも、デパートの服は、少し高すぎます。", kana: "でも、でぱーとの ふくは、すこし たかすぎます。", zh: "不過百貨公司的衣服有點太貴。"}
  - {jp: "だから、たいていはセールのときに買います。", kana: "だから、たいてい は せーるの ときに かいます。", zh: "所以大多在特賣時買。"}
  - {jp: "最近は、インターネットでも買い物をします。", kana: "さいきんは、いんたーねっとでも かいものを します。", zh: "最近也會在網路上購物。"}
  - {jp: "ネットショッピングは、家まで届けてくれるので、便利です。", kana: "ねっとしょっぴんぐは、いえまで とどけて くれるので、べんりです。", zh: "網購會送到家，很方便。"}
  - {jp: "でも、服は、実際に着てみたほうがいいです。", kana: "でも、ふくは、じっさいに きて みたほうが いいです。", zh: "不過衣服還是實際試穿比較好。"}
  - {jp: "サイズが合わないと、困りますから。", kana: "さいずが あわないと、こまりますから。", zh: "因為尺寸不合會很困擾。"}
  - {jp: "買い物のとき、わたしはいつもリストを作ります。", kana: "かいものの とき、わたしは いつも りすとを つくります。", zh: "購物時我總是會列清單。"}
  - {jp: "リストがあると、無駄なものを買いません。", kana: "りすとが あると、むだな ものを かいません。", zh: "有清單就不會買多餘的東西。"}
  - {jp: "安いからといって、買いすぎないように気をつけています。", kana: "やすいからと いって、かいすぎない ように きを つけて います。", zh: "我會注意不要因為便宜就買太多。"}
  - {jp: "上手に買い物をして、お金を大切に使いたいです。", kana: "じょうずに かいものを して、おかねを たいせつに つかいたいです。", zh: "想聰明購物，好好珍惜地用錢。"}
