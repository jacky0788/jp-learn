title: "気候変動と私たちにできること（氣候變遷與我們能做的事・新聞長文）"
level: "N4（長文）"
order: 320
intro: |
  這篇長文介紹近年的氣候變遷問題，以及我們每個人可以做的小事。
  使用 N4 為主的單字與文法（です・ます體、できる、なければなりません、ましょう等）。
  適合朗讀練習，內容從異常氣象、地球暖化、對生活的影響，到節電、減少垃圾、回收、搭乘大眾交通等行動。
body:
  - {jp: "今日は、気候変動の話をします。", kana: "きょうは、きこうへんどうの はなしを します。", zh: "今天我要談氣候變遷的話題。"}
  - {jp: "最近、天気がおかしいと思いませんか。", kana: "さいきん、てんきが おかしいと おもいませんか。", zh: "最近，你不覺得天氣很奇怪嗎？"}
  - {jp: "近年、世界中で異常な天気が増えています。", kana: "きんねん、せかいじゅうで いじょうな てんきが ふえています。", zh: "近年來，全世界異常的天氣越來越多。"}
  - {jp: "夏はとても暑くなりました。", kana: "なつは とても あつく なりました。", zh: "夏天變得非常熱。"}
  - {jp: "昔より、ずっと暑いです。", kana: "むかしより、ずっと あついです。", zh: "比起以前，熱得多了。"}
  - {jp: "ある国では、毎日四十度近くになります。", kana: "ある くにでは、まいにち よんじゅうど ちかくに なります。", zh: "在某些國家，每天接近四十度。"}
  - {jp: "外に出ると、すぐに汗が出ます。", kana: "そとに でると、すぐに あせが でます。", zh: "一到外面，馬上就流汗。"}
  - {jp: "とても暑い日は、外を歩くのが危ないです。", kana: "とても あつい ひは、そとを あるくのが あぶないです。", zh: "非常熱的日子，在外面走路很危險。"}
  - {jp: "暑さで、体の調子が悪くなる人もいます。", kana: "あつさで、からだの ちょうしが わるく なる ひとも います。", zh: "也有人因為炎熱而身體不舒服。"}
  - {jp: "特にお年寄りや子どもは、気をつけなければなりません。", kana: "とくに おとしよりや こどもは、きを つけなければ なりません。", zh: "特別是老人和小孩，必須要小心。"}
  - {jp: "暑い夏だけではありません。", kana: "あつい なつ だけでは ありません。", zh: "不只是炎熱的夏天而已。"}
  - {jp: "大雨も多くなりました。", kana: "おおあめも おおく なりました。", zh: "大雨也變多了。"}
  - {jp: "短い時間に、たくさんの雨が降ります。", kana: "みじかい じかんに、たくさんの あめが ふります。", zh: "在很短的時間內，下很多雨。"}
  - {jp: "川の水があふれることもあります。", kana: "かわの みずが あふれる ことも あります。", zh: "河水有時候會溢出來。"}
  - {jp: "町が水につかってしまうこともあります。", kana: "まちが みずに つかって しまう ことも あります。", zh: "城鎮有時候也會被水淹沒。"}
  - {jp: "家が壊れたり、車が流されたりします。", kana: "いえが こわれたり、くるまが ながされたり します。", zh: "房子被破壞，車子被沖走。"}
  - {jp: "大雨のニュースを、よく見るようになりました。", kana: "おおあめの ニュースを、よく みる ように なりました。", zh: "我們變得常常看到大雨的新聞。"}
  - {jp: "台風も、前より強くなったと言われています。", kana: "たいふうも、まえより つよく なったと いわれています。", zh: "颱風也被說比以前更強了。"}
  - {jp: "強い風で、木が倒れます。", kana: "つよい かぜで、きが たおれます。", zh: "強風會把樹吹倒。"}
  - {jp: "電気が止まることもあります。", kana: "でんきが とまる ことも あります。", zh: "有時候也會停電。"}
  - {jp: "台風の日は、外に出ないほうがいいです。", kana: "たいふうの ひは、そとに でない ほうが いいです。", zh: "颱風天最好不要出門。"}
  - {jp: "それから、山火事も増えています。", kana: "それから、やまかじも ふえています。", zh: "還有，山林火災也增加了。"}
  - {jp: "空気が乾いていると、火が広がりやすいです。", kana: "くうきが かわいていると、ひが ひろがり やすいです。", zh: "空氣乾燥時，火很容易蔓延。"}
  - {jp: "一度火がつくと、なかなか消えません。", kana: "いちど ひが つくと、なかなか きえません。", zh: "一旦著火，就很難熄滅。"}
  - {jp: "たくさんの森が焼けてしまいます。", kana: "たくさんの もりが やけて しまいます。", zh: "很多森林被燒掉了。"}
  - {jp: "森が焼けると、動物の家もなくなります。", kana: "もりが やけると、どうぶつの いえも なくなります。", zh: "森林被燒掉，動物的家也沒了。"}
  - {jp: "では、どうしてこんなことが起きるのでしょうか。", kana: "では、どうして こんな ことが おきるのでしょうか。", zh: "那麼，為什麼會發生這樣的事呢？"}
  - {jp: "一つの大きな理由は、地球が暖かくなっていることです。", kana: "ひとつの おおきな りゆうは、ちきゅうが あたたかく なっている ことです。", zh: "一個很大的原因，是地球正在變暖。"}
  - {jp: "これを「地球温暖化」と言います。", kana: "これを「ちきゅうおんだんか」と いいます。", zh: "這個叫做「地球暖化」。"}
  - {jp: "地球の温度が、少しずつ高くなっています。", kana: "ちきゅうの おんどが、すこしずつ たかく なっています。", zh: "地球的溫度正一點一點地升高。"}
  - {jp: "少しの温度でも、大きな問題になります。", kana: "すこしの おんどでも、おおきな もんだいに なります。", zh: "即使只是一點點的溫度，也會變成大問題。"}
  - {jp: "では、なぜ地球は暖かくなるのでしょうか。", kana: "では、なぜ ちきゅうは あたたかく なるのでしょうか。", zh: "那麼，為什麼地球會變暖呢？"}
  - {jp: "私たちは、毎日たくさんのエネルギーを使います。", kana: "わたしたちは、まいにち たくさんの エネルギーを つかいます。", zh: "我們每天使用很多能源。"}
  - {jp: "電気を使ったり、車に乗ったりします。", kana: "でんきを つかったり、くるまに のったり します。", zh: "用電、搭車。"}
  - {jp: "工場でも、たくさんのエネルギーを使います。", kana: "こうじょうでも、たくさんの エネルギーを つかいます。", zh: "工廠也使用很多能源。"}
  - {jp: "その時、悪いガスが空に出ます。", kana: "その とき、わるい ガスが そらに でます。", zh: "那時候，不好的氣體會排到天空。"}
  - {jp: "このガスが、地球の熱を外に出しません。", kana: "この ガスが、ちきゅうの ねつを そとに だしません。", zh: "這些氣體不讓地球的熱散到外面。"}
  - {jp: "それで、地球がだんだん暑くなります。", kana: "それで、ちきゅうが だんだん あつく なります。", zh: "因此，地球漸漸變熱。"}
  - {jp: "まるで、毛布をかぶっているようです。", kana: "まるで、もうふを かぶっている ようです。", zh: "就好像蓋著毛毯一樣。"}
  - {jp: "地球が暑くなると、北の方の氷がとけます。", kana: "ちきゅうが あつく なると、きたの ほうの こおりが とけます。", zh: "地球變熱，北方的冰會融化。"}
  - {jp: "氷がとけると、海の水が増えます。", kana: "こおりが とけると、うみの みずが ふえます。", zh: "冰融化，海水會增加。"}
  - {jp: "海の水が増えると、低い土地が水につかります。", kana: "うみの みずが ふえると、ひくい とちが みずに つかります。", zh: "海水增加，低的土地會被水淹。"}
  - {jp: "海の近くに住む人は、心配しています。", kana: "うみの ちかくに すむ ひとは、しんぱいしています。", zh: "住在海邊附近的人很擔心。"}
  - {jp: "気候が変わると、私たちの生活も変わります。", kana: "きこうが かわると、わたしたちの せいかつも かわります。", zh: "氣候改變，我們的生活也會改變。"}
  - {jp: "まず、食べ物に影響が出ます。", kana: "まず、たべものに えいきょうが でます。", zh: "首先，食物會受到影響。"}
  - {jp: "暑すぎると、野菜や米がうまく育ちません。", kana: "あつすぎると、やさいや こめが うまく そだちません。", zh: "太熱的話，蔬菜和米長不好。"}
  - {jp: "雨が少ないと、作物が枯れてしまいます。", kana: "あめが すくないと、さくもつが かれて しまいます。", zh: "雨少的話，作物會枯死。"}
  - {jp: "作物が少なくなると、食べ物の値段が上がります。", kana: "さくもつが すくなく なると、たべものの ねだんが あがります。", zh: "作物變少，食物的價格就上漲。"}
  - {jp: "果物が高くなったと感じる人も多いです。", kana: "くだものが たかく なったと かんじる ひとも おおいです。", zh: "也有很多人覺得水果變貴了。"}
  - {jp: "魚にも影響があります。", kana: "さかなにも えいきょうが あります。", zh: "魚也受到影響。"}
  - {jp: "海の温度が変わると、魚のいる場所も変わります。", kana: "うみの おんどが かわると、さかなの いる ばしょも かわります。", zh: "海的溫度改變，魚所在的地方也改變。"}
  - {jp: "今までとれた魚が、とれなくなることもあります。", kana: "いままで とれた さかなが、とれなく なる ことも あります。", zh: "以前能捕到的魚，有時候捕不到了。"}
  - {jp: "私たちの食卓も、少しずつ変わるかもしれません。", kana: "わたしたちの しょくたくも、すこしずつ かわるかも しれません。", zh: "我們的餐桌或許也會一點一點地改變。"}
  - {jp: "病気が増えることも心配されています。", kana: "びょうきが ふえる ことも しんぱいされています。", zh: "人們也擔心疾病會增加。"}
  - {jp: "暑い場所が広がると、虫も増えます。", kana: "あつい ばしょが ひろがると、むしも ふえます。", zh: "炎熱的地方擴大，蟲也會增加。"}
  - {jp: "虫が病気を運ぶこともあります。", kana: "むしが びょうきを はこぶ ことも あります。", zh: "蟲有時候也會帶來疾病。"}
  - {jp: "気候変動は、遠い国だけの話ではありません。", kana: "きこうへんどうは、とおい くに だけの はなしでは ありません。", zh: "氣候變遷不只是遙遠國家的事。"}
  - {jp: "私たちの町でも、起きていることです。", kana: "わたしたちの まちでも、おきている ことです。", zh: "在我們的城鎮也正在發生。"}
  - {jp: "こう聞くと、少し怖くなりますね。", kana: "こう きくと、すこし こわく なりますね。", zh: "聽到這些，會有點害怕呢。"}
  - {jp: "でも、心配するだけではいけません。", kana: "でも、しんぱいする だけでは いけません。", zh: "但是，只是擔心是不行的。"}
  - {jp: "私たち一人ひとりにも、できることがあります。", kana: "わたしたち ひとりひとりにも、できる ことが あります。", zh: "我們每一個人,也有能做的事。"}
  - {jp: "大きなことでなくても、いいのです。", kana: "おおきな ことで なくても、いいのです。", zh: "不是大事也沒關係。"}
  - {jp: "まず、電気を大切に使いましょう。", kana: "まず、でんきを たいせつに つかいましょう。", zh: "首先，讓我們珍惜使用電。"}
  - {jp: "使わない電気は、こまめに消します。", kana: "つかわない でんきは、こまめに けします。", zh: "不用的電燈,要勤快地關掉。"}
  - {jp: "部屋を出る時は、電気を消しましょう。", kana: "へやを でる ときは、でんきを けしましょう。", zh: "離開房間時，把電燈關掉吧。"}
  - {jp: "テレビを見ない時は、電源を切ります。", kana: "テレビを みない ときは、でんげんを きります。", zh: "不看電視時，把電源關掉。"}
  - {jp: "エアコンの温度も、少し気をつけます。", kana: "エアコンの おんども、すこし きを つけます。", zh: "冷氣的溫度也稍微注意一下。"}
  - {jp: "夏は、設定温度を少し高くします。", kana: "なつは、せっていおんどを すこし たかく します。", zh: "夏天時，把設定溫度調高一點。"}
  - {jp: "暑い時は、まどを開けて風を入れます。", kana: "あつい ときは、まどを あけて かぜを いれます。", zh: "熱的時候，打開窗戶讓風進來。"}
  - {jp: "こんな小さなことでも、電気を節約できます。", kana: "こんな ちいさな ことでも、でんきを せつやく できます。", zh: "這樣的小事，也能節約電。"}
  - {jp: "次に、ごみを減らすことも大切です。", kana: "つぎに、ごみを へらす ことも たいせつです。", zh: "其次，減少垃圾也很重要。"}
  - {jp: "私たちは、毎日たくさんのごみを出します。", kana: "わたしたちは、まいにち たくさんの ごみを だします。", zh: "我們每天製造很多垃圾。"}
  - {jp: "ごみを燃やすと、また悪いガスが出ます。", kana: "ごみを もやすと、また わるい ガスが でます。", zh: "燒垃圾時，又會排出不好的氣體。"}
  - {jp: "だから、ごみは少ないほうがいいです。", kana: "だから、ごみは すくない ほうが いいです。", zh: "所以，垃圾越少越好。"}
  - {jp: "買い物の時は、必要な物だけ買いましょう。", kana: "かいものの ときは、ひつような もの だけ かいましょう。", zh: "買東西時，只買需要的東西吧。"}
  - {jp: "食べ物を残さないことも、大切です。", kana: "たべものを のこさない ことも、たいせつです。", zh: "不剩下食物也很重要。"}
  - {jp: "食べられる物を、捨ててはいけません。", kana: "たべられる ものを、すてては いけません。", zh: "能吃的東西，不可以丟掉。"}
  - {jp: "残ったご飯は、次の日に食べましょう。", kana: "のこった ごはんは、つぎの ひに たべましょう。", zh: "剩下的飯，隔天再吃吧。"}
  - {jp: "それから、リサイクルもしましょう。", kana: "それから、リサイクルも しましょう。", zh: "還有，也來做回收吧。"}
  - {jp: "リサイクルとは、物をもう一度使うことです。", kana: "リサイクルとは、ものを もう いちど つかう ことです。", zh: "回收就是把東西再使用一次。"}
  - {jp: "紙やびんやかんは、分けて出します。", kana: "かみや びんや かんは、わけて だします。", zh: "紙、瓶、罐要分開丟。"}
  - {jp: "プラスチックも、きちんと分けます。", kana: "プラスチックも、きちんと わけます。", zh: "塑膠也要好好分類。"}
  - {jp: "分けて出すと、また新しい物になります。", kana: "わけて だすと、また あたらしい ものに なります。", zh: "分開丟，又能變成新的東西。"}
  - {jp: "古い紙が、新しいノートになることもあります。", kana: "ふるい かみが、あたらしい ノートに なる ことも あります。", zh: "舊紙有時候也能變成新的筆記本。"}
  - {jp: "ごみを分けるのは、少し面倒です。", kana: "ごみを わけるのは、すこし めんどうです。", zh: "把垃圾分類有點麻煩。"}
  - {jp: "でも、慣れれば簡単になります。", kana: "でも、なれれば かんたんに なります。", zh: "但是，習慣了就會變簡單。"}
  - {jp: "毎日続けることが、いちばん大事です。", kana: "まいにち つづける ことが、いちばん だいじです。", zh: "每天持續下去最重要。"}
  - {jp: "買い物には、マイバッグを持って行きましょう。", kana: "かいものには、マイバッグを もって いきましょう。", zh: "買東西時，帶自己的環保袋去吧。"}
  - {jp: "マイバッグとは、自分のふくろのことです。", kana: "マイバッグとは、じぶんの ふくろの ことです。", zh: "Mybag 就是自己的袋子。"}
  - {jp: "店のふくろを、もらわなくてすみます。", kana: "みせの ふくろを、もらわなくて すみます。", zh: "就可以不用拿店家的袋子。"}
  - {jp: "プラスチックのふくろは、ごみになります。", kana: "プラスチックの ふくろは、ごみに なります。", zh: "塑膠袋會變成垃圾。"}
  - {jp: "海に流れて、魚が食べてしまうこともあります。", kana: "うみに ながれて、さかなが たべて しまう ことも あります。", zh: "流到海裡，有時候魚會吃下去。"}
  - {jp: "だから、マイバッグはとても役に立ちます。", kana: "だから、マイバッグは とても やくに たちます。", zh: "所以，環保袋非常有用。"}
  - {jp: "水のボトルも、自分の物を持ちましょう。", kana: "みずの ボトルも、じぶんの ものを もちましょう。", zh: "水瓶也帶自己的吧。"}
  - {jp: "そうすれば、ペットボトルを買わなくてすみます。", kana: "そう すれば、ペットボトルを かわなくて すみます。", zh: "這樣的話，就不用買寶特瓶了。"}
  - {jp: "それから、出かける時のことも考えましょう。", kana: "それから、でかける ときの ことも かんがえましょう。", zh: "還有，也來想想出門的時候吧。"}
  - {jp: "近い場所なら、歩いて行きましょう。", kana: "ちかい ばしょなら、あるいて いきましょう。", zh: "如果是近的地方，就走路去吧。"}
  - {jp: "歩くと、体にもいいです。", kana: "あるくと、からだにも いいです。", zh: "走路對身體也好。"}
  - {jp: "少し遠い時は、自転車を使いましょう。", kana: "すこし とおい ときは、じてんしゃを つかいましょう。", zh: "稍微遠一點時，就用腳踏車吧。"}
  - {jp: "自転車は、ガスを出しません。", kana: "じてんしゃは、ガスを だしません。", zh: "腳踏車不排放氣體。"}
  - {jp: "もっと遠い時は、電車やバスに乗りましょう。", kana: "もっと とおい ときは、でんしゃや バスに のりましょう。", zh: "更遠的時候，就搭電車或公車吧。"}
  - {jp: "これを「公共交通」と言います。", kana: "これを「こうきょうこうつう」と いいます。", zh: "這個叫做「大眾交通」。"}
  - {jp: "電車やバスは、たくさんの人を運びます。", kana: "でんしゃや バスは、たくさんの ひとを はこびます。", zh: "電車和公車能載很多人。"}
  - {jp: "一人ずつ車に乗るより、ずっといいです。", kana: "ひとりずつ くるまに のるより、ずっと いいです。", zh: "比起每個人各自開車要好得多。"}
  - {jp: "車が少なくなると、空気もきれいになります。", kana: "くるまが すくなく なると、くうきも きれいに なります。", zh: "車變少，空氣也會變乾淨。"}
  - {jp: "道もこまなくなります。", kana: "みちも こまなく なります。", zh: "道路也不會塞了。"}
  - {jp: "家の中でも、できることがあります。", kana: "いえの なかでも、できる ことが あります。", zh: "在家裡也有能做的事。"}
  - {jp: "水も、大切に使いましょう。", kana: "みずも、たいせつに つかいましょう。", zh: "水也要珍惜使用。"}
  - {jp: "歯をみがく時は、水を止めます。", kana: "はを みがく ときは、みずを とめます。", zh: "刷牙時，把水關掉。"}
  - {jp: "シャワーの時間も、長くしすぎません。", kana: "シャワーの じかんも、ながく しすぎません。", zh: "淋浴的時間也不要太長。"}
  - {jp: "服も、すぐに捨てないようにします。", kana: "ふくも、すぐに すてない ように します。", zh: "衣服也盡量不要馬上丟掉。"}
  - {jp: "まだ着られる服は、大事に着ましょう。", kana: "まだ きられる ふくは、だいじに きましょう。", zh: "還能穿的衣服，要珍惜地穿。"}
  - {jp: "いらない物は、人にあげてもいいです。", kana: "いらない ものは、ひとに あげても いいです。", zh: "不要的東西，送給別人也可以。"}
  - {jp: "古い物を直して、また使う人もいます。", kana: "ふるい ものを なおして、また つかう ひとも います。", zh: "也有人把舊東西修好再使用。"}
  - {jp: "木を植えることも、いいことです。", kana: "きを うえる ことも、いい ことです。", zh: "種樹也是好事。"}
  - {jp: "木は、悪いガスをすってくれます。", kana: "きは、わるい ガスを すって くれます。", zh: "樹會吸收不好的氣體。"}
  - {jp: "そして、きれいな空気を作ります。", kana: "そして、きれいな くうきを つくります。", zh: "然後製造出乾淨的空氣。"}
  - {jp: "公園や庭に、花や木を植えてみましょう。", kana: "こうえんや にわに、はなや きを うえて みましょう。", zh: "在公園或庭院，種種花和樹看看吧。"}
  - {jp: "小さな緑でも、町が気持ちよくなります。", kana: "ちいさな みどりでも、まちが きもちよく なります。", zh: "即使是小小的綠意，城鎮也會變得舒服。"}
  - {jp: "ここまで、いろいろな話をしました。", kana: "ここまで、いろいろな はなしを しました。", zh: "到這裡，我談了很多事。"}
  - {jp: "「一人がやっても、意味がない」と思う人もいます。", kana: "「ひとりが やっても、いみが ない」と おもう ひとも います。", zh: "也有人覺得「一個人做也沒有意義」。"}
  - {jp: "でも、それはちがうと思います。", kana: "でも、それは ちがうと おもいます。", zh: "但是，我覺得不是這樣。"}
  - {jp: "一人の力は、小さいかもしれません。", kana: "ひとりの ちからは、ちいさいかも しれません。", zh: "一個人的力量或許很小。"}
  - {jp: "でも、みんなで集まれば、大きな力になります。", kana: "でも、みんなで あつまれば、おおきな ちからに なります。", zh: "但是，大家聚在一起，就會變成大力量。"}
  - {jp: "一人が始めると、まわりの人も始めます。", kana: "ひとりが はじめると、まわりの ひとも はじめます。", zh: "一個人開始，周圍的人也會開始。"}
  - {jp: "友だちや家族にも、話してみましょう。", kana: "ともだちや かぞくにも、はなして みましょう。", zh: "也跟朋友和家人說說看吧。"}
  - {jp: "みんなで一緒にやると、楽しくなります。", kana: "みんなで いっしょに やると、たのしく なります。", zh: "大家一起做，會變得開心。"}
  - {jp: "今、私たちがしていることは、未来につながります。", kana: "いま、わたしたちが している ことは、みらいに つながります。", zh: "現在我們所做的事，會連到未來。"}
  - {jp: "今の子どもたちは、これからずっとこの地球に住みます。", kana: "いまの こどもたちは、これから ずっと この ちきゅうに すみます。", zh: "現在的孩子們，今後會一直住在這個地球上。"}
  - {jp: "きれいな地球を、次の人に渡したいですね。", kana: "きれいな ちきゅうを、つぎの ひとに わたしたいですね。", zh: "我們希望把乾淨的地球交給下一個人呢。"}
  - {jp: "そのために、今日からできることを始めましょう。", kana: "その ために、きょうから できる ことを はじめましょう。", zh: "為此，從今天開始做能做的事吧。"}
  - {jp: "難しいことは、しなくてもいいです。", kana: "むずかしい ことは、しなくても いいです。", zh: "困難的事，不做也沒關係。"}
  - {jp: "電気を消す。", kana: "でんきを けす。", zh: "關燈。"}
  - {jp: "ごみを分ける。", kana: "ごみを わける。", zh: "分類垃圾。"}
  - {jp: "マイバッグを持つ。", kana: "マイバッグを もつ。", zh: "帶環保袋。"}
  - {jp: "歩いて出かける。", kana: "あるいて でかける。", zh: "走路出門。"}
  - {jp: "こんな小さなことで、いいのです。", kana: "こんな ちいさな ことで、いいのです。", zh: "這樣的小事就可以了。"}
  - {jp: "毎日少しずつ、続けることが大切です。", kana: "まいにち すこしずつ、つづける ことが たいせつです。", zh: "每天一點一點地持續最重要。"}
  - {jp: "一つの行動が、世界を少しずつ変えます。", kana: "ひとつの こうどうが、せかいを すこしずつ かえます。", zh: "一個行動，會一點一點地改變世界。"}
  - {jp: "気候変動は、大きな問題です。", kana: "きこうへんどうは、おおきな もんだいです。", zh: "氣候變遷是個大問題。"}
  - {jp: "でも、私たちには、できることがあります。", kana: "でも、わたしたちには、できる ことが あります。", zh: "但是，我們有能做的事。"}
  - {jp: "あきらめないことが、いちばん大切です。", kana: "あきらめない ことが、いちばん たいせつです。", zh: "不放棄最重要。"}
  - {jp: "今日から、一緒に始めましょう。", kana: "きょうから、いっしょに はじめましょう。", zh: "從今天開始，一起做吧。"}
  - {jp: "未来のために、私たちにできることをしましょう。", kana: "みらいの ために、わたしたちに できる ことを しましょう。", zh: "為了未來，做我們能做的事吧。"}
  - {jp: "小さな一歩が、きっと大きな未来を作ります。", kana: "ちいさな いっぽが、きっと おおきな みらいを つくります。", zh: "小小的一步，一定能創造大大的未來。"}
  - {jp: "それが、私たちにできることです。", kana: "それが、わたしたちに できる ことです。", zh: "那就是我們能做的事。"}
  - {jp: "今日は、ここまでです。", kana: "きょうは、ここまでです。", zh: "今天就到這裡。"}
  - {jp: "最後まで聞いてくれて、ありがとうございました。", kana: "さいごまで きいて くれて、ありがとうございました。", zh: "謝謝你聽到最後。"}
