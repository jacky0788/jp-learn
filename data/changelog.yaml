- date: "2026-08-29"
  items:
    - "📚 全面檢查全站 151 個文法點，補強句子結構、助詞角色、語意邊界、近似句型差異與使用限制，共優化 82 項說明"
    - "💬 能力・經驗句型新增完整拆解：說明 V＋こと 如何名詞化、內層助詞為何保留、外層為何用 が，以及改用 は 時的對比／否定語感"
    - "🛠 修正容易誤導的規則：可能形不等於許可、予定可否定、つもり沒有固定百分比、の／こと不一定能直接互換，並補充 なる／する、推測／傳聞、命令語氣等差異"

- date: "2026-08-25"
  items:
    - "💬 會話課新增 8/21 兩個主題：「つもり（打算）」與「ために（目的）」，收在選單的 📅 2026-08-21"
    - "📊 つもり課重點是老師畫的強度階梯：家を買いたいです（想法）→ 買いたいと思っています（持續有這個想法）→ 買おうと思っています（決定）→ 買うつもりです（打算）；板書標明つもり是「非肯定」的60〜70%，不是100%確定"
    - "🗯 補上課本沒強調的兩句會話：「どういうつもりですか」（你到底想幹嘛，責問語氣）與「そのつもりです」（對，我是這麼打算的）"
    - "🎯 ために課：A ために B＝為了A而做B，前面要用辭書形、前後主語要一致；三個板書例句（弁護士になるために／生きていくために／あなたに会うために）"
    - "📘 第25課(B3L05)全課上完，內容從2個文型擴充到5個：新增「文型三 〜なさい」「文型四 格助詞と」「文型五 〜という意味です」，整課文法點從5個變17個、例句91句、練習133題"
    - "🚦 新增老師的兩張標誌練習單（11題）：看圖說命令形（靴をぬげ・注意しろ・シートベルトをしめろ・ゆっくりはしれ・止まれ）與禁止形（携帯を使うな・たばこを吸うな・入るな・食べるな・写真を撮るな・車を止めるな）"
    - "🗣 新增「〜なさい」完整教學：講義13題＋課本21題，附「命令形＞なさい＞てください＞ないでください」四種語氣強度對照表，並提醒なさい只能上對下、沒有否定形"
    - "🔤 新增格助詞「と」三種用法（變化結果／命名定義判斷／引用）共13個例句，說明它就是〜と読みます・〜と書いてあります・〜という意味です 的共同地基"
    - "🈁 新增六個四字熟語：間一髪・十人十色・中途半端・いい加減・試行錯誤・無我夢中，每個都附講義原文的日文說明與例文"
    - "⚾ 新增課本P84長對話「球場で野球を応援する」16句：かっ飛ばせー！打て！入ってくれ！整串加油口號都是命令形"
    - "📝 補齊課本P80-P83所有練習與対話：標誌說明（〜という意味です）、なさい練習、以及P83克漏字「きびしいコーチ・やさしい祖母」——同一件事，嚴厲教練用命令形、溫柔祖母用なさい"
    - "🃏 單字從42個增加到76個，補上講義出現的字（待合室・失格・本拠地・隙間・冗談・価値観・難航…）與四字熟語"
    - "🛠 補註課本P78練2(3)板書寫了「貸せ！」「返せ！」兩個答案；看圖是還錢，取「返せ」"

- date: "2026-08-03"
  items:
    - "🔤 五十音改為平假名／片假名分開顯示（各3個區塊，共6張圖表），不再擠在同一格，看起來清楚多了"
    - "🍱 片假名改配外來語例字：ア→アイス、カ→カメラ、コ→コーヒー、テ→テレビ…一邊記字母一邊記常用外來語；平假名維持日文固有詞（あめ雨、いぬ狗、ねこ貓）"
    - "🎨 兩套字母用不同底色區分，單獨顯示時字放大到 38px 更好認"
    - "🔤 基礎文法新增「五十音（從零開始）」：清音46＋濁音半濁音25＋拗音33，共104格，每一格都有平假名／片假名／羅馬字＋一個好記的常用例字（あ→あめ雨、い→いぬ狗…）"
    - "🔊 五十音圖專屬排版：每個音獨立一格清楚顯示，點格子唸該音、點例字唸整個單字；手機上圖表可獨立橫捲，不會擠壓版面"
    - "📖 五十音課另含5個單元：行與段的排法（呼應之後的動詞變化）、容易唸錯的音（し/ち/つ/ふ、は→wa、へ→e）、促音長音撥音的拍數、片假名用途與易混字（シ/ツ、ソ/ン）、綜合練習"
    - "📚 基礎文法新增「五段動詞（完整版）」：把九種語尾（う・く・ぐ・す・つ・ぬ・ぶ・む・る）的變化全部攤開來教，含 9×10 完整變化總表、七個單元、43 個例句、76 題練習、20 個常用五段動詞"
    - "🎯 五段課重點：五段原理（行不變、段在變）、判別法與「假一段」陷阱（帰る/走る/入る/切る）、て形音便四規則、三個必背例外（買わない／行って／ある的否定是ない）"
    - "🛠 修正全站 161 處「形」的注音：て形／た形／ない形 原本被誤標成「かたち」，應為「けい」"
    - "🛠 說明文與筆記現在支援粗體與注音顯示（原本會直接看到 ** 與 {{ }} 符號）"
    - "🈁 注音範圍大幅擴充：練習題、接続、文法點標題、圖解表格的漢字也標上平假名了（原本只有例句／單字／文章有）。單課練習題未注音處從 135 降到 50"
    - "🔒 三道防呆：中文敘述不會被標上日文讀音；數字後的量詞（1本＝いっぽん）讀音會變的不亂標；考「怎麼唸」的題目不標題目，避免直接洩答案"
    - "🛠 修正「5時に」被標成「ごとき」、「練1例」被標成「たと」等誤標"

- date: "2026-08-02"
  items:
    - "🧠 單字卡改成真正的「間隔複習」：按『記得了』會隔 1→3→7→14→30→60 天再問你，按『還不熟』則當天再出現。單字卡預設只出「今天到期」的字，學過的不會一直重複出現"
    - "✨ 評分後有即時回饋：畫面上方顯示「熟練度 2 → 3　·　7 天後再問」，翻面後也看得到目前熟練度與下次複習時間，頂端即時顯示本輪「✓記得 ↻不熟」"
    - "↻ 單字卡本輪結束可「只重看不熟的 N 張」，並列出本輪不熟的字；沒有到期的字時會告訴你下次複習是幾天後（也可選擇照樣複習全部）"
    - "⭐ 全部單字清單顯示每個字的熟練度★與下次複習時間，可篩「只看不熟」，也能單獨把某個字的熟練度歸零重學"
    - "📖 文法頁可收合：文法點多的課預設收合只看標題（第24課從約20個手機螢幕縮成1個多），點標題展開，另有「全部展開／收合」與小目錄跳轉"
    - "📝 測驗改為分輪：設定可選每輪 10/20/30/50/全部題；做完顯示答對率與錯題列表，可「只重做錯的題目」"
    - "🃏 單字卡分批：設定可選每輪 10/20/30/50/全部張，優先出還不熟的；一輪結束顯示整課熟練度，可續下一批"
    - "📱 手機首次開啟預設收合選單，內容一進來就看得到（手動切換過就記住你的選擇）"
    - "🟢 選單顯示學習進度：每課旁邊的小圓點代表單字熟練度（滑過可看幾分之幾），一眼看出哪課還沒練"
    - "🛠 修正「何」的注音顯示成「なになん」；統一ジョギング的詞性標註"
    - "🈁 全站日文漢字注音達成 100%：所有例句、單字、文章的漢字都標上平假名（原本 96%，補上含數字與熟字訓的句子，如 20歳→はたち、3日→みっか、24時間→にじゅうよじかん）"
    - "🎛 假名顯示統一由設定控制：「假名顯示方式」現在也管圖解表格；選「不顯示假名」時全站（含表格）都不顯示。測驗頁與單字卡正面一律不顯示以免洩題"
    - "📘 新增第25課（B3L05）「早く行け！」本週進度：文型一 V命令形（I類→え段／II類→ろ／する→しろ／来る→こい）、文型二 強烈禁止 V基本形＋な；含講義練習34題、課本練習1-3全收、対話、活用總表；單字42個（禁煙／進入禁止／土足厳禁／非常口／優先席 等告示標語）"
    - "🔜 第25課「〜という意味です」「〜なさい」尚未上到，已先收錄預習；後續上課再補完"
    - "📘 第24課新增「〜なくて／〜ないで」補足講義（6頁）：只有動詞才分 ないで/なくて，い形・な形・名詞一律用なくて；動詞的五種用法判準（原因用なくて；附帶狀況/方法手段/否決前項/接ないでください 用ないで）"
    - "✍️ 補足講義的空格全部填完：P1-2 填空 ④〜⑬ 與 P6 翻譯練習 7 題（老師未公布解答者標示為參考解答）；單字新增 13 個（検査／丈夫／親切／本物／満席／乱暴／慌てる／悩む 等）"
    - "🗂 會話課選單新增「依上課日期」分組：對不上課本課號的內容改用上課日期歸類（順序＝第N課 → 📅日期 → 未分類）"
    - "💬 新增會話主題「てしまう／てみる」：〜てみます(試試看)／〜てみせます(做給人看)、〜てしまう的兩種用法(①動作完全結束②後悔・不好意思・憤慨)，含板書例句與老師訂正題"
    - "💬 新增會話主題「形容詞＋なる／する」：い形→く、な形→に 接動詞；なる(自然變化) vs する(人為意志)，也可接一般動詞(短く切る／きれいに使う)"
    - "💬 時間表現大幅補強：新增板書判準「間＋持續動詞／間に＋瞬間動詞」，並點出まで／までに 是同一組概念；補 7 個例句與 5 題練習"
    - "🈁 新增「漢字上方注音（ふりがな）」：設定→假名顯示方式可選 整句假名在下（預設）／漢字上方注音／不顯示。約 96% 的日文句子自動標上注音"
    - "🔒 注音只在系統能百分之百確定讀音時才標；少數無法確定的（多為含數字，如「もう10時」）會自動保留整句假名，不會標錯也不會沒讀音。測驗頁與單字卡正面不注音，避免洩題"
    - "🛠 修正 3 處假名錯字（何度か／何度でも 誤寫成なんども、水が出ない例句缺假名）與 1 個不相符的單字例句（熱中症）"
    - "📘 第24課（B3L04）依老師「講義填答版」全面校正：文型一／二／三 的例句與練習全部改為官方解答（原本部分是推測的參考解答）"
    - "📗 新增文型三「〜ようになる」完整講義：說明、例①〜④（含A〜F）、⑤〜⑫官方填答；補上時態重點（×なります／○なっています・なりました）與能力用可能形・習慣用原形的區別"
    - "⚠️ 新增「ようになる 的兩個限制」：本身即變化的動詞（太る／増える／減る／変わる）不可用；否定時可能動詞用〜なくなる、一般動詞兩種皆可"
    - "📝 新增講義翻訳作業 6 題（用〜〜なる 中翻日，附參考解答）"
    - "🔤 第24課單字新增 19 個：熱中症／エコバッグ／割り込む／朝寝坊／夜更かし／自炊／電子書籍／ジョギング／完璧／鍛える／老眼鏡 等"

