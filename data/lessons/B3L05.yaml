book: 3
lesson: 5
title: 第三冊 第5課（第25課）　早く 行け！
# 來源：來學日本語 基礎進階1 第25課（課本 pp.77-85）＋文法課講義 pp.1-6
#   ＋老師自製標誌練習單 2 張（命令形／禁止形）
#   照片：raw/B3L05/（2026-08-02 首批；2026-08-25 補齊全課，含講義填答版）
# ✅ 進度：第25課已上完（文型一〜五全數上完，課本 pp.77-85 全收）。

intro: |
  這一課學「命令」與「禁止」——語氣最強烈的兩種說法。課本標題頁的基本文預告了整課：
  ・早く行け！（命令形：快去！）
  ・あの部屋に入るな！（禁止形：不准進那個房間！）
  ・このマークはたばこを吸うなという意味です。（〜という意味です：…的意思）
  ・もう遅いから早く寝なさい。（〜なさい：較緩和的命令）

  ⚠️ 命令形與禁止形語氣**非常強烈**，日常會話幾乎不對長輩、上司、不熟的人使用。
  常見場合：男性之間、父母對小孩、教練對選手、運動加油、標語告示（禁煙・進入禁止）、
  緊急狀況（早く逃げろ！），以及引用規則時（〜なと書いてあります）。
  想客氣一點就用「〜てください」；「〜なさい」比命令形柔和，多為父母／老師對小孩使用。

  整課的骨架是「**語氣強度**」這條軸：
  命令形（早く行け）＞ 禁止形（入るな）＞ なさい（早く寝なさい）＞ てください／ないでください。
  另外兩個文型是「**把話引用起來**」：文型四的格助詞「と」（〜と言う／〜と書いてある／〜と読む），
  以及架在它上面的文型五「〜という意味です」——看到看不懂的標語、招牌、四字熟語時，
  就用「これは何と読むんですか」「どういう意味ですか」問，用「〜という意味です」答。

goals:
  - "做出動詞的命令形（I類語尾改え段／II類＋ろ／する→しろ・来る→来い）"
  - "做出禁止形：V（基本形）＋な"
  - "看懂告示標語（禁煙・進入禁止・土足厳禁・使用不可）"
  - "知道命令形／禁止形的語氣強度與使用場合，該客氣時改用〜てください"
  - "用 V（ます形）＋なさい 下較緩和的命令，並分辨它與命令形、〜てください的差別"
  - "掌握格助詞「と」的三種用法：變化結果／命名・定義・判斷／引用"
  - "用「〜という意味です」說明標誌、詞語、四字熟語的意思，並用「どういう意味ですか」發問"
  - "看得懂並說得出六個四字熟語（間一髪・十人十色・中途半端・いい加減・試行錯誤・無我夢中）"

grammar:
  - point: "文型一　V命令形（快去做！）"
    source: 文法
    key: true
    setsuzoku:
      - "① 五段活用動詞（I類）⇒ 語幹＋原語尾之【え段音】（書く→書け）"
      - "② 上一段・下一段動詞（II類）⇒ 語幹＋【ろ】（食べる→食べろ）"
      - "③ 来る ⇒ 【来い】"
      - "④ する／〜する ⇒ 【しろ】／〜【しろ】"
    explain: |
      【講義】V6 是命令形，用來強烈地命令對方「快做…！」。
      變化規則：I類把ます形前的假名改成同行的「え段音」；II類把る改成ろ；
      III類 する→しろ、来る→来い（注意「来い」讀 こい）。
      ＊語氣很強，對長輩或不熟的人不可使用；要客氣請用「〜てください」。
    table:
      caption: "命令形・禁止形 活用總表（課本 P79「活用の作り方」）"
      headers: ["類別", "ます形", "命令形", "禁止形（＋な）"]
      rows:
        - ["I類（五段）", "{{買|か}}います", "{{買|か}}[え]", "{{買|か}}う[な]"]
        - ["I類", "{{書|か}}きます", "{{書|か}}[け]", "{{書|か}}く[な]"]
        - ["I類", "{{泳|およ}}ぎます", "{{泳|およ}}[げ]", "{{泳|およ}}ぐ[な]"]
        - ["I類", "{{話|はな}}します", "{{話|はな}}[せ]", "{{話|はな}}す[な]"]
        - ["I類", "{{待|ま}}ちます", "{{待|ま}}[て]", "{{待|ま}}つ[な]"]
        - ["I類", "{{死|し}}にます", "{{死|し}}[ね]", "{{死|し}}ぬ[な]"]
        - ["I類", "{{遊|あそ}}びます", "{{遊|あそ}}[べ]", "{{遊|あそ}}ぶ[な]"]
        - ["I類", "{{読|よ}}みます", "{{読|よ}}[め]", "{{読|よ}}む[な]"]
        - ["I類", "{{帰|かえ}}ります", "{{帰|かえ}}[れ]", "{{帰|かえ}}る[な]"]
        - ["II類（一段）", "{{寝|ね}}ます／{{食|た}}べます", "寝[ろ]／食べ[ろ]", "寝る[な]／食べる[な]"]
        - ["III類", "します", "[しろ]", "する[な]"]
        - ["III類", "{{来|き}}ます", "[こい]", "{{来|く}}る[な]"]
    examples:
      - {jp: "早く行け！", kana: "はやく いけ！", zh: "快去！（課本基本文）"}
      - {jp: "早く起きろよ。", kana: "はやく おきろよ。", zh: "快點起床啦。（対話・入れ替え）"}
      - {jp: "宿題を出せ！", kana: "しゅくだいを だせ！", zh: "把作業交出來！"}
      - {jp: "自分でやれ！", kana: "じぶんで やれ！", zh: "自己做！"}
      - {jp: "ここで待て！", kana: "ここで まて！", zh: "在這裡等！"}
      - {jp: "前に来い！", kana: "まえに こい！", zh: "到前面來！（来る→こい）"}
      - {jp: "出発しろ！", kana: "しゅっぱつしろ！", zh: "出發！（する→しろ）"}
    practice_note: "講義 P1 練習表（基本形→命令形，共20題，含已填答案）"
    practice:
      - {q: "全部食べる →（命令形）", a: "全部食べろ", note: "II類→ろ"}
      - {q: "出発する →（命令形）", a: "出発しろ！", note: "III類 する→しろ"}
      - {q: "ここにいる →（命令形）", a: "ここにいろ！", note: "II類→ろ"}
      - {q: "一人で遊ぶ →（命令形）", a: "一人で遊べ！", note: "I類 ぶ→べ"}
      - {q: "部屋に入る →（命令形）", a: "部屋に入れ！", note: "I類 る→れ"}
      - {q: "出ていく →（命令形）", a: "出ていけ！", note: "I類 く→け"}
      - {q: "自分でやる →（命令形）", a: "自分でやれ！"}
      - {q: "薬を飲む →（命令形）", a: "薬を飲め！", note: "I類 む→め"}
      - {q: "こっちを見る →（命令形）", a: "こっちを見ろ！", note: "II類→ろ"}
