      - {q: "早く起きる →（命令形）", a: "早く起きろ！"}
      - {q: "前に来る →（命令形）", a: "前に来い！", note: "来る→こい"}
      - {q: "すぐ払う →（命令形）", a: "すぐ払え！", note: "I類 う→え"}
