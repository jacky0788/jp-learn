  - point: "課本練習（P82：〜なさい）"
    source: 文法
    explain: |
      課本 P82 的兩組練習。練習1 把ます形直接改成「〜なさい」；
      練習2 把「A（理由）・B（〜てください）」兩句合併成「A から、B なさい。」
      ——理由句要先改成**普通形**再接から（片付きません→片付かない**から**）。
      ※ 課本上這兩組沒有填答，以下依例題規則整理。
    practice_note: "練習1＝ます形→なさい（12題）／練習2＝理由＋なさい（9題）"
    practice:
      - {q: "練1例：書きます →", a: "書きなさい"}
      - {q: "練1(1) 買います →", a: "買いなさい"}
      - {q: "練1(2) 歩きます →", a: "歩きなさい"}
      - {q: "練1(3) 貸します →", a: "貸しなさい"}
      - {q: "練1(4) 待ちます →", a: "待ちなさい"}
      - {q: "練1(5) 呼びます →", a: "呼びなさい"}
      - {q: "練1(6) 飲みます →", a: "飲みなさい"}
      - {q: "練1(7) 帰ります →", a: "帰りなさい"}
      - {q: "練1(8) 食べます →", a: "食べなさい"}
      - {q: "練1(9) 出ます →", a: "出なさい"}
      - {q: "練1(10) 寝ます →", a: "寝なさい"}
      - {q: "練1(11) します →", a: "しなさい"}
      - {q: "練1(12) 来ます →", a: "来なさい", note: "唸「きなさい」。跟命令形的「こい」讀音不同，別搞混"}
      - {q: "練2例：テーブルの上が片付きません・早く食べてください →", a: "テーブルの上が片付かないから、早く食べなさい。"}
      - {q: "練2(1) あした起きられません・早く寝てください →", a: "あした起きられないから、早く寝なさい。"}
      - {q: "練2(2) 誰にも言いません・話してください →", a: "誰にも言わないから、話しなさい。"}
      - {q: "練2(3) もう遅いです・帰ってください →", a: "もう遅いから、帰りなさい。"}
      - {q: "練2(4) 心配しています・連絡してください →", a: "心配しているから、連絡しなさい。"}
      - {q: "練2(5) 約束です・見せてください →", a: "約束だから、見せなさい。", note: "名詞句要用「だから」"}
      - {q: "練2(6) 順番です・静かに待っていてください →", a: "順番だから、静かに待っていなさい。"}
      - {q: "練2(7) 仕事ができません・机の上を片付けてください →", a: "仕事ができないから、机の上を片付けなさい。"}
      - {q: "練2(8) 授業で使います・来週までにこの教科書を買ってください →", a: "授業で使うから、来週までにこの教科書を買いなさい。"}
      - {q: "練2(9) 栄養バランスがよくなります・野菜もたくさん食べてください →", a: "栄養バランスがよくなるから、野菜もたくさん食べなさい。"}

  - point: "対話（課本 P82：媽媽從小說的話）"
    source: 文法
    explain: |
      示範「〜なさい」怎麼在對話裡出現：引用長輩說過的話，常搭配「〜と言っていました」
      （＝文型四的引用「と」）。最後一句用「〜んですね」表示恍然大悟。
    examples:
      - {jp: "子どもの時、母がよく言っていました。", kana: "こどもの とき、ははが よく いって いました。", zh: "小時候媽媽常常說。"}
      - {jp: "何と言っていましたか。", kana: "なんと いって いましたか。", zh: "說了什麼呢？"}
      - {jp: "朝ごはんは毎日きちんと食べなさいとね。", kana: "あさごはんは まいにち きちんと たべなさいとね。", zh: "「早餐每天都要好好吃」這樣。"}
      - {jp: "だから健康なんですね。", kana: "だから けんこうなんですね。", zh: "難怪你這麼健康。"}
      - {jp: "先生 － テストが終わったら見直しなさい － 合格したんですね", kana: "せんせい － てすとが おわったら みなおしなさい － ごうかくしたんですね", zh: "老師－考完試要檢查一遍－難怪你考上了。（入れ替え）"}
      - {jp: "父 － 本を読みなさい － いろんなことを知っているんですね", kana: "ちち － ほんを よみなさい － いろんな ことを しって いるんですね", zh: "爸爸－要多讀書－難怪你懂那麼多。（入れ替え）"}

  - point: "やってみよう（課本 P83：きびしいコーチ・やさしい祖母）"
    source: 文法
    key: true
    explain: |
      課本 P83 的克漏字短文，把括號裡的動詞改成「正しい形」。
      重點是**看說話的人是誰、語氣多強**來決定用哪一種：
      嚴厲的教練 → **命令形／禁止形**；溫柔的祖母 → **〜なさい**。
      同樣是「叫別人做某事」，選錯形整個人設就跑掉了，是本課最好的總複習。
      ※ 課本上未填答，以下是依短文語氣整理的參考解答。
    practice_note: "1＝きびしいコーチ（命令形・禁止形）／2＝やさしい祖母（〜なさい）"
    practice:
      - {q: "1. コーチはいつも「校庭を10回（走ります→＿＿）」と大きい声で言う", a: "走れ", note: "命令形"}
      - {q: "1. こわい声で「（休みます→＿＿）」と言うからぜんぜん休めない", a: "休むな", note: "禁止形。這裡是叫人「不准休息」"}
      - {q: "1.「選手になりたかったら、もっと（練習します→＿＿）」", a: "練習しろ", note: "III類命令形"}
      - {q: "2. 祖母：「もっと野菜を（食べます→＿＿）」", a: "食べなさい"}
      - {q: "2. 祖母：「車に（気をつけます→＿＿）」", a: "気をつけなさい"}
      - {q: "2. 祖母：「早くうちに（帰ります→＿＿）」", a: "帰りなさい"}
      - {q: "2. 祖母：「残念だったね。次のテストは（がんばります→＿＿）」", a: "がんばりなさい", note: "沒罵人，用なさい鼓勵"}

  - point: "文型四　〜と＋V（格助詞「と」）"
    source: 文法
    setsuzoku:
      - "① 變化結果：N ＋【と】＋ なる／化する（＝「に」，但更書面）"
      - "② 命名・定義・判斷：N を「N」＋【と】＋ 呼ぶ／いう／みなす／名付ける／定義する／する"
      - "③ 引用：「〜」／〜 ＋【と】＋ 言う／思う／頼む／聞こえる／伝える／書いてある／読む"
    explain: |
      【講義】説明：「と」是**格助詞**，這一課看它的三種用法。
      **① 変化の結果**：書面語，口語多半用「に」。「氷が水**と**なる」＝「氷が水**に**なる」。
      **② 〜〜内容**：當述語是「呼ぶ・いう・みなす・名付ける・定義する」這類
      對事物**命名、定義、下判斷**的動詞時，命名／定義／判斷的內容就用「と」帶出來。
      **③ 引用**：發言、思考、命令・依頼、傳話都用「と」。
      💡 本課的「〜という意味です」「〜と書いてあります」「〜と読みます」全都是這個「と」，
      所以文型四其實是文型五的地基。
    examples:
      - {jp: "氷が融けて水となる。", kana: "こおりが とけて みずと なる。", zh: "冰融化成水。（＝水になる）"}
      - {jp: "肉が焦げて真っ黒となっちゃった。", kana: "にくが こげて まっくろと なっちゃった。", zh: "肉烤焦，變得漆黑一片。"}
      - {jp: "どうしようかな。{{10年間|じゅうねんかん}}の{{努力|どりょく}}は{{水|みず}}の{{泡|あわ}}と{{化|か}}した。", kana: "どうしようかな。じゅうねんかんの どりょくは みずの あわと かした。", zh: "怎麼辦呢。十年的努力化為泡影。"}
      - {jp: "試験開始時間に着席していない学生は失格とみなす。", kana: "しけんかいしじかんに ちゃくせきして いない がくせいは しっかくと みなす。", zh: "考試開始時間未就座的學生視為失去資格。"}
      - {jp: "{{3辺|さんぺん}}の{{長|なが}}さが{{全|すべ}}て{{等|ひと}}しい{{三角形|さんかっけい}}を「{{正三角形|せいさんかっけい}}」と{{呼|よ}}ぶ。", kana: "さんぺんの ながさが すべて ひとしい さんかっけいを「せいさんかっけい」と よぶ。", zh: "三邊等長的三角形稱為「正三角形」。"}
      - {jp: "犬小屋に『シロ』と書いてあるんです。", kana: "いぬごやに『しろ』と かいて あるんです。", zh: "狗屋上寫著「小白」。"}
      - {jp: "今からここを我々の本拠地とする。", kana: "いまから ここを われわれの ほんきょちと する。", zh: "從現在起把這裡當作我們的根據地。"}
      - {jp: "この漢字（命）は何と読むんですか。『いのち』と読むんです。", kana: "この かんじ（いのち）は なんと よむんですか。『いのち』と よむんです。", zh: "這個漢字（命）怎麼唸呢？唸「いのち」。"}
      - {jp: "伊藤さんは少し遅れて来ると言っていた。", kana: "いとうさんは すこし おくれて くると いって いた。", zh: "伊藤先生說他會晚一點到。"}
      - {jp: "日本語の敬語は外国学習者にとっては難しいと思う。", kana: "にほんごの けいごは がいこくがくしゅうしゃに とっては むずかしいと おもう。", zh: "我覺得日語的敬語對外國學習者來說很難。"}
      - {jp: "先輩にお金を貸してくれないと頼んだ。", kana: "せんぱいに おかねを かして くれないと たのんだ。", zh: "拜託學長借我錢。"}
      - {jp: "遠くから「助けて！」と聞こえたようだ。", kana: "とおくから「たすけて！」と きこえた ようだ。", zh: "好像從遠處傳來「救命！」的聲音。"}
      - {jp: "星野先生に『今日は風邪で学校を休みます』と伝えてください。", kana: "ほしのせんせいに『きょうは かぜで がっこうを やすみます』と つたえて ください。", zh: "請幫我轉告星野老師「今天我因為感冒要請假」。"}

  - point: "文型五　〜という意味です（就是〜的意思）"
    source: 文法
    key: true
    setsuzoku:
      - "N は S ＋【という意味です】（S＝普通形句子／引用的內容）"
      - "問答四連發：「これは何と読むんですか」→「『〜』と読むんです」→「どういう意味ですか」→「『〜』という意味です」"
    explain: |
      【講義】用來**說明一個標誌、詞語、四字熟語「是什麼意思」**。
      「という」的「と」就是文型四的引用「と」，「いう」通常寫平假名。
      這個句型的價值在於：看到不懂的日文（標語、招牌、成語）時，
      可以用日文問「どういう意味ですか」，也可以用日文回答，不必切回中文。
      口語裡「どういうこと？」「何て読むの？」是更隨便的問法（見課本 P81 対話2）。
    examples:
      - {jp: "このマークは、たばこを吸うなという意味です。", kana: "この まーくは、たばこを すうなと いう いみです。", zh: "這個標誌是「不准抽菸」的意思。（基本文）"}
      - {jp: "これは何と読むんですか。", kana: "これは なんと よむんですか。", zh: "這個怎麼唸呢？"}
      - {jp: "『間一髪』と読むんですよ。", kana: "『かんいっぱつ』と よむんですよ。", zh: "唸「かんいっぱつ」喔。"}
      - {jp: "どういう意味ですか。", kana: "どういう いみですか。", zh: "是什麼意思呢？"}
      - {jp: "「髪の毛一本ほどの隙間」という意味です。", kana: "「かみのけ いっぽん ほどの すきま」と いう いみです。", zh: "是「像一根頭髮那麼窄的縫隙」的意思。"}
      - {jp: "ごくわずかな差でものごとの結果がうまくいったり、いかなかったりすることのたとえです。", kana: "ごく わずかな さで ものごとの けっかが うまく いったり、いかなかったり する ことの たとえです。", zh: "比喻只差一點點，事情的結果就成或不成。"}
      - {jp: "間一髪で助かった。", kana: "かんいっぱつで たすかった。", zh: "千鈞一髮之際得救了。"}
      - {jp: "間一髪のところで電車に乗ることができず、会社に遅刻してしまった。", kana: "かんいっぱつの ところで でんしゃに のる ことが できず、かいしゃに ちこくして しまった。", zh: "就差那麼一點沒趕上電車，結果上班遲到了。"}

  - point: "文型五・補充　六個常考的四字熟語・慣用句（講義 P5-P6）"
    source: 文法
    explain: |
      講義用「〜という意味です」一口氣教了六個熟語。它們都**不能照字面拆**，
      所以正好拿來練「這個詞是…的意思」的說明句。表格先記讀音與中文，
      下面的例句就是講義原文的日文說明與例文。
    table:
      caption: "六個熟語（講義 P5-P6）"
      headers: ["熟語", "讀音", "意思"]
      rows:
        - ["{{間一髪|かんいっぱつ}}", "かんいっぱつ", "千鈞一髮。只差一點點"]
        - ["{{十人十色|じゅうにんといろ}}", "じゅうにんといろ", "人各有異、各有所好"]
        - ["{{中途半端|ちゅうとはんぱ}}", "ちゅうとはんぱ", "半吊子、做一半、不上不下"]
        - ["いい{{加減|かげん}}", "いいかげん", "夠了！（＝我慢の限界だ）"]
        - ["{{試行錯誤|しこうさくご}}", "しこうさくご", "反覆嘗試錯誤、不斷摸索"]
        - ["{{無我夢中|むがむちゅう}}", "むがむちゅう", "渾然忘我、全神貫注"]
    examples:
      - {jp: "ものの見方・考え方・好み・価値観・個性などは人によってそれぞれ異なるという意味です。", kana: "ものの みかた・かんがえかた・このみ・かちかん・こせいなどは ひとに よって それぞれ ことなると いう いみです。", zh: "（十人十色）意思是看法、想法、喜好、價值觀、個性等等，每個人各不相同。"}
      - {jp: "「{{物事|ものごと}}の{{完成|かんせい}}まで{{達|たっ}}していない」「{{態度|たいど}}などがどっちつかずの{{状態|じょうたい}}で{{徹底|てってい}}しない{{様子|ようす}}」という{{意味|いみ}}です。", kana: "「ものごとの かんせいまで たっして いない」「たいどなどが どっちつかずの じょうたいで てっていしない ようす」と いう いみです。", zh: "（中途半端）意思是「事情沒做到完成」「態度模稜兩可、不徹底的樣子」。"}
      - {jp: "『いい加減』は『我慢の限界だ』という意味です。", kana: "『いいかげん』は『がまんの げんかいだ』と いう いみです。", zh: "「いい加減」是「忍耐到極限了」的意思。"}
      - {jp: "冗談もいい加減にしろ。", kana: "じょうだんも いいかげんに しろ。", zh: "玩笑也該開夠了吧！（例文，正好用命令形）"}
      - {jp: "ある目的を達成するために、試みと失敗とを繰り返しながら解決方法を追求するという意味です。", kana: "ある もくてきを たっせいする ために、こころみと しっぱいとを くりかえしながら かいけつほうほうを ついきゅうすると いう いみです。", zh: "（試行錯誤）意思是為了達成某個目的，一邊反覆嘗試與失敗，一邊尋求解決方法。"}
      - {jp: "{{新薬|しんやく}}の{{開発|かいはつ}}は{{難航|なんこう}}していますが、{{試行錯誤|しこうさくご}}しながら{{実験|じっけん}}を{{続|つづ}}けています。", kana: "しんやくの かいはつは なんこうして いますが、しこうさくごしながら じっけんを つづけて います。", zh: "新藥的開發雖然困難重重，但仍在反覆摸索中持續實驗。"}
      - {jp: "ある物事に熱中して、自分自身の現在の状況や状態を忘れてしまうくらいにひとつの物事に心を奪われた様子という意味です。", kana: "ある ものごとに ねっちゅうして、じぶんじしんの げんざいの じょうきょうや じょうたいを わすれて しまう くらいに ひとつの ものごとに こころを うばわれた ようすと いう いみです。", zh: "（無我夢中）意思是熱中於某件事，到了忘記自己現在處境與狀態、整顆心被那件事奪走的樣子。"}
      - {jp: "息子は無我夢中でゲームをしているから私の話は耳に入らない。", kana: "むすこは むがむちゅうで げーむを して いるから わたしの はなしは みみに はいらない。", zh: "兒子玩遊戲玩到渾然忘我，我說的話根本聽不進去。"}

  - point: "課本練習（P80：〜という意味です）"
    source: 文法
    explain: |
      課本 P80 的三組練習，全部是「看標誌／看漢字詞 → 用日文說明意思」。
      練習1 看圖直接說；練習2 是**禁止類**告示（〜てはいけません → 〜なという意味です）；
      練習3 是**說明類**告示（照字面解釋用途）。
    practice_note: "練習1＝看標誌（3題）／練習2＝禁止告示（4題）／練習3＝說明告示（4題）"
    practice:
      - {q: "練1例：（禁煙標誌）→", a: "このマークは、たばこを吸うなという意味です。"}
      - {q: "練1(1)（禁止觸摸・手掌標誌）→", a: "このマークは、触るなという意味です。", note: "板書寫「触るな」"}
      - {q: "練1(2)（禁止迴轉標誌）→", a: "このマークは、Uターンするなという意味です。", note: "板書寫到「Uターン」"}
      - {q: "練1(3)（駐輪禁止標誌）→", a: "このマークは、自転車を止めるなという意味です。", note: "課本未填，參考解答"}
      - {q: "練2例：禁煙（たばこを吸ってはいけません）→", a: "これは「きんえん」と読みます。たばこを吸うなという意味です。"}
      - {q: "練2(1) 進入禁止（入ってはいけません）→", a: "これは「しんにゅうきんし」と読みます。入るなという意味です。"}
      - {q: "練2(2) 土足厳禁（靴をはいたまま入ってはいけません）→", a: "これは「どそくげんきん」と読みます。靴をはいたまま入るなという意味です。", note: "板書寫「入るな」"}
      - {q: "練2(3) 火気厳禁（火を使ってはいけません）→", a: "これは「かきげんきん」と読みます。火を使うなという意味です。"}
      - {q: "練2(4) 飲食禁止（ここで食べたり飲んだりしてはいけません）→", a: "これは「いんしょくきんし」と読みます。ここで食べたり飲んだりするなという意味です。", note: "板書寫「飲んだりするなという意味です」"}
      - {q: "練3例：出入口（ここから出たり入ったりします）→", a: "これは「でいりぐち」と読みます。ここから出たり入ったりするという意味です。"}
      - {q: "練3(1) 非常口（緊急の時に使う出口です）→", a: "これは「ひじょうぐち」と読みます。緊急の時に使う出口だという意味です。"}
      - {q: "練3(2) 優先席（お年寄りや体の不自由な人が座る席です）→", a: "これは「ゆうせんせき」と読みます。お年寄りや体の不自由な人が座る席だという意味です。"}
      - {q: "練3(3) 入場無料（お金を払わなくても入ることができます）→", a: "これは「にゅうじょうむりょう」と読みます。お金を払わなくても入ることができるという意味です。"}
      - {q: "練3(4) 使用不可（使うことができません）→", a: "これは「しようふか」と読みます。使うことができないという意味です。"}

  - point: "対話（課本 P81：這個怎麼唸？什麼意思？）"
    source: 文法
    key: true
    explain: |
      兩段対話示範同一件事的**丁寧體**與**普通體**問法，實用度很高：
      ・丁寧：「これは何と書いてあるんですか」「どういう意味ですか」
      ・普通：「これ、何て読むの？」「どういうこと？」
      注意「〜と書いてあります」＝上面寫著…（狀態），也是文型四的引用「と」。
    examples:
      - {jp: "すみません。これは何と書いてあるんですか。", kana: "すみません。これは なんと かいて あるんですか。", zh: "不好意思，這上面寫什麼？"}
      - {jp: "「頭上注意」と書いてあります。", kana: "「ずじょうちゅうい」と かいて あります。", zh: "寫著「頭上注意」。"}
      - {jp: "どういう意味ですか。", kana: "どういう いみですか。", zh: "是什麼意思？"}
      - {jp: "「頭の上に注意してください」という意味です。", kana: "「あたまの うえに ちゅういして ください」と いう いみです。", zh: "是「請小心頭上」的意思。"}
      - {jp: "社員専用 － 社員以外は使うことができません", kana: "しゃいんせんよう － しゃいんいがいは つかう ことが できません", zh: "員工專用－員工以外不能使用。（入れ替え）"}
      - {jp: "故障 － 今こわれていますから、使うことができません", kana: "こしょう － いま こわれて いますから、つかう ことが できません", zh: "故障－現在壞了，不能使用。（入れ替え）"}
      - {jp: "これ、何て読むの？", kana: "これ、なんて よむの？", zh: "這個怎麼唸啊？（普通體）"}
      - {jp: "「短気」と読むんだよ。", kana: "「たんき」と よむんだよ。", zh: "唸「たんき」啦。"}
      - {jp: "どういうこと？", kana: "どういう こと？", zh: "什麼意思？（普通體）"}
      - {jp: "「すぐ怒る人のこと」だよ。まあ、君のことだな。", kana: "「すぐ おこる ひとの こと」だよ。まあ、きみの ことだな。", zh: "就是「馬上就生氣的人」啦。嘛，就是在說你。"}
      - {jp: "優柔不断 － 何でもすぐに決められないこと", kana: "ゆうじゅうふだん － なんでも すぐに きめられない こと", zh: "優柔寡斷－什麼都沒辦法馬上決定。（入れ替え）"}

  - point: "やってみよう（課本 P81：いろいろなマーク）"
    source: 文法
    explain: |
      看三個標誌，用「このマークは、〜なという意味です。」寫出來。
      ※ 課本上空白未填，以下是參考解答（跟老師的標誌練習單同一套邏輯）。
    practice:
      - {q: "例；（禁煙標誌）", a: "このマークは、たばこを吸うなという意味です。"}
      - {q: "(1)（相機打叉）", a: "このマークは、写真を撮るなという意味です。"}
      - {q: "(2)（紙屑・菸蒂・空罐打叉）", a: "このマークは、ごみを捨てるなという意味です。"}
      - {q: "(3)（手機打叉）", a: "このマークは、携帯を使うなという意味です。"}

  - point: "会話（課本 P84：球場で野球を応援する）"
    source: 文法
    key: true
    explain: |
      本課的長對話：スタット帶ワン第一次到球場看棒球。看點有三個——
      ① 加油口號整串都是**命令形**（かっ飛ばせ！打て！入ってくれ！）；
      ② ワン用「どういう意味ですか」問，スタット用「〜という意味だよ」答，正好是文型五；
      ③ 最後「一生懸命応援しよう」是意向形（第21課）。
      「かっ飛ばせ」＝「かっ飛ばす」的命令形，「かっ」是加強語氣的接頭詞，
      是日本球場最經典的應援句。
    examples:
      - {jp: "ワンさんは野球を見たことがある？", kana: "わんさんは やきゅうを みた ことが ある？", zh: "小王你看過棒球嗎？"}
      - {jp: "テレビで見たことはありますが、球場で見るのは初めてです。", kana: "てれびで みた ことは ありますが、きゅうじょうで みるのは はじめてです。", zh: "在電視上看過，但在球場看是第一次。"}
      - {jp: "球場とテレビは全然違うよ。", kana: "きゅうじょうと てれびは ぜんぜん ちがうよ。", zh: "球場跟電視完全不一樣喔。"}
      - {jp: "ええ、すごいですね。みんな、歌を歌ったり、何か叫んでいますね。", kana: "ええ、すごいですね。みんな、うたを うたったり、なにか さけんで いますね。", zh: "嗯，好厲害。大家又唱歌又在喊些什麼呢。"}
      - {jp: "応援しているんだよ。歌は、選手を応援する歌で、ひとりひとり違うんだよ。", kana: "おうえんして いるんだよ。うたは、せんしゅを おうえんする うたで、ひとりひとり ちがうんだよ。", zh: "他們在加油啦。那些歌是幫選手加油的歌，每個選手都不一樣喔。"}
      - {jp: "「かっ飛ばせー！」", kana: "「かっとばせー！」", zh: "「用力打出去──！」"}
      - {jp: "「かっ飛ばせ」？　どういう意味ですか。", kana: "「かっとばせ」？　どういう いみですか。", zh: "「かっ飛ばせ」？是什麼意思？"}
      - {jp: "強く、大きく打て！　ホームランを打て！　という意味だよ。", kana: "つよく、おおきく うて！　ほーむらんを うて！　と いう いみだよ。", zh: "就是「用力打、打遠一點！打全壘打！」的意思。"}
      - {jp: "ほら、ワンさんも一緒に！", kana: "ほら、わんさんも いっしょに！", zh: "來，小王你也一起喊！"}
      - {jp: "はい。かっ飛ばせー！", kana: "はい。かっとばせー！", zh: "好。用力打出去──！"}
      - {jp: "おおっ！　大きい！　入ってくれ！", kana: "おおっ！　おおきい！　はいって くれ！", zh: "喔喔！好大一支！進去啊！"}
      - {jp: "やったー！　入った！　ホームランだ！", kana: "やったー！　はいった！　ほーむらんだ！", zh: "太好了！進了！是全壘打！"}
      - {jp: "おもしろいね。", kana: "おもしろいね。", zh: "很有趣吧。"}
      - {jp: "ええ。でも、野球を見るより応援するほうが忙しいですね。", kana: "ええ。でも、やきゅうを みるより おうえんする ほうが いそがしいですね。", zh: "嗯。不過比起看棒球，加油還比較忙呢。"}
      - {jp: "球場で見ると、応援が楽しいんだよ。", kana: "きゅうじょうで みると、おうえんが たのしいんだよ。", zh: "在球場看的話，加油才是最好玩的喔。"}
      - {jp: "そうですね。じゃあ、一生懸命応援しよう。", kana: "そうですね。じゃあ、いっしょうけんめい おうえんしよう。", zh: "說得也是。那我要拚命加油了。"}

  - point: "句型整理（課本 P85）"
    source: 文法
    explain: |
      課本 P85 把本課四個句型收在一頁。四個都跟「叫別人做／不要做某事」有關，
      差別只在**語氣強度**與**是誰在說**：命令形最強、禁止形最兇、なさい是長輩對晚輩、
      という意味です則是把前面那些「引用起來說明給別人聽」。
    table:
      caption: "課本 P85 四個句型"
      headers: ["句型", "形式", "例"]
      rows:
        - ["① 命令", "イ形(く)＋V[命令形]", "{{早|はや}}く{{行|い}}[け]！"]
        - ["② 禁止", "N に V(基本形)＋[な]", "あの{{部屋|へや}}に{{入|はい}}る[な]！"]
        - ["③ 說明意思", "N は S ＋[という意味です]", "このマークはたばこを{{吸|す}}うな[という意味です]"]
        - ["④ 緩和命令", "S から V(ます形)＋[なさい]", "もう{{遅|おそ}}いから{{早|はや}}く{{寝|ね}}[なさい]"]
    examples:
      - {jp: "早く行け！", kana: "はやく いけ！", zh: "快去！"}
      - {jp: "あの部屋に入るな！", kana: "あの へやに はいるな！", zh: "不准進那個房間！"}
      - {jp: "このマークはたばこを吸うなという意味です。", kana: "この まーくは たばこを すうなと いう いみです。", zh: "這個標誌是禁止吸菸的意思。"}
      - {jp: "もう遅いから早く寝なさい。", kana: "もう おそいから はやく ねなさい。", zh: "已經很晚了，快點睡覺。"}


