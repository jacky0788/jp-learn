  - point: "対話（課本 P79：朋友之間的命令・禁止）"
    source: 文法
    explain: |
      課本 P79 的対話，示範命令形／禁止形在熟人之間的口語用法
      （句尾常加「よ」「ぞ」緩和或強調；「〜てくれ」＝てください的隨便說法）。
    examples:
      - {jp: "もしもし、田中？　もう、10時だよ。", kana: "もしもし、たなか？　もう、じゅうじだよ。", zh: "喂，田中？已經10點了喔。"}
      - {jp: "え？　あっ、寝坊した。", kana: "え？　あっ、ねぼうした。", zh: "咦？啊，睡過頭了。"}
      - {jp: "早くこいよ。宿題のレポート、忘れるなよ。先に行くぞ。", kana: "はやく こいよ。しゅくだいの れぽーと、わすれるなよ。さきに いくぞ。", zh: "快點來啦。作業報告別忘了喔。我先走囉。"}
      - {jp: "ちょっと待ってくれよ。", kana: "ちょっと まってくれよ。", zh: "等我一下啦。"}
      - {jp: "あと{{30|さんじゅっ}}{{分|ぷん}}、そこにいてくれよ。", kana: "あと さんじゅっぷん、そこに いてくれよ。", zh: "再30分鐘，你就待在那裡等我。（入れ替え）"}

  - point: "文型三　V2（ます形）＋なさい（緩和的命令）"
    source: 文法
    key: true
    setsuzoku:
      - "V（ます形去掉ます＝V2）＋【なさい】"
      - "I類：書きます→書き【なさい】／II類：食べます→食べ【なさい】"
      - "III類：します→し【なさい】／来ます→来【なさい】"
    explain: |
      【講義】説明：「なさい」是「する」的敬語（特殊形）「する→なさる→なさいませ」變來的。
      雖然名義上是敬語，但實際上大多用於**老師對學生、父母對孩子、上司對下屬**等輕微命令句。
      比起 V 命令形要來得**委婉、客氣**。
      ⚠️ 接續是**ます形**，不是基本形：○ 早く寝なさい／× 早く寝るなさい。
      ⚠️ 反過來說，「なさい」只能由上對下，**不能對長輩或上司用**（對上司說「早く帰りなさい」很失禮）。
      「なさい」沒有否定形，要禁止就回頭用「〜ないでください」或強烈禁止的「〜な」。
    table:
      caption: "同一件事、四種語氣強度"
      headers: ["說法", "例", "語氣・對象"]
      rows:
        - ["V 命令形", "{{早|はや}}く{{寝|ね}}[ろ]！", "最強烈。男性之間、緊急、標語、教練對選手"]
        - ["V2＋なさい", "{{早|はや}}く{{寝|ね}}[なさい]", "緩和的命令。父母對小孩、老師對學生"]
        - ["V てください", "{{早|はや}}く{{寝|ね}}[てください]", "客氣的請求。一般場合都能用"]
        - ["V ないでください", "{{騒|さわ}}が[ないでください]", "客氣的禁止（對應強烈禁止的〜な）"]
    examples:
      - {jp: "授業中、日本語で話しなさい。", kana: "じゅぎょうちゅう、にほんごで はなしなさい。", zh: "上課中請說日文。"}
      - {jp: "あそこの待合室で待ちなさい。", kana: "あそこの まちあいしつで まちなさい。", zh: "在那邊的候車室等。"}
      - {jp: "窓を閉めなさい。", kana: "まどを しめなさい。", zh: "把窗戶關上。"}
      - {jp: "はっきり言いなさい。", kana: "はっきり いいなさい。", zh: "說清楚一點。"}
      - {jp: "このアプリをダウンロードしなさい。", kana: "この あぷりを だうんろーどしなさい。", zh: "去下載這個App。"}
      - {jp: "答えを線に書きなさい。", kana: "こたえを せんに かきなさい。", zh: "把答案寫在線上。"}
      - {jp: "タクシーを呼びなさい。", kana: "たくしーを よびなさい。", zh: "去叫計程車。"}
      - {jp: "もう遅いから早く寝なさい。", kana: "もう おそいから はやく ねなさい。", zh: "已經很晚了，快點睡。（課本基本文）"}
    practice_note: "講義 P3 的例題表（13題）。標「講義未填」的是課堂上沒寫到的格子，依接續規則補上"
    practice:
      - {q: "授業中、日本語で話す →（なさい）", a: "話しなさい"}
      - {q: "あそこの待合室で待つ →（なさい）", a: "待ちなさい"}
      - {q: "お客さんに謝る →（なさい）", a: "謝りなさい", note: "講義未填"}
      - {q: "手や顔を洗う →（なさい）", a: "洗いなさい", note: "講義未填"}
      - {q: "ポスターを壁に貼る →（なさい）", a: "貼りなさい", note: "講義未填"}
      - {q: "詳しい事情を調べる →（なさい）", a: "調べなさい", note: "講義未填"}
      - {q: "二段目の一行目を読む →（なさい）", a: "読みなさい", note: "講義未填"}
      - {q: "窓を閉める →（なさい）", a: "閉めなさい"}
      - {q: "はっきり言う →（なさい）", a: "言いなさい"}
      - {q: "すぐに起きる →（なさい）", a: "起きなさい", note: "講義未填"}
