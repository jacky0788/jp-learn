  - point: "対話（課本 P79：朋友之間的命令・禁止）"
    source: 文法
    explain: |
      課本 P79 的対話，示範命令形／禁止形在熟人之間的口語用法
      （句尾常加「よ」「ぞ」緩和或強調；「〜てくれ」＝てください的隨便說法）。
    examples:
      - {jp: "もしもし、田中？　もう、10時だよ。", kana: "もしもし、たなか？　もう、じゅうじだよ。", zh: "喂，田中？已經10點了喔。"}
      - {jp: "え？　あっ、寝坊した。", kana: "え？　あっ、ねぼうした。", zh: "咦？啊，睡過頭了。"}
      - {jp: "早くこいよ。宿題のレポート、忘れるなよ。先に行くぞ。", kana: "はやく こいよ。しゅくだいの れぽーと、わすれるなよ。さきに いくぞ。", zh: "快點來啦。作業報告別忘了喔。我先走囉。"}
      - {jp: "ちょっと待ってくれよ。", kana: "ちょっと まってくれよ。", zh: "等我一下啦。"}
      - {jp: "あと{{30|さんじゅっ}}{{分|ぷん}}、そこにいてくれよ。", kana: "あと さんじゅっぷん、そこに いてくれよ。", zh: "再30分鐘，你就待在那裡等我。（入れ替え）"}

  - point: "（預告）〜という意味です／〜なさい（課本 P85 句型）"
    source: 文法
    setsuzoku:
      - "N は S ＋【という意味です】（…是…的意思）"
      - "S から V（ます形）＋【なさい】（較緩和的命令）"
    explain: |
      ⚠️ 這兩個句型出現在課本 P85 的句型整理與標題頁基本文，**本週尚未上到**，先收進來預習；
      之後上課再補完整例句與練習。
      ・〜という意味です：說明某個標誌、詞語「是…的意思」。
      ・〜なさい：接ます形，語氣比命令形柔和，多用於父母對小孩、老師對學生。
    table:
      caption: "課本 P85 四個句型"
      headers: ["句型", "形式", "例"]
      rows:
        - ["① 命令", "イ形(く)＋V[命令形]", "{{早|はや}}く{{行|い}}[け]！"]
        - ["② 禁止", "N に V(基本形)＋[な]", "あの{{部屋|へや}}に{{入|はい}}る[な]！"]
        - ["③ 說明意思", "N は S ＋[という意味です]", "このマークはたばこを{{吸|す}}うな[という意味です]"]
        - ["④ 緩和命令", "S から V(ます形)＋[なさい]", "もう{{遅|おそ}}いから{{早|はや}}く{{寝|ね}}[なさい]"]
    examples:
      - {jp: "このマークはたばこを吸うなという意味です。", kana: "この まーくは たばこを すうなと いう いみです。", zh: "這個標誌是禁止吸菸的意思。"}
      - {jp: "もう遅いから早く寝なさい。", kana: "もう おそいから はやく ねなさい。", zh: "已經很晚了，快點睡覺。"}

