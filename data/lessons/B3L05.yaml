      - {q: "練3例2：遅刻しないでください。→", a: "遅刻するな。"}
      - {q: "練3(1) 早く起きてください。→", a: "早く起きろ。"}
      - {q: "練3(2) ここから出てください。→", a: "ここから出ろ。"}
