book: 3
lesson: 5
title: 第三冊 第5課（第25課）　早く 行け！
# 來源：來學日本語 基礎進階1 第25課（課本 pp.77-85）＋文法課講義 pp.1-2
#   照片：raw/B3L05/（2026-08-02 匯入，本週上到命令形・禁止形）
# ⚠️ 進度：本週先上「文型一 命令形」與「文型二 強烈禁止（〜な）」。
#   課本句型頁另有「〜という意味です」「〜なさい」，已先收進來（尚未上到，之後補充）。

intro: |
  這一課學「命令」與「禁止」——語氣最強烈的兩種說法。課本標題頁的基本文預告了整課：
  ・早く行け！（命令形：快去！）
  ・あの部屋に入るな！（禁止形：不准進那個房間！）
  ・このマークはたばこを吸うなという意味です。（〜という意味です：…的意思）
  ・もう遅いから早く寝なさい。（〜なさい：較緩和的命令）

  ⚠️ 命令形與禁止形語氣**非常強烈**，日常會話幾乎不對長輩、上司、不熟的人使用。
  常見場合：男性之間、父母對小孩、教練對選手、運動加油、標語告示（禁煙・進入禁止）、
  緊急狀況（早く逃げろ！），以及引用規則時（〜なと書いてあります）。
  想客氣一點就用「〜てください」；「〜なさい」比命令形柔和，多為父母／老師對小孩使用。

goals:
  - "做出動詞的命令形（I類語尾改え段／II類＋ろ／する→しろ・来る→来い）"
  - "做出禁止形：V（基本形）＋な"
  - "看懂告示標語（禁煙・進入禁止・土足厳禁・使用不可）"
  - "知道命令形／禁止形的語氣強度與使用場合，該客氣時改用〜てください"
  - "（預告）用「〜という意味です」說明標誌或詞語的意思；用「〜なさい」下較緩和的命令"

grammar:
  - point: "文型一　V命令形（快去做！）"
    source: 文法
    key: true
    setsuzoku:
      - "① 五段活用動詞（I類）⇒ 語幹＋原語尾之【え段音】（書く→書け）"
      - "② 上一段・下一段動詞（II類）⇒ 語幹＋【ろ】（食べる→食べろ）"
      - "③ 来る ⇒ 【来い】"
      - "④ する／〜する ⇒ 【しろ】／〜【しろ】"
    explain: |
      【講義】V6 是命令形，用來強烈地命令對方「快做…！」。
      變化規則：I類把ます形前的假名改成同行的「え段音」；II類把る改成ろ；
      III類 する→しろ、来る→来い（注意「来い」讀 こい）。
      ＊語氣很強，對長輩或不熟的人不可使用；要客氣請用「〜てください」。
    table:
      caption: "命令形・禁止形 活用總表（課本 P79「活用の作り方」）"
      headers: ["類別", "ます形", "命令形", "禁止形（＋な）"]
      rows:
        - ["I類（五段）", "{{買|か}}います", "{{買|か}}[え]", "{{買|か}}う[な]"]
        - ["I類", "{{書|か}}きます", "{{書|か}}[け]", "{{書|か}}く[な]"]
        - ["I類", "{{泳|およ}}ぎます", "{{泳|およ}}[げ]", "{{泳|およ}}ぐ[な]"]
        - ["I類", "{{話|はな}}します", "{{話|はな}}[せ]", "{{話|はな}}す[な]"]
        - ["I類", "{{待|ま}}ちます", "{{待|ま}}[て]", "{{待|ま}}つ[な]"]
        - ["I類", "{{死|し}}にます", "{{死|し}}[ね]", "{{死|し}}ぬ[な]"]
        - ["I類", "{{遊|あそ}}びます", "{{遊|あそ}}[べ]", "{{遊|あそ}}ぶ[な]"]
        - ["I類", "{{読|よ}}みます", "{{読|よ}}[め]", "{{読|よ}}む[な]"]
        - ["I類", "{{帰|かえ}}ります", "{{帰|かえ}}[れ]", "{{帰|かえ}}る[な]"]
        - ["II類（一段）", "{{寝|ね}}ます／{{食|た}}べます", "寝[ろ]／食べ[ろ]", "寝る[な]／食べる[な]"]
        - ["III類", "します", "[しろ]", "する[な]"]
        - ["III類", "{{来|き}}ます", "[こい]", "{{来|く}}る[な]"]
    examples:
      - {jp: "早く行け！", kana: "はやく いけ！", zh: "快去！（課本基本文）"}
      - {jp: "早く起きろよ。", kana: "はやく おきろよ。", zh: "快點起床啦。（対話・入れ替え）"}
      - {jp: "宿題を出せ！", kana: "しゅくだいを だせ！", zh: "把作業交出來！"}
      - {jp: "自分でやれ！", kana: "じぶんで やれ！", zh: "自己做！"}
      - {jp: "ここで待て！", kana: "ここで まて！", zh: "在這裡等！"}
      - {jp: "前に来い！", kana: "まえに こい！", zh: "到前面來！（来る→こい）"}
      - {jp: "出発しろ！", kana: "しゅっぱつしろ！", zh: "出發！（する→しろ）"}
    practice_note: "講義 P1 練習表（基本形→命令形，共20題，含已填答案）"
    practice:
      - {q: "全部食べる →（命令形）", a: "全部食べろ", note: "II類→ろ"}
      - {q: "出発する →（命令形）", a: "出発しろ！", note: "III類 する→しろ"}
      - {q: "ここにいる →（命令形）", a: "ここにいろ！", note: "II類→ろ"}
      - {q: "一人で遊ぶ →（命令形）", a: "一人で遊べ！", note: "I類 ぶ→べ"}
      - {q: "部屋に入る →（命令形）", a: "部屋に入れ！", note: "I類 る→れ"}
      - {q: "出ていく →（命令形）", a: "出ていけ！", note: "I類 く→け"}
      - {q: "自分でやる →（命令形）", a: "自分でやれ！"}
      - {q: "薬を飲む →（命令形）", a: "薬を飲め！", note: "I類 む→め"}
      - {q: "こっちを見る →（命令形）", a: "こっちを見ろ！", note: "II類→ろ"}
      - {q: "自立する →（命令形）", a: "自立しろ！"}
      - {q: "早く起きる →（命令形）", a: "早く起きろ！"}
      - {q: "前に来る →（命令形）", a: "前に来い！", note: "来る→こい"}
      - {q: "すぐ払う →（命令形）", a: "すぐ払え！", note: "I類 う→え"}
      - {q: "教室を出る →（命令形）", a: "教室を出ろ！"}
      - {q: "ここで待つ →（命令形）", a: "ここで待て！", note: "I類 つ→て"}
      - {q: "右を曲がる →（命令形）", a: "右へ曲がれ！", note: "講義答案用「へ」"}
      - {q: "死ぬ →（命令形）", a: "死ね！", note: "I類 ぬ→ね"}
      - {q: "電気をつける →（命令形）", a: "電気をつけろ！"}
      - {q: "速く走る →（命令形）", a: "速く走れ！"}
      - {q: "宿題を出す →（命令形）", a: "宿題を出せ！", note: "I類 す→せ"}

  - point: "文型二　強烈禁止：V（基本形）＋な（不准…！）"
    source: 文法
    key: true
    setsuzoku:
      - "V3（終止形＝基本形）＋ 【な】（行く→行くな／食べる→食べるな／する→するな／来る→来るな）"
    explain: |
      【講義】說明：V3（終止形）＋な，表示強烈禁止「不准…！、別…！」。
      ⚠️ 注意接續是**基本形**（辭書形）直接加「な」，不是ます形。
      常見於告示標語：「立入禁止」「たばこを吸うな」，或緊急、生氣時的口語。
      要客氣請改用「〜ないでください」。
    table:
      caption: "禁止形（〜な）接續"
      headers: ["類別", "基本形", "禁止形"]
      rows:
        - ["I類", "{{行|い}}く", "{{行|い}}く[な]！"]
        - ["II類", "{{食|た}}べる", "{{食|た}}べる[な]！"]
        - ["III類", "する", "する[な]！"]
        - ["III類", "{{来|く}}る", "{{来|く}}る[な]！"]
    examples:
      - {jp: "あの部屋に入るな！", kana: "あの へやに はいるな！", zh: "不准進那個房間！（課本基本文）"}
      - {jp: "池で泳ぐな！", kana: "いけで およぐな！", zh: "不准在池子裡游泳！"}
      - {jp: "嘘をつくな！", kana: "うそを つくな！", zh: "不要說謊！"}
      - {jp: "廊下を走るな！", kana: "ろうかを はしるな！", zh: "不准在走廊上跑！"}
      - {jp: "宿題のレポート、忘れるなよ。", kana: "しゅくだいの れぽーと、わすれるなよ。", zh: "作業報告別忘了喔。（対話）"}
    practice_note: "講義 P2 練習（改成強烈禁止，共14題，含已填答案）"
    practice:
      - {q: "一人で行きます →（禁止）", a: "一人で行くな！"}
      - {q: "誰にも言います →（禁止）", a: "誰にも言うな！"}
      - {q: "この部屋に入ります →（禁止）", a: "この部屋に入るな！"}
      - {q: "ここにごみを捨てます →（禁止）", a: "ここにごみを捨てるな！"}
      - {q: "飲んだら乗ります →（禁止）", a: "飲んだら乗るな！", note: "喝了酒就別開車"}
      - {q: "スマホを見すぎます →（禁止）", a: "スマホを見過ぎるな！"}
      - {q: "隣の人とおしゃべりします →（禁止）", a: "隣の人とおしゃべりするな！"}
      - {q: "廊下を走ります →（禁止）", a: "廊下を走るな！"}
      - {q: "うわさをたてます →（禁止）", a: "噂を立てるな！"}
      - {q: "嘘をつきます →（禁止）", a: "嘘をつくな！"}
      - {q: "道で遊びます →（禁止）", a: "道で遊ぶな！"}
      - {q: "窓から手や顔を出します →（禁止）", a: "窓から手や顔を出すな！"}
      - {q: "本人に聞かないで物を取ります →（禁止）", a: "本人に聞かないで物を取るな！"}
      - {q: "教室で騒ぎます →（禁止）", a: "教室で騒ぐな！"}

  - point: "課本練習（P78：命令形・禁止形）"
    source: 文法
    explain: |
      課本 pp.78 的三組練習。練習1 一個動詞同時做出命令形與禁止形；
      練習2 看圖說命令／禁止；練習3 把「〜てください／〜ないでください」改成命令形／禁止形。
    practice_note: "練習1（命令形→禁止形）／練習2（看圖）／練習3（改成命令・禁止）"
    practice:
      - {q: "練1例：書きます →（命令形）→（禁止形）", a: "書け → 書くな"}
      - {q: "練1(1) 買います →", a: "買え → 買うな"}
      - {q: "練1(2) 歩きます →", a: "歩け → 歩くな"}
      - {q: "練1(3) 貸します →", a: "貸せ → 貸すな"}
      - {q: "練1(4) 待ちます →", a: "待て → 待つな"}
      - {q: "練1(5) 呼びます →", a: "呼べ → 呼ぶな"}
      - {q: "練1(6) 飲みます →", a: "飲め → 飲むな"}
      - {q: "練1(7) 帰ります →", a: "帰れ → 帰るな"}
      - {q: "練1(8) 食べます →", a: "食べろ → 食べるな"}
      - {q: "練1(9) 出ます →", a: "出ろ → 出るな"}
      - {q: "練1(10) 寝ます →", a: "寝ろ → 寝るな"}
      - {q: "練1(11) します →", a: "しろ → するな"}
      - {q: "練1(12) 来ます →", a: "こい → 来るな"}
      - {q: "練2(1)（看圖・命令）椅子に＿＿！", a: "座れ"}
      - {q: "練2(2)（看圖・命令）椅子から＿＿！", a: "立て"}
      - {q: "練2(3)（看圖・命令）金を＿＿！", a: "返せ"}
      - {q: "練2(4)（看圖・禁止）魚を＿＿！", a: "釣るな"}
      - {q: "練2(5)（看圖・禁止）写真を＿＿！", a: "撮るな"}
      - {q: "練2(6)（看圖・禁止）タバコを＿＿！", a: "吸うな"}
      - {q: "練3例1：もう寝てください。→", a: "もう寝ろ。"}
