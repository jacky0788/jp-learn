notes:
  - "✅ 第25課已上完：文型一 命令形／文型二 強烈禁止／文型三 なさい／文型四 格助詞と／文型五 という意味です。"
  - "三種「叫人做事」的接續各不相同，最容易混：命令形改語尾（行け）／禁止形接**基本形**（行くな）／なさい接**ます形**（行きなさい）。"
  - "「〜なさい」只能上對下，**不能對長輩、上司用**；也沒有否定形，要禁止就用〜ないでください或〜な。"
  - "「来る」三形讀音全都不一樣：命令形こい／禁止形くるな／なさい形きなさい。"
  - "「止まれ」（I類・自動詞）跟「止めるな」（II類・他動詞）是不同動詞，看標誌時特別容易寫錯。"
  - "文型四的「と」是文型五的地基：〜と読みます／〜と書いてあります／〜と言っていました／〜という意味です 全是同一個引用「と」。"
  - "命令形口訣：I類→え段音（書け）／II類→ろ（食べろ）／する→しろ／来る→こい。"
  - "禁止形口訣：**基本形**＋な（×食べますな ○食べるな）。"
  - "⚠️ 語氣很強，對長輩／上司／不熟的人不可用。客氣說法：命令→〜てください；禁止→〜ないでください；緩和命令→〜なさい。"
  - "告示標語是本課單字重點（禁煙・進入禁止・土足厳禁・使用不可・非常口・優先席）。"
