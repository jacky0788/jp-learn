exercises:
  - {type: translate, q: "我是王，請多指教。", a: "わたしは ワンです。どうぞよろしく。"}
  - {type: translate, q: "金小姐也是學生。", a: "キムさんも 学生です。"}
  - {type: fill, q: "わたしは 会社員＿＿ありません。（填否定）", a: "では", explain: "N1は N2ではありません。"}
  - {type: fill, q: "これは カメラ＿＿ 本です。（填所屬助詞）", a: "の", explain: "の 表所屬：相機的書。"}
  - {type: translate, q: "那（遠）是什麼呢？", a: "あれは なんですか。"}
  - {type: translate, q: "這是我的錶。", a: "これは わたしの 時計です。"}
  - {type: choice, q: "靠近對方的東西用哪個？　①これ ②それ ③あれ", a: "②それ", explain: "それ＝中稱，靠近對方。"}

notes:
  - "「は」當助詞時讀 wa，不讀 ha。"
  - "これ／それ／あれ 是代名詞（單獨用）；この／その／あの 是連體詞（後面一定接名詞）。"
  - "近・中・遠：これ＝靠近自己｜それ＝靠近對方｜あれ＝離雙方都遠。"
  - "疑問詞：なん（什麼）、だれ／どなた（誰）、どれ（哪一個，三者以上）。"
  - "「の」可代替重複的名詞：それは わたしのです＝那是我的（東西）。"
