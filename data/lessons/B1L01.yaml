book: 1
lesson: 1
title: 第一冊 第1課　わたしは　ワンです
# 來源：來學日本語（第一冊）pp.15-29　照片 raw/B1L01/
# 主題：自我介紹（は／も／ではありません／か）、これ／それ／あれ（指示代名詞）、の（所屬）

intro: |
  這是日語的第一課，學的是最基礎、之後每一句話都會用到的「句子骨架」。

  日語句子的基本結構是：「主題　＋　は　＋　內容　＋　です」。
  例如「わたしは　学生です」＝「我（主題）＋ 是 ＋ 學生」。這裡的 です 就是禮貌的「是」，
  而助詞 は 用來標出「在講的對象」，特別注意：は 當助詞時要唸成 wa，不是 ha。

  學會這個骨架後，這一課再教三個變化：用 か 變成問句、用 ではありません 變成否定、
  用 も 表示「也」。後半進入「指東西」：これ／それ／あれ（這個／那個／那個）依「離誰比較近」來區分，
  最後用 の（的）把兩個名詞連起來，例如「わたしの　本」＝「我的書」。

  這一課文法不難，重點是把「は…です」唸熟、把 これ/それ/あれ 的距離感建立起來，這是後面所有課的基礎。

goals:
  - "用「～は～です」自我介紹、介紹別人（我是…、他是…）"
  - "用「か」問問題、用「～ではありません」否定"
  - "用「も」表達「也是…」"
  - "分辨並使用 これ／それ／あれ、この／その／あの"
  - "用「の」表達所屬關係（…的…），並用「の」代替重複的名詞"

grammar:
  # ── ～は …です（自我介紹） ──
  - point: "句型1　N1は N2です（N1是N2）"
    explain: "「は」是助詞，表主題（讀作 wa）。"
    examples:
      - jp: "わたしは ワンです。"
        kana: "わたしは わんです。"
        zh: "我是王。"

  - point: "句型2　N1は N2ではありません（N1不是N2）"
    explain: "否定句。口語也可說「じゃありません」。"
    examples:
      - jp: "わたしは 会社員ではありません。"
        kana: "わたしは かいしゃいんではありません。"
        zh: "我不是公司職員。"

  - point: "句型3　N1は N2ですか（N1是N2嗎？）"
    explain: "句尾加「か」表疑問。"
    examples:
      - jp: "あなたは キムさんですか。"
        kana: "あなたは きむさんですか。"
        zh: "你是金小姐嗎？"

  - point: "句型4　N1も N2です（N1也是N2）"
    explain: "「も」表「也」，取代「は」。"
    examples:
      - jp: "キムさんも 学生です。"
        kana: "きむさんも がくせいです。"
        zh: "金小姐也是學生。"

  - point: "句型5　N1は だれですか（N1是誰？）"
    explain: "「だれ」＝誰；禮貌說法用「どなた」。"
    examples:
      - jp: "あの方は だれですか。"
        kana: "あのかたは だれですか。"
        zh: "那一位是誰呢？"

  # ── これ／それ／あれは ～です（指示代名詞） ──
  - point: "これ／それ／あれは Nです（這／那是N）"
    explain: "これ＝近稱（靠近自己）；それ＝中稱（靠近對方）；あれ＝遠稱（離雙方都遠）。"
    table:
      caption: "こそあど系列：紅色開頭 こ／そ／あ／ど 是規律"
      headers: ["", "事物", "連體（＋名詞）", "場所", "方向／禮貌"]
      rows:
        - ["近稱（靠自己）", "[こ]れ", "[こ]の", "[こ]こ", "[こ]ちら"]
        - ["中稱（靠對方）", "[そ]れ", "[そ]の", "[そ]こ", "[そ]ちら"]
        - ["遠稱（都遠）", "[あ]れ", "[あ]の", "[あ]そこ", "[あ]ちら"]
        - ["疑問（哪個）", "[ど]れ", "[ど]の", "[ど]こ", "[ど]ちら"]
    examples:
      - jp: "これは えんぴつです。"
        kana: "これは えんぴつです。"
        zh: "這是鉛筆。"
      - jp: "それは いすです。"
        kana: "それは いすです。"
        zh: "那是椅子。"
      - jp: "あれは まどです。"
        kana: "あれは まどです。"
        zh: "那（遠處）是窗戶。"

  - point: "これは なんですか（這是什麼？）"
    explain: "「なん」＝什麼，問事物。"
    examples:
      - jp: "これは なんですか。"
        kana: "これは なんですか。"
        zh: "這是什麼呢？"

  - point: "N1の N2（の表所屬）"
    explain: "「の」連接兩個名詞，表所屬／所有／性質。N1のN2＝N1的N2。"
    examples:
      - jp: "これは カメラの 本です。"
        kana: "これは かめらの ほんです。"
        zh: "這是一本相機的書。"
      - jp: "これは わたしの 時計です。"
        kana: "これは わたしの とけいです。"
        zh: "這是我的錶。"

  - point: "省略N2：N1のです（…的）"
    explain: "用「の」代替後面的名詞，避免重複。"
    examples:
      - jp: "それは わたしのです。"
        kana: "それは わたしのです。"
        zh: "那是我的。"

  - point: "N1の N2は どれですか（…是哪一個？）"
    explain: "「どれ」＝哪一個（三者以上中選一）。"
    examples:
      - jp: "ワンさんの ぼうしは どれですか。"
        kana: "わんさんの ぼうしは どれですか。"
        zh: "王先生的帽子是哪一頂呢？"

