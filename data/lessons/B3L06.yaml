notes:
  - "✅ 第26課文法課已上完：〜てくる 七種用法（講義 P1-P4）／〜ていく 七種用法（講義 P5-P8）／綜合練習（P9-P10）＋課本 P97-P109。"
  - "板書骨架：**空間軸**（靠近／遠離・方法手段・同移動・順序）＋**時間軸**（過去→今／今→未來）。判斷時先問自己「箭頭朝哪裡」。"
  - "てくる／ていく 在這裡是**補助動詞**，習慣**不寫漢字**：○買ってきます ×買って来ます。"
  - "最常考的一組對照：雨が降って**きた**（變化已經開始）↔ だんだん寒くなって**いく**（變化今後會持續）。"
  - "時間軸的一組對照：ずっと家族のために生きて**きた**（過去→今）↔ これから自分のために生きて**いく**（今→未來）。"
  - "⚠️ 出現・消失・變化類的用法，動詞**不可以是說話者的意志**（○雨が降ってくる ×私が来てくる）。"
  - "「說話者為動作接受方」（話しかけてきた・電話をかけてきた）**只有 てくる 有**，ていく 沒有——這是唯一不對稱的用法。"
  - "「ちょっと〜てきます」＝去一下就回來，是本課最實用的句型（トイレへ行ってきます／銀行へ行ってきます）。"
  - "行く＝專程前往；寄る＝順道去（講義 P6 板書補充）。「わがN」＝私のN／私たちのN。"
  - "板書補充：知る是**瞬間動詞**——肯定用「知っています」、否定用「知りません（でした）」，沒有「知っていません」；わかる 則正常變化。"
  - "板書補充：〜と言う 的引用部分要用**普通形**（彼は今日**来ない**と言いました）。這是第25課格助詞「と」的延續。"
  - "板書補充：なくてはいけません／なければいけません／なくてはなりません／なければなりません＝必須。口語縮成「〜なきゃ／〜なくちゃ」（買ってこなきゃ）。"
  - "📝 講義解答狀態：P1 用法一／P3 使い方五・用法六／P5 用法一 這幾組講義上仍是空白，答案為參考解答；其餘（P1 用法二、P2 用法三①〜⑤・用法四、P3 使い方七、P4 中翻日、P5-P7 各組、P8 中翻日、P9-P10 綜合練習）皆為老師公布解答。"
  - "⚠️ 課本「練習問題1」只拍到 P109，P110 之後的題目尚未補入，下次補拍後再加。"
