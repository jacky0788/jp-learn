book: 3
lesson: 6
title: 第三冊 第6課（第26課）　学校へ 行ってきます
# 來源：來學日本語 基礎進階1 第26課（課本 pp.97-109）＋文法課講義 pp.1-10
#   ＋2026-09-04 文法課板書 7 張（空間軸／時間軸／変化／生きてきた・生きていく／知る・わかる／と言う／なくてはいけません）
#   照片：raw/B3L06/（2026-09-04 首批；2026-09-20 補拍講義填答版，P4／P7／P8／P9-P10 取得老師公布解答）
# ✅ 進度：第26課文法課已上完（〜てくる 七種用法／〜ていく 七種用法，課本 pp.97-109 全收）。
# ⚠️ 課本「練習問題1」只拍到 P109，P110 之後尚未取得。

intro: |
  這一課只學兩個字：**くる** 和 **いく**。但它們在這裡不是「來」「去」的本動詞，
  而是黏在て形後面的**補助動詞**（所以照慣例不寫漢字，寫成「〜てくる」「〜ていく」）。
  課本標題頁的基本文就把整課預告完了：
  ・学校へ 行ってきます。（我去學校了——去了會回來）
  ・友だちの家へ 行く途中で、プレゼントの花を 買っていきました。（買了禮物的花帶過去）

  老師板書把整課切成**兩條軸**，這是本課最好用的骨架：

  **① 空間軸**（人／物在移動）——以「說話者現在的位置」為原點：
  　てくる＝朝我這邊來；ていく＝離開我這邊去。
  　同一條軸下又分四種：靠近／遠離、方法・手段（歩いて〜）、同移動（持って〜）、
  　順序（先離開再回來＝トイレへ行ってきます／先做完再離去＝コーヒーを飲んでいきましょう）。

  **② 時間軸**（時間在流動）——以「今」為原點：
  　てくる＝過去 →〔今〕，一直做到現在（ずっと働いてきました）；
  　ていく＝〔今〕→ 未來，從現在繼續下去（生きていく）。
  　板書那兩張圖（往回彎的弧線 vs 往右延伸的箭頭）就是這個意思。

  另外還有兩組「不是移動」的用法，最容易被漏掉：
  **變化的開始**（雨が降ってきました／おなかが痛くなってきた）只能用 てくる，
  而**變化的持續**（だんだん寒くなっていく）用 ていく；
  以及**說話者是動作的接受方**（隣の人が話しかけてきました）——這個 ていく 沒有。

  ⚠️ 這一課的鐵則：**出現類、變化類的用法，動詞不可以是說話者的意志**。

goals:
  - "分辨〜てくる／〜ていく 的兩條軸：空間（靠近／遠離）與時間（過去→今／今→未來）"
  - "用〜てきます 表達「去一下就回來」（ちょっと銀行へ行ってきます）"
  - "用〜てきました 表達「一直做到現在」（ずっとこの会社で働いてきました）"
  - "用〜てきました 表達變化的開始（雨が降ってきました／おなかが痛くなってきた）"
  - "用〜ていきます 表達「做完某事再去」與「帶著某物去」（花を買っていきました／コートを着ていきます）"
  - "用〜ていく／〜ていくつもりです 表達從現在延續到未來（続けていくつもりです）"
  - "知道出現・消失・變化類的用法不能是說話者的意志"
  - "認得說話者為接受方的〜てくる（話しかけてきました・電話をかけてきた）"
  - "掌握補充板書：知っています／知りません・わかります、〜と言う、なくてはいけません／なければなりません"

grammar:
  - point: "文型一　〜Vてくる（補助動詞）總說"
    source: 文法
    key: true
    setsuzoku:
      - "V（て形）＋ 【くる】（きます／きました／きて／こない…）"
      - "来る在此句型為【補助動詞】，用法眾多，【通常不寫漢字】（○買ってきます ×買って来ます）"
      - "否定：〜てこない／〜てきません　　過去：〜てきた／〜てきました"
    explain: |
      【講義】說明：来る在此句型為補助動詞，用法眾多，通常不寫漢字。

      【板書】老師把它拆成兩條軸——
      ・**空間軸**：以說話者現在的位置為原點，動作朝「我這邊」靠近。
      　①靠近　②方法／手段　③同移動（帶著）　④做了某事之後而來（先離開一下再回到現在所在地）
      ・**時間軸**：以「今」為原點，從過去一路持續到現在（往回彎的弧線）。

      再加上兩組不是移動的用法：**新事物的出現**、**狀態變化的開始**，
      以及 ていく 沒有的**說話者為動作接受方**。合計就是講義的七種用法。
    table:
      caption: "板書：てくる／ていく 的兩條軸（空間・時間）"
      headers: ["軸", "〜てくる", "〜ていく"]
      rows:
        - ["空間①　靠近／遠離", "朝我這邊來（{{入|はい}}ってきました）", "離開我這邊（{{出|で}}ていきました）"]
        - ["空間②　方法・手段", "{{歩|ある}}いてきます", "{{歩|ある}}いていきます"]
        - ["空間③　同移動（帶著）", "{{持|も}}ってきました", "{{持|も}}っていきます"]
        - ["空間④　順序", "先[離開再回來]（トイレへ{{行|い}}ってきます）", "先[做完再離去]（コーヒーを{{飲|の}}んでいきましょう）"]
        - ["時間", "[過去]→今（ずっと{{働|はたら}}いてきました）", "今→[未來]（{{生|い}}きていく）"]
        - ["變化", "變化的[開始]（{{寒|さむ}}くなってきた）", "變化的[持續]（だんだん{{寒|さむ}}くなっていく）"]
        - ["接受方", "[有]（{{話|はな}}しかけてきました）", "[無此用法]"]
    examples:
      - {jp: "学校へ 行ってきます。", kana: "がっこうへ いってきます。", zh: "我去學校了（去了會回來）。（課本基本文1）"}
      - {jp: "雨が 降ってきました。", kana: "あめが ふってきました。", zh: "下起雨來了。（課本基本文5）"}
      - {jp: "ずっと この会社で 働いてきました。", kana: "ずっと この かいしゃで はたらいてきました。", zh: "一直在這家公司工作到現在。（課本基本文6）"}
      - {jp: "結婚してから ずっと 家族のために 生きてきた。", kana: "けっこんしてから ずっと かぞくのために いきてきた。", zh: "結婚後一直為了家人而活到現在。（板書）"}

  - point: "てくる 用法一　由遠處向說話者所在地靠近（〜〜來／〜〜過來）"
    source: 文法
    key: true
    explain: |
      【講義 用法一】主體從遠處朝「說話者現在的位置」移動過來，
      中文常翻成「…過來了」「…來了」。動詞多是移動動詞（帰る・入る・集まる・落ちる・近づく…）。
      【板書】猫が 教室に 入ってきました。（貓進到教室裡來了）
    examples:
      - {jp: "猫が 教室に 入ってきました。", kana: "ねこが きょうしつに はいってきました。", zh: "貓進到教室裡來了。（板書）"}
      - {jp: "父は 昨日 アメリカから 帰ってきました。", kana: "ちちは きのう あめりかから かえってきました。", zh: "父親昨天從美國回來了。"}
      - {jp: "ほら、船が 港に 入ってきますよ。", kana: "ほら、ふねが みなとに はいってきますよ。", zh: "你看，船進港來了喔。"}
    practice_note: "講義 P1 用法一（7題・講義仍空白，以下為參考解答）"
    practice:
      - {q: "① 父は昨日アメリカから＿＿ました。（帰ります）", a: "帰ってき", note: "父は昨日アメリカから帰ってきました。"}
      - {q: "② ほら、船が港に＿＿ますよ。（入ります）", a: "入ってき", note: "ほら、船が港に入ってきますよ。"}
      - {q: "③ 寒いですね。窓から冷たい風が＿＿た。（吹き込みます）", a: "吹き込んでき", note: "窓から冷たい風が吹き込んできた。"}
      - {q: "④ 学生たちが広場の方へ＿＿ました。（集まります）", a: "集まってき", note: "学生たちが広場の方へ集まってきました。"}
      - {q: "⑤ 高い木から猿が＿＿ました。（跳び下ります）", a: "跳び下りてき", note: "高い木から猿が跳び下りてきました。"}
      - {q: "⑥ 危ないですよ。山の斜面から落石が＿＿ます。（落ちます）", a: "落ちてき", note: "山の斜面から落石が落ちてきます。"}
      - {q: "⑦ お祭りの日が＿＿ますね。楽しみです。（近づきます）", a: "近づいてき", note: "お祭りの日が近づいてきますね。"}

  - point: "てくる 用法二　維持著某種狀態移動／以某種手段移動"
    source: 文法
    explain: |
      【講義 用法二】前面的動詞說明「怎麼來的」——用什麼方式（走路、跑、搭車）、
      或維持著什麼狀態（穿著、帶著）來到說話者這裡。
      【板書】方法／手段：毎日 学校まで 歩いてきます。
    examples:
      - {jp: "毎日 学校まで 歩いてきます。", kana: "まいにち がっこうまで あるいてきます。", zh: "每天走路來學校。（板書）"}
      - {jp: "里美さんは 今日 きれいな着物を 着てきました。", kana: "さとみさんは きょう きれいな きものを きてきました。", zh: "里美今天穿了漂亮的和服來。"}
    practice_note: "講義 P1 用法二（5題・講義填答版・老師公布解答）"
    practice:
      - {q: "① 子供はよちよち私のところまで＿＿ました。（歩きます）", a: "歩いてき"}
      - {q: "② 本当に疲れました。ここまで＿＿ましたから。（走ります）", a: "走ってき"}
      - {q: "③ 北海道から飛行機に＿＿ましたよ。（乗ります）", a: "乗ってき"}
      - {q: "④ 先輩は寮にビールを＿＿ましたね。（持ちます）", a: "持ってき"}
      - {q: "⑤ 里美さんは今日きれいな着物を＿＿ました。（着ます）", a: "着てき"}

  - point: "てくる 用法三　順次的動作：做了某事之後而來"
    source: 文法
    key: true
    explain: |
      【講義 用法三】做了某事之後而來。有兩種情形——
      　(a) 先離開一下再回到現在所在地（トイレへ行ってきます＝去廁所一下就回來）
      　(b) 由別處做了某事來到現在所在地（学食で軽く食べてきたよ＝在學生餐廳吃過才來的）
      【板書】類似「〜てから 来る」。這就是「ちょっと〜てきます」這個超好用句型的來源。
    examples:
      - {jp: "ちょっと トイレへ 行ってきます。", kana: "ちょっと といれへ いってきます。", zh: "我去一下廁所（馬上回來）。（板書）"}
      - {jp: "家で 食べてきましたよ。", kana: "いえで たべてきましたよ。", zh: "我在家吃過才來的喔。（板書）"}
      - {jp: "ちょっと 銀行へ 行ってきます。", kana: "ちょっと ぎんこうへ いってきます。", zh: "我去一下銀行。（課本 P109 例）"}
    practice_note: "講義 P2 用法三（7題・①〜⑤為老師公布解答，⑥⑦講義仍空白＝參考解答）"
    practice:
      - {q: "① 途中で偶然友人に会ってちょっと＿＿から、遅くなって、すみません。（話します）", a: "話してきました"}
      - {q: "② 花子さんはおいしいケーキを＿＿ました。（買います）", a: "買ってき"}
      - {q: "③ 晩ご飯は？学食で軽く＿＿たよ。（食べます）", a: "食べてき"}
      - {q: "④ 先週、富士山を＿＿ました。（登ります）", a: "登ってき"}
      - {q: "⑤ すぐ＿＿から、ここで待っていてください。（戻ります）", a: "戻ってきます"}
      - {q: "⑥ すみませんが、ちょっとトイレへ＿＿。", a: "行ってきます"}
      - {q: "⑦ 先週北海道へ＿＿。（旅行します）", a: "旅行してきました"}

  - point: "てくる 用法四　從過去到現在的持續（時間軸・一直以來）"
    source: 文法
    key: true
    setsuzoku:
      - "常與【ずっと】【今まで】【〜てから】【長年】【〜年間】等一起用"
      - "原則上用【過去時態】表現：〜てきました／〜てきた"
    explain: |
      【講義 用法四】從過去到現在的持續（原則上用過去時態表現）＝「一直以來…」。
      【板書】老師畫的是一條**往回彎的弧線**，右端圈起來寫「今」——
      動作從過去某一點開始，一路持續、抵達現在這個點。
      板書例：働いてきました／教えてきました／続いてきました／暮らしてきました／読んできました。
      ⚠️ 跟 ていく 的用法五正好相反：てくる 看的是「到現在為止」，ていく 看的是「從現在起」。
    examples:
      - {jp: "ずっと この会社で 働いてきました。", kana: "ずっと この かいしゃで はたらいてきました。", zh: "一直在這家公司工作到現在。（板書・課本基本文6）"}
      - {jp: "長年、留学生に 日本語を 教えてきました。", kana: "ながねん、りゅうがくせいに にほんごを おしえてきました。", zh: "長年來一直教留學生日文。"}
      - {jp: "この{{伝統的|でんとうてき}}なお{{祭|まつ}}りは {{500年|ごひゃくねん}}も {{続|つづ}}いてきました。", kana: "この でんとうてきな おまつりは ごひゃくねんも つづいてきました。", zh: "這個傳統祭典延續了500年之久。"}
    practice_note: "講義 P2 用法四（5題・講義填答版・老師公布解答）"
    practice:
      - {q: "① 卒業してから、ずっとこの会社で＿＿。（働きます）", a: "働いてきました"}
      - {q: "② この伝統的なお祭りは500年も＿＿。（続きます）", a: "続いてきました"}
      - {q: "③ 私は中学校の時から、この新聞を＿＿。（読みます）", a: "読んできました"}
      - {q: "④ 長年、留学生に日本語を＿＿。（教えます）", a: "教えてきました"}
      - {q: "⑤ ずっと両親と一緒に＿＿。（暮らします）", a: "暮らしてきました"}

  - point: "てくる 用法五　某種新事物的產生或出現"
    source: 文法
    explain: |
      【講義 使い方五】某種新事物的產生或出現——本來沒有（或看不見、聽不見）的東西
      「冒出來了」「浮現了」「傳來了」。
      ⚠️ 主語是自然現象、聲音、想法、問題等**非說話者意志**的東西。
    examples:
      - {jp: "太陽が 雲の中から 現れてきました。", kana: "たいようが くもの なかから あらわれてきました。", zh: "太陽從雲裡出現了。"}
      - {jp: "頭に いいアイデアが 浮かんできました。", kana: "あたまに いい あいであが うかんできました。", zh: "腦中浮現了好點子。"}
      - {jp: "庭から 虫の声が 聞こえてきました。", kana: "にわから むしの こえが きこえてきました。", zh: "從院子傳來了蟲鳴聲。"}
    practice_note: "講義 P3 使い方五（4題・講義仍空白，以下為參考解答；講義原本的編號就是①⑥⑦⑧）"
    practice:
      - {q: "① 太陽が雲の中から＿＿きました。（現れます）", a: "現れて"}
      - {q: "⑥ いろいろな厄介な課題が＿＿きました。（出ます）", a: "出て"}
      - {q: "⑦ 頭にいいアイデアが＿＿きました。（浮かびます）", a: "浮かんで"}
      - {q: "⑧ 庭から虫の声が＿＿きました。（聞こえます）", a: "聞こえて"}

  - point: "てくる 用法六　狀態變化的開始（不可以是說話者的意志）"
    source: 文法
    key: true
    setsuzoku:
      - "い形容詞：〜く＋【なってくる】（寒い→寒くなってくる）"
      - "な形容詞・名詞：〜に＋【なってくる】"
      - "常與【だんだん】【どんどん】等副詞合併使用"
      - "板書：無情物【が】／人【は】　＋　【非意志V】＋てくる"
    explain: |
      【講義 用法六】狀態變化的**開始**（不可以是說話者的意志），
      常與『だんだん』『どんどん』等副詞合併使用。
      【板書】變化／變化的開始：主語如果是無情物就用「が」，是人就用「は」，
      後面接**非意志動詞**＋てくる。
      板書例：雨が降ってきましたよ。／（雪が）積もってきました。／お腹が急に痛くなってきました。
      ⚠️ 最常考的對比：**てくる＝變化開始了**（已經開始下了）；**ていく＝變化會繼續下去**（會越來越冷）。
    examples:
      - {jp: "雨が 降ってきましたよ。", kana: "あめが ふってきましたよ。", zh: "下起雨來了喔。（板書）"}
      - {jp: "お腹が 急に 痛くなってきました。", kana: "おなかが きゅうに いたくなってきました。", zh: "肚子突然痛了起來。（板書）"}
      - {jp: "最近、日本語を 勉強する人が 増えてきましたね。", kana: "さいきん、にほんごを べんきょうする ひとが ふえてきましたね。", zh: "最近學日文的人變多了呢。"}
    practice_note: "講義 P3 用法六（4題・講義仍空白，以下為參考解答）"
    practice:
      - {q: "① ここには数日の大雪で雪が＿＿。（積もります）", a: "積もってきました"}
      - {q: "② 雨が＿＿よ。早く帰りましょう。", a: "降ってきました"}
      - {q: "③ 急におなかが痛く＿＿。", a: "なってきました"}
      - {q: "④ 最近、食べ過ぎて＿＿。ダイエットをしないと。（太ります）", a: "太ってきた"}

  - point: "てくる 用法七　說話者為動作的接受方（〜ていく 無此用法）"
    source: 文法
    key: true
    explain: |
      【講義 使い方七】說話者為動作接受方（〜〜ていく 無此用法）。
      別人「朝我做了某個動作」——搭話、打電話、寄東西…，箭頭都是**指向說話者**，
      所以只能用 てくる。
      ⚠️ 這是本課唯一「ていく 沒有對應」的用法，很容易考。
    examples:
      - {jp: "突然、隣の人が 話しかけてきました。", kana: "とつぜん、となりの ひとが はなしかけてきました。", zh: "突然隔壁的人跟我搭話。"}
      - {jp: "最近、よく 夜中に 変な電話が かかってくるよ。", kana: "さいきん、よく よなかに へんな でんわが かかってくるよ。", zh: "最近半夜常有奇怪的電話打來喔。"}
    practice_note: "講義 P3 使い方七（3題・講義填答版・老師公布解答）"
    practice:
      - {q: "① 突然、隣の人が＿＿きました。（話しかけます）", a: "話しかけて"}
      - {q: "② ゆうべ友達が泣きながら電話を＿＿きたんだ。（かけます）", a: "かけて"}
      - {q: "③ 最近、よく夜中に変な電話が＿＿くるよ。（かかります）", a: "かかって"}

  - point: "講義中翻日：請用「Vてくる」翻譯（7題）"
    source: 文法
    explain: |
      講義 P4 的中翻日作業。**以下為講義填答版（2026-09-20 取得）的老師公布解答**，
      括號內是講義給的提示語。第6題講義上只寫到一半就停了，那一題仍為參考解答。
    practice_note: "講義 P4（7題・老師公布解答；第6題為參考解答）"
    practice:
      - {q: "1. 突然颳起了一陣強風。", a: "強い風が吹いてきました。", note: "講義解答。也可加「突然、」在句首"}
      - {q: "2. 一進入12月，就會逐漸變冷起來吧？", a: "12月に入ると、だんだん寒くなってくるでしょう。", note: "講義解答"}
      - {q: "3. 你瞧！溫泉湧出來了。（湧きます）", a: "ほら、温泉（の水）が湧いてきました。", note: "講義解答"}
      - {q: "4. 李同學往操場這邊跑過來了。（ほう）", a: "李さんは運動場の方へ走ってきました。", note: "講義解答"}
      - {q: "5. 今天是帶了孩子過來的。", a: "今日は、子供を連れてきました。", note: "講義解答"}
      - {q: "6. 近幾年，結了婚不生孩子的年輕人增加了。", a: "この数年間、結婚しても子供を産まない若者が増えてきました。", note: "⚠️講義只寫到「この数年間、結婚して…」就停了（未完成）；後半為參考解答"}
      - {q: "7. 到目前為止，一直在這所語言學校學日文。", a: "今まで、この日本語学校で（日本語を）ずっと勉強してきました。", note: "講義解答"}

  - point: "文型二　〜Vていく（補助動詞）總說"
    source: 文法
    key: true
    setsuzoku:
      - "V（て形）＋ 【いく】（いきます／いきました／いこう／いって…）"
      - "行く在此句型也是【補助動詞】，用法眾多，【通常也不寫漢字】"
      - "常見結尾：〜ていきます／〜ていきたいです／〜ていくつもりです／〜ていこうと思います"
    explain: |
      【講義】說明：行く在此句型也是補助動詞，用法眾多，通常也不寫漢字。

      跟 てくる 完全對稱，只是方向相反——
      ・**空間軸**：從說話者所在地朝遠方離去。①遠離　②方法／手段　③伴隨結果而移動（帶著）　④做了某事之後再去
      ・**時間軸**：以「今」為原點，往未來延伸（板書畫的是「今」圈起來、往右拉一條長箭頭）。
      再加上**未來的變化**與**消失不見**。
      ⚠️ 唯一沒有的是「說話者為接受方」——那個只有 てくる。
    examples:
      - {jp: "友だちの家へ 行く途中で、プレゼントの花を 買っていきました。", kana: "ともだちの いえへ いく とちゅうで、ぷれぜんとの はなを かっていきました。", zh: "去朋友家的途中，買了當禮物的花帶過去。（課本基本文1）"}
      - {jp: "寒いので、コートを 着ていきます。", kana: "さむいので、こーとを きていきます。", zh: "因為很冷，所以穿大衣去。（課本基本文2）"}
      - {jp: "結婚しても 仕事は 続けていくつもりです。", kana: "けっこんしても しごとは つづけていく つもりです。", zh: "就算結婚了，工作也打算繼續下去。（課本基本文3）"}
      - {jp: "私は これから 自分のために 生きていくと 思います。", kana: "わたしは これから じぶんのために いきていくと おもいます。", zh: "我今後打算為自己而活。（板書）"}

  - point: "ていく 用法一　由說話者所在地朝遠方移動（〜〜而去）"
    source: 文法
    key: true
    explain: |
      【講義 用法一】由說話者所在地而朝遠方移動（〜〜而去），
      眼睜睜看著人／物離自己越來越遠。
      【板書】遠離：列車が 走っていきました。／バスが 出ていきました。
    examples:
      - {jp: "列車が 走っていきました。", kana: "れっしゃが はしっていきました。", zh: "列車開走了。（板書）"}
      - {jp: "船は 港を 出ていきました。", kana: "ふねは みなとを でていきました。", zh: "船駛離港口了。"}
      - {jp: "鳥が 空の西へ 飛んでいきました。", kana: "とりが そらの にしへ とんでいきました。", zh: "鳥往西邊的天空飛走了。"}
    practice_note: "講義 P5 用法一（6題・講義仍空白，以下為參考解答；講義原本就沒有③）"
    practice:
      - {q: "① 泥棒は＿＿ました。（逃げます）", a: "逃げていき", note: "泥棒は逃げていきました。"}
      - {q: "② 木下さんはゆうべ日本へ＿＿ました。（帰ります）", a: "帰っていき"}
      - {q: "④ 近藤さんは教室に＿＿ました。（入ります）", a: "入っていき"}
      - {q: "⑤ 鳥が空の西へ＿＿ました。（飛びます）", a: "飛んでいき"}
      - {q: "⑥ 船は港を＿＿ました。（出ます）", a: "出ていき", note: "「港を」用を＝通過・離開的起點"}
      - {q: "⑦ あの人は前の方へ＿＿ました。（移ります）", a: "移っていき"}

  - point: "ていく 用法二　表移動的狀態；或以何種手段、方法移動"
    source: 文法
    explain: |
      【講義 用法二】表移動的狀態；或以何種手段、方法來移動。
      跟 てくる 用法二完全對稱，只是方向朝外。
      【板書】方法／手段：時間はありませんから、タクシーに 乗っていきましょう。
    examples:
      - {jp: "時間は ありませんから、タクシーに 乗っていきましょう。", kana: "じかんは ありませんから、たくしーに のっていきましょう。", zh: "沒時間了，我們搭計程車去吧。（板書）"}
      - {jp: "いつも MRTの駅まで 歩いていきます。", kana: "いつも えむあーるてぃーの えきまで あるいていきます。", zh: "平常都走路到捷運站。"}
    practice_note: "講義 P5 用法二（3題・講義填答版・老師公布解答）"
    practice:
      - {q: "① じゃ、学校まで＿＿いこう。（走ります）", a: "走って"}
      - {q: "② もう時間はないから、タクシーに＿＿ましょう。", a: "乗っていき"}
      - {q: "③ いつもMRTの駅まで＿＿ます。（歩きます）", a: "歩いていき"}

  - point: "ていく 用法三　表伴隨某結果而移動（帶著…去）"
    source: 文法
    key: true
    explain: |
      【講義 使い方三】表伴隨某結果而移動——先做了某動作（買、穿、帶），
      再帶著那個結果一起離開／前往。
      這就是課本基本文1「プレゼントの花を 買っていきました」的用法。
      【板書】友達の家に 何かおみやげを 持っていきたいですが。
    examples:
      - {jp: "友達の家に 何か おみやげを 持っていきたいですが。", kana: "ともだちの いえに なにか おみやげを もっていきたいですが。", zh: "想帶點伴手禮去朋友家…。（板書）"}
      - {jp: "父を 病院へ 連れていきました。", kana: "ちちを びょういんへ つれていきました。", zh: "帶父親去了醫院。"}
    practice_note: "講義 P5-P6 使い方三（3題・講義填答版・老師公布解答）"
    practice:
      - {q: "① 友達のうちにおみやげを＿＿ます。（持ちます）", a: "持っていき"}
      - {q: "② 来週のパーティーにドレスを＿＿ます。（着ます）", a: "着ていき"}
      - {q: "③ 父を病院へ＿＿ました。（連れます）", a: "連れていき"}

  - point: "ていく 用法四　表做了某事之後再去（〜〜。それから、行きます）"
    source: 文法
    explain: |
      【講義 用法四】表做了某事之後再去（〜〜。それから、行きます）。
      跟 てくる 用法三（先離開再回來）剛好相反：這裡是**在路上／出發前先做完，再繼續前往**。
      【板書】途中で コーヒーでも 飲んでいきましょう。／いこう。
      【講義補充】行く：專程前往；寄る：順道去。
    examples:
      - {jp: "途中で コーヒーでも 飲んでいきましょう。", kana: "とちゅうで こーひーでも のんでいきましょう。", zh: "路上順便喝杯咖啡再走吧。（板書）"}
      - {jp: "本屋に 寄って、雑誌を 買っていきたいんですが。", kana: "ほんやに よって、ざっしを かっていきたいんですが。", zh: "想順道去書店買本雜誌再走…。"}
    practice_note: "講義 P6 用法四（2題・講義填答版・老師公布解答）"
    practice:
      - {q: "① 時間は十分だから、お茶でも＿＿ましょう。", a: "飲んでいき"}
      - {q: "② 本屋に寄って、雑誌を＿＿たいんですが。（買います）", a: "買っていき", note: "板書補充：行く＝專程前往／寄る＝順道去"}

  - point: "ていく 用法五　以某個時間點為基準，向未來的延續（時間軸）"
    source: 文法
    key: true
    setsuzoku:
      - "常見結尾：〜ていきます／〜ていきたいです／〜ていくつもりです／〜ていこうと思います"
      - "板書：ていきたいなあ／ていくつもりです／ていきます／〜っていってください／〜っていこうと思います"
    explain: |
      【講義 用法五】以某個時間點為基準，向未來的延續。
      【板書】老師畫的是「今」圈起來、往右拉一條長箭頭——從現在這個點一路延伸到未來。
      跟 てくる 用法四剛好接在一起：
      　結婚してから ずっと 家族のために **生きてきた**（過去→今）
      　私は これから 自分のために **生きていく** と思います。／**生きていこう** と思っています。（今→未來）
      ⚠️ 這裡的動詞**可以**是說話者的意志（跟用法六的變化剛好相反）。
    examples:
      - {jp: "結婚してから ずっと 家族のために 生きてきた。", kana: "けっこんしてから ずっと かぞくのために いきてきた。", zh: "結婚後一直為了家人而活到現在。（板書・對照用）"}
      - {jp: "私は これから 自分のために 生きていこうと 思っています。", kana: "わたしは これから じぶんのために いきていこうと おもっています。", zh: "我今後想為自己而活。（板書）"}
      - {jp: "結婚しても 仕事は 続けていくつもりです。", kana: "けっこんしても しごとは つづけていく つもりです。", zh: "就算結婚了，工作也打算繼續下去。（課本基本文3）"}
    practice_note: "講義 P6 用法五（6題・講義填答版・老師公布解答）"
    practice:
      - {q: "① 結婚してからもいまの仕事を＿＿ます。（続けます）", a: "続けていき"}
      - {q: "② わがテレビ局は今後も、子供のためにいい番組をたくさん＿＿たいと思います。（放送します）", a: "放送していき", note: "板書補充：わがN＝私のN／私たちのN"}
      - {q: "③ 毎日1時間ずつスポーツを＿＿つもりです。", a: "していく"}
      - {q: "④ これからもっと頑張って、日本語を＿＿。（勉強します）", a: "勉強していきます"}
      - {q: "⑤ 一人ぼっちでも強く＿＿くださいね。（生きます）", a: "生きていって"}
      - {q: "⑥ 余生をのんびりと＿＿たいなあ。（過ごします）", a: "過ごしていき"}

  - point: "ていく 用法六　未來的變化（也不可以是說話者的意志）"
    source: 文法
    key: true
    setsuzoku:
      - "い形容詞：〜く＋【なっていく】（寒い→寒くなっていく）"
      - "常與【だんだん】【どんどん】【これからは】【今後】等一起用"
    explain: |
      【講義 用法六】未來的變化（<u>也不可以是說話者的意志</u>）——
      從現在起，狀態會**越來越…下去**。
      ⚠️ 與 てくる 用法六的對照（本課最重要的一組）：
      　これからは、だんだん寒く**なっていく**でしょうね。（今後會越來越冷＝往未來）
      　（外に出たら）急に寒く**なってきた**。（剛剛開始變冷了＝變化已經開始）
    examples:
      - {jp: "これからは、だんだん 寒くなっていくでしょうね。", kana: "これからは、だんだん さむくなっていくでしょうね。", zh: "接下來會漸漸變冷吧。"}
      - {jp: "韓国語の勉強は これから だんだん 面白くなっていくでしょう。", kana: "かんこくごの べんきょうは これから だんだん おもしろくなっていくでしょう。", zh: "韓文的學習今後會越來越有趣吧。"}
    practice_note: "講義 P7 用法六（3題・②③為老師公布解答，①講義仍空白＝參考解答）"
    practice:
      - {q: "① 政府の政策で世界各国からの留学生はだんだん＿＿でしょう。（減ります）", a: "減っていく"}
      - {q: "② これからは、だんだん寒く＿＿ね。スドーブを出しておいてください。（なります）", a: "なっていくでしょう"}
      - {q: "③ この調子で、この患者の病気が＿＿でしょう。（進みます）", a: "進んでいく", note: "板書另寫了「悪くなっていく」也可以"}

  - point: "ていく 用法七　消失不見"
    source: 文法
    explain: |
      【講義 使い方七】消失不見——本來看得見的東西，從眼前（或這個世界上）漸漸消失。
      跟 てくる 用法五（出現）正好是一組：**出てくる ⇄ 消えていく**。
    examples:
      - {jp: "ほら、太陽が 西の地平線の下に 沈んでいきました。", kana: "ほら、たいようが にしの ちへいせんの したに しずんでいきました。", zh: "你看，太陽沉到西邊的地平線下去了。（講義解答）"}
      - {jp: "毎日、たくさんの人間が 生まれてきて、そして、死んでいきます。", kana: "まいにち、たくさんの にんげんが うまれてきて、そして、しんでいきます。", zh: "每天有許多人誕生，然後死去。"}
    practice_note: "講義 P7 使い方七（2題・老師公布解答）"
    practice:
      - {q: "① 都市の過疎開発で、動物の住む自然環境がだんだん＿＿かもしれません。（消えます）", a: "消えていく", note: "講義解答"}
      - {q: "② ほら、太陽が西の地平線の下に＿＿。（沈みます）", a: "沈んでいきました", note: "講義解答（用過去式，描述剛剛沉下去的景象）"}

  - point: "講義中翻日：請用「V2＋ていく」翻譯（7題）"
    source: 文法
    explain: |
      講義 P8 的中翻日作業。**以下為講義填答版（2026-09-20 取得）的老師公布解答**，
      括號內是講義給的提示語。（講義原本的題號就是 1,2,3,4,5,7,8，沒有 6。）
      講義上藍筆是作答、紅筆是老師訂正，下面採用訂正後的版本。
    practice_note: "講義 P8（7題・老師公布解答，含紅筆訂正）"
    practice:
      - {q: "1. 田中同學進教室去了。", a: "田中さんは教室に入っていきました。", note: "講義解答"}
      - {q: "2. 明天早上開始會漸漸轉為晴朗。", a: "明日の朝から、だんだん晴れていきます。", note: "紅筆訂正：原寫「晴れるていく」→「晴れていきます」（て形接續，不是辭書形）"}
      - {q: "3. 希望今後和大家一同在這間公司工作下去，直到退休為止。（定年退職）", a: "これから定年退職までみんなで（一緒に）この会社で働いていきたいです。", note: "紅筆訂正兩處：「みんなと」→「みんなで」、「働きいて」→「働いて」"}
      - {q: "4. 因為出生率開始下降，所以少子化問題會變得很嚴重吧？（出生率、下がる、少子化、深刻だ）", a: "出生率が下がっているので、（もっと／更に）深刻になっていくでしょう。", note: "講義解答。也可把主語補完整：少子化の問題は〜。前半狀態用ている、後半用ていく表今後持續惡化"}
      - {q: "5. 立刻從這裡離開！（請用命令型）", a: "ここを出ていけ！", note: "紅筆補上「を」——離開的起點用を。命令形是第25課學的"}
      - {q: "7. 外食又貴分量又少，在家裡吃了午飯再去吧！（量）", a: "外食は高いし、量も少ないし、家で昼ごはんを食べていきましょう。", note: "紅筆訂正：原寫「食べるていこう」→「食べていきましょう」"}
      - {q: "8. 考試的時候必須帶什麼去？", a: "試験の時（に）、何を持っていかなければなりませんか。", note: "講義解答。紅筆另補「＝いけませんか」也可以"}

  - point: "講義綜合練習　『いく』か『くる』を適当な形にして（19題）"
    source: 文法
    key: true
    explain: |
      講義 P9-P10 的總複習：只給你動詞的て形，你要自己判斷該接 **いく** 還是 **くる**，
      而且要變成正確的形（ましょう／ください／命令形／ない形／た形…）。
      判斷口訣：**問自己「箭頭朝哪裡」**——朝我＝くる，離開我＝ていく；
      到現在為止＝てくる，從現在起＝ていく。
      **以下為講義填答版（2026-09-20 取得）的老師公布解答**；⑱⑲ 兩題講義上只寫了前半，
      補成完整答案並在該題註明。
    practice_note: "講義 P9-P10（19題・老師公布解答）"
    practice:
      - {q: "① あちらは寒いので、コートを着て＿＿ましょう。", a: "いき", note: "着ていきましょう（穿著去）"}
      - {q: "② 田中さんに話すがあるので、ここへ呼んで＿＿ください。", a: "きて", note: "呼んできてください（叫過來）"}
      - {q: "③ この家からさっさと出て＿＿！（命令形）二度と戻って＿＿な！", a: "いけ／くる", note: "出ていけ！二度と戻ってくるな！"}
      - {q: "④ 佐藤さん、留守の間に藤原さんという人から電話がかかって＿＿よ。", a: "きました", note: "電話がかかってきましたよ（打來給你＝接受方）"}
      - {q: "⑤ 家からここまで、ずっと走って＿＿たので、疲れました。", a: "き", note: "走ってきた（一路跑過來）"}
      - {q: "⑥ こんな易しい問題ができないなんて、いったい今まで何を勉強して＿＿んだ？", a: "きた", note: "勉強してきたんだ？（到現在為止）"}
      - {q: "⑦ その歌を聞いたら、悲しくて涙が出て＿＿よ。", a: "きました", note: "涙が出てきました（出現）"}
      - {q: "⑧ A:最近、日本語を勉強する人が増えて＿＿ね。／B:ええ、これからも増えて＿＿だろうと思います。", a: "きました／いく", note: "增えてきました（到現在）→増えていく（今後）"}
      - {q: "⑨ 台所からいいにおいがして＿＿ました。母はカレーを作っているようです。", a: "き", note: "においがしてきました（傳過來）"}
      - {q: "⑩ 朝ごはんを食べなかったから、おなかがすいて＿＿。", a: "きました", note: "おなかがすいてきました（變化開始）"}
      - {q: "⑪ 韓国語の勉強はこれからだんだん面白くなって＿＿でしょう。", a: "いく", note: "面白くなっていくでしょう（未來的變化）"}
      - {q: "⑫ ついでにコンビニへ行ってコーヒーを買って＿＿くれない。", a: "きて", note: "買ってきてくれない（幫我買回來）"}
      - {q: "⑬ ちょっと電話をかけて＿＿ので、ここで待っていてもらえませんか。", a: "くる", note: "電話をかけてくるので（去打個電話就回來）"}
      - {q: "⑭ 先生、すみません。宿題を家に忘れて＿＿。", a: "きました", note: "忘れてきました（忘在家裡才來的）"}
      - {q: "⑮ 会場はここから遠いので、歩くのは大変だから、タクシーに乗って＿＿ましょう。", a: "いき", note: "乗っていきましょう（手段・往外）"}
      - {q: "⑯ この仕事を始めたばかりですから、これから覚えて＿＿なければならないことがたくさんあります。", a: "いか", note: "覚えていかなければならない（今後要一直學下去）"}
      - {q: "⑰ 毎日、たくさんの人間が生まれて＿＿、そして、死んで＿＿。", a: "きて／いく", note: "講義解答：生まれてきて（出現）→死んでいく（消失）"}
      - {q: "⑱ A:電車、遅いですね。／B:駅の人に＿＿ましょうか。（聞きます）", a: "聞いてき", note: "聞いてきましょうか（我去問一下回來）。⚠️講義上只寫了「聞いて」，少了き"}
      - {q: "⑲ A:日本語学校の勉強はたいへんなんですね。／B:そうですね。でも、これからも、もっと＿＿つもりなんです。（頑張ります）", a: "頑張っていく", note: "頑張っていくつもりなんです（今後繼續努力）。⚠️講義上只寫了「頑張って」，つもり前面要接辭書形，少了いく"}

  - point: "課本 P98-99　〜てきます 基本文＋練習1〜6"
    source: 文法
    explain: |
      課本〜てきます 這一半的《基本文》六句，正好把講義的用法排成一列：
      1・2 是空間（去了會回來／來的時候順便買回來）、3・4 是順次動作、
      5 是變化的開始、6 是時間軸的持續。
      練習1〜3 是空間與順次動作，練習4 是手段，練習5 是變化，練習6 是時間軸。
    examples:
      - {jp: "学校へ 行ってきます。", kana: "がっこうへ いってきます。", zh: "我去學校了。（基本文1）"}
      - {jp: "あした ここへ 来るとき、ノートを 買ってきてください。", kana: "あした ここへ くるとき、のーとを かってきてください。", zh: "明天來這裡的時候，請幫我買筆記本過來。（基本文2）"}
      - {jp: "日本へ 来る前に、自分の国で 日本語の 勉強を してきました。", kana: "にほんへ くるまえに、じぶんの くにで にほんごの べんきょうを してきました。", zh: "來日本之前，已經在自己的國家學過日文了。（基本文3）"}
      - {jp: "帰りの新幹線で 弁当を 食べてきました。", kana: "かえりの しんかんせんで べんとうを たべてきました。", zh: "在回程的新幹線上吃過便當了。（基本文4）"}
      - {jp: "雨が 降ってきました。", kana: "あめが ふってきました。", zh: "下起雨來了。（基本文5）"}
      - {jp: "ずっと この会社で 働いてきました。", kana: "ずっと この かいしゃで はたらいてきました。", zh: "一直在這家公司工作到現在。（基本文6）"}
    practice_note: "課本 P98-P99 練習1〜6（共 6 組・原題只給動詞，答案為變形後的完整說法）"
    practice:
      - {q: "練1例：学校へ（行きます・きます）", a: "学校へ行ってきます。"}
      - {q: "練1(1) 友だちのうちへ 遊びに（行きます・きます）", a: "友だちのうちへ遊びに行ってきます。"}
      - {q: "練1(2) 図書館で 本を（借ります・きました）", a: "図書館で本を借りてきました。"}
      - {q: "練1(3) ちょっと コンビニに（行きます・きます）", a: "ちょっとコンビニに行ってきます。"}
      - {q: "練1(4) 夕方 スーパーで 豆腐を（買います・きました）", a: "夕方スーパーで豆腐を買ってきました。"}
      - {q: "練1(5) すみません、ちょっと トイレに（行きます・きます）", a: "すみません、ちょっとトイレに行ってきます。"}
      - {q: "練1(6) すみません、手紙を（出します・きてください）", a: "すみません、手紙を出してきてください。"}
      - {q: "練2例：あした ここへ 来るとき、ノートを（買います・きてください）", a: "あしたここへ来るとき、ノートを買ってきてください。"}
      - {q: "練2(1) 途中で 本屋に（寄ります・きました）", a: "途中で本屋に寄ってきました。", note: "板書填答"}
      - {q: "練2(2) 病院へ 来る途中で、花を（買います・きます）", a: "病院へ来る途中で、花を買ってきます。"}
      - {q: "練2(3) 来るとき、郵便局で 切手を（買います・きてください）", a: "来るとき、郵便局で切手を買ってきてください。"}
      - {q: "練3例：友だちに 借りた本を うちから（持ちます・きました）", a: "友だちに借りた本をうちから持ってきました。"}
      - {q: "練3(1) 留学する前に、ひらがなとカタカナを（覚えます・きました）", a: "留学する前に、ひらがなとカタカナを覚えてきました。"}
      - {q: "練3(2) 今日 テストがあるので、うちで（復習します・きました）", a: "今日テストがあるので、うちで復習してきました。"}
      - {q: "練3(3) 学校へ 来る前に、うちで 朝ごはんを（食べます・きました）", a: "学校へ来る前に、うちで朝ごはんを食べてきました。"}
      - {q: "練4例：電車の中で 本を（読む・きました）", a: "電車の中で本を読んできました。"}
      - {q: "練4(1) 出張の帰り、飛行機で（寝る・きました）", a: "出張の帰り、飛行機で寝てきました。"}
      - {q: "練4(2) ここへ 来るとき、車で CDを（聞く・きました）", a: "ここへ来るとき、車でCDを聞いてきました。"}
      - {q: "練4(3) 学校から 帰るとき、歩きながら ジュースを（飲む・きました）", a: "学校から帰るとき、歩きながらジュースを飲んできました。"}
      - {q: "練5例：急に おなかが（痛くなる・きた）", a: "急におなかが痛くなってきた。"}
      - {q: "練5(1) 夕方から 雨が（降る・きました）", a: "夕方から雨が降ってきました。"}
      - {q: "練5(2) 窓を 開けたら さわやかな風が（吹く・きたよ）", a: "窓を開けたらさわやかな風が吹いてきたよ。"}
      - {q: "練5(3) 空が 曇って、天気が（悪くなる・きた）", a: "空が曇って、天気が悪くなってきた。"}
      - {q: "練5(4) 昨日 徹夜したので、昼ご飯を 食べたら（眠くなる・きた）", a: "昨日徹夜したので、昼ご飯を食べたら眠くなってきた。"}
      - {q: "練6例：今まで ずっと 日本で（暮らす・きました）", a: "今までずっと日本で暮らしてきました。"}
      - {q: "練6(1) 学校を 卒業してから この会社で（働く・きました）", a: "学校を卒業してからこの会社で働いてきました。"}
      - {q: "練6(2) 一人で この研究を（続ける・きて）、やっと 成果が 出ました。", a: "一人でこの研究を続けてきて、やっと成果が出ました。"}
      - {q: "練6(3) 結婚してから 家事に（専念する・きた）", a: "結婚してから家事に専念してきた。"}
      - {q: "練6(4) 20歳のときから ずっと 日本語を（勉強する・きました）", a: "20歳のときからずっと日本語を勉強してきました。"}
      - {q: "練6(5) 30年間、日本で タイ料理を（作る・きました）", a: "30年間、日本でタイ料理を作ってきました。"}
      - {q: "練6(6) 二人は 長い間（つきあう・きました）", a: "二人は長い間つきあってきました。"}

  - point: "課本 P100　練習7（〜てきて／〜てきた）＋対話"
    source: 文法
    explain: |
      練習7 是本課最實用的一組：把「〜てきて＋くれる／あげる／もいい」組合起來，
      變成「幫我買回來」「我帶過去給你」「可以帶妹妹來嗎」這種真的會用到的句子。
      下面的語庫是：乗ります／勉強します／買います／しました／出します／痛くなります／連れます／持ちます。
    examples:
      - {jp: "ちょっとすみません。電話を かけてきても いいですか。", kana: "ちょっとすみません。でんわを かけてきても いいですか。", zh: "不好意思，我可以去打個電話嗎？（対話）"}
      - {jp: "じゃ、待っていてください。すぐ 戻ってきます。", kana: "じゃ、まっていてください。すぐ もどってきます。", zh: "那請等一下，我馬上回來。（対話）"}
    practice_note: "課本 P100 練習7（7題）＋対話・入れ替えよう"
    practice:
      - {q: "例：道が わかりにくいので、タクシーに＿＿ください。", a: "乗ってきて"}
      - {q: "(1) A:誰か 宅配便を＿＿くれませんか。／B:はい、いいですよ。（出します）", a: "出してきて"}
      - {q: "(2) A:コンビニに 行ってきます。／B:あっ、ついでに おにぎり＿＿くれる？（買います）", a: "買ってきて"}
      - {q: "(3) A:すみません、明日 妹を＿＿もいいですか。／B:ああ、見学したいと言ってましたね。いいですよ。（連れます）", a: "連れてきて"}
      - {q: "(4) A:あした CDを＿＿あげるね。／B:ありがとう。ダビングして、すぐに返すからね。（持ちます）", a: "持ってきて"}
      - {q: "(5) A:前の会社では 何を やっていたんですか。／B:編集の仕事を＿＿。（しました）", a: "してきました"}
      - {q: "(6) A:大丈夫ですか。／B:ええ、少し 頭が＿＿んです。風邪かなあ。（痛くなります）", a: "痛くなってきた"}
      - {q: "(7) A:ずいぶん 日本語が 上手ですね。／B:日本へ 来る前に 中級まで＿＿んです。（勉強します）", a: "勉強してきた"}
      - {q: "対話・入れ替え①：たばこを＿＿ － すぐ＿＿", a: "買ってきます／帰ってきます"}
      - {q: "対話・入れ替え②：銀行へ＿＿ － 10分後に戻ります", a: "行ってきます"}

  - point: "課本 P101　〜ていきます 基本文＋練習1〜2"
    source: 文法
    explain: |
      〜ていきます 這一半的《基本文》三句：1 是伴隨結果而移動（買了帶去）、
      2 也是（穿了去）、3 是時間軸（今後繼續下去）。
      練習1 是「做完某事再去」，練習2 是手段／方法。
    examples:
      - {jp: "友だちの家へ 行く途中で、プレゼントの花を 買っていきました。", kana: "ともだちの いえへ いく とちゅうで、ぷれぜんとの はなを かっていきました。", zh: "去朋友家的途中，買了當禮物的花帶過去。（基本文1）"}
      - {jp: "寒いので、コートを 着ていきます。", kana: "さむいので、こーとを きていきます。", zh: "因為很冷，所以穿大衣去。（基本文2）"}
      - {jp: "結婚しても 仕事は 続けていくつもりです。", kana: "けっこんしても しごとは つづけていく つもりです。", zh: "就算結婚了，工作也打算繼續下去。（基本文3）"}
    practice_note: "課本 P101 練習1（5題）・練習2（5題）"
    practice:
      - {q: "練1例：韓国へ 行く前に、ハングルを 勉強します。それから、いきます。", a: "韓国へ行く前に、ハングルを勉強していきます。"}
      - {q: "練1(1) 学校へ 行く途中で、手紙を 出します。それから、いきます。", a: "学校へ行く途中で、手紙を出していきます。"}
      - {q: "練1(2) 会社へ 行くとき、いつも 喫茶店で モーニングサービスを 食べます。それから、いきます。", a: "会社へ行くとき、いつも喫茶店でモーニングサービスを食べていきます。"}
      - {q: "練1(3) お見舞いに 行くとき、花を 買います。それから、いきましょう。", a: "お見舞いに行くとき、花を買っていきましょう。"}
      - {q: "練1(4) あした 工場見学に 行く前に、バスの中で 予習をします。それから、いきませんか。", a: "あした工場見学に行く前に、バスの中で予習をしていきませんか。", note: "板書填答「ていきませ（んか）」"}
      - {q: "練1(5) 宇宙飛行士は 特別な 訓練を します。それから、いきます。", a: "宇宙飛行士は特別な訓練をしていきます。", note: "板書填答「していきます」"}
      - {q: "練2例：いつも 学校まで（歩きます・いきます）", a: "いつも学校まで歩いていきます。"}
      - {q: "練2(1) 時間が ないので、タクシーに（乗ります・いきます）", a: "時間がないので、タクシーに乗っていきます。"}
      - {q: "練2(2) 遠足のとき、自分で作ったお弁当を（持ちます・いこう）", a: "遠足のとき、自分で作ったお弁当を持っていこう。"}
      - {q: "練2(3) 先週の日曜日、弟を プールへ（連れます・いってあげました）", a: "先週の日曜日、弟をプールへ連れていってあげました。"}
      - {q: "練2(4) お金が なかったので（歩きます・いきました）", a: "お金がなかったので歩いていきました。"}
      - {q: "練2(5) 授業に 間に合わないので、（急ぎます・いきます）", a: "授業に間に合わないので、急いでいきます。"}

  - point: "課本 P102-103　練習3〜4＋対話"
    source: 文法
    explain: |
      練習3 是「〜ても、〜ていくつもりです／いきたいです／いこうと思います」——
      把第23課的つもり跟本課的ていく接在一起，講「今後的打算」。
      練習4 的語庫是：乗ります／食べます／続けます／入れます／頑張ります／出します／寄ります／買います。
    examples:
      - {jp: "もう少しで 終わるから、これだけ やっていきますよ。", kana: "もう すこしで おわるから、これだけ やっていきますよ。", zh: "快做完了，我把這些做完再走喔。（対話）"}
      - {jp: "じゃ、わたしは 銀行に 寄っていこうかな。", kana: "じゃ、わたしは ぎんこうに よっていこうかな。", zh: "那我順道去一下銀行好了。（対話）"}
    practice_note: "課本 P102 練習3（3題）・練習4（7題）＋P103 対話・入れ替えよう"
    practice:
      - {q: "練3例：学校を 卒業しても、日本語の 勉強を（続けます・いくつもりです）", a: "学校を卒業しても、日本語の勉強を続けていくつもりです。"}
      - {q: "練3(1) 国民が 反対しても、政府は 原子力を（利用します・いくつもりです）", a: "国民が反対しても、政府は原子力を利用していくつもりです。"}
      - {q: "練3(2) 結婚しても 仕事は（続けます・いきたいです）", a: "結婚しても仕事は続けていきたいです。"}
      - {q: "練3(3) 今まで 歌手でしたが、これからは 女優としても（頑張ります・いこうと思います）", a: "今まで歌手でしたが、これからは女優としても頑張っていこうと思います。"}
      - {q: "練4例：時間が ないので、タクシーに＿＿ください。", a: "乗っていって"}
      - {q: "練4(1) A:そろそろ 失礼します。／B:あら、晩ご飯を＿＿ください。（食べます）", a: "食べていって"}
      - {q: "練4(2) A:あっ、学校へ 行く時間だ。／B:ちょっと 待って。この手紙を ポストに＿＿くださいね。（入れます）", a: "入れていって"}
      - {q: "練4(3) A:時間なので、もう 行きますね。／B:すみません、これ、郵便局で＿＿ください。（出します）", a: "出していって"}
      - {q: "練4(4) A:あした 何か＿＿ましょうか。／B:そうですね。お見舞いなので お花か果物でしょうか。（買います）", a: "買っていき"}
      - {q: "練4(5) A:すみません。ちょっと 本屋へ＿＿たいんですが。／B:いいですよ。わたしも 見たい雑誌が ありますから。（寄ります）", a: "寄っていき"}
      - {q: "練4(6) A:結婚したら、専業主婦になるんですか。／B:いいえ、結婚しても、仕事を＿＿つもりです。（続けます）", a: "続けていく"}
      - {q: "練4(7) A:勤続20年、おめでとうございます。／B:ありがとうございます。これからも 会社のために＿＿と思います。（頑張ります）", a: "頑張っていこう"}
      - {q: "対話・入れ替え：そば － ちょっと、ここを＿＿よ － 郵便局に＿＿ － そば屋", a: "片付けていきます／寄っていこう"}

  - point: "課本 P103　やってみよう「鈴木先生の話」（選出正確的）"
    source: 文法
    key: true
    explain: |
      這是本課的閱讀＋選擇題：讀完短文，在括號中圈出正確的一個。
      它其實是把本課全部用法排成一篇文章——**教えてきました**（到現在為止）、
      **わかるようになってきて**（變化開始）、**変わってきた**（到現在的變化）、
      **続けていく**（今後）、**持っていく**（帶去）、**集めてきたり**（收集回來）、
      **戻ってきたら**（回來的話）。答對的關鍵一樣是「箭頭朝哪裡」。
    examples:
      - {jp: "{{鈴木|すずき}}{{先生|せんせい}}は、{{大学|だいがく}}を{{卒業|そつぎょう}}してから{{10年間|じゅうねんかん}}、この{{学校|がっこう}}で{{日本語|にほんご}}を{{教|おし}}えてきました。", kana: "すずきせんせいは、だいがくを そつぎょうしてから じゅうねんかん、この がっこうで にほんごを おしえてきました。", zh: "鈴木老師大學畢業後，在這所學校教了十年日文。"}
      - {jp: "だんだん学生の気持ちがわかるようになってきて、自分の考え方も変わってきたと思います。", kana: "だんだん がくせいの きもちが わかるように なってきて、じぶんの かんがえかたも かわってきたと おもいます。", zh: "漸漸能理解學生的心情，我覺得自己的想法也有了改變。"}
      - {jp: "日本語を教える仕事は、とてもおもしろい仕事なので、これからもずっと続けていくつもりです。", kana: "にほんごを おしえる しごとは、とても おもしろい しごとなので、これからも ずっと つづけていく つもりです。", zh: "教日文是很有趣的工作，今後也打算一直做下去。"}
    practice_note: "課本 P103 やってみよう（7處選擇・原為空白，此處補上參考解答）"
    practice:
      - {q: "① この学校で日本語を教えて（いきました・きました）", a: "きました", note: "到現在為止的十年"}
      - {q: "② 学生の気持ちがわかるようになって（いって・きて）", a: "きて", note: "變化到現在"}
      - {q: "③ 自分の考え方も変わって（いった・きた）と思います", a: "きた"}
      - {q: "④ これからもずっと続けて（いく・くる）つもりです", a: "いく", note: "今後→未來"}
      - {q: "⑤ 今、アメリカに持って（いく・くる）本を選んだり", a: "いく", note: "帶去美國"}
      - {q: "⑥ 資料を図書館で集めて（いったり・きたり）", a: "きたり", note: "去圖書館收集回來"}
      - {q: "⑦ 先生がアメリカから戻って（いったら・きたら）", a: "きたら", note: "回到我這邊"}

  - point: "課本 P104　会話（2組）"
    source: 文法
    explain: |
      兩段口語會話，把本課用法放進日常對話裡。
      第1組全是「變化的開始」（太ってきた／きつくなってきた）＋「買ってこなきゃ」的口語縮約；
      第2組是「わかるようになってきました」（到現在）與「考えていこう／いくつもり」（今後）的對照。
    examples:
      - {jp: "あーあ、また ズボン、買ってこなきゃ。", kana: "あーあ、また ずぼん、かってこなきゃ。", zh: "唉，又得去買褲子了。（＝買ってこなければならない 的口語縮約）"}
      - {jp: "最近、太って、ウエストがきつくなってきたんだよ。", kana: "さいきん、ふとって、うえすとが きつくなってきたんだよ。", zh: "最近變胖，腰圍變緊了啊。"}
      - {jp: "ズボンを買うんじゃなくて、スポーツジムに行ってくれば？", kana: "ずぼんを かうんじゃなくて、すぽーつじむに いってくれば？", zh: "與其買褲子，不如去健身房如何？"}
      - {jp: "ずいぶん日本語がわかるようになってきましたね。", kana: "ずいぶん にほんごが わかるように なってきましたね。", zh: "你日文變得懂很多了呢。"}
      - {jp: "これから、進学のことも考えていこうと思います。", kana: "これから、しんがくの ことも かんがえていこうと おもいます。", zh: "今後也想開始考慮升學的事。"}
      - {jp: "まだ、決めていないので、そのことも一緒に考えていくつもりです。", kana: "まだ、きめていないので、その ことも いっしょに かんがえていく つもりです。", zh: "還沒決定，所以打算連那件事一起慢慢想。"}

  - point: "課本 P105-106　單字・句型整理"
    source: 文法
    explain: |
      課本最後把本課的句型排成表格。〜てきます 有六個句型、〜ていきます 有三個。
      表格右邊那一欄的中文說明，就是判斷用哪一個的依據。
      補充：＊N（移動方式）＋で＋N＋を＋V（て形）＋きました＝在移動的期間做了N，
      例：乗ってくる、寝てくる、持ってくる。
    table:
      caption: "課本 P105-106 句型整理"
      headers: ["句型", "結構", "例句（中譯）"]
      rows:
        - ["てきます 1", "N（場所）へ　V（て形）[きます]", "{{学校|がっこう}}へ{{行|い}}ってきます（我要上學去。去了還會回來）"]
        - ["てきます 2", "N（場所）へ　V（基本形）とき　N を　V（て形）[きて][ください]", "あした ここへ{{来|く}}るとき、ノートを{{買|か}}ってきてください"]
        - ["てきます 3", "S　N で　N を　V（て形）[きました]", "{{日本|にほん}}へ{{来|く}}る{{前|まえ}}に{{国|くに}}で{{日本語|にほんご}}の{{勉強|べんきょう}}をしてきました"]
        - ["てきます 4", "＊N（移動方式）で　N を　V（て形）[きました]", "{{帰|かえ}}りの{{新幹線|しんかんせん}}で{{弁当|べんとう}}を{{食|た}}べてきました"]
        - ["てきます 5", "N が　V（て形）[きました]＝[開始]V", "{{雨|あめ}}が{{降|ふ}}ってきました（下起雨來了）"]
        - ["てきます 6", "N（場所）で　V（て形）[きました]＝一直〜到[現在]", "ずっとこの{{会社|かいしゃ}}で{{働|はたら}}いてきました"]
        - ["ていきます 1", "N を　V（て形）[いきました]", "{{友|とも}}だちの{{家|いえ}}へ{{行|い}}く{{途中|とちゅう}}でプレゼントの{{花|はな}}を{{買|か}}っていきました"]
        - ["ていきます 2", "S ので　N を　V（て形）[いきます]", "{{寒|さむ}}いのでコートを{{着|き}}ていきます"]
        - ["ていきます 3", "S「＊V（て形）」も　N は　V（て形）[いく][つもりです]", "{{結婚|けっこん}}しても{{仕事|しごと}}は{{続|つづ}}けていくつもりです（持續時間為[現在到未來]）"]

  - point: "課本 P109　練習問題1（もんだいI〜III）"
    source: 文法
    explain: |
      課本課末的練習問題。もんだいI 看圖用〜てきます、もんだいII 看圖用〜ていきます、
      もんだいIII 把兩個句子合成一句。
      ⚠️ 這一頁只拍到 P109，後面幾題還沒取得。
    practice_note: "課本 P109（原為空白，以下依插圖補上參考解答）"
    practice:
      - {q: "もんだいI 例：（家→銀行→回家の図）ちょっと＿＿。", a: "銀行へ行ってきます", note: "課本已印的示範"}
      - {q: "もんだいI (1)（喝東西の人→拿啤酒→回來の図）", a: "ビールを買ってきます。"}
      - {q: "もんだいI (2)（家→走→超市買東西→回來の図）ちょっと＿＿。", a: "スーパーへ買い物に行ってきます。"}
      - {q: "もんだいI (3)（學生舉手→老師の図）問題がわからないので＿＿。", a: "先生に聞いてきます。"}
      - {q: "もんだいII 例1：アメリカへ行く前に、＿＿。", a: "英会話の勉強をしていきます", note: "課本已印的示範"}
      - {q: "もんだいII 例2：雨が降っているので、学校へ＿＿。", a: "バスで行きます", note: "課本已印的示範"}
      - {q: "もんだいII (1)（美容院で髪を切る→デートの図）デートの前に＿＿。", a: "美容院で髪を切っていきます。"}
      - {q: "もんだいII (2)（時計を見て走る図）遅刻するので、＿＿。", a: "走っていきます。", note: "急いでいきます 也可以"}
      - {q: "もんだいIII 例：ここへ来ます／雑誌を買います・きてください", a: "ここへ来るとき、雑誌を買ってきてください。", note: "課本已印的示範"}
      - {q: "もんだいIII (1) 家へ帰ります／ビールを買います・きてください", a: "家へ帰るとき、ビールを買ってきてください。"}
      - {q: "もんだいIII (2) ここへ来ます／本屋に寄ります・きました", a: "ここへ来るとき、本屋に寄ってきました。"}

  - point: "板書補充①　知る／知っています・知りません vs わかります"
    source: 文法
    key: true
    setsuzoku:
      - "知る＝【瞬間動詞】（像「死ぬ」一樣，一瞬間就完成）"
      - "肯定要用【知っています】（狀態持續）　　○知っています ×知ります"
      - "否定要用【知りません】（事件未發生）　　○知りません ×知っていません"
      - "過去的否定：【知りませんでした】（＝原本不知道，現在知道了）"
      - "わかる 則是普通的【わかります／わかりません／わかりました】"
    explain: |
      【板書】老師另外補的一組，最容易錯：
      「知る」是**瞬間動詞**（跟「死ぬ」同類），所以肯定一定要用**ている形**表示狀態持續；
      但否定不能用「知っていません」，要用**知りません**（表示那個「知道」的事件還沒發生）。
      而「わかる」不是瞬間動詞，正常變化就好。
      ⚠️ 板書特別提醒：回答別人問你「知道嗎」，答否定時常用**知りませんでした**（原來不知道，你一講我才知道）。
    table:
      caption: "板書：知る／わかる 的答法"
      headers: ["問句", "肯定", "否定"]
      rows:
        - ["{{陳|ちん}}さんが{{来週|らいしゅう}}{{結婚|けっこん}}することを{{知|し}}っていますか。", "はい、[知っています]。", "いいえ、[知りませんでした]。"]
        - ["{{私|わたし}}の{{話|はなし}}がわかりますか。", "はい、[わかります]。", "いいえ、わかりません。"]
        - ["{{説明書|せつめいしょ}}の{{内容|ないよう}}がわかりましたか。", "はい、[わかりました]。", "いいえ、わかりません。"]
    examples:
      - {jp: "陳さんが 来週 結婚することを 知っていますか。", kana: "ちんさんが らいしゅう けっこんする ことを しっていますか。", zh: "你知道陳先生下星期要結婚嗎？（板書）"}
      - {jp: "いいえ、知りませんでした。", kana: "いいえ、しりませんでした。", zh: "不，我不知道（＝原本不知道）。（板書）"}
      - {jp: "説明書の 内容が わかりましたか。", kana: "せつめいしょの ないようが わかりましたか。", zh: "說明書的內容你看懂了嗎？（板書）"}
    practice_note: "板書（3組・照板書原樣）"
    practice:
      - {q: "陳さんが来週結婚することを知っていますか。→（肯定・否定）", a: "はい、知っています。／いいえ、知りませんでした。"}
      - {q: "私の話がわかりますか。→（肯定・否定）", a: "はい、わかります。／いいえ、わかりません。"}
      - {q: "説明書の内容がわかりましたか。→（肯定・否定）", a: "はい、わかりました。／いいえ、わかりません。", note: "板書另註「※わかりましたよ」"}

  - point: "板書補充②　〜と言う／〜という（說是…、叫做…）"
    source: 文法
    explain: |
      【板書】〜と言う ⇒ 說是、叫做…（引用）；〜という。＝說話（本身）。
      這其實是第25課文型四「格助詞と」的延續：把別人說的話用「と」引用起來，再接「言う」。
      板書例：彼は今日来ないと言いました。（注意引用的部分用**普通形**：来ない，不是来ません）
    examples:
      - {jp: "彼は 今日 来ないと 言いました。", kana: "かれは きょう こないと いいました。", zh: "他說他今天不來。（板書）"}
      - {jp: "藤原さんという人から 電話が かかってきましたよ。", kana: "ふじわらさんと いう ひとから でんわが かかってきましたよ。", zh: "有位叫藤原的人打電話來喔。（講義⑮）"}
    practice_note: "板書（1題）"
    practice:
      - {q: "彼は今日来ません。→（用〜と言いました引用）", a: "彼は今日来ないと言いました。", note: "引用部分要改成普通形"}

  - point: "板書補充③　なくてはいけません／なければなりません（必須…）"
    source: 文法
    key: true
    setsuzoku:
      - "V（ない形）去い＋【くてはいけません】（行かない→行か【なくてはいけません】）"
      - "V（ない形）去い＋【ければなりません】（行かない→行か【なければなりません】）"
      - "口語常縮成：〜なくちゃ／〜なきゃ（買ってこなきゃ＝買ってこなければならない）"
    explain: |
      【板書】老師把四種「必須」的說法並排寫出來：
      　なくてはいけません（不做…不行）　／　なければいけません（不…的話不行）
      　なくてはなりません　　　　　　　／　なければなりません
      意思幾乎一樣，いけません 偏口語與個別狀況，なりません 偏書面與一般規定。
      課本 P104 的会話「またズボン、買ってこ**なきゃ**」就是「買ってこなければならない」的口語縮約。
      講義⑯「これから覚えて**いかなければならない**ことがたくさんあります」也用到它。
    table:
      caption: "板書：四種「必須」"
      headers: ["形式", "字面", "語感"]
      rows:
        - ["〜なくては[いけません]", "不做…[不行]", "口語・個別狀況"]
        - ["〜なければ[いけません]", "不…的話[不行]", "口語・個別狀況"]
        - ["〜なくては[なりません]", "不做…[不成]", "書面・一般規定"]
        - ["〜なければ[なりません]", "不…的話[不成]", "書面・一般規定"]
    examples:
      - {jp: "試験のとき、何を 持っていかなければなりませんか。", kana: "しけんの とき、なにを もっていかなければ なりませんか。", zh: "考試的時候必須帶什麼去？（講義中翻日8）"}
      - {jp: "これから 覚えていかなければならないことが たくさんあります。", kana: "これから おぼえていかなければ ならない ことが たくさん あります。", zh: "今後必須記起來的事情還有很多。（講義⑯）"}
      - {jp: "また ズボン、買ってこなきゃ。", kana: "また ずぼん、かってこなきゃ。", zh: "又得去買褲子了。（課本P104 会話・口語縮約）"}
    practice_note: "板書＋課本用例（3題）"
    practice:
      - {q: "試験のとき、何を持っていく＿＿か。（必須）", a: "持っていかなければなりません"}
      - {q: "「買ってこなきゃ」を丁寧に言うと？", a: "買ってこなければなりません／買ってこなくてはいけません"}
      - {q: "これから覚えていく＿＿ことがたくさんあります。（必須）", a: "覚えていかなければならない"}

