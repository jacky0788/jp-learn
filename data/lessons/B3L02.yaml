book: 3
lesson: 2
title: 第三冊 第2課（第22課）　船が　見えますか
# 來源：來學日本語 系統進階1 第22課（課本 pp.25-32）＋文法課講義＋會話課板書
#   照片：raw/B3L02/文法課/、raw/B3L02/会話課/
# 主題：可能表現（可能形／見える・聞こえる）。會話課另複習了一些既學文法，新的才收進來。

intro: |
  這一課的核心是「可能表現」——用日語講「會、能、可以」做某件事。

  做法是把動詞變成「可能形」：I類動詞語尾改成え段＋る（話す→話せる、書く→書ける）；
  II類去る＋られる（食べる→食べられる）；III類 する→できる、来る→来られる。
  變成可能形後，原本受詞的助詞「を」通常會改成「が」，例如「日本語を話す」→「日本語が話せる」。

  另外要分清兩組容易混淆的字：
    ・見える／聞こえる：自然而然映入眼簾、傳入耳朵的（不需努力，自動詞）。
    ・見られる／聞ける：在某條件下（時間、工具…）「能夠」看到／聽到（可能動詞）。
  例如「富士山が見える」（看得見）vs「映画が見られる」（能看電影）。

  本課還會用到「〜しか〜ない（只／僅）」和「〜は〜が、〜は〜（對比兩件事）」。

  會話課當天還複習了一些之前學過的句型，其中「新的」也收進這一課（標示為 会話），
  例如：かもしれません（也許）、〜ないで／〜なくて、〜前に／〜た後で、〜まで／〜までに、
  〜ことができます、〜たことがあります、の／こと（名詞化）。

goals:
  - "把動詞正確變成可能形（I/II/III 類）並用「が」表達會/能做某事"
  - "用「〜しか〜ない」表達「只/僅」"
  - "分辨並使用 見える/聞こえる 與 見られる/聞ける"
  - "用「〜は〜が、〜は〜」對比兩件事"
  - "（會話）用 かもしれません、ことができます、たことがあります 等表達"

grammar:
  # ═══════════ 文法課講義 ═══════════
  - point: "文型一　可能表現（可能動詞）"
    source: 文法
    key: true
    setsuzoku:
      - "I類（五段）：語尾う段 → 改え段 ＋ る（話す→話せる、書く→書ける、買う→買える）"
      - "II類（一段）：去る ＋ られる（食べる→食べられる、見る→見られる）"
      - "III類：する→できる、来る→来られる"
      - "助詞變化：可能句中原本表受詞的「を」通常改成「が」（日本語を→日本語が 話せる）"
    explain: |
      表示主語有能力／技術、或在某條件下某動作有實現的可能。
      可能動詞屬「下一段」型活用（〜られる/〜れる）。
    examples:
      - {jp: "わたしは日本語が話せます。", kana: "わたしは にほんごが はなせます。", zh: "我會說日語。"}
      - {jp: "コンビニでお金がおろせます。", kana: "こんびにで おかねが おろせます。", zh: "在便利商店可以提款。"}
    practice:
      # 講義 練習①：基本形 → 可能動詞（變化表）
      - {q: "書く →", a: "書ける", note: "I類"}
      - {q: "泳ぐ →", a: "泳げる", note: "I類"}
      - {q: "話す →", a: "話せる", note: "I類"}
      - {q: "待つ →", a: "待てる", note: "I類"}
      - {q: "死ぬ →", a: "死ねる", note: "I類"}
      - {q: "遊ぶ →", a: "遊べる", note: "I類"}
      - {q: "読む →", a: "読める", note: "I類"}
      - {q: "帰る →", a: "帰れる", note: "I類"}
      - {q: "買う →", a: "買える", note: "I類"}
      - {q: "聞く →", a: "聞ける", note: "I類"}
      - {q: "行く →", a: "行ける", note: "I類"}
      - {q: "走る →", a: "走れる", note: "I類"}
      - {q: "もらう →", a: "もらえる", note: "I類"}
      - {q: "下ろす →", a: "下ろせる", note: "I類"}
      - {q: "入る →", a: "入れる", note: "I類（はいれる）"}
      - {q: "切る →", a: "切れる", note: "I類"}
      - {q: "見る →", a: "見られる", note: "II類"}
      - {q: "食べる →", a: "食べられる", note: "II類"}
      - {q: "教える →", a: "教えられる", note: "II類"}
      - {q: "起きる →", a: "起きられる", note: "II類"}
      - {q: "やめる →", a: "やめられる", note: "II類"}
      - {q: "建てる →", a: "建てられる", note: "II類"}
      - {q: "する →", a: "できる", note: "III類"}
      - {q: "録音する →", a: "録音できる", note: "III類"}
      - {q: "来る →", a: "来られる", note: "III類（こられる）"}
      # 講義 練習②：句子改可能形
      - {q: "ハングル文字を読む →（…が）", a: "ハングル文字が読める"}
      - {q: "一人でも遊ぶゲーム →（…が）", a: "一人でも遊べるゲーム"}
      - {q: "日本語でホテルを予約する →（…が）", a: "日本語でホテルが予約できる"}
      - {q: "お寿司を上手に握る →（…が）", a: "お寿司が上手に握れる"}
      - {q: "朝早く起きない →", a: "朝早く起きられない"}
      - {q: "夜、働かない →", a: "夜、働けない"}

  - point: "文型二　〜しか〜ない（只／僅）"
    source: 文法
    setsuzoku:
      - "N／數量詞 ＋ しか ＋ 〜ない（後面一定接否定）"
    explain: |
      「しか」後面接否定，表示「只有、僅僅」，強調除此之外都沒有／不行。
    examples:
      - {jp: "財布の中に1000円しか入っていない。", kana: "さいふのなかに せんえんしか はいっていない。", zh: "錢包裡只有1000日圓。"}
      - {jp: "わたしは日本語しか話せません。", kana: "わたしは にほんごしか はなせません。", zh: "我只會說日語。"}
      - {jp: "これはここでしか食べられない珍味です。", kana: "これは ここでしか たべられない ちんみです。", zh: "這是只有這裡才吃得到的珍味。"}

  - point: "文型三　〜は〜が、〜は〜（對比）"
    source: 文法
    explain: |
      用兩個「は」把兩件事拿來對比（一個可以/喜歡，另一個不行/不喜歡）。
    examples:
      - {jp: "平仮名は読めますが、カタカナは読めません。", kana: "ひらがなは よめますが、カタカナは よめません。", zh: "平假名讀得懂，但片假名讀不懂。"}
      - {jp: "音楽は得意ですが、スポーツは下手です。", kana: "おんがくは とくいですが、すぽーつは へたです。", zh: "我擅長音樂，但不擅長運動。"}
      - {jp: "東京へは何回か行ったことがありますが、スカイツリーには一度も行ったことがありません。", kana: "とうきょうへは なんかいか いったことが ありますが、すかいつりーには いちども いったことが ありません。", zh: "東京去過幾次，但晴空塔一次都沒去過。"}

  - point: "文型四　〜が見える／〜が聞こえる（vs 見られる／聞ける）"
    source: 文法
    key: true
    setsuzoku:
      - "見える・聞こえる：自動詞，自然映入眼簾／傳入耳朵（不需努力）"
      - "見られる・聞ける：見る・聞く 的可能動詞，在某條件下「能」看／聽"
    explain: |
      見える＝（東西自然）看得見；見られる＝（有條件下）能看到。
      聞こえる＝（聲音自然）聽得見；聞ける＝（有條件下）能聽到。
    examples:
      - {jp: "船が見えますか。―はい、よく見えます。", kana: "ふねが みえますか。―はい、よく みえます。", zh: "看得到船嗎？—嗯，看得很清楚。"}
      - {jp: "音楽室から歌が聞こえます。", kana: "おんがくしつから うたが きこえます。", zh: "從音樂教室傳來歌聲。"}
      - {jp: "最近はいろんな国のテレビ番組が見られます。", kana: "さいきんは いろんなくにの てれびばんぐみが みられます。", zh: "最近能看到各國的電視節目。（有條件→見られる）"}
      - {jp: "今度のコンサートでは『運命』が聞けますよ。", kana: "こんどの こんさーとでは うんめいが きけますよ。", zh: "下次的音樂會能聽到《命運》喔。（有條件→聞ける）"}
    practice:
      - {q: "老眼鏡をかけないと新聞の字が＿＿。（見える）", a: "見えません"}
      - {q: "電車の窓から田んぼや川が＿＿。（見える）", a: "見える"}
      - {q: "北海道へ行ったら、ラベンダーの花畑が＿＿。（見られる）", a: "見られる"}
      - {q: "田舎に住んでいるので、朝、鳥の鳴き声が＿＿。（聞こえる）", a: "聞こえます"}
      - {q: "CDプレイヤーが壊れているので、音楽が＿＿。（聞こえる）", a: "聞こえません"}
      - {q: "今日の交流会では、いろいろな意見が＿＿て、よかった。（聞ける）", a: "聞け"}

  # ═══════════ 會話課（新內容；んです・意向形等與第23課重複者略過）═══════════
  - point: "〔会話〕〜かもしれません（也許、可能）"
    source: 会話
    setsuzoku:
      - "V／い形／な形／N 的常体 ＋ かもしれません（な形・N 不加だ）"
    explain: |
      表示說話者的推測「也許…、說不定…」，不確定但有可能。
    examples:
      - {jp: "飛行機に遅れるかもしれません。", kana: "ひこうきに おくれるかもしれません。", zh: "也許會趕不上飛機。"}
      - {jp: "明日はテストがあるかもしれません。", kana: "あしたは てすとが あるかもしれません。", zh: "明天說不定有考試。"}

  - point: "〔会話〕〜ないで／〜なくて 的差別"
    source: 会話
    explain: |
      Vないで＋動作：在「沒做前項」的狀態下做後項（ごはんを食べないで、会社へ行く＝沒吃飯就去公司）。
      Vなくて＋結果/狀態：因為「沒做前項」而造成後項（ごはんを食べなくて、おなかがすいた）。
      請求別人「不要做」用「〜ないでください」。
    examples:
      - {jp: "ごはんを食べないで、会社へ行きます。", kana: "ごはんを たべないで、かいしゃへ いきます。", zh: "不吃飯就去公司。"}
      - {jp: "笑わないでください。", kana: "わらわないでください。", zh: "請不要笑。"}

  - point: "〔会話〕〜前に／〜た後で（之前／之後）"
    source: 会話
    setsuzoku:
      - "V（辭書形）＋ 前に（做…之前）"
      - "V（た形）＋ 後で（做…之後）"
    explain: |
      表動作的先後順序。前に 前面用辭書形；後で 前面用た形。
    examples:
      - {jp: "温泉に入る前に、シャワーを浴びてください。", kana: "おんせんに はいるまえに、しゃわーを あびてください。", zh: "泡溫泉前請先沖澡。"}
      - {jp: "シャワーを浴びた後で、温泉に入ってください。", kana: "しゃわーを あびたあとで、おんせんに はいってください。", zh: "沖澡之後再泡溫泉。"}

  - point: "〔会話〕〜まで／〜までに（持續到／期限前）"
    source: 会話
    explain: |
      まで：動作「持續」到某時間點（10時まで起きています＝醒著到10點）。
      までに：在某時間點「之前」完成某瞬間動作（10時までに起きてください＝10點前起床）。
    examples:
      - {jp: "10時まで起きています。", kana: "じゅうじまで おきています。", zh: "（一直）醒到10點。"}
      - {jp: "10時までに起きてください。", kana: "じゅうじまでに おきてください。", zh: "請在10點前起床。"}

  - point: "〔会話〕〜ことができます／〜たことがあります"
    source: 会話
    setsuzoku:
      - "V（辭書形）＋ ことができます：會、能（＝可能形的另一種說法）"
      - "V（た形）＋ ことがあります：曾經做過（經驗）"
    explain: |
      ことができます 表能力/可能；たことがあります 表「過去的經驗」。
    examples:
      - {jp: "日本語で話すことができます。", kana: "にほんごで はなすことが できます。", zh: "會用日語交談。"}
      - {jp: "お酒を飲んだことがあります。", kana: "おさけを のんだことが あります。", zh: "（曾經）喝過酒。"}

  - point: "〔会話〕の／こと（名詞化）"
    source: 会話
    explain: |
      把動詞句變成名詞。「の」可代表內容、人、物、地點、時間、原因…；多用於「看到/聽到某情景」與口語。
    examples:
      - {jp: "二階にいるのは陳さんです。", kana: "にかいに いるのは ちんさんです。", zh: "在二樓的（人）是陳先生。"}
      - {jp: "子供が遊んでいるのが見える。", kana: "こどもが あそんでいるのが みえる。", zh: "看得到小孩在玩（的情景）。"}

