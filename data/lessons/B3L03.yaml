notes:
  - "本課文法課與會話課進度不同：文法課＝意向形／つもり／予定（課本進度，文型一～四）；會話課另教 んです・ましょうか・そうです・ている間・複合動詞。"
  - "意向形/つもり 兩堂課都複習過 → 標為重點。"
  - "つもり vs 予定：つもり＝個人主觀打算；予定＝較客觀、已排定的計劃。予定 沒有否定說法。"
  - "ようと思う（當下決定）vs ようと思っている（之前就有的、持續的打算，可講別人）。"
  - "んですが／そうです 接續都用『常体（普通形）』，な形與N要加だ（暇だそうです、先生だそうです）。"
