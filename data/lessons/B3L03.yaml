book: 3
lesson: 3
title: 第三冊 第3課（第23課）　卒業したら、日本の会社に勤めるつもりです
# 來源：來學日本語 系統進階1 第23課（課本 pp.43-51）＋文法課講義＋會話課板書
#   文法課照片 raw/B3L03/文法課/　會話課照片 raw/B3L03/会話課/
# 主題：表達意圖與計劃（意向形／つもり／予定）；會話課另教 んです・ましょうか・そうです 等
# 編排：依文法課講義的「文型一～四（接続→説明→例→練習）」結構還原，方便回想上課內容。

intro: |
  這一課的核心是「表達未來的打算、計劃與意圖」——也就是用日語講「我想…／我打算…／我預定…」。

  首先要學「意向形」（V＋う/よう），它是「～ましょう（吧）」的常体（普通形），
  例如「行く→行こう」「食べる→食べよう」。把動詞變成意向形後，就能組出三種講「打算」的說法，
  差別在於「確定程度」由低到高：
    ・〜ようと思う／思っている：最主觀、當下或近期的想法（我想…）
    ・〜つもりです：心裡已經決定的打算（我打算…）
    ・〜予定です：已排定、客觀確定的計劃，常有明確時間（預定…）。
  記住這個「想 < 打算 < 預定」的階梯，是這一課最重要的觀念。

  此外，會話課的進度和文法課不同，另外教了幾個會話常用的表達（在本課標記為「会話」）：
  んです／んですが（說明、開場、帶出請求）、ましょうか（邀約或主動提議）、
  そうです（轉述聽來的消息）、ている間／間に（在…的時候）、以及複合動詞〜合う（互相）。
  意向形和つもり 因為兩堂課都教到，已標為「重點」。

  下面的「文法」依照文法課講義的版面整理：每個文型都有【接続】【説明】【例】【練習】，
  練習就是講義上的題目，可在網頁上隱藏/顯示答案來自我測驗、回想當天上課的內容。

goals:
  - "正確把動詞變成意向形（I/II/III 類）"
  - "用「ようと思う／つもり／予定」依確定程度表達打算與計劃"
  - "用「ないつもり／つもりはありません」表達不打算做某事"
  - "（會話）用「んです／んですが」說明情況或委婉提出請求"
  - "（會話）用「ましょうか」邀約或主動提議、用「そうです」轉述聽說的事"

grammar:
  # ═══════════ 文法課講義 ═══════════
  - point: "文型一　意向形　V＋う／よう"
    source: 文法・会話
    key: true
    setsuzoku:
      - "I類（五段動詞）：語尾う段 → 改「お段」音 ＋ う（行く→行こう、買う→買おう、待つ→待とう）"
      - "III類サ變（する）：し ＋ よう（勉強する→勉強しよう）"
      - "II類（上一段・下一段）・III類カ變（来る）：去 る ＋ よう（食べる→食べよう、来る→来よう）"
    explain: |
      う／よう是「意量助動詞」，接在動詞第一變化後面，本身無語尾變化。
      V2＋ましょう是「～吧」的禮貌說法，V1＋う／よう就是它的普通体（常体）說法。
    examples:
      - {jp: "みんなで拍手しましょう。→ みんなで拍手しよう。", kana: "みんなで はくしゅしましょう。→ みんなで はくしゅしよう。", zh: "大家鼓掌吧。（禮貌→普通形）"}
    practice:
      # 講義 練習①：請在下列動詞後＋う/よう（動詞變化表）
      - {q: "受ける →", a: "受けよう", note: "II類"}
      - {q: "あげる →", a: "あげよう", note: "II類"}
      - {q: "覚える →", a: "覚えよう", note: "II類"}
      - {q: "行く →", a: "行こう", note: "I類"}
      - {q: "休む →", a: "休もう", note: "I類"}
      - {q: "入る →", a: "入ろう", note: "I類"}
      - {q: "勉強する →", a: "勉強しよう", note: "III類"}
      - {q: "集める →", a: "集めよう", note: "II類"}
      - {q: "待つ →", a: "待とう", note: "I類"}
      - {q: "乗る →", a: "乗ろう", note: "I類"}
      - {q: "買う →", a: "買おう", note: "I類"}
      - {q: "やる →", a: "やろう", note: "I類"}
      - {q: "話す →", a: "話そう", note: "I類"}
      - {q: "調べる →", a: "調べよう", note: "II類"}
      - {q: "来る →", a: "来よう", note: "III類（こよう）"}
      - {q: "見る →", a: "見よう", note: "II類"}
      - {q: "引っ越す →", a: "引っ越そう", note: "I類"}
      - {q: "泳ぐ →", a: "泳ごう", note: "I類"}
      - {q: "死ぬ →", a: "死のう", note: "I類"}
      - {q: "遊ぶ →", a: "遊ぼう", note: "I類"}
      - {q: "貯金する →", a: "貯金しよう", note: "III類"}
      - {q: "起きる →", a: "起きよう", note: "II類"}
      # 講義 練習②：例 みんなで拍手しましょう→拍手しよう（改成意向形普通形）
      - {q: "① さあ、帰りましょう →", a: "帰ろう"}
      - {q: "② あそこで、写真を撮りましょう →", a: "撮ろう"}
      - {q: "③ この川で泳ぎましょう →", a: "泳ごう"}
      - {q: "④ みんなで歌いましょう →", a: "歌おう"}
      - {q: "⑤ あそこの公園で遊びましょう →", a: "遊ぼう"}
      - {q: "⑥ 日本語で話しましょう →", a: "話そう"}
      - {q: "⑦ 十分間休みましょう →", a: "休もう"}
      - {q: "⑧ これ、母にあげましょう →", a: "あげよう"}
      - {q: "⑨ 最後まで面倒を見ましょう →", a: "見よう"}
      - {q: "⑩ 明日の朝から早く起きましょう →", a: "起きよう"}
      - {q: "⑪ この教室に残りましょう →", a: "残ろう"}
      - {q: "⑫ またここに来ましょう →", a: "来よう"}

  - point: "文型二　～う／ようと思う・思っている（打算、想要做）"
    source: 文法
    setsuzoku:
      - "V（意向形）＋ と思う：表達說話當下的意志（我（現在）想…）"
      - "V（意向形）＋ と思っている：之前就有、且持續的打算（也可講第三人稱）"
    explain: |
      意向形後加「と思う／と思っている」，表示打算、想要做某事。
      「と思う」偏當下決定；「と思っている」表示已經有一段時間的想法、較持續。
    examples:
      - {jp: "卒業したら、国へ帰ろうと思います。", kana: "そつぎょうしたら、くにへ かえろうと おもいます。", zh: "畢業後，我想回國。"}
      - {jp: "毎朝ジョギングをしようと思っています。", kana: "まいあさ じょぎんぐを しようと おもっています。", zh: "我打算每天早上慢跑。"}
    practice:
      - {q: "① 日本語学校を出たら、日本の大学に＿＿。（入る）", a: "入ろうと思っています"}
      - {q: "② 六時の飛行機に乗るから、今晩は九時に＿＿。（寝る）", a: "寝ようと思います"}
      - {q: "③ 7人乗れる大きい車を＿＿。（買う）", a: "買おうと思っています"}
      - {q: "④ これから自分のために＿＿。（生きる）", a: "生きようと思っています"}
      - {q: "⑤ 毎朝ジョギングを＿＿。（する）", a: "しようと思っています"}
      - {q: "⑥ 定年退職したら、田舎で農作物を＿＿。（育てる）", a: "育てようと思っています"}
      - {q: "⑦ 普段あまり使わないものを全部＿＿。（捨てる）", a: "捨てようと思っています"}
      - {q: "⑧ 夏休みに、ギターを＿＿。（習う）", a: "習おうと思っています"}
      - {q: "⑨ コンビニでアルバイトをして、留学費用を＿＿。（ためる）", a: "ためようと思っています"}
      - {q: "⑩ 実家に帰って、父が経営している店を＿＿。（手伝う）", a: "手伝おうと思っています"}
      - {q: "⑪ 情報科学関係の仕事を＿＿。（探す）", a: "探そうと思っています"}
      - {q: "⑫ 結婚してからも、今の仕事を＿＿。（続ける）", a: "続けようと思っています"}
      - {q: "⑬ アパートを売って、マンションに＿＿。（引っ越す）", a: "引っ越そうと思っています"}
      - {q: "⑭ 自分の日常生活を動画に＿＿。（撮る）", a: "撮ろうと思っています"}
      - {q: "⑮ 痩せるために、会社まで＿＿。（歩いていく）", a: "歩いていこうと思っています"}

  - point: "文型三①　～つもりです（V辭書形）打算、準備"
    source: 文法・会話
    key: true
    setsuzoku:
      - "V（辭書形）＋ つもりです"
    explain: |
      「つもり」是「積もる」的名詞形。表示之前就已經決定的自己的意圖、打算或計畫，
      語氣比「ようと思う」更確定。
    examples:
      - {jp: "卒業したら、日本の会社に勤めるつもりです。", kana: "そつぎょうしたら、にほんの かいしゃに つとめる つもりです。", zh: "畢業後，我打算在日本的公司工作。"}
      - {jp: "週末は友達と買い物したり、食事したりするつもりです。", kana: "しゅうまつは ともだちと かいものしたり、しょくじしたり する つもりです。", zh: "週末我打算和朋友逛街、吃飯。"}
    practice:
      - {q: "なかなかできない家事を＿＿。（します）", a: "するつもりです"}
      - {q: "どこへも行かないで、うちでゆっくり＿＿。（休みます）", a: "休むつもりです"}
      - {q: "② 早稲田大学を＿＿。（受けます）", a: "受けるつもりです"}
      - {q: "（不合格なら）来年また＿＿。（頑張ります）", a: "頑張るつもりです"}
      - {q: "③ 面白いから、来学期も日本語の勉強を＿＿。（続けます）", a: "続けるつもりです"}
      - {q: "④ 入学試験を受けて、大学院に＿＿。（入ります）", a: "入るつもりです"}
      - {q: "（面接を受けて）日本の会社で＿＿。（働きます）", a: "働くつもりです"}
      - {q: "（アルバイトをしながら）公務員の受験勉強を＿＿。（します）", a: "するつもりです"}
      - {q: "⑤ イタリアには二週間ぐらい＿＿。（います）", a: "いるつもりです"}
      - {q: "⑥ 作文の宿題はいつ＿＿か。（出します）", a: "出すつもりです"}
      - {q: "⑦ 妻が買い物している間、スタバで＿＿。（待っています）", a: "待っているつもりです"}

  - point: "文型三②　～ないつもりです／～つもりはありません（不打算）"
    source: 文法
    setsuzoku:
      - "V（ない形）＋ つもりです（打算不做）"
      - "V（辭書形）＋ つもりはありません（完全沒有要做的打算，語氣更強）"
    explain: |
      否定的意圖有兩種說法。「ないつもり」＝打算不做；「つもりはありません」＝沒有要做的打算（更強硬）。
    examples:
      - {jp: "みんなが反対しているのに、私は意見を変えないつもりです。", kana: "みんなが はんたいしているのに、わたしは いけんを かえない つもりです。", zh: "雖然大家都反對，我也不打算改變意見。"}
      - {jp: "私は意見を変えるつもりはありません。", kana: "わたしは いけんを かえる つもりは ありません。", zh: "我沒有要改變意見的打算。"}
    practice:
      - {q: "① 両親と30年も住んでいた古い家を＿＿。（売ります）", a: "売らないつもりです", note: "或：売るつもりはありません"}
      - {q: "② 家族を離れて、海外で＿＿。（働きます）", a: "働かないつもりです", note: "或：働くつもりはありません"}
      - {q: "③ まだ20代なので、しばらく＿＿。（結婚します）", a: "結婚しないつもりです", note: "或：結婚するつもりはありません"}
      - {q: "④ ミスをしたのは私じゃないから、先に＿＿。（謝ります）", a: "謝らないつもりです", note: "或：謝るつもりはありません"}

  - point: "文型四　～予定です／Nの予定です（預定、計劃）"
    source: 文法
    setsuzoku:
      - "【I】V（辭書形）＋ 予定です"
      - "【II】N（動作性名詞）＋ の予定です"
    explain: |
      計劃已經來到執行的階段、即將實行（比つもり更客觀、確定，常有明確時間）。不會出現否定的說法。
    examples:
      # 【I】V4 予定です（講義原例 ①～⑦）
      - {jp: "【I】明日は友達とモールへ買い物に行く予定です。", kana: "あしたは ともだちと もーるへ かいものに いく よていです。", zh: "明天預定和朋友去購物中心買東西。"}
      - {jp: "夏休みにはボランティア活動に出る予定です。", kana: "なつやすみには ぼらんてぃあ かつどうに でる よていです。", zh: "暑假預定參加志工活動。"}
      - {jp: "大学を卒業したら、国へ帰る予定です。", kana: "だいがくを そつぎょうしたら、くにへ かえる よていです。", zh: "大學畢業後預定回國。"}
      - {jp: "私たちは今年の秋に、結婚する予定です。", kana: "わたしたちは ことしの あきに、けっこんする よていです。", zh: "我們預定今年秋天結婚。"}
      - {jp: "来週、家族が日本へ来る予定です。", kana: "らいしゅう、かぞくが にほんへ くる よていです。", zh: "下週家人預定來日本。"}
      - {jp: "明日は朝9時の飛行機に乗る予定です。", kana: "あしたは あさ くじの ひこうきに のる よていです。", zh: "明天預定搭早上9點的飛機。"}
      - {jp: "飛行機はあと1時間で東京に着く予定です。", kana: "ひこうきは あと いちじかんで とうきょうに つく よていです。", zh: "飛機預定再一小時抵達東京。"}
      # 【II】N の予定です（講義原例 ①～⑥）
      - {jp: "【II】次のテストは12月5日の予定です。", kana: "つぎの てすとは じゅうにがつ いつかの よていです。", zh: "下次考試預定在12月5日。"}
      - {jp: "冬休みは2週間の予定です。", kana: "ふゆやすみは にしゅうかんの よていです。", zh: "寒假預定為期兩週。"}
      - {jp: "午後からは大阪へ出張の予定です。", kana: "ごごからは おおさかへ しゅっちょうの よていです。", zh: "下午起預定到大阪出差。"}
      - {jp: "来月から、ほかの部署へ異動の予定です。", kana: "らいげつから、ほかの ぶしょへ いどうの よていです。", zh: "下個月起預定調到其他部門。"}
      - {jp: "3時から、取引先とミーティングの予定です。", kana: "さんじから、とりひきさきと みーてぃんぐの よていです。", zh: "三點起預定和客戶開會。"}
      - {jp: "来年から1年、クルーズ客船で世界一周旅行の予定です。", kana: "らいねんから いちねん、くるーず きゃくせんで せかいいっしゅう りょこうの よていです。", zh: "明年起一年，預定搭郵輪環遊世界一周。"}

  # ═══════════ 會話課（板書，進度與文法課不同） ═══════════
  - point: "〔会話〕～んです／～んですが（說明・確認・前置）"
    source: 会話
    setsuzoku:
      - "V常体（る・た・ない・なかった）＋んです"
      - "い形＋んです；な形・N＋な＋んです"
    explain: |
      ①說明情況、解釋原因（希望對方繼續聽、理解當下狀況）。
      ②詢問、確認（針對某事件想得到詳細回答）。
      ③有求於人、帶出話題時用「～んですが」當開場。
    examples:
      - {jp: "どうしたんですか。元気がありませんね。―頭が痛いんです。", kana: "どうしたんですか。げんきが ありませんね。―あたまが いたいんです。", zh: "怎麼了？看起來沒精神。—我頭痛。"}
      - {jp: "ラーメンを食べたいんですが、いい店を知っていますか。", kana: "らーめんを たべたいんですが、いいみせを しっていますか。", zh: "我想吃拉麵，你知道哪裡有好店嗎？"}
      - {jp: "水が出ないんですが…。（見てくれませんか）", kana: "みずが でないんですが…。", zh: "（不好意思）水流不出來…（可以幫忙看看嗎）"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "（說明原因）どうして遅れたんですか。―電車が＿＿。（遅れる）", a: "遅れたんです", note: "V常体＋んです"}
      - {q: "（確認・N）今日は休み＿＿んですか。", a: "な", note: "N／な形＋な＋んです"}
      - {q: "（前置請求）日本へ留学したい＿＿、相談に乗ってください。", a: "んですが"}

  - point: "〔会話〕～ましょうか（邀請／主動提議）"
    source: 会話
    explain: |
      ①邀請對方一起做（升調，「要不要一起…？」）。②主動提議幫忙（「我來…吧？」）。
      是「ますか」的客氣邀約版，靠語調區分。
    examples:
      - {jp: "一緒に行きましょうか。", kana: "いっしょに いきましょうか。", zh: "要不要一起去？（邀請）"}
      - {jp: "私が手伝いましょうか。", kana: "わたしが てつだいましょうか。", zh: "我來幫忙吧？（主動提議）"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "（邀請一起去）一緒に映画を見に＿＿。（行く）", a: "行きましょうか", note: "邀請"}
      - {q: "（主動提議）荷物が重そうですね。私が＿＿。（持つ）", a: "持ちましょうか", note: "主動提議"}

  - point: "〔会話〕～そうです（伝聞：聽說）"
    source: 会話
    setsuzoku:
      - "V常体／い形／な形だ／Nだ ＋ そうです"
      - "常搭配「Nによると」（根據…）"
    explain: |
      傳達聽來的消息（聽說…）。接續一律用常体（普通形），な形與N要加だ。
    examples:
      - {jp: "天気予報によると、明日は雨が降るそうです。", kana: "てんきよほうに よると、あしたは あめが ふる そうです。", zh: "根據氣象預報，聽說明天會下雨。"}
      - {jp: "田中さんは毎日暇だそうです。", kana: "たなかさんは まいにち ひまだ そうです。", zh: "聽說田中先生每天都很閒。"}
      - {jp: "彼は英語が下手だが、英語の先生だそうです。", kana: "かれは えいごが へただが、えいごの せんせいだ そうです。", zh: "聽說他英文很爛，卻是英文老師。"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "（聽說會下雨）天気予報によると、明日は雨が＿＿。（降る）", a: "降るそうです", note: "V常体＋そうです"}
      - {q: "（な形伝聞）田中さんは料理が＿＿。（上手だ）", a: "上手だそうです", note: "な形＋だ＋そうです"}
      - {q: "（N伝聞）彼は日本語の＿＿。（先生だ）", a: "先生だそうです", note: "N＋だ＋そうです"}

  - point: "〔会話〕V₂ている間／間に（在…的時候、期間）"
    source: 会話
    explain: |
      「間」＝整段期間動作持續；「間に」＝在這段期間內某個時點發生了另一件事。
    examples:
      - {jp: "MRTに乗っている間、いつもスマホで音楽を聞いています。", kana: "えむあーるてぃーに のっているあいだ、いつも すまほで おんがくを きいています。", zh: "搭捷運的時候，總是用手機聽音樂。"}
      - {jp: "部屋で勉強している間に、弟が入ってきました。", kana: "へやで べんきょうしているあいだに、おとうとが はいってきました。", zh: "在房間唸書的時候，弟弟進來了。"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "（整段持續・間）日本にいる＿＿、たくさん旅行したいです。", a: "間", note: "間＝整段期間動作持續"}
      - {q: "（某時點・間に）寝ている＿＿、地震がありました。", a: "間に", note: "間に＝期間內某時點發生另一件事"}

  - point: "〔会話〕複合動詞　V₁ます形＋合う（互相…）"
    source: 会話
    explain: |
      兩個動詞結合，「～合う」表示彼此互相做某動作。
    examples:
      - {jp: "話し合う", kana: "はなしあう", zh: "互相討論、商量"}
      - {jp: "助け合う", kana: "たすけあう", zh: "互相幫助"}
      - {jp: "見合う → 見合い結婚", kana: "みあう → みあいけっこん", zh: "相親 → 相親結婚"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "互相討論：話す＋合う →", a: "話し合う"}
      - {q: "互相幫助：助ける＋合う →", a: "助け合う"}
      - {q: "互相注視（→相親）：見る＋合う →", a: "見合う"}

