  - {jp: "自信", kana: "じしん", zh: "自信", pos: "名詞", source: 文法, ex: {jp: "僕はちょっと自信がありません。", kana: "ぼくは ちょっと じしんが ありません。", zh: "我有點沒自信。"}}
  - {jp: "弁論大会", kana: "べんろんたいかい", zh: "辯論大會", pos: "名詞", source: 文法, ex: {jp: "来月、学校で弁論大会があります。", kana: "らいげつ、がっこうで べんろんたいかいが あります。", zh: "下個月學校有辯論大會。"}}
