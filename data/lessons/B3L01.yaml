book: 3
lesson: 1
title: 第三冊 第1課（第21課）　あしたの朝早くでかけるので、今から準備します
# 來源：來學日本語 基礎進階1 第21課（課本 pp.10-20）＋文法課講義
#   照片：raw/B3L01/文法課/（11張，2026-06-13匯入）
# 主題：ので（原因）／のに（逆接）／なら（提出話題・條件）

intro: |
  這一課教三個把句子連起來的接續詞，都接在「常体（普通形）」後面，重點都在「な形・名詞要加 な／なら」：
  ・〜ので：表原因理由（因為…所以…），比から客觀、語氣柔和有禮。
  ・〜のに：逆接（明明…卻…），表「結果不如預期、違反常理、因果不成立」，常帶不滿、意外的語氣。
  ・〜なら：對方提出某話題後，「如果是那個的話…」提出建議或回應（山田先生なら、教室ですよ）。

  標題頁三個基本句預告全課：
  ・あしたの朝早くでかけるので、今から準備します。（ので）
  ・ワンさんは約束したのに、来ませんでした。（のに）
  ・コーヒーなら、ブラジルです。（なら）

goals:
  - "用「〜ので」客觀地說明原因理由（な形・N＋な＋ので）"
  - "用「〜のに」表達逆接（明明…卻…），含不滿/意外語氣"
  - "用「〜なら」針對對方提到的話題給建議/回應"
  - "記住接續：三者都接常体，但 な形・N 現在肯定要＋な（なら除外）"

grammar:
  - point: "文型一　〜ので（原因・理由：因為…所以…）"
    source: 文法
    key: true
    setsuzoku:
      - "V／い形（常体）＋ので（でかけるので・寝るので・忙しいので）"
      - "な形・N（現在肯定）＋【な】＋ので（ひまなので・雨なので）"
      - "な形・N 的否定・過去同常体（静かではないので・雨だったので）"
    explain: |
      表原因理由。和「から」相比，「ので」較客觀、語氣柔和有禮貌，常用於說明、請求。
      ⚠️ 接續重點：動詞・い形直接接；な形容詞與名詞的「現在肯定」要加 な（ひま→ひまなので、雨→雨なので）。
    table:
      caption: "〜ので 接續（紅色＝容易漏的「な」）"
      headers: ["前接", "現在肯定", "例"]
      rows:
        - ["動詞", "常体＋ので", "{{出|で}}かけるので"]
        - ["い形容詞", "～い＋ので", "{{忙|いそが}}しいので"]
        - ["な形容詞", "語幹＋[な]＋ので", "ひま[な]ので"]
        - ["名詞", "N＋[な]＋ので", "{{雨|あめ}}[な]ので"]
    examples:
      - {jp: "あしたの朝早くでかけるので、今から準備します。", kana: "あしたの あさ はやく でかけるので、いまから じゅんびします。", zh: "因為明天早上要早點出門，現在就開始準備。"}
      - {jp: "今日は疲れたので、早く寝ます。", kana: "きょうは つかれたので、はやく ねます。", zh: "因為今天累了，要早點睡。"}
      - {jp: "暑かったので、クーラーをつけました。", kana: "あつかったので、くーらーを つけました。", zh: "因為很熱，開了冷氣。"}
      - {jp: "今日はひまなので、買い物に行きます。", kana: "きょうは ひまなので、かいものに いきます。", zh: "因為今天有空，要去買東西。（な形＋な）"}
      - {jp: "もう10時なので、そろそろでかけます。", kana: "もう じゅうじなので、そろそろ でかけます。", zh: "已經10點了，差不多該出門了。（N＋な）"}
    practice_note: "課本練習1（句子＋ので）＋練習2（依對話填）"
    practice:
      - {q: "例：（あしたの朝早くでかけます）今から準備します →", a: "でかけるので"}
      - {q: "(1) これから病院へ行きます → ＿＿、タクシーを呼んでください。", a: "行くので"}
      - {q: "(2) 犬を飼っています → ＿＿、毎日散歩します。", a: "飼っているので"}
      - {q: "(3) 今朝5時に起きました → ＿＿、眠いです。", a: "起きたので"}
      - {q: "(4) 朝ご飯を食べませんでした → ＿＿、もうおなかがすきました。", a: "食べなかったので"}
      - {q: "(5) この本はおもしろいです → ＿＿、また借りたいです。", a: "おもしろいので"}
      - {q: "(6) この問題集はあまり難しくないです → ＿＿、一人でできます。", a: "難しくないので"}
      - {q: "(7) このコンピューターは便利です → ＿＿、いつも使っています。", a: "便利なので", note: "な形＋な"}
      - {q: "(8) あの店の店員は親切ではありません → ＿＿、もう行きたくないです。", a: "親切ではないので"}
      - {q: "(9) 雨です → ＿＿、今日は洗濯ができません。", a: "雨なので", note: "N＋な"}
      - {q: "(10) もうすぐ友達の誕生日です → ＿＿、プレゼントを買いに行きます。", a: "誕生日なので", note: "N＋な"}
      - {q: "練2(1) ＿＿ので、授業に遅れました。（熱がある？選句箱）", a: "事故があった", note: "選句箱：依文意"}
      - {q: "練2(2) ＿＿ので、お酒を飲むことができます。", a: "もう20歳な", note: "N＋な"}

  - point: "文型二　〜のに（逆接：明明…卻…）"
    source: 文法
    key: true
    setsuzoku:
      - "V／い形（常体）＋のに（約束したのに・近いのに）"
      - "な形・N（現在肯定）＋【な】＋のに（ひまなのに・日曜日なのに）"
      - "V₂ている＋のに（待っているのに）"
    explain: |
      逆接，「明明…卻…」。手寫筆記三個重點：①因果關係不成立 ②違反常理/常識 ③結果不如預期。
      常帶說話者「不滿、意外、惋惜」的語氣。接續同ので（な形・N＋な）。
    table:
      caption: "〜のに 接續（紅色＝加「な」）"
      headers: ["前接", "現在肯定", "例"]
      rows:
        - ["動詞", "常体＋のに", "{{約束|やくそく}}したのに"]
        - ["い形容詞", "～い＋のに", "{{近|ちか}}いのに"]
        - ["な形容詞", "語幹＋[な]＋のに", "ひま[な]のに"]
        - ["名詞", "N＋[な]＋のに", "{{日曜日|にちようび}}[な]のに"]
    examples:
      - {jp: "ワンさんは約束したのに、来ませんでした。", kana: "わんさんは やくそくしたのに、きませんでした。", zh: "小王明明約好了，卻沒來。"}
      - {jp: "バスを1時間も待っているのに、まだ来ません。", kana: "ばすを いちじかんも まっているのに、まだ きません。", zh: "公車都等了一個小時了，卻還沒來。"}
      - {jp: "わたしの妹は、学校が近いのに、よく遅刻します。", kana: "わたしの いもうとは、がっこうが ちかいのに、よく ちこくします。", zh: "我妹妹明明學校很近，卻常常遲到。"}
      - {jp: "今日はひまだったのに、どこへも行きませんでした。", kana: "きょうは ひまだったのに、どこへも いきませんでした。", zh: "今天明明有空，卻哪裡都沒去。"}
      - {jp: "あしたは日曜日なのに、会社に行かなければなりません。", kana: "あしたは にちようびなのに、かいしゃに いかなければ なりません。", zh: "明天明明是星期日，卻得去公司。（N＋な）"}
    practice_note: "課本練習1（句子＋のに）"
    practice:
      - {q: "例：（ワンさんは約束しました）来ませんでした →", a: "約束したのに"}
      - {q: "(1) お金を入れました → ＿＿、ジュースが出ません。", a: "入れたのに"}
      - {q: "(2) タクシーで来ました → ＿＿、間に合いませんでした。", a: "来たのに"}
      - {q: "(3) 合格すると思いました → ＿＿、不合格でした。", a: "思ったのに"}
      - {q: "(4) 熱があります → ＿＿、海へ行きました。", a: "あるのに"}
      - {q: "(5) この店は値段が高いです → ＿＿、おいしくないです。", a: "高いのに"}
      - {q: "(6) 彼はひまです → ＿＿、手伝ってくれない。", a: "暇なのに", note: "な形＋な"}
      - {q: "(7) 受験生です → ＿＿、今日も遊んでいます。", a: "受験生なのに", note: "N＋な"}
      - {q: "(8) 両親がとても心配しています → ＿＿、うちに電話をしませんでした。", a: "心配しているのに"}
      - {q: "(9) きょう宿題を出さなければなりませんでした → ＿＿、忘れました。", a: "出さなければならなかったのに"}
      - {q: "(10) トマトは食べることができます → ＿＿、トマトジュースは飲むことができません。", a: "できるのに"}

  - point: "文型三　〜なら（提出話題・條件：如果是…的話）"
    source: 文法
    key: true
    setsuzoku:
      - "N／V／い形・な形（常体）＋なら（な形・N 不加だ：山田先生なら）"
    explain: |
      針對對方提出的話題，「如果是那個的話…」給建議或回應。
      ⚠️「なら」前面 な形・N 直接接（不加 な、也不加 だ）：山田先生なら、コーヒーなら。
    table:
      caption: "〜なら（針對話題回應）"
      headers: ["句型", "例", "意思"]
      rows:
        - ["N＋なら", "{{山田|やまだ}}{{先生|せんせい}}なら、{{教室|きょうしつ}}ですよ", "（要找）山田老師的話，在教室喔"]
        - ["N＋なら", "コーヒーなら、ブラジルです", "咖啡的話，（推薦）巴西的"]
        - ["V＋なら", "{{旅行|りょこう}}に行くなら、{{北海道|ほっかいどう}}がいい", "要去旅行的話，北海道不錯"]
    examples:
      - {jp: "山田先生なら、教室ですよ。", kana: "やまだせんせいなら、きょうしつですよ。", zh: "山田老師的話，在教室喔。"}
      - {jp: "コーヒーなら、ブラジルです。", kana: "こーひーなら、ぶらじるです。", zh: "咖啡的話，（首推）巴西的。"}
      - {jp: "スタットさんは帰りましたよ。―スタットさんなら、帰りましたよ。", kana: "すたっとさんは かえりましたよ。―すたっとさんなら、かえりましたよ。", zh: "史塔特先生回去了喔。—史塔特先生的話，他回去了喔。"}
      - {jp: "パソコンを買うなら、ジャパン電気がいいと思う。", kana: "ぱそこんを かうなら、じゃぱんでんきが いいと おもう。", zh: "要買電腦的話，我覺得 Japan 電器不錯。"}
    practice_note: "課本練習1（A問B用なら答）／2（〜なら）／3（依提示）"
    practice:
      - {q: "例：A:スタットさんはいますか。B:（スタットさん）帰りましたよ →", a: "スタットさんなら"}
      - {q: "1(1) A:ワンさんはいますか。B:（ワンさん）図書館です →", a: "ワンさんなら"}
      - {q: "1(2) A:わたしのめがねを知りませんか。B:（めがね）タンスの上にあります →", a: "めがねなら"}
      - {q: "2例：（コーヒー）この店がおいしいです → ＿＿、この店がおいしいです。", a: "コーヒーなら"}
      - {q: "2(1) （旅行）ハワイだよ →", a: "旅行なら"}
      - {q: "2(4) （山）富士山が一番だね →", a: "山なら"}
      - {q: "3例：山田先生はどこですか。→（山田先生・教室）", a: "山田先生なら、教室です"}
      - {q: "3(1) はさみはどこですか。→（はさみ・引き出しの中）", a: "はさみなら、引き出しの中です"}

  - point: "補足　Nでも（縱使…也／舉類似例）"
    source: 文法
    explain: |
      課堂補充（手寫筆記）。「Nでも」兩個用法：
      ①「縱使…也」：表讓步（子供でも分かる＝連小孩也懂）。
      ②舉出一個類似事物當例子：「お茶でも飲みませんか」（要不要喝個茶之類的）。
    examples:
      - {jp: "帰りに、ちょっとお茶でもどうですか。", kana: "かえりに、ちょっと おちゃでも どうですか。", zh: "回去路上，要不要喝杯茶之類的？（舉例）"}
      - {jp: "子供でも、その問題は分かります。", kana: "こどもでも、その もんだいは わかります。", zh: "連小孩也懂那個問題。（縱使…也）"}

notes:
  - "三者接續口訣：都接常体；な形・N 現在肯定→ので/のに 要加 な，なら 不加。"
  - "ので vs から：ので較客觀柔和有禮（請求、說明常用）；から較主觀。"
  - "のに 帶『不滿・意外・惋惜』語氣：①因果不成立 ②違反常理 ③結果不如預期。"
  - "なら＝針對對方提出的話題回應/建議；前面 な形・N 直接接（不加だ）。"

vocab:
  - {jp: "そろそろ", kana: "そろそろ", zh: "差不多該…、就要", pos: "副詞", source: 文法, ex: {jp: "もう10時なので、そろそろでかけます。", kana: "もう じゅうじなので、そろそろ でかけます。", zh: "已經10點了，差不多該出門。"}}
  - {jp: "受け付けます", kana: "うけつけます", zh: "受理、接受（報名）", pos: "動詞II", source: 文法, ex: {jp: "まだ受け付けていますか。", kana: "まだ うけつけて いますか。", zh: "還在受理嗎？"}}
  - {jp: "終了します", kana: "しゅうりょうします", zh: "結束、終了", pos: "動詞III", source: 文法, ex: {jp: "今日の受付は終了しました。", kana: "きょうの うけつけは しゅうりょうしました。", zh: "今天的受理已經結束了。"}}
  - {jp: "失礼します", kana: "しつれいします", zh: "告辭、不好意思", pos: "動詞III", source: 文法, ex: {jp: "用事があるので、そろそろ失礼します。", kana: "ようじが あるので、そろそろ しつれいします。", zh: "因為有事，差不多該告辭了。"}}
  - {jp: "ジョギング", kana: "じょぎんぐ", zh: "慢跑（jogging）", pos: "名詞・動詞III", source: 文法, ex: {jp: "毎日ジョギングを続けているので、調子がいいです。", kana: "まいにち じょぎんぐを つづけているので、ちょうしが いいです。", zh: "因為每天持續慢跑，狀況很好。"}}
  - {jp: "体調", kana: "たいちょう", zh: "身體狀況", pos: "名詞", source: 文法, ex: {jp: "体調はいかがですか。", kana: "たいちょうは いかがですか。", zh: "身體狀況如何？"}}
  - {jp: "心配します", kana: "しんぱいします", zh: "擔心", pos: "動詞III", source: 文法, ex: {jp: "両親が心配しているのに、電話をしませんでした。", kana: "りょうしんが しんぱいしているのに、でんわを しませんでした。", zh: "父母明明很擔心，卻沒打電話。"}}
  - {jp: "遅刻します", kana: "ちこくします", zh: "遲到", pos: "動詞III", source: 文法, ex: {jp: "学校が近いのに、よく遅刻します。", kana: "がっこうが ちかいのに、よく ちこくします。", zh: "明明學校很近，卻常遲到。"}}
  - {jp: "受験生", kana: "じゅけんせい", zh: "考生", pos: "名詞", source: 文法, ex: {jp: "受験生なのに、今日も遊んでいます。", kana: "じゅけんせいなのに、きょうも あそんでいます。", zh: "明明是考生，今天也在玩。"}}
  - {jp: "値段", kana: "ねだん", zh: "價格", pos: "名詞", source: 文法, ex: {jp: "この店は値段が高いのに、おいしくないです。", kana: "このみせは ねだんが たかいのに、おいしくないです。", zh: "這家店明明很貴，卻不好吃。"}}
  - {jp: "不合格", kana: "ふごうかく", zh: "不合格", pos: "名詞", source: 文法, ex: {jp: "合格すると思ったのに、不合格でした。", kana: "ごうかくすると おもったのに、ふごうかくでした。", zh: "本以為會合格，卻不合格。"}}
  - {jp: "息子", kana: "むすこ", zh: "兒子", pos: "名詞", source: 文法, ex: {jp: "{{息子|むすこ}}はもう{{20歳|はたち}}です。", kana: "むすこは もう はたちです。", zh: "兒子已經20歲了。"}}
  - {jp: "なかなか", kana: "なかなか", zh: "（後接否定）不容易、怎麼也（不）", pos: "副詞", source: 文法, ex: {jp: "毎日薬を飲んでいるのに、なかなかよくなりません。", kana: "まいにち くすりを のんでいるのに、なかなか よくなりません。", zh: "明明每天吃藥，卻怎麼也好不了。"}}
