  - {jp: "ごみ箱", kana: "ごみばこ", zh: "垃圾桶", pos: "名詞", source: 文法, ex: {jp: "ごみ箱なら、その机の後ろです。", kana: "ごみばこなら、その つくえの うしろです。", zh: "垃圾桶的話，在那張桌子後面。"}}
  - {jp: "タンス", kana: "たんす", zh: "衣櫥", pos: "名詞", source: 文法, ex: {jp: "めがねなら、タンスの上にあります。", kana: "めがねなら、たんすの うえに あります。", zh: "眼鏡的話，在衣櫥上。"}}
  - {jp: "勧めます", kana: "すすめます", zh: "推薦、建議", pos: "動詞II", source: 文法, ex: {jp: "パソコンなら、ジャパン電気を勧めます。", kana: "ぱそこんなら、じゃぱんでんきを すすめます。", zh: "電腦的話，我推薦 Japan 電器。"}}
