notes:
  - "✅ 本課已上完：文型一 ようです（推量）／補足 みたいだ／文型二 ようにする／文型三 ようになる。"
  - "三個文型一句話分辨：ようです＝好像（推測）；ようにする＝刻意努力做到；ようになる＝自然變化的結果（變得會）。"
  - "接續口訣：な形＋な＋ようだ、N＋の＋ようだ；口語みたいだ→な形語幹・N 直接接（不加の）。"
  - "ようにする 常與「なるべく／できるだけ」合用；持續習慣用「〜ようにしている」；請求對方用「〜ようにしてください」。"
  - "ようになる 多用過去「〜ようになりました」；變得不～用「Vなくなる／Vないようになる」。"
  - "📄 2026-07-17 取得老師「講義填答版」：文型一/二/三 的例句與練習皆改為**官方解答**（不再是我推測的參考解答）。⑨確認為「飲むように」。講義未列⑦。"
