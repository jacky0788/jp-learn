book: 3
lesson: 4
title: 第三冊 第4課（第24課）　あの人は 人間ではないようです
# 來源：來學日本語 基礎進階1 第24課（課本 pp.59-69）＋文法課講義（文型二 pp.5-6）
#   照片：raw/B3L04/文法課/（前半 2026-06-12）、raw/B3L04/後半/（2026-06-14，含文型二・三＋單字 P59-P66）
# ✅ 進度：本課已上完——文型一「ようです」推量／補足「みたいだ」／文型二「〜ようにする」／文型三「〜ようになる」。
#   單字已收齊 P59-P66。

intro: |
  這一課的主題是「よう」。課本標題頁的三個基本句正好預告了整課三個文型：
  ・あの人は人間ではないようです。（文型一　ようです：推量「好像…」）
  ・あしたはなるべく早く来るようにします。（文型二　ようにする：努力做到「設法…」）
  ・日本語が話せるようになりました。（文型三　ようになる：能力／習慣的變化「變得會…」）

  文型一「〜ようです」（推量）＋口語「みたいだ」：
  「ようだ」是な形容詞型助動詞，語尾變化比照な形容詞。用於「非百分之百斷定」的推斷，
  意思是「好像～、似乎～」——根據說話者自己的感覺、看到的跡象、主觀印象做判斷。
  接續是「活用語連體形＋ようだ」，要特別記：な形容詞＋【な】＋ようだ、名詞＋【の】＋ようだ。
  經常和「どうも」「どうやら」（總覺得、看樣子）等副詞一起用。
  口語常用「みたいだ」代替：な形「語幹」直接＋みたいだ、名詞直接＋みたいだ（不加の）。

  文型二「〜ようにする」：以某狀態為目標、盡可能努力去做到，是「下定決心要養成的習慣」。
  ・Vる＋ようにする＝努力去做～；Vない＋ようにする＝努力不要～。
  ・已養成、持續中的習慣用「〜ようにしている」；請求對方時用「〜ようにしてください」。
  ・常與「なるべく／できるだけ」（盡量、盡可能）一起用。

  文型三「〜ようになる」：表示「能力或習慣從無到有的變化」，「變得會…、開始會…」。
  ・可能形＋ようになる＝（原本不會）變得會～；Vる＋ようになる＝（原本不做）變得會去做～。
  ・否定變化用「Vなくなる／Vないようになる」＝變得不～。對照文型二「ようにする」是「刻意努力」，
    文型三「ようになる」是「自然而然的結果變化」。

goals:
  - "文型一：用「活用語連體形＋ようです」依觀察推斷（好像、似乎）；な形＋な、名詞＋の"
  - "口語用「みたいだ」：な形語幹／名詞直接接，不加の"
  - "文型二：用「Vる／Vない＋ようにする」表達努力做到／努力不做；持續習慣用ようにしている"
  - "文型三：用「可能形／Vる＋ようになる」表達能力或習慣的變化（變得會…）"
  - "分清楚：ようにする＝刻意努力；ようになる＝自然變化的結果"

grammar:
  - point: "文型一　〜ようです（推量：好像、似乎）"
    source: 文法
    key: true
    setsuzoku:
      - "活用語連体形 ＋ ようだ／ようです"
      - "V（常体）＋ようだ（来るようだ・来ないようだ・来たようだ・来なかったようだ）"
      - "い形＋ようだ（忙しいようだ・忙しくないようだ・忙しかったようだ）"
      - "な形＋【な】＋ようだ（元気なようだ）；否定・過去同常体（元気ではないようだ）"
      - "N＋【の】＋ようだ（雨のようだ）；否定・過去同常体（雨ではないようだ）"
    explain: |
      『ようだ』是な形容詞型助動詞，語尾變化比照な形容詞。
      用於非百分之百斷定時推斷的說法，「好像～、似乎～」。
      表示根據說話者自己的感覺、主觀的印象而進行的推斷。
      ＊注意①：な形容詞的現在肯定＝な形容詞連體形（〜な）＋ようだ；名詞的現在肯定＝名詞＋の＋ようだ。
      ＊注意②：經常與『どうも』『どうやら』（總覺得、看樣子）等副詞合併使用。
    table:
      caption: "ようだ 接續總表（講義）：紅色＝容易忘的接法"
      headers: ["前接", "現在肯定", "現在否定", "過去肯定／否定"]
      rows:
        - ["動詞", "{{来|く}}るようだ", "{{来|こ}}ないようだ", "{{来|き}}た／{{来|こ}}なかった＋ようだ"]
        - ["い形容詞", "{{忙|いそが}}しいようだ", "忙しくないようだ", "忙しかった／忙しくなかった＋ようだ"]
        - ["な形容詞", "{{元気|げんき}}[な]ようだ", "元気ではないようだ", "元気だった／元気ではなかった＋ようだ"]
        - ["名詞", "{{雨|あめ}}[の]ようだ", "雨ではないようだ", "雨だった／雨ではなかった＋ようだ"]
    examples:
      - {jp: "子どもたちは もう 寝たようです。", kana: "こどもたちは もう ねたようです。", zh: "孩子們好像已經睡了。"}
      - {jp: "そろそろ 会議が 始まるようです。", kana: "そろそろ かいぎが はじまるようです。", zh: "會議好像差不多要開始了。"}
      - {jp: "スタットさんは お酒が 好きなようです。", kana: "すたっとさんは おさけが すきなようです。", zh: "史塔特先生好像喜歡喝酒。（な形＋な）"}
      - {jp: "A：外が 騒がしいですね。　B：自動車事故のようですよ。", kana: "そとが さわがしいですね。／じどうしゃじこの ようですよ。", zh: "A：外面好吵啊。B：好像是車禍喔。（N＋の）"}
      - {jp: "あの人は 人間ではないようです。", kana: "あのひとは にんげんではない ようです。", zh: "那個人好像不是人類。"}
      - {jp: "A：雨が 降ってきましたね。　B：そのようですね。", kana: "あめが ふってきましたね。／そのようですね。", zh: "A：下起雨來了呢。B：好像是這樣呢。"}
      - {jp: "ワンさん、元気がないようですね。―デートがキャンセルになったようですよ。", kana: "わんさん、げんきが ないようですね。―でーとが きゃんせるに なったようですよ。", zh: "小王好像沒精神耶。—好像是約會被取消了喔。（課本対話）"}
    practice_note: "講義 例①〜⑫（依跡象推斷，填〜ようです）"
    practice:
      - {q: "① 隣の部屋から声が聞こえますね。誰か＿＿ようです。（います）", a: "いる"}
      - {q: "② 部屋の電気が消えています。藤原さんはまだ＿＿ようです。（帰っていません）", a: "帰っていない"}
      - {q: "③ このセーターを触ってみて、確かに＿＿ようです。（カシミヤ100%）", a: "カシミヤ100%の", note: "N＋の"}
      - {q: "④ 兄は赤い顔をして帰ってきました。パーティーでたくさん＿＿ようです。（お酒を飲みました）", a: "お酒を飲んだ"}
      - {q: "⑤ その話なら、どうやら前にどこかで聞いたことが＿＿ようです。（あります）", a: "ある"}
      - {q: "⑥ あの家はいつも窓が閉まっているし、電気もついていないから、＿＿ようです。（だれも住んでいません）", a: "だれも住んでいない"}
      - {q: "⑦ たくさん飲みましたね。課長さんはお酒が＿＿ようです。（好きです）", a: "好きな", note: "な形＋な"}
      - {q: "⑧ どうもあの人はこの大学の＿＿ようです。（学生ではありません）", a: "学生ではない"}
      - {q: "⑨ 私が言っていることに興味を持っている人はあまり＿＿ようです。（いません）", a: "いない"}
      - {q: "⑩ 箱の中に入っているのは何ですか。―さあ、分かりませんが、（振ってみる）＿＿ようです。（コインです）", a: "コインの", note: "N＋の"}
      - {q: "⑪ どうも君の（料理の）ほうがもっと＿＿ようです。（おいしいです）", a: "おいしい"}
      - {q: "⑫ 王さんが言ったことはどうやら＿＿ようです。（うそ）", a: "うその", note: "N＋の"}

  - point: "文型一　課本練習（〜ようです）"
    source: 文法
    explain: |
      課本 pp.60-61 的練習：看跡象→用〜ようです推斷。
      練習2 從選項箱挑適當的句子改成〜よう接上。
    practice_note: "練習1（句子改〜ようです）＋ 練習2（依對話選句填空）"
    practice:
      - {q: "練1例：会議室から人が出てきましたね。ミーティングが（終わりました）→", a: "終わったようです"}
      - {q: "練1(1) 音楽や人の声が聞こえますね。となりの部屋でパーティーを（しています）→", a: "しているようです"}
      - {q: "練1(2) ワンさんの部屋は電気がついていませんね。ワンさんは今、部屋に（いません）→", a: "いないようです"}
      - {q: "練1(3) 駅にたくさん人がいますね。電車の事故が（ありました）→", a: "あったようです"}
      - {q: "練1(4) 子どもの部屋が静かになりましたね。子どもはもう（寝ました）→", a: "寝たようです"}
      - {q: "練1(5) みんな大きいスーツケースを持っています。夏休みだから、旅行する人が（多いです）→", a: "多いようです"}
      - {q: "練1(6) キムさんは料理が（苦手です）→", a: "苦手なようです", note: "な形＋な"}
      - {q: "練2例：どうしましたか。―＿＿ようです。（熱があります）", a: "熱がある"}
      - {q: "練2(1) 人が大勢いますね。―だれかが＿＿ようですよ。（ライブをしています）", a: "ライブをしている"}
      - {q: "練2(2) 教室の前に男の人がいましたね。うちの学生ですか。―いいえ、うちの＿＿ようですね。（学生ではありません）", a: "学生ではない"}
      - {q: "練2(3) 山田先生の授業は終わりましたか。―まだ＿＿ようだから、もう少し待ってください。（終わっていません）", a: "終わっていない"}
      - {q: "練2(4) ビルさんは日本料理が何でも好きなんですか。―はい、何でも＿＿ようです。（食べられます）", a: "食べられる"}
      - {q: "練2(5) あの人はすごく＿＿ようですね。―そうですね。またベンツの新車を買ったんですよ。（お金持ちです）", a: "お金持ちの", note: "N＋の"}
      - {q: "練2(6) このテスト、名前がありませんね。ワンさんのでしょうか。―いいえ、＿＿ようです。（ワンさんのではありません）", a: "ワンさんのではない"}
      - {q: "練2(7) 最近今井さんに会った？―ううん、全然。出張で＿＿ようです。（忙しいです）", a: "忙しい"}
      - {q: "HW⑬（中翻日）我外出的期間，好像有人進過我的房間。", a: "私が出かけている間に、だれかが部屋に入ったようです。", note: "參考解答（HW）"}
      - {q: "HW⑭（中翻日）藤木最近常加班，似乎很忙。", a: "藤木さんは最近残業が多くて、忙しいようです。", note: "參考解答（HW）"}
      - {q: "HW⑮（中翻日）院子地上濕濕的，昨夜好像下了一場大雨。", a: "庭の地面が濡れているから、昨夜大雨が降ったようです。", note: "參考解答（HW）"}
      - {q: "HW⑯（中翻日）摩托車倒在路上，警察也來了，好像是車禍。", a: "バイクが道に倒れていて、警察も来ているから、交通事故のようです。", note: "參考解答（HW）・N＋の"}
      - {q: "HW⑰（中翻日）今晚天空中繁星眾多，明天似乎會是好天氣。", a: "今晩は星がたくさん見えるから、明日はいい天気になるようです。", note: "參考解答（HW）"}

  - point: "補足　〜みたいだ（ようだ的口語說法）"
    source: 文法
    setsuzoku:
      - "V・い形（常体）＋ みたいだ（同ようだ）"
      - "な形【語幹】＋ みたいだ（大丈夫みたいだ；×大丈夫なみたいだ）"
      - "N ＋ みたいだ（風邪みたいだ；不加の，×風邪のみたいだ）"
    explain: |
      口語會話中常會以『みたいだ』來代替『ようだ』。
      「みたいだ」同樣是な形容詞型助動詞，但接續略有不同：
      な形容詞的現在肯定＝な形容詞【語幹】＋みたいだ；名詞的現在肯定＝名詞＋みたいだ（不加の）。
    table:
      caption: "ようだ vs みたいだ（接續差異在 な形・名詞）"
      headers: ["前接", "ようだ（書面・鄭重）", "みたいだ（口語）"]
      rows:
        - ["動詞・い形", "{{常体|じょうたい}}＋ようだ", "常体＋みたいだ（相同）"]
        - ["な形容詞", "{{元気|げんき}}[な]＋ようだ", "元気＋みたいだ（語幹直接）"]
        - ["名詞", "{{風邪|かぜ}}[の]＋ようだ", "風邪＋みたいだ（[不加の]）"]
    examples:
      - {jp: "鼻水も出るし、微熱もあるし。―そう？風邪みたいね。", kana: "はなみずも でるし、びねつも あるし。―そう？かぜみたいね。", zh: "又流鼻水又有點發燒。—是喔？好像是感冒呢。（N直接＋みたい）"}
      - {jp: "王さんはもう帰ったみたい、かばんがないから。", kana: "おうさんは もう かえったみたい、かばんが ないから。", zh: "小王好像回去了，因為包包不在。"}
    practice_note: "講義練習①〜④（填〜みたい）"
    practice:
      - {q: "① 鼻水も出るし、微熱もあるし。―そう？＿＿ね。（風邪）", a: "風邪みたい", note: "N直接＋みたい，不加の"}
      - {q: "② 王さんは＿＿、そこから声が聞こえるから。（隣の教室にいます）", a: "隣の教室にいるみたい"}
      - {q: "②' 森田先生の＿＿。宿題を出しに行くと言ってたよ。（事務室に行きました）", a: "事務室に行ったみたい"}
      - {q: "③ 風邪は、もう治ったの？―うん、薬を飲んで、もう＿＿。（大丈夫だ）", a: "大丈夫みたい", note: "な形語幹直接＋みたい"}
      - {q: "④ このスカート、どうかしら？―サイズが＿＿。（合いません）", a: "合わないみたい"}

  - point: "文型二　〜ようにする（努力做到／努力不做）"
    source: 文法
    key: true
    setsuzoku:
      - "V（基本形）＋ ようにする（努力去做～；正面要養成的習慣）"
      - "Vない ＋ ようにする（努力不要～）"
      - "〜ようにしている：已養成、目前持續中的長期習慣"
      - "〜ようにしてください：請（對方）盡量～／盡量不～"
    explain: |
      表示「以某事情的成立為目標，盡可能去努力使其達到」，是一種下定決心要培養的習慣。
      經常與「なるべく」「できるだけ」（盡量、盡可能）等副詞一起用。
      如果是已經在進行中的長期習慣，則用「〜にしている（ようにしている）」的形式。
      也可以用「〜ようにしてください」請求對方盡量做到～／盡量不要～。
      ＊和文型三「ようになる」的差別：ようにする＝自己「刻意努力」去做；ようになる＝「自然變化」的結果。
    table:
      caption: "ようにする 接續（講義 P5）：なるべく／できるだけ＋…ようにする"
      headers: ["接法", "形式", "例"]
      rows:
        - ["努力去做", "V[基本形]＋ようにする", "なるべく早く{{来|く}}る[ように]する"]
        - ["努力不做", "Vない＋ようにする", "{{傘|かさ}}を{{忘|わす}}れない[ように]する"]
        - ["持續的習慣", "〜ようにして[いる]", "{{毎日|まいにち}}{{歩|ある}}くようにして[いる]"]
        - ["請對方做到", "〜ようにして[ください]", "{{遅|おく}}れないようにして[ください]"]
    examples:
      - {jp: "一人暮らしでは、栄養のバランスを取るために、外食しないで、自炊するようにしています。", kana: "ひとりぐらしでは、えいようの ばらんすを とるために、がいしょくしないで、じすいするように しています。", zh: "一個人住，為了攝取營養均衡，我盡量不外食、自己煮。"}
      - {jp: "私は一日に一万歩ほど歩くようにしています。", kana: "わたしは いちにちに いちまんぽほど あるくように しています。", zh: "我每天盡量走一萬步左右。"}
      - {jp: "なるべく人の悪口を言わないようにしましょう。", kana: "なるべく ひとの わるぐちを いわないように しましょう。", zh: "我們盡量不要說別人壞話吧。"}
      - {jp: "これから、ダイエットなので、できるだけ甘いものや揚げ物を食べないようにします。", kana: "これから、だいえっとなので、できるだけ あまいものや あげものを たべないように します。", zh: "接下來要減肥，所以我會盡量不吃甜食和炸物。"}
      - {jp: "明日の会議に遅れないようにしてください。", kana: "あしたの かいぎに おくれないように してください。", zh: "請不要遲到明天的會議。"}
      - {jp: "台所に置いてあるものは自由に使ってください。なるべく、きれいに使うようにしてください。", kana: "だいどころに おいてある ものは じゆうに つかってください。なるべく、きれいに つかうように してください。", zh: "廚房裡放的東西請自由使用。但請盡量用乾淨一點。"}
    practice_note: "講義 例①〜⑥（已示範，見上）＋ 練習⑧〜⑬（⑦未入鏡）。⑩〜⑬為中翻日，附參考解答。"
    practice:
      - {q: "⑧ 習った単語をカードに書いて、＿＿しています。（覚えます）", a: "覚えるように"}
      - {q: "⑨ 猛烈な暑さが続いている夏に、特に室外で働いている人はできるだけ水をたっぷり＿＿してください。（飲みます）", a: "飲むように", note: "講義此格未印提示語，依文意填「飲むように」"}
      - {q: "⑩（中翻日）因為我住的公寓很小，所以盡量不買占空間的家具。（場所を取ります）", a: "私が住んでいるアパートは狭いので、できるだけ場所を取る家具は買わないようにしています。", note: "參考解答"}
      - {q: "⑪（中翻日）去超市、便利商店購物時，盡可能自備環保袋。（エコバッグ、用意する）", a: "スーパーやコンビニで買い物をするときは、なるべくエコバッグを用意するようにしています。", note: "參考解答"}
      - {q: "⑫（中翻日）和人說話時，請盡量看著對方的眼睛，也不要中途插話。（途中、割り込む）", a: "人と話すときは、できるだけ相手の目を見て、途中で割り込まないようにしてください。", note: "參考解答"}
      - {q: "⑬（中翻日）即使是假日，我也盡量不熬夜、不賴床。（朝寝坊、夜更かし）", a: "休日でも、なるべく夜更かしや朝寝坊をしないようにしています。", note: "參考解答"}

  - point: "文型三　〜ようになる（能力・習慣的變化：變得會…）"
    source: 文法
    key: true
    setsuzoku:
      - "V（可能形）＋ ようになる（原本不會→變得會～；能力的變化）"
      - "V（基本形）＋ ようになる（原本不做→變得會去做～；習慣的變化）"
      - "Vなくなる／Vない ＋ ようになる（變得不～）"
      - "句末多用過去式「ようになりました」表示「已經變得…了」"
    explain: |
      表示「能力或習慣從無到有（或從有到無）的變化」，「變得會～、開始會～」。
      最常見的是「可能形＋ようになりました」＝（以前不會）現在變得會了。
      ＊和文型二的差別：ようになる強調「自然而然、結果上的變化」；ようにする強調「刻意努力去做」。
      ＊「習慣になる」也是一種變化，可用「Vる＋ようになる」（例：お酒を飲むようになりました）。
    table:
      caption: "ようになります 接續（課本基本文／句型整理 P69）"
      headers: ["變化類型", "形式", "例（基本文）"]
      rows:
        - ["能力（會了）", "V[可能形]＋ようになる", "{{日本語|にほんご}}が{{話|はな}}せる[ように]なりました"]
        - ["能力（會了）", "V[可能形]＋ようになる", "{{写真|しゃしん}}が{{撮|と}}れる[ように]なりました"]
        - ["習慣（開始做）", "V[基本形]＋ようになる", "お{{酒|さけ}}を{{飲|の}}む[ように]なりました"]
        - ["變得不（消失）", "Vなく＋なる", "お{{酒|さけ}}を{{飲|の}}まなくなりました"]
    examples:
      - {jp: "日本語が話せるようになりました。", kana: "にほんごが はなせるように なりました。", zh: "（變得）會說日語了。"}
      - {jp: "携帯電話で写真が撮れるようになりました。", kana: "けいたいでんわで しゃしんが とれるように なりました。", zh: "變得能用手機拍照了。"}
      - {jp: "日本に来てから、お酒を飲むようになりました。", kana: "にほんに きてから、おさけを のむように なりました。", zh: "來日本之後，變得會喝酒了。"}
      - {jp: "日本へ来たときは納豆が食べられませんでしたが、今は何でも食べられるようになりました。", kana: "にほんへ きたときは なっとうが たべられませんでしたが、いまは なんでも たべられるように なりました。", zh: "剛來日本時不敢吃納豆，現在變得什麼都能吃了。（課本対話）"}
      - {jp: "あまりお酒を飲まないようになったし、タバコも吸わないように努力しているの。", kana: "あまり おさけを のまないように なったし、たばこも すわないように どりょくしているの。", zh: "變得比較不喝酒了，也在努力不抽菸。（対話：ようになる×ようにする並用）"}
    practice_note: "課本 練習1（改ようになりました）／練習2（對話填空）／練習3（習慣的變化）。練2・3的填空附參考解答。"
    practice:
      - {q: "練1例：英語の新聞が読めませんでした。→", a: "英語の新聞が読めるようになりました"}
      - {q: "練1(1) 納豆が食べられませんでした。→", a: "食べられるようになりました"}
      - {q: "練1(2) 上手に絵がかけませんでした。→", a: "かけるようになりました"}
      - {q: "練1(3) 早く話せませんでした。→", a: "話せるようになりました"}
      - {q: "練1(4) 漢字が書けませんでした。→", a: "書けるようになりました"}
      - {q: "練1(5) 折り紙で鶴が折れませんでした。→", a: "折れるようになりました"}
      - {q: "練1(6) 英語でスピーチできませんでした。→", a: "スピーチできるようになりました"}
      - {q: "練1(7) インターネットができませんでした。→", a: "できるようになりました"}
      - {q: "練1(8) 24時間お金がおろせません。→", a: "おろせるようになりました"}
      - {q: "練2例：A：日本語会話は、どうですか。B：だいぶ＿＿なりました。", a: "話せるように"}
      - {q: "練2(1) A：日本語の新聞を読むのはまだ難しいですか。B：ええ、でもかなり＿＿なりました。", a: "読めるように", note: "參考解答"}
      - {q: "練2(2) A：牛乳、嫌いだった？B：うん、最近＿＿なったのよ。", a: "飲めるように", note: "參考解答"}
      - {q: "練2(3) A：足のけがはもういいんですか。B：ええ、少し＿＿なりました。", a: "歩けるように", note: "參考解答"}
      - {q: "練2(4) A：子どものとき、好き嫌いが多かったんですか。B：ええ、でも今は何でも＿＿なりました。", a: "食べられるように", note: "參考解答"}
      - {q: "練2(5) A：近くのスーパーは24時間営業になりましたか。B：ええ、いつでも＿＿なりました。", a: "買い物できるように", note: "參考解答（或：買えるように）"}
      - {q: "練3例：英語を勉強しませんでした。（最近）→", a: "最近英語を勉強するようになりました"}
      - {q: "練3(1) ゴルフをしませんでした。（去年から）→", a: "去年からゴルフをするようになりました"}
      - {q: "練3(2) 納豆を食べませんでした。（最近）→", a: "最近納豆を食べるようになりました"}
      - {q: "練3(3) 運動をしませんでした。（3日前から）→", a: "3日前から運動をするようになりました"}
      - {q: "練3(4) お酒を飲んだことがありませんでした。（会社に入ってから）→", a: "会社に入ってからお酒を飲むようになりました"}

  - point: "会話（課本 P66：ようにする・ようになる 綜合）"
    source: 文法
    explain: |
      課本 P66 的三段会話，把本課三個文型放在真實對話裡使用，適合整段朗讀記語感。
    examples:
      - {jp: "A：スタットさんは？　B：風邪で休みです。　A：そうですか。あまり無理しないように言ってくださいね。", kana: "すたっとさんは？／かぜで やすみです。／そうですか。あまり むりしないように いってくださいね。", zh: "A：史塔特先生呢？B：感冒請假了。A：這樣啊，請（幫我）轉告他不要太勉強喔。"}
      - {jp: "A：赤ちゃん、やっと寝たようですね。　B：ええ、なかなか寝なくて、困ります。　A：起こさないように、静かにしていましょう。", kana: "あかちゃん、やっと ねたようですね。／ええ、なかなか ねなくて、こまります。／おこさないように、しずかに していましょう。", zh: "A：寶寶好像終於睡著了。B：對啊，一直不睡，真傷腦筋。A：為了不吵醒他，我們安靜一點吧。"}
      - {jp: "B：難しいけれど、新聞も読めるようになったし、日本語で冗談も言えるようになったよ。", kana: "むずかしいけれど、しんぶんも よめるように なったし、にほんごで じょうだんも いえるように なったよ。", zh: "（日語學習）雖然難，但變得看得懂報紙了，也能用日語開玩笑了喔。"}
      - {jp: "これからは、日本のことわざがわかるようになりたいな。", kana: "これからは、にほんの ことわざが わかるように なりたいな。", zh: "接下來想變得能懂日本的諺語呢。"}

