book: 3
lesson: 4
title: 第三冊 第4課（第24課）　あの人は 人間ではないようです
# 來源：來學日本語 基礎進階1 第24課（課本 pp.59-61）＋文法課講義 pp.1-4
#   照片：raw/B3L04/文法課/（2026-06-12，本課只上前半）
# ⚠️ 進度：本課先上一半——文型一「ようです」＋補足「みたいだ」。
#   後半（〜ようにします／〜ようになりました 等）上完課後再補進此檔。
#   單字也先收 P59-P61（前半範圍），P62-P66 待後半一併補。

intro: |
  這一課的主題是「よう」。課本標題頁的三個基本句預告了整課內容：
  ・あの人は人間ではないようです。（推量：好像…）
  ・あしたはなるべく早く来るようにします。（ようにする：盡量做到…）
  ・日本語が話せるようになりました。（ようになる：變得會…）

  這次先上前半：文型一「〜ようです」（推量）＋口語說法「みたいだ」。
  「ようだ」是な形容詞型助動詞，語尾變化比照な形容詞。用於「非百分之百斷定」的推斷，
  意思是「好像～、似乎～」——根據說話者自己的感覺、看到的跡象、主觀印象做判斷。
  接續是「活用語連體形＋ようだ」，要特別記：な形容詞＋【な】＋ようだ、名詞＋【の】＋ようだ。
  經常和「どうも」「どうやら」（總覺得、看樣子）等副詞一起用。

  口語會話常用「みたいだ」代替「ようだ」，意思相同但接續略不同：
  な形容詞「語幹」直接＋みたいだ、名詞直接＋みたいだ（不加の）。

goals:
  - "用「活用語連體形＋ようです」依自己的觀察推斷（好像、似乎）"
  - "記住接續重點：な形＋な＋ようだ、名詞＋の＋ようだ"
  - "搭配「どうも／どうやら」加強推測語氣"
  - "口語用「みたいだ」：な形語幹／名詞直接接，不加の"

grammar:
  - point: "文型一　〜ようです（推量：好像、似乎）"
    source: 文法
    key: true
    setsuzoku:
      - "活用語連体形 ＋ ようだ／ようです"
      - "V（常体）＋ようだ（来るようだ・来ないようだ・来たようだ・来なかったようだ）"
      - "い形＋ようだ（忙しいようだ・忙しくないようだ・忙しかったようだ）"
      - "な形＋【な】＋ようだ（元気なようだ）；否定・過去同常体（元気ではないようだ）"
      - "N＋【の】＋ようだ（雨のようだ）；否定・過去同常体（雨ではないようだ）"
    explain: |
      『ようだ』是な形容詞型助動詞，語尾變化比照な形容詞。
      用於非百分之百斷定時推斷的說法，「好像～、似乎～」。
      表示根據說話者自己的感覺、主觀的印象而進行的推斷。
      ＊注意①：な形容詞的現在肯定＝な形容詞連體形（〜な）＋ようだ；名詞的現在肯定＝名詞＋の＋ようだ。
      ＊注意②：經常與『どうも』『どうやら』（總覺得、看樣子）等副詞合併使用。
    table:
      caption: "ようだ 接續總表（講義）：紅色＝容易忘的接法"
      headers: ["前接", "現在肯定", "現在否定", "過去肯定／否定"]
      rows:
        - ["動詞", "{{来|く}}るようだ", "{{来|こ}}ないようだ", "{{来|き}}た／{{来|こ}}なかった＋ようだ"]
        - ["い形容詞", "{{忙|いそが}}しいようだ", "忙しくないようだ", "忙しかった／忙しくなかった＋ようだ"]
        - ["な形容詞", "{{元気|げんき}}[な]ようだ", "元気ではないようだ", "元気だった／元気ではなかった＋ようだ"]
        - ["名詞", "{{雨|あめ}}[の]ようだ", "雨ではないようだ", "雨だった／雨ではなかった＋ようだ"]
    examples:
      - {jp: "子どもたちは もう 寝たようです。", kana: "こどもたちは もう ねたようです。", zh: "孩子們好像已經睡了。"}
      - {jp: "そろそろ 会議が 始まるようです。", kana: "そろそろ かいぎが はじまるようです。", zh: "會議好像差不多要開始了。"}
      - {jp: "スタットさんは お酒が 好きなようです。", kana: "すたっとさんは おさけが すきなようです。", zh: "史塔特先生好像喜歡喝酒。（な形＋な）"}
      - {jp: "A：外が 騒がしいですね。　B：自動車事故のようですよ。", kana: "そとが さわがしいですね。／じどうしゃじこの ようですよ。", zh: "A：外面好吵啊。B：好像是車禍喔。（N＋の）"}
      - {jp: "あの人は 人間ではないようです。", kana: "あのひとは にんげんではない ようです。", zh: "那個人好像不是人類。"}
      - {jp: "A：雨が 降ってきましたね。　B：そのようですね。", kana: "あめが ふってきましたね。／そのようですね。", zh: "A：下起雨來了呢。B：好像是這樣呢。"}
      - {jp: "ワンさん、元気がないようですね。―デートがキャンセルになったようですよ。", kana: "わんさん、げんきが ないようですね。―でーとが きゃんせるに なったようですよ。", zh: "小王好像沒精神耶。—好像是約會被取消了喔。（課本対話）"}
    practice_note: "講義 例①〜⑫（依跡象推斷，填〜ようです）"
    practice:
      - {q: "① 隣の部屋から声が聞こえますね。誰か＿＿ようです。（います）", a: "いる"}
      - {q: "② 部屋の電気が消えています。藤原さんはまだ＿＿ようです。（帰っていません）", a: "帰っていない"}
      - {q: "③ このセーターを触ってみて、確かに＿＿ようです。（カシミヤ100%）", a: "カシミヤ100%の", note: "N＋の"}
      - {q: "④ 兄は赤い顔をして帰ってきました。パーティーでたくさん＿＿ようです。（お酒を飲みました）", a: "お酒を飲んだ"}
      - {q: "⑤ その話なら、どうやら前にどこかで聞いたことが＿＿ようです。（あります）", a: "ある"}
      - {q: "⑥ あの家はいつも窓が閉まっているし、電気もついていないから、＿＿ようです。（だれも住んでいません）", a: "だれも住んでいない"}
      - {q: "⑦ たくさん飲みましたね。課長さんはお酒が＿＿ようです。（好きです）", a: "好きな", note: "な形＋な"}
      - {q: "⑧ どうもあの人はこの大学の＿＿ようです。（学生ではありません）", a: "学生ではない"}
      - {q: "⑨ 私が言っていることに興味を持っている人はあまり＿＿ようです。（いません）", a: "いない"}
      - {q: "⑩ 箱の中に入っているのは何ですか。―さあ、分かりませんが、（振ってみる）＿＿ようです。（コインです）", a: "コインの", note: "N＋の"}
      - {q: "⑪ どうも君の（料理の）ほうがもっと＿＿ようです。（おいしいです）", a: "おいしい"}
      - {q: "⑫ 王さんが言ったことはどうやら＿＿ようです。（うそ）", a: "うその", note: "N＋の"}

  - point: "文型一　課本練習（〜ようです）"
    source: 文法
    explain: |
      課本 pp.60-61 的練習：看跡象→用〜ようです推斷。
      練習2 從選項箱挑適當的句子改成〜よう接上。
    practice_note: "練習1（句子改〜ようです）＋ 練習2（依對話選句填空）"
    practice:
      - {q: "練1例：会議室から人が出てきましたね。ミーティングが（終わりました）→", a: "終わったようです"}
      - {q: "練1(1) 音楽や人の声が聞こえますね。となりの部屋でパーティーを（しています）→", a: "しているようです"}
      - {q: "練1(2) ワンさんの部屋は電気がついていませんね。ワンさんは今、部屋に（いません）→", a: "いないようです"}
      - {q: "練1(3) 駅にたくさん人がいますね。電車の事故が（ありました）→", a: "あったようです"}
      - {q: "練1(4) 子どもの部屋が静かになりましたね。子どもはもう（寝ました）→", a: "寝たようです"}
      - {q: "練1(5) みんな大きいスーツケースを持っています。夏休みだから、旅行する人が（多いです）→", a: "多いようです"}
      - {q: "練1(6) キムさんは料理が（苦手です）→", a: "苦手なようです", note: "な形＋な"}
      - {q: "練2例：どうしましたか。―＿＿ようです。（熱があります）", a: "熱がある"}
      - {q: "練2(1) 人が大勢いますね。―だれかが＿＿ようですよ。（ライブをしています）", a: "ライブをしている"}
      - {q: "練2(2) 教室の前に男の人がいましたね。うちの学生ですか。―いいえ、うちの＿＿ようですね。（学生ではありません）", a: "学生ではない"}
      - {q: "練2(3) 山田先生の授業は終わりましたか。―まだ＿＿ようだから、もう少し待ってください。（終わっていません）", a: "終わっていない"}
      - {q: "練2(4) ビルさんは日本料理が何でも好きなんですか。―はい、何でも＿＿ようです。（食べられます）", a: "食べられる"}
      - {q: "練2(5) あの人はすごく＿＿ようですね。―そうですね。またベンツの新車を買ったんですよ。（お金持ちです）", a: "お金持ちの", note: "N＋の"}
      - {q: "練2(6) このテスト、名前がありませんね。ワンさんのでしょうか。―いいえ、＿＿ようです。（ワンさんのではありません）", a: "ワンさんのではない"}
      - {q: "練2(7) 最近今井さんに会った？―ううん、全然。出張で＿＿ようです。（忙しいです）", a: "忙しい"}
      - {q: "HW⑬（中翻日）我外出的期間，好像有人進過我的房間。", a: "私が出かけている間に、だれかが部屋に入ったようです。", note: "參考解答（HW）"}
      - {q: "HW⑭（中翻日）藤木最近常加班，似乎很忙。", a: "藤木さんは最近残業が多くて、忙しいようです。", note: "參考解答（HW）"}
      - {q: "HW⑮（中翻日）院子地上濕濕的，昨夜好像下了一場大雨。", a: "庭の地面が濡れているから、昨夜大雨が降ったようです。", note: "參考解答（HW）"}
      - {q: "HW⑯（中翻日）摩托車倒在路上，警察也來了，好像是車禍。", a: "バイクが道に倒れていて、警察も来ているから、交通事故のようです。", note: "參考解答（HW）・N＋の"}
      - {q: "HW⑰（中翻日）今晚天空中繁星眾多，明天似乎會是好天氣。", a: "今晩は星がたくさん見えるから、明日はいい天気になるようです。", note: "參考解答（HW）"}

  - point: "補足　〜みたいだ（ようだ的口語說法）"
    source: 文法
    setsuzoku:
      - "V・い形（常体）＋ みたいだ（同ようだ）"
      - "な形【語幹】＋ みたいだ（大丈夫みたいだ；×大丈夫なみたいだ）"
      - "N ＋ みたいだ（風邪みたいだ；不加の，×風邪のみたいだ）"
    explain: |
      口語會話中常會以『みたいだ』來代替『ようだ』。
      「みたいだ」同樣是な形容詞型助動詞，但接續略有不同：
      な形容詞的現在肯定＝な形容詞【語幹】＋みたいだ；名詞的現在肯定＝名詞＋みたいだ（不加の）。
    table:
      caption: "ようだ vs みたいだ（接續差異在 な形・名詞）"
      headers: ["前接", "ようだ（書面・鄭重）", "みたいだ（口語）"]
      rows:
        - ["動詞・い形", "{{常体|じょうたい}}＋ようだ", "常体＋みたいだ（相同）"]
        - ["な形容詞", "{{元気|げんき}}[な]＋ようだ", "元気＋みたいだ（語幹直接）"]
        - ["名詞", "{{風邪|かぜ}}[の]＋ようだ", "風邪＋みたいだ（[不加の]）"]
    examples:
      - {jp: "鼻水も出るし、微熱もあるし。―そう？風邪みたいね。", kana: "はなみずも でるし、びねつも あるし。―そう？かぜみたいね。", zh: "又流鼻水又有點發燒。—是喔？好像是感冒呢。（N直接＋みたい）"}
      - {jp: "王さんはもう帰ったみたい、かばんがないから。", kana: "おうさんは もう かえったみたい、かばんが ないから。", zh: "小王好像回去了，因為包包不在。"}
    practice_note: "講義練習①〜④（填〜みたい）"
    practice:
      - {q: "① 鼻水も出るし、微熱もあるし。―そう？＿＿ね。（風邪）", a: "風邪みたい", note: "N直接＋みたい，不加の"}
      - {q: "② 王さんは＿＿、そこから声が聞こえるから。（隣の教室にいます）", a: "隣の教室にいるみたい"}
      - {q: "②' 森田先生の＿＿。宿題を出しに行くと言ってたよ。（事務室に行きました）", a: "事務室に行ったみたい"}
      - {q: "③ 風邪は、もう治ったの？―うん、薬を飲んで、もう＿＿。（大丈夫だ）", a: "大丈夫みたい", note: "な形語幹直接＋みたい"}
      - {q: "④ このスカート、どうかしら？―サイズが＿＿。（合いません）", a: "合わないみたい"}

vocab:
  # ── P59-P61（前半範圍；P62-P66 待後半補）──
  - {jp: "なるべく", kana: "なるべく", zh: "盡可能、盡量", pos: "副詞", source: 文法, ex: {jp: "あしたはなるべく早く来るようにします。", kana: "あしたは なるべく はやく くるようにします。", zh: "明天我會盡量早點來。"}}
  - {jp: "人間", kana: "にんげん", zh: "人、人類", pos: "名詞", source: 文法, ex: {jp: "あの人は人間ではないようです。", kana: "あのひとは にんげんではない ようです。", zh: "那個人好像不是人類。"}}
  - {jp: "スーツケース", kana: "すーつけーす", zh: "行李箱、旅行用手提箱", pos: "名詞", source: 文法, ex: {jp: "みんな大きいスーツケースを持っています。", kana: "みんな おおきい すーつけーすを もっています。", zh: "大家都拿著大行李箱。"}}
  - {jp: "騒がしい", kana: "さわがしい", zh: "吵鬧的", pos: "い形容詞", source: 文法, ex: {jp: "外が騒がしいですね。", kana: "そとが さわがしいですね。", zh: "外面好吵啊。"}}
  - {jp: "ミーティング", kana: "みーてぃんぐ", zh: "會議（meeting）", pos: "名詞", source: 文法, ex: {jp: "ミーティングが終わったようです。", kana: "みーてぃんぐが おわったようです。", zh: "會議好像結束了。"}}
  - {jp: "もう少し", kana: "もうすこし", zh: "再稍微、再一下", pos: "副詞", source: 文法, ex: {jp: "もう少し待ってください。", kana: "もうすこし まってください。", zh: "請再等一下。"}}
  - {jp: "大勢", kana: "おおぜい", zh: "（人）很多", pos: "名詞・副詞", source: 文法, ex: {jp: "駅に人が大勢いますね。", kana: "えきに ひとが おおぜい いますね。", zh: "車站有好多人呢。"}}
  - {jp: "最近", kana: "さいきん", zh: "最近", pos: "名詞・副詞", source: 文法, ex: {jp: "最近、今井さんに会った？", kana: "さいきん、いまいさんに あった？", zh: "最近有見到今井嗎？"}}
  - {jp: "新車", kana: "しんしゃ", zh: "新車", pos: "名詞", source: 文法, ex: {jp: "またベンツの新車を買ったんですよ。", kana: "また べんつの しんしゃを かったんですよ。", zh: "他又買了賓士的新車喔。"}}
  - {jp: "デート", kana: "でーと", zh: "約會（date）", pos: "名詞", source: 文法, ex: {jp: "デートがキャンセルになったようです。", kana: "でーとが きゃんせるに なったようです。", zh: "約會好像被取消了。"}}
  - {jp: "ベンツ", kana: "べんつ", zh: "賓士轎車（Benz）", pos: "名詞", source: 文法, ex: {jp: "あの人はベンツに乗っています。", kana: "あのひとは べんつに のっています。", zh: "那個人開賓士。"}}
  - {jp: "ライブ", kana: "らいぶ", zh: "現場演出（live）", pos: "名詞", source: 文法, ex: {jp: "だれかがライブをしているようですよ。", kana: "だれかが らいぶを しているようですよ。", zh: "好像有人在開演唱會喔。"}}

notes:
