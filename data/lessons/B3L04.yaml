book: 3
lesson: 4
title: 第三冊 第4課（第24課）　あの人は 人間ではないようです
# 來源：來學日本語 基礎進階1 第24課（課本 pp.59-69）＋文法課講義 pp.1-11（文型一/二/三＋補足＋翻訳作業）
#   照片：raw/B3L04/文法課/（前半 2026-06-12）、raw/B3L04/後半/（2026-06-14，含文型二・三＋單字 P59-P66）
#   講義填答版：raw/B3L04/講義20260717/（2026-07-17，老師填答＋紅字訂正；含文型三講義 P8-9、補足 P10、翻訳作業 P11）
# ✅ 進度：本課已上完——文型一「ようです」推量／補足「みたいだ」／文型二「〜ようにする」／文型三「〜ようになる」。
#   單字已收齊 P59-P66。

intro: |
  這一課的主題是「よう」。課本標題頁的三個基本句正好預告了整課三個文型：
  ・あの人は人間ではないようです。（文型一　ようです：推量「好像…」）
  ・あしたはなるべく早く来るようにします。（文型二　ようにする：努力做到「設法…」）
  ・日本語が話せるようになりました。（文型三　ようになる：能力／習慣的變化「變得會…」）

  文型一「〜ようです」（推量）＋口語「みたいだ」：
  「ようだ」是な形容詞型助動詞，語尾變化比照な形容詞。用於「非百分之百斷定」的推斷，
  意思是「好像～、似乎～」——根據說話者自己的感覺、看到的跡象、主觀印象做判斷。
  接續是「活用語連體形＋ようだ」，要特別記：な形容詞＋【な】＋ようだ、名詞＋【の】＋ようだ。
  經常和「どうも」「どうやら」（總覺得、看樣子）等副詞一起用。
  口語常用「みたいだ」代替：な形「語幹」直接＋みたいだ、名詞直接＋みたいだ（不加の）。

  文型二「〜ようにする」：以某狀態為目標、盡可能努力去做到，是「下定決心要養成的習慣」。
  ・Vる＋ようにする＝努力去做～；Vない＋ようにする＝努力不要～。
  ・已養成、持續中的習慣用「〜ようにしている」；請求對方時用「〜ようにしてください」。
  ・常與「なるべく／できるだけ」（盡量、盡可能）一起用。

  文型三「〜ようになる」：表示「能力或習慣從無到有的變化」，「變得會…、開始會…」。
  ・可能形＋ようになる＝（原本不會）變得會～；Vる＋ようになる＝（原本不做）變得會去做～。
  ・否定變化用「Vなくなる／Vないようになる」＝變得不～。對照文型二「ようにする」是「刻意努力」，
    文型三「ようになる」是「自然而然的結果變化」。

goals:
  - "文型一：用「活用語連體形＋ようです」依觀察推斷（好像、似乎）；な形＋な、名詞＋の"
  - "口語用「みたいだ」：な形語幹／名詞直接接，不加の"
  - "文型二：用「Vる／Vない＋ようにする」表達努力做到／努力不做；持續習慣用ようにしている"
  - "文型三：用「可能形／Vる＋ようになる」表達能力或習慣的變化（變得會…）"
  - "分清楚：ようにする＝刻意努力；ようになる＝自然變化的結果"

grammar:
  - point: "文型一　〜ようです（推量：好像、似乎）"
    source: 文法
    key: true
    setsuzoku:
      - "活用語連体形 ＋ ようだ／ようです"
      - "V（常体）＋ようだ（来るようだ・来ないようだ・来たようだ・来なかったようだ）"
      - "い形＋ようだ（忙しいようだ・忙しくないようだ・忙しかったようだ）"
      - "な形＋【な】＋ようだ（元気なようだ）；否定・過去同常体（元気ではないようだ）"
      - "N＋【の】＋ようだ（雨のようだ）；否定・過去同常体（雨ではないようだ）"
    explain: |
      『ようだ』是な形容詞型助動詞，語尾變化比照な形容詞。
      用於非百分之百斷定時推斷的說法，「好像～、似乎～」。
      表示根據說話者自己的感覺、主觀的印象而進行的推斷。
      ＊注意①：な形容詞的現在肯定＝な形容詞連體形（〜な）＋ようだ；名詞的現在肯定＝名詞＋の＋ようだ。
      ＊注意②：經常與『どうも』『どうやら』（總覺得、看樣子）等副詞合併使用。
    table:
      caption: "ようだ 接續總表（講義）：紅色＝容易忘的接法"
      headers: ["前接", "現在肯定", "現在否定", "過去肯定／否定"]
      rows:
        - ["動詞", "{{来|く}}るようだ", "{{来|こ}}ないようだ", "{{来|き}}た／{{来|こ}}なかった＋ようだ"]
        - ["い形容詞", "{{忙|いそが}}しいようだ", "忙しくないようだ", "忙しかった／忙しくなかった＋ようだ"]
        - ["な形容詞", "{{元気|げんき}}[な]ようだ", "元気ではないようだ", "元気だった／元気ではなかった＋ようだ"]
        - ["名詞", "{{雨|あめ}}[の]ようだ", "雨ではないようだ", "雨だった／雨ではなかった＋ようだ"]
    examples:
      - {jp: "子どもたちは もう 寝たようです。", kana: "こどもたちは もう ねたようです。", zh: "孩子們好像已經睡了。"}
      - {jp: "そろそろ 会議が 始まるようです。", kana: "そろそろ かいぎが はじまるようです。", zh: "會議好像差不多要開始了。"}
      - {jp: "スタットさんは お酒が 好きなようです。", kana: "すたっとさんは おさけが すきなようです。", zh: "史塔特先生好像喜歡喝酒。（な形＋な）"}
      - {jp: "A：外が 騒がしいですね。　B：自動車事故のようですよ。", kana: "そとが さわがしいですね。／じどうしゃじこの ようですよ。", zh: "A：外面好吵啊。B：好像是車禍喔。（N＋の）"}
      - {jp: "あの人は 人間ではないようです。", kana: "あのひとは にんげんではない ようです。", zh: "那個人好像不是人類。"}
      - {jp: "A：雨が 降ってきましたね。　B：そのようですね。", kana: "あめが ふってきましたね。／そのようですね。", zh: "A：下起雨來了呢。B：好像是這樣呢。"}
      - {jp: "ワンさん、元気がないようですね。―デートがキャンセルになったようですよ。", kana: "わんさん、げんきが ないようですね。―でーとが きゃんせるに なったようですよ。", zh: "小王好像沒精神耶。—好像是約會被取消了喔。（課本対話）"}
    practice_note: "講義 例①〜⑫（依跡象推斷，填〜ようです）"
    practice:
      - {q: "① 隣の部屋から声が聞こえますね。誰か＿＿ようです。（います）", a: "いる"}
      - {q: "② 部屋の電気が消えています。藤原さんはまだ＿＿ようです。（帰っていません）", a: "帰っていない"}
      - {q: "③ このセーターを触ってみて、確かに＿＿ようです。（カシミヤ100%）", a: "カシミヤ100%の", note: "N＋の"}
      - {q: "④ 兄は赤い顔をして帰ってきました。パーティーでたくさん＿＿ようです。（お酒を飲みました）", a: "お酒を飲んだ"}
      - {q: "⑤ その話なら、どうやら前にどこかで聞いたことが＿＿ようです。（あります）", a: "ある"}
      - {q: "⑥ あの家はいつも窓が閉まっているし、電気もついていないから、＿＿ようです。（だれも住んでいません）", a: "だれも住んでいない"}
      - {q: "⑦ たくさん飲みましたね。課長さんはお酒が＿＿ようです。（好きです）", a: "好きな", note: "な形＋な"}
      - {q: "⑧ どうもあの人はこの大学の＿＿ようです。（学生ではありません）", a: "学生ではない"}
      - {q: "⑨ 私が言っていることに興味を持っている人はあまり＿＿ようです。（いません）", a: "いない"}
      - {q: "⑩ 箱の中に入っているのは何ですか。―さあ、分かりませんが、（振ってみる）＿＿ようです。（コインです）", a: "コインの", note: "N＋の"}
      - {q: "⑪ どうも君の（料理の）ほうがもっと＿＿ようです。（おいしいです）", a: "おいしい"}
      - {q: "⑫ 王さんが言ったことはどうやら＿＿ようです。（うそ）", a: "うその", note: "N＋の"}

  - point: "文型一　課本練習（〜ようです）"
    source: 文法
    explain: |
      課本 pp.60-61 的練習：看跡象→用〜ようです推斷。
      練習2 從選項箱挑適當的句子改成〜よう接上。
    practice_note: "練習1（句子改〜ようです）＋ 練習2（依對話選句填空）"
    practice:
      - {q: "練1例：会議室から人が出てきましたね。ミーティングが（終わりました）→", a: "終わったようです"}
      - {q: "練1(1) 音楽や人の声が聞こえますね。となりの部屋でパーティーを（しています）→", a: "しているようです"}
      - {q: "練1(2) ワンさんの部屋は電気がついていませんね。ワンさんは今、部屋に（いません）→", a: "いないようです"}
      - {q: "練1(3) 駅にたくさん人がいますね。電車の事故が（ありました）→", a: "あったようです"}
      - {q: "練1(4) 子どもの部屋が静かになりましたね。子どもはもう（寝ました）→", a: "寝たようです"}
      - {q: "練1(5) みんな大きいスーツケースを持っています。夏休みだから、旅行する人が（多いです）→", a: "多いようです"}
      - {q: "練1(6) キムさんは料理が（苦手です）→", a: "苦手なようです", note: "な形＋な"}
      - {q: "練2例：どうしましたか。―＿＿ようです。（熱があります）", a: "熱がある"}
      - {q: "練2(1) 人が大勢いますね。―だれかが＿＿ようですよ。（ライブをしています）", a: "ライブをしている"}
      - {q: "練2(2) 教室の前に男の人がいましたね。うちの学生ですか。―いいえ、うちの＿＿ようですね。（学生ではありません）", a: "学生ではない"}
      - {q: "練2(3) 山田先生の授業は終わりましたか。―まだ＿＿ようだから、もう少し待ってください。（終わっていません）", a: "終わっていない"}
      - {q: "練2(4) ビルさんは日本料理が何でも好きなんですか。―はい、何でも＿＿ようです。（食べられます）", a: "食べられる"}
      - {q: "練2(5) あの人はすごく＿＿ようですね。―そうですね。またベンツの新車を買ったんですよ。（お金持ちです）", a: "お金持ちの", note: "N＋の"}
      - {q: "練2(6) このテスト、名前がありませんね。ワンさんのでしょうか。―いいえ、＿＿ようです。（ワンさんのではありません）", a: "ワンさんのではない"}
      - {q: "練2(7) 最近今井さんに会った？―ううん、全然。出張で＿＿ようです。（忙しいです）", a: "忙しい"}
      - {q: "HW⑬（中翻日）我外出的期間，好像有人進過我的房間。", a: "私が出かけている間に、だれかが（私の）部屋に入ったようです。", note: "老師板書解答・〜間に＝在某段時間之內"}
      - {q: "HW⑭（中翻日）藤木最近常加班，似乎很忙。", a: "藤木さんはこの頃いつも残業しているので、忙しいようです。（＝忙しいみたいだ）", note: "講義官方解答（老師訂正：から→ので）"}
      - {q: "HW⑮（中翻日）院子地上濕濕的，昨夜好像下了一場大雨。", a: "庭の地面が濡れていますから、ゆうべ大雨が降ったようです。", note: "老師板書解答"}
      - {q: "HW⑯（中翻日）摩托車倒在路上，警察也來了，好像是車禍。", a: "バイクが道に倒れているし、警察も来ているし、交通事故のようです。（＝交通事故みたいだ）", note: "老師板書解答・〜し〜し並列＋N＋の"}
      - {q: "HW⑰（中翻日）今晚天空中繁星眾多，明天似乎會是好天氣。", a: "今晩、空に星がたくさん出ていて、明日はいい天気になるようです。（＝たくさんあって）", note: "講義官方解答"}

  - point: "補足　〜みたいだ（ようだ的口語說法）"
    source: 文法
    setsuzoku:
      - "V・い形（常体）＋ みたいだ（同ようだ）"
      - "な形【語幹】＋ みたいだ（大丈夫みたいだ；×大丈夫なみたいだ）"
      - "N ＋ みたいだ（風邪みたいだ；不加の，×風邪のみたいだ）"
    explain: |
      口語會話中常會以『みたいだ』來代替『ようだ』。
      「みたいだ」同樣是な形容詞型助動詞，但接續略有不同：
      な形容詞的現在肯定＝な形容詞【語幹】＋みたいだ；名詞的現在肯定＝名詞＋みたいだ（不加の）。
    table:
      caption: "ようだ vs みたいだ（接續差異在 な形・名詞）"
      headers: ["前接", "ようだ（書面・鄭重）", "みたいだ（口語）"]
      rows:
        - ["動詞・い形", "{{常体|じょうたい}}＋ようだ", "常体＋みたいだ（相同）"]
        - ["な形容詞", "{{元気|げんき}}[な]＋ようだ", "元気＋みたいだ（語幹直接）"]
        - ["名詞", "{{風邪|かぜ}}[の]＋ようだ", "風邪＋みたいだ（[不加の]）"]
    examples:
      - {jp: "鼻水も出るし、微熱もあるし。―そう？風邪みたいね。", kana: "はなみずも でるし、びねつも あるし。―そう？かぜみたいね。", zh: "又流鼻水又有點發燒。—是喔？好像是感冒呢。（N直接＋みたい）"}
      - {jp: "王さんはもう帰ったみたい、かばんがないから。", kana: "おうさんは もう かえったみたい、かばんが ないから。", zh: "小王好像回去了，因為包包不在。"}
    practice_note: "講義練習①〜④（填〜みたい）"
    practice:
      - {q: "① 鼻水も出るし、微熱もあるし。―そう？＿＿ね。（風邪）", a: "風邪みたい", note: "N直接＋みたい，不加の"}
      - {q: "② 王さんは＿＿、そこから声が聞こえるから。（隣の教室にいます）", a: "隣の教室にいるみたい"}
      - {q: "②' 森田先生の＿＿。宿題を出しに行くと言ってたよ。（事務室に行きました）", a: "事務室に行ったみたい"}
      - {q: "③ 風邪は、もう治ったの？―うん、薬を飲んで、もう＿＿。（大丈夫だ）", a: "大丈夫みたい", note: "な形語幹直接＋みたい"}
      - {q: "④ このスカート、どうかしら？―サイズが＿＿。（合いません）", a: "合わないみたい"}

  - point: "文型二　〜ようにする（努力做到／努力不做）"
    source: 文法
    key: true
    setsuzoku:
      - "V（基本形）＋ ようにする（努力去做～；正面要養成的習慣）"
      - "Vない ＋ ようにする（努力不要～）"
      - "〜ようにしている：已養成、目前持續中的長期習慣"
      - "〜ようにしてください：請（對方）盡量～／盡量不～"
    explain: |
      表示「以某事情的成立為目標，盡可能去努力使其達到」，是一種下定決心要培養的習慣。
      經常與「なるべく」「できるだけ」（盡量、盡可能）等副詞一起用。
      如果是已經在進行中的長期習慣，則用「〜にしている（ようにしている）」的形式。
      也可以用「〜ようにしてください」請求對方盡量做到～／盡量不要～。
      ＊和文型三「ようになる」的差別：ようにする＝自己「刻意努力」去做；ようになる＝「自然變化」的結果。
    table:
      caption: "ようにする 接續（講義 P5）：なるべく／できるだけ＋…ようにする"
      headers: ["接法", "形式", "例"]
      rows:
        - ["努力去做", "V[基本形]＋ようにする", "なるべく早く{{来|く}}る[ように]する"]
        - ["努力不做", "Vない＋ようにする", "{{傘|かさ}}を{{忘|わす}}れない[ように]する"]
        - ["持續的習慣", "〜ようにして[いる]", "{{毎日|まいにち}}{{歩|ある}}くようにして[いる]"]
        - ["請對方做到", "〜ようにして[ください]", "{{遅|おく}}れないようにして[ください]"]
    examples:
      - {jp: "一人暮らしでは、栄養のバランスを取るために、外食しないで、自炊するようにしています。", kana: "ひとりぐらしでは、えいようの ばらんすを とるために、がいしょくしないで、じすいするように しています。", zh: "一個人住，為了攝取營養均衡，我盡量不外食、自己煮。"}
      - {jp: "私は一日に一万歩ほど歩くようにしています。", kana: "わたしは いちにちに いちまんぽほど あるくように しています。", zh: "我每天盡量走一萬步左右。"}
      - {jp: "なるべく人の悪口を言わないようにしましょう。", kana: "なるべく ひとの わるぐちを いわないように しましょう。", zh: "我們盡量不要說別人壞話吧。"}
      - {jp: "これから、ダイエットなので、できるだけ甘いものや揚げ物を食べないようにします。", kana: "これから、だいえっとなので、できるだけ あまいものや あげものを たべないように します。", zh: "接下來要減肥，所以我會盡量不吃甜食和炸物。"}
      - {jp: "明日の会議に遅れないようにしてください。", kana: "あしたの かいぎに おくれないように してください。", zh: "請不要遲到明天的會議。"}
      - {jp: "台所に置いてあるものは自由に使ってください。なるべく、きれいに使うようにしてください。", kana: "だいどころに おいてある ものは じゆうに つかってください。なるべく、きれいに つかうように してください。", zh: "廚房裡放的東西請自由使用。但請盡量用乾淨一點。"}
    practice_note: "講義 例①〜⑥＋練習⑧〜⑬（⑦講義未列）。以下為老師講義填答版的官方解答。"
    practice:
      - {q: "① 一人暮らしでは、栄養のバランスを取るために、外食しないで、＿＿しています。（自炊します）", a: "自炊するように", note: "講義官方解答"}
      - {q: "② 私は一日に一万歩ほど＿＿しています。（歩きます）", a: "歩くように", note: "講義官方解答"}
      - {q: "③ なるべく人の悪口を＿＿しましょう。（言います）", a: "言わないように", note: "講義官方解答"}
      - {q: "④ これから、ダイエットなので、できるだけ甘いものや揚げ物を＿＿します。（食べます）", a: "食べないように", note: "講義官方解答"}
      - {q: "⑤ 明日の会議に＿＿ようにしてください。（遅れます）", a: "遅れない", note: "講義官方解答"}
      - {q: "⑥ 台所に置いてあるものは自由に使ってください。なるべく、きれいに＿＿してください。（使います）", a: "使うように", note: "講義官方解答"}
      - {q: "⑧ 習った単語をカードに書いて、＿＿しています。（覚えます）", a: "覚えるように", note: "講義官方解答"}
      - {q: "⑨ 猛烈な暑さが続いている夏に、特に室外で働いている人はできるだけ水をたっぷり＿＿してください。（飲みます）", a: "飲むように", note: "講義官方解答（防熱中症）"}
      - {q: "⑩（中翻日）因為我住的公寓很小，所以盡量不買占空間的家具。（場所を取ります）", a: "（私は）住んでいるマンションが狭いので、場所を取る家具を買わないようにしている。", note: "講義官方解答／老師訂正：狭くて→狭いので（原因理由）"}
      - {q: "⑪（中翻日）去超市、便利商店購物時，盡可能自備環保袋。（エコバッグ、用意する）", a: "スーパーやコンビニへ買い物に行く時（に）、できるだけエコバッグを用意するようにしています。", note: "講義官方解答"}
      - {q: "⑫（中翻日）和人說話時，請盡量看著對方的眼睛，也不要中途插話。（途中、割り込む）", a: "人と話しているときに、なるべく相手の目を見るようにしてください。途中でも、割り込まないようにしてください。", note: "講義官方解答"}
      - {q: "⑬（中翻日）即使是假日，我也盡量不熬夜、不賴床。（朝寝坊、夜更かし）", a: "休日でも、夜更かしや朝寝坊をしないようにしています。", note: "講義官方解答"}
      - {q: "（補充例）明天我會盡量早點來。", a: "明日できるだけ早く来るようにします。", note: "講義手寫補充"}
      - {q: "（補充例）請務必遵守集合時間。", a: "集合時間を守るようにしてください。", note: "講義手寫補充"}
      - {q: "（補充例）我盡量在課後複習當天學到的東西。", a: "授業のあとで、その日に習ったものを復習するようにしています。", note: "講義手寫補充"}

  - point: "文型三　〜ようになる（能力・習慣的變化：變得會…）"
    source: 文法
    key: true
    setsuzoku:
      - "V（可能形）＋ ようになる（原本不會→變得會～；能力的變化）"
      - "V（基本形）＋ ようになる（原本不做→變得會去做～；習慣的變化）"
      - "Vなくなる／Vない ＋ ようになる（變得不～）"
      - "句末多用過去式「ようになりました」表示「已經變得…了」"
    explain: |
      【講義說明】表示轉變的結果，用於動詞時，可以表示「能力」或「習慣」等的轉變。
      通常用於從『不會〜〜變成會〜〜』、從『不做〜〜變成做〜〜』。經常和可能表現一同使用。
      也可以用『〜〜なっている』表示變成某狀態。
      ＊和文型二的差別：ようになる強調「自然而然、結果上的變化」；ようにする強調「刻意努力去做」。
      ⚠️ 時態重點（講義紅字）：
      ・（×）〜ようになります → 這是「未來的狀況」，講已發生的變化時不能用。
      ・（○）〜ようになっています（已變成某狀態）／（○）〜ようになりました（已經變得…了）。
      ⚠️ 能力 vs 習慣：能力用「可能形＋ようになる」；習慣用「原形＋ようになる」。
        例：最近は電子書籍を【読む】ようになっています（習慣・原形○）／【読める】×（這裡不是能力）。
      ＊常一起出現的全面肯定／否定說法：
      ・疑問詞＋も＋否定＝全面否定（何も食べません／どこも行きません）。
      ・疑問詞＋でも＋肯定＝全面肯定（いつでも暇です／どこ（へ）でも行けるようになっています）。
    table:
      caption: "ようになります 接續（課本基本文／句型整理 P69）"
      headers: ["變化類型", "形式", "例（基本文）"]
      rows:
        - ["能力（會了）", "V[可能形]＋ようになる", "{{日本語|にほんご}}が{{話|はな}}せる[ように]なりました"]
        - ["能力（會了）", "V[可能形]＋ようになる", "{{写真|しゃしん}}が{{撮|と}}れる[ように]なりました"]
        - ["習慣（開始做）", "V[基本形]＋ようになる", "お{{酒|さけ}}を{{飲|の}}む[ように]なりました"]
        - ["變得不（消失）", "Vなく＋なる", "お{{酒|さけ}}を{{飲|の}}まなくなりました"]
        - ["[時態]", "×なります／○なっています・なりました", "{{読|よ}}める[ように][なりました]"]
    examples:
      - {jp: "日本語が話せるようになりました。", kana: "にほんごが はなせるように なりました。", zh: "（變得）會說日語了。"}
      - {jp: "携帯電話で写真が撮れるようになりました。", kana: "けいたいでんわで しゃしんが とれるように なりました。", zh: "變得能用手機拍照了。"}
      - {jp: "日本に来てから、お酒を飲むようになりました。", kana: "にほんに きてから、おさけを のむように なりました。", zh: "來日本之後，變得會喝酒了。"}
      - {jp: "日本へ来たときは納豆が食べられませんでしたが、今は何でも食べられるようになりました。", kana: "にほんへ きたときは なっとうが たべられませんでしたが、いまは なんでも たべられるように なりました。", zh: "剛來日本時不敢吃納豆，現在變得什麼都能吃了。（課本対話）"}
      - {jp: "あまりお酒を飲まないようになったし、タバコも吸わないように努力しているの。", kana: "あまり おさけを のまないように なったし、たばこも すわないように どりょくしているの。", zh: "變得比較不喝酒了，也在努力不抽菸。（対話：ようになる×ようにする並用）"}
      - {jp: "近くに市営プールができてから、よく行くようになりました。", kana: "ちかくに しえいぷーるが できてから、よく いくように なりました。", zh: "附近有了市立游泳池之後，變得常去了。（講義例①・習慣）"}
      - {jp: "最近一人でどこ（へ）でも行けるようになっています。", kana: "さいきん ひとりで どこ（へ）でも いけるように なっています。", zh: "最近變得一個人哪裡都能去了。（講義例②・疑問詞＋でも＝全面肯定）"}
      - {jp: "最近は電子書籍を読むようになっています。", kana: "さいきんは でんししょせきを よむように なっています。", zh: "最近變得會看電子書了。（講義例④・習慣用原形，不是読める）"}
    practice_note: "【講義】例①〜④（含A〜F）與⑤〜⑫ 為老師填答的官方解答；後段為課本 練習1／2／3。"
    practice:
      - {q: "【講義】③一年前は日本語が全然わかりませんでしたが、今では A：ラジオの日本語が少し＿＿。（聞き取れます）", a: "聞き取れるようになっています", note: "講義官方解答"}
      - {q: "【講義】③B：日本語で電話が＿＿。（かけられます）", a: "かけられるようになっています", note: "講義官方解答"}
      - {q: "【講義】③C：たくさんの漢字が＿＿。（読めます）", a: "読めるようになりました", note: "講義官方解答"}
      - {q: "【講義】③D：文法がだいたい＿＿。（わかります）", a: "わかるようになりました", note: "講義官方解答"}
      - {q: "【講義】③F：言いたいことが日本語で＿＿。（言えます）", a: "言えるようになっています", note: "講義官方解答"}
      - {q: "【講義】④最近は電子書籍を＿＿なっています。（読みます）", a: "読むように", note: "講義官方解答・習慣用原形（読める×，不是能力）"}
      - {q: "【講義】⑤野球が好きな彼氏ができてから、野球の試合を＿＿。（見ます）", a: "見るようになっています", note: "講義官方解答"}
      - {q: "【講義】⑥前、ぜんぜん運動しなかった娘は最近毎日1時間ぐらい＿＿なりました。（ジョギングをします）", a: "ジョギングをするように", note: "講義官方解答"}
      - {q: "【講義】⑦赤ちゃんはずいぶん活発に＿＿なりました。（動きます）", a: "動くように", note: "講義官方解答・ずいぶん＝非常/相當"}
      - {q: "【講義】⑧この小さな町は、MRTが＿＿なって、便利ですね。（通ります）", a: "通るように", note: "講義官方解答・原因理由"}
      - {q: "【講義】⑨めがねを掛けると、黒板の字がよく＿＿なります。（見えます）", a: "見えるように", note: "講義官方解答・と＝必然的結果"}
      - {q: "【講義】⑩一生懸命に練習した後で、この曲が完璧に＿＿なりました。（弾けます）", a: "弾けるように", note: "講義官方解答"}
      - {q: "【講義】⑪家の息子はうまく英語で外国人と＿＿なりました。（話せます）", a: "話せるように", note: "講義官方解答"}
      - {q: "【講義】⑫日本語が＿＿なってから、授業もだんだん面白くなりました。（わかります）", a: "わかるように", note: "講義官方解答・面白い→面白く＋なりました"}
      - {q: "練1例：英語の新聞が読めませんでした。→", a: "英語の新聞が読めるようになりました"}
      - {q: "練1(1) 納豆が食べられませんでした。→", a: "食べられるようになりました"}
      - {q: "練1(2) 上手に絵がかけませんでした。→", a: "かけるようになりました"}
      - {q: "練1(3) 早く話せませんでした。→", a: "話せるようになりました"}
      - {q: "練1(4) 漢字が書けませんでした。→", a: "書けるようになりました"}
      - {q: "練1(5) 折り紙で鶴が折れませんでした。→", a: "折れるようになりました"}
      - {q: "練1(6) 英語でスピーチできませんでした。→", a: "スピーチできるようになりました"}
      - {q: "練1(7) インターネットができませんでした。→", a: "できるようになりました"}
      - {q: "練1(8) 24時間お金がおろせません。→", a: "おろせるようになりました"}
      - {q: "練2例：A：日本語会話は、どうですか。B：だいぶ＿＿なりました。", a: "話せるように"}
      - {q: "練2(1) A：日本語の新聞を読むのはまだ難しいですか。B：ええ、でもかなり＿＿なりました。", a: "読めるように", note: "參考解答"}
      - {q: "練2(2) A：牛乳、嫌いだった？B：うん、最近＿＿なったのよ。", a: "飲めるように", note: "參考解答"}
      - {q: "練2(3) A：足のけがはもういいんですか。B：ええ、少し＿＿なりました。", a: "歩けるように", note: "參考解答"}
      - {q: "練2(4) A：子どものとき、好き嫌いが多かったんですか。B：ええ、でも今は何でも＿＿なりました。", a: "食べられるように", note: "參考解答"}
      - {q: "練2(5) A：近くのスーパーは24時間営業になりましたか。B：ええ、いつでも＿＿なりました。", a: "買い物できるように", note: "參考解答（或：買えるように）"}
      - {q: "練3例：英語を勉強しませんでした。（最近）→", a: "最近英語を勉強するようになりました"}
      - {q: "練3(1) ゴルフをしませんでした。（去年から）→", a: "去年からゴルフをするようになりました"}
      - {q: "練3(2) 納豆を食べませんでした。（最近）→", a: "最近納豆を食べるようになりました"}
      - {q: "練3(3) 運動をしませんでした。（3日前から）→", a: "3日前から運動をするようになりました"}
      - {q: "練3(4) お酒を飲んだことがありませんでした。（会社に入ってから）→", a: "会社に入ってからお酒を飲むようになりました"}

  - point: "補足　〜ようになる 的兩個限制（講義 P10）"
    source: 文法
    key: true
    setsuzoku:
      - "① 本身就帶「變化」語意的動詞 ✕ ようになる（太る・増える・減る・変わる…）"
      - "② 否定：可能動詞 → 〜なくなる；一般動詞 → 〜なくなる／〜ないようになる"
    explain: |
      【講義補足】兩個容易錯的地方：
      ① **本身就帶有「變化」意思的動詞，不適用「〜ようになる」**。
         例：太る、増える、減る、変わる 等。
         ・（○）この学校の学生が3,000人に増えました。
         ・（×）この学校の学生が3,000人に増えるようになりました。
      ② **否定表現**時：
         ・動詞是「可能動詞」→ 用「〜なくなる」（歩けなくなりました／働けなくなりました）。
         ・動詞是「一般動詞」→ 較常用「〜なくなる」，但也可以用「〜ないようになる」
           （忘れなくなりました／忘れないようになりました 兩者皆可）。
    table:
      caption: "否定的變化：可能動詞 vs 一般動詞（講義 P10）"
      headers: ["動詞種類", "常用形式", "例"]
      rows:
        - ["可能動詞", "〜[なくなる]", "{{歩|ある}}ける→歩け[なく]なりました"]
        - ["可能動詞", "〜[なくなる]", "{{働|はたら}}ける→働け[なく]なりました"]
        - ["一般動詞", "〜なくなる／〜[ないようになる]", "{{忘|わす}}れなくなりました／忘れ[ないように]なりました"]
        - ["[✕ 不適用]", "本身即變化的動詞", "{{増|ふ}}える→[増えました○]／増えるようになりました✕"]
    examples:
      - {jp: "交通事故に遭って、怪我してから、歩けなくなりました。", kana: "こうつうじこに あって、けがしてから、あるけなく なりました。", zh: "遇到車禍受傷之後，變得不能走路了。（可能動詞→なくなる）"}
      - {jp: "年を取ったから、長時間立って働けなくなりました。", kana: "としを とったから、ちょうじかん たって はたらけなく なりました。", zh: "上了年紀，變得無法長時間站著工作了。"}
      - {jp: "大切なことや物を忘れなくなりました。", kana: "たいせつな ことや ものを わすれなく なりました。", zh: "變得不會忘記重要的事情和東西了。（＝忘れないようになりました）"}
      - {jp: "この学校の学生が3,000人に増えました。", kana: "このがっこうの がくせいが さんぜんにんに ふえました。", zh: "這間學校的學生增加到3,000人了。（増える本身即變化，不可說増えるようになりました）"}
    practice_note: "講義補足 例①〜④（官方填答）"
    practice:
      - {q: "① 交通事故に遭って、怪我してから、＿＿なりました。（歩けません）", a: "歩けなく", note: "可能動詞→なくなる"}
      - {q: "② 年を取ったから、長時間立って＿＿なりました。（働けません）", a: "働けなく", note: "可能動詞→なくなる"}
      - {q: "③ 大切なことや物を＿＿。（忘れません）", a: "忘れなくなりました／忘れないようになりました", note: "一般動詞→兩種都可"}
      - {q: "④ 助詞の使い分けを＿＿。（間違えません）", a: "間違えなくなりました／間違えないようになりました", note: "一般動詞→兩種都可"}
      - {q: "（辨別）「この学校の学生が3,000人に増えるようになりました」對嗎？", a: "✕。應說「増えました」", note: "増える本身就是變化動詞"}

  - point: "翻訳作業（請用「〜〜なる」翻譯，講義 P11）"
    source: 文法
    explain: |
      講義 P11 的中翻日作業，6 題都要用「〜〜なる（ようになる／なくなる）」。
      老師未在講義上寫解答，以下為**參考解答**，寫完可對照；若日後老師公布解答以老師為準。
    practice_note: "中翻日 ①〜⑥（參考解答）"
    practice:
      - {q: "①（中翻日）因為打算讀研究所，因此就很少玩遊戲了。", a: "大学院に行くつもりなので、あまりゲームをしなくなりました。", note: "參考解答"}
      - {q: "②（中翻日）自從讀了大學，為了鍛鍊身體，變得經常上健身房。（鍛える、ジム）", a: "大学に入ってから、体を鍛えるために、よくジムに行くようになりました。", note: "參考解答"}
      - {q: "③（中翻日）變得敢吃有放紅蘿蔔的菜。（入る）", a: "にんじんが入っている料理が食べられるようになりました。", note: "參考解答"}
      - {q: "④（中翻日）一歲三個月的兒子會搖搖晃晃地走路了。（よちよち）", a: "一歳三か月の息子がよちよち歩けるようになりました。", note: "參考解答"}
      - {q: "⑤（中翻日）成為社會人士後，會在聚餐時喝點啤酒。（社会人）", a: "社会人になってから、飲み会で少しビールを飲むようになりました。", note: "參考解答"}
      - {q: "⑥（中翻日）最近不戴老花眼鏡就看不清報紙或書上的字。", a: "最近、老眼鏡を掛けないと、新聞や本の字がよく見えなくなりました。", note: "參考解答"}

  - point: "会話（課本 P66：ようにする・ようになる 綜合）"
    source: 文法
    explain: |
      課本 P66 的三段会話，把本課三個文型放在真實對話裡使用，適合整段朗讀記語感。
    examples:
      - {jp: "A：スタットさんは？　B：風邪で休みです。　A：そうですか。あまり無理しないように言ってくださいね。", kana: "すたっとさんは？／かぜで やすみです。／そうですか。あまり むりしないように いってくださいね。", zh: "A：史塔特先生呢？B：感冒請假了。A：這樣啊，請（幫我）轉告他不要太勉強喔。"}
      - {jp: "A：赤ちゃん、やっと寝たようですね。　B：ええ、なかなか寝なくて、困ります。　A：起こさないように、静かにしていましょう。", kana: "あかちゃん、やっと ねたようですね。／ええ、なかなか ねなくて、こまります。／おこさないように、しずかに していましょう。", zh: "A：寶寶好像終於睡著了。B：對啊，一直不睡，真傷腦筋。A：為了不吵醒他，我們安靜一點吧。"}
      - {jp: "B：難しいけれど、新聞も読めるようになったし、日本語で冗談も言えるようになったよ。", kana: "むずかしいけれど、しんぶんも よめるように なったし、にほんごで じょうだんも いえるように なったよ。", zh: "（日語學習）雖然難，但變得看得懂報紙了，也能用日語開玩笑了喔。"}
      - {jp: "これからは、日本のことわざがわかるようになりたいな。", kana: "これからは、にほんの ことわざが わかるように なりたいな。", zh: "接下來想變得能懂日本的諺語呢。"}

  - point: "板書補充（老師複習）：〜間に・疑問詞＋か・〜くなる／〜くする"
    source: 文法
    key: true
    setsuzoku:
      - "V[ている]／N＋の ＋ 間に：在某段持續時間「之內」做了另一件事"
      - "疑問詞＋か：誰か（某人）・何か（某物）・どこか（某處）＝不限定"
      - "イ形語幹＋く＋なる（自然變化・自動）／＋する・煮る等（人為改變・他動）"
    explain: |
      老師複習第24課時補充的三個重點：
      ①「〜間に」：表示「在某段持續的時間之內」發生／做了另一件事。前面常接「Vている」或「Nの」。
        例：（私が）出かけている間に、誰かが部屋に入ったようです。（我外出的期間，好像有人進過房間。）
      ②「疑問詞＋か」＝不限定（某～）：誰か＝某人、何か＝某物、どこか＝某處。
        ＊「誰か行きたいですか」＝是非疑問句（有沒有人想去？回答 はい／いいえ）；
          對比「誰が行きたいですか」＝疑問詞疑問句（是『誰』想去？要回答具體的人）。
      ③ イ形容詞「語幹＋く」後接：＋なる＝自然而然變成（自動）；＋する／煮る 等＝人為使其變成（他動）。
        例：部屋が明るくなる（房間變亮了）／電気をつけて、部屋を明るくする（開燈把房間弄亮）；カレーを甘く煮る（把咖哩煮甜）。
        ＊呼應文型三「ようになる」的「なる＝自然變化」語感，與「する＝刻意」正好對照。
    table:
      caption: "自然變化(なる) vs 人為改變(する)：呼應 ようになる／ようにする"
      headers: ["イ形容詞", "＋なる（自然・自動）", "＋する／煮る（人為・他動）"]
      rows:
        - ["{{明|あか}}るい", "{{部屋|へや}}が明るく[なる]", "部屋を明るく[する]"]
        - ["{{甘|あま}}い", "スープが甘く[なる]", "カレーを甘く[煮る]"]
        - ["（文型對照）", "〜ように[なる]＝變得會（自然）", "〜ように[する]＝設法做（刻意）"]
    examples:
      - {jp: "私が出かけている間に、誰かが部屋に入ったようです。", kana: "わたしが でかけている あいだに、だれかが へやに はいったようです。", zh: "我外出的期間，好像有人進過我的房間。（〜間に）"}
      - {jp: "誰か行きたいですか。―はい、私が行きたいです。", kana: "だれか いきたいですか。―はい、わたしが いきたいです。", zh: "有人想去嗎？—有，我想去。（疑問詞＋か＝是非疑問句）"}
      - {jp: "電気をつけると、部屋が明るくなりました。", kana: "でんきを つけると、へやが あかるく なりました。", zh: "一開燈，房間就變亮了。（く＋なる＝自然變化）"}
      - {jp: "部屋を明るくするために、電気をつけます。", kana: "へやを あかるく するために、でんきを つけます。", zh: "為了把房間弄亮，把燈打開。（く＋する＝人為）"}
    practice_note: "板書補充小練習（填〜間に／疑問詞か／くなる・くする）"
    practice:
      - {q: "①（私が）シャワーを浴びている＿＿、電話が鳴ったようです。（間）", a: "間に", note: "〜間に"}
      - {q: "②「＿＿食べたいですか。」「はい、何か甘いものが食べたいです。」（疑問詞＋か）", a: "何か"}
      - {q: "③ 春になって、だんだん暖かく＿＿きました。（なる）", a: "なって", note: "自然變化"}
      - {q: "④ 部屋が暗いので、電気をつけて明るく＿＿。（する）", a: "します", note: "人為改變"}

  - point: "補足Ⅰ　〜なくて／〜じゃなくて（い形・な形・名詞）"
    source: 文法
    key: true
    setsuzoku:
      - "① 動詞：V1【なくて】／V1【ないで】、〜〜（只有動詞兩種都有）"
      - "② い形容詞：〜【くなくて】、〜〜"
      - "③ な形容詞：〜【では（じゃ）なくて】、〜〜"
      - "④ 名詞：N【では（じゃ）なくて】、〜〜"
    explain: |
      【講義補足 P1-2】⚠️ 首先要知道：**只有「動詞」才有「ないで」跟「なくて」的區分**；
      い形容詞、な形容詞、名詞一律固定使用「〜なくて」。
      非動詞（い形／な形／名詞）的「〜なくて」有三種用法：
      　① 並列（兩件事並排陳述）　② 相對敘述（不是A，而是B）　③ 原因（因為不…，所以…）
    table:
      caption: "〜なくて 的接續（只有動詞才分 ないで／なくて）"
      headers: ["詞類", "形式", "例"]
      rows:
        - ["動詞", "V1[なくて]／V1[ないで]", "{{来|こ}}[なくて]／来[ないで]"]
        - ["い形容詞", "〜[くなくて]", "{{高|たか}}[くなくて]"]
        - ["な形容詞", "〜[では（じゃ）なくて]", "{{便利|べんり}}[じゃなくて]"]
        - ["名詞", "N[では（じゃ）なくて]", "{{市民|しみん}}[じゃなくて]"]
    examples:
      - {jp: "この町は交通が便利じゃなくて、住みにくいです。", kana: "このまちは こうつうが べんりじゃなくて、すみにくいです。", zh: "這個城鎮交通不方便，很難住。（な形・原因）"}
      - {jp: "このファミリーレストランは料理が高くなくて、おいしくて、近くの住民に人気があります。", kana: "この ふぁみりーれすとらんは りょうりが たかくなくて、おいしくて、ちかくの じゅうみんに にんきが あります。", zh: "這家家庭餐廳菜不貴又好吃，很受附近居民歡迎。（い形・並列）"}
      - {jp: "あの若い方は学生じゃなくて、先生ですよ。", kana: "あの わかい かたは がくせいじゃなくて、せんせいですよ。", zh: "那位年輕人不是學生，是老師喔。（名詞・相對敘述）"}
    practice_note: "講義 P1-2 例①〜⑬（①②③為原本已填，其餘為補上的答案）"
    practice:
      - {q: "① この町は交通が＿＿、住みにくいです。（便利だ）", a: "便利じゃなくて", note: "な形→じゃなくて・原因"}
      - {q: "② このファミリーレストランは料理が＿＿、おいしくて、近くの住民に人気があります。（高い）", a: "高くなくて", note: "い形→くなくて・並列"}
      - {q: "③ あなたは＿＿、無料で市立博物館や動物園を見物してはいけません。（市民）", a: "市民じゃなくて", note: "名詞→じゃなくて・原因"}
      - {q: "④ 私は宿題も＿＿、勉強も＿＿授業が好きです。（多い、楽だ）", a: "多くなくて／楽な", note: "第二格直接修飾「授業」→用連體形 楽な"}
      - {q: "④' 佐藤さんはあまり＿＿、私は（彼が）好きじゃありません。（親切だ）", a: "親切じゃなくて", note: "講義此處編號重複（兩個④）"}
      - {q: "⑤ 検査の結果、＿＿安心した。（ガン）", a: "ガンじゃなくて", note: "名詞・原因"}
      - {q: "⑥ 値段も＿＿、味もよくないです。（安い）", a: "安くなくて", note: "い形・並列"}
      - {q: "⑦ 子供は体が＿＿大変だ。（丈夫だ）", a: "丈夫じゃなくて", note: "な形・原因"}
      - {q: "⑧ この店は思ったより＿＿びっくりしました。（高い）", a: "高くなくて", note: "い形・原因"}
      - {q: "⑨ あの若い方は＿＿、先生ですよ。（学生）", a: "学生じゃなくて", note: "名詞・相對敘述"}
      - {q: "⑩ アメリカの大学は入学するのが＿＿、卒業するのがそう簡単じゃありません。（難しい）", a: "難しくなくて", note: "い形・相對敘述"}
      - {q: "⑪ 彼は＿＿背が＿＿お金もないです。（かっこいい、高い）", a: "かっこよくなくて／高くなくて", note: "い形並列（かっこいい→かっこよくなくて）"}
      - {q: "⑫ B：落ち着いて（ください）。あれは＿＿、ピストルのおもちゃですよ。（本物）", a: "本物じゃなくて", note: "名詞・相對敘述"}
      - {q: "⑬ B：家は会社に＿＿通勤時間は1時間もかかるよ。（近い）", a: "近くなくて", note: "い形・原因"}

  - point: "補足Ⅱ　動詞：V1なくて vs V1ないで（五種用法判準）"
    source: 文法
    key: true
    setsuzoku:
      - "(1) 對比 → Vなくて（○）／Vないで（○）※以「なくて」優先"
      - "(2) 原因理由 → V【なくて】（○）"
      - "(3) 附帶狀況（在沒有…的狀況下）→ V【ないで】（○）／なくて（✕）"
      - "(4) 否決前項而採用後項 → V【ないで】（○）／なくて（✕）"
      - "(5) 方法手段 → V【ないで】（○）／なくて（✕）"
      - "(6) 接補助動詞 → V1【ないでください】（○）／V1なくてください（✕）"
    explain: |
      【講義補足 P3-5】動詞才有 なくて／ないで 的分別，判準如下：
      ・「原因理由」原則上用【なくて】。
      ・「附加狀態（附帶狀況）」「方法手段」，或後面要加【補助動詞】時，一定要用【ないで】。
      ・「順序」的用法比較難出現在動詞て形的否定中。
      ＊「Nのために」＝為了〜〜；為了〜〜好。
      ＊「V4ことにする」＝（自己）決定要〜。
    table:
      caption: "動詞 なくて／ないで 對照（講義 P3-5）"
      headers: ["用法", "なくて", "ないで", "例"]
      rows:
        - ["對比", "○（優先）", "○", "{{太郎|たろう}}は{{合格|ごうかく}}し[なくて]、{{次郎|じろう}}は合格した"]
        - ["原因理由", "[○]", "✕", "{{宿題|しゅくだい}}を{{出|だ}}さ[なくて]、{{先生|せんせい}}に{{叱|しか}}られました"]
        - ["附帶狀況", "✕", "[○]", "{{窓|まど}}を{{閉|し}}め[ないで]{{寝|ね}}ました"]
        - ["否決前項採後項", "✕", "[○]", "アメリカに{{行|い}}か[ないで]、イギリスに行くことにした"]
        - ["方法手段", "✕", "[○]", "{{辞書|じしょ}}を{{使|つか}}わ[ないで]{{作文|さくぶん}}を{{書|か}}く"]
        - ["接補助動詞", "✕", "[○]", "{{何|なに}}も{{聞|き}}か[ないでください]"]
    examples:
      - {jp: "太郎は合格しなくて、次郎は合格した。", kana: "たろうは ごうかくしなくて、じろうは ごうかくした。", zh: "太郎沒考上，次郎考上了。（對比・＝合格しないで も可）"}
      - {jp: "本人が来なくて、代理人が現れた。", kana: "ほんにんが こなくて、だいりにんが あらわれた。", zh: "本人沒來，代理人出現了。（對比）"}
      - {jp: "宿題を出さなくて、先生に叱られました。", kana: "しゅくだいを ださなくて、せんせいに しかられました。", zh: "沒交作業，被老師罵了。（原因）"}
      - {jp: "電車に間に合わなくて、授業に遅れてしまいました。", kana: "でんしゃに まにあわなくて、じゅぎょうに おくれて しまいました。", zh: "沒趕上電車，上課遲到了。（原因）"}
      - {jp: "彼がなかなか来なくて心配しています。", kana: "かれが なかなか こなくて しんぱいして います。", zh: "他遲遲不來，我很擔心。（原因）"}
      - {jp: "窓を閉めないで寝ました。", kana: "まどを しめないで ねました。", zh: "沒關窗就睡了。（附帶狀況）"}
      - {jp: "息子は今朝もご飯を食べないで出かけた。", kana: "むすこは けさも ごはんを たべないで でかけた。", zh: "兒子今天早上也沒吃飯就出門了。（附帶狀況）"}
      - {jp: "めがねをかけないで運転するのは危ないですね。", kana: "めがねを かけないで うんてんするのは あぶないですね。", zh: "不戴眼鏡開車很危險呢。（附帶狀況）"}
      - {jp: "予約しないで行ったら、満席で入れなかった。", kana: "よやくしないで いったら、まんせきで はいれなかった。", zh: "沒訂位就去，結果客滿進不去。（附帶狀況）"}
      - {jp: "アメリカに行かないで、イギリスに行くことにした。", kana: "あめりかに いかないで、いぎりすに いくことに した。", zh: "決定不去美國，改去英國。（否決前項採後項・V4ことにする＝決定）"}
      - {jp: "弟は宿題をしないで一日中ゲームをしている。", kana: "おとうとは しゅくだいを しないで いちにちじゅう げーむを している。", zh: "弟弟不寫作業，一整天都在打電動。（否決前項採後項）"}
      - {jp: "健康のために、エレベーターに乗らないで、階段をのぼりましょう。", kana: "けんこうの ために、えれべーたーに のらないで、かいだんを のぼりましょう。", zh: "為了健康，不搭電梯改爬樓梯吧。（Nのために＝為了）"}
      - {jp: "今日はガスの火をつけないで三品の料理を作りました。", kana: "きょうは がすの ひを つけないで さんぴんの りょうりを つくりました。", zh: "今天沒開瓦斯做了三道菜。（方法手段）"}
      - {jp: "時々字幕を見ないでドラマを見ます。", kana: "ときどき じまくを みないで どらまを みます。", zh: "有時不看字幕看日劇。（方法手段）"}
      - {jp: "何も聞かないでください。今、言いたくないです。", kana: "なにも きかないで ください。いま、いいたくないです。", zh: "請什麼都別問，我現在不想說。（補助動詞）"}
      - {jp: "乱暴な言葉は使わないでください。失礼です。", kana: "らんぼうな ことばは つかわないで ください。しつれいです。", zh: "請不要用粗魯的字眼，很失禮。（補助動詞）"}
    practice_note: "判斷該用 なくて 還是 ないで"
    practice:
      - {q: "（原因）宿題を出さ＿＿、先生に叱られました。", a: "なくて", note: "原因理由→なくて"}
      - {q: "（附帶狀況）窓を閉め＿＿寝ました。", a: "ないで", note: "在沒有…的狀況下→ないで"}
      - {q: "（方法手段）辞書を使わ＿＿作文を書いてください。", a: "ないで", note: "方法手段→ないで"}
      - {q: "（否決前項採後項）アメリカに行か＿＿、イギリスに行くことにした。", a: "ないで"}
      - {q: "（接補助動詞）何も聞か＿＿ください。", a: "ないで", note: "×なくてください"}
      - {q: "（對比・兩者皆可但優先用哪個？）太郎は合格し＿＿、次郎は合格した。", a: "なくて", note: "對比兩者皆可，以なくて優先"}
      - {q: "（判準）什麼情況一定要用「ないで」？", a: "附帶狀況／方法手段／否決前項採後項／接補助動詞（ないでください）"}

  - point: "翻譯練習（〜なくて／〜ないで，講義 P6）"
    source: 文法
    explain: |
      講義 P6 的中翻日練習，7 題都要用「〜なくて／〜ないで」。
      老師未在講義上寫解答，以下為**參考解答**；若日後老師公布解答，以老師為準。
      ※講義編號有誤：第 7 題出現兩次，且第一個「7.」與第 4 題完全重複。
    practice_note: "中翻日 1〜7（參考解答）"
    practice:
      - {q: "1.（中翻日）請不要看課本回答。", a: "教科書を見ないで答えてください。", note: "參考解答・方法手段＋ないでください"}
      - {q: "2.（中翻日）我今天沒有搭巴士，而是走路到學校來的。", a: "今日はバスに乗らないで、歩いて学校へ来ました。", note: "參考解答・否決前項採後項"}
      - {q: "3.（中翻日）沒有見到佐藤先生，真是遺憾。（会える）", a: "佐藤さんに会えなくて、残念でした。", note: "參考解答・原因→なくて"}
      - {q: "4.（中翻日）地震時請不要慌張。（慌てる）", a: "地震のときは慌てないでください。", note: "參考解答・補助動詞→ないでください"}
      - {q: "5.（中翻日）這個橘子並不酸很好吃。", a: "このみかんは酸っぱくなくて、おいしいです。", note: "參考解答・い形→くなくて（並列）"}
      - {q: "6.（中翻日）不脫帽就敬禮是不禮貌的事。（とる、脱ぐ、お辞儀をする）", a: "帽子を取らないで（脱がないで）お辞儀をするのは失礼なことです。", note: "參考解答・附帶狀況→ないで"}
      - {q: "7.（中翻日）因為怎麼樣都存不到錢，所以很煩惱。（お金が貯められる、悩む）", a: "どうしてもお金が貯められなくて、悩んでいます。", note: "參考解答・原因→なくて"}

