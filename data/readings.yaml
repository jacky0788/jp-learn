# 人工補充讀音字典：給「沒有 kana 欄」的欄位（練習題／接続／文法點標題／圖解表格）標注音用。
# build.py 會先用全專案例句學到的讀音，查不到才用這裡。
#
# 鍵有兩種：
#   漢字段        → 不管後面接什麼都用這個讀音（適合讀音唯一的詞）
#   漢字段|送假名  → 只有後面接該假名時才用（多讀音的字必須這樣寫，避免標錯）
#
# ⚠️ 讀音會因語境改變、又無法用送假名區分的字（例：間＝あいだ／ま、時＝とき／じ、
#    家＝いえ／うち），**故意不列**——寧可不標，也不要標錯。

# ── 容易被自動判錯、需人工指定的（會覆蓋自動學到的讀音）──
"例": れい           # 「練1例：」的例＝れい（例えば的たと由送假名規則處理）
"時|": とき          # 單獨的「時」＝とき（數字後的時＝じ由量詞規則處理）
# ⚠️「形」在本專案幾乎都是文法術語（て形・た形・ない形＝〜けい），
#    但文章裡有一句「その形（かたち）が変わって」，會讓自動學習誤判成かたち，故在此指定。
"形": けい
"未然形": みぜんけい
"連用形": れんようけい
"仮定形": かていけい
"辞書形": じしょけい
"普通形": ふつうけい
"丁寧形": ていねいけい
"受身形": うけみけい
"使役形": しえきけい
"活用形": かつようけい
"音便": おんびん

# ── 多讀音動詞：用送假名區分 ──
"出|ま": で          # 出ません
"出|な": で          # 出ない
"出|さ": だ          # 出さなければ
"出|し": だ          # 出します
"出|せ": だ          # 出せ
"出|す": だ          # 出すな
"入|れ": い          # 入れました
"入|る": はい        # 入る
"入|り": はい        # 入ります
"入|ら": はい        # 入らない
"会|っ": あ          # 会った
"会|え": あ          # 会える
"会|い": あ          # 会います
"会|わ": あ          # 会わない
"会|で": かい        # 飲み会で
"下|ろ": お          # 下ろす
"生|き": い          # 生きる
"閉|ま": し          # 閉まっている
"閉|め": し          # 閉める
"楽|だ": らく
"楽|な": らく
"楽|し": たの        # 楽しみ
"通|り": とお        # 通ります
"通|る": とお        # 通るように

# ── 讀音唯一的動詞語幹 ──
"貸": か             # 貸します／貸せ／貸すな
"遅": おく           # 遅れる
"行": い             # 行きます／行く
"来": き             # 来ました／来ません（來自ます形系列）
"話": はな           # 話す／話せる
"座": すわ           # 座る／座れ
"覚": おぼ           # 覚える
"握": にぎ           # 握る
"飼": か             # 飼う
"頑張": がんば       # 頑張る

