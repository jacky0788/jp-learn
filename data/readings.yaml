# 人工補充讀音字典：給「沒有 kana 欄」的欄位（練習題／接続／文法點標題／圖解表格）標注音用。
# build.py 會先用全專案例句學到的讀音，查不到才用這裡。
#
# 鍵有兩種：
#   漢字段        → 不管後面接什麼都用這個讀音（適合讀音唯一的詞）
#   漢字段|送假名  → 只有後面接該假名時才用（多讀音的字必須這樣寫，避免標錯）
#
# ⚠️ 讀音會因語境改變、又無法用送假名區分的字（例：間＝あいだ／ま、時＝とき／じ、
#    家＝いえ／うち），**故意不列**——寧可不標，也不要標錯。

# ── 容易被自動判錯、需人工指定的（會覆蓋自動學到的讀音）──
"例": れい           # 「練1例：」的例＝れい（例えば的たと由送假名規則處理）
"時|": とき          # 單獨的「時」＝とき（數字後的時＝じ由量詞規則處理）
"話|": はなし        # 單獨的「話」＝はなし（話します的はな由送假名規則處理）
"#組": くみ          # 數字後的量詞「〜組」＝くみ（2組＝にくみ）
# ⚠️「形」在本專案幾乎都是文法術語（て形・た形・ない形＝〜けい），
#    但文章裡有一句「その形（かたち）が変わって」，會讓自動學習誤判成かたち，故在此指定。
"形": けい
# 「行」單獨出現（か行・さ行的行）＝ぎょう；動詞的行く（行き／行く…）由送假名規則處理
"行|": ぎょう         # 單獨的「行」（後面不接假名）
"段": だん
"未然形": みぜんけい
"連用形": れんようけい
"仮定形": かていけい
"辞書形": じしょけい
"普通形": ふつうけい
"丁寧形": ていねいけい
"受身形": うけみけい
"使役形": しえきけい
"活用形": かつようけい
"音便": おんびん

