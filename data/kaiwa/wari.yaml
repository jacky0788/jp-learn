track: 会話
topic: wari
order: 110
label: 割・割引
title: 會話｜〜割／〜割引（成數・折扣）
# 來源：同學會話筆記

intro: |
  ・〜割（わり）＝十分之幾：1割＝10%、9割＝90%。
  ・〜割引（わりびき）＝打折，指「減掉」的部分。
  ⚠️ 台日相反：日語「1割引」＝便宜10%＝台灣的「打9折」；
     日語「9割引」＝便宜90%＝台灣的「打1折」。算折扣時特別注意。

goals:
  - "用「〜割」表達成數（1割＝10%）"
  - "看懂「〜割引」並換算成台灣的「打X折」（方向相反）"

