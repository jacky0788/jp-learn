track: 会話
topic: wari
order: 110
label: 割・割引
title: 會話｜〜割／〜割引（成數・折扣）
# 來源：同學會話筆記

intro: |
  ・〜割（わり）＝十分之幾：1割＝10%、9割＝90%。
  ・〜割引（わりびき）＝打折，指「減掉」的部分。
  ⚠️ 台日相反：日語「1割引」＝便宜10%＝台灣的「打9折」；
     日語「9割引」＝便宜90%＝台灣的「打1折」。算折扣時特別注意。

goals:
  - "用「〜割」表達成數（1割＝10%）"
  - "看懂「〜割引」並換算成台灣的「打X折」（方向相反）"

grammar:
  - point: "〜割／〜割引（成數・折扣）"
    source: 会話
    setsuzoku:
      - "数字 ＋ 割（わり）＝十分之幾（1割＝10%）"
      - "数字 ＋ 割引（わりびき）＝折扣（減掉的部分）"
    explain: |
      「割」表成數；「割引」表折扣（減價幅度）。
      台日換算相反：1割引＝便宜10%＝打9折；9割引＝便宜90%＝打1折。
    examples:
      - {jp: "このシャツは2割引です。", kana: "このしゃつは にわりびきです。", zh: "這件襯衫便宜兩成（＝打8折）。"}
      - {jp: "クラスの9割が女性です。", kana: "くらすの きゅうわりが じょせいです。", zh: "班上九成是女生。"}
      - {jp: "全部で3割引になります。", kana: "ぜんぶで さんわりびきに なります。", zh: "全部打了7折（便宜三成）。"}
