track: 会話
topic: hikaku
order: 80
label: 比較
title: 會話｜比較（より／〜の中で〜が一番〜）
# 來源：同學會話筆記

intro: |
  比較事物的兩個常用句型：
  ・AはBより〜です：A 比 B 更〜（より＝比）。
  ・AとBとCの中で、〜が一番〜です：在三者以上之中，哪個最〜（一番＝最）。
  疑問詞依對象：物→どれ、場所→どこ、人→だれ。

goals:
  - "用「AはBより〜」比較兩者"
  - "用「〜の中で〜が一番〜」表達三者以上中最…的"
  - "依對象選對疑問詞：どれ／どこ／だれ"

grammar:
  - point: "AはBより〜です（A 比 B 更〜）"
    source: 会話
    setsuzoku:
      - "A は B より ＋ 形容詞／状態"
    explain: |
      「より」表示比較基準「比…」。
    examples:
      - {jp: "兄は私より背が高いです。", kana: "あには わたしより せが たかいです。", zh: "哥哥比我高。"}
      - {jp: "新幹線は車より速いです。", kana: "しんかんせんは くるまより はやいです。", zh: "新幹線比汽車快。"}

  - point: "〜の中で、どれ／どこ／だれが一番〜です（…之中最〜）"
    source: 会話
    setsuzoku:
      - "AとBとCの中で ＋（どれ／どこ／だれ）が一番〜"
      - "物→どれ、場所→どこ、人→だれ"
    explain: |
      在三者以上之中挑出「最…」的。「一番」＝最。
    examples:
      - {jp: "ケーキとクッキーとキャンディーの中で、どれが一番好きですか。", kana: "けーきと くっきーと きゃんでぃーの なかで、どれが いちばん すきですか。", zh: "蛋糕、餅乾、糖果之中，最喜歡哪一個？"}
      - {jp: "果物の中で、何が一番好きですか。", kana: "くだものの なかで、なにが いちばん すきですか。", zh: "水果之中，最喜歡什麼？"}
