track: 会話
topic: hikaku
order: 80
label: 比較
title: 會話｜比較（より／のほうが／どちら／一番）
# 來源：同學會話筆記＋本人會話課板書

intro: |
  比較事物的常用句型：
  ・AはBより〜です／BよりAのほうが〜です：A 比 B 更〜（より＝比；のほうが＝較…那一邊）。
  ・AとBとどちら（のほう）が〜ですか：兩者問哪一個（回答用「〜のほうが」）。
  ・どちらも〜です／〜ない：兩者都…／都不…（疑問詞＋も＋否定＝全面否定）；差不多用「同じぐらいです」。
  ・「ずっと」放在形容詞前＝「…得多」（強調差距大）。
  ・AとBとCの中で、〜が一番〜です：三者以上中哪個最〜（一番＝最）。
  ⚠️ 兩者用「どちら」，三者以上要用「どれ／どこ／だれ／何」。

goals:
  - "用「AはBより〜」「BよりAのほうが〜」比較兩者"
  - "用「AとBとどちらが〜ですか」問兩者、用「〜のほうが」回答"
  - "用「どちらも〜／〜ない」「同じぐらいです」表達都…／都不…／差不多"
  - "用「ずっと」強調差距大"
  - "用「〜の中で〜が一番〜」表達三者以上中最…的（疑問詞依對象 どれ／どこ／だれ）"

grammar:
  - point: "🔖 比較句型一覽（圖解）"
    source: 会話
    explain: |
      比較依「兩者／三者以上」選句型；疑問詞兩者用どちら、三者以上用どれ／どこ／だれ。
    table:
      caption: "比較句型總覽"
      headers: ["用途", "句型", "例"]
      rows:
        - ["A 比 B（陳述）", "AはBより〜／BよりAのほうが〜", "コーヒーは{{紅茶|こうちゃ}}より{{高|たか}}い"]
        - ["兩者問哪個", "AとBと[どちら]が〜ですか", "ねこと{{犬|いぬ}}と[どちら]が{{好|す}}き？"]
        - ["回答兩者", "〜のほうが／[どちらも]／{{同|おな}}じぐらい", "{{犬|いぬ}}のほうが好き"]
        - ["三者以上最…", "〜の中で[どれ]が{{一番|いちばん}}〜", "{{果物|くだもの}}の中で[どれ]が一番好き？"]
    practice_note: "⚠️ 兩者用どちら，三者以上用どれ／どこ／だれ。"

  - point: "AはBより〜／BよりAのほうが〜（兩者比較）"
    source: 会話
    setsuzoku:
      - "A は B より ＋ 形容詞／状態"
      - "B より A のほうが ＋ 形容詞（強調 A 那一邊）"
      - "（強調差距）ずっと ＋ 形容詞"
    explain: |
      「より」表比較基準「比…」；「のほうが」強調「…的那一邊」。
      「ずっと」放形容詞前＝「…得多」，強調差距大。
    examples:
      - {jp: "兄は私より背が高いです。", kana: "あには わたしより せが たかいです。", zh: "哥哥比我高。"}
      - {jp: "新幹線は車より速いです。", kana: "しんかんせんは くるまより はやいです。", zh: "新幹線比汽車快。"}
      - {jp: "紅茶よりコーヒーのほうがおいしいです。", kana: "こうちゃより こーひーのほうが おいしいです。", zh: "比起紅茶，咖啡比較好喝。（のほうが）"}
      - {jp: "ねこより犬のほうがかわいいです。", kana: "ねこより いぬのほうが かわいいです。", zh: "比起貓，狗比較可愛。"}
      - {jp: "椅子のほうがずっと軽いです。", kana: "いすのほうが ずっと かるいです。", zh: "椅子輕得多。（ずっと＝…得多）"}

  - point: "AとBとどちらが〜ですか／どちらも・同じぐらい（兩者問答）"
    source: 会話
    setsuzoku:
      - "A と B と どちら（のほう）が ＋ 形容詞 ですか"
      - "回答：〜のほうが〜です／どちらも〜（です／ない）／同じぐらいです"
    explain: |
      問兩者用「どちら」。回答可說「Aのほうが〜」「どちらも〜」（兩者都）、
      「どちらも〜ない」（兩者都不＝疑問詞＋も＋否定）、或「同じぐらいです」（差不多）。
    examples:
      - {jp: "ねこと犬とどちらがかわいいですか。", kana: "ねこと いぬと どちらが かわいいですか。", zh: "貓和狗哪個比較可愛？"}
      - {jp: "私とハンサムさんとどちらのほうが年上ですか。", kana: "わたしと はんさむさんと どちらのほうが としうえですか。", zh: "我和帥哥先生哪個比較年長？"}
      - {jp: "机と椅子とどちらが軽いですか。―どちらも軽いです。", kana: "つくえと いすと どちらが かるいですか。―どちらも かるいです。", zh: "桌子和椅子哪個輕？—兩個都輕。"}
      - {jp: "どちらも軽くないです。／同じぐらいです。", kana: "どちらも かるくないです。／おなじぐらいです。", zh: "兩個都不輕。／差不多。（全面否定／程度相當）"}

  - point: "〜の中で、どれ／どこ／だれが一番〜です（三者以上最高級）"
    source: 会話
    setsuzoku:
      - "AとBとCの中で ＋（どれ／どこ／だれ／何）が一番〜"
      - "物→どれ、場所→どこ、人→だれ、不定→何"
    explain: |
      在三者以上之中挑出「最…」的。「一番」＝最。
      ⚠️ 三者以上不能用「どちら」，要用「どれ／どこ／だれ／何」。
    examples:
      - {jp: "ケーキとクッキーとキャンディーの中で、どれが一番好きですか。", kana: "けーきと くっきーと きゃんでぃーの なかで、どれが いちばん すきですか。", zh: "蛋糕、餅乾、糖果之中，最喜歡哪一個？"}
      - {jp: "果物の中で、何が一番好きですか。", kana: "くだものの なかで、なにが いちばん すきですか。", zh: "水果之中，最喜歡什麼？"}
      - {jp: "さくらともみじとバラの中で、どれが一番好きですか。", kana: "さくらと もみじと ばらの なかで、どれが いちばん すきですか。", zh: "櫻花、楓葉、玫瑰之中，最喜歡哪一個？（三者以上用どれ）"}
