track: 会話
topic: tango-hyougen
order: 900
label: 単語・表現
title: 會話｜會話課單字・表現
# 來源：同學會話筆記（手指名稱、肚子餓相關等）

intro: |
  會話課出現的零散單字與口語表達，整理在這裡（不屬於特定文法的字）。
  之後會話課新出現的單字也會陸續加進來。

goals:
  - "認識會話課補充的單字與常用表達"

vocab:
  # 手指の名前
  - {jp: "親指", kana: "おやゆび", zh: "大拇指", pos: "名詞", source: 会話, ex: {jp: "親指を立てます。", kana: "おやゆびを たてます。", zh: "豎起大拇指。"}}
  - {jp: "人差し指", kana: "ひとさしゆび", zh: "食指", pos: "名詞", source: 会話, ex: {jp: "人差し指で指します。", kana: "ひとさしゆびで さします。", zh: "用食指指。"}}
  - {jp: "中指", kana: "なかゆび", zh: "中指", pos: "名詞", source: 会話, ex: {jp: "中指は一番長いです。", kana: "なかゆびは いちばん ながいです。", zh: "中指最長。"}}
  - {jp: "薬指", kana: "くすりゆび", zh: "無名指", pos: "名詞", source: 会話, ex: {jp: "薬指に指輪をはめます。", kana: "くすりゆびに ゆびわを はめます。", zh: "在無名指戴戒指。"}}
  - {jp: "小指", kana: "こゆび", zh: "小拇指", pos: "名詞", source: 会話, ex: {jp: "小指は一番小さいです。", kana: "こゆびは いちばん ちいさいです。", zh: "小拇指最小。"}}
  # おなか・空腹
  - {jp: "おなかがすく", kana: "おなかがすく", zh: "肚子餓", pos: "表現", source: 会話, ex: {jp: "おなかがすきました。", kana: "おなかが すきました。", zh: "肚子餓了。"}}
  - {jp: "ペコペコ", kana: "ぺこぺこ", zh: "肚子餓扁了（擬態語）", pos: "副詞", source: 会話, ex: {jp: "おなかがペコペコです。", kana: "おなかが ぺこぺこです。", zh: "肚子餓扁了。"}}
  - {jp: "いっぱい", kana: "いっぱい", zh: "滿、（吃）飽", pos: "副詞", source: 会話, ex: {jp: "おなかがいっぱいです。", kana: "おなかが いっぱいです。", zh: "肚子很飽。"}}
  # 相づち
  - {jp: "そうなんですか", kana: "そうなんですか", zh: "是那樣啊（回應）", pos: "寒暄", source: 会話, ex: {jp: "へえ、そうなんですか。", kana: "へえ、そうなんですか。", zh: "咦，是那樣啊。"}}
