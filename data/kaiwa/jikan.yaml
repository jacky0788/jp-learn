track: 会話
topic: jikan
order: 40
label: 時間表現
title: 會話｜時間表現（間／前に・後で／まで・までに）
# 來源：會話課板書

intro: |
  三組和「時間先後・期間」有關的句型：
  ・ている間／間に：在某段期間（間＝持續整段；間に＝期間內某時點發生另一件事）。
  ・〜前に／〜た後で：動作的先後（之前用辭書形、之後用た形）。
  ・〜まで／〜までに：まで＝持續到；までに＝期限前完成。

goals:
  - "分辨 間（持續）與 間に（期間內某時點）"
  - "用「前に／た後で」表達先後順序"
  - "分辨 まで（持續到）與 までに（期限前完成）"

grammar:
  - point: "V₂ている間／間に（在…的時候、期間）"
    source: 会話
    explain: |
      「間」＝整段期間動作持續；「間に」＝在這段期間內某個時點發生了另一件事。
    examples:
      - {jp: "MRTに乗っている間、いつもスマホで音楽を聞いています。", kana: "えむあーるてぃーに のっているあいだ、いつも すまほで おんがくを きいています。", zh: "搭捷運的時候，總是用手機聽音樂。"}
      - {jp: "部屋で勉強している間に、弟が入ってきました。", kana: "へやで べんきょうしているあいだに、おとうとが はいってきました。", zh: "在房間唸書的時候，弟弟進來了。"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "（整段持續・間）日本にいる＿＿、たくさん旅行したいです。", a: "間", note: "間＝整段期間動作持續"}
      - {q: "（某時點・間に）寝ている＿＿、地震がありました。", a: "間に", note: "間に＝期間內某時點發生另一件事"}

  - point: "～前に／～た後で（之前／之後）"
    source: 会話
    setsuzoku:
      - "V（辭書形）＋ 前に（做…之前）"
      - "V（た形）＋ 後で（做…之後）"
    explain: |
      表動作的先後順序。前に 前面用辭書形；後で 前面用た形。
    examples:
      - {jp: "温泉に入る前に、シャワーを浴びてください。", kana: "おんせんに はいるまえに、しゃわーを あびてください。", zh: "泡溫泉前請先沖澡。"}
      - {jp: "シャワーを浴びた後で、温泉に入ってください。", kana: "しゃわーを あびたあとで、おんせんに はいってください。", zh: "沖澡之後再泡溫泉。"}

  - point: "～まで／～までに（到…為止／期限前）"
    source: 会話
    setsuzoku:
      - "〜から〜まで：範圍／距離（東京から京都まで）"
      - "N／V（辭書形）＋まで：持續到…為止（夜まで／帰ってくるまで）"
      - "〜までに：在某時點「之前」完成（一次性／瞬間動作）"
    explain: |
      まで＝「到…為止」（持續），可表時間、距離地點，甚至「連…都」（極端例）。
      までに＝在某期限「之前」完成（瞬間動作）。注意：×金曜日までレポートを出して → ○金曜日までに。
      到達某地點用「に」（学校に着く）；走的路程範圍用「まで」（学校まで走る）。
    examples:
      - {jp: "東京から京都までどのぐらいかかりますか。", kana: "とうきょうから きょうとまで どのぐらい かかりますか。", zh: "從東京到京都要花多久？（距離範圍）"}
      - {jp: "8時まで勉強していました。", kana: "はちじまで べんきょうして いました。", zh: "（一直）讀書讀到8點。（時間持續）"}
      - {jp: "彼が帰ってくるまで待っています。", kana: "かれが かえってくるまで まっています。", zh: "我會等到他回來為止。（V〜まで）"}
      - {jp: "金曜日までにレポートを出してください。", kana: "きんようびまでに れぽーとを だしてください。", zh: "請在星期五前交報告。（期限前完成）"}
      - {jp: "子供にまでばかにされています。", kana: "こどもにまで ばかに されています。", zh: "連小孩都瞧不起（我）。（〜まで＝連…都）"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "（期限前完成）金曜日＿＿レポートを出してください。", a: "までに"}
      - {q: "（持續到）彼が帰ってくる＿＿待っています。", a: "まで"}
      - {q: "（到達地點）9時に学校＿＿着きました。", a: "に", note: "到達點用に"}
