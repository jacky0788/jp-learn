track: 会話
topic: jikan
order: 40
label: 時間表現
title: 會話｜時間表現（間／前に・後で／まで・までに）
# 來源：會話課板書

intro: |
  三組和「時間先後・期間」有關的句型：
  ・ている間／間に：在某段期間（間＝持續整段；間に＝期間內某時點發生另一件事）。
  ・〜前に／〜た後で：動作的先後（之前用辭書形、之後用た形）。
  ・〜まで／〜までに：まで＝持續到；までに＝期限前完成。

goals:
  - "分辨 間（持續）與 間に（期間內某時點）"
  - "用「前に／た後で」表達先後順序"
  - "分辨 まで（持續到）與 までに（期限前完成）"

grammar:
  - point: "V₂ている間／間に（在…的時候、期間）"
    source: 会話
    explain: |
      「間」＝整段期間動作持續；「間に」＝在這段期間內某個時點發生了另一件事。
    examples:
      - {jp: "MRTに乗っている間、いつもスマホで音楽を聞いています。", kana: "えむあーるてぃーに のっているあいだ、いつも すまほで おんがくを きいています。", zh: "搭捷運的時候，總是用手機聽音樂。"}
      - {jp: "部屋で勉強している間に、弟が入ってきました。", kana: "へやで べんきょうしているあいだに、おとうとが はいってきました。", zh: "在房間唸書的時候，弟弟進來了。"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "（整段持續・間）日本にいる＿＿、たくさん旅行したいです。", a: "間", note: "間＝整段期間動作持續"}
      - {q: "（某時點・間に）寝ている＿＿、地震がありました。", a: "間に", note: "間に＝期間內某時點發生另一件事"}

  - point: "～前に／～た後で・後に（之前／之後）"
    source: 会話
    setsuzoku:
      - "前に：N＋の＋前に／V（辭書形）＋前に／時間＋前に（30分前に）"
      - "後で・後に：N＋の＋後で／V（た形）＋後で（後に）"
    explain: |
      表動作的先後。「前に」前面用辭書形或「Nの」；「後で／後に」前面用た形或「Nの」。
      ※「あと（で）」後面可接持續狀態（彼は仕事を辞めたあと、ずっと家にこもっている）；
        「あとに」多用於具體的先後動作（食事のあとに薬を飲む）。
    examples:
      - {jp: "試験の前に復習をしました。", kana: "しけんの まえに ふくしゅうを しました。", zh: "考試前複習了。（Nの前に）"}
      - {jp: "学校へ行く前に朝ごはんを食べます。", kana: "がっこうへ いくまえに あさごはんを たべます。", zh: "去學校前吃早餐。（Vる前に）"}
      - {jp: "出発の30分前に集合してください。", kana: "しゅっぱつの さんじゅっぷんまえに しゅうごうして ください。", zh: "出發前30分鐘集合。（時間＋前に）"}
      - {jp: "卒業式の後で、みんなで記念写真を撮った。", kana: "そつぎょうしきの あとで、みんなで きねんしゃしんを とった。", zh: "畢業典禮後，大家一起拍紀念照。（Nの後で）"}
      - {jp: "こちらの薬は食事の後に飲んでください。", kana: "こちらの くすりは しょくじの あとに のんでください。", zh: "這個藥請飯後吃。（Nの後に）"}
      - {jp: "留学から帰った後で、友達に会いに行こう。", kana: "りゅうがくから かえったあとで、ともだちに あいに いこう。", zh: "留學回來後，去找朋友。（Vた後で）"}

  - point: "～まで／～までに（到…為止／期限前）"
    source: 会話
    setsuzoku:
      - "① 地点：〜から〜まで（範圍／距離。東京から京都まで／学校まで走る）"
      - "② 時間（N）＋まで：持續到某時間（8時まで／夜まで／会議は5時まで）"
      - "③ 動作（V辭書形）＋まで：持續到某動作發生為止（帰ってくるまで）"
      - "④ N＋まで：連…都（極端例。あなたまで／子供にまで）"
      - "〜までに：在某時點「之前」完成（一次性／瞬間動作）"
    explain: |
      まで＝「到…為止」（持續），老師分四類：①地點 ②時間(N) ③動作(V辭書形) ④連…都(N)。
      までに＝在某期限「之前」完成（瞬間動作）。注意：×金曜日までレポートを出して → ○金曜日までに。
      到達某地點用「に」（学校に着く／学校に走る）；走的路程範圍用「まで」（学校まで走る）。
    examples:
      - {jp: "東京から京都までどのぐらいかかりますか。", kana: "とうきょうから きょうとまで どのぐらい かかりますか。", zh: "從東京到京都要花多久？（①地點・距離範圍）"}
      - {jp: "8時まで勉強していました。", kana: "はちじまで べんきょうして いました。", zh: "（一直）讀書讀到8點。（②時間）"}
      - {jp: "会議は5時までです。", kana: "かいぎは ごじまでです。", zh: "會議到5點為止。（②時間）"}
      - {jp: "彼が帰ってくるまで待っています。", kana: "かれが かえってくるまで まっています。", zh: "我會等到他回來為止。（③動作V）"}
      - {jp: "外が暗くなるまでサッカーをしていました。", kana: "そとが くらくなるまで さっかーを していました。", zh: "踢足球踢到外面天黑為止。（③動作V）"}
      - {jp: "あなたまでそう思いますか。", kana: "あなたまで そう おもいますか。", zh: "連你都這麼想嗎？（④連…都）"}
      - {jp: "子供にまでばかにされています。", kana: "こどもにまで ばかに されています。", zh: "連小孩都瞧不起（我）。（④連…都）"}
      - {jp: "金曜日までにレポートを出してください。", kana: "きんようびまでに れぽーとを だしてください。", zh: "請在星期五前交報告。（までに＝期限前完成）"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "（期限前完成）金曜日＿＿レポートを出してください。", a: "までに"}
      - {q: "（持續到）彼が帰ってくる＿＿待っています。", a: "まで"}
      - {q: "（到達地點）9時に学校＿＿着きました。", a: "に", note: "到達點用に"}
