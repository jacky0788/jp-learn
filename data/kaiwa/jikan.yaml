track: 会話
topic: jikan
order: 40
label: 時間表現
title: 會話｜時間表現（間／前に・後で／まで・までに）
# 來源：會話課板書

intro: |
  三組和「時間先後・期間」有關的句型：
  ・ている間／間に：在某段期間（間＝持續整段；間に＝期間內某時點發生另一件事）。
  ・〜前に／〜た後で：動作的先後（之前用辭書形、之後用た形）。
  ・〜まで／〜までに：まで＝持續到；までに＝期限前完成。

goals:
  - "分辨 間（持續）與 間に（期間內某時點）"
  - "用「前に／た後で」表達先後順序"
  - "分辨 まで（持續到）與 までに（期限前完成）"

grammar:
  - point: "V₂ている間／間に（在…的時候、期間）"
    source: 会話
    key: true
    setsuzoku:
      - "間 ＋【持續動詞】：整段期間都在做（常配 ずっと）"
      - "間に ＋【瞬間動詞】：期間內某個時點發生了一次的事"
    explain: |
      「間」＝整段期間動作持續；「間に」＝在這段期間內某個時點發生了另一件事。
      ⭐ 板書判準（2026-07-17）：**看後面接的是「持續動詞」還是「瞬間動詞」**。
      ・後面是持續動詞（一直在做、有長度）→ 用「間」。句中常出現「ずっと」。
      ・後面是瞬間動詞（一瞬間發生、只有一次）→ 用「間に」。
      這和「まで／までに」是同一組概念：まで＋持續V、までに＋瞬間V。
      這是很好用的初學判準，但更核心的是：間描述整段時間與後項重疊；間に把那段時間當容器，
      說其中完成／發生某件事。後項即使有些長度，只要被看成區間內完成的事件，也能用間に。
    table:
      caption: "間／間に 的判準：看後面的動詞是持續還是瞬間（板書）"
      headers: ["形式", "後接動詞", "圖像", "例"]
      rows:
        - ["〜[間]", "[持續]動詞（一直）", "─────", "{{彼女|かのじょ}}がいない[間]、{{彼|かれ}}は{{涙|なみだ}}に{{暮|く}}れます"]
        - ["〜[間に]", "[瞬間]動詞（一次）", "──●──", "彼女がいない[間に]、{{地震|じしん}}が{{起|お}}きた"]
        - ["（對照）〜まで", "持續動詞", "─────", "9{{時|じ}}[まで]{{寝|ね}}てください"]
        - ["（對照）〜までに", "瞬間動詞", "──●──", "9時[までに]寝てください"]
    examples:
      - {jp: "MRTに乗っている間、いつもスマホで音楽を聞いています。", kana: "えむあーるてぃーに のっているあいだ、いつも すまほで おんがくを きいています。", zh: "搭捷運的時候，總是用手機聽音樂。"}
      - {jp: "部屋で勉強している間に、弟が入ってきました。", kana: "へやで べんきょうしているあいだに、おとうとが はいってきました。", zh: "在房間唸書的時候，弟弟進來了。"}
      - {jp: "彼女がいない間、彼は涙に暮れます。", kana: "かのじょが いないあいだ、かれは なみだに くれます。", zh: "她不在的期間，他以淚洗面。（間＋持續動詞）"}
      - {jp: "彼女がいない間に、地震が起きた。", kana: "かのじょが いないあいだに、じしんが おきた。", zh: "她不在的時候，發生了地震。（間に＋瞬間動詞）"}
      - {jp: "私達がごはんを食べている間、犬はずっと寝てしまった。", kana: "わたしたちが ごはんを たべているあいだ、いぬは ずっと ねてしまった。", zh: "我們吃飯的期間，狗一直在睡。（有「ずっと」＝持續 → 用「間」，不用「間に」）"}
      - {jp: "台風の間、家にずっといてしまいました。", kana: "たいふうの あいだ、いえに ずっと いてしまいました。", zh: "颱風期間，一直待在家裡。（Nの＋間）"}
      - {jp: "会社で働く間に、コーヒーを一杯飲みました。", kana: "かいしゃで はたらくあいだに、こーひーを いっぱい のみました。", zh: "在公司工作的期間，喝了一杯咖啡。（間に＋瞬間動詞）"}
    practice_note: "板書判準練習（持續V→間／瞬間V→間に）"
    practice:
      - {q: "（整段持續・間）日本にいる＿＿、たくさん旅行したいです。", a: "間", note: "間＝整段期間動作持續"}
      - {q: "（某時點・間に）寝ている＿＿、地震がありました。", a: "間に", note: "間に＝期間內某時點發生另一件事"}
      - {q: "彼女がいない＿＿、彼は涙に暮れます。（持續）", a: "間", note: "後接持續動詞→間"}
      - {q: "彼女がいない＿＿、地震が起きた。（瞬間）", a: "間に", note: "後接瞬間動詞→間に"}
      - {q: "私達がごはんを食べている＿＿、犬はずっと寝てしまった。", a: "間", note: "有「ずっと」＝持續 → 用間（板書特別訂正過）"}
      - {q: "会社で働く＿＿、コーヒーを一杯飲みました。", a: "間に", note: "喝一杯＝瞬間動作"}
      - {q: "（判準）要用「間」還是「間に」，看什麼決定？", a: "看後面是持續動詞（間）還是瞬間動詞（間に）"}

  - point: "～前に／～た後で・後に（之前／之後）"
    source: 会話
    setsuzoku:
      - "前に：N＋の＋前に／V（辭書形）＋前に／時間＋前に（30分前に）"
      - "後で・後に：N＋の＋後で／V（た形）＋後で（後に）"
    explain: |
      表動作的先後。「前に」前面用辭書形或「Nの」；「後で／後に」前面用た形或「Nの」。
      ※「あと（で）」後面可接持續狀態（彼は仕事を辞めたあと、ずっと家にこもっている）；
        「あとに」多用於具體的先後動作（食事のあとに薬を飲む）。
    examples:
      - {jp: "試験の前に復習をしました。", kana: "しけんの まえに ふくしゅうを しました。", zh: "考試前複習了。（Nの前に）"}
      - {jp: "学校へ行く前に朝ごはんを食べます。", kana: "がっこうへ いくまえに あさごはんを たべます。", zh: "去學校前吃早餐。（Vる前に）"}
      - {jp: "{{出発|しゅっぱつ}}の{{30|さんじゅっ}}{{分|ぷん}}{{前|まえ}}に{{集合|しゅうごう}}してください。", kana: "しゅっぱつの さんじゅっぷんまえに しゅうごうして ください。", zh: "出發前30分鐘集合。（時間＋前に）"}
      - {jp: "卒業式の後で、みんなで記念写真を撮った。", kana: "そつぎょうしきの あとで、みんなで きねんしゃしんを とった。", zh: "畢業典禮後，大家一起拍紀念照。（Nの後で）"}
      - {jp: "こちらの薬は食事の後に飲んでください。", kana: "こちらの くすりは しょくじの あとに のんでください。", zh: "這個藥請飯後吃。（Nの後に）"}
      - {jp: "留学から帰った後で、友達に会いに行こう。", kana: "りゅうがくから かえったあとで、ともだちに あいに いこう。", zh: "留學回來後，去找朋友。（Vた後で）"}

  - point: "～まで／～までに（到…為止／期限前）"
    source: 会話
    setsuzoku:
      - "① 地点：〜から〜まで（範圍／距離。東京から京都まで／学校まで走る）"
      - "② 時間（N）＋まで：持續到某時間（8時まで／夜まで／会議は5時まで）"
      - "③ 動作（V辭書形）＋まで：持續到某動作發生為止（帰ってくるまで）"
      - "④ N＋まで：連…都（極端例。あなたまで／子供にまで）"
      - "〜までに：在某時點「之前」完成（一次性／瞬間動作）"
    explain: |
      まで＝「到…為止」（持續），老師分四類：①地點 ②時間(N) ③動作(V辭書形) ④連…都(N)。
      までに＝在某期限「之前」完成（瞬間動作）。注意：×金曜日までレポートを出して → ○金曜日までに。
      到達某地點用「に」（学校に着く／学校に走る）；走的路程範圍用「まで」（学校まで走る）。
      ⭐ 板書 Recap（2026-07-17）：**まで／までに 和 間／間に 是同一組判準**——
      ・まで＋【持續動詞】：9時まで寝てください（睡到9點，整段都在睡）。
      ・までに＋【瞬間動詞】：9時までに寝てください（9點前上床，「上床」是一瞬間的動作）。
      「持續／瞬間」是判斷捷徑；真正差別是まで設定持續終點，までに設定完成期限。
      因此「金曜日までにレポートを書いてください」即使寫作需要時間，整件工作仍須在期限前完成。
    table:
      caption: "まで 四分類 ＋ までに"
      headers: ["分類", "用法", "例"]
      rows:
        - ["① 地點", "〜から〜まで（範圍/距離）", "{{東京|とうきょう}}から{{京都|きょうと}}[まで]"]
        - ["② 時間(N)", "N＋まで（持續到）", "8{{時|じ}}[まで]{{勉強|べんきょう}}した"]
        - ["③ 動作(V)", "辭書形＋まで（到某動作為止）", "{{帰|かえ}}ってくる[まで]{{待|ま}}つ"]
        - ["④ 連…都", "N＋まで（極端例）", "あなた[まで]そう{{思|おも}}う？"]
        - ["⚠️ までに", "期限前完成（瞬間）", "{{金曜日|きんようび}}[までに]{{出|だ}}す"]
    examples:
      - {jp: "東京から京都までどのぐらいかかりますか。", kana: "とうきょうから きょうとまで どのぐらい かかりますか。", zh: "從東京到京都要花多久？（①地點・距離範圍）"}
      - {jp: "8時まで勉強していました。", kana: "はちじまで べんきょうして いました。", zh: "（一直）讀書讀到8點。（②時間）"}
      - {jp: "9時まで寝てください。", kana: "くじまで ねてください。", zh: "請睡到9點。（まで＋持續動詞：整段都在睡）"}
      - {jp: "9時までに寝てください。", kana: "くじまでに ねてください。", zh: "請在9點前上床睡覺。（までに＋瞬間動詞：上床是一瞬間）"}
      - {jp: "会議は5時までです。", kana: "かいぎは ごじまでです。", zh: "會議到5點為止。（②時間）"}
      - {jp: "彼が帰ってくるまで待っています。", kana: "かれが かえってくるまで まっています。", zh: "我會等到他回來為止。（③動作V）"}
      - {jp: "外が暗くなるまでサッカーをしていました。", kana: "そとが くらくなるまで さっかーを していました。", zh: "踢足球踢到外面天黑為止。（③動作V）"}
      - {jp: "あなたまでそう思いますか。", kana: "あなたまで そう おもいますか。", zh: "連你都這麼想嗎？（④連…都）"}
      - {jp: "子供にまでばかにされています。", kana: "こどもにまで ばかに されています。", zh: "連小孩都瞧不起（我）。（④連…都）"}
      - {jp: "金曜日までにレポートを出してください。", kana: "きんようびまでに れぽーとを だしてください。", zh: "請在星期五前交報告。（までに＝期限前完成）"}
    practice_note: "考點：まで（持續到）vs までに（期限前完成）vs に（到達點）"
    practice:
      - {q: "（期限前完成）金曜日＿＿レポートを出してください。", a: "までに"}
      - {q: "（持續到）彼が帰ってくる＿＿待っています。", a: "まで"}
      - {q: "（到達地點）9時に学校＿＿着きました。", a: "に", note: "到達點用に"}
      - {q: "（時間持續）8時＿＿勉強していました。", a: "まで"}
      - {q: "（範圍）東京＿＿京都＿＿どのぐらい？", a: "から、まで", note: "から〜まで"}
      - {q: "（連…都）子供に＿＿ばかにされる。", a: "まで", note: "まで＝連…都"}
