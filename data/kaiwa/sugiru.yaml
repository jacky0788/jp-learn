track: 会話
topic: sugiru
order: 150
label: すぎる
title: 會話｜〜すぎる（太過…）
# 來源：同學會話筆記

intro: |
  接在動詞ます形、或形容詞語幹後，表示「過於、太…」，程度超過適當範圍（多帶負面語氣）。
  變化像一段動詞（すぎる→すぎた→すぎて…）。

goals:
  - "用「Vます＋すぎる」「形容詞語幹＋すぎる」表達太過…"

grammar:
  - point: "〜すぎる（太過…、過度…）"
    source: 会話
    setsuzoku:
      - "V（ます形去ます）＋ すぎる"
      - "い形（去い）／な形（語幹）＋ すぎる"
    explain: |
      表示動作量或性質程度超過說話者認為適當的界線「太…、過於…」，因此常含負面評價，
      但也可依語境表驚嘆（幸せすぎる＝幸福得不得了）。接續時不是接完整ます：
      食べます→食べすぎる；い形去い；な形直接接語幹。
      組成後的「〜すぎる」本身是II類動詞，可再變成「すぎます／すぎた／すぎない／すぎて」。
    table:
      caption: "〜すぎる 的接續（去語尾再接）"
      headers: ["前接", "規則", "例"]
      rows:
        - ["動詞", "ます形（去ます）＋すぎる", "{{食|た}}べ[ます]→食べ[すぎる]"]
        - ["い形容詞", "去い＋すぎる", "{{大|おお}}き[い]→大き[すぎる]"]
        - ["な形容詞", "語幹＋すぎる", "{{簡単|かんたん}}→簡単[すぎる]"]
    examples:
      - {jp: "緊張しすぎて、めまいがしました。", kana: "きんちょうしすぎて、めまいが しました。", zh: "太緊張，頭暈了。"}
      - {jp: "食べすぎて、おなかが痛いです。", kana: "たべすぎて、おなかが いたいです。", zh: "吃太多，肚子痛。"}
      - {jp: "この服は大きすぎます。", kana: "このふくは おおきすぎます。", zh: "這件衣服太大了。（い形）"}
      - {jp: "この問題は簡単すぎる。", kana: "このもんだいは かんたんすぎる。", zh: "這題太簡單了。（な形）"}
    practice_note: "考點：去語尾＋すぎる（動詞ます形／い形去い／な形語幹）"
    practice:
      - {q: "（動詞）食べる →「吃太多」", a: "食べすぎる", note: "ます形＋すぎる"}
      - {q: "（動詞）飲む →「喝太多」", a: "飲みすぎる"}
      - {q: "（い形）大きい →「太大」", a: "大きすぎる", note: "去い＋すぎる"}
      - {q: "（い形）高い →「太貴」", a: "高すぎる"}
      - {q: "（な形）簡単 →「太簡單」", a: "簡単すぎる", note: "語幹＋すぎる"}
      - {q: "い形容詞接すぎる要去掉什麼？", a: "い"}
