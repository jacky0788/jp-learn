track: 会話
topic: sugiru
order: 150
label: すぎる
title: 會話｜〜すぎる（太過…）
# 來源：同學會話筆記

intro: |
  接在動詞ます形、或形容詞語幹後，表示「過於、太…」，程度超過適當範圍（多帶負面語氣）。
  變化像一段動詞（すぎる→すぎた→すぎて…）。

goals:
  - "用「Vます＋すぎる」「形容詞語幹＋すぎる」表達太過…"

grammar:
  - point: "〜すぎる（太過…、過度…）"
    source: 会話
    setsuzoku:
      - "V（ます形去ます）＋ すぎる"
      - "い形（去い）／な形（語幹）＋ すぎる"
    explain: |
      表示程度超過適當範圍「太…、過於…」，常含負面評價。
    table:
      caption: "〜すぎる 的接續（去語尾再接）"
      headers: ["前接", "規則", "例"]
      rows:
        - ["動詞", "ます形（去ます）＋すぎる", "{{食|た}}べ[ます]→食べ[すぎる]"]
        - ["い形容詞", "去い＋すぎる", "{{大|おお}}き[い]→大き[すぎる]"]
        - ["な形容詞", "語幹＋すぎる", "{{簡単|かんたん}}→簡単[すぎる]"]
    examples:
      - {jp: "緊張しすぎて、めまいがしました。", kana: "きんちょうしすぎて、めまいが しました。", zh: "太緊張，頭暈了。"}
      - {jp: "食べすぎて、おなかが痛いです。", kana: "たべすぎて、おなかが いたいです。", zh: "吃太多，肚子痛。"}
      - {jp: "この服は大きすぎます。", kana: "このふくは おおきすぎます。", zh: "這件衣服太大了。（い形）"}
      - {jp: "この問題は簡単すぎる。", kana: "このもんだいは かんたんすぎる。", zh: "這題太簡單了。（な形）"}
