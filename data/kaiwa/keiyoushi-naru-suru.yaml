track: 会話
topic: keiyoushi-naru-suru
order: 65
date: "2026-07-17"        # 上課日期（沒有課本課號時，選單改依日期分組）
label: 形容詞＋なる／する
title: 會話｜形容詞＋なる／する／＋動詞（変化與人為）
# 來源：會話課板書 2026-07-17（讀本/會話 PDF）

intro: |
  形容詞要接動詞時，必須先變成「副詞形」：
  ・い形容詞 → 語幹＋【く】（安い→安く、大きい→大きく、短い→短く）
  ・な形容詞 → 語幹＋【に】（きれい→きれいに、静か→静かに）

  變成副詞形之後，可以接任何動詞，最常見的兩個是：
  ・＋なる＝主語「變成…」（變化者用 が）
  ・＋する＝使某個對象「變成…」（被改變者用 を）
  但不只 なる／する，其他動詞也可以接：短く【切る】、きれいに【食べる】、きれいに【使う】。

goals:
  - い形容詞用「語幹＋く」、な形容詞用「語幹＋に」接動詞
  - 用「が＋なる／を＋する」分辨誰改變、誰把什麼改變
  - 知道副詞形不只接なる／する，也能接一般動詞（短く切る／きれいに使う）
grammar:
  - point: "い形容詞＋く ＋ 動詞（なる／する／一般動詞）"
    source: 会話
    key: true
    setsuzoku:
      - い形容詞 語幹＋【く】＋なる（主語變成某狀態）
      - い形容詞 語幹＋【く】＋する（使對象成為某狀態）
      - い形容詞 語幹＋【く】＋一般動詞（短く切る…）
    explain: |
      い形容詞要接動詞時，把語尾「い」改成「く」（＝副詞形）。
      ・＋なる：主語變成那樣（値段が安くなる＝價格變便宜）。
      ・＋する：行為者使對象成為那樣（値段を安くする＝把價格調低）。
      ・也可以接其他一般動詞：短く切る（剪短）。
      句型差別最清楚地反映在助詞：變化者用「が＋なる」，被改變的對象用「を＋する」。
      「なる」也能描述有意追求的結果，所以不要只用自然／人為二分。
    table:
      caption: い{{形容詞|けいようし}}＋く＋{{動詞|どうし}}（板書）
      headers:
        - 形式
        - 意思
        - '{{例|れい}}'
      rows:
        -   - い{{形|けい}}＋[く]＋なる
            - 主語變化
            - '{{安|やす}}[く]なる（變便宜）'
        -   - い{{形|けい}}＋[く]＋する
            - 使對象改變
            - '{{大|おお}}き[く]する（弄大）'
        -   - い{{形|けい}}＋[く]＋一般動詞
            - 接其他動詞
            - '{{短|みじか}}[く]{{切|き}}ります'
    examples:
      - {jp: "このコーヒーはにがすぎて、甘くしてください。", kana: "このこーひーは にがすぎて、あまく してください。", zh: "這杯咖啡太苦了，請弄甜一點。（板書訂正：×甘くなして → ○甘くして）"}
      - {jp: "髪を短く切りました。", kana: "かみを みじかく きりました。", zh: "把頭髮剪短了。（く＋一般動詞）"}
    practice_note: "板書例＋辨別なる／する"
    practice:
      - {q: "（自然變便宜）値段が＿＿なりました。（安い）", a: "安く", note: "い形→く＋なる"}
      - {q: "（人為弄大）字を＿＿してください。（大きい）", a: "大きく", note: "い形→く＋する"}
      - {q: "（接一般動詞）髪を＿＿切ります。（短い）", a: "短く"}
      - {q: "このコーヒーはにがすぎて、＿＿してください。（甘い）", a: "甘く", note: "板書訂正過：×甘くなして"}

  - point: "な形容詞＋に ＋ 動詞（なる／する／一般動詞）"
    source: 会話
    key: true
    setsuzoku:
      - な形容詞 語幹＋【に】＋なる（主語變成某狀態）
      - な形容詞 語幹＋【に】＋する（使對象成為某狀態）
      - な形容詞 語幹＋【に】＋一般動詞（きれいに食べる／きれいに使う…）
    explain: |
      な形容詞要接動詞時，語幹後面加「に」（＝副詞形）。
      ・＋なる：きれいになる（變漂亮）。
      ・＋する：きれいにする（把它弄漂亮）。
      ・也可以接其他一般動詞：きれいに食べる（吃得乾淨）、きれいに使う（用得乾淨）。
      和い形相同，なる句的變化者用が，する句的被改變對象用を：
      「部屋が静かになる／部屋を静かにする」。這個助詞對照比「自然／刻意」更穩定。
    table:
      caption: な{{形容詞|けいようし}}＋に＋{{動詞|どうし}}（板書）
      headers:
        - 形式
        - 意思
        - '{{例|れい}}'
      rows:
        -   - な{{形|けい}}＋[に]＋なる
            - 主語變化
            - きれい[に]なる（變漂亮）
        -   - な{{形|けい}}＋[に]＋する
            - 使對象改變
            - きれい[に]する（弄漂亮）
        -   - な{{形|けい}}＋[に]＋一般動詞
            - 接其他動詞
            - きれい[に]{{食|た}}べる／きれい[に]{{使|つか}}う
    examples:
      - {jp: "部屋がきれいになりました。", kana: "へやが きれいに なりました。", zh: "房間變乾淨了。（自然變化）"}
      - {jp: "部屋をきれいにしました。", kana: "へやを きれいに しました。", zh: "把房間弄乾淨了。（人為）"}
      - {jp: "台所はなるべくきれいに使ってください。", kana: "だいどころは なるべく きれいに つかってください。", zh: "廚房請盡量用得乾淨一點。（に＋一般動詞）"}
    practice_note: "な形容詞副詞形"
    practice:
      - q: （自然變漂亮）町が＿＿なりました。（きれい）
        a: きれいに
        note: な形→に＋なる
      - q: （人為弄乾淨）部屋を＿＿してください。（きれい）
        a: きれいに
        note: な形→に＋する
      - q: （接一般動詞）ごはんを＿＿食べましょう。（きれい）
        a: きれいに
      - q: （辨別）い形容詞接動詞要變成什麼？な形容詞呢？
        a: い形→語幹＋く／な形→語幹＋に
      - q: （辨別）「なる」和「する」差在哪裡？
        a: なる＝主語變成某狀態；する＝使某個對象成為某狀態
        note: 助詞常是 が＋なる／を＋する
