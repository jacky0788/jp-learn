track: 会話
topic: kara-node
order: 90
label: から／ので
title: 會話｜から／ので／て（原因・理由）
# 來源：同學會話筆記

intro: |
  三個表「原因・理由」的方式，差別在語氣與限制：
  ・から：主觀、個人意識，使用範圍最廣；後句可接請求／命令／意志／推測。
  ・ので：客觀理由，語氣柔和禮貌，請求拜託常用；不能用在「推測（だろう）」後面。
  ・〜て（て形）：原因產生後面的「狀態・結果」，後句不能接意志／命令／請求等動作（只能接自然的結果或狀態）。
  口訣：要客觀有禮用 ので；要主張/命令/推測用 から；只是「因為…（結果變成某狀態）」用〜て。

goals:
  - "用「から」表達主觀理由（可接請求/命令/意志/推測）"
  - "用「ので」表達客觀理由（禮貌、不接推測語氣）"
  - "用「〜て」表達原因→結果狀態（後句不可接意志/命令）"
  - "記住接續：ので 前面 N／な形要＋な"

grammar:
  - point: "🔖 から／ので／て 對比（圖解）"
    source: 会話
    explain: |
      三者都表原因，差別在「語氣」與「後句能不能接意志/命令/請求」。
    table:
      caption: "原因三者對比"
      headers: ["", "語氣", "後句可接意志／命令／請求？", "例"]
      rows:
        - ["から", "主觀、個人主張，最廣", "✅ 可以", "{{時間|じかん}}がないから、{{急|いそ}}いで"]
        - ["ので", "客觀、柔和有禮", "✅ 可以（較柔和）", "{{日曜日|にちようび}}なので、{{休|やす}}みます"]
        - ["〜て", "原因→自然結果狀態", "❌ 不行（只接結果）", "{{量|りょう}}が{{多|おお}}くて、{{食|た}}べられない"]
    practice_note: "口訣：要客觀有禮用ので；要命令/推測用から；只講「因為…變成某狀態」用〜て。"

  - point: "〜から（主觀理由）"
    source: 会話
    setsuzoku:
      - "普通形（常体）／丁寧形 ＋ から"
    explain: |
      表原因理由，說話者直接把前項提出作為自己判斷或行動的根據，語氣可較明確。
      後句可接請求、命令、意志、推測，限制少。所謂「から＝主觀」是常見傾向，不代表它只能講私人感受；
      真正要看的是說話者是否主動拿這個理由來支持後句。
    examples:
      - {jp: "時間がありませんから、急いでください。", kana: "じかんが ありませんから、いそいでください。", zh: "因為沒時間了，請快一點。（請求）"}
      - {jp: "熱があるから、病院に行こうと思う。", kana: "ねつが あるから、びょういんに いこうとおもう。", zh: "因為發燒，想去醫院。（意志）"}
      - {jp: "すぐ戻るから、心配するな。", kana: "すぐ もどるから、しんぱいするな。", zh: "我馬上回來，別擔心。（命令）"}
      - {jp: "今日は日曜日だから、李さんはうちにいるでしょう。", kana: "きょうは にちようびだから、りさんは うちに いるでしょう。", zh: "今天是星期日，小李應該在家吧。（推測）"}

  - point: "〜ので（客觀理由）"
    source: 会話
    setsuzoku:
      - "N＋なので／な形＋なので"
      - "い形・V（常体）＋ので"
    explain: |
      表原因時把前項當成既有背景，較少把理由強硬推給對方，所以常顯得柔和、適合說明或請求。
      「ので＝客觀」也是語用傾向，不是事實／感受的硬分類；自己的身體狀況也能說「頭が痛いので…」。
      接續要特別注意な形與名詞的現在肯定加「な」（静かなので／日曜日なので）。
      前後可用敬体或常体，但同一句的禮貌程度宜保持一致。
    examples:
      - {jp: "日曜日なので、学校へ行かなくてもいいです。", kana: "にちようびなので、がっこうへ いかなくても いいです。", zh: "因為是星期日，不去學校也沒關係。"}
      - {jp: "駅から近いので、家賃が高いです。", kana: "えきから ちかいので、やちんが たかいです。", zh: "因為離車站近，房租很貴。"}
      - {jp: "この辞書は説明が豊富なので、理解しやすい。", kana: "このじしょは せつめいが ほうふなので、りかいしやすい。", zh: "這本辭典說明豐富，所以好理解。"}
      - {jp: "きのうは残業したので、今はとても疲れた。", kana: "きのうは ざんぎょうしたので、いまは とても つかれた。", zh: "因為昨天加班，現在很累。"}
    practice_note: "補充：×「今日は道が混むだろうので…」（だろう＋ので 不可，推測用から）"
    practice:
      - {q: "（客觀）駅から近い＿＿、家賃が高いです。", a: "ので"}
      - {q: "（N客觀）日曜日＿＿、休みます。", a: "なので", note: "N＋な＋ので"}
      - {q: "（主觀・命令）すぐ戻る＿＿、心配するな。", a: "から", note: "命令用から"}

  - point: "〜て（原因→結果狀態）"
    source: 会話
    setsuzoku:
      - "V（て形）／い形（〜くて）／な形・N（〜で）＋ 後句（狀態・結果）"
      - "否定原因：V（〜なくて）"
    explain: |
      用て形把「原因」和「後面的狀態・結果」連起來。
      ⚠️ 限制：後句只能接「自然產生的狀態・結果」，不能接意志／命令／請求／勸誘等動作。
        要接這些動作時要改用 から／ので。
      對比：量が多いので食べません（ので＋意志「不吃」）↔ 量が多くて食べられません（て＋自然結果「吃不完」）。
    examples:
      - {jp: "学校が忙しくてジムにあまり行けません。", kana: "がっこうが いそがしくて じむに あまり いけません。", zh: "因為學校很忙，不太能去健身房。（い形くて＋結果）"}
      - {jp: "薬を飲まなくて胃が痛いです。", kana: "くすりを のまなくて いが いたいです。", zh: "因為沒吃藥，胃很痛。（否定原因〜なくて）"}
      - {jp: "量が多いので食べません。", kana: "りょうが おおいので たべません。", zh: "因為份量很多，（我決定）不吃。（ので＋意志）"}
      - {jp: "量が多くて食べられません。", kana: "りょうが おおくて たべられません。", zh: "份量太多，吃不完。（て＋自然結果）"}
    practice_note: "考點：から／ので／て 選用（後句能否接意志/命令）"
    practice:
      - {q: "（原因→自然結果）量が多く＿＿、食べられません。", a: "て", note: "て＋自然結果（吃不完）"}
      - {q: "（原因→意志決定）量が多い＿＿、食べません。", a: "ので", note: "後接意志「不吃」要用ので/から"}
      - {q: "（主觀・命令）すぐ戻る＿＿、心配するな。", a: "から", note: "命令用から"}
      - {q: "（客觀・有禮）駅から近い＿＿、家賃が高い。", a: "ので"}
      - {q: "（原因→結果狀態）学校が忙しく＿、ジムに行けない。", a: "て"}
      - {q: "後句要接命令/請求/意志時，能用〜て嗎？", a: "不能（用から／ので）"}
