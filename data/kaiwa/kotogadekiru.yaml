track: 会話
topic: kotogadekiru
order: 100
label: ことができます
title: 會話｜～ことができます（會、能）
# 來源：會話課板書（原從第22課抽出）

intro: |
  「V辭書形＋ことができます」表示能力或可能，是「可能形」的另一種說法
  （例如「話せます＝話すことができます」）。

goals:
  - "用「～ことができます」表達會/能做某事"

grammar:
  - point: "～ことができます（會、能）"
    source: 会話
    setsuzoku:
      - "V（辭書形）＋ ことができます"
    explain: |
      表示能力或可能，與可能形意思相同（話せます＝話すことができます）。
    examples:
      - {jp: "日本語で話すことができます。", kana: "にほんごで はなすことが できます。", zh: "會用日語交談。"}
      - {jp: "ここで写真を撮ることができます。", kana: "ここで しゃしんを とることが できます。", zh: "這裡可以拍照。"}
