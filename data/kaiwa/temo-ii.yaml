track: 会話
topic: temo-ii
order: 170
label: てもいい／てはいけません
title: 會話｜〜てもいい（可以…）／〜てはいけません（不可以…）
# 來源：同學會話筆記

intro: |
  ・〜てもいいですか：詢問許可「可以…嗎？」；〜てもいいです＝可以…。
  ・〜てはいけません：表禁止「不可以…」。
  可能形有時中文也譯成「可以」，但問的是能力／條件是否容許，不等於直接向對方請求許可。

goals:
  - "用「〜てもいいですか」詢問／表達許可"
  - "用「〜てはいけません」表達禁止"

grammar:
  - point: "🔖 許可／禁止 對比（圖解）"
    source: 会話
    explain: |
      都接「V て形」。許可用〜てもいい，禁止用〜てはいけません。
    table:
      caption: "許可 vs 禁止（接 V て形）"
      headers: ["", "句型", "意思", "例"]
      rows:
        - ["許可", "V て形 ＋ [もいい]（ですか）", "可以…（嗎）", "{{座|すわ}}っ[てもいい]ですか"]
        - ["禁止", "V て形 ＋ [はいけません]", "不可以…", "ここでたばこを{{吸|す}}っ[てはいけません]"]

  - point: "〜てもいいですか／〜てもいい（可以…嗎／可以…）"
    source: 会話
    setsuzoku:
      - "V（て形）＋ もいい（ですか）"
    explain: |
      詢問或給予許可。回答可說「はい、いいですよ」；拒絕時宜用「すみません、ちょっと…」
      或清楚說明規定，避免只用很強硬的「いいえ、いけません」。

      ⚠️ 不要和可能形直接畫等號：「ここに座ってもいいですか」是在問對方是否准許我坐；
      「ここに座れますか」通常是在問座位、空間或身體條件上能不能坐。中文都可能翻成「可以坐嗎」，
      但日文的提問焦點不同。要取得許可時，以「〜てもいいですか」最明確。
    examples:
      - {jp: "ここに座ってもいいですか。―はい、いいですよ。", kana: "ここに すわっても いいですか。―はい、いいですよ。", zh: "可以坐這裡嗎？—可以喔。"}
      - {jp: "写真を撮ってもいいですか。", kana: "しゃしんを とっても いいですか。", zh: "可以拍照嗎？"}

  - point: "〜てはいけません（不可以…、禁止）"
    source: 会話
    setsuzoku:
      - "V（て形）＋ はいけません"
    explain: |
      表示規則或說話者的禁止「不可以…」。這不是能力上的「做不到」：
      「写真が撮れません」偏客觀條件不允許或拍不了；「写真を撮ってはいけません」才明確表示不准拍。
      口語可縮約成「〜ちゃだめ」（で形則是「〜じゃだめ」），但對陌生人仍要注意語氣。
    examples:
      - {jp: "ここでたばこを吸ってはいけません。", kana: "ここで たばこを すっては いけません。", zh: "這裡不可以抽菸。"}
      - {jp: "{{10|じゅう}}{{時|じ}}{{以降|いこう}}はピアノを{{弾|ひ}}いてはいけません。", kana: "じゅうじ いこうは ぴあのを ひいては いけません。", zh: "10點以後不可以彈鋼琴。"}
    practice_note: "考點：V て形＋もいい（許可）／＋はいけません（禁止）"
    practice:
      - {q: "（請求許可）座る →「可以坐這裡嗎？」ここに＿＿いいですか。", a: "座っても", note: "て形＋もいい"}
      - {q: "（許可）写真を撮る →「可以拍照嗎？」", a: "写真を撮ってもいいですか"}
      - {q: "（禁止）吸う →「不可以抽菸」たばこを＿＿。", a: "吸ってはいけません", note: "て形＋はいけません"}
      - {q: "（禁止）入る →「不可以進入」", a: "入ってはいけません"}
      - {q: "「許可」用 てもいい 還是 てはいけません？", a: "てもいい"}
      - {q: "「禁止」用 てもいい 還是 てはいけません？", a: "てはいけません"}
