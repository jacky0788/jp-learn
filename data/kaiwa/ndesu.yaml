track: 会話
topic: ndesu
order: 10
label: んです
title: 會話｜～んです／～んですが（說明・確認・前置）
# 來源：會話課板書（原從第23課抽出）

intro: |
  「～んです」是會話中很常用的語氣，用來「說明情況、解釋原因」或「確認」。
  有求於人、要帶出話題時，常用「～んですが」當開場白。

goals:
  - "用「～んです」說明情況或解釋原因"
  - "用「～んですが」委婉帶出請求或話題"

grammar:
  - point: "～んです／～んですが（說明・確認・前置）"
    source: 会話
    setsuzoku:
      - "V常体（る・た・ない・なかった）＋んです"
      - "い形＋んです；な形・N＋な＋んです"
    explain: |
      ①說明情況、解釋原因（希望對方繼續聽、理解當下狀況）。
      ②詢問、確認（針對某事件想得到詳細回答）。
      ③有求於人、帶出話題時用「～んですが」當開場。
      ※「～んですか」vs「～ですか」：加 ん 帶有「想了解詳情、關心」的語氣
        （どうしたんですか＞どうしましたか；昨日何をしたんですか＞何をしましたか）。
    table:
      caption: "～んです 的接續（⚠️ な形・名詞要加 な）"
      headers: ["前接", "形式", "例"]
      rows:
        - ["動詞", "常体＋んです", "{{食|た}}べる→食べる[ん]です"]
        - ["い形容詞", "～い＋んです", "{{痛|いた}}い→痛い[ん]です"]
        - ["な形容詞", "語幹＋[な]＋んです", "{{暇|ひま}}→暇[な]んです"]
        - ["名詞", "N＋[な]＋んです", "{{休|やす}}み→休み[な]んです"]
    examples:
      - {jp: "どうしたんですか。元気がありませんね。―頭が痛いんです。", kana: "どうしたんですか。げんきが ありませんね。―あたまが いたいんです。", zh: "怎麼了？看起來沒精神。—我頭痛。"}
      - {jp: "明日は暇なんです。", kana: "あしたは ひまなんです。", zh: "我明天有空。（な形＋な＋んです）"}
      - {jp: "ラーメンを食べたいんですが、いい店を知っていますか。", kana: "らーめんを たべたいんですが、いいみせを しっていますか。", zh: "我想吃拉麵，你知道哪裡有好店嗎？"}
      - {jp: "チケットが{{2|に}}{{枚|まい}}あるんですが、{{一緒|いっしょ}}に{{見|み}}に{{行|い}}きませんか。", kana: "ちけっとが にまい あるんですが、いっしょに みに いきませんか。", zh: "我有兩張票，要不要一起去看？（帶出邀約）"}
      - {jp: "水が出ないんですが…。（見てくれませんか）", kana: "みずが でないんですが…。（みてくれませんか）", zh: "（不好意思）水流不出來…（可以幫忙看看嗎）"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "（說明原因）どうして遅れたんですか。―電車が＿＿。（遅れる）", a: "遅れたんです", note: "V常体＋んです"}
      - {q: "（確認・N）今日は休み＿＿んですか。", a: "な", note: "N／な形＋な＋んです"}
      - {q: "（前置請求）日本へ留学したい＿＿、相談に乗ってください。", a: "んですが"}
      - {q: "（な形＋な）明日は暇＿んです。", a: "な", note: "な形＋な＋んです"}
      - {q: "（前置帶出邀約）チケットが2枚ある＿＿、一緒に行きませんか。", a: "んですが"}
      - {q: "（い形直接接）頭が痛い＿＿。（接んです）", a: "んです", note: "い形＋んです"}
