track: 会話
topic: maeni-atode
order: 80
label: 前に／た後で
title: 會話｜～前に／～た後で（之前／之後）
# 來源：會話課板書（原從第22課抽出）

intro: |
  表動作的先後順序。「前に」前面用辭書形（做…之前）；「た後で」前面用た形（做…之後）。

goals:
  - "用「V辭書形＋前に」「Vた＋後で」表達先後順序"

grammar:
  - point: "～前に／～た後で（之前／之後）"
    source: 会話
    setsuzoku:
      - "V（辭書形）＋ 前に（做…之前）"
      - "V（た形）＋ 後で（做…之後）"
    explain: |
      表動作的先後順序。前に 前面用辭書形；後で 前面用た形。
    examples:
      - {jp: "温泉に入る前に、シャワーを浴びてください。", kana: "おんせんに はいるまえに、しゃわーを あびてください。", zh: "泡溫泉前請先沖澡。"}
      - {jp: "シャワーを浴びた後で、温泉に入ってください。", kana: "しゃわーを あびたあとで、おんせんに はいってください。", zh: "沖澡之後再泡溫泉。"}
