track: 会話
topic: nouryoku-keiken
order: 50
label: 能力・經驗
title: 會話｜ことができます／たことがあります
# 來源：會話課板書

intro: |
  兩個用「V＋こと」的句型：
  ・V辭書形＋ことができます：會、能（＝可能形的另一種說法）。
  ・Vた形＋ことがあります：曾經做過（經驗）。

goals:
  - "用「～ことができます」表達會/能做某事"
  - "用「～たことがあります」表達過去的經驗"

grammar:
  - point: "～ことができます（會、能）"
    source: 会話
    setsuzoku:
      - "V（辭書形）＋ ことができます"
    explain: |
      表示能力或可能，與可能形意思相同（話せます＝話すことができます）。
    table:
      caption: "ことができる（能力）vs たことがある（經驗）"
      headers: ["句型", "接續", "意思", "例"]
      rows:
        - ["～ことができる", "辭書形＋こと", "會／能（＝可能形）", "{{話|はな}}す→話す[こと]ができる"]
        - ["～たことがある", "た形＋こと", "曾經做過（經驗）", "{{行|い}}く→行った[こと]がある"]
    examples:
      - {jp: "日本語で話すことができます。", kana: "にほんごで はなすことが できます。", zh: "會用日語交談。"}
      - {jp: "ここで写真を撮ることができます。", kana: "ここで しゃしんを とることが できます。", zh: "這裡可以拍照。"}

  - point: "～たことがあります（曾經做過）"
    source: 会話
    setsuzoku:
      - "V（た形）＋ ことがあります"
    explain: |
      表示過去的經驗（曾經做過）。否定為「～たことがありません」（沒做過）。
    examples:
      - {jp: "お酒を飲んだことがあります。", kana: "おさけを のんだことが あります。", zh: "（曾經）喝過酒。"}
      - {jp: "日本へ行ったことはありません。", kana: "にほんへ いったことは ありません。", zh: "沒去過日本。"}
    practice_note: "考點：ことができる（能力，辭書形）與 たことがある（經驗，た形）"
    practice:
      - {q: "（能力）「會開車」運転する →", a: "運転することができます", note: "辭書形＋ことができる"}
      - {q: "（能力・否定）日本語を話すことができます → 否定", a: "話すことができません"}
      - {q: "（經驗）日本へ行く →「曾去過」", a: "行ったことがあります", note: "た形＋ことがある"}
      - {q: "（經驗・否定）お酒を飲む →「沒喝過」", a: "飲んだことがありません"}
      - {q: "（辨別）「能力」前面用辭書形還是た形？", a: "辭書形", note: "〜ることができる"}
      - {q: "（辨別）「經驗」前面用辭書形還是た形？", a: "た形", note: "〜たことがある"}
