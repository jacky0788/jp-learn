track: 会話
topic: nouryoku-keiken
order: 50
lesson: 17
label: 能力・經驗
title: 會話｜ことができます／たことがあります
# 來源：會話課板書

intro: |
  兩個句型都先用「こと」把前面的動作整體變成一件「事」，但後面的述語不同：
  ・V辭書形＋ことができます：那件事「能做到」＝能力／條件允許。
  ・Vた形＋ことがあります：做過那件事的經驗「存在」＝曾經做過。
  句中的「が」不是接在原動詞後面，而是標示名詞化後的「V＋こと」是
  「できます／あります」所描述的對象。若改成「は」，通常是在做對比或否定。

goals:
  - "用「～ことができます」表達會/能做某事"
  - "用「～たことがあります」表達過去的經驗"

grammar:
  - point: "～ことができます（會、能）"
    source: 会話
    setsuzoku:
      - "V（辭書形）＋ ことができます"
    explain: |
      表示能力或客觀條件上的可能，與可能形大致同義（話せます＝話すことができます）。

      **句子怎麼組成：**「日本語を話す」先保留原本的受詞「を」，再加「こと」把整個動作
      名詞化；「が」標示這件事是「できる」的主體。因此是「日本語を話す＋こと＋が＋できます」，
      不是把「を」直接換成「が」。相對地，直接使用可能形時常說「日本語が話せます」。

      **が／は的差別：**肯定、單純陳述能力時用「ことができます」。改用
      「ことはできます」會帶出對比：「這件事倒是能做（但可能做不好、別的不能做）」。
      否定句常用「ことはできません」，用「は」把「這件事」提出來對比並加以否定。
    table:
      caption: "ことができる（能力）vs たことがある（經驗）"
      headers: ["句型", "接續", "意思", "例"]
      rows:
        - ["～ことができる", "辭書形＋こと", "會／能（＝可能形）", "{{話|はな}}す→話す[こと]ができる"]
        - ["～たことがある", "た形＋こと", "曾經做過（經驗）", "{{行|い}}く→行った[こと]がある"]
    examples:
      - jp: 日本語で話すことができます。
        kana: にほんごで はなすことが できます。
        zh: 會用日語交談。
      - jp: ここで写真を撮ることができます。
        kana: ここで しゃしんを とることが できます。
        zh: 這裡可以拍照。
      - jp: 料理することはできますが、上手ではありません。
        kana: りょうりすることは できますが、じょうずでは ありません。
        zh: 做菜倒是會，但並不擅長。（は＝對比：「能做」不等於「做得好」）
  - point: "～たことがあります（曾經做過）"
    source: 会話
    setsuzoku:
      - "V（た形）＋ ことがあります"
    explain: |
      表示截至現在為止曾有過某種經驗。前面一定用た形，因為被名詞化的是「已完成過的動作」；
      「が」標示這種經驗是「ある」的主體，可理解為「做過某事這個經驗存在」。

      否定常說「〜たことはありません」：用「は」把該經驗提出來做對比並否定，語感自然；
      「〜たことがありません」也合乎文法，較像中性地陳述「沒有這種經驗」。
      這個句型談的是人生經驗，不是單純報告某次已知時間的往事；若要說「昨天去了日本」，
      直接用「昨日、日本へ行きました」，不說「昨日、行ったことがあります」。
    examples:
      - jp: お酒を飲んだことがあります。
        kana: おさけを のんだことが あります。
        zh: （曾經）喝過酒。
      - jp: 日本へ行ったことはありません。
        kana: にほんへ いったことは ありません。
        zh: 沒去過日本。
      - jp: '{{富士山|ふじさん}}に{{二度|にど}}{{登|のぼ}}ったことがあります。'
        kana: ふじさんに にど のぼったことが あります。
        zh: 曾經爬過兩次富士山。（可用一度／二度／何度も說經驗次數）
    practice_note: "考點：ことができる（能力，辭書形）與 たことがある（經驗，た形）"
    practice:
      - q: （能力）「會開車」運転する →
        a: 運転することができます
        note: 辭書形＋ことができる
      - q: （能力・否定）日本語を話すことができます → 否定
        a: 話すことができません
      - q: （經驗）日本へ行く →「曾去過」
        a: 行ったことがあります
        note: た形＋ことがある
      - q: （經驗・否定）お酒を飲む →「沒喝過」
        a: 飲んだことがありません
      - q: （辨別）「能力」前面用辭書形還是た形？
        a: 辭書形
        note: 〜ることができる
      - q: （辨別）「經驗」前面用辭書形還是た形？
        a: た形
        note: 〜たことがある
      - q: （助詞理解）「日本語を話すこと＿できます」中，哪個助詞標示「這件事能做到」？
        a: が
        note: V＋こと 整體名詞化後，以 が 接 できる
      - q: （語意辨別）「料理することはできますが…」的 は 表示什麼？
        a: 對比
        note: 這件事倒是能做，但後面還有保留或對照
