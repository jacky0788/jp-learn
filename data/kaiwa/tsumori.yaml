track: 会話
topic: tsumori
order: 55
date: "2026-08-21"        # 上課日期（會話課板書，選單依日期分組）
label: つもり（打算）
title: 會話｜〜つもりです（打算）と「想法→決定→打算」的強度階梯
# 來源：會話課板書 2026-08-21（raw/会話/20260821/）
# ⚠️ 板書最右邊還有一段「強烈確⇒ ex：いくら…／この物…」被照片邊緣切掉，未收錄，待補拍。

intro: |
  這堂會話課把「我要做某件事」從**最弱到最強**排成一條線，重點不是背句型，而是**分辨強度**。
  板書開頭就寫著「（非肯定）」與「打算（60%〜70%）」——也就是說，
  「〜つもりです」雖然中文常翻成「打算」，但它**還不是 100% 確定**，只是心裡已經有這個算盤。

  這個文法課本第23課（第三冊第3課）教過，會話課從實際對話的角度再走一次，
  多了三個課本沒強調的東西：
  ・「どういうつもりですか」＝責問對方「你到底想幹嘛？」
  ・「そのつもりです」＝順著對方的話說「對，我是這麼打算的」
  ・「想法 → 決定 → 打算」的階梯比較（〜たい／〜たいと思っています／〜ようと思っています／〜つもりです）

goals:
  - "用 V（辭書形）＋つもりです 說出自己的打算，並知道它是「非肯定」的 60〜70%"
  - "用 V（ない形）＋つもりです 說「打算不做」"
  - "聽懂並使用「どういうつもりですか」的責問語氣"
  - "用「そのつもりです」回應別人的確認"
  - "分辨〜たい／〜たいと思っています／〜ようと思っています／〜つもりです 四者的強度差別"

grammar:
  - point: "V（連体形＝辭書形）＋つもりです ⇒ 打算（60〜70%・非肯定）"
    source: 会話
    key: true
    setsuzoku:
      - "V（連体形＝辭書形）＋【つもりです】"
      - "板書標注：⇒ 打算（60%〜70%）／（非肯定）"
    explain: |
      表示自己心裡已經有的打算、算盤。
      ⚠️ 板書特別標了「**（非肯定）**」與「**60%〜70%**」：
      它比「〜たい（想）」確定，但**還沒到 100%**，所以不適合用在已經排定行程的事
      （那要用「〜予定です」）。
      疑問句「〜つもりですか」問對方的打算，但**語氣可以很衝**——
      「こんな夜遅く、どこへ行くつもりですか」就不是單純問路，而是在唸人。
    examples:
      - {jp: "夏休みに旅行に行くつもりです。", kana: "なつやすみに りょこうに いくつもりです。", zh: "我打算暑假去旅行。"}
      - {jp: "こんな夜遅く、どこへ行くつもりですか。", kana: "こんな よるおそく、どこへ いくつもりですか。", zh: "這麼晚了，你是打算去哪裡？（帶責問語氣）"}
      - {jp: "どういうつもりですか。", kana: "どういう つもりですか。", zh: "你到底是什麼意思／想幹嘛？（板書紅字，責問）"}
      - {jp: "来月、日本へ行くんですか。", kana: "らいげつ、にほんへ いくんですか。", zh: "你下個月要去日本嗎？"}
      - {jp: "ええ、そのつもりです。", kana: "ええ、そのつもりです。", zh: "嗯，我是這麼打算的。"}
    practice_note: "板書例句（皆為老師寫在黑板上的原句）"
    practice:
      - {q: "（我打算暑假去旅行）夏休みに旅行に＿＿。（行く）", a: "行くつもりです", note: "辭書形＋つもり"}
      - {q: "（這麼晚了你是要去哪）こんな夜遅く、どこへ＿＿か。（行く）", a: "行くつもりです", note: "責問語氣"}
      - {q: "（你到底想幹嘛？）＿＿つもりですか。", a: "どういう", note: "板書紅字補充"}
      - {q: "A：来月、日本へ行くんですか。→ B：ええ、＿＿。", a: "そのつもりです", note: "順著對方的話說「我是這麼打算的」"}

  - point: "否定：V（ない形）＋つもりです（打算不做）"
    source: 会話
    setsuzoku:
      - "V（ない形）＋【つもりです】（否定 ⇒ Vないつもりです）"
    explain: |
      板書寫「否定 ⇒ Vないつもりです」並在下面畫了波浪線強調。
      注意否定放在**動詞**上（買わないつもり），不是放在つもり上（×買うつもりではない意思不同）。
    examples:
      - {jp: "私は結婚しないつもりです。", kana: "わたしは けっこんしないつもりです。", zh: "我打算不結婚。"}
    practice:
      - {q: "（我打算不結婚）私は＿＿。（結婚する）", a: "結婚しないつもりです"}

  - point: "板書比較　想法 → 決定 → 打算（意志的強度階梯）"
    source: 会話
    key: true
    explain: |
      板書用同一個「買房子」把四種說法排成一條強度線，這是本堂課最值得記的一張圖：

      **想法**（還只是想）
      　・家を買いたいです。　　　　　　　← 單純表達願望
      　・家を買いたいと思います。／思っています。　← 板書註：「**持續有這個想法**」
      **決定**（已經下決心）
      　・家を買おうと思っています。　　　← 意向形＋と思っています
      **打算**（心裡有具體算盤）
      　・家を買うつもりです。

      💡 「と思います」是說話當下的想法；「と思っ**ています**」是**持續**有這個想法，
      所以講別人的打算時只能用「思っています」。
      ⚠️ 板書上「家を買うつもりです」左邊還有一行中文標籤，字跡不清無法確定，先未收錄（見檔頭註記）。
    table:
      caption: "同一件事、四種強度（板書）"
      headers: ["階段", "說法", "語感"]
      rows:
        - ["想法", "{{家|いえ}}を{{買|か}}い[たいです]", "單純的願望，最弱"]
        - ["想法", "{{家|いえ}}を{{買|か}}いたい[と思っています]", "持續有這個想法（板書註記）"]
        - ["決定", "{{家|いえ}}を{{買|か}}おう[と思っています]", "已經下了決心"]
        - ["打算", "{{家|いえ}}を{{買|か}}う[つもりです]", "心裡有具體算盤（仍是非肯定 60〜70%）"]
    examples:
      - {jp: "家を買いたいです。", kana: "いえを かいたいです。", zh: "我想買房子。（想法）"}
      - {jp: "家を買いたいと思います。", kana: "いえを かいたいと おもいます。", zh: "我想買房子。（想法・當下）"}
      - {jp: "家を買いたいと思っています。", kana: "いえを かいたいと おもって います。", zh: "我一直想買房子。（想法・持續有這個想法）"}
      - {jp: "家を買おうと思っています。", kana: "いえを かおうと おもって います。", zh: "我決定要買房子了。（決定）"}
      - {jp: "家を買うつもりです。", kana: "いえを かうつもりです。", zh: "我打算買房子。（打算）"}
    practice_note: "把同一件事依強度換說法"
    practice:
      - {q: "（單純想要）家を＿＿。（買う・たい）", a: "買いたいです"}
      - {q: "（一直有這個想法）家を買いたいと＿＿。（思う）", a: "思っています", note: "持續＝思っています"}
      - {q: "（已經決定）家を＿＿と思っています。（買う・意向形）", a: "買おう"}
      - {q: "（心裡有算盤）家を＿＿。（買う・つもり）", a: "買うつもりです"}

vocab:
  - {jp: "つもり", kana: "つもり", zh: "打算、意圖", pos: "名詞", key: true, source: 会話, ex: {jp: "夏休みに旅行に行くつもりです。", kana: "なつやすみに りょこうに いくつもりです。", zh: "我打算暑假去旅行。"}}
  - {jp: "夜遅く", kana: "よるおそく", zh: "深夜、很晚的時候", pos: "副詞・名詞", source: 会話, ex: {jp: "こんな夜遅く、どこへ行くつもりですか。", kana: "こんな よるおそく、どこへ いくつもりですか。", zh: "這麼晚了，你是打算去哪裡？"}}
  - {jp: "結婚します", kana: "けっこんします", zh: "結婚", pos: "動詞III", source: 会話, ex: {jp: "私は結婚しないつもりです。", kana: "わたしは けっこんしないつもりです。", zh: "我打算不結婚。"}}
  - {jp: "来月", kana: "らいげつ", zh: "下個月", pos: "名詞", source: 会話, ex: {jp: "来月、日本へ行くつもりです。", kana: "らいげつ、にほんへ いくつもりです。", zh: "我打算下個月去日本。"}}

notes:
  - "板書標注：つもり＝打算（60%〜70%）、（非肯定）——不是100%確定的事，確定的行程要用「〜予定です」（課本第23課）。"
  - "「どういうつもりですか」是責問，不是單純發問；對長輩、上司不要隨便用。"
  - "「そのつもりです」＝順著對方的話說「我是這麼打算的」，會話裡很好用。"
  - "「と思います」＝當下的想法；「と思っています」＝持續有這個想法，講別人的打算只能用後者。"
  - "同一個文法課本第23課（B3L03）文型二・三教過，可對照複習。"
  - "⚠️ 板書最右邊的「強烈確⇒ ex：いくら…／この物…」被照片切掉，尚未收錄。"
