track: 会話
topic: te-nakute-naide
order: 95
label: て／なくて／ないで
title: 會話｜Vて／Vなくて／Vないで（連接・原因・附帶狀況）
# 來源：本人會話課板書（今年）

intro: |
  三個長得像、但用法不同的て形連接：
  ・Vて：把動作「依序連起來」或表手段、並列（起きて、歯を磨いて…）。
  ・Vなくて：否定當「原因」──因為沒做某事，結果產生某狀態（朝ごはんを食べなくて、胃が痛くなる）。
  ・Vないで：在「沒做X的狀態下」做Y，表附帶狀況／取而代之（朝ごはんを食べないで、会社へ行く）。
  關鍵差別：なくて重「原因→結果」，ないで重「沒做X就直接做Y」。

goals:
  - "用「Vて」把動作依序連接（順序・手段・並列）"
  - "用「Vなくて」表達否定的原因（沒做→產生某結果）"
  - "用「Vないで」表達『沒做X就做Y』的附帶狀況"
  - "分辨 なくて（原因）與 ないで（附帶狀況）"

grammar:
  - point: "Vて、V（連接：順序・手段・並列）"
    source: 会話
    setsuzoku:
      - "V（て形）＋ 後句"
    explain: |
      用て形把幾個動作依時間順序連起來，或表手段、並列。
    examples:
      - {jp: "朝起きて、歯を磨いて、顔を洗います。", kana: "あさ おきて、はを みがいて、かおを あらいます。", zh: "早上起床、刷牙、洗臉。（依序）"}
      - {jp: "朝ごはんを食べて、会社へ行きます。", kana: "あさごはんを たべて、かいしゃへ いきます。", zh: "吃完早餐後去公司。（順序）"}

  - point: "Vなくて、V（否定原因→結果狀態）"
    source: 会話
    setsuzoku:
      - "V（〜なくて）＋ 結果・狀態"
    explain: |
      用「〜なくて」把「沒做某事」當原因，後面接因此產生的結果或狀態（後句多為非意志的結果）。
    examples:
      - {jp: "朝ごはんを食べなくて、胃が痛くなる。", kana: "あさごはんを たべなくて、いが いたくなる。", zh: "因為沒吃早餐，胃會痛。（原因→結果）"}
      - {jp: "薬を飲まなくて、熱が出ました。", kana: "くすりを のまなくて、ねつが でました。", zh: "因為沒吃藥，發燒了。（原因→結果）"}

  - point: "Vないで、V（沒做X就做Y・附帶狀況）"
    source: 会話
    setsuzoku:
      - "V（〜ないで）＋ 後句動作"
    explain: |
      表「在沒做X的狀態下做Y」，或「不做X而做別的」。重點在後面的動作Y，前面是它的附帶狀況。
    examples:
      - {jp: "朝ごはんを食べないで、会社へ行きます。", kana: "あさごはんを たべないで、かいしゃへ いきます。", zh: "沒吃早餐就去公司。（附帶狀況）"}
    practice_note: "補充練習（自我練習用，分辨 なくて／ないで）"
    practice:
      - {q: "（原因→結果）薬を飲ま＿＿、熱が出ました。", a: "なくて", note: "原因用なくて"}
      - {q: "（沒做X就做Y）朝ごはんを食べ＿＿、会社へ行きます。", a: "ないで", note: "附帶狀況用ないで"}
