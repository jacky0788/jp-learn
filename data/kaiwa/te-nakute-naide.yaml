track: 会話
topic: te-nakute-naide
order: 95
date: "2026-09-18"        # 上課日期＝最近一次上到這個主題的會話課（選單依日期分組）
label: て／なくて／ないで
title: 會話｜Vて／Vなくて／Vないで（連接・原因・附帶狀況）
# 來源：本人會話課板書（2026學期，2026-01起）
#   ＋2026-09-18 會話課板書：Vないで 的兩種用法（附帶情況／2選1）與 Vないほうがいいです
#   照片：raw/会話/20260918/

intro: |
  三個長得像、但用法不同的て形連接：
  ・Vて：把動作「依序連起來」或表手段、並列（起きて、歯を磨いて…）。
  ・Vなくて：否定當「原因」──因為沒做某事，結果產生某狀態（朝ごはんを食べなくて、胃が痛くなる）。
  ・Vないで：在「沒做X的狀態下」做Y，表附帶狀況／取而代之（朝ごはんを食べないで、会社へ行く）。
  關鍵差別：なくて重「原因→結果」，ないで重「沒做X就直接做Y」。

goals:
  - "用「Vて」把動作依序連接（順序・手段・並列）"
  - "用「Vなくて」表達否定的原因（沒做→產生某結果）"
  - "用「Vないで」表達『沒做X就做Y』的附帶狀況"
  - "分辨 なくて（原因）與 ないで（附帶狀況）"

grammar:
  - point: "🔖 て／なくて／ないで 對比（圖解）"
    source: 会話
    explain: |
      三個長得像，但用途不同。なくて重「原因→結果」，ないで重「沒做X就直接做Y」。
    table:
      caption: "三者對比"
      headers: ["形式", "意思", "後面接", "例"]
      rows:
        - ["Vて", "連接（順序・手段・並列）", "下一個動作", "{{起|お}}き[て]、{{歯|は}}を{{磨|みが}}く"]
        - ["Vなくて", "否定的原因", "結果／狀態", "{{薬|くすり}}を{{飲|の}}ま[なくて]、{{熱|ねつ}}が{{出|で}}た"]
        - ["Vないで", "沒做X就做Y（附帶狀況）", "另一個動作", "ごはんを{{食|た}}べ[ないで]、{{会社|かいしゃ}}へ{{行|い}}く"]

  - point: "Vて、V（連接：順序・手段・並列）"
    source: 会話
    setsuzoku:
      - "V（て形）＋ 後句"
    explain: |
      用て形把前後內容連接起來，具體關係由上下文決定，可表先後、方式、並列或原因。
      若是同一主體的連續動作，通常按發生順序排列；て形本身不標時態，整串的時態由最後述語決定。
    examples:
      - {jp: "朝起きて、歯を磨いて、顔を洗います。", kana: "あさ おきて、はを みがいて、かおを あらいます。", zh: "早上起床、刷牙、洗臉。（依序）"}
      - {jp: "朝ごはんを食べて、会社へ行きます。", kana: "あさごはんを たべて、かいしゃへ いきます。", zh: "吃完早餐後去公司。（順序）"}

  - point: "Vなくて、V（否定原因→結果狀態）"
    source: 会話
    setsuzoku:
      - "V（〜なくて）＋ 結果・狀態"
    explain: |
      用「〜なくて」把「沒做某事」當原因，後面接因此產生的結果或狀態（後句多為非意志的結果）。
      焦點是前項欠缺導致後項，而不是主體選擇「不做X就去做Y」。若後句是命令、邀請或刻意動作，
      通常改用「〜ないで」表附帶狀況，或用「〜ないから／〜ないので」明說理由。
    examples:
      - {jp: "朝ごはんを食べなくて、胃が痛くなる。", kana: "あさごはんを たべなくて、いが いたくなる。", zh: "因為沒吃早餐，胃會痛。（原因→結果）"}
      - {jp: "薬を飲まなくて、熱が出ました。", kana: "くすりを のまなくて、ねつが でました。", zh: "因為沒吃藥，發燒了。（原因→結果）"}

  - point: "Vないで、V（沒做X就做Y・附帶狀況）"
    source: 会話
    setsuzoku:
      - "V（〜ないで）＋ 後句動作"
    explain: |
      表「在沒做X的狀態下做Y」，或「不做X而做別的」。重點在後面的動作Y，前面是它的附帶狀況。
      前後通常共享同一個行為主體，因為是在描述同一人選擇省略X而進行Y。
      「〜ないでください」則已固定成否定請求「請不要…」，後面不需要再接另一個動作。
    examples:
      - {jp: "朝ごはんを食べないで、会社へ行きます。", kana: "あさごはんを たべないで、かいしゃへ いきます。", zh: "沒吃早餐就去公司。（附帶狀況）"}
    practice_note: "考點：分辨 て（連接）／なくて（原因）／ないで（附帶狀況）"
    practice:
      - {q: "（原因→結果）薬を飲ま＿＿、熱が出ました。", a: "なくて", note: "原因用なくて"}
      - {q: "（沒做X就做Y）朝ごはんを食べ＿＿、会社へ行きます。", a: "ないで", note: "附帶狀況用ないで"}
      - {q: "（連接順序）朝起き＿、歯を磨きます。", a: "て", note: "て形連接"}
      - {q: "（原因）学校が忙しく＿、ジムに行けない。", a: "て", note: "い形くて＋結果"}
      - {q: "（請別人不要做）写真を撮ら＿＿ください。", a: "ないで", note: "〜ないでください"}
      - {q: "「因為沒做而…」用 なくて 還是 ないで？", a: "なくて"}

  - point: "板書 2026-09-18　Vないで＋句子的兩種用法（附帶情況／2選1）"
    source: 会話
    key: true
    setsuzoku:
      - "V（ない形）＋【で】、＋ 後面一整個句子"
    explain: |
      【板書 2026-09-18】老師把「Vないで、〜」拆成兩種讀法，標題就寫「V ないで＋句子」：

      **① 附帶情況（在沒有…之下…）**
      　前半是後半動作發生時的**狀態**，不是另一個選項。
      　朝ごはんを食べないで、会社へ行きます。（沒吃早餐就去公司）
      　昨日疲れていて、電気を消さないで、寝てしまいました。（昨天太累，燈沒關就睡著了）

      **② 2選1（在沒選1的情況選2）**
      　前半跟後半是**兩個可以擇一的做法**，說話者否決前者、採用後者。
      　バスに乗らないで、歩いて会社へ行きます。（不搭公車，走路去公司）

      💡 兩者的分界：問自己「前半跟後半是不是兩個可以互換的選項？」
      是 → ②；只是描述當時的狀態 → ①。不管哪一種，**都不能換成なくて**。
    table:
      caption: "板書：Vないで 的兩種用法"
      headers: ["用法", "中文", "板書例句"]
      rows:
        - ["①　附帶情況", "在[沒有]…之下…", "{{電気|でんき}}を{{消|け}}さ[ないで]、{{寝|ね}}てしまいました"]
        - ["②　2選1", "在沒選1的情況[選2]", "バスに{{乗|の}}ら[ないで]、{{歩|ある}}いて{{会社|かいしゃ}}へ{{行|い}}きます"]
    examples:
      - {jp: "昨日疲れていて、電気を消さないで、寝てしまいました。", kana: "きのう つかれていて、でんきを けさないで、ねてしまいました。", zh: "昨天太累了，燈沒關就睡著了。（板書①・附帶情況）"}
      - {jp: "バスに乗らないで、歩いて会社へ行きます。", kana: "ばすに のらないで、あるいて かいしゃへ いきます。", zh: "不搭公車，走路去公司。（板書②・2選1）"}
    practice_note: "板書例句（2026-09-18・3題）"
    practice:
      - {q: "（沒吃早餐就去公司・附帶情況）朝ごはんを食べ＿＿、会社へ行きます。", a: "ないで"}
      - {q: "（燈沒關就睡著了・附帶情況）昨日疲れていて、電気を消さ＿＿、寝てしまいました。", a: "ないで"}
      - {q: "（不搭公車，走路去・2選1）バスに乗ら＿＿、歩いて会社へ行きます。", a: "ないで"}
      - {q: "「前半跟後半是兩個可以互換的選項」是哪一種用法？", a: "②2選1（否決前者、採用後者）"}

  - point: "板書 2026-09-18　補充：Vないほうがいいです（最好不要…）"
    source: 会話
    explain: |
      【板書 2026-09-18】老師在同一塊黑板上另外寫了這個句型當作提醒：
      **V（ない形）＋ほうがいいです**＝最好不要…（給對方建議）。
      肯定的「Vたほうがいいです（最好要…）」用**た形**，否定則用**ない形**，
      兩邊接的形不一樣，是常考的地方。
      ⚠️ 板書上只寫了句型、沒有寫例句；下面的例句是補充，不是老師的原句。
    table:
      caption: "ほうがいい 的兩邊接續"
      headers: ["", "接續", "例"]
      rows:
        - ["建議做", "V（[た形]）＋ほうがいいです", "{{早|はや}}く{{寝|ね}}[た]ほうがいいです"]
        - ["建議不要做", "V（[ない形]）＋ほうがいいです", "{{無理|むり}}をし[ない]ほうがいいです"]
    examples:
      - {jp: "無理をしないほうがいいです。", kana: "むりを しないほうが いいです。", zh: "最好不要勉強。（補充例句）"}
      - {jp: "早く寝たほうがいいです。", kana: "はやく ねたほうが いいです。", zh: "最好早點睡。（補充例句・肯定用た形）"}
    practice_note: "接續對照（2題・補充）"
    practice:
      - {q: "（最好不要勉強）無理をし＿＿ほうがいいです。", a: "ない", note: "否定用ない形"}
      - {q: "（最好早點睡）早く寝＿＿ほうがいいです。", a: "た", note: "肯定用た形"}
