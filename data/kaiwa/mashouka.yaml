track: 会話
topic: mashouka
order: 20
label: ましょうか
title: 會話｜～ましょうか（邀請／主動提議）
# 來源：會話課板書（原從第23課抽出）

intro: |
  「～ましょうか」用在兩種場合：邀對方一起做，或主動表示「我來幫忙吧」。
  靠語調區分：升調偏邀請、問對方意願；降調偏主動提議。

goals:
  - "用「～ましょうか」邀請對方一起做某事"
  - "用「～ましょうか」主動提議幫忙"

grammar:
  - point: "～ましょうか（邀請／主動提議）"
    source: 会話
    explain: |
      ①邀請對方一起做（升調，「要不要一起…？」）。②主動提議幫忙（「我來…吧？」）。
      是「ますか」的客氣邀約版，靠語調區分。
    table:
      caption: "～ましょうか 兩種用法（靠語調區分）"
      headers: ["用法", "語調", "意思", "例"]
      rows:
        - ["邀請一起做", "升調 ↗", "要不要一起…？", "{{一緒|いっしょ}}に{{行|い}}きましょうか"]
        - ["主動提議幫忙", "降調 ↘", "我來…吧？", "{{私|わたし}}が{{手伝|てつだ}}いましょうか"]
    examples:
      - {jp: "一緒に行きましょうか。", kana: "いっしょに いきましょうか。", zh: "要不要一起去？（邀請）"}
      - {jp: "私が手伝いましょうか。", kana: "わたしが てつだいましょうか。", zh: "我來幫忙吧？（主動提議）"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "（邀請一起去）一緒に映画を見に＿＿。（行く）", a: "行きましょうか", note: "邀請"}
      - {q: "（主動提議）荷物が重そうですね。私が＿＿。（持つ）", a: "持ちましょうか", note: "主動提議"}
