track: 会話
topic: mashouka
order: 20
lesson: 18
label: 誘い・ましょうか
title: 會話｜誘い（ませんか／ましょう／ましょうか／意向形）
# 來源：第18課「ドライブに行きませんか」課本＋會話課板書（2026學期）

intro: |
  第18課的主題是「邀約」——邀對方一起做某事，以及如何回應邀約。三個關鍵說法：
  ・〜ませんか：客氣地邀請「要不要…？」（否定疑問，最常用、最委婉）。
  ・〜ましょう：積極地提議「一起…吧！」（雙方有共識時）。
  ・〜ましょうか：邀請或主動提議幫忙「（我來）…吧？」，靠語調區分。
  常先用「〜んですが」鋪陳前提，再接「〜ませんか」邀約。
  「ましょう／ませんか」是「意向形（〜よう）」的丁寧形；普通体邀約用意向形。

goals:
  - "用「〜ませんか」客氣邀請對方一起做"
  - "用「〜ましょう／ましょうか」提議一起做或主動幫忙"
  - "用「〜んですが、〜ませんか」先鋪陳再邀約"
  - "會做意向形（五段u→o＋う／一段る→よう／する→しよう・来る→来よう）"
  - "會自然回應邀約：いいですね／そうしましょう／楽しみにしています／残念ですが、また今度"

grammar:
  - point: "〜ませんか（客氣邀請：要不要一起…？）"
    source: 会話
    key: true
    setsuzoku:
      - "Vます形 → ません + か（行きます→行きませんか）"
    explain: |
      用否定疑問「〜ませんか」邀請對方，比「〜ましょう」更委婉、把決定權留給對方，是邀約最常用的說法。
      常先用「〜んですが」說明情況，再接「〜ませんか」。
    examples:
      - {jp: "今度の日曜日、映画を見に行きませんか。", kana: "こんどの にちようび、えいがを みに いきませんか。", zh: "這個星期天，要不要去看電影？"}
      - {jp: "新しい車を買ったんですが、ドライブに行きませんか。", kana: "あたらしい くるまを かったんですが、どらいぶに いきませんか。", zh: "我買了新車，要不要去兜風？（んですが＋ませんか）"}
      - {jp: "コンサートのチケットが{{2|に}}{{枚|まい}}あるんですが、いっしょに{{行|い}}きませんか。", kana: "こんさーとの ちけっとが にまい あるんですが、いっしょに いきませんか。", zh: "我有兩張演唱會的票，要不要一起去？"}
    practice_note: "把ます形改成ませんか邀約"
    practice:
      - {q: "（邀約看電影）今度の日曜日、映画を見に＿＿。（行きます）", a: "行きませんか"}
      - {q: "（前置＋邀約）チケットが2枚あるんですが、いっしょに＿＿。（行きます）", a: "行きませんか"}
      - {q: "（邀約吃飯）よかったら、いっしょにごはんを＿＿。（食べます）", a: "食べませんか"}

  - point: "〜ましょう／〜ましょうか（提議一起做／主動幫忙）"
    source: 会話
    key: true
    explain: |
      ①〜ましょう＝積極提議「一起…吧！」（雙方已有共識）。
      ②〜ましょうか 可共同商量「要…嗎／…吧？」或由說話者主動提議幫忙。
      不要只靠升降調硬分：有疑問詞時「どこへ行きましょうか」是在共同決定去處；
      有「私が」或替對方做事的動詞時「私が持ちましょうか」通常是主動幫忙。語境與主體比語調更可靠。
      回應對方提議時可說「そうしましょう（就這麼辦吧）」。
    table:
      caption: "ましょう／ましょうか 用法"
      headers: ["說法", "語調", "意思", "例"]
      rows:
        - ["〜ましょう", "—", "一起…吧！（有共識）", "{{一緒|いっしょ}}に{{行|い}}きましょう"]
        - ["〜ましょうか", "升調 ↗", "要不要一起…？", "どこへ{{行|い}}きましょうか"]
        - ["〜ましょうか", "降調 ↘", "（我來）…吧？", "{{私|わたし}}が{{手伝|てつだ}}いましょうか"]
    examples:
      - {jp: "A：どこへ行きましょうか。　B：良子さんの好きな所へ行きましょう。", kana: "どこへ いきましょうか。／よしこさんの すきな ところへ いきましょう。", zh: "A：要去哪裡好呢？B：去良子喜歡的地方吧。"}
      - {jp: "A：あのイタリア料理の店はどうですか。　B：いいですね。そうしましょう。", kana: "あの いたりありょうりの みせは どうですか。／いいですね。そうしましょう。", zh: "A：那家義大利餐廳如何？B：好啊，就這麼辦吧。"}
      - {jp: "私が手伝いましょうか。", kana: "わたしが てつだいましょうか。", zh: "我來幫忙吧？（主動提議）"}
    practice_note: "補充練習（自我練習用）"
    practice:
      - {q: "（提議一起去）じゃ、いっしょに＿＿。（行く）", a: "行きましょう", note: "ましょう"}
      - {q: "（問要不要一起）今晩、何を食べに＿＿。（行く）", a: "行きましょうか", note: "邀請・升調"}
      - {q: "（主動幫忙）荷物が重そうですね。私が＿＿。（持つ）", a: "持ちましょうか", note: "提議・降調"}
      - {q: "（附和對方提議）「そうし＿＿。」", a: "ましょう", note: "そうしましょう＝就這麼辦"}

  - point: "意向形（〜よう）：ましょう／ませんか 的普通体"
    source: 会話
    setsuzoku:
      - "五段V：う段→お段＋う（行く→行こう・飲む→飲もう・持つ→持とう）"
      - "一段V：る→よう（食べる→食べよう・起きる→起きよう）"
      - "変格V：する→しよう／来る→来よう"
    explain: |
      意向形是「〜ましょう」所對應的普通体，對自己可表當下意志「來做吧／我要做」，
      對包含聽者的共同動作可表邀約。它不等於較委婉的「〜ませんか」；直接說意向形通常更親近、積極。
      單獨用來談第三人的意志不自然，第三人的打算通常要有「〜ようと思っている」等資訊來源。
      ※第23課還會用到「意向形＋と思う（打算…）」，這裡先掌握變化方式。
    table:
      caption: "意向形變化（板書）"
      headers: ["類別", "規則", "例"]
      rows:
        - ["五段(I類)", "u段→o段＋う", "{{行|い}}く→行こう／{{飲|の}}む→飲もう"]
        - ["一段(II類)", "る→よう", "{{食|た}}べる→食べよう／{{起|お}}きる→起きよう"]
        - ["変格(III類)", "する／来る", "する→しよう／{{来|く}}る→{{来|こ}}よう"]
    examples:
      - {jp: "のどが渇いたね。何か飲もう。", kana: "のどが かわいたね。なにか のもう。", zh: "口渴了呢，喝點什麼吧。（五段）"}
      - {jp: "疲れたから、少し休もう。", kana: "つかれたから、すこし やすもう。", zh: "累了，稍微休息一下吧。"}
    practice_note: "把動詞改成意向形"
    practice:
      - {q: "行く →（意向形）", a: "行こう", note: "五段 u→o＋う"}
      - {q: "食べる →（意向形）", a: "食べよう", note: "一段 る→よう"}
      - {q: "する →（意向形）", a: "しよう"}
      - {q: "来る →（意向形）", a: "来よう", note: "こよう"}

  - point: "邀約應答（接受／婉拒／期待）"
    source: 会話
    explain: |
      第18課課本整理的邀約常用回應：
      ・接受：いいですね。／そうしましょう。
      ・期待：楽しみにしています。（很期待）
      ・婉拒：残念ですが、また今度。（可惜了，下次吧）／その日は用事があるんです。（那天有事）
    examples:
      - {jp: "いいですね。楽しみにしています。", kana: "いいですね。たのしみに しています。", zh: "好啊，我很期待。（接受＋期待）"}
      - {jp: "すみません。あさっては用事があるんです。残念ですが、また今度。", kana: "すみません。あさっては ようじが あるんです。ざんねんですが、また こんど。", zh: "抱歉，後天有事。可惜了，下次吧。（婉拒）"}
    practice_note: "邀約回應"
    practice:
      - {q: "（很期待，請回應）「映画、楽しみに＿＿。」", a: "しています", note: "楽しみにしています"}
      - {q: "（婉拒：可惜下次吧）「＿＿ですが、また今度。」", a: "残念", note: "残念ですが、また今度"}
      - {q: "（婉拒理由：那天有事）「その日は＿＿があるんです。」", a: "用事"}
