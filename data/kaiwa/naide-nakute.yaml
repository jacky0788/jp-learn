track: 会話
topic: naide-nakute
order: 70
label: ないで／なくて
title: 會話｜～ないで／～なくて 的差別
# 來源：會話課板書（原從第22課抽出）

intro: |
  兩個都是「沒做某事」，但用法不同：
  「ないで」後面接動作（在沒做的狀態下做別的）；「なくて」後面接結果或狀態（因為沒做而…）。

goals:
  - "分辨「ないで」（狀態下做別的）與「なくて」（因為沒做而…）"
  - "用「～ないでください」請別人不要做某事"

grammar:
  - point: "～ないで／～なくて 的差別"
    source: 会話
    explain: |
      Vないで＋動作：在「沒做前項」的狀態下做後項（ごはんを食べないで、会社へ行く＝沒吃飯就去公司）。
      Vなくて＋結果/狀態：因為「沒做前項」而造成後項（ごはんを食べなくて、おなかがすいた）。
      請求別人「不要做」用「～ないでください」。
    examples:
      - {jp: "ごはんを食べないで、会社へ行きます。", kana: "ごはんを たべないで、かいしゃへ いきます。", zh: "不吃飯就去公司。"}
      - {jp: "笑わないでください。", kana: "わらわないでください。", zh: "請不要笑。"}
