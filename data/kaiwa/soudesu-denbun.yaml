track: 会話
topic: soudesu-denbun
order: 30
label: そうです（伝聞）
title: 會話｜～そうです（伝聞：聽說）
# 來源：會話課板書（原從第23課抽出）

intro: |
  傳達聽來的消息「聽說…」。接續一律用常体（普通形），な形與 N 要加だ。
  常搭配「Nによると（根據…）」。

goals:
  - "用「～そうです」轉述聽來的消息"
  - "記住接續：常体＋そうです，な形／N 要加だ"

grammar:
  - point: "～そうです（伝聞：聽說）"
    source: 会話
    setsuzoku:
      - "V常体／い形／な形だ／Nだ ＋ そうです"
      - "常搭配「Nによると」（根據…）"
    explain: |
      傳達聽來的消息（聽說…）。接續一律用常体（普通形），な形與N要加だ。
    examples:
      - {jp: "天気予報によると、明日は雨が降るそうです。", kana: "てんきよほうに よると、あしたは あめが ふる そうです。", zh: "根據氣象預報，聽說明天會下雨。"}
      - {jp: "田中さんは毎日暇だそうです。", kana: "たなかさんは まいにち ひまだ そうです。", zh: "聽說田中先生每天都很閒。"}
      - {jp: "彼は英語が下手だが、英語の先生だそうです。", kana: "かれは えいごが へただが、えいごの せんせいだ そうです。", zh: "聽說他英文很爛，卻是英文老師。"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "（聽說會下雨）天気予報によると、明日は雨が＿＿。（降る）", a: "降るそうです", note: "V常体＋そうです"}
      - {q: "（な形伝聞）田中さんは料理が＿＿。（上手だ）", a: "上手だそうです", note: "な形＋だ＋そうです"}
      - {q: "（N伝聞）彼は日本語の＿＿。（先生だ）", a: "先生だそうです", note: "N＋だ＋そうです"}
