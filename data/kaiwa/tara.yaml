track: 会話
topic: tara
order: 93
date: "2026-09-18"        # 上課日期（會話課板書，選單依日期分組）
label: たら（條件）
title: 會話｜〜たら（條件・時間）：如果…就／等…之後就
# 來源：會話課板書 2026-09-18（raw/会話/20260918/）

intro: |
  這堂會話課把「たら」拆成**兩種讀法**，判斷的關鍵是「前半那件事會不會發生」：

  **① 假定條件**——前半是「還不知道會不會成立」的狀況：**如果變成A的狀態，那B就…**
  　1億円があったら、何がしたいですか。（如果有一億圓，你想做什麼？）
  **② 確定條件（時間）**——前半是「一定會到」的時間點或必然發生的事：**發生某事件後 B 才成立**
  　10時になったら、出かけます。（等十點到了就出門）

  老師另外用黃色粉筆補了第三種：**過去的「たら」**，
  做了A之後**發現**了意想不到的B——
  　スーパーに行ったら、すでにつぶれて、なくなっていた。（去了超市才發現已經倒了、不在了）
  這個用法後句一定是過去式，而且結果通常是說話者「當下才知道」的事。

  接續很好記：**Vたら／い形＋かったら／な形＋だったら／N＋だったら**——
  全部都是「把過去式（た形）接上ら」。

goals:
  - "做出四種詞類的たら形：Vたら／い形かったら／な形だったら／Nだったら"
  - "用たら表達假定條件（如果A，就B）"
  - "用たら表達確定的時間條件（等A之後就B）"
  - "看懂過去式的たら（做了A才發現B）"
  - "知道たら的後句可以是意志、勧誘、請求（〜しましょう／〜ませんか／〜てください）"

grammar:
  - point: "接續：Vたら／い形かったら／な形だったら／Nだったら"
    source: 会話
    key: true
    setsuzoku:
      - "動詞：V（た形）＋【ら】（ある→あったら／行く→行ったら／ない→なかったら）"
      - "い形容詞：〜い→〜【かったら】（いい→よかったら／ない→なかったら）"
      - "な形容詞：〜【だったら】（いい天気だ→いい天気だったら）"
      - "名詞：N＋【だったら】"
    explain: |
      【板書】四種詞類的たら形全部都是「先變成過去式（た形／かった／だった），再加ら」，
      所以只要會做た形就會做たら形，不用另外背。
      否定也一樣：食べない→食べなかったら、時間がない→時間がなかったら。
    table:
      caption: "板書：〜たら 的接續"
      headers: ["詞類", "接續", "例"]
      rows:
        - ["動詞", "V（た形）＋[ら]", "{{行|い}}く → {{行|い}}っ[たら]"]
        - ["い形容詞", "〜[かったら]", "いい → よ[かったら]"]
        - ["な形容詞", "〜[だったら]", "いい{{天気|てんき}}だ → いい{{天気|てんき}}[だったら]"]
        - ["名詞", "N＋[だったら]", "{{雨|あめ}} → {{雨|あめ}}[だったら]"]
    examples:
      - {jp: "時間がなかったら、宿題をしません。", kana: "じかんが なかったら、しゅくだいを しません。", zh: "如果沒時間，就不寫作業。（動詞否定→なかったら）"}
      - {jp: "いい天気だったら、ピクニックへ行きませんか。", kana: "いい てんきだったら、ぴくにっくへ いきませんか。", zh: "如果天氣好，要不要去野餐？（な形→だったら）"}
    practice_note: "板書接續（把各詞類變成たら形）"
    practice:
      - {q: "行く →（たら形）", a: "行ったら"}
      - {q: "ある →（たら形）", a: "あったら"}
      - {q: "ない →（たら形）", a: "なかったら"}
      - {q: "いい →（たら形）", a: "よかったら", note: "い形：いい→よかった→よかったら"}
      - {q: "いい天気だ →（たら形）", a: "いい天気だったら", note: "な形・名詞都用だったら"}

  - point: "用法①　假定條件：如果變成A的狀態，那B就…"
    source: 会話
    key: true
    explain: |
      【板書①】「如果變成A的狀態，那B就…」——前半是**還不確定會不會成立**的事，
      所以中文幾乎都翻成「如果…」。
      後句可以是意志、願望、勧誘、請求，很自由：〜たいですか／〜しません／〜ませんか。
      ⚠️ 這是跟用法②最好的分界：用法①的前半**可能不會發生**，用法②的前半**一定會到**。
    examples:
      - {jp: "{{1億円|いちおくえん}}があったら、{{何|なに}}がしたいですか。", kana: "いちおくえんが あったら、なにが したいですか。", zh: "如果有一億圓，你想做什麼？（板書）"}
      - {jp: "時間がなかったら、宿題をしません。", kana: "じかんが なかったら、しゅくだいを しません。", zh: "如果沒時間，就不寫作業。（板書）"}
      - {jp: "いい天気だったら、ピクニックへ行きませんか。", kana: "いい てんきだったら、ぴくにっくへ いきませんか。", zh: "如果天氣好，要不要去野餐？（板書）"}
    practice_note: "板書例句（3題・皆為老師寫在黑板上的原句）"
    practice:
      - {q: "（如果有一億圓，你想做什麼？）1億円が＿＿、何がしたいですか。（ある）", a: "あったら"}
      - {q: "（如果沒時間就不寫作業）時間が＿＿、宿題をしません。（ない）", a: "なかったら"}
      - {q: "（如果天氣好，要不要去野餐？）いい天気＿＿、ピクニックへ行きませんか。", a: "だったら"}

  - point: "用法②　確定條件：發生某事件後，B 才成立"
    source: 会話
    key: true
    explain: |
      【板書②】「發生某事件後 B 才成立」——前半是**一定會到的時間點**或必然發生的事，
      中文對應「等…之後就…」「一…就…」，不是「如果」。
      最典型的就是「時間になったら」這一類：4月になったら／10時になったら。
      ⚠️ 這種たら的後句常是意志或既定行程（〜しましょう／〜ます），
      因為前提必然成立，所以講的是「到時候要做什麼」。
    examples:
      - {jp: "{{4月|しがつ}}になったら、お{{花見|はなみ}}をしましょう。", kana: "しがつに なったら、おはなみを しましょう。", zh: "等到四月，我們去賞花吧。（板書）"}
      - {jp: "10時になったら、出かけます。", kana: "じゅうじに なったら、でかけます。", zh: "等十點到了就出門。（板書）"}
      - {jp: "家へ帰ったら、すぐシャワーを浴びます。", kana: "いえへ かえったら、すぐ しゃわーを あびます。", zh: "一回到家就馬上沖澡。（板書）"}
    practice_note: "板書例句（3題・皆為老師寫在黑板上的原句）"
    practice:
      - {q: "（等到四月去賞花吧）4月に＿＿、お花見をしましょう。（なる）", a: "なったら"}
      - {q: "（十點到了就出門）10時に＿＿、出かけます。（なる）", a: "なったら"}
      - {q: "（一回到家就馬上沖澡）家へ＿＿、すぐシャワーを浴びます。（帰る）", a: "帰ったら"}

  - point: "補充（黃色粉筆）：過去的たら——做了A才發現B"
    source: 会話
    key: true
    setsuzoku:
      - "V（た形）＋ら、〜〜【た】。（後句一定是過去式）"
    explain: |
      【板書・黃色粉筆】老師在①②之間補了一種**過去用法**：
      做了A之後，發現了原本不知道、也不是自己造成的B。
      特徵有兩個：
      　・後句一定用**過去式**（〜た／〜ていた）
      　・後句是「發現、遇到」的結果，不是自己的意志動作
      板書例句裡「なくなっていた」用ていた，正是強調「我到的時候已經是那個狀態了」。
    examples:
      - {jp: "スーパーに行ったら、すでにつぶれて、なくなっていた。", kana: "すーぱーに いったら、すでに つぶれて、なくなっていた。", zh: "去了超市才發現已經倒閉、不在了。（板書・黃字）"}
    practice_note: "板書例句（1題）"
    practice:
      - {q: "（去了超市才發現已經倒了、不在了）スーパーに＿＿、すでにつぶれて、なくなっていた。（行く）", a: "行ったら", note: "後句用過去式＝當下才發現"}
      - {q: "這種「發現」的たら，後句要用什麼時態？", a: "過去式（〜た／〜ていた）"}

