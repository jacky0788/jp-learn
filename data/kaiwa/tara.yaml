notes:
  - "接續一句話記完：**先變過去式，再加ら**（行った→行ったら／よかった→よかったら／だった→だったら）。"
  - "判斷①還是②：前半**可能不發生**＝假定（如果…）；前半**一定會到**＝確定條件（等…就…）。"
  - "黃色粉筆那一組是**過去的たら**：做了A才發現B，後句一定是過去式，而且是「當下才知道」的事。"
  - "たら的後句很自由：可以是意志（出かけます）、勧誘（お花見をしましょう／行きませんか）、否定（しません）。"
  - "文法課本第23課（B3L03）「卒業したら、日本の会社に勤めるつもりです」教的就是這個，可對照複習。"
