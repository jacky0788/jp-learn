track: 会話
topic: takotogaaru
order: 110
label: たことがあります
title: 會話｜～たことがあります（曾經做過）
# 來源：會話課板書（原從第22課抽出）

intro: |
  「Vた形＋ことがあります」表示過去的「經驗」——曾經做過某件事。
  否定「沒做過」用「～たことがありません」。

goals:
  - "用「～たことがあります」表達過去的經驗"

grammar:
  - point: "～たことがあります（曾經做過）"
    source: 会話
    setsuzoku:
      - "V（た形）＋ ことがあります"
    explain: |
      表示過去的經驗（曾經做過）。否定為「～たことがありません」（沒做過）。
    examples:
      - {jp: "お酒を飲んだことがあります。", kana: "おさけを のんだことが あります。", zh: "（曾經）喝過酒。"}
      - {jp: "日本へ行ったことはありません。", kana: "にほんへ いったことは ありません。", zh: "沒去過日本。"}
