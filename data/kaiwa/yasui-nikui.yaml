track: 会話
topic: yasui-nikui
order: 100
label: やすい／にくい
title: 會話｜Vます形＋やすい／にくい（容易／難做）
# 來源：同學會話筆記

intro: |
  接在動詞ます形後，表示「容易…」或「難…」。變化像い形容詞（やすい→やすくない…）。
  ・〜やすい：做某事很容易；無意志動詞／自然現象時表「容易發生」。
  ・〜にくい：做某事很難。

goals:
  - "用「Vます形＋やすい」表達容易做／容易發生"
  - "用「Vます形＋にくい」表達難做"

grammar:
  - point: "🔖 やすい／にくい 對比（圖解）"
    source: 会話
    explain: |
      都接「Vます形（去ます）」後，變化像い形容詞。
    table:
      caption: "やすい vs にくい"
      headers: ["", "意思", "接續", "例"]
      rows:
        - ["〜やすい", "容易…／容易發生", "Vます形＋やすい", "{{書|か}}き[やすい]／{{雨|あめ}}が{{降|ふ}}り[やすい]"]
        - ["〜にくい", "難…／不好…", "Vます形＋にくい", "{{読|よ}}み[にくい]／{{食|た}}べ[にくい]"]

  - point: "Vます形＋やすい（容易…、好…）"
    source: 会話
    setsuzoku:
      - "V（ます形去ます）＋ やすい"
    explain: |
      表示某個對象的性質、構造或當下條件使動作容易進行，常譯成「好…／容易…」。
      「このペンは書きやすい」的「は」提出工具作評價對象，省略了使用者；不是說筆自己在寫。
      用於自然現象時則表示傾向「容易發生」。整個「〜やすい」按い形容詞變化：書きやすくない／書きやすかった。
    examples:
      - {jp: "このペンは書きやすい。", kana: "このぺんは かきやすい。", zh: "這支筆很好寫。"}
      - {jp: "この靴ははきやすい。", kana: "このくつは はきやすい。", zh: "這雙鞋很好穿。"}
      - {jp: "今月は雨が降りやすい。", kana: "こんげつは あめが ふりやすい。", zh: "這個月容易下雨。（自然現象）"}

  - point: "Vます形＋にくい（難…、不好…）"
    source: 会話
    setsuzoku:
      - "V（ます形去ます）＋ にくい"
    explain: |
      表示對象的性質或條件讓動作難以進行，不等於主體完全沒有能力，也不一定表示禁止。
      「読めない」是讀不了；「読みにくい」是能讀但字體、內容等使它不好讀。
      整個「〜にくい」按い形容詞變化；自然現象也可表示「不容易發生」（燃えにくい）。
    examples:
      - {jp: "この本は読みにくい。", kana: "このほんは よみにくい。", zh: "這本書很難讀。"}
      - {jp: "カニは食べにくい。", kana: "かには たべにくい。", zh: "螃蟹很難吃（指不好剝/吃）。"}
      - {jp: "燃えにくい服。", kana: "もえにくい ふく。", zh: "不易燃的衣服。"}
    practice_note: "考點：Vます形（去ます）＋ やすい／にくい"
    practice:
      - {q: "（容易）書く → このペンは＿＿。", a: "書きやすい", note: "ます形＋やすい"}
      - {q: "（容易）はく → この靴は＿＿。", a: "はきやすい"}
      - {q: "（容易發生）降る → 今月は雨が＿＿。", a: "降りやすい", note: "自然現象"}
      - {q: "（難）読む → この本は＿＿。", a: "読みにくい", note: "ます形＋にくい"}
      - {q: "（難）食べる → カニは＿＿。", a: "食べにくい"}
      - {q: "「やすい／にくい」前面接動詞的什麼形？", a: "ます形（去ます）"}
