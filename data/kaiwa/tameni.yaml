date: "2026-08-21"        # 上課日期（會話課板書，選單依日期分組）
label: ために（目的）
title: 會話｜V（辭書形）＋ために（為了…而做…）
# 來源：會話課板書 2026-08-21（raw/会話/20260821/板書3）

intro: |
  「〜ために」表示**目的**。板書寫的公式是：

  　（1）**A ために B** ＝ 為了 A（目的），而做 B

  也就是「ために」前面放**想達成的目標**，後面放**為此採取的行動**。
  三個板書例句都是同一個結構：前半是目標（成為律師／活下去／見到你），
  後半是為此付出的行動（拚命讀書／拚命工作／來到這裡）。

  💡 注意前後兩個動作的**主語要一致**（都是「我」），
  而且前面要用**辭書形**，不是ます形（○ なるために／× なりために）。

goals:
  - "用 V（辭書形）＋ために 說出「為了…而做…」"
  - "掌握語順：ために前面放目的、後面放為此採取的行動"
  - "記住前後主語必須一致，且前面接辭書形"

grammar:
  - point: "V（辭書形）＋ために ⇒ 目的（為了A而做B）"
    source: 会話
    key: true
    setsuzoku:
      - "V（辭書形）＋【ために】＋ B（為此採取的行動）"
      - "板書公式：（1）A【ために】B ＝ 為了A目的而做B"
    explain: |
      【板書】「V＋ために ⇒ 目的」。
      ・**A ために B**：A＝想達成的目標，B＝為了達成它所做的事。
      ・前面接**辭書形**（なる→なるために、生きていく→生きていくために、会う→会うために）。
      ・前後兩句的**主語要一樣**，都是同一個人的目標與行動。
      板書把後半的「一生懸命に勉強しています」「必死に働いています」「ここに来ました」
      畫了底線——提醒重點在「為了那個目標，實際上做了什麼」。
    table:
      caption: "板書公式"
      headers: ["A（目的）", "ために", "B（為此做的事）"]
      rows:
        - ["{{弁護士|べんごし}}になる", "[ために]", "{{一生懸命|いっしょうけんめい}}に{{勉強|べんきょう}}しています"]
        - ["{{生|い}}きていく", "[ために]", "{{必死|ひっし}}に{{働|はたら}}いています"]
        - ["あなたに{{会|あ}}う", "[ために]", "ここに{{来|き}}ました"]
    examples:
