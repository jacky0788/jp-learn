      - {jp: "生きていくために、必死に働いています。", kana: "いきて いくために、ひっしに はたらいて います。", zh: "為了活下去，我拚命工作。"}
      - {jp: "あなたに会うために、ここに来ました。", kana: "あなたに あうために、ここに きました。", zh: "為了見你，我來到了這裡。"}
    practice_note: "板書例句"
