track: 会話
topic: kamoshirenai
order: 60
label: かもしれません
title: 會話｜～かもしれません（也許、可能）
# 來源：會話課板書（原從第22課抽出）

intro: |
  表示說話者的推測「也許…、說不定…」，不確定但有可能。

goals:
  - "用「～かもしれません」表達不確定的推測"

grammar:
  - point: "～かもしれません（也許、可能）"
    source: 会話
    setsuzoku:
      - "V／い形／な形／N 的常体 ＋ かもしれません（な形・N 不加だ）"
    explain: |
      表示說話者的推測「也許…、說不定…」，不確定但有可能。
    examples:
      - {jp: "飛行機に遅れるかもしれません。", kana: "ひこうきに おくれるかもしれません。", zh: "也許會趕不上飛機。"}
      - {jp: "明日はテストがあるかもしれません。", kana: "あしたは てすとが あるかもしれません。", zh: "明天說不定有考試。"}
