track: 会話
topic: donogurai
order: 45
lesson: 17
label: どのぐらい
title: 會話｜どのぐらい（問時間・金錢・頻率・量・程度）
# 來源：本人會話課板書（2026學期，2026-01起）

intro: |
  「どのぐらい／どのくらい」是問「多少・多久・多常・到什麼程度」的疑問詞，用途很廣，可問：
  ・時間（要花多久）　・金錢（要多少錢）　・頻率・次數（多常・幾次）　・量　・程度。
  常和動詞搭配，例如「どのぐらいかかりますか」（要花多久／多少錢）。

goals:
  - "用「どのぐらい」詢問時間・金錢・頻率・次數・量・程度"
  - "聽懂並回答 どのぐらいかかりますか（時間／金錢）"
  - "用「（期間）に どのぐらい〜ますか」問頻率"

grammar:
  - point: "どのぐらい＋V（問時間・金錢・頻率・量・程度）"
    source: 会話
    setsuzoku:
      - "どのぐらい ＋ V ですか／ますか"
      - "（期間）に どのぐらい ＋ V ますか（問頻率・次數）"
    explain: |
      「どのぐらい」可詢問多種「量」：時間、金錢、頻率・次數、份量、程度。
      ・問時間／金錢最常用「どのぐらいかかりますか」（花多久／多少錢）。
      ・問頻率用「（一週間／一日）に どのぐらい〜ますか」，回答用次數（3回 等）。
    table:
      caption: "どのぐらい 可以問什麼"
      headers: ["問什麼", "例（問）", "例（答）"]
      rows:
        - ["時間", "どのぐらいかかりますか", "20{{時間|じかん}}"]
        - ["金錢", "どのぐらいかかりますか", "30{{万円|まんえん}}"]
        - ["頻率・次數", "{{一週間|いっしゅうかん}}にどのぐらい〜ますか", "3{{回|かい}}"]
        - ["量・程度", "どのぐらい{{要|い}}りますか", "少し／たくさん"]
    examples:
      - {jp: "ここから駅までどのぐらいかかりますか。―20時間かかります。", kana: "ここから えきまで どのぐらい かかりますか。―にじゅうじかん かかります。", zh: "從這裡到車站要花多久？—要20小時。（時間）"}
      - {jp: "この車はどのぐらいかかりますか。―30万円かかります。", kana: "この くるまは どのぐらい かかりますか。―さんじゅうまんえん かかります。", zh: "這台車要多少錢？—要30萬日圓。（金錢）"}
      - {jp: "一週間にどのぐらい来られますか。―3回来られます。", kana: "いっしゅうかんに どのぐらい こられますか。―さんかい こられます。", zh: "一週能來幾次？—能來3次。（頻率・次數）"}
    practice_note: "考點：どのぐらい 問時間／金錢／頻率／量／程度"
    practice:
      - {q: "（問時間/金錢）日本まで＿＿かかりますか。", a: "どのぐらい"}
      - {q: "（問頻率）一週間に＿＿運動しますか。", a: "どのぐらい", note: "（期間）に どのぐらい〜ますか"}
      - {q: "（答時間）どのぐらいかかりますか。―20＿＿かかります。", a: "時間", note: "じかん"}
      - {q: "（答金錢）どのぐらいかかりますか。―30＿＿です。", a: "万円", note: "まんえん"}
      - {q: "（答次數）一週間にどのぐらい来られますか。―3＿＿。", a: "回", note: "かい"}
      - {q: "「どのぐらいかかりますか」可以問哪兩種？", a: "時間／金錢"}
