track: 会話
topic: fukugou-au
order: 50
label: 〜合う
title: 會話｜複合動詞 V₁ます形＋合う（互相…）
# 來源：會話課板書（原從第23課抽出）

intro: |
  兩個動詞結合成複合動詞，「～合う」表示彼此「互相」做某動作。

goals:
  - "用「V₁ます形＋合う」表達互相做某事"

grammar:
  - point: "複合動詞　V₁ます形＋合う（互相…）"
    source: 会話
    explain: |
      兩個動詞結合，「～合う」表示彼此互相做某動作。
    examples:
      - {jp: "話し合う", kana: "はなしあう", zh: "互相討論、商量"}
      - {jp: "助け合う", kana: "たすけあう", zh: "互相幫助"}
      - {jp: "見合う → 見合い結婚", kana: "みあう → みあいけっこん", zh: "相親 → 相親結婚"}
    practice_note: "補充練習（非老師原題，自我練習用）"
    practice:
      - {q: "互相討論：話す＋合う →", a: "話し合う"}
      - {q: "互相幫助：助ける＋合う →", a: "助け合う"}
      - {q: "互相注視（→相親）：見る＋合う →", a: "見合う"}

vocab:
  - {jp: "助け合います", kana: "たすけあいます", zh: "互相幫助", pos: "動詞I", source: 会話, ex: {jp: "家族はいつも助け合います。", kana: "かぞくは いつも たすけあいます。", zh: "家人總是互相幫助。"}}
  - {jp: "見合い結婚", kana: "みあいけっこん", zh: "相親結婚", pos: "名詞", source: 会話, ex: {jp: "両親は見合い結婚でした。", kana: "りょうしんは みあいけっこんでした。", zh: "父母是相親結婚的。"}}
