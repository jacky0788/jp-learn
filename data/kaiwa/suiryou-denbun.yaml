track: 会話
topic: suiryou-denbun
order: 30
lesson: 18
label: 推測・伝聞
title: 會話｜推測・伝聞（かもしれません／でしょう／そうです／と言っていました）
# 來源：第18課課本＋會話課板書（2026學期）

intro: |
  第18課和「推測／聽來的消息」有關的句型整理：
  ・かもしれません：說話者自己的推測「也許…、說不定…」。
  ・でしょう／だろう：較有把握的推測「大概…吧」；だろうと思います＝我想大概…。
  ・そうです（伝聞）：轉述聽來的消息「聽說…」，接常体；常搭「〜によると／の話では」。
  ・〜と言っていました／と言っています：轉述某人說過的話（引用）。

goals:
  - "用「かもしれません」表達不確定的推測"
  - "用「でしょう／だろう（＋と思います）」表達較有把握的推測"
  - "用「そうです」轉述聽說的事（接常体，な形／N 加だ）"
  - "用「〜と言っていました」轉述某人說過的話"

grammar:
  - point: "～かもしれません（也許、可能）"
    source: 会話
    setsuzoku:
      - "V／い形／な形／N 的常体 ＋ かもしれません（な形・N 不加だ）"
    explain: |
      表示說話者的推測「也許…、說不定…」，不確定但有可能。可接過去（〜たかもしれません）。
      與「でしょう」比較：でしょう＝較有把握的推測；かもしれません＝可能性較低、只是其中一種可能。
    table:
      caption: "推測強弱 ＋ かもしれない 接續（⚠️ な形・N 不加 だ）"
      headers: ["項目", "說明／形式", "例"]
      rows:
        - ["把握高", "〜でしょう（大概…吧）", "{{明日|あした}}は{{晴|は}}れるでしょう"]
        - ["把握低", "〜かもしれない（說不定）", "{{雨|あめ}}が{{降|ふ}}るかもしれない"]
        - ["接 動詞／い形", "常体＋かもしれない", "ある／{{多|おお}}い＋かもしれない"]
        - ["接 な形／名詞", "語幹／N＋かもしれない（[不加だ]）", "{{雨|あめ}}[＋]かもしれない"]
    examples:
      - {jp: "飛行機に遅れるかもしれません。", kana: "ひこうきに おくれるかもしれません。", zh: "也許會趕不上飛機。"}
      - {jp: "明日はテストがあるかもしれません。", kana: "あしたは てすとが あるかもしれません。", zh: "明天說不定有考試。"}
      - {jp: "傘を電車に忘れたかもしれません。", kana: "かさを でんしゃに わすれたかもしれません。", zh: "傘可能忘在電車上了。（過去）"}
      - {jp: "休みは人が多いかもしれません。", kana: "やすみは ひとが おおいかもしれません。", zh: "假日人可能很多。（い形）"}
      - {jp: "明日は雨かもしれません。", kana: "あしたは あめかもしれません。", zh: "明天可能會下雨。（N，不加だ）"}
      - {jp: "一人で歩いていると、危ないかもしれません。", kana: "ひとりで あるいていると、あぶないかもしれません。", zh: "一個人走的話，可能會有危險。（い形）"}

  - point: "～そうです（伝聞：聽說）"
    source: 会話
    setsuzoku:
      - "V常体／い形／な形だ／Nだ ＋ そうです"
      - "常搭配「Nによると」（根據…）"
    explain: |
      傳達從他人、新聞或資料聽來的消息，說話者是在交代「消息來源」，不是根據外觀自行推測。
      接續用常体（普通形），な形與N要加だ；常與「〜によると／〜の話では」一起標明來源。

      ⚠️ 要和樣態「〜そうです（看起來…）」分開：伝聞接完整普通形（雨が降るそうです＝聽說會下雨）；
      樣態接語幹（雨が降りそうです＝看起來快下雨）。兩者形式相近，資訊來源完全不同。
    table:
      caption: "伝聞 そうです 的接續（⚠️ な形・N 要加 だ，和かもしれない相反）"
      headers: ["前接", "形式", "例"]
      rows:
        - ["動詞", "常体＋そうです", "{{降|ふ}}る＋そうです"]
        - ["い形容詞", "～い＋そうです", "{{忙|いそが}}しい＋そうです"]
        - ["な形容詞", "語幹＋[だ]＋そうです", "{{暇|ひま}}[だ]＋そうです"]
        - ["名詞", "N＋[だ]＋そうです", "{{先生|せんせい}}[だ]＋そうです"]
    examples:
      - {jp: "天気予報によると、明日は雨が降るそうです。", kana: "てんきよほうに よると、あしたは あめが ふる そうです。", zh: "根據氣象預報，聽說明天會下雨。"}
      - {jp: "田中さんは毎日暇だそうです。", kana: "たなかさんは まいにち ひまだ そうです。", zh: "聽說田中先生每天都很閒。"}
      - {jp: "彼は英語が下手だが、英語の先生だそうです。", kana: "かれは えいごが へただが、えいごの せんせいだ そうです。", zh: "聽說他英文很爛，卻是英文老師。"}
    practice_note: "考點：かもしれない（推測，な形N不加だ）vs そうです伝聞（な形N加だ）"
    practice:
      - {q: "（聽說會下雨）天気予報によると、明日は雨が＿＿。（降る）", a: "降るそうです", note: "V常体＋そうです"}
      - {q: "（な形伝聞）田中さんは料理が＿＿。（上手だ）", a: "上手だそうです", note: "な形＋だ＋そうです"}
      - {q: "（N伝聞）彼は日本語の＿＿。（先生だ）", a: "先生だそうです", note: "N＋だ＋そうです"}
      - {q: "（推測・N不加だ）明日は雨＿＿。（かもしれない）", a: "かもしれません", note: "N直接＋かもしれない"}
      - {q: "（推測・い形）一人で歩くと危ない＿＿。", a: "かもしれません"}
      - {q: "（辨別）な形/N 在「かもしれない」要不要加だ？", a: "不加だ", note: "そうです伝聞才加だ"}

  - point: "〜でしょう／だろう（＋と思います）：較有把握的推測"
    source: 会話
    key: true
    setsuzoku:
      - "V／い形／な形／N（常体）＋ だろう（丁寧＝でしょう）"
      - "〜だろうと思います／〜だろうと思っています（我想大概…）"
    explain: |
      「でしょう／だろう」＝較有把握的推測「大概…吧」（だろう是でしょう的普通体）。
      語調不同意思也不同：
      ・だろう／でしょう（平）＝推測。
      ・だろうか／でしょうか↗（升調）＝客氣詢問（丁寧問法）。
      ・だろうか／でしょうか↘（降調）＝自言自語式的提出、徵詢「…吧？」。
      若只比較說話者自己的推測，把握度通常是「でしょう／だろう」高於「かもしれない」。
      伝聞的「そうだ」是在轉述來源，不是說話者把握度刻度，不能放進同一條強弱排序。
      常說「〜だろうと思います」，用「と」引用自己的判斷內容。
    table:
      caption: "でしょう／だろう 接續與語調（板書）"
      headers: ["前接", "形式", "例"]
      rows:
        - ["動詞", "常体＋だろう／でしょう", "{{雨|あめ}}が{{降|ふ}}るでしょう"]
        - ["い形容詞", "〜い＋だろう", "{{暑|あつ}}いだろうと{{思|おも}}います"]
        - ["な形・名詞", "語幹／N＋だろう（[不加だ]）", "{{晴|は}}れ＋でしょう"]
        - ["語調", "でしょうか↗＝問／↘＝徵詢", "どこが いいでしょうか↗"]
    examples:
      - {jp: "明日は晴れでしょう。雨は降らないだろうと思います。", kana: "あしたは はれでしょう。あめは ふらないだろうと おもいます。", zh: "明天大概是晴天吧。我想不會下雨。"}
      - {jp: "今年の夏は暑くなるだろうと思います。", kana: "ことしの なつは あつく なるだろうと おもいます。", zh: "我想今年夏天大概會變熱。"}
      - {jp: "夏休みに海へ行きませんか。―いいですね。でも、どこがいいでしょうか。", kana: "なつやすみに うみへ いきませんか。―いいですね。でも、どこが いいでしょうか。", zh: "暑假要不要去海邊？—好啊，不過哪裡好呢？（でしょうか＝詢問）"}
    practice_note: "でしょう／だろう＋と思います"
    practice:
      - {q: "（較有把握：明天晴）明日は晴れ＿＿。", a: "でしょう"}
      - {q: "（我想大概會變熱）今年の夏は暑くなる＿＿と思います。", a: "だろう"}
      - {q: "（客氣詢問哪裡好）どこがいい＿＿。", a: "でしょうか", note: "升調＝丁寧問法"}

  - point: "〜と言っていました／と言います（引用：轉述某人說的話）"
    source: 会話
    key: true
    setsuzoku:
      - "（常体）＋ と言います（介紹／說明名稱）"
      - "（常体）＋ と言いました（某人說過了）"
      - "（常体）＋ と言っていました／と言っています（轉述某人說的話）"
    explain: |
      用「〜と」把引用內容標出來，再接「言います／言いました／言っていました」。
      ・と言います：介紹、說明名稱（これは小籠包と言います／私は李と言います）。
      ・と言いました：某人（過去）說了。
      ・と言っていました／と言っています：轉述某人說過／正在說的話（常用於傳話）。
      也可用「と思います／と思っています」表達自己的想法（同樣用と引用）。
    examples:
      - {jp: "これは「小籠包」と言います。", kana: "これは しょうろんぽうと いいます。", zh: "這個叫做「小籠包」。（介紹名稱）"}
      - {jp: "陳さんは「この町には殺人犯がいる」と言っていました。", kana: "ちんさんは「このまちには さつじんはんが いる」と いっていました。", zh: "陳先生說過「這個鎮上有殺人犯」。（轉述）"}
      - {jp: "王さんはあの時、日本に行きたいと言いました。", kana: "おうさんは あのとき、にほんに いきたいと いいました。", zh: "小王那時說想去日本。"}
    practice_note: "用と＋言う/思う引用"
    practice:
      - {q: "（介紹名稱）これは「小籠包」＿＿言います。", a: "と"}
      - {q: "（轉述某人說的）陳さんは来ないと＿＿。（言う・過去進行轉述）", a: "言っていました"}
      - {q: "（自己的想法）明日は雨が降る＿＿思います。", a: "と"}
