track: 会話
topic: nominalize
order: 120
label: の／こと
title: 會話｜の／こと（名詞化）
# 來源：會話課板書（原從第22課抽出）

intro: |
  把動詞句變成名詞使用。「の」可代表內容、人、物、地點、時間、原因…，
  多用於「看到／聽到某情景」與口語；「こと」較書面、抽象。

goals:
  - "用「の」把句子名詞化（指人、事、情景等）"

grammar:
  - point: "の／こと（名詞化）"
    source: 会話
    explain: |
      把動詞句變成名詞。「の」可代表內容、人、物、地點、時間、原因…；多用於「看到/聽到某情景」與口語。
    examples:
      - {jp: "二階にいるのは陳さんです。", kana: "にかいに いるのは ちんさんです。", zh: "在二樓的（人）是陳先生。"}
      - {jp: "子供が遊んでいるのが見える。", kana: "こどもが あそんでいるのが みえる。", zh: "看得到小孩在玩（的情景）。"}
      - {jp: "遅刻したのは電車が遅れたからです。", kana: "ちこくしたのは でんしゃが おくれたからです。", zh: "遲到是因為電車誤點。"}
