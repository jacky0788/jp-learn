track: 会話
topic: nominalize
order: 60
label: の／こと
title: 會話｜の／こと（名詞化：具體情景／固定句型／抽象內容）
# 來源：會話課板書（原從第22課抽出）＋同學會話筆記（A/B/C 分類補充）

intro: |
  把動詞句／形容詞句變成名詞使用。老師分三類整理：
  ・A：只能用「の」── 指人・物・時間・理由・地點，以及「知覚動詞」（聞こえる・見える）看到/聽到的情景。
  ・B：固定用「こと」── 能力（ことができる）、經驗（たことがある）；「趣味は〜こと」也慣用こと。
  ・C：有些述語前兩者都能出現，但語感不一定完全相同。
  大方向：「の」容易指眼前可感知的具體情景；「こと」容易指抽象的行為、事實或內容。
  選擇時要連同後面的述語一起看，不能只背「口語＝の、書面＝こと」。

goals:
  - A：用「の」把句子名詞化（人・物・時間・理由・地點、知覚動詞情景）
  - B：掌握固定用「こと」的能力、經驗句型，以及「趣味は〜こと」的慣用形式
  - C：分辨「の」偏具體情景、「こと」偏抽象內容時的語感差異
grammar:
  - point: "🔖 の／こと 用法總覽（圖解）"
    source: 会話
    explain: |
      課堂可先用 A／B／C 三類記憶，但實際使用還要看後面的述語與說話者想指的是
      「具體可感知的情景」還是「抽象行為／事實」。尤其 C 類不是任何情況都能毫無差別地替換。
    table:
      caption: の vs こと
      headers:
        - 分類
        - 用在哪
        - '{{例|れい}}'
      rows:
        -   - A 只用 [の]
            - 人・{{物|もの}}・{{時間|じかん}}・{{理由|りゆう}}・地點、知覺（{{見|み}}える/{{聞|き}}こえる）
            - '{{二階|にかい}}にいる[の]は{{陳|ちん}}さんです'
        -   - B 固定用 [こと]
            - 能力（ことができる）・經驗（たことがある）；{{趣味|しゅみ}}句慣用こと
            - '{{趣味|しゅみ}}は{{本|ほん}}を{{読|よ}}む[こと]です'
        -   - C 依語境選擇
            - 具體活動／情景偏の；抽象行為／事實偏こと
            - '{{野球|やきゅう}}をする[の/こと]が{{好|す}}き'
  - point: "A：只用「の」① 人・物・時間・理由・地點"
    source: 会話
    setsuzoku:
      - "（句子・常体）＋ の ＋ は／が … （把前句當名詞，強調某人事物）"
    explain: |
      「〜のは〜です」中的「の」代替前文所修飾、但沒有明說的人、物、時間或地點，
      把一個具體對象指出來；這種代名詞式的「の」不能換成抽象的「こと」。
      例如「会ったのは今朝です」是在指定「見面的時間＝今早」，焦點落在「今朝」。
      外層的「は」負責提出名詞化後的整段作主題，內層原句的助詞不變：
      「陳さんに会った」→「陳さんに会ったのは…」。
    examples:
      - {jp: "あそこにいるのは田中さんです。", kana: "あそこに いるのは たなかさんです。", zh: "在那裡的（人）是田中先生。（人）"}
      - {jp: "手にあるのは石です。", kana: "てに あるのは いしです。", zh: "手上的（東西）是石頭。（物）"}
      - {jp: "陳さんに会ったのは今朝です。", kana: "ちんさんに あったのは けさです。", zh: "遇到陳先生是今天早上。（時間）"}
      - {jp: "今日遅れたのはバスがなかなか来なかったからです。", kana: "きょう おくれたのは ばすが なかなか こなかったからです。", zh: "今天遲到是因為公車遲遲不來。（理由）"}
      - {jp: "私が生まれたのは東京です。", kana: "わたしが うまれたのは とうきょうです。", zh: "我出生的地方是東京。（地點）"}

  - point: "A：只用「の」② 知覚動詞（聞こえる・見える）"
    source: 会話
    explain: |
      用「聞こえる／見える」直接感知某個正在發生的具體情景時，通常用「の」：
      「赤ちゃんが泣いている」整段先由「の」名詞化，再由外層的「が」標示
      「聽見／看見的是什麼」。因此句中會同時出現內層主語的「が」與外層的「のが」；
      兩個「が」屬於不同層次，不是重複。
    examples:
      - {jp: "赤ちゃんが泣いているのが聞こえます。", kana: "あかちゃんが ないているのが きこえます。", zh: "聽得到嬰兒在哭。"}
      - {jp: "子供が遊んでいるのが見えます。", kana: "こどもが あそんでいるのが みえます。", zh: "看得到小孩在玩。"}

  - point: "B：固定用「こと」的能力・經驗；趣味句型慣用「こと」"
    source: 会話
    setsuzoku:
      - "① 能力：V（辭書形）＋ ことができる"
      - "② 經驗：V（た形）＋ ことがある"
      - "③ 興趣：趣味は ＋ V（辭書形）＋ ことです"
    explain: |
      「ことができる」與「たことがある」是固定句型，這裡的「こと」不能換成「の」。
      前者把辭書形動作當成「能做到的事」，後者把た形動作當成「存在過的經驗」。
      兩者的「が」都是外層述語「できる／ある」所要求的格助詞；原動詞內的助詞仍保留：
      「日本語を話す」→「日本語を話すことができる」。

      「趣味はVことです」是介紹興趣內容時最穩妥的慣用形式，但不能因此推論所有「喜歡做…」
      都只能用こと；日常會話的「Vのが好きです」非常自然。重點是固定搭配，而非「興趣」這個語意一律排斥の。
    examples:
      - {jp: "私は日本語を話すことができます。", kana: "わたしは にほんごを はなすことが できます。", zh: "我會說日語。（① 能力）"}
      - {jp: "私は日本へ行ったことがあります。", kana: "わたしは にほんへ いったことが あります。", zh: "我去過日本。（② 經驗）"}
      - {jp: "私の趣味はピアノを弾くことです。", kana: "わたしの しゅみは ぴあのを ひくことです。", zh: "我的興趣是彈鋼琴。（③ 興趣）"}
      - {jp: "朝早く起きることは大切です。", kana: "あさ はやく おきることは たいせつです。", zh: "早起是很重要的事。（抽象概念）"}

  - point: "C：の／こと 都可能使用，但具體情景與抽象內容有語感差"
    source: 会話
    explain: |
      有些述語前「の」與「こと」都可能出現，但並非永遠等義：
      ① 好き・嫌い・楽しい等評價具體活動時，會話常用「の」；談一般化、抽象行為時「こと」較自然。
      ② 知る・わかる前，「こと」常表示知道／理解一項事實或內容；「の」較容易指察覺眼前情景或變化。
      ③ 上手・下手通常描述人做某活動的熟練度，會話以「Vのが上手／下手」最自然。
      因此要先判斷自己是在指一幕具體情景，還是在談一件抽象的事，再選の／こと。
    examples:
      - {jp: "野球をするのが好きです。", kana: "やきゅうを するのが すきです。", zh: "喜歡打棒球。（① 後接形容詞，の・こと皆可）"}
      - {jp: "旅行をするのが楽しいです。", kana: "りょこうを するのが たのしいです。", zh: "旅行很開心。（① 後接形容詞）"}
      - {jp: "あの電車が台湾に来るのを知っていますか。", kana: "あの でんしゃが たいわんに くるのを しっていますか。", zh: "你知道那班電車要來台灣嗎？（② 知る）"}
    practice_note: "考點：の／こと 的選用（代替具體對象／固定句型／具體情景與抽象內容）"
    practice:
      - q: （A・指人）二階にいる＿＿は陳さんです。
        a: の
        note: 指人用の
      - q: （A・知覺）子供が遊んでいる＿＿が見える。
        a: の
        note: 見える/聞こえる用の
      - q: （B・興趣）趣味は本を読む＿＿です。
        a: こと
        note: 趣味は〜こと
      - q: （B・能力）日本語を話す＿＿ができます。
        a: こと
        note: ことができる
      - q: （B・經驗）日本へ行った＿＿があります。
        a: こと
        note: たことがある
      - q: （C・後接形容詞）野球をする＿＿が好きです。
        a: の
        note: 評價具體活動時，會話常用の
