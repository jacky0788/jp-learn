track: 会話
topic: kanoukei
order: 35
label: 可能形
title: 會話｜可能形（會、能）
# 來源：同學會話筆記（與文法課第22課重疊，這裡是會話課角度）

intro: |
  可能動詞表「會、能、可以」。會話課從兩個角度用：
  ・A 個人能力：主語本身會做（泳げる、走れる）。
  ・B 外在條件・允許：因條件而可能，或表「可以/不可以」（ここで写真が撮れる）。
  ⚠️ 及物動詞變可能形時，受詞助詞「を」常改成「が」（ピアノを弾く→ピアノが弾ける）。
  另外有兩個重點：
  ・可能形 ≒「〜ことができる」（私は英語が話せます＝私は英語を話すことができます）。
  ・「自發的感官」聞こえる・見える（不是能力，自然就聽到/看到）要和能力的 聞ける・見られる 分開。

goals:
  - "把動詞變可能形（I/II/III 類）"
  - "分辨 A 個人能力 與 B 外在條件・允許 兩種用法"
  - "記住可能句中「を→が」的變化"
  - "用「〜ことができる／〜ことはできない」表達可能・不可能"
  - "分辨「不能」的三種說法：ことはできません／可能形ません／てはいけません"
  - "分辨自發的 聞こえる・見える 與能力的 聞ける・見られる"

grammar:
  - point: "可能形的變化（複習）"
    source: 会話
    setsuzoku:
      - "I類（五段）：う段 → え段 ＋ る（飲む→飲める、行く→行ける、待つ→待てる）"
      - "II類（一段）：去る ＋ られる（食べる→食べられる、起きる→起きられる）"
      - "III類：する→できる、来る→来られる"
    explain: |
      可能動詞表「會、能」，活用像下一段動詞。
    table:
      caption: "可能形變化：辭書形 → 可能形（句中 を 常改 が）"
      headers: ["類別", "規則", "例"]
      rows:
        - ["I類（五段）", "う段 → え段 ＋ る", "{{飲|の}}む→{{飲|の}}[め]る／{{行|い}}く→{{行|い}}[け]る"]
        - ["II類（一段）", "去 る ＋ られる", "{{食|た}}べる→{{食|た}}べ[られ]る"]
        - ["III類", "する→できる／来る→来られる", "する→[できる]／{{来|く}}る→{{来|こ}}[られ]る"]
    examples:
      - {jp: "私はピアノが弾けます。", kana: "わたしは ぴあのが ひけます。", zh: "我會彈鋼琴。"}
      - {jp: "私は3キロ泳げます。", kana: "わたしは さんきろ およげます。", zh: "我能游3公里。"}

  - point: "⚠️ 意志動詞才有可能形（無意志動詞 × 沒有可能形）"
    source: 会話
    explain: |
      可能形只能用在「意志動詞」── 主語能自己控制、有意圖去做的動作（飲む・行く・話す…）。
      「無意志動詞」── 表自然發生、非人的意志（花開、下雨、出生…），本身不含「能不能做」的意思，
      所以【沒有可能形】，不可以變（咲ける×、降れる×）。
      想表達相關意思時改用別的說法（例：雨が降るかもしれない／花が咲いている）。
      ※「わかる」本身就含「能理解」之意，所以不需要也沒有可能形（×わかれる）。
    practice_note: "無意志動詞（×無可能形）清單──板書記下這幾個："
    examples:
      - {jp: "【無意志動詞×】わかる・要る・疲れる・咲く・生まれる・始まる・かかる・降る・閉まる・晴れる", kana: "わかる・いる・つかれる・さく・うまれる・はじまる・かかる・ふる・しまる・はれる", zh: "懂・需要・累・（花）開・出生・開始・花費・（雨）下・關閉・放晴 → 這些沒有可能形"}
      - {jp: "桜がきれいに咲きました。", kana: "さくらが きれいに さきました。", zh: "櫻花開得很漂亮。（○ 自然發生；×咲けました）"}
      - {jp: "急に雨が降ってきました。", kana: "きゅうに あめが ふってきました。", zh: "突然下起雨來。（○；×降れました）"}

  - point: "A 個人能力／B 外在條件・允許（を→が）"
    source: 会話
    explain: |
      A＝主語本身的能力；B＝因外在條件而可能，或表許可。及物動詞的「を」改「が」。
      禁止用「〜てはいけません」。
    examples:
      - {jp: "子供はもう歩けます。", kana: "こどもは もう あるけます。", zh: "小孩已經會走路了。（A 能力）"}
      - {jp: "ここで写真が撮れません。", kana: "ここで しゃしんが とれません。", zh: "這裡不能拍照。（B 條件，を→が）"}
      - {jp: "ここでおいしい料理が食べられます。", kana: "ここで おいしい りょうりが たべられます。", zh: "這裡吃得到好吃的料理。（B）"}
      - {jp: "10時以降はピアノを弾いてはいけません。", kana: "じゅうじ いこうは ぴあのを ひいては いけません。", zh: "10點以後不可以彈鋼琴。（禁止）"}

  - point: "〜ことができる／〜ことはできない（另一種可能表達）"
    source: 会話
    setsuzoku:
      - "V（辭書形）＋ ことができる／ことができない"
      - "≒ 可能動詞（私は英語が話せる ＝ 私は英語を話すことができる）"
    explain: |
      「〜ことができる」和可能動詞意思相同，語感較正式、客觀。
      「〜ことはできない」也常用來表達不可能／不被允許。
      ⚠️「立つことはできなくなった」比「立てなくなった」在描述上更鄭重、嚴重，
        後者較口語。意思相同但語感不同。
    examples:
      - {jp: "私は英語を話すことができます。", kana: "わたしは えいごを はなすことが できます。", zh: "我會說英語。（＝英語が話せます）"}
      - {jp: "ここでは写真を撮ることはできません。", kana: "ここでは しゃしんを とることは できません。", zh: "這裡不能拍照。"}
      - {jp: "私は海では泳ぐことはできません。", kana: "わたしは うみでは およぐことは できません。", zh: "我在海裡沒辦法游泳。（①個人能力不足）"}
      - {jp: "立つことはできなくなった。", kana: "たつことは できなく なった。", zh: "變得站不起來了。（語感較嚴重）"}

  - point: "「不能」的三種說法（語感差異）"
    source: 会話
    explain: |
      同樣表達「這裡不能拍照」，三種說法語感不同：
      ① ここでは写真を撮ることはできません＝最一般、中性的「不能」。
      ② ここでは写真が撮れません＝「（因條件）拍不了」，平常較少這樣說；單獨用常帶特殊含義
         （例如設備壞掉、暗到拍不出來），不是用來表示規定禁止。
      ③ ここでは写真を撮ってはいけません＝明確的「禁止」（規定不准）。
      → 想表達「規定不准」用①或③；②偏「客觀上辦不到」。
    examples:
      - {jp: "ここでは写真を撮ることはできません。", kana: "ここでは しゃしんを とることは できません。", zh: "這裡不能拍照。（①中性）"}
      - {jp: "ここでは写真が撮れません。", kana: "ここでは しゃしんが とれません。", zh: "這裡拍不了照。（②客觀辦不到，を→が）"}
      - {jp: "ここで写真を撮ってはいけません。", kana: "ここで しゃしんを とっては いけません。", zh: "這裡禁止拍照。（③禁止）"}

  - point: "聞こえる・見える（自發）vs 聞ける・見られる（可能）"
    source: 会話
    explain: |
      ⚠️ 容易混淆，務必分清楚：
      ・聞こえる／見える＝「自然而然聽得到／看得到」，不是靠能力，是聲音・景象自己傳進來
        （非有能力可動，不想聽也聽得到）。
      ・聞ける／見られる＝可能動詞，表「有能力或有機會去聽／去看」。
    examples:
      - {jp: "猫の声が聞こえます。", kana: "ねこの こえが きこえます。", zh: "（自然）聽得到貓的叫聲。（聞こえる＝自發）"}
      - {jp: "ここから海が見えます。", kana: "ここから うみが みえます。", zh: "從這裡看得到海。（見える＝自發）"}
      - {jp: "このアプリで日本のラジオが聞けます。", kana: "この あぷりで にほんの らじおが きけます。", zh: "用這個App可以聽日本的廣播。（聞ける＝可能）"}
      - {jp: "週末なら映画が見られます。", kana: "しゅうまつなら えいがが みられます。", zh: "週末的話可以看電影。（見られる＝可能）"}

  - point: "補充：なる（自然變化）vs する（意志・可控制）"
    source: 会話
    explain: |
      和可能・狀態相關的延伸對比：
      ・なる＝自動詞、表「自然而然的變化」，不是人刻意做的（無意志、不可控）。
      ・する＝他動詞、表「人有意去做、可控制」（有意志）。
      同一件事看是「自己變成這樣」還是「有人讓它變這樣」，就用 なる／する 區分。
    examples:
      - {jp: "エアコンで部屋が涼しくなった。", kana: "えあこんで へやが すずしく なった。", zh: "因為冷氣，房間（自己）變涼了。（なる＝自然變化）"}
      - {jp: "暑いので、部屋を涼しくしました。", kana: "あついので、へやを すずしく しました。", zh: "因為很熱，（我）把房間弄涼了。（する＝意志可控）"}
      - {jp: "立てなくなった。", kana: "たてなく なった。", zh: "變得站不起來了。（なる＝狀態自然變化）"}
