track: 会話
topic: kanoukei
order: 35
lesson: 17
label: 可能形
title: 會話｜可能形（會、能）
# 來源：同學會話筆記（與文法課第22課重疊，這裡是會話課角度）

intro: |
  可能動詞表「會、能、可以」。會話課從兩個角度用：
  ・A 個人能力：主語本身會做（泳げる、走れる）。
  ・B 外在條件・可實現性：因時間、場所、設備等條件而做得到（ここで写真が撮れる）。
  ⚠️ 及物動詞變可能形時，受詞助詞「を」常改成「が」（ピアノを弾く→ピアノが弾ける）。
  另外有兩個重點：
  ・可能形 ≒「〜ことができる」（私は英語が話せます＝私は英語を話すことができます）。
  ・「自發的感官」聞こえる・見える（不是能力，自然就聽到/看到）要和能力的 聞ける・見られる 分開。

goals:
  - 把動詞變可能形（I/II/III 類）
  - 分辨 A 個人能力 與 B 外在條件・可實現性 兩種用法
  - 記住可能句中「を→が」的變化
  - 用「〜ことができる／〜ことはできない」表達可能・不可能
  - 分辨「不能」的三種說法：ことはできません／可能形的否定／てはいけません
  - 分辨可能形的「條件上做得到」與「〜てもいい」的明確許可
  - 分辨自發的 聞こえる・見える 與能力的 聞ける・見られる
grammar:
  - point: "可能形的變化（複習）"
    source: 会話
    setsuzoku:
      - "I類（五段）：う段 → え段 ＋ る（飲む→飲める、行く→行ける、待つ→待てる）"
      - "II類（一段）：去る ＋ られる（食べる→食べられる、起きる→起きられる）"
      - "III類：する→できる、来る→来られる"
    explain: |
      可能動詞表能力或條件上的「會／能」。變成可能形後，不論原本是五段還是一段，
      都按一段動詞方式活用：話せる→話せない／話せます，食べられる→食べられない／食べられます。
      II類的「〜られる」外形也可能表示被動或尊敬，要配合助詞與上下文判斷。
    table:
      caption: "可能形變化：辭書形 → 可能形（句中 を 常改 が）"
      headers: ["類別", "規則", "例"]
      rows:
        - ["I類（五段）", "う段 → え段 ＋ る", "{{飲|の}}む→{{飲|の}}[め]る／{{行|い}}く→{{行|い}}[け]る"]
        - ["II類（一段）", "去 る ＋ られる", "{{食|た}}べる→{{食|た}}べ[られ]る"]
        - ["III類", "する→できる／来る→来られる", "する→[できる]／{{来|く}}る→{{来|こ}}[られ]る"]
    examples:
      - {jp: "私はピアノが弾けます。", kana: "わたしは ぴあのが ひけます。", zh: "我會彈鋼琴。"}
      - {jp: "私は3キロ泳げます。", kana: "わたしは さんきろ およげます。", zh: "我能游3公里。"}
    practice_note: "考點：動詞變可能形（I/II/III）、を→が、不能說法、自發 vs 可能"
    practice:
      - {q: "（I類→可能形）行く →", a: "行ける", note: "う段→え段＋る"}
      - {q: "（I類→可能形）飲む →", a: "飲める", note: "う段→え段＋る"}
      - {q: "（II類→可能形）食べる →", a: "食べられる", note: "去る＋られる"}
      - {q: "（III類→可能形）する →", a: "できる", note: "変格"}
      - {q: "（を→が）ピアノ＿弾けます。", a: "が", note: "可能句中 を 常改 が"}
      - {q: "（自發，非能力）猫の声が＿＿。（聞こえる）", a: "聞こえます", note: "自然傳入用聞こえる"}
      - {q: "（禁止）ここで写真を撮っては＿＿。", a: "いけません", note: "〜てはいけません"}

  - point: "⚠️ 可能形以可控制動作為中心；無意志動詞要先確認想表達什麼"
    source: 会話
    explain: |
      初學時，可能形最自然地用在主體可控制的動作（飲む・行く・話す），因為能力與意志容易成立。
      自然現象或狀態動詞若只是要說「可能會發生」，通常改用「〜かもしれない」；
      例如「雨が降るかもしれない」，不說「雨が降れる」。

      但「無意志動詞一律沒有可能形」並非絕對規則。當句子談品種、構造等**具備實現條件**時，
      「この花は寒い所でも咲ける（這種花在寒冷處也能開）」可以成立。
      另一些詞本身已有可能／狀態意思，不再造可能形：わかる已是「懂」，要る是「需要」；
      「わかれる」會被理解成另一個動詞「分かれる（分開）」，不是「能懂」。
      因此不要只看動詞類別機械變形，先確認「能力、條件可能、單純預測」哪個意思才是重點。
    practice_note: "先判斷語意：能力／條件可實現可用可能形；單純預測多用 かもしれない"
    examples:
      - jp: わかる・要る・疲れる・生まれる・始まる・かかる・降る・閉まる・晴れる
        kana: わかる・いる・つかれる・うまれる・はじまる・かかる・ふる・しまる・はれる
        zh: 懂・需要・累・出生・開始・花費・（雨）下・關閉・放晴 → 初學時通常不用可能形，依語意改說法
      - jp: 桜がきれいに咲きました。
        kana: さくらが きれいに さきました。
        zh: 櫻花開得很漂亮。（單純敘述自然發生，用咲きました）
      - jp: この花は寒い所でも咲けます。
        kana: この はなは さむい ところでも さけます。
        zh: 這種花在寒冷的地方也能開。（談品種具備的條件時，咲ける可以成立）
      - jp: 急に雨が降ってきました。
        kana: きゅうに あめが ふってきました。
        zh: 突然下起雨來。（○；×降れました）
  - point: "A 個人能力／B 外在條件・可實現性（を→が）"
    source: 会話
    explain: |
      A＝主語本身的能力；B＝設備、時間、場所等外在條件使動作能實現。及物動詞的對象常由「を」改成「が」，
      因為可能句是在描述「哪個對象屬於能做到的範圍」；若用「は」則常是對比。

      可能形有時能依場景推知「這裡允許…」，但文法核心仍是「做得到／條件容許」，不是專門的許可句。
      要明確詢問許可用「〜てもいいですか」，明確禁止用「〜てはいけません」。
    examples:
      - jp: 子供はもう歩けます。
        kana: こどもは もう あるけます。
        zh: 小孩已經會走路了。（A 能力）
      - jp: ここで写真が撮れません。
        kana: ここで しゃしんが とれません。
        zh: 這裡拍不了照。（B 外在條件／可實現性，を→が）
      - jp: ここでおいしい料理が食べられます。
        kana: ここで おいしい りょうりが たべられます。
        zh: 這裡吃得到好吃的料理。（B）
      - jp: '{{10|じゅう}}{{時|じ}}{{以降|いこう}}はピアノを{{弾|ひ}}いてはいけません。'
        kana: じゅうじ いこうは ぴあのを ひいては いけません。
        zh: 10點以後不可以彈鋼琴。（禁止）
  - point: "〜ことができる／〜ことはできない（另一種可能表達）"
    source: 会話
    setsuzoku:
      - "V（辭書形）＋ ことができる／ことができない"
      - "≒ 可能動詞（私は英語が話せる ＝ 私は英語を話すことができる）"
    explain: |
      「〜ことができる」和可能動詞意思相同，語感較正式、客觀。
      「〜ことはできない」也常用來表達不可能／不被允許。
      結構上，原動詞的助詞保留在名詞化小句內（英語**を**話す），「こと」把整段變成名詞，
      外層再由「が」接「できる」。肯定中性說「ことができる」；用「ことはできる／できない」時，
      「は」通常帶對比或限定：「做倒是做得到，但…／這件事不能做」。
      ⚠️「立つことはできなくなった」比「立てなくなった」在描述上更鄭重、嚴重，
        後者較口語。意思相同但語感不同。
    examples:
      - {jp: "私は英語を話すことができます。", kana: "わたしは えいごを はなすことが できます。", zh: "我會說英語。（＝英語が話せます）"}
      - {jp: "ここでは写真を撮ることはできません。", kana: "ここでは しゃしんを とることは できません。", zh: "這裡不能拍照。"}
      - {jp: "私は海では泳ぐことはできません。", kana: "わたしは うみでは およぐことは できません。", zh: "我在海裡沒辦法游泳。（①個人能力不足）"}
      - {jp: "立つことはできなくなった。", kana: "たつことは できなく なった。", zh: "變得站不起來了。（語感較嚴重）"}

  - point: "「不能」的三種說法（語感差異）"
    source: 会話
    explain: |
      同樣表達「這裡不能拍照」，三種說法語感不同：
      ① ここでは写真を撮ることはできません＝最一般、中性的「不能」。
      ② ここでは写真が撮れません＝「（因條件）拍不了」，平常較少這樣說；單獨用常帶特殊含義
         （例如設備壞掉、暗到拍不出來），不是用來表示規定禁止。
      ③ ここでは写真を撮ってはいけません＝明確的「禁止」（規定不准）。
      → 想表達「規定不准」用①或③；②偏「客觀上辦不到」。
    examples:
      - {jp: "ここでは写真を撮ることはできません。", kana: "ここでは しゃしんを とることは できません。", zh: "這裡不能拍照。（①中性）"}
      - {jp: "ここでは写真が撮れません。", kana: "ここでは しゃしんが とれません。", zh: "這裡拍不了照。（②客觀辦不到，を→が）"}
      - {jp: "ここで写真を撮ってはいけません。", kana: "ここで しゃしんを とっては いけません。", zh: "這裡禁止拍照。（③禁止）"}

    practice:
      - q: （能力／條件）この部屋では写真＿きれいに撮れます。
        a: が
        note: 可能形的對象常用が
      - q: （對比）日本語＿話せますが、英語は話せません。
        a: は
        note: は把日語與英語拿來對比
      - q: （明確詢問許可）ここで写真を撮っ＿＿いいですか。
        a: ても
        note: 許可用〜てもいいですか
  - point: "聞こえる・見える（自發）vs 聞ける・見られる（可能）"
    source: 会話
    explain: |
      ⚠️ 容易混淆，務必分清楚：
      ・聞こえる／見える＝「自然而然聽得到／看得到」，不是靠能力，是聲音・景象自己傳進來
        （非有能力可動，不想聽也聽得到）。
      ・聞ける／見られる＝可能動詞，表「有能力或有機會去聽／去看」。
    examples:
      - {jp: "猫の声が聞こえます。", kana: "ねこの こえが きこえます。", zh: "（自然）聽得到貓的叫聲。（聞こえる＝自發）"}
      - {jp: "ここから海が見えます。", kana: "ここから うみが みえます。", zh: "從這裡看得到海。（見える＝自發）"}
      - {jp: "このアプリで日本のラジオが聞けます。", kana: "この あぷりで にほんの らじおが きけます。", zh: "用這個App可以聽日本的廣播。（聞ける＝可能）"}
      - {jp: "週末なら映画が見られます。", kana: "しゅうまつなら えいがが みられます。", zh: "週末的話可以看電影。（見られる＝可能）"}

  - point: "補充：なる（自然變化）vs する（意志・可控制）"
    source: 会話
    explain: |
      和可能・狀態相關的延伸對比：
      ・なる＝自動詞，句子的主語「變成某狀態」；焦點在變化結果（部屋が涼しくなる）。
      ・する＝他動詞，行為者「使某個對象成為某狀態」；對象通常用を（部屋を涼しくする）。
      「なる」不等於完全沒有人的意志，例如「医者になる」也可以是有意追求的結果；
      真正穩定的判準是「誰變了」與「誰把什麼改變」，而不是只背自然／刻意。
    examples:
      - {jp: "エアコンで部屋が涼しくなった。", kana: "えあこんで へやが すずしく なった。", zh: "因為冷氣，房間（自己）變涼了。（なる＝自然變化）"}
      - {jp: "暑いので、部屋を涼しくしました。", kana: "あついので、へやを すずしく しました。", zh: "因為很熱，（我）把房間弄涼了。（する＝意志可控）"}
      - {jp: "立てなくなった。", kana: "たてなく なった。", zh: "變得站不起來了。（なる＝狀態自然變化）"}
