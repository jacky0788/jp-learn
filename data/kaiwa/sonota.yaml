track: 会話
topic: sonota
order: 70
label: 其他句型
title: 會話｜ないで・なくて／複合動詞〜合う
# 來源：會話課板書

intro: |
  ・～ないで／～なくて：兩個都是「沒做某事」，但 ないで 後接動作（在沒做的狀態下做別的）、
    なくて 後接結果/狀態（因為沒做而…）。請別人「不要做」用「～ないでください」。
  ・複合動詞 V₁ます形＋合う：表示彼此「互相」做某動作。

goals:
  - "分辨「ないで」（狀態下做別的）與「なくて」（因為沒做而…）"
  - "用「V₁ます形＋合う」表達互相做某事"

grammar:
  - point: "～ないで／～なくて 的差別"
    source: 会話
    explain: |
      Vないで＋動作：在「沒做前項」的狀態下做後項（ごはんを食べないで、会社へ行く＝沒吃飯就去公司）。
      Vなくて＋結果/狀態：因為「沒做前項」而造成後項（ごはんを食べなくて、おなかがすいた）。
      請求別人「不要做」用「～ないでください」。
    table:
      caption: "～ないで vs ～なくて（都是「沒做前項」）"
      headers: ["", "後面接", "意思", "例"]
      rows:
        - ["～ないで", "動作", "在沒做X的狀態下做Y", "ごはんを{{食|た}}べ[ないで]、{{会社|かいしゃ}}へ{{行|い}}く"]
        - ["～なくて", "結果／狀態", "因為沒做X而造成Y", "ごはんを{{食|た}}べ[なくて]、おなかがすいた"]
    examples:
      - {jp: "ごはんを食べないで、会社へ行きます。", kana: "ごはんを たべないで、かいしゃへ いきます。", zh: "不吃飯就去公司。"}
      - {jp: "笑わないでください。", kana: "わらわないでください。", zh: "請不要笑。"}

  - point: "複合動詞　V₁ます形＋合う（互相…）"
    source: 会話
    explain: |
      兩個動詞結合，「～合う」表示彼此互相做某動作。
    examples:
      - {jp: "話し合う", kana: "はなしあう", zh: "互相討論、商量"}
      - {jp: "助け合う", kana: "たすけあう", zh: "互相幫助"}
      - {jp: "見合う → 見合い結婚", kana: "みあう → みあいけっこん", zh: "相親 → 相親結婚"}
    practice_note: "考點：V₁ます形＋合う（互相）、ないで／なくて"
    practice:
      - {q: "互相討論：話す＋合う →", a: "話し合う"}
      - {q: "互相幫助：助ける＋合う →", a: "助け合う"}
      - {q: "互相注視（→相親）：見る＋合う →", a: "見合う"}
      - {q: "互相理解：分かる＋合う →", a: "分かり合う"}
      - {q: "（沒做X就做Y）朝ごはんを食べ＿＿、会社へ行く。", a: "ないで", note: "ないで＝附帶狀況"}
      - {q: "（請別人不要做）笑わ＿＿ください。", a: "ないで", note: "〜ないでください"}
