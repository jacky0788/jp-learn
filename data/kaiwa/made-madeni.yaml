track: 会話
topic: made-madeni
order: 90
label: まで／までに
title: 會話｜～まで／～までに（持續到／期限前）
# 來源：會話課板書（原從第22課抽出）

intro: |
  「まで」＝動作持續「到」某時間點；「までに」＝在某時間點「之前」完成某瞬間動作。

goals:
  - "分辨「まで」（持續到）與「までに」（期限前完成）"

grammar:
  - point: "～まで／～までに（持續到／期限前）"
    source: 会話
    explain: |
      まで：動作「持續」到某時間點（10時まで起きています＝醒著到10點）。
      までに：在某時間點「之前」完成某瞬間動作（10時までに起きてください＝10點前起床）。
    examples:
      - {jp: "10時まで起きています。", kana: "じゅうじまで おきています。", zh: "（一直）醒到10點。"}
      - {jp: "10時までに起きてください。", kana: "じゅうじまでに おきてください。", zh: "請在10點前起床。"}
