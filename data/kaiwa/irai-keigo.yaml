track: 会話
topic: irai-keigo
order: 130
label: お〜ください
title: 會話｜請求的尊敬說法（お〜ください／召し上がる）
# 來源：同學會話筆記

intro: |
  比「〜てください」更客氣、尊敬的請求說法：
  ・お＋Vます形＋ください（和語動詞）／ご＋漢語＋ください。
  ・特殊尊敬語：食べる・飲む → 召し上がる（召し上がってください＝請享用）。

goals:
  - "用「お〜ください／ご〜ください」做尊敬的請求"
  - "用「召し上がってください」請對方享用（食べる/飲む 的尊敬語）"

grammar:
  - point: "お＋Vます形＋ください／ご＋漢語＋ください（尊敬的請求）"
    source: 会話
    setsuzoku:
      - "お ＋ 和語動詞（ます形去ます）＋ ください"
      - "ご ＋ 漢語（する動詞語幹）＋ ください"
    explain: |
      比「〜てください」更尊敬有禮。基準說法是「Vてください」（食べてください）；
      尊敬版用「お＋Vます＋ください」（和語）或「ご＋漢語＋ください」。
      這是抬高對方動作的尊敬表現，所以只用於**對方要做的事**，不用來說自己的動作。
      「お／ご」的分法是常見原則而非字源測驗，慣用例外要整組記（お電話ください、
      ごゆっくり等）。一音節ます語幹或已有固定尊敬語的動詞，通常改用慣用形式而不硬套。
    table:
      caption: "請求的客氣度：一般 → 尊敬"
      headers: ["客氣度", "形式", "例"]
      rows:
        - ["一般", "V て形 ＋ ください", "{{書|か}}いてください"]
        - ["尊敬（和語）", "[お] ＋ Vます ＋ ください", "[お]{{書|か}}きください"]
        - ["尊敬（漢語）", "[ご] ＋ 漢語 ＋ ください", "[ご]{{連絡|れんらく}}ください"]
        - ["特殊尊敬語", "召し上がってください", "{{召|め}}し{{上|あ}}がってください（請享用）"]
    examples:
      - {jp: "こちらでお待ちください。", kana: "こちらで おまちください。", zh: "請在這邊稍候。"}
      - {jp: "お書きください。", kana: "おかきください。", zh: "請寫。"}
      - {jp: "ご連絡ください。", kana: "ごれんらく ください。", zh: "請（與我）聯絡。"}

  - point: "召し上がってください（請享用：食べる・飲む 的尊敬語）"
    source: 会話
    setsuzoku:
      - "食べる・飲む → 召し上がる ＋ てください"
    explain: |
      「召し上がる」是「食べる／飲む」的尊敬語，主體是應受尊敬的對方。
      請對方享用時用「召し上がってください」；不能用來說自己吃喝，自己要用謙讓語「いただきます」。
    examples:
      - {jp: "どうぞ召し上がってください。", kana: "どうぞ めしあがってください。", zh: "請享用。"}
      - {jp: "温かいうちに召し上がってください。", kana: "あたたかいうちに めしあがってください。", zh: "請趁熱享用。"}
    practice_note: "考點：お＋Vます＋ください（和語）／ご＋漢語＋ください、特殊尊敬語"
    practice:
      - {q: "（尊敬・和語）書く →「請寫」", a: "お書きください", note: "お＋ます＋ください"}
      - {q: "（尊敬・和語）待つ →「請稍候」", a: "お待ちください"}
      - {q: "（尊敬・漢語）連絡する →「請聯絡」", a: "ご連絡ください", note: "ご＋漢語＋ください"}
      - {q: "（和語還是漢語？）「ご利用ください」用 お 還是 ご？", a: "ご", note: "漢語用ご"}
      - {q: "（尊敬語）食べる・飲む 的尊敬語動詞是？", a: "召し上がる"}
      - {q: "（請享用）どうぞ＿＿てください。（召し上がる）", a: "召し上がっ"}
