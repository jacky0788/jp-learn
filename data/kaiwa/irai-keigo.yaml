track: 会話
topic: irai-keigo
order: 130
label: お〜ください
title: 會話｜請求的尊敬說法（お〜ください／召し上がる）
# 來源：同學會話筆記

intro: |
  比「〜てください」更客氣、尊敬的請求說法：
  ・お＋Vます形＋ください（和語動詞）／ご＋漢語＋ください。
  ・特殊尊敬語：食べる・飲む → 召し上がる（召し上がってください＝請享用）。

goals:
  - "用「お〜ください／ご〜ください」做尊敬的請求"
  - "用「召し上がってください」請對方享用（食べる/飲む 的尊敬語）"

grammar:
  - point: "お＋Vます形＋ください／ご＋漢語＋ください（尊敬的請求）"
    source: 会話
    setsuzoku:
      - "お ＋ 和語動詞（ます形去ます）＋ ください"
      - "ご ＋ 漢語（する動詞語幹）＋ ください"
    explain: |
      比「〜てください」更尊敬有禮。基準說法是「Vてください」（食べてください）；
      尊敬版用「お＋Vます＋ください」（和語）或「ご＋漢語＋ください」。
    examples:
      - {jp: "こちらでお待ちください。", kana: "こちらで おまちください。", zh: "請在這邊稍候。"}
      - {jp: "お書きください。", kana: "おかきください。", zh: "請寫。"}
      - {jp: "ご連絡ください。", kana: "ごれんらく ください。", zh: "請（與我）聯絡。"}

  - point: "召し上がってください（請享用：食べる・飲む 的尊敬語）"
    source: 会話
    setsuzoku:
      - "食べる・飲む → 召し上がる ＋ てください"
    explain: |
      「召し上がる」是「食べる／飲む」的尊敬語，請對方吃／喝時用。
    examples:
      - {jp: "どうぞ召し上がってください。", kana: "どうぞ めしあがってください。", zh: "請享用。"}
      - {jp: "温かいうちに召し上がってください。", kana: "あたたかいうちに めしあがってください。", zh: "請趁熱享用。"}
