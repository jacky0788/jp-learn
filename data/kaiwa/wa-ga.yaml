track: 会話
topic: wa-ga
order: 85
label: 大主語・小主語（は〜が）
title: 會話｜大主語は＋小主語が〜です（象は鼻が長い）
# 來源：本人會話課板書（2026學期，2026-01起）

intro: |
  日文常見的「主題＋小主語」結構：
  「（大主語）は （小主語）が 〜です。」
  ・大主語＝整體的主題（用は）；小主語＝大主語的某一部分／範圍（用が）。
  ・小主語通常是「大主語の○○」的關係（象は鼻が長い＝象の鼻が長い）。
  用來描述「某人事物，它的某部分／某方面如何」。

goals:
  - "用「Aは Bが 〜です」描述大主語的某個部分・方面"
  - "理解小主語 B 通常是「Aの B」（整體中的一部分）"

grammar:
  - point: "（大主語）は（小主語）が〜です"
    source: 会話
    setsuzoku:
      - "A（大主語）は ＋ B（小主語）が ＋ 形容詞／状態 です"
      - "B 多為「A の B」（A 的一部分／一個方面）"
    explain: |
      先用「は」提出整體主題（大主語），再用「が」帶出它的某個部分或方面（小主語）來描述。
      ・象は鼻が長いです＝（就象而言）鼻子很長。
      ・この部屋は台所が大きいです＝（這個房間）廚房很大。
      ・花はバラが好きです＝（花裡面）我喜歡玫瑰。（大範圍→小範圍）
    table:
      caption: "結構：大主語[は] ＋ 小主語[が] ＋ 述語"
      headers: ["大主語 は", "小主語 が", "述語", "中文"]
      rows:
        - ["{{象|ぞう}}[は]", "{{鼻|はな}}[が]", "{{長|なが}}いです", "象的鼻子很長"]
        - ["この{{部屋|へや}}[は]", "{{台所|だいどころ}}[が]", "{{大|おお}}きいです", "這房間廚房大"]
        - ["{{花|はな}}[は]", "バラ[が]", "{{好|す}}きです", "花裡我喜歡玫瑰"]
    examples:
      - {jp: "象は鼻が長いです。", kana: "ぞうは はなが ながいです。", zh: "象的鼻子很長。（大主語象＋小主語鼻）"}
      - {jp: "この部屋は台所が大きいです。", kana: "このへやは だいどころが おおきいです。", zh: "這個房間廚房很大。（部屋の台所）"}
      - {jp: "花はバラが好きです。", kana: "はなは ばらが すきです。", zh: "花之中我喜歡玫瑰。（大範圍→小範圍）"}
    practice_note: "考點：大主語用は、小主語用が"
    practice:
      - {q: "象＿鼻＿長いです。（填助詞）", a: "は、が", note: "大主語は＋小主語が"}
      - {q: "この部屋＿台所が大きいです。", a: "は", note: "大主語用は"}
      - {q: "象は鼻＿長いです。", a: "が", note: "小主語用が"}
      - {q: "「花裡我喜歡玫瑰」花＿バラ＿好きです。", a: "は、が"}
      - {q: "「他個子高」彼＿背＿高いです。", a: "は、が"}
      - {q: "小主語（鼻・台所）通常是大主語的什麼？", a: "一部分／一個方面", note: "Aの B"}
