track: 会話
topic: wa-ga
order: 85
label: 大主語・小主語（は〜が）
title: 會話｜大主語は＋小主語が〜です（象は鼻が長い）
# 來源：本人會話課板書（2026學期，2026-01起）

intro: |
  日文常見的「主題＋主語」結構：「Aは Bが 〜です」。教材常把 A、B 暫稱大主語、小主語，
  但更精確地說：A 的「は」提出談論範圍，B 的「が」標示真正由述語直接描述的成分。
  B 常是 A 的一部分（象は鼻が長い＝象の鼻が長い），也可能是在 A 這個範圍內被選出的對象
  （花はバラが好き＝談到花，我喜歡玫瑰）。理解「話題範圍」與「述語焦點」比硬背兩個主語更可靠。

goals:
  - "用「Aは Bが 〜です」描述大主語的某個部分・方面"
  - "理解小主語 B 通常是「Aの B」（整體中的一部分）"

grammar:
  - point: "（大主語）は（小主語）が〜です"
    source: 会話
    setsuzoku:
      - "A（大主語）は ＋ B（小主語）が ＋ 形容詞／状態 です"
      - "B 多為「A の B」（A 的一部分／一個方面）"
    explain: |
      先用「は」設定「接下來談 A」，再用「が」指出述語直接描述的是 B。
      ・象は鼻が長いです＝（就象而言）鼻子很長。
      ・この部屋は台所が大きいです＝（這個房間）廚房很大。
      這兩句可還原為「象の鼻が長い／この部屋の台所が大きい」，所以是典型的整體—部分關係。

      但「花はバラが好きです」不是「花的玫瑰」；「花は」設定花這個比較範圍，
      「バラが」是「好き」所選出的喜愛對象，感受者「私は」由上下文省略。
      同類述語還有「〜がわかる／できる／上手だ／下手だ」。所以「が」並不是因為要強調，
      而是先由述語決定它標示的角色；改成「は」才常帶出對比，例如「英語はわかりますが、中国語はわかりません」。
    table:
      caption: "結構：大主語[は] ＋ 小主語[が] ＋ 述語"
      headers: ["大主語 は", "小主語 が", "述語", "中文"]
      rows:
        - ["{{象|ぞう}}[は]", "{{鼻|はな}}[が]", "{{長|なが}}いです", "象的鼻子很長"]
        - ["この{{部屋|へや}}[は]", "{{台所|だいどころ}}[が]", "{{大|おお}}きいです", "這房間廚房大"]
        - ["{{花|はな}}[は]", "バラ[が]", "{{好|す}}きです", "花裡我喜歡玫瑰"]
    examples:
      - {jp: "{{象|ぞう}}は{{鼻|はな}}が{{長|なが}}いです。", kana: "ぞうは はなが ながいです。", zh: "象的鼻子很長。（大主語象＋小主語鼻）"}
      - {jp: "この部屋は台所が大きいです。", kana: "このへやは だいどころが おおきいです。", zh: "這個房間廚房很大。（部屋の台所）"}
      - {jp: "花はバラが好きです。", kana: "はなは ばらが すきです。", zh: "花之中我喜歡玫瑰。（大範圍→小範圍）"}
    practice_note: "考點：大主語用は、小主語用が"
    practice:
      - q: 象＿鼻＿長いです。（填助詞）
        a: は、が
        note: 大主語は＋小主語が
      - q: この部屋＿台所が大きいです。
        a: は
        note: 大主語用は
      - q: 象は鼻＿長いです。
        a: が
        note: 小主語用が
      - q: 「花裡我喜歡玫瑰」花＿バラ＿好きです。
        a: は、が
      - q: 「他個子高」彼＿背＿高いです。
        a: は、が
      - q: 小主語（鼻・台所）通常是大主語的什麼？
        a: 一部分／一個方面
        note: Aの B
      - q: 「花はバラが好きです」中，省略的感受者通常是誰？
        a: 私（說話者）
        note: 花は是範圍，バラが是好き的對象
