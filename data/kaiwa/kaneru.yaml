track: 会話
topic: kaneru
order: 120
label: かねる／かねない
title: 會話｜Vます＋かねる／かねない（難以…／很可能…）
# 來源：同學會話筆記

intro: |
  兩個長得像、意思卻相反的句型，要分清楚：
  ・〜かねる：難以、礙難做到（＝できません 的委婉說法，常用於服務業婉拒）。
  ・〜かねない：很有可能（發生不好的事）（＝する可能性がある）。

goals:
  - "用「〜かねる」委婉表達難以做到"
  - "用「〜かねない」表達「可能會（變壞）」"
  - "分清 かねる（難以做）vs かねない（可能發生壞事）"

grammar:
  - point: "🔖 かねる／かねない 對比（圖解・意思相反）"
    source: 会話
    explain: |
      長得超像、意思卻相反！都接「Vます形（去ます）」。
    table:
      caption: "⚠️ かねる ≠ かねない"
      headers: ["形式", "意思", "語感", "例"]
      rows:
        - ["〜かねる", "難以…／無法…", "＝できません 的委婉（婉拒）", "{{答|こた}}え[かねます]"]
        - ["〜かねない", "很可能…（會發生壞事）", "＝する可能性がある", "{{体|からだ}}を{{壊|こわ}}すことになり[かねない]"]

  - point: "Vます形＋かねる（難以…、礙難…）"
    source: 会話
    setsuzoku:
      - "V（ます形去ます）＋ かねる／かねます"
    explain: |
      委婉表達「難以做到、無法…」，語氣比「できません」客氣，常用於服務業、商務婉拒。
      它不是客觀能力不足，而是站在說話者／所屬組織的立場表示「基於規定、責任或判斷，不能答應」。
      因此常見「お答えしかねます／判断しかねます」，不宜拿來說單純技能上的「不會游泳」。
    examples:
      - {jp: "非常に私的な問題なので、そのような質問には答えかねます。", kana: "ひじょうに してきな もんだいなので、そのような しつもんには こたえかねます。", zh: "因為是很私人的問題，那樣的提問難以回答。"}
      - {jp: "{{担当者|たんとうしゃ}}が{{外出中|がいしゅつちゅう}}で、{{私|わたし}}ではわかりかねますので、{{後|のち}}ほどご{{連絡|れんらく}}いたします。", kana: "たんとうしゃが がいしゅつちゅうで、わたしでは わかりかねますので、のちほど ごれんらく いたします。", zh: "負責人外出中，我這邊難以得知，稍後再與您聯絡。"}
      - {jp: "当ホテルは盗難についての責任を負いかねます。", kana: "とうほてるは とうなんに ついての せきにんを おいかねます。", zh: "本飯店難以承擔失竊的責任。"}

  - point: "Vます形＋かねない（很可能…（多為不好的結果）)"
    source: 会話
    setsuzoku:
      - "V（ます形去ます）＋ かねない"
    explain: |
      表示依目前跡象判斷「很可能導致…」，多用於說話者不希望發生的結果，帶警告語氣。
      「ない」不是普通否定；「かねない」整體反而是肯定可能性，不能拆成「不可能」。
      和「かもしれない」相比，かねない通常有更明顯的風險評價與因果預警。
    examples:
      - {jp: "食事と睡眠をきちんと取らないと、体を壊すことになりかねない。", kana: "しょくじと すいみんを きちんと とらないと、からだを こわすことに なりかねない。", zh: "不好好吃飯睡覺的話，可能會把身體搞壞。"}
    practice_note: "考點：分辨 かねる（難以做）vs かねない（很可能發生壞事）"
    practice:
      - {q: "（婉拒）私には分かり＿＿。（難以得知）", a: "かねます", note: "かねる＝難以"}
      - {q: "（婉拒）その質問にはお答え＿＿。", a: "しかねます", note: "答えかねる"}
      - {q: "（飯店免責）責任を負い＿＿。（無法承擔）", a: "かねます"}
      - {q: "（恐有壞結果）無理すると、体を壊し＿＿。", a: "かねない", note: "かねない＝很可能"}
      - {q: "「難以做到」用 かねる 還是 かねない？", a: "かねる"}
      - {q: "「很可能（變壞）」用 かねる 還是 かねない？", a: "かねない"}
