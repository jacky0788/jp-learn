track: 会話
topic: te-shimau
order: 105
date: "2026-07-17"        # 上課日期（沒有課本課號時，選單改依日期分組）
label: てしまう／てみる
title: 會話｜〜てしまう（完了・後悔）／〜てみる・てみせる
# 來源：會話課板書 2026-07-17（讀本/會話 PDF）

intro: |
  三個「Vて＋補助動詞」的說法：
  ・〜てみます：試試看（先做做看再說）。
  ・〜てみせます：做給別人看（展示給人看）。
  ・〜てしまいます：兩種用法——①動作完全結束、做到極致、一點都沒剩；②表示後悔、不好意思、憤慨。

  「てしまう」是會話裡非常常用的表現，口語會縮成「〜ちゃう／〜じゃう」
  （食べてしまった→食べちゃった、飲んでしまった→飲んじゃった）。

goals:
  - "用「〜てみます」表達「試試看」"
  - "分辨「〜てみます（自己試）」與「〜てみせます（做給人看）」"
  - "用「〜てしまう」表達動作完全結束（沒剩）"
  - "用「〜てしまう」表達後悔・不好意思・憤慨的語氣"

grammar:
  - point: "〜てみます（試試看）／〜てみせます（做給人看）"
    source: 会話
    setsuzoku:
      - "Vて ＋ みます（試著做做看）"
      - "Vて ＋ みせます（做給（某人）看）"
    explain: |
      ・〜てみます＝「試試看」，先做做看再說（來自「見る」）。
      ・〜てみせます＝「做給（人）看」，帶有示範、展現給對方看的意思。
      兩者只差一個「せ」，意思差很多，要分清楚。
    table:
      caption: "てみます vs てみせます（板書）"
      headers: ["形式", "意思", "例"]
      rows:
        - ["Vて＋[みます]", "試試看（自己試）", "やって[みます]（我試試看）"]
        - ["Vて＋[みせます]", "做給（人）看", "やって[みせます]（做給你看）"]
    examples:
      - {jp: "わたしがやってみます。", kana: "わたしが やってみます。", zh: "我來試試看。"}
      - {jp: "先生がやってみせます。", kana: "せんせいが やってみせます。", zh: "老師做給大家看。"}
    practice_note: "板書例"
    practice:
      - {q: "（我試試看）わたしが＿＿。（やる）", a: "やってみます", note: "てみます＝試試看"}
      - {q: "（做給你看）わたしが＿＿。（やる）", a: "やってみせます", note: "てみせます＝做給人看"}
      - {q: "（辨別）「てみます」和「てみせます」差在哪？", a: "てみます＝自己試試看；てみせます＝做給別人看"}

  - point: "〜てしまう ①動作完全結束（做完、沒剩）"
    source: 会話
    key: true
    setsuzoku:
      - "Vて ＋ しまいます／しまいました"
      - "口語縮約：〜てしまう→〜ちゃう／〜でしまう→〜じゃう"
    explain: |
      表示動作「完全結束、做到極致、一點都沒有剩下」。
      常和「全部」「みんな」「〜終わる」等一起用，強調徹底做完。
    examples:
      - {jp: "小麦粉を全部使ってしまった。", kana: "こむぎこを ぜんぶ つかってしまった。", zh: "麵粉全部用光了。"}
      - {jp: "私は水を飲んでしまいました。", kana: "わたしは みずを のんでしまいました。", zh: "我把水喝光了。"}
      - {jp: "鐘が鳴り終わってしまった。", kana: "かねが なりおわってしまった。", zh: "鐘聲響完了。"}
      - {jp: "その様子を見て、みんなはびっくりしてしまった。", kana: "そのようすを みて、みんなは びっくりしてしまった。", zh: "看到那個樣子，大家都嚇了一跳。"}
    practice_note: "板書例①〜④（完全結束）"
    practice:
      - {q: "① 小麦粉を全部＿＿。（使う）", a: "使ってしまった", note: "全部用完"}
      - {q: "② 私は水を＿＿。（飲む）", a: "飲んでしまいました"}
      - {q: "③ 鐘が＿＿。（鳴り終わる）", a: "鳴り終わってしまった"}
      - {q: "④ その様子を見て、みんなは＿＿。（びっくりする）", a: "びっくりしてしまった"}

  - point: "〜てしまう ②後悔・不好意思・憤慨"
    source: 会話
    key: true
    explain: |
      同樣的「〜てしまう」，用在「不希望發生卻發生了」的事情上，
      表示後悔、遺憾、不好意思或憤慨的心情。
      ＊注意：句子本身不一定有負面字眼，語氣是靠「てしまう」帶出來的。
    examples:
      - {jp: "犬はもう死んでしまいました。", kana: "いぬは もう しんでしまいました。", zh: "狗已經死掉了。（遺憾）"}
      - {jp: "部長はもううちに帰ってしまった。", kana: "ぶちょうは もう うちに かえってしまった。", zh: "部長已經回家了。（懊惱・沒趕上）"}
      - {jp: "約束を忘れてしまいました。", kana: "やくそくを わすれてしまいました。", zh: "我把約定忘記了。（後悔・不好意思）"}
      - {jp: "残業したので、8時の映画にはぜんぜん間に合わなくなってしまいました。", kana: "ざんぎょうしたので、はちじの えいがには ぜんぜん まにあわなく なってしまいました。", zh: "因為加班，八點的電影完全趕不上了。（板書訂正題：間に合う→間に合わなくなる＝狀態變化＋てしまう）"}
    practice_note: "板書例（後悔・憤慨）＋老師訂正題"
    practice:
      - {q: "① 犬はもう＿＿。（死ぬ）", a: "死んでしまいました", note: "遺憾"}
      - {q: "② 部長はもううちに＿＿。（帰る）", a: "帰ってしまった"}
      - {q: "③ 約束を＿＿。（忘れる）", a: "忘れてしまいました", note: "後悔・不好意思"}
      - {q: "④（訂正題）残業したので、8時の映画にはぜんぜん＿＿しまいました。（間に合う→變成趕不上的狀態）", a: "間に合わなくなって", note: "老師訂正：間に合う→間に合わなくなる（狀態變化）＋てしまう"}
      - {q: "（口語縮約）食べてしまった → 口語怎麼說？", a: "食べちゃった", note: "てしまう→ちゃう／でしまう→じゃう"}
