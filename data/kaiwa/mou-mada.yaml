track: 会話
topic: mou-mada
order: 160
label: もう／まだ
title: 會話｜もう／まだ（已經／還沒）
# 來源：同學會話筆記

intro: |
  ・もう＋V（〜ました）＝已經做了。
  ・まだ＋Vていません＝還沒做（也可只說「まだです」）。
  問句用「もう〜ましたか」，否定回答要用「まだ〜ていません」，不是「まだ〜ませんでした」。
  形容詞・狀態也可用：まだ痛いです（還在痛）↔ もう痛くないです（已經不痛了）。
  「もう〜ない」＝已經不…了（狀態結束）。

goals:
  - "用「もう〜ました」表達已經完成"
  - "用「まだ〜ていません／まだです」表達還沒做"
  - "用「まだ＋形容詞」「もう＋形容詞ない」表達狀態的持續／結束"

grammar:
  - point: "🔖 もう／まだ 對比（圖解）"
    source: 会話
    explain: |
      ⚠️ 否定回答用「まだ〜ていません」，不是「まだ〜ませんでした」。
    table:
      caption: "もう vs まだ"
      headers: ["", "動作", "形容詞・狀態"]
      rows:
        - ["もう（已經／不再）", "もう{{食|た}}べました（已吃）", "もう{{痛|いた}}くない（不痛了）"]
        - ["まだ（還／還沒）", "まだ食べていません（還沒吃）", "まだ痛い（還在痛）"]

  - point: "もう〜ました／まだ〜ていません（已經／還沒）"
    source: 会話
    setsuzoku:
      - "もう ＋ V（〜ました）"
      - "まだ ＋ V（ていません）／まだです"
    explain: |
      問「もうVましたか」是在確認動作是否已跨過完成點。肯定回答用「もうVました」；
      否定回答用「まだVていません」，表示截至現在仍未完成、之後仍可能做。
      「まだVませんでした」把時間框在過去，無法自然回答「到現在完成了嗎」，所以此處不用。
      上下文清楚時可只答「まだです」，但完整形式仍是理解重點。
    examples:
      - {jp: "もうごはんを食べましたか。―はい、もう食べました。", kana: "もう ごはんを たべましたか。―はい、もう たべました。", zh: "已經吃飯了嗎？—是的，已經吃了。"}
      - {jp: "いいえ、まだ食べていません。", kana: "いいえ、まだ たべていません。", zh: "不，還沒吃。"}
      - {jp: "宿題はもう終わりましたか。―いいえ、まだです。", kana: "しゅくだいは もう おわりましたか。―いいえ、まだです。", zh: "作業做完了嗎？—還沒。"}

  - point: "まだ＋形容詞／もう＋形容詞ない（狀態的持續・結束）"
    source: 会話
    explain: |
      もう・まだ也能用在形容詞・狀態：
      ・まだ＋形容詞＝狀態還持續（まだ痛い＝還在痛）。
      ・もう＋形容詞ない＝狀態已經結束（もう痛くない＝已經不痛了）。
    examples:
      - {jp: "まだ痛いですか。―はい、まだ痛いです。", kana: "まだ いたいですか。―はい、まだ いたいです。", zh: "還會痛嗎？—是的，還在痛。（まだ＋形容詞）"}
      - {jp: "いいえ、もう痛くないです。", kana: "いいえ、もう いたくないです。", zh: "不，已經不痛了。（もう〜ない＝不再）"}
    practice_note: "考點：もう（已經/不再）vs まだ（還/還沒），否定回答用「まだ〜ていません」"
    practice:
      - {q: "（已經做了）もうごはんを＿＿。（食べる）", a: "食べました"}
      - {q: "（還沒做）いいえ、まだ＿＿。（食べる）", a: "食べていません", note: "×まだ食べませんでした"}
      - {q: "（簡答還沒）宿題は終わった？―いいえ、＿＿です。", a: "まだ"}
      - {q: "（狀態還在）＿＿痛いです。（還在痛）", a: "まだ"}
      - {q: "（狀態結束）＿＿痛くないです。（不痛了）", a: "もう"}
      - {q: "「還沒吃」要用「まだ食べていません」還是「まだ食べませんでした」？", a: "まだ食べていません"}
