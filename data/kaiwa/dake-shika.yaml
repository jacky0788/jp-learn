notes:
  - "**しか 後面一定是否定**，這是硬規定（○しか…ません ×しか…ます）；だけ 後面接肯定。"
  - "語感差別：だけ＝中性地說「有多少」；しか…ない＝「就這麼一點而已」，帶不足感。"
  - "だけ 可以接 N／い形／な形／V辭書形；接動詞修飾名詞時用「V辭書形＋だけの＋N」。"
  - "板書把「百円」和「君」兩組句子上下對照寫，背的時候整組一起記最快。"
