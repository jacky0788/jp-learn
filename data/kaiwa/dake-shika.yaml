topic: dake-shika
order: 97
date: "2026-09-18"        # 上課日期（會話課板書，選單依日期分組）
label: だけ／しか…ない
title: 會話｜〜だけ（只有）と 〜しか…ない（只有…，別的都沒有）
# 來源：會話課板書 2026-09-18（raw/会話/20260918/）

intro: |
  兩個都翻成「只有」，但語感完全相反，這是本堂課最值得記的一組：

  ・**〜だけ**＝**單純陳述數量／範圍**，後面接**肯定**。
  　百円だけ持っています。（我有一百圓）──只是在說「有多少」，不帶情緒。
  ・**〜しか…ない**＝**強調「除此之外都沒有」**，後面一定接**否定**。
  　百円しか持っていません。（我只有一百圓）──言下之意是「不夠、太少了」。

  同一個場景換過來就看得出差別：
  　私のそばに君**だけ**います。　（我身邊有你）
  　私のそばに君**しか**いません。（我身邊只有你，沒有別人了）

  だけ 的接續範圍很廣：**N／い形／な形／V（辭書形）** 後面都能直接接，
  接動詞時常再加の變成修飾語（掃除する**だけの**仕事＝只需要打掃的工作）。

goals:
  - "用 N＋だけ 說出數量或範圍（後接肯定）"
  - "用 しか＋否定 強調「只有…，別的都沒有」"
  - "分辨 だけ（中性陳述）與 しか…ない（覺得少、不足）的語感差別"
  - "把だけ接在い形・な形・動詞辭書形後面（V辭書形＋だけの＋N）"

grammar:
  - point: "〜だけ（只有、僅僅）——後面接肯定"
    source: 会話
    key: true
    setsuzoku:
      - "N＋【だけ】（百円だけ）"
      - "い形容詞・な形容詞＋【だけ】"
      - "V4（辭書形）＋【だけ】（掃除するだけ）／修飾名詞時→V4＋【だけの】＋N"
    explain: |
      【板書】接續寫了四種：**N／い形／な形／V4（辭書形）**。
      だけ 是**中性的**——只是把數量或範圍講出來，後面用肯定句，不帶「太少了」的抱怨。
      接動詞辭書形時，常再加の去修飾名詞：「猫のトイレを掃除するだけの仕事です」
      ＝這份工作**只需要**打掃貓砂盆（做這件事就夠了）。
    table:
      caption: "板書：だけ 的接續"
      headers: ["接在什麼後面", "例"]
      rows:
        - ["N", "{{百円|ひゃくえん}}[だけ]{{持|も}}っています"]
        - ["い形容詞", "〜い[だけ]"]
        - ["な形容詞", "〜な[だけ]"]
        - ["V4（辭書形）", "{{掃除|そうじ}}する[だけ]の{{仕事|しごと}}です"]
    examples:
      - {jp: "これだけ買いました。", kana: "これだけ かいました。", zh: "我只買了這些。（板書）"}
      - {jp: "百円だけ持っています。", kana: "ひゃくえんだけ もっています。", zh: "我有一百圓。（板書・單純陳述數量）"}
      - {jp: "ちょっとだけ話を聞きたいんです。", kana: "ちょっとだけ はなしを ききたいんです。", zh: "我只想稍微聽一下事情經過。（板書）"}
      - {jp: "猫のトイレを掃除するだけの仕事です。", kana: "ねこの といれを そうじするだけの しごとです。", zh: "這是一份只要打掃貓砂盆的工作。（板書・V辭書形＋だけの＋N）"}
      - {jp: "私のそばに君だけいます。", kana: "わたしの そばに きみだけ います。", zh: "我身邊有你。（板書・與しか對照用）"}
    practice_note: "板書例句（5題・皆為老師寫在黑板上的原句）"
    practice:
      - {q: "（我只買了這些）これ＿＿買いました。", a: "だけ"}
      - {q: "（我有一百圓）百円＿＿持っています。", a: "だけ", note: "後面接肯定"}
      - {q: "（只想稍微聽一下）ちょっと＿＿話を聞きたいんです。", a: "だけ"}
      - {q: "（只要打掃貓砂盆的工作）猫のトイレを掃除する＿＿仕事です。", a: "だけの", note: "V辭書形＋だけの＋N"}
      - {q: "（我身邊有你）私のそばに君＿＿います。", a: "だけ"}

  - point: "〜しか…ない（只有…，別的都沒有）——後面一定接否定"
    source: 会話
    key: true
    setsuzoku:
      - "N＋【しか】＋〜【ない／ません】（否定是強制的）"
      - "板書標注：しか…ない ＝ 只有…"
    explain: |
      【板書】しか 後面**一定要用否定**，這是文法上的硬性規定（○しか…ません ×しか…ます）。
      語感上它跟だけ相反：だけ只是在陳述，しか帶著**「就這麼一點而已」的不足感**。
      板書把兩組句子上下對照寫，一看就懂：

      　百円**だけ**持っています。　　　→ 我有一百圓（中性）
      　百円**しか**持っていません。　　→ 我只有一百圓（不夠啊）
      　私のそばに君**だけ**います。　　→ 我身邊有你
      　私のそばに君**しか**いません。　→ 我身邊只剩你了（別人都沒有）
    table:
      caption: "板書對照：だけ vs しか…ない"
      headers: ["", "〜だけ", "〜しか…ない"]
      rows:
        - ["後面接", "[肯定]", "[否定]（強制）"]
        - ["語感", "單純陳述數量・範圍", "[覺得少]、除此之外都沒有"]
        - ["例（錢）", "{{百円|ひゃくえん}}だけ{{持|も}}っています", "{{百円|ひゃくえん}}しか{{持|も}}っていません"]
        - ["例（人）", "{{君|きみ}}だけいます", "{{君|きみ}}しかいません"]
    examples:
      - {jp: "百円しか持っていません。", kana: "ひゃくえんしか もっていません。", zh: "我只有一百圓（不夠）。（板書）"}
      - {jp: "私のそばに君しかいません。", kana: "わたしの そばに きみしか いません。", zh: "我身邊只有你（沒有別人了）。（板書）"}
    practice_note: "板書例句＋だけ／しか 的替換（3題）"
    practice:
      - {q: "（我只有一百圓，不夠）百円＿＿持ってい＿＿。", a: "しか／ません", note: "しか 後面一定是否定"}
      - {q: "（我身邊只有你）私のそばに君＿＿い＿＿。", a: "しか／ません"}
      - {q: "「百円だけ持っています」跟「百円しか持っていません」差在哪？", a: "だけ＝單純說有一百圓；しか…ない＝只有一百圓，帶著「太少了」的語感"}

