track: 基礎
topic: josuushi
order: 40
label: 量詞（助数詞）
title: 基礎｜常用量詞（〜つ・人・本・枚・匹・杯…）
# 來源：自學補充（常用助数詞整理，紅色＝變音/特殊唸法）

intro: |
  日文數東西要配「量詞（助数詞）」，而且和 1・3・6・8・10 搭配時常常「變音」。
  好消息是變音有規律：把規律記住，紅色的特殊唸法就只剩少數幾個。
  本主題整理：①什麼東西用什麼量詞 ②萬用的「〜つ」 ③人數 ④變音規律 ⑤常用量詞變音總表。

goals:
  - "知道常見物品各用什麼量詞（本・枚・匹・台・冊・杯…）"
  - "用和語數法「ひとつ〜とお」數一般東西"
  - "唸出人數：ひとり・ふたり・さんにん・よにん…"
  - "掌握 1・6・8・10 促音變化與 は行→ぱ/ば 的規律"
  - "記住特殊唸法：20歳はたち、3階さんがい、3人さんにん 等"

grammar:
  - point: "① 量詞總覽：什麼東西用什麼量詞"
    source: 基礎
    explain: |
      先對照「東西的形狀・種類」選量詞。不知道用哪個時，普通小東西可以用萬用的「〜つ」。
    table:
      caption: "常用量詞一覽"
      headers: ["量詞", "用在什麼", "例"]
      rows:
        - ["〜つ", "萬用（小東西・抽象物）", "りんごを{{二|ふた}}つ"]
        - ["{{個|こ}}", "小東西", "{{卵|たまご}}3{{個|こ}}"]
        - ["{{人|にん}}", "人", "{{学生|がくせい}}3{{人|にん}}"]
        - ["{{本|ほん}}", "細長物（筆・傘・瓶・香蕉）", "ペン1{{本|ぽん}}"]
        - ["{{枚|まい}}", "平薄物（紙・襯衫・盤子・票）", "シャツ2{{枚|まい}}"]
        - ["{{匹|ひき}}", "小動物（貓狗魚蟲）", "{{猫|ねこ}}1{{匹|ぴき}}"]
        - ["{{頭|とう}}", "大動物（牛馬大象）", "{{牛|うし}}1{{頭|とう}}"]
        - ["{{羽|わ}}", "鳥・兔子", "{{鳥|とり}}1{{羽|わ}}"]
        - ["{{冊|さつ}}", "書・筆記本", "{{本|ほん}}2{{冊|さつ}}"]
        - ["{{台|だい}}", "機器・車輛", "{{車|くるま}}1{{台|だい}}"]
        - ["{{杯|はい}}", "杯・碗裝的", "コーヒー1{{杯|ぱい}}"]
        - ["{{回|かい}}", "次數", "{{週|しゅう}}に3{{回|かい}}"]
        - ["{{階|かい}}", "樓層", "2{{階|かい}}・3[がい]"]
        - ["{{歳|さい}}", "年齡", "18{{歳|さい}}・20歳[はたち]"]
        - ["{{着|ちゃく}}", "衣服（套）", "スーツ1{{着|ちゃく}}"]
        - ["{{足|そく}}", "鞋・襪（雙）", "{{靴|くつ}}1{{足|そく}}"]
        - ["{{軒|けん}}", "房屋（棟）", "{{家|いえ}}1{{軒|けん}}"]
        - ["{{番|ばん}}", "號碼・順序", "1{{番|ばん}}"]
    practice_note: "考點：選對量詞"
    practice:
      - {q: "數「筆・傘」等細長物用哪個量詞？", a: "本", note: "ほん"}
      - {q: "數「紙・襯衫」等平薄物用哪個量詞？", a: "枚", note: "まい"}
      - {q: "數「貓・狗」等小動物用哪個量詞？", a: "匹", note: "ひき"}
      - {q: "數「書」用哪個量詞？", a: "冊", note: "さつ"}
      - {q: "數「車子・電腦」用哪個量詞？", a: "台", note: "だい"}

  - point: "② 萬用數法 〜つ（ひとつ〜とお，整組背）"
    source: 基礎
    key: true
    explain: |
      和語數法，數一般東西最常用（點餐、買東西）。1〜10 整組背起來；11 以上就改用 數字＋個。
    table:
      caption: "〜つ（全部都要背）"
      headers: ["數", "唸法", "數", "唸法"]
      rows:
        - ["1つ", "[ひとつ]", "6つ", "[むっつ]"]
        - ["2つ", "[ふたつ]", "7つ", "[ななつ]"]
        - ["3つ", "[みっつ]", "8つ", "[やっつ]"]
        - ["4つ", "[よっつ]", "9つ", "[ここのつ]"]
        - ["5つ", "[いつつ]", "10", "[とお]（沒有つ）"]
    practice_note: "考點：和語數法"
    practice:
      - {q: "りんごを＿＿ください。（2個）", a: "ふたつ"}
      - {q: "「3個」（〜つ）的唸法？", a: "みっつ"}
      - {q: "「8個」（〜つ）的唸法？", a: "やっつ"}
      - {q: "「10個」（和語）的唸法？", a: "とお"}

  - point: "③ 人數（1人・2人 特殊）"
    source: 基礎
    explain: |
      數人用「〜人（にん）」，但 1人・2人 是和語唸法、4人 用よ：
      ひとり、ふたり、さんにん、【よにん】、ごにん…（×よんにん）。
    table:
      caption: "人數（紅色＝特殊）"
      headers: ["人數", "唸法", "人數", "唸法"]
      rows:
        - ["1人", "[ひとり]", "4人", "[よにん]"]
        - ["2人", "[ふたり]", "5人〜", "數字＋にん"]
        - ["3人", "さんにん", "何人", "{{何|なん}}にん"]
    practice_note: "考點：人數特殊唸法"
    practice:
      - {q: "「1人」的唸法？", a: "ひとり"}
      - {q: "「2人」的唸法？", a: "ふたり"}
      - {q: "「4人」的唸法？", a: "よにん", note: "×よんにん"}

  - point: "④ 變音規律：1・6・8・10＋か/さ/た/は行 → 促音"
    source: 基礎
    key: true
    explain: |
      量詞開頭是 か・さ・た・は行 時：
      ・【1・6・8・10】→ 變促音（いっ〜・ろっ〜・はっ〜・じゅっ〜）。
      ・は行量詞（ほん・ひき・はい・ふん）再變半濁音【ぱ行】（いっぽん）；【3】後面變濁音【ば行】（さんぼん）。
      記住這條規律，下表 8 成的紅字就不用死背了。
    table:
      caption: "以「本（ほん）」為例的完整變化"
      headers: ["數", "唸法", "規律"]
      rows:
        - ["1本", "[いっぽん]", "促音＋ぱ行"]
        - ["2本", "にほん", "規則"]
        - ["3本", "さん[ぼん]", "3＋ば行（濁音）"]
        - ["4本", "よんほん", "規則"]
        - ["5本", "ごほん", "規則"]
        - ["6本", "[ろっぽん]", "促音＋ぱ行"]
        - ["7本", "ななほん", "規則"]
        - ["8本", "[はっぽん]", "促音＋ぱ行"]
        - ["9本", "きゅうほん", "規則"]
        - ["10本", "[じゅっぽん]", "促音＋ぱ行"]
    practice_note: "考點：套規律"
    practice:
      - {q: "1本 的唸法？", a: "いっぽん"}
      - {q: "3本 的唸法？", a: "さんぼん"}
      - {q: "6本 的唸法？", a: "ろっぽん"}
      - {q: "10本 的唸法？", a: "じゅっぽん"}

  - point: "⑤ 常用量詞變音總表（1・3・6・8・10）"
    source: 基礎
    key: true
    explain: |
      把容易變音的量詞集中成表，只列 1・3・6・8・10（其他數字都規則）。
      は行組（本・匹・杯・分）變化全相同；枚・台 完全規則最輕鬆。
      特殊中的特殊：20歳＝はたち、3階＝さんがい。
    table:
      caption: "變音總表（紅色＝變音；枚・台規則免背）"
      headers: ["量詞", "1", "3", "6", "8", "10"]
      rows:
        - ["{{本|ほん}}", "[いっぽん]", "さん[ぼん]", "[ろっぽん]", "[はっぽん]", "[じゅっぽん]"]
        - ["{{匹|ひき}}", "[いっぴき]", "さん[びき]", "[ろっぴき]", "[はっぴき]", "[じゅっぴき]"]
        - ["{{杯|はい}}", "[いっぱい]", "さん[ばい]", "[ろっぱい]", "[はっぱい]", "[じゅっぱい]"]
        - ["{{分|ふん}}", "[いっぷん]", "さん[ぷん]", "[ろっぷん]", "[はっぷん]", "[じゅっぷん]"]
        - ["{{個|こ}}", "[いっこ]", "さんこ", "[ろっこ]", "[はっこ]", "[じゅっこ]"]
        - ["{{回|かい}}", "[いっかい]", "さんかい", "[ろっかい]", "[はっかい]", "[じゅっかい]"]
        - ["{{階|かい}}", "[いっかい]", "さん[がい]", "[ろっかい]", "[はっかい]", "[じゅっかい]"]
        - ["{{冊|さつ}}", "[いっさつ]", "さんさつ", "ろくさつ", "[はっさつ]", "[じゅっさつ]"]
        - ["{{歳|さい}}", "[いっさい]", "さんさい", "ろくさい", "[はっさい]", "[じゅっさい]・20歳[はたち]"]
        - ["{{枚|まい}}", "いちまい", "さんまい", "ろくまい", "はちまい", "じゅうまい（全規則）"]
        - ["{{台|だい}}", "いちだい", "さんだい", "ろくだい", "はちだい", "じゅうだい（全規則）"]
    practice_note: "考點：常用變音＋特殊唸法"
    practice:
      - {q: "猫3匹 的「3匹」唸法？", a: "さんびき"}
      - {q: "コーヒー1杯 的「1杯」唸法？", a: "いっぱい"}
      - {q: "ビール3杯 的「3杯」唸法？", a: "さんばい"}
      - {q: "本8冊 的「8冊」唸法？", a: "はっさつ"}
      - {q: "「3樓」（3階）的唸法？", a: "さんがい", note: "特殊：かい→がい"}
      - {q: "「20歲」（20歳）的唸法？", a: "はたち", note: "特殊"}
      - {q: "卵6個 的「6個」唸法？", a: "ろっこ"}

notes:
  - "變音規律：1・6・8・10＋か/さ/た/は行量詞→促音；は行（本・匹・杯・分）促音後變ぱ行、3後面變ば行。"
  - "完全規則的量詞：枚・台・頭・番（直接 數字＋量詞）。"
  - "特殊背起來：ひとり・ふたり・よにん／20歳はたち／3階さんがい／とお（10つ×）。"
  - "問「幾個」：いくつ（〜つ系）／何個・何本・何枚…（なん＋量詞，何分=なんぷん、何階=なんがい）。"
