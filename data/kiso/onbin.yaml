track: 基礎
topic: onbin
order: 20
label: て形／た形音便
title: 基礎｜て形・た形的音便（五段動詞）
# 來源：自學補充，參考 sigure.tw N5文法 21

intro: |
  五段動詞接「て／た」時，為了好發音會產生「音便」變化。這是學習者最常錯的地方，務必背熟。
  た形和て形規則完全相同，只要把「て→た」「で→だ」即可（待って→待った、飲んで→飲んだ）。
  ・一段動詞與 する・来る 不音便，直接用連用形（食べる→食べて、来る→来て、する→して）。
  口訣：
  ・く→いて、ぐ→いで（イ音便）
  ・う・つ・る→って（促音便）
  ・ぬ・ぶ・む→んで（撥音便）
  ・す→して（不音便）
  ・⚠️ 行く→行って（唯一例外，不是行いて）

goals:
  - "依語尾把五段動詞變成て形（イ音便／促音便／撥音便／す不變）"
  - "記住「行く→行って」例外"
  - "由て形推た形（て→た、で→だ）"
  - "知道一段動詞與 する・来る 不音便"

grammar:
  - point: "イ音便：く→いて／ぐ→いで"
    source: 基礎
    setsuzoku:
      - "語尾 く → いて（書く→書いて）"
      - "語尾 ぐ → いで（濁音！泳ぐ→泳いで）"
    explain: |
      語尾為「く・ぐ」的五段動詞，把語尾改成「い」再接て／た。
      「ぐ」會帶濁音變「いで／いだ」。⚠️ 唯一例外：行く→行って（促音便，不是行いて）。
    examples:
      - {jp: "聞く → 聞いて", kana: "きく → きいて", zh: "聽（く→いて）"}
      - {jp: "書く → 書いて", kana: "かく → かいて", zh: "寫（く→いて）"}
      - {jp: "泳ぐ → 泳いで", kana: "およぐ → およいで", zh: "游泳（ぐ→いで，濁音）"}
      - {jp: "行く → 行って", kana: "いく → いって", zh: "去（例外！不是行いて）"}
    practice_note: "考點：く／ぐ 結尾變て形"
    practice:
      - {q: "（イ音便）書く → ＿＿", a: "書いて", note: "く→いて"}
      - {q: "（イ音便・濁）急ぐ → ＿＿", a: "急いで", note: "ぐ→いで"}
      - {q: "（例外）行く → ＿＿", a: "行って", note: "唯一促音便例外"}

  - point: "促音便：う・つ・る→って"
    source: 基礎
    setsuzoku:
      - "語尾 う／つ／る → って（買う→買って、待つ→待って、取る→取って）"
    explain: |
      語尾為「う・つ・る」的五段動詞，三者都變成促音「って」。
    examples:
      - {jp: "会う → 会って", kana: "あう → あって", zh: "見面（う→って）"}
      - {jp: "待つ → 待って", kana: "まつ → まって", zh: "等（つ→って）"}
      - {jp: "取る → 取って", kana: "とる → とって", zh: "拿（る→って，五段的る）"}
    practice_note: "考點：う／つ／る 結尾變て形"
    practice:
      - {q: "（促音便）買う → ＿＿", a: "買って", note: "う→って"}
      - {q: "（促音便）待つ → ＿＿", a: "待って", note: "つ→って"}

  - point: "撥音便：ぬ・ぶ・む→んで"
    source: 基礎
    setsuzoku:
      - "語尾 ぬ／ぶ／む → んで（濁音！死ぬ→死んで、遊ぶ→遊んで、飲む→飲んで）"
    explain: |
      語尾為「ぬ・ぶ・む」的五段動詞，三者都變成撥音「んで」（帶濁音，て→で／た→だ）。
    examples:
      - {jp: "死ぬ → 死んで", kana: "しぬ → しんで", zh: "死（ぬ→んで）"}
      - {jp: "遊ぶ → 遊んで", kana: "あそぶ → あそんで", zh: "玩（ぶ→んで）"}
      - {jp: "飲む → 飲んで", kana: "のむ → のんで", zh: "喝（む→んで）"}
    practice_note: "考點：ぬ／ぶ／む 結尾變て形"
    practice:
      - {q: "（撥音便）読む → ＿＿", a: "読んで", note: "む→んで"}
      - {q: "（撥音便）呼ぶ → ＿＿", a: "呼んで", note: "ぶ→んで"}

  - point: "す→して（不音便）／一段・する・来る"
    source: 基礎
    setsuzoku:
      - "語尾 す → して（話す→話して，不音便）"
      - "一段動詞：去る＋て（食べる→食べて、見る→見て）"
      - "する→して、来る→来て（きて）"
    explain: |
      語尾「す」不音便，直接「して」。
      一段動詞與 する・来る 也不音便，直接連用形＋て。
    examples:
      - {jp: "話す → 話して", kana: "はなす → はなして", zh: "說（す→して，不音便）"}
      - {jp: "食べる → 食べて", kana: "たべる → たべて", zh: "吃（一段，去る＋て）"}
      - {jp: "見る → 見て", kana: "みる → みて", zh: "看（一段）"}
      - {jp: "する → して／来る → 来て", kana: "する → して／くる → きて", zh: "做／來（變格，不音便）"}
    practice_note: "考點：す結尾與非五段"
    practice:
      - {q: "（す不音便）貸す → ＿＿", a: "貸して", note: "す→して"}
      - {q: "（一段）起きる → ＿＿", a: "起きて", note: "去る＋て"}

notes:
  - "た形＝把て形的「て→た」「で→だ」：待って→待った、飲んで→飲んだ、書いて→書いた、泳いで→泳いだ。"
  - "整理：く→いて／ぐ→いで／う・つ・る→って／ぬ・ぶ・む→んで／す→して／行く→行って（例外）。"
