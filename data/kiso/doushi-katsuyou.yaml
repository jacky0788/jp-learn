track: 基礎
topic: doushi-katsuyou
order: 10
label: 動詞變化
title: 基礎｜動詞活用（三類動詞的六活用形）
# 來源：自學補充，參考 sigure.tw N5文法 18/19/20

intro: |
  日文動詞依變化方式分三類，每類都有「未然・連用・終止・連體・假定・命令」六個活用形（再加意向形）。
  先學會「辨別動詞屬於哪一類」，再套各自的變化規則，就能變出否定、ます、て形、假定、命令、意向等。
  三類：
  ・第一類＝五段動詞（語尾在 a・i・u・e・o 五段之間變化）。
  ・第二類＝上一段／下一段動詞（去掉語尾「る」再接）。
  ・第三類＝カ行變格「来る」、サ行變格「する」（只有這兩個，需硬記）。
  ※ 六個活用形對應的接續：未然形＋ない／れる／せる、連用形＋ます／て／た、終止形（句末）、
    連體形＋名詞・とき、假定形＋ば、命令形（單獨使用）。意向形＝「～う／～よう」（邀約・打算）。

goals:
  - "辨別動詞屬於第一類（五段）／第二類（一段）／第三類（變格）"
  - "把五段動詞做出六活用形＋意向形，並注意「う→わ」與音便"
  - "把上下一段動詞去る後接 ない／ます／れば／ろ／よう"
  - "記住 する・来る 的不規則變化"

grammar:
  - point: "① 先辨別：動詞的三種分類"
    source: 基礎
    setsuzoku:
      - "第一類（五段）：語尾不是「る」一定是五段（行く・話す・飲む・待つ…）；語尾是「る」但前一音為ア／ウ／オ段也是五段（ある・売る・乗る・終わる）"
      - "第二類（一段）：語尾「る」且前一音為イ段（上一段：見る・起きる・信じる）或エ段（下一段：食べる・寝る）"
      - "第三類（變格）：只有「する」「来る」兩個"
    explain: |
      辨別口訣：尾巴不是「る」→五段；是「る」就看「る」前面那個音──
      イ段／エ段且常見動詞→一段，ア／ウ／オ段→五段。する・来る 例外自成一類。
      ⚠️ 陷阱：帰る・走る・入る・要る・切る…雖然「る」前是イ／エ段，卻是五段（例外，要記）。
    examples:
      - {jp: "行く・話す・飲む・待つ", kana: "いく・はなす・のむ・まつ", zh: "第一類（五段）：尾巴不是る"}
      - {jp: "見る・食べる・起きる・寝る", kana: "みる・たべる・おきる・ねる", zh: "第二類（一段）：る前為イ／エ段"}
      - {jp: "する・来る", kana: "する・くる", zh: "第三類（變格）：只有這兩個"}

  - point: "② 第一類（五段）動詞的活用"
    source: 基礎
    setsuzoku:
      - "未然形（a段）＋ない／れる／せる（行く→行か）"
      - "連用形（i段）＋ます／て／た（行く→行き）"
      - "終止・連體形（u段）＝辭書形（行く／行く時）"
      - "假定形（e段）＋ば（行く→行け＋ば）"
      - "命令形（e段）單獨用（行け）"
      - "意向形（o段）＋う（行く→行こう）"
    explain: |
      用該動詞所屬「行」的五十音，語尾在 a→i→u→e→o 五段之間變化。以「行く」（カ行 か・き・く・け・こ）為例。
      ⚠️ 例外一：語尾是「う」的，未然形要用「わ」（会う→会わない，不是会あない）。
      ⚠️ 例外二：「ある」沒有否定形「あらない」，否定直接用「ない」。
      ※ 音便：五段動詞接「て／た」時會音便（行く＋て→行って、飲む＋て→飲んで、話す→話して）。
    table:
      caption: "五段（第I類）六活用＋意向：以「行く」（カ行）為例，紅色為變化的語尾"
      headers: ["活用形", "行く（カ行）", "主要接續"]
      rows:
        - ["未然形", "{{行|い}}[か]", "＋ない／れる／せる"]
        - ["未然（意向）", "{{行|い}}[こ]", "＋う（行こう）"]
        - ["連用形", "{{行|い}}[き]", "＋ます／て／た"]
        - ["終止形", "{{行|い}}[く]", "句末（辭書形）"]
        - ["連體形", "{{行|い}}[く]", "＋名詞・とき"]
        - ["假定形", "{{行|い}}[け]", "＋ば"]
        - ["命令形", "{{行|い}}[け]", "（命令）"]
    examples:
      - {jp: "行かない", kana: "いかない", zh: "未然形＋ない＝不去（否定）"}
      - {jp: "行きます", kana: "いきます", zh: "連用形＋ます＝去（丁寧）"}
      - {jp: "行く", kana: "いく", zh: "終止／連體形＝去（辭書形）"}
      - {jp: "行けば", kana: "いけば", zh: "假定形＋ば＝如果去的話"}
      - {jp: "行け", kana: "いけ", zh: "命令形＝去！"}
      - {jp: "行こう", kana: "いこう", zh: "意向形＝去吧／我要去"}
      - {jp: "会う→会わない", kana: "あう→あわない", zh: "例外：語尾う→わ＋ない"}
      - {jp: "行く＋て→行って", kana: "いく＋て→いって", zh: "音便：接て／た時變音"}
    practice_note: "考點：請把辭書形變成指定活用形"
    practice:
      - {q: "（五段→否定）飲む → ＿＿（不喝）", a: "飲まない", note: "未然形 a段＋ない"}
      - {q: "（五段→意向）話す → ＿＿（說吧）", a: "話そう", note: "意向 o段＋う"}
      - {q: "（五段→て形）待つ → ＿＿（等一下）", a: "待って", note: "促音便 つ→って"}

  - point: "③ 第二類（上下一段）動詞的活用"
    source: 基礎
    setsuzoku:
      - "去掉語尾「る」＋ない（食べる→食べない）"
      - "去「る」＋ます（食べ→食べます）"
      - "終止・連體形＝辭書形（食べる／食べる時）"
      - "去「る」＋れば（食べれば）"
      - "去「る」＋ろ（或よ）＝命令（食べろ）"
      - "去「る」＋よう＝意向（食べよう）"
    explain: |
      上一段（る前イ段：見る・起きる・信じる）與下一段（る前エ段：食べる・寝る）變化方式「完全相同」，
      都是把語尾「る」拿掉再接。最好背。
    table:
      caption: "上下一段（第II類）：去「る」再接，以「食べる」為例"
      headers: ["活用形", "食べる", "主要接續"]
      rows:
        - ["未然形", "{{食|た}}べ", "＋ない"]
        - ["連用形", "{{食|た}}べ", "＋ます／て／た"]
        - ["終止・連體", "{{食|た}}べ[る]", "句末／＋とき"]
        - ["假定形", "{{食|た}}べ[れ]", "＋ば"]
        - ["命令形", "{{食|た}}べ[ろ]", "（或＋よ）"]
        - ["意向形", "{{食|た}}べ[よう]", "邀約／打算"]
    examples:
      - {jp: "食べない", kana: "たべない", zh: "去る＋ない＝不吃"}
      - {jp: "食べます", kana: "たべます", zh: "去る＋ます＝吃（丁寧）"}
      - {jp: "食べる", kana: "たべる", zh: "終止／連體＝吃（辭書形）"}
      - {jp: "食べれば", kana: "たべれば", zh: "去る＋れば＝如果吃的話"}
      - {jp: "食べろ", kana: "たべろ", zh: "去る＋ろ＝吃！（命令）"}
      - {jp: "食べよう", kana: "たべよう", zh: "去る＋よう＝吃吧（意向）"}
      - {jp: "見る→見ない／見ます／見れば／見よう", kana: "みる→みない／みます／みれば／みよう", zh: "上一段同規則（去る再接）"}
    practice_note: "考點：一段動詞去る後接對應形"
    practice:
      - {q: "（一段→否定）起きる → ＿＿（不起床）", a: "起きない", note: "去る＋ない"}
      - {q: "（一段→意向）寝る → ＿＿（睡吧）", a: "寝よう", note: "去る＋よう"}

  - point: "④ 第三類（變格）する・来る"
    source: 基礎
    setsuzoku:
      - "する：しない／します／する／すれば／しろ（せよ）／しよう"
      - "来る：こない／きます／くる／くれば／こい／こよう"
    explain: |
      只有「する」和「来る」，變化不規則，必須硬記。
      ⚠️「来る」的漢字讀音會變：未然こ／連用き／終止・連體く（こない・きます・くる）。
    table:
      caption: "變格（第III類）：する・来る，需硬記（紅色為變化處；来的讀音會變）"
      headers: ["活用形", "する", "来る"]
      rows:
        - ["未然形", "[し]ない", "[こ]ない"]
        - ["連用形", "[し]ます", "[き]ます"]
        - ["終止・連體", "[する]", "[くる]"]
        - ["假定形", "[すれ]ば", "[くれ]ば"]
        - ["命令形", "[しろ]（せよ）", "[こい]"]
        - ["意向形", "[しよう]", "[こよう]"]
    examples:
      - {jp: "しない", kana: "しない", zh: "する的未然＝不做"}
      - {jp: "します", kana: "します", zh: "する的連用＝做（丁寧）"}
      - {jp: "しよう", kana: "しよう", zh: "する的意向＝做吧"}
      - {jp: "来ない", kana: "こない", zh: "来る的未然＝不來（讀こ）"}
      - {jp: "来ます", kana: "きます", zh: "来る的連用＝來（讀き）"}
      - {jp: "来る／来れば／来い／来よう", kana: "くる／くれば／こい／こよう", zh: "終止・假定・命令・意向（讀く／く／こ／こ）"}
    practice_note: "考點：變格動詞硬記"
    practice:
      - {q: "（変格→否定）来る → ＿＿（不來，含假名）", a: "来ない（こない）", note: "未然讀こ"}
      - {q: "（変格→意向）する → ＿＿（做吧）", a: "しよう", note: "サ変意向"}

notes:
  - "六活用形＋接續總覽：未然形＋ない／れる／せる；連用形＋ます／て／た；終止形（句末）；連體形＋名詞・とき；假定形＋ば；命令形（單獨）。"
  - "意向形（～う／～よう）用於邀約「～しよう」與打算「～うと思う」（見會話課・文法課的意向形主題）。"
  - "常見『假五段』例外動詞（る前是イ／エ段卻是五段）：帰る・走る・入る・要る・切る・知る・喋る。"
