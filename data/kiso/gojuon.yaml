grammar:
  - point: "① 怎麼看五十音圖：「{{行|ぎょう}}」與「{{段|だん}}」"
    source: 基礎
    key: true
    setsuzoku:
      - "**{{行|ぎょう}}**（橫）＝子音相同：か{{行|ぎょう}}＝か・き・く・け・こ（都是 k）"
      - "**{{段|だん}}**（直）＝母音相同：あ{{段|だん}}＝あ・か・さ・た・な…（都是 a）"
    explain: |
      五十音圖不是隨便排的，它是一張 **子音 × 母音** 的表格：

      ・**行**（橫向）：同一個**子音**。か行都是 k 開頭（ka・ki・ku・ke・ko）。
      ・**段**（直向）：同一個**母音**。あ段都是 a 結尾（a・ka・sa・ta・na…）。

      ⭐ **為什麼一定要照這個表記？**
      因為之後學**動詞變化**時，規則就是「把語尾在**同一行**的五個音之間換」。
      例如「書く」的語尾「く」是**か行**，變化就在 か・き・く・け・こ 之間：
      　　書**か**ない／書**き**ます／書**く**／書**け**ば／書**こ**う

      現在照表格記熟，之後學文法會非常順。反之，如果只是零散地背，
      到了動詞變化那關就會很痛苦。
    examples:
      - {jp: "か行：か・き・く・け・こ", kana: "かぎょう：か・き・く・け・こ", zh: "同一行＝同一個子音 k"}
      - {jp: "あ段：あ・か・さ・た・な", kana: "あだん：あ・か・さ・た・な", zh: "同一段＝同一個母音 a"}
      - {jp: "書く → 書かない・書きます・書く・書けば・書こう", kana: "かく → かかない・かきます・かく・かけば・かこう", zh: "動詞變化就是在「か行」五個音之間換（之後會學）"}
    practice_note: "確認你看懂表格的排法"
    practice:
      - {q: "「さ行」有哪五個音？", a: "さ・し・す・せ・そ"}
      - {q: "「た行」有哪五個音？", a: "た・ち・つ・て・と", note: "注意 ち(chi)、つ(tsu) 發音特別"}
      - {q: "「う段」有哪些音？（列出前五個）", a: "う・く・す・つ・ぬ（…ふ・む・ゆ・る）"}
      - {q: "「ま行」的「え段」是哪個音？", a: "め"}
      - {q: "為什麼要照「行」和「段」記，而不是隨便背？", a: "因為之後動詞變化的規則就是在「同一行」的五個音之間變"}

  - point: "② 發音要注意的幾個音"
    source: 基礎
    key: true
    explain: |
      大部分的音照羅馬拼音唸就對了，但有幾個要特別注意：

      ・**し** ＝ shi（不是 si）　・**ち** ＝ chi（不是 ti）　・**つ** ＝ tsu（不是 tu）
      ・**ふ** ＝ fu（嘴唇不咬，像吹蠟燭的輕輕吹氣）
      ・**ん** ＝ 鼻音，**不能放在字首**，而且會隨後面的音變（ん在 ば行前面聽起來像 m）
      ・**を** 現代只當**助詞**用，發音跟「お」一樣
      ・**う** 的嘴形比中文的「烏」扁，不用刻意嘟嘴

      💡 **は・へ 當助詞時會變音**（很重要）：
      　　「は」當助詞唸 **wa**（わたし**は** → watashi **wa**）
      　　「へ」當助詞唸 **e**（がっこう**へ** → gakkou **e**）
      　　寫的時候還是寫 は／へ，只有唸的時候變。
    table:
      caption: "容易唸錯的音"
      headers: ["假名", "正確發音", "常見錯誤", "例"]
      rows:
        - ["[し]", "shi", "si ✕", "しお（鹽）"]
        - ["[ち]", "chi", "ti ✕", "ちず（地圖）"]
        - ["[つ]", "tsu", "tu ✕", "つくえ（桌子）"]
        - ["[ふ]", "fu（輕吹氣）", "hu ✕", "ふゆ（冬天）"]
        - ["[ん]", "鼻音・不放字首", "—", "ほん（書）"]
        - ["[は]（助詞）", "[wa]", "ha ✕", "わたしは"]
        - ["[へ]（助詞）", "[e]", "he ✕", "がっこうへ"]
    examples:
      - {jp: "わたしは学生です。", kana: "わたしは がくせいです。", zh: "「は」當助詞唸 wa（不是 ha）"}
      - {jp: "学校へ行きます。", kana: "がっこうへ いきます。", zh: "「へ」當助詞唸 e（不是 he）"}
      - {jp: "ごはんを食べます。", kana: "ごはんを たべます。", zh: "「を」唸 o，只當助詞用"}
      - {jp: "つくえの上に本があります。", kana: "つくえの うえに ほんが あります。", zh: "つ＝tsu、ほん的ん是鼻音"}
    practice_note: "發音重點"
    practice:
      - {q: "「し」的羅馬拼音是？", a: "shi", note: "不是 si"}
      - {q: "「つ」的羅馬拼音是？", a: "tsu", note: "不是 tu"}
      - {q: "「わたしは」的「は」要唸成什麼？", a: "wa", note: "當助詞時變音"}
      - {q: "「がっこうへ」的「へ」要唸成什麼？", a: "e", note: "當助詞時變音"}
      - {q: "哪一個假名不能放在字首？", a: "ん"}
      - {q: "「を」現在只用在什麼場合？", a: "當助詞（發音同お）"}

  - point: "③ 促音「っ」・長音・撥音「ん」"
    source: 基礎
    key: true
    setsuzoku:
      - "**促音**：小寫的「っ」＝停頓一拍（がっこう＝ga-**k**-kou）"
      - "**長音**：母音拉長一拍（おかあさん／こうえん／片假名用「ー」）"
      - "**撥音**：「ん」自己佔一拍（ほんや＝ho-**n**-ya）"
    explain: |
      日文是「一個音一拍」的語言，這三個都**各佔一拍**，長度不對意思就會變。

      ① **促音「っ」**（小寫的つ）：不發音，但要**停頓一拍**。
      　　きて（來）→ き**っ**て（郵票）　　おと（聲音）→ お**っ**と（丈夫）
      　　⚠️ 小っ 要寫小，寫成大的「つ」意思就變了。

      ② **長音**：把母音拉長一拍。平假名用母音疊字，片假名用「**ー**」。
      　　おばさん（阿姨）→ おば**あ**さん（奶奶）　　ゆき（雪）→ ゆ**う**き（勇氣）
      　　片假名：コ**ー**ヒー（咖啡）、ケ**ー**キ（蛋糕）

      ③ **撥音「ん」**：自己就是一拍。
      　　かん（罐）是兩拍：か・ん

      💡 **拍數練習**：日文的節奏像打拍子，一個假名一拍（小寫的ゃゅょ跟前面合成一拍）。
      　　「がっこう」＝が・っ・こ・う → **四拍**
    table:
      caption: "差一拍，意思就不同（務必唸準）"
      headers: ["對照", "沒有", "有", "差別"]
      rows:
        - ["促音 [っ]", "きて（來）", "き[っ]て（郵票）", "停頓一拍"]
        - ["促音 [っ]", "おと（聲音）", "お[っ]と（丈夫）", "停頓一拍"]
        - ["長音", "おばさん（阿姨）", "おば[あ]さん（奶奶）", "拉長一拍"]
        - ["長音", "ゆき（雪）", "ゆ[う]き（勇氣）", "拉長一拍"]
        - ["長音（片假名）", "—", "コ[ー]ヒー", "用「ー」表示"]
        - ["撥音 [ん]", "か（蚊）", "か[ん]（罐）", "ん自己一拍"]
    examples:
      - {jp: "切手を三枚ください。", kana: "きってを さんまい ください。", zh: "きって（郵票）有促音，要停一拍"}
      - {jp: "おばあさんは元気です。", kana: "おばあさんは げんきです。", zh: "おばあさん（奶奶）是長音，比おばさん（阿姨）多一拍"}
      - {jp: "コーヒーを飲みませんか。", kana: "こーひーを のみませんか。", zh: "片假名的長音用「ー」"}
      - {jp: "学校へ行きます。", kana: "がっこうへ いきます。", zh: "がっこう＝が・っ・こ・う 四拍"}
    practice_note: "拍數與促音長音"
    practice:
      - {q: "「きて」和「きって」差在哪裡？意思分別是？", a: "きって多一個促音（停一拍）；きて＝來、きって＝郵票"}
      - {q: "「おばさん」和「おばあさん」差在哪？", a: "長音；おばさん＝阿姨、おばあさん＝奶奶"}
      - {q: "「がっこう」是幾拍？", a: "四拍（が・っ・こ・う）"}
      - {q: "片假名的長音用什麼符號表示？", a: "ー（長音符號）"}
      - {q: "「ん」佔幾拍？", a: "一拍"}

  - point: "④ 片假名：什麼時候用？哪些字容易搞混？"
    source: 基礎
    key: true
    explain: |
      片假名（カタカナ）的發音和平假名**完全一樣**，差別只在**用途**：

      ・**外來語**：コーヒー（咖啡）、テレビ（電視）、パソコン（電腦）
      ・**外國人名・地名**：タイワン（台灣）、リンさん（林先生）
      ・**擬聲擬態語**：ワンワン（汪汪）、ドキドキ（心跳）
      ・**強調**（像中文用粗體）：ダメ！（不行！）

      ⚠️ **最容易搞混的四組**——請特別記筆順與方向：
      　　**シ**（shi）vs **ツ**（tsu）：シ的點是**橫著排**、由**下往上**撇；ツ的點是**直著排**、由**上往下**撇
      　　**ソ**（so）vs **ン**（n）：ソ由**上往下**撇；ン由**下往上**撇
      　　**ク**（ku）vs **ワ**（wa）vs **タ**（ta）：注意第一筆的角度
      　　**ノ**（no）vs **メ**（me）vs **ヌ**（nu）：筆畫數不同

      💡 訣竅：**シ・ン 都是「下往上」，ツ・ソ 都是「上往下」**。記住這句就不會錯。
    table:
      caption: "⚠️ 容易搞混的片假名"
      headers: ["容易混淆", "念法", "怎麼分", "例字"]
      rows:
        - ["[シ] / [ツ]", "shi / tsu", "シ點橫排・[下往上]；ツ點直排・[上往下]", "シャツ（襯衫）"]
        - ["[ソ] / [ン]", "so / n", "ソ[上往下]；ン[下往上]", "ソング／パン"]
        - ["[ク] / [ワ] / [タ]", "ku / wa / ta", "看第一筆角度與封口", "クワガタ（鍬形蟲）"]
        - ["[ノ] / [メ] / [ヌ]", "no / me / nu", "筆畫數 1／2／2，方向不同", "メニュー（菜單）"]
    examples:
      - {jp: "コーヒーとケーキをください。", kana: "こーひーと けーきを ください。", zh: "外來語用片假名，長音用ー"}
      - {jp: "テレビでニュースを見ます。", kana: "てれびで にゅーすを みます。", zh: "テレビ（電視）、ニュース（新聞）"}
      - {jp: "わたしはリンです。台湾から来ました。", kana: "わたしは りんです。たいわんから きました。", zh: "外國人名用片假名"}
      - {jp: "シャツを買いました。", kana: "しゃつを かいました。", zh: "シャツ 同時有 シ 和 ツ，正好練習分辨"}
    practice_note: "片假名用途與辨別"
    practice:
      - {q: "「咖啡」的日文（片假名）怎麼寫？", a: "コーヒー"}
      - {q: "「電視」的日文（片假名）怎麼寫？", a: "テレビ"}
      - {q: "什麼情況要用片假名？（列出三種）", a: "外來語／外國人名地名／擬聲擬態語（另有強調用法）"}
      - {q: "「シ」和「ツ」怎麼分辨？", a: "シ的點橫排、由下往上撇；ツ的點直排、由上往下撇"}
      - {q: "「ソ」和「ン」怎麼分辨？", a: "ソ由上往下撇；ン由下往上撇"}
      - {q: "口訣：哪兩個是「下往上」？", a: "シ和ン"}

  - point: "⑤ 綜合練習：用學過的音拼單字"
    source: 基礎
    explain: |
      把五十音學完之後，最好的練習就是**看到假名能唸出來、聽到音能寫出來**。
      下面的單字都只用最基本的音，適合剛學完的人練。點例句可以聽發音。
    examples:
      - {jp: "わたしは がくせいです。", kana: "わたしは がくせいです。", zh: "我是學生。（は唸wa）"}
      - {jp: "これは ほんです。", kana: "これは ほんです。", zh: "這是書。"}
      - {jp: "ねこが すきです。", kana: "ねこが すきです。", zh: "我喜歡貓。"}
      - {jp: "きょうは いいてんきですね。", kana: "きょうは いいてんきですね。", zh: "今天天氣真好呢。（きょ是拗音）"}
      - {jp: "コーヒーを のみます。", kana: "こーひーを のみます。", zh: "喝咖啡。（片假名＋長音）"}
      - {jp: "がっこうへ いきます。", kana: "がっこうへ いきます。", zh: "去學校。（っ促音、へ唸e）"}
    practice_note: "唸唸看、寫寫看"
    practice:
      - {q: "「ねこ」是什麼意思？", a: "貓"}
      - {q: "「いぬ」是什麼意思？", a: "狗"}
      - {q: "「傘」的假名怎麼寫？", a: "かさ"}
      - {q: "「魚」的假名怎麼寫？", a: "さかな"}
      - {q: "「今天」的假名怎麼寫？", a: "きょう", note: "拗音（き＋小ょ）"}
      - {q: "「學校」的假名怎麼寫？", a: "がっこう", note: "濁音が＋促音っ＋長音う"}
      - {q: "「電話」的假名怎麼寫？", a: "でんわ"}
      - {q: "「醫院」的假名怎麼寫？", a: "びょういん", note: "拗音びょ＋長音う"}
      - {q: "「牛奶」的假名怎麼寫？", a: "ぎゅうにゅう", note: "兩個拗音＋兩個長音"}
      - {q: "「わたしは」的「は」唸 ha 還是 wa？", a: "wa"}

