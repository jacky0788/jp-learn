notes:
  - "⭐ 學習順序建議：清音（一天一行，一週記完）→ 濁音・半濁音 → 拗音 → 促音／長音 → 片假名。"
  - "⭐ 一定要照「行」和「段」的表格記——之後學動詞變化時，規則就是在「同一行」的五個音之間變。"
  - "⚠️ 助詞變音：「は」唸 wa、「へ」唸 e、「を」唸 o（寫法不變，只有唸法變）。"
  - "⚠️ 特殊發音：し＝shi、ち＝chi、つ＝tsu、ふ＝fu（輕吹氣）；「ん」不放字首。"
  - "⚠️ 拍數決定意思：きて（來）≠ きって（郵票）；おばさん（阿姨）≠ おばあさん（奶奶）。"
  - "⚠️ 片假名易混：シ・ン 是「下往上」，ツ・ソ 是「上往下」。"
  - "五十音圖的每一格都可以點：點格子唸該音，點下面的例字唸整個單字。"
