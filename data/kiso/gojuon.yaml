track: 基礎
topic: gojuon
order: 1
label: 五十音（從零開始）
title: 基礎｜五十音：平假名・片假名完整入門
# 來源：自學補充（2026-08-03 依使用者要求新增，給完全初學者）

intro: |
  五十音是日文的「注音符號」，所有日文都由這些音組成。學會它，日文才真正開始。

  日文有**兩套**字母，發音完全一樣，只是用途不同：
  ・**平假名（ひらがな）**：最基本，用來寫日文固有的詞和文法（例：あめ、です、ます）。
  ・**片假名（カタカナ）**：寫外來語、外國人名地名、擬聲詞（例：コーヒー、テレビ、パン）。

  下面的五十音圖是用「**行**」和「**段**」排成的表格——這個排法**非常重要**，
  因為之後學動詞變化（五段動詞）時，就是靠「同一行的五個音」在變。所以現在就照著表格記，
  未來會省下很多力氣。

  ⭐ 用法：**點任何一格會唸出那個音，點下面的例字會唸整個單字**。
  建議每天記一行（5 個音），一週就能記完清音。

goals:
  - "認得平假名 46 音，並知道對應的片假名與羅馬拼音"
  - "理解「行」與「段」的排列方式（之後學動詞變化會用到）"
  - "會唸濁音（が・ざ・だ・ば）與半濁音（ぱ）"
  - "會唸拗音（きゃ・しゅ・ちょ…）、促音（っ）、長音、撥音（ん）"
  - "分辨長得很像的片假名：シ／ツ、ソ／ン、ク／ワ"

