track: 基礎
topic: kazu-hizuke
order: 30
label: 數字・時間・日期
title: 基礎｜數字・時間・月份・日期・星期
# 來源：自學補充（常用唸法整理，紅色＝特殊/變音唸法）

intro: |
  日文的數字與日期有不少「特殊唸法」，是初學最容易卡的地方。
  本主題把 數字 → 百千萬 → 時間 → 月份 → 日期 → 星期 一次整理成表，
  紅色標出「不規則、要特別背」的唸法（如 4月＝しがつ、1日＝ついたち、300＝さんびゃく）。
  記法訣竅：規則的不用背，只背紅色的就好。

goals:
  - "唸出 0〜10000 的數字（含 300/600/800/3000/8000 變音）"
  - "唸出時刻：〜時（4時・9時特殊）與 〜分（ぷん/ふん 交替）"
  - "唸出 12 個月份（4月・7月・9月特殊）"
  - "唸出日期：1日〜10日 和語唸法＋14日・20日・24日"
  - "唸出星期 月〜日曜日"

grammar:
  - point: "① 數字 0〜10（4・7・9 有兩種唸法）"
    source: 基礎
    explain: |
      基本數字。4・7・9 各有兩種唸法，紅色是「數東西、報數字時最常用」的：
      搭配量詞・電話號碼多用 よん・なな・きゅう；月份、固定詞才用 し・しち・く。
    table:
      caption: "數字 0〜10"
      headers: ["數字", "唸法", "數字", "唸法"]
      rows:
        - ["1", "いち", "6", "ろく"]
        - ["2", "に", "7", "[なな]／しち"]
        - ["3", "さん", "8", "はち"]
        - ["4", "[よん]／し", "9", "[きゅう]／く"]
        - ["5", "ご", "10", "じゅう"]
        - ["0", "ゼロ／れい", "", ""]
    practice_note: "考點：4・7・9 的常用唸法"
    practice:
      - {q: "數東西時「4」通常唸？", a: "よん"}
      - {q: "數東西時「7」通常唸？", a: "なな"}
      - {q: "數東西時「9」通常唸？", a: "きゅう"}

  - point: "② 百・千・萬（300・600・800・3000・8000 變音）"
    source: 基礎
    explain: |
      百（ひゃく）千（せん）大致規則，但紅色這幾個會「變音」，要特別背：
      3 後面 ひゃく→びゃく、せん→ぜん；6・8 後面 ひゃく→促音＋ぴゃく；8000＝はっせん。
      「萬」一定要說 いちまん（×まん）。
    table:
      caption: "百・千・萬（紅色＝變音）"
      headers: ["數字", "唸法", "數字", "唸法"]
      rows:
        - ["100", "ひゃく", "1000", "せん"]
        - ["300", "[さんびゃく]", "3000", "[さんぜん]"]
        - ["600", "[ろっぴゃく]", "8000", "[はっせん]"]
        - ["800", "[はっぴゃく]", "10000", "[いちまん]"]
    practice_note: "考點：變音的百・千"
    practice:
      - {q: "300 的唸法？", a: "さんびゃく"}
      - {q: "600 的唸法？", a: "ろっぴゃく"}
      - {q: "800 的唸法？", a: "はっぴゃく"}
      - {q: "3000 的唸法？", a: "さんぜん"}
      - {q: "8000 的唸法？", a: "はっせん"}

  - point: "③ 時間：〜時／〜分（4時・9時、ぷん/ふん 要背）"
    source: 基礎
    explain: |
      ・〜時：基本＝數字＋じ，但 4時＝よじ（×よんじ）、7時＝しちじ、9時＝くじ（×きゅうじ）。
      ・〜分：1・3・4・6・8・10 唸【ぷん】（且 1・6・8・10 帶促音），2・5・7・9 唸 ふん。
      ・「〜半」＝〜點半（7時半）。
    table:
      caption: "時刻唸法（紅色＝特殊）"
      headers: ["時", "唸法", "分", "唸法"]
      rows:
        - ["4時", "[よ]じ", "1分", "[いっぷん]"]
        - ["7時", "[しち]じ", "3分", "さん[ぷん]"]
        - ["9時", "[く]じ", "4分", "よん[ぷん]"]
        - ["其他", "數字＋じ", "6分", "[ろっぷん]"]
        - ["〜半", "はん（7時半）", "8分", "[はっぷん]"]
        - ["", "", "10分", "[じゅっぷん]"]
        - ["", "", "2・5・7・9分", "ふん（にふん・ごふん…）"]
    practice_note: "考點：特殊時刻"
    practice:
      - {q: "4時 的唸法？", a: "よじ", note: "×よんじ"}
      - {q: "9時 的唸法？", a: "くじ", note: "×きゅうじ"}
      - {q: "6分 的唸法？", a: "ろっぷん"}
      - {q: "10分 的唸法？", a: "じゅっぷん"}

  - point: "④ 月份（4月・7月・9月 特殊）"
    source: 基礎
    explain: |
      月份＝數字＋がつ，只有三個特殊：4月＝しがつ、7月＝しちがつ、9月＝くがつ
      （剛好用的是 4・7・9 的「另一種」唸法）。
    table:
      caption: "12 個月（紅色＝特殊）"
      headers: ["月", "唸法", "月", "唸法"]
      rows:
        - ["1月", "いちがつ", "7月", "[しち]がつ"]
        - ["2月", "にがつ", "8月", "はちがつ"]
        - ["3月", "さんがつ", "9月", "[く]がつ"]
        - ["4月", "[し]がつ", "10月", "じゅうがつ"]
        - ["5月", "ごがつ", "11月", "じゅういちがつ"]
        - ["6月", "ろくがつ", "12月", "じゅうにがつ"]
    practice_note: "考點：特殊月份"
    practice:
      - {q: "4月 的唸法？", a: "しがつ", note: "×よんがつ"}
      - {q: "7月 的唸法？", a: "しちがつ"}
      - {q: "9月 的唸法？", a: "くがつ", note: "×きゅうがつ"}

  - point: "⑤ 日期（1日〜10日 和語唸法＋14・20・24日）"
    source: 基礎
    key: true
    explain: |
      1日〜10日 用「和語」唸法，整組要背；11日以後＝數字＋にち，
      但 14日・24日 的「4」要唸 よっか、20日＝はつか。
      ※「1日」當「一天」講時唸 いちにち。
    table:
      caption: "日期唸法（紅色＝要背的和語/特殊）"
      headers: ["日", "唸法", "日", "唸法"]
      rows:
        - ["1日", "[ついたち]", "6日", "[むいか]"]
        - ["2日", "[ふつか]", "7日", "[なのか]"]
        - ["3日", "[みっか]", "8日", "[ようか]"]
        - ["4日", "[よっか]", "9日", "[ここのか]"]
        - ["5日", "[いつか]", "10日", "[とおか]"]
        - ["14日", "じゅう[よっか]", "24日", "にじゅう[よっか]"]
        - ["20日", "[はつか]", "11日〜", "數字＋にち（じゅういちにち…）"]
    practice_note: "考點：和語日期"
    practice:
      - {q: "1日（一號）的唸法？", a: "ついたち"}
      - {q: "4日 的唸法？", a: "よっか"}
      - {q: "8日 的唸法？", a: "ようか", note: "和4日(よっか)區分"}
      - {q: "14日 的唸法？", a: "じゅうよっか"}
      - {q: "20日 的唸法？", a: "はつか"}

  - point: "⑥ 星期"
    source: 基礎
    explain: |
      星期＝〜曜日（ようび）。順序口訣：月火水木金土日（げつ・か・すい・もく・きん・ど・にち）。
    table:
      caption: "星期"
      headers: ["星期", "唸法", "星期", "唸法"]
      rows:
        - ["月曜日", "{{月|げつ}}ようび（一）", "金曜日", "{{金|きん}}ようび（五）"]
        - ["火曜日", "{{火|か}}ようび（二）", "土曜日", "{{土|ど}}ようび（六）"]
        - ["水曜日", "{{水|すい}}ようび（三）", "日曜日", "{{日|にち}}ようび（日）"]
        - ["木曜日", "{{木|もく}}ようび（四）", "何曜日", "{{何|なん}}ようび（星期幾）"]
    practice_note: "考點：星期唸法"
    practice:
      - {q: "星期三（水曜日）的唸法？", a: "すいようび"}
      - {q: "星期四（木曜日）的唸法？", a: "もくようび"}
      - {q: "「星期幾」（何曜日）的唸法？", a: "なんようび"}

notes:
  - "只背紅色的：4月しがつ・7月しちがつ・9月くがつ／4時よじ・9時くじ／1〜10日和語＋14・20・24日／300・600・800・3000・8000。"
  - "4・7・9 規律：數量用 よん・なな・きゅう；月份等固定詞用 し・しち・く。"
