track: 基礎
topic: godan
order: 12
label: 五段動詞（完整版）
title: 基礎｜五段動詞（第I類）完整攻略：九種語尾の全變化
# 來源：自學補充（2026-08-03 依使用者要求，把五段動詞獨立成完整教學）

intro: |
  五段動詞（第I類、五段活用動詞）是日文動詞裡**數量最多**的一類，也是初學者最容易卡關的地方。
  卡關的原因通常是：課本只給一個例子（例如「行く」），但五段動詞有**九種語尾**
  （う・く・ぐ・す・つ・ぬ・ぶ・む・る），每一種變化出來的樣子都不太一樣。

  這一課把九種語尾全部攤開來一次講清楚。掌握的關鍵只有一句話：

  ⭐ **把語尾那個音，在同一行的「あ・い・う・え・お」五段之間換來換去。**

  以「書く」為例，語尾是「く」，屬於**か行**（か・き・く・け・こ）：
  ・換成 **か**（あ段）→ 書か＋ない　＝ 書かない（不寫）
  ・換成 **き**（い段）→ 書き＋ます　＝ 書きます（寫）
  ・維持 **く**（う段）→ 書く　　　　＝ 辭書形（寫）
  ・換成 **け**（え段）→ 書け＋ば／書け ＝ 如果寫／寫！（命令）
  ・換成 **こ**（お段）→ 書こ＋う　　＝ 書こう（寫吧）

  「五段」這個名字就是這樣來的——語尾在五個段之間移動。
  只要記住這個原理，再把九種語尾各練幾個，五段動詞就通了。

goals:
  - "理解「五段」的原理：語尾在 あ・い・う・え・お 五段之間變化"
  - "認出哪些動詞是五段（含「る」結尾的假一段陷阱）"
  - "把九種語尾（う・く・ぐ・す・つ・ぬ・ぶ・む・る）都變出 ない／ます／て／た／ば／命令／意向／可能形"
  - "掌握三個必背例外：う→わ、行く→行って、ある的否定是ない"
  - "熟練て形音便的三種規則（イ音便・促音便・撥音便）"

grammar:
  - point: "① 五段動詞是什麼？——語尾在五段之間移動"
    source: 基礎
    key: true
    setsuzoku:
      - "あ段（未然形）＋ ない／れる／せる　→ 否定・被動・使役"
      - "い段（連用形）＋ ます／て／た　　→ 丁寧・接續・過去"
      - "う段（終止・連體形）＝ 辭書形　　→ 句末／接名詞"
      - "え段（假定形）＋ ば／單獨用　　　→ 假設・命令"
      - "お段（意向形）＋ う　　　　　　→ 邀約・打算"
    explain: |
      日文的五十音是「行」×「段」的表格。五段動詞變化時，**語尾會在自己那一行的五個段之間移動**。

      舉例：「書く」的語尾「く」在**か行**，か行有 か・き・く・け・こ 五個音，
      所以「書く」的變化就在這五個音之間換。**行不會變，只有段在變**——這是最重要的觀念。

      再舉一個：「飲む」的語尾「む」在**ま行**（ま・み・む・め・も），
      所以是 飲ま／飲み／飲む／飲め／飲も。完全同一個道理。

      💡 學習訣竅：遇到不會變的五段動詞時，先問自己「語尾是哪一行？」
      　　把那一行的五個音默念一次（例：ま・み・む・め・も），答案就出來了。
    table:
      caption: "五段的原理：以「書く」（か行）為例，語尾在五段之間移動"
      headers: ["段", "語尾變成", "變化後", "主要接續", "意思"]
      rows:
        - ["[あ]段（未然）", "[か]", "{{書|か}}[か]", "＋ない", "{{書|か}}かない＝不寫"]
        - ["[い]段（連用）", "[き]", "{{書|か}}[き]", "＋ます", "{{書|か}}きます＝寫"]
        - ["[う]段（終止）", "[く]", "{{書|か}}[く]", "（辭書形）", "{{書|か}}く＝寫"]
        - ["[え]段（假定）", "[け]", "{{書|か}}[け]", "＋ば／命令", "{{書|か}}けば／{{書|か}}け"]
        - ["[お]段（意向）", "[こ]", "{{書|か}}[こ]", "＋う", "{{書|か}}こう＝寫吧"]
    examples:
      - {jp: "書かない", kana: "かかない", zh: "あ段＋ない＝不寫"}
      - {jp: "書きます", kana: "かきます", zh: "い段＋ます＝寫（丁寧）"}
      - {jp: "書く", kana: "かく", zh: "う段＝辭書形（寫）"}
      - {jp: "書けば", kana: "かけば", zh: "え段＋ば＝如果寫的話"}
      - {jp: "書こう", kana: "かこう", zh: "お段＋う＝寫吧"}
      - {jp: "飲む → 飲ま・飲み・飲む・飲め・飲も", kana: "のむ → のま・のみ・のむ・のめ・のも", zh: "ま行的五段（ま・み・む・め・も）同一原理"}
    practice_note: "先確認你抓到「行不變、段在變」的原理"
    practice:
      - {q: "「話す」的語尾「す」屬於哪一行？請把該行五個音念出來。", a: "さ行：さ・し・す・せ・そ"}
      - {q: "「泳ぐ」的語尾「ぐ」屬於哪一行？", a: "が行：が・ぎ・ぐ・げ・ご"}
      - {q: "「待つ」的語尾「つ」屬於哪一行？", a: "た行：た・ち・つ・て・と", note: "注意た行是 た・ち・つ・て・と，不是た・ち・つ・て・と以外的"}
      - {q: "五段動詞變化時，改變的是「行」還是「段」？", a: "段（行不會變）"}

  - point: "② 怎麼認出五段動詞？（含最容易錯的陷阱）"
    source: 基礎
    key: true
    setsuzoku:
      - "① 語尾**不是「る」**的動詞 → 一定是五段（買う・書く・泳ぐ・話す・待つ・死ぬ・遊ぶ・飲む）"
      - "② 語尾**是「る」**，但「る」前面是 **あ段／う段／お段** → 五段（ある・作る・乗る・終わる）"
      - "③ 語尾是「る」，「る」前面是 **い段／え段** → 通常是一段（見る・食べる），**但有例外**"
    explain: |
      判別只要兩步：**先看語尾是不是「る」，是「る」再看前一個音**。

      ・不是「る」結尾 → 100% 五段，不用想。
      ・是「る」結尾 → 看「る」前面那個音：
      　　あ／う／お段（作**る**の「つく」→ く是う段）→ 五段
      　　い／え段（見**る**の「み」→ い段）→ 一段

      ⚠️ **最大陷阱：假一段動詞**
      有一群動詞「る」前面是い段或え段，看起來像一段，**實際上是五段**。這些必須背：
      　　{{帰|かえ}}る（回家）・{{走|はし}}る（跑）・{{入|はい}}る（進入）・{{要|い}}る（需要）・
      　　{{切|き}}る（切）・{{知|し}}る（知道）・{{喋|しゃべ}}る（說話）・{{減|へ}}る（減少）・
      　　{{滑|すべ}}る（滑）・{{蹴|け}}る（踢）・{{握|にぎ}}る（握）

      💡 怎麼驗證？把它變成ます形看看：
      　　帰る →「帰**り**ます」（り＝い段，中間多一個音）→ 五段 ✓
      　　見る →「見ます」（直接去る）→ 一段 ✓
    table:
      caption: "五段 vs 一段 的判別法"
      headers: ["情況", "判定", "例", "ます形"]
      rows:
        - ["語尾不是「る」", "[五段]", "{{書|か}}く・{{飲|の}}む・{{話|はな}}す", "{{書|か}}きます・{{飲|の}}みます"]
        - ["「る」前是[あ・う・お段]", "[五段]", "{{作|つく}}る・{{乗|の}}る・{{終|お}}わる", "{{作|つく}}ります・{{乗|の}}ります"]
        - ["「る」前是[い・え段]", "通常[一段]", "{{見|み}}る・{{食|た}}べる・{{起|お}}きる", "{{見|み}}ます・{{食|た}}べます"]
        - ["[⚠️ 例外]（假一段）", "其實是[五段]", "{{帰|かえ}}る・{{走|はし}}る・{{入|はい}}る・{{切|き}}る", "{{帰|かえ}}[り]ます・{{走|はし}}[り]ます"]
    examples:
      - {jp: "書く・飲む・話す・待つ", kana: "かく・のむ・はなす・まつ", zh: "語尾不是る → 五段"}
      - {jp: "作る・乗る・終わる", kana: "つくる・のる・おわる", zh: "る前是う／お段 → 五段"}
      - {jp: "見る・食べる・起きる", kana: "みる・たべる・おきる", zh: "る前是い／え段 → 一段"}
      - {jp: "帰る → 帰ります", kana: "かえる → かえります", zh: "⚠️ 假一段：る前是え段卻是五段（不是「帰ます」）"}
      - {jp: "入る → 入ります", kana: "はいる → はいります", zh: "⚠️ 假一段：る前是い段卻是五段（不是「入ます」）"}
    practice_note: "判斷是五段還是一段"
    practice:
      - {q: "「泳ぐ」是五段還是一段？為什麼？", a: "五段。語尾不是「る」"}
      - {q: "「起きる」是五段還是一段？為什麼？", a: "一段。「る」前是「き」（い段）"}
      - {q: "「乗る」是五段還是一段？為什麼？", a: "五段。「る」前是「の」（お段）"}
      - {q: "「帰る」是五段還是一段？", a: "五段（假一段例外，必背）", note: "帰ります，不是帰ます"}
      - {q: "「切る」是五段還是一段？", a: "五段（假一段例外）", note: "切ります"}
      - {q: "怎麼快速驗證一個「る」結尾的動詞是不是五段？", a: "變成ます形：中間多一個い段音（帰りますみたいに）就是五段"}
      - {q: "請列出至少 5 個「假一段」的五段動詞。", a: "帰る・走る・入る・要る・切る・知る・喋る・減る・滑る・蹴る（任舉5個）"}

