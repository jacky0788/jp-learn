  - point: "④ て形・た形：唯一要另外記的「音便」"
    source: 基礎
    key: true
    setsuzoku:
      - "【イ音便】く → いて　／　ぐ → い[で]（濁音！）"
      - "【促音便】う・つ・る → っ[て]"
      - "【撥音便】ぬ・ぶ・む → ん[で]（濁音！）"
      - "【不變】す → して"
      - "【唯一例外】行く → 行[って]（不是「行いて」）"
    explain: |
      五段動詞接「て／た」時，為了好唸會發生**音便**（發音上的變化）。這是五段動詞唯一
      「不照五段規則」的地方，也是最需要練的地方。規則只有四條＋一個例外：

      ① **イ音便**：語尾 く・ぐ → 変成「い」
      　　書く→書**いて**　／　泳ぐ→泳**いで**（ぐ的後面要**濁音** で）
      ② **促音便**：語尾 う・つ・る → 変成小「っ」
      　　買う→買**って**　／　待つ→待**って**　／　帰る→帰**って**
      ③ **撥音便**：語尾 ぬ・ぶ・む → 変成「ん」
      　　死ぬ→死**んで**　／　遊ぶ→遊**んで**　／　飲む→飲**んで**（都是**濁音** で）
      ④ **す不變**：話す→話**して**（照ます形直接接）

      ⚠️ **唯一的例外：行く → 行って**（照規則應該是「行いて」，但實際說「行って」）。

      💡 記憶口訣：
      　　「**く・ぐ → い**」「**う・つ・る → っ**」「**ぬ・ぶ・む → ん**」「**す → し**」
      　　濁音規則：**ぐ・ぬ・ぶ・む 後面接「で」**，其餘接「て」。

      た形（過去形）和て形**完全同規則**，只是把て換成た、で換成だ：
      　　書いて→書い**た**　／　飲んで→飲ん**だ**　／　待って→待っ**た**
    table:
      caption: "⭐ て形音便四規則＋一例外（た形同規則，て→た、で→だ）"
      headers: ["規則", "語尾", "變成", "例（て形）", "例（た形）"]
      rows:
        - ["イ音便", "[く]", "[いて]", "{{書|か}}く→{{書|か}}[いて]", "{{書|か}}[いた]"]
        - ["イ音便（濁）", "[ぐ]", "[いで]", "{{泳|およ}}ぐ→{{泳|およ}}[いで]", "{{泳|およ}}[いだ]"]
        - ["促音便", "[う]", "[って]", "{{買|か}}う→{{買|か}}[って]", "{{買|か}}[った]"]
        - ["促音便", "[つ]", "[って]", "{{待|ま}}つ→{{待|ま}}[って]", "{{待|ま}}[った]"]
        - ["促音便", "[る]", "[って]", "{{帰|かえ}}る→{{帰|かえ}}[って]", "{{帰|かえ}}[った]"]
        - ["撥音便（濁）", "[ぬ]", "[んで]", "{{死|し}}ぬ→{{死|し}}[んで]", "{{死|し}}[んだ]"]
        - ["撥音便（濁）", "[ぶ]", "[んで]", "{{遊|あそ}}ぶ→{{遊|あそ}}[んで]", "{{遊|あそ}}[んだ]"]
