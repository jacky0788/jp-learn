notes:
  - "⭐ 核心觀念：五段變化時「行不變、段在變」。不會變時就把該行的五個音默念一遍（例：ま・み・む・め・も）。"
  - "⚠️ 三個必背例外：①う結尾的ない形用「わ」（買わない）②行く的て形是「行って」③ある的否定是「ない」。"
  - "⚠️ 假一段陷阱（る前是い／え段卻是五段）：帰る・走る・入る・要る・切る・知る・喋る・減る・滑る・蹴る。驗證法＝變ます形看中間有沒有多一個い段音。"
  - "音便口訣：く・ぐ→い／う・つ・る→っ／ぬ・ぶ・む→ん／す不變；ぐ・ぬ・ぶ・む 後面接濁音「で」。"
  - "命令形・假定形・可能形都用「え段」，差別在後面：書け（命令）／書けば（假定）／書ける（可能）。"
  - "可能形變出來之後屬於一段動詞，之後照一段規則變化（書ける→書けない・書けます）。"
  - "更完整的音便說明見「て形／た形音便」主題；三類動詞的總覽見「動詞變化」主題。"
