  - point: "⑤ ない形（未然形）：否定・被動・使役都靠它"
    source: 基礎
    setsuzoku:
      - "語尾 → **あ段** ＋ ない（書く→書か＋ない）"
      - "⚠️ 語尾「う」→ **わ**＋ない（買う→買わない，不是「買あない」）"
      - "＋れる＝被動（書かれる）／＋せる＝使役（書かせる）"
    explain: |
      把語尾換成**あ段**再接「ない」，就是否定形。這個「あ段」的形式（未然形）
      也是被動形、使役形的基礎，所以很重要。

      ⚠️ **唯一的例外：語尾「う」**
      照規則「買う」的あ段應該是「買あ」，但實際上是「買**わ**ない」。
      所有う結尾的動詞都一樣：会う→会わない、使う→使わない、言う→言わない。

      ⚠️ **另一個必記：「ある」的否定不是「あらない」，而是「ない」。**
      　　（例：お金がある → お金が**ない**）
    table:
      caption: "ない形：語尾→あ段＋ない（注意う→わ）"
      headers: ["語尾", "辭書形", "ない形", "被動（れる）", "使役（せる）"]
      rows:
        - ["[う]", "{{買|か}}う", "{{買|か}}[わ]ない", "{{買|か}}[わ]れる", "{{買|か}}[わ]せる"]
        - ["く", "{{書|か}}く", "{{書|か}}かない", "{{書|か}}かれる", "{{書|か}}かせる"]
        - ["す", "{{話|はな}}す", "{{話|はな}}さない", "{{話|はな}}される", "{{話|はな}}させる"]
        - ["つ", "{{待|ま}}つ", "{{待|ま}}たない", "{{待|ま}}たれる", "{{待|ま}}たせる"]
        - ["む", "{{飲|の}}む", "{{飲|の}}まない", "{{飲|の}}まれる", "{{飲|の}}ませる"]
        - ["る", "{{帰|かえ}}る", "{{帰|かえ}}らない", "{{帰|かえ}}られる", "{{帰|かえ}}らせる"]
        - ["[⚠️例外]", "ある", "[ない]", "—", "—"]
    examples:
      - {jp: "今日はコーヒーを買わないつもりです。", kana: "きょうは こーひーを かわない つもりです。", zh: "う→わない（例外）"}
      - {jp: "レポートをまだ書かないんです。", kana: "れぽーとを まだ かかないんです。", zh: "く→かない"}
      - {jp: "だれにも話さないでください。", kana: "だれにも はなさないで ください。", zh: "す→さない"}
      - {jp: "お酒を飲まないほうがいいですよ。", kana: "おさけを のまないほうが いいですよ。", zh: "む→まない"}
      - {jp: "今日は帰らないで、会社に泊まります。", kana: "きょうは かえらないで、かいしゃに とまります。", zh: "る→らない"}
      - {jp: "時間がないから、急ぎましょう。", kana: "じかんが ないから、いそぎましょう。", zh: "⚠️ ある的否定＝ない"}
    practice_note: "ない形（特別注意う結尾）"
    practice:
      - {q: "会う →（ない形）", a: "会わない", note: "⚠️ う→わ"}
      - {q: "使う →（ない形）", a: "使わない", note: "⚠️ う→わ"}
      - {q: "言う →（ない形）", a: "言わない", note: "⚠️ う→わ"}
      - {q: "急ぐ →（ない形）", a: "急がない"}
      - {q: "持つ →（ない形）", a: "持たない"}
      - {q: "読む →（ない形）", a: "読まない"}
      - {q: "走る →（ない形）", a: "走らない", note: "假一段但是五段"}
      - {q: "ある →（否定）", a: "ない", note: "⚠️ 不是「あらない」"}
      - {q: "書く →（被動形）", a: "書かれる", note: "未然形＋れる"}
      - {q: "飲む →（使役形）", a: "飲ませる", note: "未然形＋せる"}

  - point: "⑥ 命令形・意向形・假定形・可能形"
    source: 基礎
    setsuzoku:
      - "命令形：語尾 → **え段**（書く→書け）"
      - "假定形：語尾 → **え段**＋ば（書く→書けば）"
      - "意向形：語尾 → **お段**＋う（書く→書こう）"
      - "可能形：語尾 → **え段**＋る（書く→書ける）※變成一段動詞"
    explain: |
      這四個都很規律，記住對應的「段」就好：

      ・**命令形＝え段**（書け！）→ 語氣強烈，見第25課
      ・**假定形＝え段＋ば**（書けば）→ 如果…的話
      ・**意向形＝お段＋う**（書こう）→ …吧（邀約／打算）
      ・**可能形＝え段＋る**（書ける）→ 會…、能…

      💡 注意：**命令形和假定形、可能形都用「え段」**，差別只在後面接什麼：
      　　書け（命令）／書け**ば**（假定）／書け**る**（可能）——三個長很像，別搞混。

      💡 可能形變出來之後，它就變成**一段動詞**了：
      　　書ける → 書けない・書けます・書けれ**ば**（照一段規則變化）
    table:
      caption: "命令・假定・意向・可能：記住對應的段"
      headers: ["活用", "用哪一段", "書く", "飲む", "帰る", "意思"]
      rows:
        - ["命令形", "[え]段", "{{書|か}}[け]", "{{飲|の}}[め]", "{{帰|かえ}}[れ]", "寫！／喝！／回去！"]
        - ["假定形", "[え]段＋ば", "{{書|か}}[け]ば", "{{飲|の}}[め]ば", "{{帰|かえ}}[れ]ば", "如果寫的話"]
        - ["可能形", "[え]段＋る", "{{書|か}}[け]る", "{{飲|の}}[め]る", "{{帰|かえ}}[れ]る", "會寫／能喝"]
        - ["意向形", "[お]段＋う", "{{書|か}}[こ]う", "{{飲|の}}[も]う", "{{帰|かえ}}[ろ]う", "寫吧／喝吧"]
    examples:
      - {jp: "早く書け！", kana: "はやく かけ！", zh: "命令形（語氣強烈）"}
      - {jp: "毎日練習すれば、上手になりますよ。", kana: "まいにち れんしゅうすれば、じょうずに なりますよ。", zh: "假定形＋ば＝如果…的話"}
      - {jp: "この漢字が書けるようになりました。", kana: "この かんじが かけるように なりました。", zh: "可能形＝變得會寫了"}
      - {jp: "そろそろ帰ろう。", kana: "そろそろ かえろう。", zh: "意向形＝回去吧"}
      - {jp: "お酒が飲めますか。", kana: "おさけが のめますか。", zh: "可能形＋ます（可能形是一段動詞）"}
      - {jp: "急げば間に合うと思います。", kana: "いそげば まにあうと おもいます。", zh: "假定形＝如果快一點的話"}
    practice_note: "四種活用（注意命令・假定・可能都用え段）"
    practice:
      - {q: "飲む →（命令形）", a: "飲め"}
      - {q: "待つ →（命令形）", a: "待て"}
      - {q: "走る →（命令形）", a: "走れ"}
      - {q: "書く →（假定形ば）", a: "書けば"}
      - {q: "泳ぐ →（假定形ば）", a: "泳げば"}
      - {q: "話す →（可能形）", a: "話せる"}
      - {q: "買う →（可能形）", a: "買える"}
      - {q: "行く →（可能形）", a: "行ける"}
      - {q: "飲む →（意向形）", a: "飲もう"}
      - {q: "帰る →（意向形）", a: "帰ろう"}
      - {q: "急ぐ →（意向形）", a: "急ごう"}
      - {q: "（辨別）「書け」「書けば」「書ける」分別是什麼形？", a: "命令形／假定形／可能形", note: "三個都用え段，差在後面接什麼"}
      - {q: "可能形「書ける」變成否定要怎麼說？", a: "書けない", note: "可能形是一段動詞，去る＋ない"}

  - point: "⑦ 綜合練習：同一個動詞變出全部形"
    source: 基礎
    explain: |
      最後把整套走一遍。建議做法：拿一個動詞，**照順序念出**
      「ない形 → ます形 → 辭書形 → て形 → た形 → ば形 → 命令形 → 意向形 → 可能形」，
      能一口氣念完就代表這個語尾你已經掌握了。
    examples:
      - {jp: "書かない・書きます・書く・書いて・書いた・書けば・書け・書こう・書ける", kana: "かかない・かきます・かく・かいて・かいた・かけば・かけ・かこう・かける", zh: "「書く」全套（く結尾）"}
      - {jp: "飲まない・飲みます・飲む・飲んで・飲んだ・飲めば・飲め・飲もう・飲める", kana: "のまない・のみます・のむ・のんで・のんだ・のめば・のめ・のもう・のめる", zh: "「飲む」全套（む結尾）"}
      - {jp: "買わない・買います・買う・買って・買った・買えば・買え・買おう・買える", kana: "かわない・かいます・かう・かって・かった・かえば・かえ・かおう・かえる", zh: "「買う」全套（う結尾・注意わ）"}
    practice_note: "綜合：把指定動詞變出全部形（先自己念一次再看答案）"
    practice:
      - {q: "「話す」全套：ない形／ます形／て形／た形／ば形／命令形／意向形／可能形", a: "話さない／話します／話して／話した／話せば／話せ／話そう／話せる"}
      - {q: "「待つ」全套：ない形／ます形／て形／た形／ば形／命令形／意向形／可能形", a: "待たない／待ちます／待って／待った／待てば／待て／待とう／待てる"}
      - {q: "「遊ぶ」全套：ない形／ます形／て形／た形／ば形／命令形／意向形／可能形", a: "遊ばない／遊びます／遊んで／遊んだ／遊べば／遊べ／遊ぼう／遊べる"}
      - {q: "「泳ぐ」全套：ない形／ます形／て形／た形／ば形／命令形／意向形／可能形", a: "泳がない／泳ぎます／泳いで／泳いだ／泳げば／泳げ／泳ごう／泳げる"}
      - {q: "「帰る」全套：ない形／ます形／て形／た形／ば形／命令形／意向形／可能形", a: "帰らない／帰ります／帰って／帰った／帰れば／帰れ／帰ろう／帰れる"}
      - {q: "「行く」全套（注意て形例外）", a: "行かない／行きます／行って／行った／行けば／行け／行こう／行ける", note: "⚠️ て形是行って不是行いて"}
      - {q: "（造句）用「飲む」的て形說「請喝這個藥」", a: "この薬を飲んでください。"}
      - {q: "（造句）用「待つ」的て形說「請等一下」", a: "ちょっと待ってください。"}
      - {q: "（造句）用「帰る」的意向形說「差不多該回去了吧」", a: "そろそろ帰ろう。"}
      - {q: "（造句）用「書く」的可能形說「我變得會寫漢字了」", a: "漢字が書けるようになりました。"}

