<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日文複習</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b3a55">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日文複習">
<link rel="stylesheet" href="style.css?v=ecbed035">
</head>
<body>
<header>
  <button id="settings-toggle" title="設定" aria-label="設定">⚙️</button>
  <h1>日文複習</h1>
  <nav>
    <button data-tab="intro" class="active">說明</button>
    <button data-tab="cards">單字卡</button>
    <button data-tab="grammar">文法</button>
    <button data-tab="quiz">測驗</button>
    <button data-tab="read">📖 文章</button>
  </nav>
</header>

<section id="lesson-picker">
  <input type="search" id="lesson-search" placeholder="🔍 搜尋主題／文法／單字…" autocomplete="off">
  <span id="lesson-checks"></span>
</section>
<button id="side-toggle" aria-label="收合/展開選單"></button>

<main>
  <div id="intro" class="tab active"></div>
  <div id="cards" class="tab"></div>
  <div id="grammar" class="tab"></div>
  <div id="quiz" class="tab"></div>
  <div id="read" class="tab"></div>
</main>

<div id="settings-panel" class="hidden">
  <div class="settings-box">
    <div class="settings-head"><h3>設定</h3><button id="set-close" aria-label="關閉">✕</button></div>

    <div class="set-section">外觀</div>
    <label class="set-row"><span>深色模式</span><input type="checkbox" id="set-dark"></label>
    <label class="set-row"><span>極簡模式（只顯示文法課・會話課）</span><input type="checkbox" id="set-minimal"></label>
    <label class="set-row"><span>字體大小</span><span class="fontsize-ctrl"><input type="range" id="set-fontsize-range" min="70" max="200" step="5" value="100"><input type="number" id="set-fontsize-num" min="70" max="200" step="5" value="100"><span class="unit">%</span></span></label>
    <label class="set-row"><span>假名顯示方式</span><select id="set-kana"><option value="line">整句假名在下（預設）</option><option value="ruby">漢字上方注音（ふりがな）</option><option value="off">不顯示假名</option></select></label>
    <div class="set-note">此設定<b>統一控制全站假名</b>（例句、單字、文章、圖解表格）。目前所有日文句子的漢字都已標上注音（覆蓋率 100%）。測驗頁與單字卡正面一律不顯示，以免洩題。</div>

    <div class="set-section">練習份量</div>
    <label class="set-row"><span>測驗每輪題數</span><select id="set-quizlen"><option value="10">10 題</option><option value="20">20 題</option><option value="30">30 題</option><option value="50">50 題</option><option value="0">全部</option></select></label>
    <label class="set-row"><span>單字卡每輪張數</span><select id="set-cardlen"><option value="10">10 張</option><option value="20">20 張</option><option value="30">30 張</option><option value="50">50 張</option><option value="0">全部</option></select></label>
    <div class="set-note">分批練習比較容易完成。單字卡會<b>優先給還不熟的</b>；測驗做完會顯示答對率，並可<b>只重做錯的題目</b>。</div>

    <div class="set-section">其他</div>
    <label class="set-row"><span>內容更新紀錄</span><button class="btn-next" id="log-open">📋 開啟工作日誌</button></label>

    <div class="set-section">語音</div>
    <label class="set-row"><span>日語語音</span><select id="set-voice"><option value="">自動（挑最佳）</option></select></label>
    <div class="set-hint" id="voice-now"></div>
    <div class="set-note">📱 <b>iPhone／iPad</b>：因 Apple 政策限制，無法使用較佳語音，只能用基本的 <b>Kyoko</b>。<br>💻 <b>電腦／Android</b>：會自動使用較佳語音。</div>
    <label class="set-row"><span>音量</span><input type="range" id="set-volume" min="0" max="100" step="5" value="100"></label>

    <div class="set-section">單字自動播放</div>
    <label class="set-row"><span>每個單字播放次數</span><input type="number" id="set-repeats" min="1" max="10" step="1" value="3"></label>
    <label class="set-row"><span>每次發音的間隔（秒）</span><input type="number" id="set-repeat-gap" min="0" max="10" step="0.5" value="0.8"></label>
    <label class="set-row"><span>換下一個單字前等待（秒）</span><input type="number" id="set-gap" min="1" max="30" step="1" value="4"></label>
    <label class="set-row"><span>語速</span><input type="range" id="set-rate" min="0.3" max="2" step="0.1" value="0.9"></label>
  </div>
</div>

<div id="log-panel" class="hidden">
  <div class="settings-box">
    <div class="settings-head"><h3>📋 工作日誌</h3><button id="log-close" aria-label="關閉">✕</button></div>
    <div id="log-body" class="log-body"></div>
  </div>
</div>

<script src="data.js?v=ecbed035"></script>
<script src="app.js?v=ecbed035"></script>
</body>
</html>
